<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gawain 4 | PABASA</title>
  <style>
    :root{--ink:#16465d;--blue:#1f6f8b;--gold:#e6a33a;--paper:#fffdf7;--line:#bfdde4;--success:#21785f;--error:#a63b3b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#e1f5f7,#fff3d8);color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(820px,calc(100% - 28px));margin:auto;padding:20px 0 38px}.back{display:inline-flex;padding:11px 15px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:900;text-decoration:none}.card{margin-top:18px;padding:clamp(22px,5vw,42px);border-radius:30px;background:var(--paper);box-shadow:0 20px 54px #2d697326;text-align:center}.eyebrow{margin:0;color:#997124;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.card h1{margin:.3rem 0 .65rem;font-size:clamp(2rem,5vw,3rem);line-height:1.08}.instruction{margin:0 auto 18px;max-width:590px;color:#526e78;font-size:1.08rem;font-weight:700;line-height:1.45}.support{margin:0 auto 24px;color:#526e78;font-weight:800}.button{min-height:54px;padding:12px 22px;border:0;border-radius:16px;background:var(--blue);box-shadow:0 5px 0 #155369;color:#fff;font:900 1rem Nunito,"Segoe UI",sans-serif;cursor:pointer}.button.gold{background:var(--gold);box-shadow:0 5px 0 #be7c22}.button.help{background:#fff;border:2px solid var(--line);box-shadow:none;color:var(--ink);min-height:46px}.button.help:focus-visible{outline:4px solid #d7eff4;outline-offset:2px}.button:disabled{opacity:.62;cursor:wait}.count{font-weight:900}.track{height:12px;margin:12px auto 25px;max-width:620px;overflow:hidden;border-radius:999px;background:#dcebed}.track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),#f6cb55)}.item-panel{display:grid;gap:20px;justify-items:center}.image-frame{display:grid;place-items:center;width:min(330px,80vw);height:min(260px,52vw);padding:10px;border:2px solid #dbecef;border-radius:22px;background:#f5fbfa}.image-frame img{display:block;width:100%;height:100%;object-fit:contain}.word-help{min-height:1.5em;margin:0;color:var(--ink);font-size:1.08rem;font-weight:900}.letter-form{display:grid;gap:18px;justify-items:center;width:100%}.letter-boxes{display:flex;flex-wrap:wrap;gap:clamp(6px,1.8vw,12px);justify-content:center}.letter-box{width:clamp(42px,10vw,58px);height:clamp(48px,11vw,64px);border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:900 clamp(1.35rem,5vw,1.9rem) Nunito,"Segoe UI",sans-serif;text-align:center;text-transform:uppercase}.letter-box:focus-visible{border-color:var(--blue);outline:4px solid #d7eff4;outline-offset:2px}.letter-box:disabled{background:#edf8f1;border-color:#8ec9b6;color:var(--success)}.feedback{min-height:1.55em;margin:0;font-weight:900}.feedback.success{color:var(--success)}.feedback.error{color:var(--error)}.completion{padding:18px}.completion .star{font-size:3rem}.summary{margin:18px auto;padding:14px;border:2px solid #c9e2d3;border-radius:16px;max-width:360px;background:#effbf3;font-weight:900}@media(max-width:560px){.page{width:calc(100% - 18px);padding-top:10px}.card{border-radius:23px}.image-frame{height:220px}.letter-boxes{gap:7px}.letter-box{width:48px;height:56px}}
  </style>
</head>
<body>
  <main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card" data-activity-key="session-6-lesson-16-gawain-4" aria-live="polite"></section></main>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script>
  (() => {
    'use strict';
    const data = JSON.parse(document.getElementById('prescribed-activity-data').textContent || '{}');
    const app = document.querySelector('[data-activity-key]');
    const items = Array.isArray(data.items) ? data.items : [];
    const escape = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const csrf = () => ((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/) || [])[1] || '');
    const normalize = value => String(value || '').normalize('NFC').trim().toLocaleLowerCase('fil-PH');
    let index = Math.max(0, Math.min(items.length, Number(data.progress?.completed_items) || 0));
    let attempts = Math.max(0, Number(data.progress?.state?.write_attempts) || 0);
    let stateVersion = Math.max(0, Number(data.progress?.state?.state_version) || 0);
    let busy = false, locked = false, lockedAnswer = '', startedAt = Date.now();

    const state = () => ({write_attempts: attempts, state_version: ++stateVersion});
    const heading = progress => { const current = locked ? index : Math.min(index + 1, items.length); const percent = index >= items.length ? 80 : (items.length ? index / items.length * 100 : 0); return `<p class="eyebrow">Session 6 · Lesson 16 · Gawain 4</p><h1>${escape(data.display_title || 'Lesson 16: Gawain 4')}</h1><p class="instruction">${escape(data.instruction)}</p>${progress ? `<div class="count">${current} / ${items.length}</div><div class="track" aria-label="${index} sa ${items.length} ang natapos"><i style="width:${percent}%"></i></div>` : ''}`; };
    const request = async (url, body) => {
      const response = await fetch(url, {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json','X-CSRFToken':csrf()}, body:JSON.stringify(body)});
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success) throw Error(result.error || 'Hindi na-save ang iyong sagot.');
      return result;
    };
    const save = candidate => request(data.progress_url, {material_id:data.material_id, candidate_answer:candidate, state:state()});
    function renderIntro() {
      app.innerHTML = `${heading(false)}<p class="support">Tingnan ang larawan at buuin ang tamang salita.</p><button class="button gold" type="button" data-action="start">Simulan</button>`;
      app.querySelector('[data-action="start"]').addEventListener('click', () => { locked = false; renderItem(); });
    }
    function renderItem(message = '', kind = '') {
      if (!items.length) { app.innerHTML = '<p class="feedback error">Walang laman ang gawaing ito.</p>'; return; }
      if (index >= items.length) { renderReady(message, kind); return; }
      const itemIndex = locked ? index - 1 : index;
      const item = items[itemIndex], count = Number(item.character_count) || 0;
      const boxes = Array.from({length:count}, (_, letterIndex) => `<input class="letter-box" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="1" value="${locked ? escape((lockedAnswer[letterIndex] || '').toLocaleUpperCase('fil-PH')) : ''}" aria-label="Titik ${letterIndex + 1} ng ${count}" data-activity-key="${escape(data.activity_key)}" data-item-index="${itemIndex}" data-letter-index="${letterIndex}" ${locked ? 'disabled' : ''}>`).join('');
      app.innerHTML = heading(true) + `<section class="item-panel"><div class="image-frame"><img src="${escape(item.image_url)}" alt="${escape(item.alt_text)}"></div>${locked ? '' : '<button class="button help" type="button" data-action="play-word" aria-describedby="word-help">I-click para malaman ang word na ito</button>'}<p id="word-help" class="word-help" role="status"></p><form class="letter-form" data-letter-form><div class="letter-boxes" role="group" aria-label="Isulat ang salita, ${count} titik">${boxes}</div>${locked ? '<button class="button gold" type="button" data-action="next">Susunod</button>' : '<button class="button" type="submit">Suriin</button>'}</form><p class="feedback ${kind}" role="status" data-feedback>${escape(message)}</p></section>`;
      const form = app.querySelector('[data-letter-form]');
      const inputs = [...form.querySelectorAll('[data-letter-index]')];
      if (locked) { form.querySelector('[data-action="next"]').addEventListener('click', () => { locked = false; lockedAnswer = ''; renderItem(); }); return; }
      app.querySelector('[data-action="play-word"]').addEventListener('click', () => playWord(item));
      const focus = position => inputs[Math.max(0, Math.min(inputs.length - 1, position))]?.focus();
      inputs.forEach((input, position) => {
        input.addEventListener('input', () => { input.value = input.value.slice(-1).toLocaleUpperCase('fil-PH'); if (input.value && position < inputs.length - 1) focus(position + 1); });
        input.addEventListener('keydown', event => { if (event.key === 'Backspace' && !input.value && position) { event.preventDefault(); focus(position - 1); } if (event.key === 'ArrowLeft' && position) { event.preventDefault(); focus(position - 1); } if (event.key === 'ArrowRight' && position < inputs.length - 1) { event.preventDefault(); focus(position + 1); } });
        input.addEventListener('paste', event => { event.preventDefault(); const characters = normalize(event.clipboardData?.getData('text')).replace(/\s+/g, '').slice(0, inputs.length - position).split(''); characters.forEach((character, offset) => { inputs[position + offset].value = character.toLocaleUpperCase('fil-PH'); }); focus(Math.min(inputs.length - 1, position + characters.length)); });
      });
      form.addEventListener('submit', event => { event.preventDefault(); submit(inputs.map(input => input.value).join('')); });
      focus(0);
    }
    function playWord(item) {
      const status = app.querySelector('#word-help');
      status.textContent = 'Makinig nang mabuti sa salita.';
      if (item.audio_url) {
        const audio = new Audio(item.audio_url);
        audio.play().catch(() => { status.textContent = 'Hindi ma-play ang audio. Subukan muli.'; });
        return;
      }
      if (!window.speechSynthesis) { status.textContent = 'Hindi available ang audio sa browser na ito.'; return; }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(String(item.tts_word || ''));
      utterance.lang = 'fil-PH';
      utterance.rate = .78;
      window.speechSynthesis.speak(utterance);
    }
    async function submit(value) {
      if (busy) return;
      const answer = normalize(value), feedback = app.querySelector('[data-feedback]');
      if (!answer || answer.length !== Number(items[index].character_count)) { feedback.textContent = 'Kumpletuhin muna ang lahat ng kahon.'; feedback.className = 'feedback error'; return; }
      busy = true; attempts += 1; feedback.textContent = 'Sinusuri ang sagot…'; feedback.className = 'feedback';
      try {
        const result = await save(answer);
        stateVersion = Math.max(stateVersion, Number(result.progress?.state?.state_version) || 0);
        if (result.accepted) { index = Number(result.progress.current_index) || index + 1; lockedAnswer = answer; locked = true; renderItem('Tama! Magaling!', 'success'); return; }
        feedback.textContent = 'Subukan muli.'; feedback.className = 'feedback error';
      } catch (error) { feedback.textContent = error.message; feedback.className = 'feedback error'; }
      finally { busy = false; }
    }
    function renderReady(message = '', kind = '') {
      app.innerHTML = heading(true) + `<p class="support">Kumpleto na ang limang salita. Handa ka nang tapusin ang gawain.</p><button class="button gold" type="button" data-action="complete">Tapusin ang Gawain</button><p class="feedback ${kind}" role="status" data-feedback>${escape(message)}</p>`;
      app.querySelector('[data-action="complete"]').addEventListener('click', complete);
    }
    async function complete() {
      if (busy) return;
      busy = true; app.innerHTML = heading(true) + '<p class="support">Itinatala ang iyong natapos na gawain…</p>';
      try { await request(data.completion_url, {material_id:data.material_id, duration_seconds:Math.max(1, Math.round((Date.now() - startedAt) / 1000))}); showDone(); }
      catch (error) { busy = false; renderReady(error.message, 'error'); }
    }
    function showDone() { app.innerHTML = `<div class="completion"><div class="star">⭐</div><h1>Tapos na ang Gawain 4!</h1><p class="instruction">Mahusay! Natapos mo ang pagsulat ng wastong salita para sa bawat larawan.</p><div class="summary">5 / 5 na larawan ang natapos</div><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`; busy = false; }
    if (data.progress?.activity_completed) showDone(); else if (index) renderItem(); else renderIntro();
  })();
  </script>
</body>
</html>
