<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lesson 16: Gawain 4 | PABASA</title>
  <style>
    :root{--ink:#16465d;--blue:#1f6f8b;--gold:#e6a33a;--paper:#fffdf7;--line:#bfdde4;--green:#26794d;--red:#9a3434}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#e1f5f7,#fff3d8);color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(880px,calc(100% - 28px));margin:auto;padding:20px 0 38px}.back{display:inline-flex;padding:11px 15px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:900;text-decoration:none}.card{margin-top:18px;padding:clamp(22px,4vw,38px);border-radius:30px;background:var(--paper);box-shadow:0 20px 54px #2d697326;text-align:center}.eyebrow{margin:0;color:#997124;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}h1{margin:.3rem 0 .65rem;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.1}.instruction,.hint{margin:0 auto;color:#526e78;font-weight:700;line-height:1.45}.instruction{max-width:620px;font-size:1.08rem}.hint{min-height:1.45em;margin-top:14px}.track{height:12px;margin:13px auto 24px;max-width:620px;overflow:hidden;border-radius:999px;background:#dcebed}.track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),#f6cb55)}.count{margin-top:15px;font-weight:900}.image-wrap{display:grid;place-items:center;min-height:240px;margin:12px auto 14px}.image{display:block;width:min(390px,100%);height:min(310px,48vw);object-fit:contain}.button{min-height:52px;padding:12px 22px;border:0;border-radius:16px;background:var(--blue);box-shadow:0 5px 0 #155369;color:#fff;font:900 1rem inherit;cursor:pointer}.button:hover,.button:focus-visible{background:#175d75}.button:focus-visible,input:focus-visible{outline:3px solid #e6a33a;outline-offset:3px}.button:disabled{opacity:.62;cursor:wait}.intro-copy{max-width:580px;margin:0 auto 22px;color:#526e78;font-size:1.05rem;font-weight:700}.writing{margin:4px auto 0;max-width:500px}.boxes{display:flex;justify-content:center;gap:7px;margin:0 auto 14px}.box{display:grid;place-items:center;width:clamp(40px,9vw,54px);height:clamp(47px,10vw,60px);border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);font-size:clamp(1.15rem,4vw,1.65rem);font-weight:900;text-transform:uppercase}.answer-form{display:flex;gap:10px;justify-content:center;align-items:center}.answer-input{width:min(100%,260px);min-height:52px;padding:10px 13px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:800 1.12rem inherit;text-align:center}.audio-help{margin:0 0 8px;color:#526e78;font-size:.9rem;font-weight:700}.listen{margin-top:0;background:#e6a33a;box-shadow:0 5px 0 #be7c22}.listen:hover,.listen:focus-visible{background:#d79024}.feedback.correct{color:var(--green)}.feedback.error{color:var(--red)}.complete-icon{color:var(--green);font-size:3.2rem;font-weight:900}.competencies{display:flex;flex-wrap:wrap;justify-content:center;gap:.45rem;margin:16px 0}.competencies span{padding:.3rem .6rem;border:1px solid #bddae1;border-radius:999px;background:#fff;color:#526e78;font-size:.78rem;font-weight:800}@media(max-width:560px){.page{width:calc(100% - 18px);padding-top:10px}.card{border-radius:23px}.image-wrap{min-height:190px}.image{height:220px}.answer-form{flex-direction:column}.answer-input,.answer-form .button{width:100%}.boxes{gap:5px}.box{width:42px;height:50px}}
  </style>
</head>
<body>
  <main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card" data-activity-key="session-6-lesson-16-gawain-4" aria-live="polite"></section></main>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script>
  (() => {'use strict';
    const data=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'), app=document.getElementById('app'), items=Array.isArray(data.items)?data.items:[];
    const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||'');
    let answers=Array.isArray(data.progress?.answers)?data.progress.answers.slice(0,items.length):[], state={...(data.progress?.state||{})}, busy=false, feedback='', savedCorrect=false;
    const version=()=>{state.state_version=Math.max(0,Number(state.state_version)||0)+1;return {...state,started:true};};
    const request=async(url,body)=>{const response=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(body)}),result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw Error(result.error||'Hindi na-save ang iyong sagot.');return result;};
    const header=()=>`<p class="eyebrow">Session 6 · Lesson 16 · Gawain 4</p><h1>${escape(data.title)}</h1><p class="instruction">${escape(data.instruction)}</p>`;
    const progress=()=>`<div class="count">${Math.min(answers.length+1,items.length)} / ${items.length}</div><div class="track" aria-label="${answers.length} sa ${items.length} ang natapos"><i style="width:${items.length?answers.length/items.length*100:0}%"></i></div>`;
    const speak=()=>{if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){feedback='Hindi available ang Read Aloud sa browser na ito.';render();return;}const utterance=new SpeechSynthesisUtterance(items[answers.length]?.read_aloud||'');window.speechSynthesis.cancel();utterance.lang='fil-PH';utterance.rate=.82;utterance.onstart=()=>{feedback='Pinakikinggan ang salita…';render();};utterance.onend=()=>{feedback='Maaari mo nang isulat ang salita.';render();};window.speechSynthesis.speak(utterance);};
    async function save(candidate){if(busy)return;busy=true;try{const result=await request(data.progress_url,{candidate_answer:candidate,state:version()});state={...(result.progress?.state||state)};if(result.accepted){answers=result.progress.answers||answers;savedCorrect=true;feedback='Tama! Magaling!';}else{feedback='Subukan muli. Maaari mong pakinggan ang salita kung kailangan.';}render();}catch(error){feedback=error.message;render();}finally{busy=false;}}
    function render(){if(!items.length){app.innerHTML='<p class="feedback error">Walang laman ang gawaing ito.</p>';return;}if(data.progress?.activity_completed){done();return;}if(!state.started&&!answers.length){app.innerHTML=header()+`<div class="competencies">${(data.competencies||[]).map(x=>`<span>${escape(x)}</span>`).join('')}</div><p class="intro-copy">Tingnan ang bawat larawan at i-type ang salitang inilalarawan nito.</p><button class="button" id="start" type="button">SIMULAN</button>`;app.querySelector('#start').onclick=()=>{state.started=true;render()};return;}if(answers.length>=items.length){finish();return;}const item=items[answers.length],letters=Number(item.letter_count)||0, speaker='<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 10v4h4l5 4V6l-5 4H3zm11.5 2A3.5 3.5 0 0 0 13 9.1v5.8a3.5 3.5 0 0 0 1.5-2.9zm0-7.1v2.1a5.5 5.5 0 0 1 0 10v2.1a7.5 7.5 0 0 0 0-14.2z"/></svg>';app.innerHTML=header()+progress()+`<div class="image-wrap"><img class="image" src="${escape(item.image_url)}" alt="${escape(item.alt_text)}"></div><p class="audio-help">I-click ito para marinig ang salita.</p><button class="button listen" id="listen" type="button" aria-label="Pakinggan ang salita para sa kasalukuyang larawan">${speaker} Pakinggan ang salita</button><div class="writing"><div class="boxes" aria-hidden="true">${Array.from({length:letters},()=>'<span class="box"></span>').join('')}</div><form class="answer-form" id="answer-form"><input class="answer-input" id="answer" maxlength="${letters}" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Isulat ang salita para sa larawan" required><button class="button" type="submit">SURIIN</button></form></div><p class="hint feedback ${savedCorrect?'correct':feedback?'error':''}" id="feedback">${escape(feedback)}</p>`;
      const input=app.querySelector('#answer'),boxes=[...app.querySelectorAll('.box')],show=()=>{const chars=[...input.value];boxes.forEach((box,index)=>box.textContent=chars[index]||'');};input.addEventListener('input',show);app.querySelector('#listen').onclick=speak;if(savedCorrect){app.querySelector('#answer-form').remove();app.querySelector('.writing').insertAdjacentHTML('beforeend','<button class="button" id="next" type="button">SUSUNOD</button>');app.querySelector('#next').onclick=()=>{savedCorrect=false;feedback='';render()};}else{input.focus();app.querySelector('#answer-form').onsubmit=e=>{e.preventDefault();save(input.value.trim())};}}
    async function finish(){if(busy)return;busy=true;app.innerHTML=header()+'<p class="hint">Itinatala ang iyong natapos na gawain…</p>';try{await request(data.completion_url,{});done();}catch(error){busy=false;app.innerHTML=header()+`<p class="feedback error">${escape(error.message)}</p><button class="button" id="retry" type="button">SUBUKANG MULI</button>`;app.querySelector('#retry').onclick=finish;}}
    function done(){app.innerHTML=`<div class="complete-icon" aria-hidden="true">✓</div><h1>Magaling!</h1><p class="instruction">Natapos mo ang Lesson 16: Gawain 4.</p><div class="track" aria-label="5 sa 5 ang natapos"><i style="width:100%"></i></div><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a>`;busy=false;}
    render();
  })();
  </script>
</body>
</html>
