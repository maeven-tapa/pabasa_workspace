  <script>
  (() => {'use strict';

    let oralReadyIndex=Array.isArray(state.completed_oral_reads)&&state.completed_oral_reads.includes(answers.length)?answers.length:-1, readingAttempts=Math.max(0,Number(state.stt_attempts?.[String(answers.length)])||0), aloudAttempts=Math.max(0,Number(state.tts_plays?.[String(answers.length)])||0);

    const lesson16Gawain4Audio={intro:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/01_activity_intro.mp3' %}",readingCorrect:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/12_feedback_reading_correct.mp3' %}",readingRetry:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/13_feedback_reading_retry.mp3' %}",listenThreeTimes:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/14_listen_three_times_prompt.mp3' %}",subTry:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_7/subukan_mong_basahin_salita_tts.mp3' %}",writtenRetry:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/15_feedback_written_retry.mp3' %}",microphoneUnavailable:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/16_microphone_unavailable.mp3' %}",completion:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/17_feedback_completion.mp3' %}"};
    const lesson16Gawain4Items=[{prompt:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/02_item_01_gamot_read_prompt.mp3' %}",word:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/03_item_01_gamot_word.mp3' %}"},{prompt:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/04_item_02_bunga_read_prompt.mp3' %}",word:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/05_item_02_bunga_word.mp3' %}"},{prompt:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/06_item_03_panga_read_prompt.mp3' %}",word:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/07_item_03_panga_word.mp3' %}"},{prompt:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/08_item_04_goma_read_prompt.mp3' %}",word:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/09_item_04_goma_word.mp3' %}"},{prompt:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/10_item_05_sanga_read_prompt.mp3' %}",word:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_4/11_item_05_sanga_word.mp3' %}"}];

    const header=()=>`<p class="eyebrow">Session 6 · Lesson 16 · Gawain 4</p><h1>${isLesson16Gawain4?'Isulat ang wastong salita para sa larawan':escape(data.title)}</h1><p class="instruction">${escape(data.instruction)}</p>`;

    const playPrescribedReadAloud=async text=>{if(!data.read_aloud_url||!text)throw Error('Hindi available ang Filipino audio.');if(activeAudio){activeAudio.pause();activeAudio=null;}const form=new FormData();form.append('text',text);form.append('language','Filipino');form.append('prescribed_activity_key',data.activity_key);const response=await fetch(data.read_aloud_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json().catch(()=>({}));if(!response.ok||!result.success||!result.audio_content||result.tts_language!=='fil-PH'||result.voice_name!=='fil-PH-Wavenet-A')throw Error(result.error||'Hindi available ang Filipino audio.');const source=URL.createObjectURL(new Blob([Uint8Array.from(atob(result.audio_content),char=>char.charCodeAt(0))],{type:result.mime_type||'audio/mpeg'})),audio=new Audio(source);activeAudio=audio;return new Promise((resolve,reject)=>{const clear=()=>{if(activeAudio===audio)activeAudio=null;URL.revokeObjectURL(source);};audio.onended=()=>{clear();resolve();};audio.onerror=()=>{clear();reject(Error('Hindi ma-play ang audio.'));};audio.play().catch(error=>{clear();reject(error);});});};

    const narrateFeedback=async(message,mappedKey=undefined)=>{try{if(isLesson16Gawain4){const text=String(message),key=mappedKey===undefined?(text.includes('Tama ang pagbasa')?'readingCorrect':text.includes('mikropono')?'microphoneUnavailable':text.includes('Makinig muna')?'listenThreeTimes':'readingRetry'):mappedKey;if(!key)return;if(oralMode==='aloud'&&key==='listenThreeTimes')return;await playMappedAudio(lesson16Gawain4Audio[key]);if(key==='readingRetry'&&oralMode==='aloud')await playThreeWordRecovery(answers.length);}else await playPrescribedReadAloud(message);}catch(error){feedback=`${message} ${error.message||'Hindi available ang Filipino audio.'}`;}};
    const announceCurrentItem=async()=>{const index=answers.length,item=items[index];if(!item||announcedItemIndex===index)return;announcedItemIndex=index;try{if(isLesson16Gawain4){await playMappedAudio(lesson16Gawain4Items[index]?.prompt);return;}await playPrescribedReadAloud(`${data.instruction} Basahin ang salita: ${item.read_aloud||''}.`);}catch(error){feedback=error.message||'Hindi available ang Filipino audio.';const status=app.querySelector('.oral-status');if(status)status.textContent=feedback;}};

    const normalize=text=>String(text||'').toLocaleLowerCase('fil-PH').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');

    }
    async function persist(extra={}){const mine=++requestVersion,result=await request(data.progress_url,{...extra,state:version()});if(mine!==requestVersion)return null;state={...(result.progress?.state||state)};answers=Array.isArray(result.progress?.answers)?result.progress.answers:answers;oralReadyIndex=Array.isArray(state.completed_oral_reads)&&state.completed_oral_reads.includes(answers.length)?answers.length:-1;readingAttempts=Math.max(0,Number(state.stt_attempts?.[String(answers.length)])||0);aloudAttempts=Math.max(0,Number(state.tts_plays?.[String(answers.length)])||0);oralMode=readingAttempts>=3?'aloud':'read';return result;}
    async function readCurrentWord(){if(busy||activeAudio)return;const itemIndex=answers.length,mine=++requestVersion;let retryMessage='';busy=true;oralStatus='🎙 Nakikinig…';renderOral('Nakikinig sa iyong pagbasa…','good');try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono.');stream=await window.Basahin.openMicrophone({audio:true});let recorder=null,chunks=[];const recording = await window.Basahin.capture({button:document.querySelector('[data-basahin-button]'),stream: stream, onRecorder: value => { recorder = value; }});stopOral();if(mine!==requestVersion)return;oralStatus='⏳ Pinoproseso…';renderOral('Pinoproseso ang iyong pagbasa…','good');const word=items[itemIndex].read_aloud||'',form=new FormData();form.append('audio',recording,'oral-reading.webm');form.append('target_text',word);form.append('language','Filipino');form.append('mode','reading');const response=await fetch(data.transcribe_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json().catch(()=>({}));if(mine!==requestVersion)return;if(!response.ok||!result.success||result.complete!==true)throw Error('Hindi pa malinaw ang pagbasa.');state.completed_oral_reads=[...new Set([...(state.completed_oral_reads||[]),itemIndex])];state.stt_attempts={...(state.stt_attempts||{}),[String(itemIndex)]:0};state.tts_plays={...(state.tts_plays||{}),[String(itemIndex)]:0};state.phase='written';await persist();oralStatus='';feedback='Tama ang pagbasa!';await narrateFeedback(feedback);render();}catch(error){if(mine!==requestVersion)return;oralStatus='';if(!window.Basahin.isCaptureError(error)){readingAttempts=Math.min(3,readingAttempts+1);}if(!window.Basahin.isCaptureError(error)){state.stt_attempts={...(state.stt_attempts||{}),[String(itemIndex)]:readingAttempts};}state.phase='oral_reading';oralMode=readingAttempts>=3?'aloud':'read';try{await persist()}catch(_){}retryMessage=oralMode==='aloud'?'Makinig muna sa salita nang hanggang tatlong beses.':error.message||`Subukan muli. May ${3-readingAttempts} pagkakataon pa.`;await narrateFeedback(retryMessage);}finally{stopOral();busy=false;if(retryMessage)renderOral(retryMessage,'error');}}
    async function listenCurrentWord(){if(busy)return;const itemIndex=answers.length,mine=++requestVersion;let listenMessage='',listenKind='good';busy=true;try{if(isLesson16Gawain4)await playThreeWordRecovery(itemIndex);else await playPrescribedReadAloud(items[itemIndex].read_aloud||'');if(mine!==requestVersion)return;aloudAttempts=Math.min(3,aloudAttempts+1);const completedListeningCycle=aloudAttempts===3;state.tts_plays={...(state.tts_plays||{}),[String(itemIndex)]:aloudAttempts};if(completedListeningCycle){readingAttempts=0;aloudAttempts=0;state.stt_attempts={...(state.stt_attempts||{}),[String(itemIndex)]:0};state.tts_plays={...(state.tts_plays||{}),[String(itemIndex)]:0};oralMode='read';if(isLesson16Gawain4)await playMappedAudio(lesson16Gawain4Audio.subTry);}await persist();listenMessage=completedListeningCycle?'Subukan mong basahin ang salita.':'Pakinggan muli kung kailangan.';}catch(error){if(mine!==requestVersion)return;listenMessage=error.message||'Hindi ma-play ang salita.';listenKind='error';}finally{busy=false;if(listenMessage)renderOral(listenMessage,listenKind);}}
    async function save(candidate){if(busy)return;busy=true;try{let result=await persist({candidate_answer:candidate});if(!result)return;/* A stale progress request returns accepted:null with the server's newer state. Retry the same answer against that state instead of presenting it as incorrect. */if(result.accepted===null)result=await persist({candidate_answer:candidate});if(!result)return;if(result.accepted){savedCorrect=false;feedback='Tama! Magaling!';state.phase=answers.length>=items.length?'completion':'oral_reading';await narrateFeedback(feedback,'');if(answers.length>=items.length){busy=false;await finish();return;}busy=false;renderOral(feedback,'good');return;}feedback='Subukan muli. Maaari mong pakinggan ang salita kung kailangan.';render();await narrateFeedback(feedback,'writtenRetry');}catch(error){feedback=error.message||'Hindi na-save ang sagot. Subukan muli.';render();await narrateFeedback(feedback,'writtenRetry');}finally{busy=false;}}
    function render(){if(!items.length){app.innerHTML='<p class="feedback error">Walang laman ang gawaing ito.</p>';return;}if(data.progress?.activity_completed){done();return;}if(!state.started&&!answers.length){app.innerHTML=header()+`<div class="competencies">${(data.competencies||[]).map(x=>`<span>${escape(x)}</span>`).join('')}</div><p class="intro-copy">Tingnan ang bawat larawan at i-type ang salitang inilalarawan nito.</p><button class="button" id="start" type="button">SIMULAN</button>`;app.querySelector('#start').onclick=async()=>{state.started=true;state.phase='oral_reading';try{await persist();render()}catch(error){feedback=error.message;render()}};return;}if(isLesson16Gawain4&&!savedCorrect&&oralReadyIndex!==answers.length){renderOral();return;}if(answers.length>=items.length){finish();return;}const item=items[answers.length],letters=Number(item.letter_count)||0, speaker='<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 10v4h4l5 4V6l-5 4H3zm11.5 2A3.5 3.5 0 0 0 13 9.1v5.8a3.5 3.5 0 0 0 1.5-2.9zm0-7.1v2.1a5.5 5.5 0 0 1 0 10v2.1a7.5 7.5 0 0 0 0-14.2z"/></svg>';app.innerHTML=header()+progress()+`<section class="writing-task"><div class="image-wrap"><img class="image" src="${escape(item.image_url)}" alt="${escape(item.alt_text)}"></div><div class="task-controls"><p class="audio-help">I-click ito para marinig ang salita.</p><button class="button listen" id="listen" type="button" aria-label="Pakinggan ang salita para sa kasalukuyang larawan">${speaker} Pakinggan ang salita</button><div class="writing"><div class="boxes" aria-hidden="true">${Array.from({length:letters},()=>'<span class="box"></span>').join('')}</div><form class="answer-form" id="answer-form"><input class="answer-input" id="answer" maxlength="${letters}" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Isulat ang salita para sa larawan" required><button class="button" type="submit">SURIIN</button></form></div><p class="hint feedback ${savedCorrect?'correct':feedback?'error':''}" id="feedback">${escape(feedback)}</p></div></section>`;
      const input=app.querySelector('#answer'),boxes=[...app.querySelectorAll('.box')],show=()=>{const chars=[...input.value];boxes.forEach((box,index)=>box.textContent=chars[index]||'');};input.addEventListener('input',show);app.querySelector('#listen').onclick=speak;input.focus();app.querySelector('#answer-form').onsubmit=e=>{e.preventDefault();save(input.value.trim())};}
    async function finish(){if(busy)return;busy=true;app.innerHTML=header()+'<p class="hint">Itinatala ang iyong natapos na gawain…</p>';try{await request(data.completion_url,{});if(isLesson16Gawain4)await playMappedAudio(lesson16Gawain4Audio.completion);done();}catch(error){busy=false;app.innerHTML=header()+`<p class="feedback error">${escape(error.message)}</p><button class="button" id="retry" type="button">SUBUKANG MULI</button>`;app.querySelector('#retry').onclick=finish;}}
    function done(){app.innerHTML=header()+`<ol class="steps" aria-label="Progress across five pictures">${items.map((_,index)=>`<li class="step completed" aria-label="Step ${index+1}, completed">✓</li>`).join('')}</ol><div class="complete-icon" aria-hidden="true">✓</div><h2>Magaling!</h2><p class="instruction">Natapos mo ang Lesson 16: Gawain 4.</p><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a>`;busy=false;}
    if(isLesson16Gawain4)app.addEventListener('click',event=>{if(event.target.closest('#start')&&!window.__session6IntroModalAudioStarted)void playMappedAudio(lesson16Gawain4Audio.intro);});
    addEventListener('pagehide',()=>{if(isLesson16Gawain4)stopOral();});addEventListener('session6-prescribed-cancel',()=>{requestVersion+=1;busy=false;stopOral();activeAudio?.pause();activeAudio=null;});const session6RenderOral=renderOral,session6Render=render;renderOral=(...args)=>{const result=session6RenderOral(...args);window.dispatchEvent(new CustomEvent('session6-prescribed-render'));return result;};render=(...args)=>{const result=session6Render(...args);window.dispatchEvent(new CustomEvent('session6-prescribed-render'));return result;};render();
    addEventListener('session6-prescribed-ui-reset',()=>{oralStatus='';feedback='';const status=app.querySelector('.oral-status');if(status)status.textContent='';const action=app.querySelector('#oral-action');if(action){action.disabled=false;action.textContent=oralMode==='aloud'?'Pakinggan muna':'Basahin ngayon';}});
    const renderOralWithRetryMessage=renderOral;renderOral=(message='',kind='')=>renderOralWithRetryMessage(oralMode==='read'&&kind==='error'&&String(message).includes('malinaw')?'Hindi pa tama, subukan muli.':message,kind);
    addEventListener('session6-prescribed-cancel',()=>window.dispatchEvent(new CustomEvent('session6-prescribed-ui-reset')));
  })();
