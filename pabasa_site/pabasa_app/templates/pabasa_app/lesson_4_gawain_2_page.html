{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letrang Mm at Ss</title><link rel="stylesheet" href="{% static 'pabasa_app/sound_detective.css' %}"><style>html,body{height:100%;margin:0;overflow:hidden}body{background:linear-gradient(135deg,#0c5570,#78d7d0);font-family:Segoe UI,sans-serif;color:#164b5d}.page{height:100dvh;padding:12px;box-sizing:border-box}.back{color:#fff;font-weight:800}.card{height:calc(100% - 34px);max-width:900px;margin:8px auto;background:#f8ffff;border-radius:24px;padding:clamp(14px,3vw,30px);box-sizing:border-box;display:flex;flex-direction:column}.head{display:flex;justify-content:space-between}.eyebrow{font-size:.8rem;font-weight:800;color:#e46b58}.head h1{margin:2px 0;font-size:clamp(1.4rem,3vw,2.2rem)}#progress{font-size:1.1rem;color:#1f7893}.instruction{text-align:center;font-weight:800;font-size:1.2rem;margin:12px}.focus{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.focus img{width:min(50vw,340px);height:min(45vh,290px);object-fit:contain}.word{font-size:clamp(1.8rem,5vw,3rem);font-weight:900}.prompt{font-size:1.2rem;font-weight:800}.attempt{color:#587985}.actions{display:flex;gap:12px}.actions button{border:0;border-radius:14px;padding:12px 28px;background:#1f7893;color:#fff;font-weight:900;font-size:1.05rem}.choice{font-size:2rem!important;min-width:110px;min-height:76px;background:#ef7180!important}.good{background:#43b982!important}.bad{background:#ed8b68!important}</style></head><body><div class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><main class="card"><div class="head"><div><div class="eyebrow">Lesson 4 · Gawain 2</div><h1>Letrang Mm at Ss</h1></div><strong id="progress"></strong></div><p class="instruction">Bilugan ang unang tunog na nasa larawan.</p><section class="focus"><img id="picture" alt=""><div id="word" class="word"></div><div id="prompt" class="prompt"></div><div id="attempt" class="attempt"></div><div id="actions" class="actions"></div></section></main></div>{{ lesson_4_gawain_2_data|json_script:"lesson-four-ms-data" }}<script>
(()=>{const items=JSON.parse(document.getElementById('lesson-four-ms-data').textContent).items,$=id=>document.getElementById(id);let i=0,t=0,l=0,locked=false,open=false;const c=()=>document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'';function render(){if(i>=items.length)return $('prompt').textContent='Magaling! Natapos mo ang gawain!';let x=items[i];$('picture').src=`{% static 'pabasa_app/images/letrang_m_s/' %}${x.image}`;$('picture').alt=x.word;$('word').textContent=x.word;$('progress').textContent=`${i+1} / ${items.length}`;$('prompt').textContent=open?'Anong unang tunog?':t>=3?'Subukan nating pakinggan.':'Basahin ang salita';$('attempt').textContent=open?'':t>=3?`Pakikinig ${l} / 3`:`Pagsubok ${Math.min(t+1,3)} / 3`;$('actions').innerHTML=open?'<button class="choice" data-v="M">M</button><button class="choice" data-v="S">S</button>':t>=3?'<button id="listen">🔊 Basahin Ko</button>':'<button id="read">🎙️ Basahin ang salita</button>';if(open)document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b));else t>=3?listen.onclick=aloud:read.onclick=record}async function record(){if(locked)return;locked=true;let s;try{s=await navigator.mediaDevices.getUserMedia({audio:true});let r=new MediaRecorder(s),a=[];r.ondataavailable=e=>e.data.size&&a.push(e.data);let done=new Promise(x=>r.onstop=()=>x(new Blob(a,{type:r.mimeType||'audio/webm'})));r.start();setTimeout(()=>r.state==='recording'&&r.stop(),3500);let f=new FormData();f.append('audio',await done,'lesson-4-ms.webm');f.append('target_text',items[i].word);f.append('language','Filipino');f.append('mode','word');let d=await(await fetch('{% url "reading_transcribe_api" %}',{method:'POST',headers:{'X-CSRFToken':c()},body:f})).json();d.success&&d.complete?open=true:t++;render()}finally{s?.getTracks().forEach(x=>x.stop());locked=false}}async function aloud(){l++;let f=new FormData();f.append('target_text',items[i].word);f.append('language','Filipino');f.append('mode','word');let d=await(await fetch('{% url "reading_read_aloud_api" %}',{method:'POST',headers:{'X-CSRFToken':c()},body:f})).json();if(d.audio_content)new Audio(`data:${d.mime_type||'audio/mpeg'};base64,${d.audio_content}`).play();if(l>=3){t=0;l=0}render()}function answer(b){let ok=items[i].starts_m===(b.dataset.v==='M');b.classList.add(ok?'good':'bad');if(!ok)return;i++;open=false;t=0;l=0;render()}render()})()</script></body></html>

<script>document.addEventListener('DOMContentLoaded',function(){const data=JSON.parse(document.getElementById('lesson-four-ms-data').textContent),total=data.items.length,saveUrl='{% url "lesson_4_activity_progress" %}',csrf=document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'',answers=[];function save(done,index,correct){return fetch(saveUrl,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:JSON.stringify({activity_key:'lesson-4-gawain-2',total_items:total,current_index:index,completed_items:index,correct_items:correct,activity_completed:done,state:{answers:answers}})}).catch(console.error)}new MutationObserver(function(){document.querySelectorAll('.choice:not([data-save-bound])').forEach(function(b){b.dataset.saveBound='1';b.addEventListener('click',function(){const card=b.closest('.focus'),value=b.dataset.v,index=Number(document.getElementById('progress').textContent.split('/')[0])-1,correct=data.items[index].starts_m===(value==='M');if(correct){answers.push({item_index:index,answer:value,correct:true});save(index+1, index+1, answers.filter(x=>x.correct).length);if(index+1===total)setTimeout(()=>save(true,total,total),0)}})})}).observe(document.body,{childList:true,subtree:true})});</script>
<script>document.addEventListener('DOMContentLoaded',function(){const d=JSON.parse(document.getElementById('lesson-four-ms-data').textContent),n=d.items.length,u='{% url "lesson_4_activity_progress" %}',c=document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'',a=[];function s(done,i){fetch(u,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':c},body:JSON.stringify({activity_key:'lesson-4-gawain-2',total_items:n,current_index:i,completed_items:i,correct_items:a.length,activity_completed:done,state:{answers:a}})}).catch(console.error)}new MutationObserver(()=>document.querySelectorAll('.choice:not([data-save-bound])').forEach(b=>{b.dataset.saveBound=1;b.onclick=()=>{const i=+progress.textContent.split('/')[0]-1;if(d.items[i].starts_m===(b.dataset.v==='M')){a.push({item_index:i,answer:b.dataset.v});s(i+1===n,i+1)}}})).observe(document.body,{childList:true,subtree:true})});</script>
