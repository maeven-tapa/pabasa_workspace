{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAWAIN 1A: Letrang Ee</title><style>body{margin:0;overflow:hidden;background:#e1f5f7;color:#16465d;font-family:Nunito,Arial,sans-serif}.page{width:min(1000px,calc(100% - 24px));margin:auto;padding:12px}.back{color:#16465d;font-weight:900}.card{margin-top:10px;padding:clamp(8px,2vh,24px);border-radius:24px;background:#fffdf7;text-align:center;min-height:calc(100dvh - 58px);height:calc(100dvh - 58px);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.eyebrow{color:#997124;font-size:.8rem;font-weight:900}.instruction{font-weight:800;margin:6px auto}.picture{width:min(80vw,380px);height:min(50vh,340px);object-fit:contain}.read,.submit,.return{border:0;border-radius:14px;background:#2b83bd;color:#fff;padding:13px 30px;min-width:240px;font-size:1.08rem;font-weight:900;cursor:pointer}.read.reading{background:#d64c55;animation:readingPulse 1.2s infinite}.read.processing{background:#e6a33a;box-shadow:0 0 18px #e6a33aaa;cursor:wait}@keyframes readingPulse{50%{box-shadow:0 0 0 10px #d64c5500,0 0 24px #d64c55b3}}.read:disabled,.submit:disabled{opacity:.65}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(4px,1vh,10px);width:min(720px,100%);margin:clamp(4px,1vh,10px) auto}.choice{position:relative;min-height:0;border:2px solid #dce8ed;border-radius:16px;background:#fff;padding:6px;cursor:pointer}.choice img{width:100%;height:clamp(58px,10vh,90px);object-fit:contain}.choice.x{border-color:#d64c55;box-shadow:0 0 0 4px #d64c55}.choice.x:after{content:'×';position:absolute;inset:0;display:grid;place-items:center;color:#d64c55;font-size:7rem;font-weight:900;line-height:1;background:#fff6}.status{min-height:20px;margin:4px auto;font-weight:800}.hint{color:#b33b2f;font-weight:800}.done{padding:60px 20px;color:#26784e;font-weight:900;font-size:1.4rem}@media(max-width:600px){.grid{gap:4px;margin:6px auto}.choice{min-height:0}.choice img{height:clamp(58px,12vh,88px)}.card{padding:8px}.card h1{font-size:1.5rem;margin:2px}.instruction{font-size:.9rem}}</style></head><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card"></section></main>{{ lesson7_gawain2b_data|json_script:"activity-data" }}<script>
(()=>{const d=JSON.parse(document.getElementById('activity-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'',correct=[0,4,6,7];let s=Object.assign({phase:'oral',current_reading_item:0,completed_reading_items:[],selections:[],final_reading_items:[],read_attempts:0,listen_attempts:0},d.progress?.state||{}),busy=false;const save=()=>fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:(s.state_version||0)+1}})});const speak=async word=>{const f=new FormData();f.append('target_text',word);f.append('mode','reading');f.append('language','Filipino');f.append('prescribed_activity_key',d.activity_key);f.append('tts_profile','crla');const r=await fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f});const x=await r.json();if(!r.ok||!x.success)throw Error(x.error||'Audio is unavailable.');const bin=atob(x.audio_content||'');const bytes=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)bytes[j]=bin.charCodeAt(j);const audio=new Audio(URL.createObjectURL(new Blob([bytes],{type:x.mime_type||'audio/mpeg'})));await audio.play();return new Promise((ok,bad)=>{audio.onended=ok;audio.onerror=bad})};function render(){if(d.progress?.activity_completed){app.innerHTML='<div class="done">✓<h1>Magaling!</h1><p>Natapos mo ang GAWAIN 1A: Letrang Ee.</p><a class="return" href="{% url "assessment" %}">Bumalik sa Aking Aralin</a></div>';return}if(s.phase==='oral'||s.phase==='final'){const final=s.phase==='final',list=final?s.final_targets:undefined,i=final?s.final_reading_items.length:s.current_reading_item,it=d.items[final?(list?.[i]??correct[i]):i];app.innerHTML='<div class="eyebrow">SESSION 3 · LESSON 8 · GAWAIN 1A</div><h1>'+(final?'Bigkasin ang mga larawang nilagyan ng ekis':'')+'</h1><p class="instruction">'+(final?'Bigkasin ang pangalan ng bawat larawang nilagyan ng ekis.':'Tingnan ang larawan at sabihin ang pangalan nito.')+'</p><img class="picture" src="'+it.image_url+'" alt="'+it.word+'"><p class="status" id="status">Larawan '+(i+1)+' / '+(final?list.length:9)+'</p><button class="read" id="read">Sabihin ang salita</button>';const resetRead=()=>{read.classList.remove('reading','processing');read.disabled=false;read.textContent='Sabihin ang salita';read.onclick=startRead};const listen=()=>{if(busy)return;busy=true;read.disabled=true;read.classList.remove('reading');read.classList.add('processing');read.textContent='Pakinggan…';s.listen_attempts=(s.listen_attempts||0)+1;speak(it.word).then(()=>{read.classList.remove('reading','processing');if(s.listen_attempts>=3){s.read_attempts=0;s.listen_attempts=0;read.disabled=false;read.textContent='Sabihin ang salita';read.onclick=startRead}else{read.disabled=false;read.textContent='Pakinggan';read.onclick=listen}busy=false;save()}).catch(()=>{resetRead();busy=false})};const startRead=()=>{if(busy)return;busy=true;read.disabled=true;read.classList.remove('processing');read.classList.add('reading');read.textContent='Nakikinig…';const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById('status').textContent='Hindi available ang mikropono.';resetRead();busy=false;return}const r=new R();r.lang='fil-PH';r.onstart=()=>{read.classList.remove('processing');read.classList.add('reading');read.textContent='Nakikinig…'};r.onresult=async e=>{read.classList.remove('reading');read.classList.add('processing');read.textContent='Pinoproseso…';const said=String(e.results[0][0].transcript).toLowerCase();if(!(said.includes(it.word.toLowerCase())||(it.word.toLowerCase()==='selpon'&&(said.includes('cellphone')||said.includes('cell phone'))))){s.read_attempts=(s.read_attempts||0)+1;document.getElementById('status').textContent=s.read_attempts>=3?'Pakinggan ang salita.':'Hindi iyon ang tamang pangalan. Subukan muli.';read.classList.remove('reading','processing');read.disabled=false;if(s.read_attempts>=3){read.textContent='Pakinggan';read.onclick=listen}else{read.textContent='Subukan muli';read.onclick=startRead}busy=false;await save();return}if(final){s.final_reading_items=[...s.final_reading_items,i];if(s.final_reading_items.length===s.final_targets.length){await save();const done=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});if(done.ok)d.progress.activity_completed=true}}else{s.completed_reading_items=[...s.completed_reading_items,i];s.current_reading_item=i+1;if(s.current_reading_item===9)s.phase='selection'}s.read_attempts=0;s.listen_attempts=0;await save();busy=false;render()};r.onerror=async()=>{s.read_attempts=(s.read_attempts||0)+1;document.getElementById('status').textContent=s.read_attempts>=3?'Pakinggan ang salita.':'Hindi narinig. Subukan muli.';read.classList.remove('reading','processing');read.disabled=false;if(s.read_attempts>=3){read.textContent='Pakinggan';read.onclick=listen}else{read.textContent='Subukan muli';read.onclick=startRead}busy=false;await save()};r.start()};read.onclick=startRead;return}app.innerHTML='<div class="eyebrow">SESSION 3 · LESSON 8 · GAWAIN 1A</div><h1>Letrang Ee</h1><p class="instruction">Panuto: I-click ang larawang nagsisimula sa titik Ee.</p><div class="grid">'+d.items.map((x,i)=>'<button class="choice '+(s.selections.includes(i)?'x':'')+'" data-i="'+i+'"><img src="'+x.image_url+'" alt="'+x.word+'"></button>').join('')+'</div><p class="status" id="status">Piliin ang mga larawan, pagkatapos ay pindutin ang ISUMITE.</p><p class="hint" id="hint"></p><button class="submit" id="submit">ISUMITE</button>';document.querySelectorAll('.choice').forEach(b=>b.onclick=async()=>{const i=+b.dataset.i;s.selections=s.selections.includes(i)?s.selections.filter(x=>x!==i):[...s.selections,i];await save();render()});submit.onclick=async()=>{const ok=s.selections.slice().sort().join(',')===correct.join(',');if(!ok){hint.textContent='Hindi pa tama. Nire-reset ang mga sagot.';s.selections=[];await save();window.location.reload();return}s.final_targets=correct;s.final_reading_items=[];s.phase='final';await save();render()}}render()})();
</script></body></html>
