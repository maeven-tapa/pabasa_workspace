{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gawain 2</title><style>@font-face{font-family:Fredoka;src:url("{% static 'pabasa_app/font/fredoka-one.one-regular.ttf' ")}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:url("{% static 'pabasa_app/prescribed/PRESCRIBED-BG.jpg' %}") center/cover no-repeat;color:#183e63;font-family:Fredoka,Nunito,sans-serif}.page{height:100%;padding:10px}.back{color:#183e63;font-weight:900}.card{height:calc(100% - 34px);max-width:1250px;margin:8px auto 0;padding:clamp(20px,4vh,42px);border-radius:42px;background:#ffffff63;backdrop-filter:blur(10px);display:grid;place-items:center;text-align:center;overflow:auto}.task{width:min(950px,100%)}.instruction{font-size:clamp(1.2rem,2.4vw,1.7rem);font-weight:900}.progress{font-weight:900}.oral-img{width:min(260px,48vw);height:min(220px,30vh);object-fit:contain}.row{display:grid;grid-template-columns:90px repeat(3,1fr);gap:12px;align-items:center;margin:18px auto;max-width:900px}.ref{font-size:clamp(1.7rem,3vw,2.5rem);font-weight:900}.choice{border:4px solid #94d9d6;border-radius:20px;background:#fffffff0;padding:8px;cursor:pointer;box-shadow:0 5px #b7d6dc}.choice img{width:100%;height:clamp(100px,20vh,180px);object-fit:contain}.choice.selected{border-color:#e7af45;box-shadow:0 0 0 6px #f5d47c,0 5px #c9902d}.action{min-width:260px;min-height:68px;border:0;border-radius:999px;background:#299e9a;color:#fff;font:inherit;font-size:1.3rem;font-weight:900;cursor:pointer;box-shadow:0 7px #187b7a}.action.reading{background:#299e9a}.action.processing{background:#e7af45;box-shadow:0 7px #b98220}.action:disabled{background:#b5c5c7;box-shadow:none;cursor:not-allowed}.feedback{min-height:28px;font-weight:900;color:#b33b2f}.done{font-size:1.4rem;font-weight:900;color:#26784e}</style></head><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section class="card" id="app"></section></main>{{ lesson9_gawain2_data|json_script:"lesson9-g2-data" }}<script>(()=>{const d=JSON.parse(document.getElementById('lesson9-g2-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';let s=Object.assign({phase:'oral',oral_index:0,oral_attempts:0,selection_index:0,selections:[null,null,null,null,null]},d.progress.state||{}),busy=false;const save=async()=>{await fetch(d.progress_url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:s})})};const tts=async text=>{const f=new FormData();f.append('target_text',text);f.append('language','Filipino');f.append('mode','reading');f.append('prescribed_activity_key',d.activity_key);const r=await fetch('/api/reading/read-aloud/',{method:'POST',headers:{'X-CSRFToken':csrf()},body:f}),x=await r.json();if(!r.ok||!x.success)throw Error();const raw=atob(x.audio_content),a=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(raw,c=>c.charCodeAt(0))],{type:x.mime_type||'audio/mpeg'})));await new Promise((resolve,reject)=>{a.onended=resolve;a.onerror=reject;const p=a.play();if(p?.catch)p.catch(reject)})};const instruction='Tingnan ang larawang nasa kahon. Ano ito?',setOralButtons=enabled=>{const a=document.getElementById('read'),b=document.getElementById('listen');if(a)a.disabled=!enabled;if(b)b.disabled=!enabled},narrate=async text=>{setOralButtons(false);try{await tts(text)}catch(e){}setOralButtons(true)},startOralNarration=async()=>{busy=true;setOralButtons(false);try{await tts(instruction)}catch(e){}busy=false;setOralButtons(true)},listenWord=async word=>{if(busy)return;busy=true;setOralButtons(false);try{await tts(word)}catch(e){}busy=false;setOralButtons(true)};const render=()=>{if(d.progress.activity_completed||s.phase==='complete'){app.innerHTML='<div class="done">✓<br><span>Magaling! Natapos mo ang gawain.</span></div>';return}if(s.phase==='oral'){const x=d.oral_items[s.oral_index];app.innerHTML='<div class="task"><p class="instruction">'+instruction+'</p><img class="oral-img" src="'+x.image_url+'"><p class="progress">Larawan '+(s.oral_index+1)+' / 15</p><p class="feedback" id="feedback">Sabihin ang pangalan ng larawan.</p><div class="oral-actions"><button class="action" id="read" type="button">Sabihin ang salita</button><button class="action" id="listen" type="button">Pakinggan</button></div></div>';read.onclick=record;listen.onclick=()=>listenWord(x.word);startOralNarration();return}const i=s.selection_index||0,r=d.rows[i];app.innerHTML='<div class="task"><p class="instruction">Bilugan ang larawang kapareho ng tunog sa unang kolum.</p><p class="progress">Hanay '+(i+1)+' / 5</p><div class="row" id="selection-row"><div class="ref">'+r.reference+'</div>'+r.items.map((x,j)=>'<button class="choice '+(s.selections[i]===j?'selected':'')+'" data-j="'+j+'"><img src="'+x.image_url+'"></button>').join('')+'</div><p class="feedback" id="f"></p><button class="action" id="next" '+(s.selections[i]===null?'disabled':'')+'>'+(i===4?'ISUMITE':'SUSUNOD')+'</button></div>';startSelectionNarration();document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{s.selections[i]=+b.dataset.j;document.querySelectorAll('.choice').forEach(button=>button.classList.toggle('selected',button===b));document.getElementById('next').disabled=false});next.onclick=async()=>{if(s.selections[i]!==r.items.findIndex(x=>x.target)){const feedback=document.getElementById('f');feedback.textContent='Hindi tugma ang larawan sa pantig. Subukan muli!';s.selections[i]=null;busy=true;setSelectionControls(false);await save();try{await tts('Hindi tugma ang larawan sa pantig. Subukan muli!')}catch(e){}busy=false;setSelectionControls(true);return}if(i<4){const feedback=document.getElementById('f');feedback.textContent='Magaling!';busy=true;setSelectionControls(false);try{await tts('Magaling!')}catch(e){}s.selection_index=i+1;await save();busy=false;render();return}const feedback=document.getElementById('f');feedback.textContent='Magaling!';busy=true;setSelectionControls(false);try{await tts('Magaling!')}catch(e){}s.phase='complete';await save();const q=await fetch(d.completion_url,{method:'POST',headers:{'X-CSRFToken':csrf()}});if(q.ok){d.progress.activity_completed=true;render()}}};const setSelectionControls=enabled=>{const selectionRow=document.getElementById('selection-row'),selectionNext=document.getElementById('next'),selectionChoices=document.querySelectorAll('.choice');if(!selectionRow||!selectionNext)return;selectionRow.classList.toggle('is-disabled',!enabled);selectionChoices.forEach(button=>{button.disabled=!enabled});selectionNext.disabled=!enabled||s.selections[s.selection_index||0]===null},startSelectionNarration=()=>{busy=true;setSelectionControls(false);tts('Bilugan ang larawang kapareho ng tunog sa unang kolum.').catch(()=>{}).finally(()=>{busy=false;setSelectionControls(true)})};const record=async()=>{if(busy)return;const b=document.getElementById('read'),f=document.getElementById('feedback');if(s.oral_attempts>=3){busy=true;setOralButtons(false);b.className='action processing';b.textContent='Pakinggan…';try{await tts(d.oral_items[s.oral_index].word);s.oral_attempts=0;b.disabled=false;b.className='action';b.textContent='Sabihin ang salita'}catch(e){b.disabled=false;b.className='action';b.textContent='Pakinggan';f.textContent='Hindi available ang audio.'}busy=false;setOralButtons(true);return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){f.textContent='Hindi available ang mikropono.';return}busy=true;b.disabled=true;b.className='action reading';b.textContent='Nakikinig…';const rec=new R();rec.lang='fil-PH';rec.onresult=async e=>{b.className='action processing';b.textContent='Pinoproseso…';const ok=String(e.results[0][0].transcript||'').toLowerCase().includes(d.oral_items[s.oral_index].word.toLowerCase());if(ok){f.textContent='Magaling!';busy=true;setOralButtons(false);try{await tts('Magaling!')}catch(e){}s.oral_index++;s.oral_attempts=0;if(s.oral_index>=15)s.phase='selection';await save();busy=false;render()}else{const wrong='Hindi iyon ang tamang pangalan ng larawan. Subukan muli magsalita.';s.oral_attempts++;f.textContent=wrong;await save();await narrate(wrong);b.className='action';b.textContent='Sabihin ang salita';busy=false;setOralButtons(true)}};rec.onerror=()=>{busy=false;b.className='action';b.textContent='Sabihin ang salita';f.textContent='Hindi narinig. Subukan muli.';setOralButtons(true)};rec.start()};render()})();</script></body></html>
