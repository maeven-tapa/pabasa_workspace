{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gawain 2</title><style>@font-face{font-family:Fredoka;src:url("{% static 'pabasa_app/font/fredoka-one.one-regular.ttf' ")}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:url("{% static 'pabasa_app/prescribed/PRESCRIBED-BG.jpg' %}") center/cover no-repeat;color:#183e63;font-family:Fredoka,Nunito,sans-serif}.page{height:100%;padding:10px}.back{color:#183e63;font-weight:900}.card{height:calc(100% - 34px);max-width:1250px;margin:8px auto 0;padding:clamp(20px,4vh,42px);border-radius:42px;background:#ffffff63;backdrop-filter:blur(10px);display:grid;place-items:center;text-align:center;overflow:auto}.task{width:min(950px,100%)}.instruction{font-size:clamp(1.2rem,2.4vw,1.7rem);font-weight:900}.progress{font-weight:900}.oral-img{width:min(260px,48vw);height:min(220px,30vh);object-fit:contain}.row{display:grid;grid-template-columns:90px repeat(3,1fr);gap:12px;align-items:center;margin:18px auto;max-width:900px}.ref{font-size:clamp(1.7rem,3vw,2.5rem);font-weight:900}.choice{border:4px solid #94d9d6;border-radius:20px;background:#fffffff0;padding:8px;cursor:pointer;box-shadow:0 5px #b7d6dc}.choice img{width:100%;height:clamp(100px,20vh,180px);object-fit:contain}.choice.selected{border-color:#e7af45;box-shadow:0 0 0 6px #f5d47c,0 5px #c9902d}.action{min-width:260px;min-height:68px;border:0;border-radius:999px;background:#299e9a;color:#fff;font:inherit;font-size:1.3rem;font-weight:900;cursor:pointer;box-shadow:0 7px #187b7a}.action.reading{background:#299e9a}.action.processing{background:#e7af45;box-shadow:0 7px #b98220}.action:disabled{background:#b5c5c7;box-shadow:none;cursor:not-allowed}.feedback{min-height:28px;font-weight:900;color:#b33b2f}.done{font-size:1.4rem;font-weight:900;color:#26784e}</style></head><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section class="card" id="app"></section></main>{{ lesson9_gawain2_data|json_script:"lesson9-g2-data" }}<script>(()=>{const d=JSON.parse(document.getElementById('lesson9-g2-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';let s=Object.assign({phase:'oral',oral_index:0,oral_attempts:0,selection_index:0,selections:[null,null,null,null,null]},d.progress.state||{}),busy=false;const save=async()=>{await fetch(d.progress_url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:s})})};const tts=async text=>{const f=new FormData();f.append('target_text',text);f.append('language','Filipino');f.append('mode','reading');f.append('prescribed_activity_key',d.activity_key);const r=await fetch('/api/reading/read-aloud/',{method:'POST',headers:{'X-CSRFToken':csrf()},body:f}),x=await r.json();if(!r.ok||!x.success)throw Error();const raw=atob(x.audio_content),a=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(raw,c=>c.charCodeAt(0))],{type:x.mime_type||'audio/mpeg'})));await a.play()};const render=()=>{if(d.progress.activity_completed||s.phase==='complete'){app.innerHTML='<div class="done">Magaling! Natapos mo ang gawain.<br><a href="{% url "assessment" %}">Bumalik sa Aking Aralin</a></div>';return}if(s.phase==='oral'){const x=d.oral_items[s.oral_index];app.innerHTML='<div class="task"><p class="instruction">'+d.instruction+'</p><img class="oral-img" src="'+x.image_url+'"><p class="progress">Larawan '+(s.oral_index+1)+' / 15</p><p class="feedback" id="f">Sabihin ang pangalan ng larawan.</p><button class="action" id="read">Sabihin ang salita</button></div>';read.onclick=record;return}const i=s.selection_index||0,r=d.rows[i];app.innerHTML='<div class="task"><p class="instruction">Bilugan ang larawang kapareho ng tunog sa unang kolum.</p><p class="progress">Hanay '+(i+1)+' / 5</p><div class="row"><div class="ref">'+r.reference+'</div>'+r.items.map((x,j)=>'<button class="choice '+(s.selections[i]===j?'selected':'')+'" data-j="'+j+'"><img src="'+x.image_url+'"></button>').join('')+'</div><p class="feedback" id="f"></p><button class="action" id="next" '+(s.selections[i]===null?'disabled':'')+'>'+(i===4?'ISUMITE':'SUSUNOD')+'</button></div>';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{s.selections[i]=+b.dataset.j;render()});next.onclick=async()=>{if(s.selections[i]!==r.items.findIndex(x=>x.target)){document.getElementById('feedback').textContent='Hindi pa tama. Piliin muli ang larawan.';s.selections[i]=null;await save();document.getElementById('next').disabled=true;return}if(i<4){s.selection_index=i+1;await save();render();return}s.phase='complete';await save();const q=await fetch(d.completion_url,{method:'POST',headers:{'X-CSRFToken':csrf()}});if(q.ok){d.progress.activity_completed=true;render()}}};const record=async()=>{if(busy)return;const b=read, f=document.getElementById('f');if(s.oral_attempts>=3){busy=true;b.disabled=true;b.className='action processing';b.textContent='Pakinggan…';try{await tts(d.oral_items[s.oral_index].word);s.oral_attempts=0;b.disabled=false;b.className='action';b.textContent='Sabihin ang salita'}catch(e){b.disabled=false;b.className='action';b.textContent='Pakinggan';f.textContent='Hindi available ang audio.'}busy=false;return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){f.textContent='Hindi available ang mikropono.';return}busy=true;b.disabled=true;b.className='action reading';b.textContent='Nakikinig…';const rec=new R();rec.lang='fil-PH';rec.onresult=async e=>{b.className='action processing';b.textContent='Pinoproseso…';const ok=String(e.results[0][0].transcript||'').toLowerCase().includes(d.oral_items[s.oral_index].word.toLowerCase());if(ok){s.oral_index++;s.oral_attempts=0;if(s.oral_index>=15)s.phase='selection';await save();busy=false;render()}else{s.oral_attempts++;busy=false;b.disabled=false;b.className='action';b.textContent=s.oral_attempts>=3?'Pakinggan':'Subukan muli';f.textContent=s.oral_attempts>=3?'Pakinggan ang salita.':'Hindi narinig. Subukan muli.';await save()}};rec.onerror=()=>{busy=false;b.disabled=false;b.className='action';b.textContent='Subukan muli';f.textContent='Hindi narinig. Subukan muli.'};rec.start()};render()})();</script></body></html>
