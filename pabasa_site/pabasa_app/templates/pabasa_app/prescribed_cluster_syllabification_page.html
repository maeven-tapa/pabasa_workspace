<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 20 at 21: Gawain 2 | PABASA</title><style>
:root{--ink:#16465d;--blue:#197b99;--gold:#d98c27;--good:#278750;--bad:#ad3c3c;--line:#bfdde4}*{box-sizing:border-box}body{margin:0;background:#eaf7f7;color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(760px,calc(100% - 24px));margin:auto;padding:16px 0}.back{color:var(--ink);font-weight:900;text-decoration:none}.card{min-height:calc(100vh - 58px);margin-top:12px;padding:clamp(20px,5vw,42px);border-radius:28px;background:#fffdf7;text-align:center;box-shadow:0 18px 45px #24545d18}.eyebrow{color:#997124;font-size:.82rem;font-weight:900;letter-spacing:.08em}.instruction,.hint{color:#526e78;font-weight:700}.track{height:11px;margin:14px auto 22px;background:#dcebea;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#197b99,#72c8d5)}.button{min-height:52px;margin:8px;padding:12px 24px;border:0;border-radius:15px;background:var(--blue);box-shadow:0 4px 0 #155369;color:#fff;font:900 1rem inherit;cursor:pointer}.button.gold{background:var(--gold);box-shadow:0 4px 0 #a96c1e}.button:disabled{opacity:.6;cursor:wait}.status{min-height:30px;font-weight:900}.good{color:var(--good)}.bad{color:var(--bad)}.preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:24px auto;text-align:left}.preview div{border:2px solid var(--line);border-radius:14px;background:#fff;padding:12px;font-weight:900}.preview div:first-child{background:#fff3cd;border-color:var(--gold)}.preview span{display:block;color:#758b92;font-size:.9rem;margin-top:3px}.word{font-size:clamp(2.8rem,11vw,5.5rem);font-weight:1000;letter-spacing:.08em;margin:22px 0}.builder{align-items:center;display:flex;flex-wrap:wrap;gap:0;justify-content:center;margin:22px auto;min-height:80px}.letter{font-size:clamp(2.3rem,9vw,4.4rem);font-weight:1000}.separator{align-self:stretch;background:#fff;border:2px dashed #8eb6bf;border-radius:11px;color:#52737d;cursor:pointer;font:900 1.35rem inherit;margin:0 2px;min-width:25px;padding:0 3px}.separator.active{background:#fff0b8;border-color:var(--gold);border-style:solid;color:#9b651d}.answer-preview{background:#edf8f8;border:2px solid var(--line);border-radius:14px;font-size:clamp(1.5rem,6vw,2.4rem);font-weight:1000;letter-spacing:.06em;margin:14px auto;padding:12px;width:min(100%,460px)}.tools{display:flex;justify-content:center;gap:8px}.tools .button{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}.done{padding-top:12vh}.done h1{font-size:clamp(2rem,6vw,4rem)}@media(max-width:520px){.preview{grid-template-columns:1fr}.letter{font-size:2.45rem}.separator{min-width:21px}}
</style></head><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card" aria-live="polite"></section></main>{{ prescribed_activity_data|json_script:"prescribed-activity-data" }}<script>(()=>{'use strict';
const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),all=d.items||[],items=all.filter(item=>!item.worked_example),app=document.getElementById('app'),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||''),esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),norm=x=>String(x||'').toLocaleLowerCase('fil-PH').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,''),key=n=>String(n);let s=Object.assign({phase:'intro',current_scored_index:0,completed_oral_reads:[],stt_attempts:{},tts_plays:{},submitted_syllable_divisions:[],state_version:0},d.progress?.state||{}),busy=false,request=0,stream=null,audio=null,cuts=[];
const total=items.length,current=()=>Number(s.current_scored_index)||0,stop=()=>{stream?.getTracks().forEach(t=>t.stop());stream=null;if(audio){audio.pause();audio=null}},header=()=>`<p class="eyebrow">SESSION 7 · LESSON 20 AT 21 · GAWAIN 2</p><h1>${esc(d.display_title)}</h1><h2>${esc(d.title)}</h2><p class="instruction">${esc(d.instruction)}</p><div class="track" aria-label="${s.submitted_syllable_divisions.length} sa ${total} natapos"><i style="width:${s.submitted_syllable_divisions.length/total*100}%"></i></div>`;
async function save(extra={}){const mine=++request,r=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:(Number(s.state_version)||0)+1},...extra})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Hindi na-save ang progress. Subukan muli.');if(mine!==request)return null;s=j.progress.state;return j}
const divided=word=>[...word].map((letter,index)=>letter+(cuts.includes(index+1)?'•':'')).join('');
function render(message='',kind=''){if(d.progress?.activity_completed||s.phase==='completion'){app.innerHTML=`<div class="done"><div>⭐</div><h1>Magaling!</h1><p>Natapos mo ang Lesson 20 at 21: Gawain 2.</p><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`;return}const n=current(),item=items[n];if(s.phase==='intro'){app.innerHTML=header()+`<p class="hint">Tingnan ang ginawa nang halimbawa. Basahin muna ang salita bago lagyan ng tuldok ang paghahati ng pantig.</p><div class="preview">${all.map((x,index)=>`<div>${index+1}. ${esc(x.word)}<span>${x.worked_example?esc(x.example_division):'________'}</span></div>`).join('')}</div><button class="button" id="start">SIMULAN</button><p class="status ${kind}">${esc(message)}</p>`;app.querySelector('#start').onclick=async()=>{s.phase='oral_reading';try{await save();render()}catch(e){render(e.message,'bad')}};return}if(s.phase==='feedback'){const previous=items[s.submitted_syllable_divisions.length-1];app.innerHTML=header()+`<p class="status good">Tama! Magaling ang iyong pagpapantig.</p><div class="word">${esc(previous.word)}</div><div class="answer-preview">${esc(s.submitted_syllable_divisions.at(-1))}</div><button class="button" id="next">${s.submitted_syllable_divisions.length===total?'TAPUSIN':'SUSUNOD'}</button>`;app.querySelector('#next').onclick=async()=>{if(s.submitted_syllable_divisions.length===total)return finish();s.phase='oral_reading';try{await save();render()}catch(e){render(e.message,'bad')}};return}if(!item)return finish();if(s.phase==='oral_reading'){const recovery=(s.stt_attempts[key(n)]||0)>=3;app.innerHTML=header()+`<p class="hint">Salita ${n+1} sa ${total}</p><div class="word">${esc(item.word)}</div><p class="hint">${recovery?'Pakinggan muna ang salita.':'Basahin nang malakas ang salita.'}</p><button class="button ${recovery?'gold':''}" id="oral">${recovery?'🔊 Pakinggan / Read Aloud':'🎙 Basahin ngayon'}</button><p class="status ${kind}">${esc(message)}</p>`;app.querySelector('#oral').onclick=()=>recovery?listen(n):read(n);return}const made=divided(item.word);app.innerHTML=header()+`<p class="hint">Salita ${n+1} sa ${total} · I-tap ang puwang kung saan hahatiin ang pantig.</p><div class="word">${esc(item.word)}</div><div class="builder">${[...item.word].map((letter,index)=>`<span class="letter">${esc(letter)}</span>${index<item.word.length-1?`<button class="separator ${cuts.includes(index+1)?'active':''}" data-cut="${index+1}" aria-label="${cuts.includes(index+1)?'Alisin':'Lagyan'} ng tuldok pagkatapos ng ${esc(letter)}">${cuts.includes(index+1)?'•':'+'}</button>`:''}`).join('')}</div><div class="answer-preview">${esc(made||item.word)}</div><div class="tools"><button class="button" id="clear">BURAHIN</button><button class="button" id="check" ${cuts.length?'':'disabled'}>SURIIN</button></div><p class="status ${kind}">${esc(message)}</p>`;app.querySelectorAll('[data-cut]').forEach(b=>b.onclick=()=>{const c=Number(b.dataset.cut);cuts=cuts.includes(c)?cuts.filter(x=>x!==c):[...cuts,c].sort((a,b)=>a-b);render(message,kind)});app.querySelector('#clear').onclick=()=>{cuts=[];render()};app.querySelector('#check').onclick=()=>answer(made)}
async function read(n){if(busy)return;busy=true;const mine=++request,b=app.querySelector('#oral');try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono.');b.disabled=true;b.textContent='Nagbabasa...';stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});const chunks=[],blob=await new Promise((ok,bad)=>{const rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data?.size&&chunks.push(e.data);rec.onerror=()=>bad(Error('Hindi naitala ang boses.'));rec.onstop=()=>ok(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));rec.start();setTimeout(()=>rec.state==='recording'&&rec.stop(),3500)});stop();if(!blob.size)throw Error('Walang narinig na boses. Subukan muli.');if(mine!==request)return;b.textContent='Pinoproseso...';const f=new FormData();f.append('audio',blob,'session7-lesson20-21-gawain2.webm');f.append('target_text',items[n].word);f.append('language','Filipino');f.append('mode','reading');const r=await fetch(d.transcribe_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json().catch(()=>({}));if(mine!==request)return;if(!r.ok||!j.success||!norm(j.transcript).includes(norm(items[n].word)))throw Error('Hindi pa. Subukan muli.');s.completed_oral_reads=[...new Set([...s.completed_oral_reads,n])];s.stt_attempts[key(n)]=0;s.tts_plays[key(n)]=0;s.phase='syllabification';cuts=[];await save();render('Tama ang pagbasa! Lagyan ng tuldok ang paghahati ng pantig.','good')}catch(e){if(mine===request){s.stt_attempts[key(n)]=Math.min(3,(s.stt_attempts[key(n)]||0)+1);try{await save()}catch(_){}render((s.stt_attempts[key(n)]||0)>=3?'Pakinggan muna ang salita.':e.message||'Hindi nakuha ang boses. Subukan muli.','bad')}}finally{stop();busy=false}}
async function listen(n){if(busy)return;busy=true;const mine=++request,b=app.querySelector('#oral');try{b.disabled=true;b.textContent='Nilo-load...';const f=new FormData();f.append('text',items[n].word);f.append('language','Filipino');f.append('prescribed_activity_key','session-7-lesson-20-21-gawain-2');const r=await fetch(d.read_aloud_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json().catch(()=>({}));if(mine!==request)return;if(!r.ok||!j.success||j.tts_language!=='fil-PH'||j.voice_name!=='fil-PH-Wavenet-A')throw Error(j.error||'Hindi available ang Filipino audio.');b.textContent='Pinakikinggan...';audio=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(j.audio_content),c=>c.charCodeAt(0))],{type:j.mime_type||'audio/mpeg'})));await audio.play();await new Promise((ok,bad)=>{audio.onended=ok;audio.onerror=()=>bad(Error('Hindi ma-play ang audio.'))});if(mine!==request)return;s.tts_plays[key(n)]=Math.min(3,(s.tts_plays[key(n)]||0)+1);if(s.tts_plays[key(n)]===3){s.stt_attempts[key(n)]=0;s.tts_plays[key(n)]=0}s.phase='oral_reading';await save();render('Subukan mong basahin ang salita.')}catch(e){if(mine===request)render(e.message||'Hindi available ang audio. Subukan muli.','bad')}finally{busy=false}}
async function answer(value){if(busy)return;busy=true;try{const j=await save({candidate_answer:value});if(j?.accepted){s.phase='feedback';cuts=[];render()}else render('Hindi pa tama ang paghahati. Subukan muli.','bad')}catch(e){render(e.message,'bad')}finally{busy=false}}async function finish(){if(busy)return;busy=true;s.phase='completion';try{const r=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Hindi na-save ang pagtatapos. Subukan muli.');d.progress.activity_completed=true;render()}catch(e){s.phase='feedback';render(e.message,'bad')}finally{busy=false}}addEventListener('pagehide',stop);render()})();</script></body></html>
