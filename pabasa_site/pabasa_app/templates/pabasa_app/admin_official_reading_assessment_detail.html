{% extends "pabasa_app/admin_base.html" %}
{% block content %}
<div class="admin-panel">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div>
      <a class="btn btn-sm btn-outline-secondary mb-3" href="{% url 'admin_official_reading_assessments' %}"><i class="bi bi-arrow-left me-1"></i>Back</a>
      <h2 class="h4 fw-bold mb-1">{{ material.title }}</h2>
      <p class="text-secondary mb-0">Official Reading Assessment details</p>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-primary" href="{% url 'admin_official_reading_assessment_edit' material.id %}">Edit</a>
      <a class="btn btn-outline-secondary" href="{% url 'admin_official_reading_assessment_add' %}?duplicate={{ material.id }}">Duplicate</a>
    </div>
  </div>
  <div class="row g-3">
    <div class="col-12 col-md-4"><div class="bg-white border rounded-4 p-3"><div class="small text-secondary fw-bold text-uppercase">School Year</div><strong>{{ school_year_value }}</strong></div></div>
    <div class="col-12 col-md-4"><div class="bg-white border rounded-4 p-3"><div class="small text-secondary fw-bold text-uppercase">Term</div><strong>{{ material.official_term }}</strong></div></div>
    <div class="col-12 col-md-4"><div class="bg-white border rounded-4 p-3"><div class="small text-secondary fw-bold text-uppercase">Status</div><strong>{{ selected_assessment_type|title }}</strong></div></div>
  </div>
</div>
{% endblock %}
