<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sabihin ang tunog ng mga letra | PABASA</title><style>body{margin:0;background:linear-gradient(135deg,#e1f5f7,#fff3d8);color:#16465d;font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(900px,calc(100% - 28px));margin:auto;padding:20px 0}.back{display:inline-flex;padding:11px 15px;border:2px solid #bfdde4;border-radius:14px;background:#fff;color:#16465d;font-weight:900;text-decoration:none}.card{margin-top:18px;padding:clamp(22px,5vw,46px);border-radius:30px;background:#fffdf7;box-shadow:0 20px 54px #2d697326;text-align:center}.eyebrow{color:#997124;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.card h1{margin:.3rem 0 .65rem;font-size:clamp(2rem,5vw,3.2rem)}.instruction{margin:0 auto 12px;max-width:680px;color:#526e78;font-size:1.08rem;font-weight:700;line-height:1.45}.competencies{color:#526e78;font-weight:800}.track{height:12px;margin:15px auto 26px;max-width:660px;border-radius:999px;background:#dcebed;overflow:hidden}.track i{display:block;height:100%;background:#e6a33a}.item{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:24px;align-items:center;max-width:620px;margin:25px auto;padding:20px;border:1px solid #c9e6e7;border-radius:24px;background:linear-gradient(145deg,#eefafd,#fff8df)}.item img{width:100%;height:170px;object-fit:contain}.letter{display:flex;align-items:center;justify-content:center;height:150px;border:4px solid #b8cbd2;border-radius:18px;background:#fff;font-size:clamp(5rem,16vw,9rem);font-weight:900}.button{min-height:54px;padding:12px 22px;border:0;border-radius:16px;background:#1f6f8b;box-shadow:0 5px 0 #155369;color:#fff;font:inherit;font-weight:900;cursor:pointer}.button:disabled{opacity:.6}.hint{min-height:1.4em;color:#526e78;font-weight:800}.complete{padding:25px}.complete h2{font-size:2.2rem}@media(max-width:560px){.item{grid-template-columns:1fr;gap:12px}.item img{height:135px}.letter{height:120px}}</style></head><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card"></section></main>{{ lesson13_data|json_script:"lesson13-data" }}<script>
(()=>{const d=JSON.parse(document.getElementById('lesson13-data').textContent||'{}'),app=document.getElementById('app'),items=d.items||[],csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'',norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,''),saved=d.progress?.state||{};let index=Math.min(items.length,Number(d.progress?.current_index)||0),phase=saved.phase==='check'?'check':'oral',attempts=Number(saved.reading_attempts)||0,busy=false;
const save=async(extra={})=>{const r=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({completed_items:index,state:{phase,current_item:index,reading_attempts:attempts,oral_satisfied:phase==='check',...extra}})});const x=await r.json();if(!r.ok||!x.success)throw Error(x.error||'Hindi na-save ang iyong progreso.');return x};
function heading(){return `<p class="eyebrow">Session 5 · Lesson 13 · Gawain 1</p><h1>${d.title}</h1><p class="instruction">${d.instruction}</p><p class="competencies"><strong>Competencies:</strong> ${d.competencies.join(', ')}</p><div class="track"><i style="width:${index/items.length*100}%"></i></div>`}function render(){if(index>=items.length){complete();return}const i=items[index];app.innerHTML=heading()+`<div class="item"><img src="${i.image_url}" alt="Larawan ng ${i.word}"><span class="letter">${i.letter}</span></div>${phase==='oral'?`<p class="hint">Sabihin ang tunog ng letra.</p><button class="button" id="speak">🎙 Simulan</button>`:`<p class="hint">Magaling! Lagyan ng tsek kapag handa ka na.</p><button class="button" id="check">✓ Lagyan ng tsek</button>`}<p class="hint" id="status"></p>`;if(phase==='oral')document.getElementById('speak').onclick=read;else document.getElementById('check').onclick=mark}
async function read(){if(busy)return;const button=document.getElementById('speak'),status=document.getElementById('status');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Hindi available ang mikropono sa browser na ito.';return}busy=true;button.disabled=true;button.textContent='Nakikinig…';let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[],rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const blob=await new Promise(resolve=>{rec.onstop=()=>resolve(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));rec.start();setTimeout(()=>rec.state==='recording'&&rec.stop(),3500)});stream.getTracks().forEach(x=>x.stop());const form=new FormData();form.append('audio',blob,'lesson-13.webm');form.append('target_text',iLetter());form.append('language','Filipino');form.append('mode','reading');const response=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json();if(result.success&&(result.complete||norm(result.transcript).includes(norm(iLetter())))){phase='check';attempts=0;await save();render()}else{attempts++;if(attempts>=3){phase='check';attempts=0;status.textContent='Pakinggan ang tunog, pagkatapos ay lagyan ng tsek.';await save();render()}else{status.textContent=`Hindi pa. Subukan muli. (${attempts}/3)`;button.disabled=false;button.textContent='🎙 Subukang muli'}}}catch(e){status.textContent='Hindi nakuha ang iyong boses. Subukan muli.';button.disabled=false;button.textContent='🎙 Subukang muli'}finally{stream?.getTracks().forEach(x=>x.stop());busy=false}}function iLetter(){return items[index].letter}async function mark(){if(busy)return;busy=true;try{index++;phase='oral';attempts=0;await save();render()}catch(e){index--;document.getElementById('status').textContent=e.message}finally{busy=false}}async function complete(){app.innerHTML=heading()+`<div class="complete"><h2>🎉 Magaling!</h2><p class="instruction">Natapos mo ang Lesson 13: Gawain 1.</p><button class="button" id="done">Itinatala…</button><p class="hint" id="status"></p></div>`;try{await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});document.getElementById('done').textContent='✓ NATAPOS NA';document.getElementById('done').onclick=()=>location.href='{% url "assessment" %}'}catch(e){document.getElementById('done').textContent='Subukang muli';document.getElementById('done').onclick=complete}}render()})();</script></body></html>
