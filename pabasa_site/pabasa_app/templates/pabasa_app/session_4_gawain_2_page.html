<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gawain 2: Pagsamahin ang mga Tunog</title>
<style>
.completion-modal{background:#fffdf9;border:0;border-radius:26px;box-shadow:0 22px 60px #244b5b45;color:#244b5b;max-width:410px;padding:34px 30px 28px;text-align:center;width:calc(100% - 32px)}.completion-modal::backdrop{background:#244b5b66}.completion-modal h2{color:#16465d;font-size:2rem;margin:0 0 10px}.completion-modal p{color:#59737d;font-size:1.05rem;font-weight:800;line-height:1.45;margin:0 0 24px}.modal-actions{display:flex;gap:10px}.modal-actions button{border-radius:999px;cursor:pointer;font-weight:900;min-height:52px;padding:12px 14px;width:50%}.modal-back{background:#fff;border:2px solid #c7dfe2;color:#315d6b}.modal-next{background:#e5a344;border:2px solid #d58b35;color:#fff}
:root{color:#244b5b;font-family:Nunito,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#dff3f7}.page{min-height:100vh;padding:20px;position:relative;overflow:hidden}.page:before,.page:after{background:#fff3bd;border-radius:50%;content:"";height:240px;opacity:.65;position:absolute;width:240px}.page:before{left:-100px;top:17%}.page:after{background:#f8d9c8;bottom:-120px;right:-70px}.back{background:#fffdf5;border:2px solid #c7dfe2;border-radius:16px;box-shadow:0 5px 15px #39627518;color:#315d6b;display:inline-block;font-size:.92rem;font-weight:900;padding:12px 17px;position:relative;text-decoration:none;z-index:1}.activity{align-items:center;background:#fffdf9;border-radius:34px;box-shadow:0 22px 60px #3962752b;display:flex;flex-direction:column;justify-content:center;margin:clamp(18px,4vh,42px) auto 0;max-width:900px;min-height:calc(100vh - 145px);padding:clamp(24px,5vw,52px);position:relative;text-align:center;width:min(100%,900px);z-index:1}.context{color:#d58b35;font-size:.78rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.activity h1{color:#16465d;font-size:clamp(2rem,5vw,3.25rem);line-height:1.05;margin:8px 0 10px}.instruction{color:#59737d;font-size:clamp(1.05rem,2.2vw,1.3rem);font-weight:800;margin:0}.learning-card{background:linear-gradient(145deg,#eefafd,#fff8df);border:1px solid #c9e6e7;border-radius:30px;box-shadow:0 15px 30px #3962751f;margin:clamp(24px,4vh,38px) auto 20px;padding:clamp(22px,4vw,38px) clamp(20px,6vw,70px) 32px;width:min(100%,570px)}.equation{align-items:center;display:flex;gap:clamp(14px,4vw,32px);justify-content:center}.sound{background:#fff;border:2px solid #c7dfe2;border-radius:20px;color:#16465d;font-size:clamp(3.7rem,11vw,6.5rem);font-weight:900;line-height:1;padding:14px 22px}.operator{color:#d58b35;font-size:clamp(2.2rem,6vw,3.8rem);font-weight:900}.result{border-top:4px solid #e5a344;color:#16465d;font-size:clamp(4.5rem,15vw,8rem);font-weight:900;line-height:1;margin:25px auto 30px;padding-top:20px}.start-reading{align-items:center;background:#1f6f8b;border:0;border-radius:999px;box-shadow:0 8px 0 #16566d,0 14px 22px #1f6f8b35;color:#fff;cursor:pointer;display:inline-flex;font-size:clamp(1rem,2vw,1.2rem);font-weight:900;gap:10px;justify-content:center;min-height:58px;padding:14px 30px;width:100%}.start-reading.recording{background:#d85e55;box-shadow:0 8px 0 #a9413c,0 14px 22px #d85e5535}.start-reading:hover,.start-reading:focus-visible{background:#277e9b;outline:3px solid #f1c36a;outline-offset:3px}.actions{display:flex;gap:10px}.secondary-action{background:#fff;border:2px solid #c7dfe2;border-radius:999px;color:#315d6b;cursor:pointer;font-weight:900;min-height:54px;padding:12px 16px;width:50%}.primary-next{background:#e5a344;border-color:#d58b35;color:#fff}.message{color:#b34e47;font-size:.9rem;font-weight:800;margin:13px 0 0;min-height:1.35em}.footer{align-items:center;color:#59737d;display:flex;font-size:1rem;font-weight:900;gap:14px;justify-content:center}.dots{display:flex;gap:8px}.dots i{background:#c7dfe2;border-radius:50%;height:12px;width:12px}.dots i.active{background:#e5a344}@media(max-width:560px){.page{padding:12px}.activity{border-radius:25px;margin-top:12px;min-height:calc(100vh - 100px);padding:24px 18px}.learning-card{margin-top:26px}.equation{gap:8px}.sound{padding:12px 14px}}
</style></head>
<body><div class="page"><a class="back" href="{% url 'assessment' %}">← BUMALIK SA AKING ARALIN</a><main class="activity"><div class="context">Session 4 · Lessons 10, 11, at 12</div><h1>Gawain 2: Pagsamahin ang mga Tunog</h1><p class="instruction">Pagsamahin ang mga tunog upang mabasa ang pantig.</p><section class="learning-card" aria-label="b plus u equals bu"><div class="equation"><span class="sound" id="firstSound">b</span><span class="operator">+</span><span class="sound" id="secondSound">u</span></div><div class="result" id="result">bu</div><div id="controls"><button class="start-reading" id="recordButton" type="button"><span aria-hidden="true">🎙</span> SIMULAN</button></div><p class="message" id="message" role="status" aria-live="polite"></p></section><div class="footer"><span id="progressText">1 of 4</span><span class="dots" id="dots" aria-label="1 of 4"><i class="active"></i><i></i><i></i><i></i></span></div></main></div>
<dialog class="completion-modal" id="completionModal" aria-labelledby="completionTitle"><h2 id="completionTitle">🎉 Magaling!</h2><p>Tapos na ang Gawain 2!<br>Handa ka na para sa Gawain 3.</p><div class="modal-actions"><button class="modal-back" id="modalBack" type="button">BALIK</button><button class="modal-next" id="modalNext" type="button">TULOY SA GAWAIN 3</button></div></dialog>
<script>
(()=>{const items=[['b','u','bu'],['m','u','mu'],['u','b','ub'],['u','m','um']];let index=0,recorder=null,stream=null,chunks=[],recordings=[];const first=document.getElementById('firstSound'),second=document.getElementById('secondSound'),result=document.getElementById('result'),controls=document.getElementById('controls'),message=document.getElementById('message'),progress=document.getElementById('progressText'),dots=document.getElementById('dots');const msg=t=>{message.textContent=t||''};const stopStream=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};const render=()=>{const item=items[index];first.textContent=item[0];second.textContent=item[1];result.textContent=item[2];progress.textContent=`${index+1} of 4`;dots.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('active',i===index));controls.innerHTML='<button class="start-reading" id="recordButton" type="button"><span aria-hidden="true">🎙</span> SIMULAN</button>';msg('');document.getElementById('recordButton').addEventListener('click',toggle)};const actions=()=>{controls.innerHTML=`<div class="actions"><button class="secondary-action" id="repeat" type="button">ULITIN</button><button class="secondary-action primary-next" id="next" type="button">${index===3?'TAPUSIN ANG GAWAIN':'SUNOD NA PANTIG'}</button></div>`;document.getElementById('repeat').onclick=()=>{recordings[index]=null;recorder=null;chunks=[];stopStream();render()};document.getElementById('next').onclick=()=>{if(index===3){location.href='{% url "assessment" %}';return}index++;render()}};const start=async()=>{const button=document.getElementById('recordButton');if(!window.MediaRecorder||!navigator.mediaDevices?.getUserMedia){msg('Hindi available ang voice recording sa device na ito.');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{recordings[index]=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});stopStream();actions()};recorder.start();button.classList.add('recording');button.innerHTML='<span aria-hidden="true">🔴</span> NAG-RE-RECORD...';msg('Sabihin ang pantig na nakikita.')}catch(e){stopStream();msg('Hindi mabuksan ang mikropono. Subukan muli.')}};const toggle=()=>{if(recorder?.state==='recording')recorder.stop();else start()};document.getElementById('recordButton').onclick=toggle;window.addEventListener('pagehide',stopStream);})();
</script><script>
document.addEventListener('click', function(event) {
    if (event.target.id !== 'next' || !document.getElementById('next')?.textContent.includes('TAPUSIN')) return;
    event.preventDefault(); event.stopImmediatePropagation(); document.getElementById('completionModal').showModal();
}, true);
document.getElementById('modalBack').onclick = () => document.getElementById('completionModal').close();
document.getElementById('modalNext').onclick = () => { location.href = '{% url "session_4_gawain_3_page" %}'; };
</script></body></html>
