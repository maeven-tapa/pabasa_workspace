(function () {
  function updateAnswerEmojis() {

    const right = document.querySelector('.hand[data-a="right"]');
    if (left && left.firstChild) left.firstChild.nodeValue = '✋';
    if (right && right.firstChild) right.firstChild.nodeValue = '🤚';

<script type="text/plain" data-activity-bootstrap="lesson-2-gawain-1">
(function(){
  if(window.salitangDedicatedFlow)return;
  const stage=document.getElementById('stage');
  if(!stage)return;
  const phase2Text='Magkatunog ba ang dalawang larawan na ito? Pindutin ang nawawastong sagot.';
  const phase2ChoiceText='Piliin ang tamang kamay.';
  const csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';
  let generation=0, speaking=false, lastPhase2='', lastPhase1='', currentAudio=null;
  const speak=async text=>{
    const id=++generation;
    if(currentAudio){currentAudio.pause();currentAudio=null;}
    const response=await fetch('{% url "reading_read_aloud_api" %}',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-CSRFToken':csrf()},body:new URLSearchParams({target_text:text,language:'Filipino',mode:'word'})});
    const data=await response.json();
    if(id!==generation||!response.ok||!data.success||!data.audio_content)return;
    currentAudio=new Audio('data:'+(data.mime_type||'audio/mpeg')+';base64,'+data.audio_content);
    await new Promise((resolve,reject)=>{currentAudio.onended=resolve;currentAudio.onerror=reject;currentAudio.play().catch(reject)});
    if(id===generation)currentAudio=null;
  };
  const phase1=async()=>{
    if(speaking||stage.querySelector('#answers:not([hidden])'))return;
    const pair=stage.querySelector('.pair'), instruction=stage.querySelector('.prompt'), read=stage.querySelector('#read');
    if(!pair||!instruction||!read)return;
    const currentPair=stage.querySelector('.progress')?.textContent||'';
    const isNextPicture=lastPhase1.startsWith(currentPair+'|') && lastPhase1!==currentPair+'|'+(stage.querySelector('.word img')?.getAttribute('alt')||'');
    speaking=true; pair.classList.add('naming-phase'); pair.classList.remove('phase2'); pair.querySelectorAll('.word').forEach(card=>card.classList.remove('active')); read.disabled=true;
    try{if(isNextPicture)await speak('Magaling! Susunod na larawan.');else await speak(instruction.textContent.trim()); pair.querySelectorAll('.word')[document.querySelectorAll('.word').length>1&&stage.querySelector('.word:first-child')?.classList.contains('done')?1:0]?.classList.add('active'); await speak('Basahin ito.')}catch(error){console.error('Salitang Magkatugma Phase 1 TTS failed',error); pair.querySelectorAll('.word')[0]?.classList.add('active')}
    speaking=false; if(stage.contains(read))read.disabled=false;
  };
  const sync=()=>{
    const answers=stage.querySelector('#answers:not([hidden])'), instruction=stage.querySelector('.prompt'), pair=stage.querySelector('.pair');
    const status=stage.querySelector('#status');
    if(!speaking&&status&&status.classList.contains('warning')&&status.textContent.trim()!=='Hindi ito ang tamang sagot. Subukan natin muli.'&&!status.textContent.trim().startsWith('Hindi pa ito tama. Subukan muli.')){
      status.textContent='Hindi ito ang tamang sagot. Subukan natin muli.';
      speak('Hindi ito ang tamang sagot. Subukan natin muli.').catch(()=>{});
    }
    if(answers){
      if(instruction)instruction.textContent=phase2Text,instruction.classList.add('phase2-instruction');
      pair?.classList.remove('naming-phase'); pair?.classList.add('phase2');
      const key=stage.querySelector('.progress')?.textContent||'';
      if(key!==lastPhase2){lastPhase2=key;speaking=true;answers.querySelectorAll('button').forEach(b=>b.disabled=true);speak(phase2Text).then(()=>speak(phase2ChoiceText)).catch(()=>{}).finally(()=>{speaking=false;answers.querySelectorAll('button').forEach(b=>b.disabled=false)})}
      return;
    }
    lastPhase2='';
    if(instruction)instruction.classList.remove('phase2-instruction');
    const pairKey=(stage.querySelector('.progress')?.textContent||'')+'|'+(stage.querySelector('.word img')?.getAttribute('alt')||'');
    if(pairKey!==lastPhase1){lastPhase1=pairKey;phase1();}
  };
  new MutationObserver(()=>setTimeout(sync,0)).observe(stage,{childList:true,subtree:true,characterData:true});
  setTimeout(sync,50);
})();
</script>

<script type="text/plain" data-activity-bootstrap="lesson-2-gawain-1">
(function () {
  const originalFetch = window.fetch;
  window.fetch = async function (...args) {
    const response = await originalFetch.apply(this, args);
    if (String(args[0]).includes('reading_transcribe_api')) {
      const data = await response.clone().json();
      if (!Object.prototype.hasOwnProperty.call(data, 'raw_transcript')) {
        data.success = false;
        return new Response(JSON.stringify(data), {status: response.status, headers: {'Content-Type': 'application/json'}});
      }
    }
    return response;
  };
  function enforceAnswerState() {
    const answers = document.querySelector('#answers');
    const status = document.querySelector('#status');
    if (!answers || !status) return;
    const inPartTwo = document.getElementById('read')?.hidden === true;
    const allowed = inPartTwo || (!status.classList.contains('warning') && status.textContent.trim() === 'Piliin ang tamang kamay.');
    if (!allowed) {
      answers.hidden = true;
      answers.querySelectorAll('button').forEach(button => { button.disabled = true; });
    }
  }
  const stage = document.getElementById('stage');
  if (stage) new MutationObserver(enforceAnswerState).observe(stage, {childList: true, subtree: true, characterData: true});
  enforceAnswerState();
}());
</script>
