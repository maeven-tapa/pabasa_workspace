{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salitang Magkatugma</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#e9f6f0;color:#093f50;font-family:Arial,sans-serif}.app{height:100dvh;max-width:1200px;margin:auto;padding:12px;display:grid;grid-template-rows:auto 1fr;gap:12px}.head{display:flex;align-items:center;justify-content:space-between;background:#fffdf5;border:3px solid #fff;border-radius:22px;padding:10px 16px;box-shadow:0 6px #b8dbd1}.back{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;border:2px solid #b5d8d1;border-radius:26px;color:#093f50;font-weight:900;text-decoration:none}.progress{font-weight:900}.progress:after{content:' ★ ★ ★ ★ ★';color:#e6a33a}.stage{min-height:0;display:grid;place-items:center}.card{width:100%;height:100%;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#e9f8e8,#b9e2d4);border:4px solid #fff;border-radius:32px;box-shadow:0 18px 43px #164f5538;text-align:center}.activity-header-card{width:min(900px,100%);margin-bottom:12px;padding:12px 18px;background:#fff;border:1px solid #dbe5e8;border-radius:16px;box-shadow:0 8px 18px #0f172a14}.prompt{margin:0;color:#064e3b;font-size:clamp(1rem,2.4vw,1.35rem);font-weight:700}.pair{width:min(900px,100%);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(12px,4vw,42px)}.word{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:clamp(160px,30vh,250px);padding:12px;background:#fffdf5;border:3px solid #d4ebe1;border-radius:20px;box-shadow:0 10px 20px #0000000f}.word:first-child{border:5px solid #e6a33a;box-shadow:0 0 0 4px #fff4c7,0 10px 20px #0000000f,0 0 24px #e6a33a4d}.word:first-child:after{content:'Napili';color:#9a6814;font-size:.75rem;font-weight:900}.word img{height:clamp(90px,18vh,155px);max-width:90%;object-fit:contain}.word strong{font-size:clamp(1.7rem,4.5vw,2.9rem);margin-top:6px}.connector{display:flex;align-items:center;justify-content:center;width:64px;height:64px;padding:4px;background:#fff4c7;border:3px solid #f0c65d;border-radius:50%;box-shadow:0 5px #c9942c;font-size:.8rem;font-weight:900;text-align:center}.status{min-height:24px;font-weight:900}.status.warning{padding:8px 16px;background:#fef3c7;border-radius:12px;color:#92400e}.read-btn,.listen,.hand{min-height:52px;border-radius:26px;padding:12px 22px;border:0;cursor:pointer;font:inherit;font-weight:900}.read-btn{background:#126d75;color:#fff;box-shadow:0 6px #0e4b50}.read-btn.is-recording{animation:pulse 1.1s infinite}.listen{margin-top:10px;background:#fffaf0;border:2px solid #eadbb4;color:#536a6b}.answers{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:18px}.hand{min-width:210px;min-height:130px;background:#fffdf5;border:3px solid #1a6f78;border-radius:20px;box-shadow:0 6px #2f7d68;font-size:clamp(2rem,5vw,3.3rem)}.hand small{display:block;font-size:1rem}@keyframes pulse{50%{box-shadow:0 0 0 14px #ef5c4500,0 0 24px #ef5c4580,0 6px #0e4b50}}@media(max-width:600px){.head{flex-wrap:wrap}.progress{width:100%;text-align:center}.pair{gap:6px}.word{min-height:145px;padding:6px}.word img{height:100px}.word strong{font-size:1.35rem}.hand{min-width:145px}}</style><style>.complete-done{display:block;margin:18px auto 0;min-width:150px;padding:12px 24px;border:0;border-radius:18px;background:#126d75;color:#fff;font:900 1rem Arial,sans-serif;box-shadow:0 5px #0e4b50;cursor:pointer}.complete-done:disabled{opacity:.65;cursor:wait}.complete-error{color:#a33b35;font-weight:700}</style><style>.read-btn.is-recording,.read.is-recording{animation:lesson3ListeningPulse 1.4s ease-in-out infinite;box-shadow:0 0 0 5px rgba(244,200,93,.3),0 6px #0e4b50}.read-btn.is-processing,.read.is-processing{cursor:wait}.read-btn.is-processing::before,.read.is-processing::before{content:"";display:inline-block;width:14px;height:14px;margin-right:8px;border:2px solid #ffffff73;border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:lesson3Spin .8s linear infinite}@keyframes lesson3ListeningPulse{50%{box-shadow:0 0 0 10px #f4c85d00,0 0 22px #f4c85db3,0 6px #0e4b50}}@keyframes lesson3Spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.read-btn.is-recording,.read.is-recording{animation:none}}</style></head><body><main class="app"><header class="head"><a class="back" href="{% url 'assessment' %}">← Bumalik</a><strong>Salitang Magkatugma</strong><span class="progress" id="progress">Pares 1 / 5</span></header><section class="stage" id="stage"></section></main><script>
const pairs=[['aso','laso'],['bundok','sandok'],['tatay','nanay'],['bola','lola'],['pusa','tasa']],base="{% static 'pabasa_app/images/salitang_magkatugma/' %}";let pi=Number(localStorage.getItem('pabasa:lesson-2-gawain-1:progress')||0),wi=0,ra=[0,0],la=[0,0],aa=0,busy=false;const stage=document.getElementById('stage'),norm=x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fil-PH';u.rate=.85;speechSynthesis.speak(u)}function render(){if(pi===pairs.length){stage.innerHTML='<article class="card"><h1>Magaling! Natapos mo ang gawain!</h1></article>';return}const p=pairs[pi],w=p[wi];document.getElementById('progress').textContent=`Pares ${pi+1} / ${pairs.length}`;stage.innerHTML=`<article class="card"><div class="activity-header-card"><p class="prompt">Magkatugma ba ang dalawang salitang ito?</p></div><div class="pair">${p.map((x,i)=>`<div class="word ${i===wi?'active ':''}${i<wi?'done':''}"><img src="${base}${x}.png" alt="${x}"><strong>${x[0].toUpperCase()+x.slice(1)}</strong></div>`).join('<span class="connector">Magkatugma?</span>')}</div><p class="status" id="status">Basahin ang ${w}.</p><button class="read-btn" id="read">Basahin ngayon</button><button class="listen" id="listen" hidden>🔊 Basahin nang malakas</button><div class="answers" id="answers" hidden><button class="hand" data-a="left">👈<small>Hindi magkatugma</small></button><button class="hand" data-a="right">👉<small>Magkatugma</small></button></div></article>`;read.onclick=record;listen.onclick=()=>{la[wi]++;speak(w);if(la[wi]>=3)listen.hidden=true};document.querySelectorAll('.hand').forEach(x=>x.onclick=()=>answer(x.dataset.a))}async function record(){if(busy)return;const b=document.getElementById('read'),s=document.getElementById('status');if(!navigator.mediaDevices?.getUserMedia||!MediaRecorder){s.textContent='Hindi available ang mikropono sa browser na ito.';s.classList.add('warning');return}busy=true;b.disabled=true;b.classList.add('is-recording');b.setAttribute('aria-busy','false');b.textContent='Nagbabasa...';let stream,ch=[];try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const r=new MediaRecorder(stream);r.ondataavailable=e=>e.data.size&&ch.push(e.data);const done=new Promise(ok=>r.onstop=()=>ok(new Blob(ch,{type:r.mimeType||'audio/webm'})));r.start();setTimeout(()=>r.state==='recording'&&r.stop(),3500);const blob=await done;stream.getTracks().forEach(x=>x.stop());b.classList.remove('is-recording');b.classList.add('is-processing');b.setAttribute('aria-busy','true');b.textContent='Pinoproseso...';const fd=new FormData();fd.append('audio',blob,'rhyme.webm');fd.append('target_text',pairs[pi][wi]);fd.append('language','Filipino');fd.append('mode','reading');const data=await (await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''},body:fd})).json();if(data.success&&norm(data.transcript).includes(norm(pairs[pi][wi]))){wi++;if(wi===2){document.getElementById('answers').hidden=false;b.hidden=true;s.textContent='Piliin ang tamang kamay.'}else render()}else{ra[wi]++;s.textContent=`Hindi pa. Subukan muli. (${ra[wi]}/3)`;s.classList.add('warning');if(ra[wi]>=3)listen.hidden=false;b.classList.remove('is-recording','is-processing');b.removeAttribute('aria-busy');b.disabled=false;b.textContent='Basahin ngayon'}}catch(e){s.textContent='Hindi nakuha ang iyong boses. Subukan muli.';s.classList.add('warning');b.classList.remove('is-recording','is-processing');b.removeAttribute('aria-busy');b.disabled=false;b.textContent='Basahin ngayon'}finally{busy=false;b.classList.remove('is-recording')}}function answer(a){if(a==='right'){pi++;localStorage.setItem('pabasa:lesson-2-gawain-1:progress',String(pi));fetch(lesson2ProgressUrl,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''},body:JSON.stringify({activity_key:'lesson-2-gawain-1',current_index:pi,completed_items:pi,correct_items:pi,total_items:5,activity_completed:false})}).catch(console.error);wi=0;ra=[0,0];la=[0,0];aa=0;render()}else{aa++;if(aa>=3){aa=0;wi=0;ra=[0,0];la=[0,0];render()}else{const s=document.getElementById('status');s.textContent=`Subukan muli. (${aa}/3)`;s.classList.add('warning')}}}render();</script><script>new MutationObserver(()=>{const card=document.querySelector('.completion-card');if(!card||card.querySelector('.complete-done'))return;const b=document.createElement('button');b.className='complete-done';b.type='button';b.textContent='Done';card.append(b);b.onclick=async()=>{b.disabled=true;b.textContent='Saving...';try{const r=await fetch(lesson2ProgressUrl,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''},body:JSON.stringify({activity_key:'lesson-2-gawain-1',current_index:5,completed_items:5,correct_items:5,total_items:5,activity_completed:true})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'save failed');location.href="{% url 'assessment' %}"}catch(e){console.error('Lesson 2 completion save failed',e);b.disabled=false;b.textContent='Done';let p=document.createElement('p');p.className='complete-error';p.textContent='Hindi na-save ang progress. Subukan muli.';card.append(p)}}}).observe(document.getElementById('stage'),{childList:true,subtree:true});</script></body></html>

<script>(function(){const key='pabasa:salitang-magkatugma:completed';const stage=document.getElementById('stage');if(!stage)return;function show(){stage.innerHTML='<article class="card completion-card"><div aria-hidden="true" style="font-size:3rem">🎉</div><h1>Magaling! Natapos mo ang gawain!</h1><p>Natapos mo na ang lahat ng 5 pares.</p><a href="{% url 'assessment' %}">Bumalik sa mga Gawain</a></article>';document.getElementById('progress').textContent='Pares 5 / 5';document.getElementById('progress').className='progress progress-step-5'}if(localStorage.getItem(key)==='true'){show();return}new MutationObserver(function(){if(stage.querySelector('.card h1')?.textContent.includes('Magaling!')){localStorage.setItem(key,'true');show()}}).observe(stage,{childList:true,subtree:true})})();</script>
<script>(function(){const p=document.getElementById('progress');if(!p)return;function sync(){const m=p.textContent.match(/Pares\s+(\d+)\s*\/\s*5/);if(m)p.className=`progress progress-step-${m[1]}`}new MutationObserver(sync).observe(p,{childList:true,subtree:true,characterData:true});sync()})();</script>
