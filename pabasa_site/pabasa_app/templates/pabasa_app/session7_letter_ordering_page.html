<style>:root{--ink:#16465d;--blue:#197b99;--gold:#d98c27;--good:#278750;--bad:#ad3c3c;--line:#bfdde4}*{box-sizing:border-box}body{margin:0;background:#eaf7f7;color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(760px,calc(100% - 24px));margin:auto;padding:16px 0}.back{color:var(--ink);font-weight:900;text-decoration:none}.card{min-height:calc(100vh - 58px);margin-top:12px;padding:clamp(20px,5vw,42px);border-radius:28px;background:#fffdf7;text-align:center;box-shadow:0 18px 45px #24545d18}.eyebrow{color:#997124;font-size:.82rem;font-weight:900;letter-spacing:.08em}.instruction,.hint{color:#526e78;font-weight:700}.track{height:11px;max-width:620px;margin:14px auto 22px;background:#dcebea;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#197b99,#72c8d5)}.picture{width:min(330px,100%);height:235px;margin:16px auto;padding:12px;border:3px solid var(--line);border-radius:22px;background:#fff;object-fit:contain}.button{min-height:52px;margin:8px;padding:12px 24px;border:0;border-radius:15px;background:var(--blue);box-shadow:0 4px 0 #155369;color:#fff;font:900 1rem inherit;cursor:pointer}.button.gold{background:var(--gold);box-shadow:0 4px 0 #a96c1e}.button:disabled,.tile:disabled{opacity:.6;cursor:wait}.word{font-size:clamp(2.4rem,9vw,5rem);font-weight:1000;letter-spacing:.08em}.slots,.tiles{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:16px auto}.slot,.tile{width:clamp(42px,11vw,62px);height:clamp(48px,12vw,70px);display:grid;place-items:center;border-radius:13px;font:1000 clamp(1.45rem,6vw,2.2rem) inherit;text-transform:lowercase}.slot{border:3px dashed #7ba6b3;background:#fff;font-size:clamp(1.85rem,7vw,2.55rem)}.tile{border:3px solid #5a9fb2;background:#dff4f7;color:var(--ink);box-shadow:0 3px 0 #4c8ba0;cursor:pointer;font-size:clamp(1.85rem,7vw,2.55rem)}.tile:focus-visible,.button:focus-visible{outline:4px solid #f1bf45;outline-offset:3px}.tile.used{visibility:hidden}.status{min-height:30px;font-weight:900}.good{color:var(--good)}.bad{color:var(--bad)}.intro-art{display:flex;justify-content:center;gap:8px;margin:22px auto;flex-wrap:wrap}.intro-art img{height:64px;width:78px;object-fit:contain}.done{padding-top:12vh}@media(max-width:450px){.card{padding:18px 12px}.button{margin:6px;padding:11px 15px}}</style></head>
<body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card" aria-live="polite"></section></main>{{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
<script>(()=>{'use strict';const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),items=d.items||[],app=document.getElementById('app'),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||''),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),norm=v=>String(v||'').toLocaleLowerCase('fil-PH').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');let s=Object.assign({phase:'intro',current_item_index:0,completed_oral_reads:[],stt_attempt_counts:{},tts_play_counts:{},selected_tile_order:[],completed_correct_words:[],completed_item_count:0,correct_answer_count:0,state_version:0},d.progress?.state||{}),busy=false,request=0,stream=null,audio=null;
const total=items.length,current=()=>Number(s.current_item_index)||0,stop=()=>{stream?.getTracks().forEach(t=>t.stop());stream=null;if(audio){audio.pause();audio=null}},progress=()=>Math.min(total*2,s.completed_correct_words.length*2+(s.completed_oral_reads.includes(current())?1:0)),head=()=>`<p class="eyebrow">SESSION 7 · LESSON 19 · GAWAIN 4</p><h1>${esc(d.display_title)}</h1><h2>${esc(d.title)}</h2><p class="instruction">${esc(d.instruction)}</p><div class="track" aria-label="Pag-unlad"><i style="width:${total?progress()/(total*2)*100:0}%"></i></div>`,picture=item=>`<img class="picture" src="${esc(item.image_url)}" alt="${esc(item.alt_text)}">`;
async function save(extra={}){const mine=++request,body={state:{...s,state_version:(Number(s.state_version)||0)+1},...extra},r=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Hindi na-save ang progress. Subukan muli.');if(mine!==request)return null;s=j.progress.state;return j}
function render(message='',kind=''){if(d.progress?.activity_completed||s.phase==='completion'){app.innerHTML=`<div class="done"><div>⭐</div><h1>Magaling!</h1><p>Natapos mo ang Lesson 19: Gawain 4.</p><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`;return}const n=current(),item=items[n];if(s.phase==='intro'){app.innerHTML=head()+`<p class="hint">Basahin muna ang salita bago ayusin ang mga letra.</p><div class="intro-art">${items.map(x=>`<img src="${esc(x.image_url)}" alt="${esc(x.alt_text)}">`).join('')}</div><button class="button" id="start" type="button">SIMULAN</button><p class="status ${kind}">${esc(message)}</p>`;const start=app.querySelector('#start');start.onclick=async()=>{if(busy)return;busy=true;s.phase='oral_reading';try{await save();render()}catch(e){render(e.message,'bad')}finally{busy=false}};return}if(s.phase==='feedback'){const previous=items[s.completed_correct_words.length-1];app.innerHTML=head()+picture(previous)+`<p class="status good">Tama! Magaling ang iyong sagot.</p><div class="word">${esc(previous.answer)}</div><button class="button" id="next" type="button">${s.completed_correct_words.length===total?'TAPUSIN':'SUSUNOD'}</button>`;app.querySelector('#next').onclick=async()=>{if(s.completed_correct_words.length===total)return finish();s.current_item_index=s.completed_correct_words.length;s.phase='oral_reading';try{await save();render()}catch(e){render(e.message,'bad')}};return}if(!item)return finish();if(s.phase==='oral_reading'){const failed=s.stt_attempt_counts[String(n)]||0,plays=s.tts_play_counts[String(n)]||0,recovery=failed>=3;app.innerHTML=head()+`<p class="hint">Larawan ${n+1} sa ${total}</p>${picture(item)}<div class="word">${esc(item.word)}</div><p class="hint">${recovery?`Pakinggan muna ang salita. (${plays}/3)`: 'Basahin nang malakas ang buong salita.'}</p><button class="button ${recovery?'gold':''}" id="oral" type="button">${recovery?'🔊 Pakinggan muna':'🎙 Basahin ngayon'}</button><p class="status ${kind}">${esc(message)}</p>`;const oral=app.querySelector('#oral');oral.onclick=()=>recovery?listen(n,item,oral):read(n,item,oral);return}const selected=s.selected_tile_order||[],available=item.scrambled_letters.slice(),used=[];selected.forEach(letter=>{const i=available.indexOf(letter);if(i>=0){available[i]=null;used.push(i)}});app.innerHTML=head()+`<p class="hint">Larawan ${n+1} sa ${total}</p>${picture(item)}<p class="hint">Ayusin ang mga letra upang mabuo ang salita.</p><div class="slots" aria-label="Nabubuong salita">${item.answer.split('').map((_,i)=>`<span class="slot">${esc(selected[i]||'')}</span>`).join('')}</div><div class="tiles" aria-label="Mga letrang pipiliin">${item.scrambled_letters.map((letter,i)=>`<button class="tile ${used.includes(i)?'used':''}" type="button" data-tile="${i}" ${used.includes(i)?'disabled':''} aria-label="Idagdag ang letrang ${esc(letter)}">${esc(letter)}</button>`).join('')}</div><div><button class="button" id="remove" type="button" ${selected.length?'':'disabled'}>ALISIN</button><button class="button" id="reset" type="button" ${selected.length?'':'disabled'}>ULITIN</button>${selected.length===item.answer.length?'<button class="button gold" id="check" type="button">SURIIN</button>':''}</div><p class="status ${kind}">${esc(message)}</p>`;app.querySelectorAll('[data-tile]').forEach(button=>button.onclick=async()=>{if(busy)return;s.selected_tile_order=[...selected,item.scrambled_letters[Number(button.dataset.tile)]];busy=true;try{await save();render()}catch(e){render(e.message,'bad')}finally{busy=false}});app.querySelector('#remove').onclick=async()=>{s.selected_tile_order=selected.slice(0,-1);try{await save();render()}catch(e){render(e.message,'bad')}};app.querySelector('#reset').onclick=async()=>{s.selected_tile_order=[];try{await save();render()}catch(e){render(e.message,'bad')}};const check=app.querySelector('#check');if(check)check.onclick=()=>answer(selected);}
async function read(n,item,button){if(busy)return;busy=true;const mine=++request;try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono.');button.disabled=true;button.textContent='Nagbabasa...';stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[],rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const blob=await new Promise(ok=>{rec.onstop=()=>ok(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));rec.start();setTimeout(()=>rec.state==='recording'&&rec.stop(),3500)});stop();if(mine!==request)return;button.textContent='Pinoproseso...';const f=new FormData();f.append('audio',blob,'session7-lesson19-gawain4.webm');f.append('target_text',item.word);f.append('language','Filipino');f.append('mode','reading');const r=await fetch(d.transcribe_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json().catch(()=>({}));if(mine!==request)return;if(!r.ok||!j.success||!norm(j.transcript).includes(norm(item.word)))throw Error('Hindi pa. Subukan muli.');s.completed_oral_reads=[...new Set([...s.completed_oral_reads,n])];s.stt_attempt_counts[String(n)]=0;s.tts_play_counts[String(n)]=0;s.phase='letter_ordering';await save();render('Tama ang pagbasa! Ayusin naman ang mga letra.','good')}catch(e){if(mine===request){s.stt_attempt_counts[String(n)]=Math.min(3,(s.stt_attempt_counts[String(n)]||0)+1);try{await save()}catch(_){}render((s.stt_attempt_counts[String(n)]||0)>=3?'Pakinggan muna ang salita.':e.message||'Hindi nakuha ang boses. Subukan muli.','bad')}}finally{stop();busy=false}}
async function listen(n,item,button){if(busy)return;busy=true;const mine=++request;try{button.disabled=true;button.textContent='Nilo-load...';const f=new FormData();f.append('text',item.word);f.append('language','Filipino');f.append('prescribed_activity_key','session-7-lesson-19-gawain-4');const r=await fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json().catch(()=>({}));if(mine!==request)return;if(!r.ok||!j.success||j.tts_language!=='fil-PH'||j.voice_name!=='fil-PH-Wavenet-A')throw Error(j.error||'Hindi available ang Filipino audio.');button.textContent='Pinakikinggan...';audio=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(j.audio_content),c=>c.charCodeAt(0))],{type:j.mime_type||'audio/mpeg'})));await audio.play();await new Promise((ok,bad)=>{audio.onended=ok;audio.onerror=()=>bad(Error('Hindi ma-play ang audio.'))});if(mine!==request)return;s.tts_play_counts[String(n)]=Math.min(3,(s.tts_play_counts[String(n)]||0)+1);if(s.tts_play_counts[String(n)]===3){s.stt_attempt_counts[String(n)]=0;s.tts_play_counts[String(n)]=0}s.phase='oral_reading';await save();render('Subukan mong basahin ang salita.')}catch(e){if(mine===request)render(e.message||'Hindi available ang audio. Subukan muli.','bad')}finally{busy=false}}
async function answer(selected){if(busy)return;busy=true;try{const j=await save({candidate_answer:selected});if(j?.accepted){s.phase='feedback';render()}else{ s.selected_tile_order=[];render('Subukan muli.','bad')}}catch(e){render(e.message,'bad')}finally{busy=false}}async function finish(){if(busy)return;busy=true;s.phase='completion';app.innerHTML=head()+'<p class="hint">Itinatala ang iyong natapos na gawain...</p>';try{const r=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Hindi na-save ang pagtatapos.');d.progress.activity_completed=true;render()}catch(e){s.phase='feedback';render(e.message,'bad');const retry=document.createElement('button');retry.className='button';retry.textContent='SUBUKANG MULI';retry.onclick=finish;app.querySelector('.status')?.after(retry)}finally{busy=false}}addEventListener('pagehide',()=>{request++;stop()});render()})();</script></body></html>
