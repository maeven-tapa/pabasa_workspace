<body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card" aria-live="polite"></section></main>{{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
<script>(()=>{'use strict';const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),items=d.items||[],app=document.getElementById('app'),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||''),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),norm=v=>String(v||'').toLocaleLowerCase('fil-PH').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');let s=Object.assign({phase:'intro',current_item_index:0,completed_oral_reads:[],stt_attempt_counts:{},tts_play_counts:{},selected_tile_order:[],completed_correct_words:[],completed_item_count:0,correct_answer_count:0,state_version:0},d.progress?.state||{}),busy=false,request=0,stream=null,audio=null;

let lastNarratedScreen='';
async function narrate(text){if(!text||!d.read_aloud_url)return;const mine=(window.lesson19NarrationRequest||0)+1;window.lesson19NarrationRequest=mine;window.lesson19NarrationAudio?.pause();window.lesson19NarrationAudio=null;const f=new FormData();f.append('text',text);f.append('language','Filipino');f.append('prescribed_activity_key',d.activity_key);try{const r=await fetch(d.read_aloud_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json().catch(()=>({}));if(mine!==window.lesson19NarrationRequest||!r.ok||!j.success||j.tts_language!=='fil-PH'||j.voice_name!=='fil-PH-Wavenet-A')return;const audioData=Uint8Array.from(atob(j.audio_content),c=>c.charCodeAt(0));window.lesson19NarrationAudio=new Audio(URL.createObjectURL(new Blob([audioData],{type:j.mime_type||'audio/mpeg'})));window.lesson19NarrationAudio.onended=()=>{if(mine===window.lesson19NarrationRequest)window.lesson19NarrationAudio=null};await window.lesson19NarrationAudio.play()}catch(error){const status=app.querySelector('.status');if(status)status.textContent=error.message||'Hindi available ang Filipino audio.'}}

function render(message='',kind=''){

if(d.progress?.activity_completed||s.phase==='completion'){app.innerHTML=`<div class="done"><div>⭐</div><h1>Magaling!</h1><p>Natapos mo ang Lesson 19: Gawain 4.</p><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`;return}const n=current(),item=items[n];if(s.phase==='intro'){app.innerHTML=head()+`<p class="hint">Basahin muna ang salita bago ayusin ang mga letra.</p><div class="intro-art">${items.map(x=>`<img src="${esc(x.image_url)}" alt="${esc(x.alt_text)}">`).join('')}</div><button class="button" id="start" type="button">SIMULAN</button><p class="status ${kind}">${esc(message)}</p>`;const start=app.querySelector('#start');start.onclick=async()=>{if(busy)return;busy=true;s.phase='oral_reading';try{await save();render()}catch(e){render(e.message,'bad')}finally{busy=false}};return}if(s.phase==='feedback'){const previous=items[s.completed_correct_words.length-1];app.innerHTML=head()+picture(previous)+`<p class="status good">Tama! Magaling ang iyong sagot.</p><div class="word">${esc(previous.answer)}</div><button class="button" id="next" type="button">${s.completed_correct_words.length===total?'TAPUSIN':'SUSUNOD'}</button>`;app.querySelector('#next').onclick=async()=>{if(s.completed_correct_words.length===total)return finish();s.current_item_index=s.completed_correct_words.length;s.phase='oral_reading';try{await save();render()}catch(e){render(e.message,'bad')}};return}if(!item)return finish();if(s.phase==='oral_reading'){const failed=s.stt_attempt_counts[String(n)]||0,plays=s.tts_play_counts[String(n)]||0,recovery=failed>=3;app.innerHTML=head()+`<p class="hint">Larawan ${n+1} sa ${total}</p>${picture(item)}<div class="word">${esc(item.word)}</div><p class="hint">${recovery?`Pakinggan muna ang salita. (${plays}/3)`: 'Basahin nang malakas ang buong salita.'}</p><button class="button ${recovery?'gold':''}" id="oral" type="button">${recovery?'🔊 Pakinggan muna':'🎙 Basahin ngayon'}</button><p class="status ${kind}">${esc(message)}</p>`;const or async function read(n,item,button){if(busy)return;busy=true;const mine=++request;try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono.');button.disabled=true;button.textContent='Nagbabasa...';stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[],rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const blob=await new Promise(ok=>{rec.onstop=()=>ok(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));rec.start();setTimeout(()=>rec.state==='recording'&&rec.stop(),3500)});stop();if(mine!==request)return;button.textContent='Pinoproseso...';const f=new FormData();f.append('audio',blob,'session7-lesson19-gawain4.webm');f.append('target_text',item.word);f.append('language','Filipino');f.append('mode','reading');const r=await fetch(d.transcribe_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json().catch(()=>({}));if(mine!==request)return;if(!r.ok||!j.success||!norm(j.transcript).includes(norm(item.word)))throw Error('Hindi pa. Subukan muli.');s.completed_oral_reads=[...new Set([...s.completed_oral_reads,n])];s.stt_attempt_counts[String(n)]=0;s.tts_play_counts[String(n)]=0;s.phase='letter_ordering';await save();render('Tama ang pagbasa! Ayusin naman ang mga letra.','good')}catch(e){if(mine===request){s.stt_attempt_counts[String(n)]=Math.min(3,(s.stt_attempt_counts[String(n)]||0)+1);try{await save()}catch(_){}render((s.stt_attempt_counts[String(n)]||0)>=3?'Pakinggan muna ang salita.':e.message||'Hindi nakuha ang boses. Subukan muli.','bad')}}finally{stop();busy=false}}
