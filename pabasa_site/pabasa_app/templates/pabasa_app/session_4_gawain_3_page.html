</style></head><body><div class="page"><a class="back" href="{% url 'assessment' %}">← BUMALIK SA AKING ARALIN</a><main class="activity"><div class="context">Session 4 · Lessons 10, 11, at 12</div><h1>Gawain 3: I-Decode ang mga Salita</h1><p class="instruction">I-decode o basahin ang mga salita na nasa ibaba.</p><section class="word-card"><div class="word" id="word">aba</div><div id="controls"><button class="button" id="record" type="button">🎙 SIMULAN</button></div><p class="message" id="message" role="status"></p></section><div class="footer"><span id="progress">1 of 9</span><span class="dots" id="dots"><i class="active"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div></main></div><dialog id="done"><h2>🎉 Magaling!</h2><p>Tapos na ang Gawain 3!</p><button class="button" onclick="location.href='{% url 'assessment' %}'">BALIK SA MGA GAWAIN</button></dialog><script>
(()=>{const words=['aba','lba','bilbo','bao','iba','baso','lbaba','ubo','bubo'];let i=0,r=null,s=null,c=[];const word=document.getElementById('word'),controls=document.getElementById('controls'),msg=document.getElementById('message'),progress=document.getElementById('progress'),dots=document.getElementById('dots');const stop=()=>{if(s)s.getTracks().forEach(t=>t.stop());s=null};const render=()=>{word.textContent=words[i];progress.textContent=`${i+1} of 9`;dots.querySelectorAll('i').forEach((d,n)=>d.classList.toggle('active',n===i));controls.innerHTML='<button class="button" id="record" type="button">🎙 SIMULAN</button>';msg.textContent='';document.getElementById('record').onclick=toggle};const actions=()=>{controls.innerHTML=`<div class="actions"><button class="action" id="again">ULITIN</button><button class="action next" id="advance">${i===8?'TAPUSIN ANG GAWAIN':'SUNOD NA SALITA'}</button></div>`;again.onclick=()=>{r=null;c=[];stop();render()};advance.onclick=()=>{if(i===8){done.showModal();return}i++;render()}};const start=async()=>{const b=document.getElementById('record');if(!MediaRecorder||!navigator.mediaDevices?.getUserMedia){msg.textContent='Hindi available ang voice recording sa device na ito.';return}try{s=await navigator.mediaDevices.getUserMedia({audio:true});c=[];r=new MediaRecorder(s);r.ondataavailable=e=>e.data.size&&c.push(e.data);r.onstop=()=>{stop();actions()};r.start();b.classList.add('recording');b.innerHTML='🔴 NAG-RE-RECORD...';msg.textContent='Sabihin ang salitang nakikita.'}catch(e){stop();msg.textContent='Hindi mabuksan ang mikropono. Subukan muli.'}};const toggle=()=>r?.state==='recording'?r.stop():start();document.getElementById('record').onclick=toggle;addEventListener('pagehide',stop)})();
</script><script>document.addEventListener('DOMContentLoaded',()=>{const modal=document.getElementById('done'),primary=modal.querySelector('.button');const back=document.createElement('button');back.className='button';back.type='button';back.textContent='BALIK';back.onclick=()=>modal.close();modal.insertBefore(back,primary);});</script></body></html>
