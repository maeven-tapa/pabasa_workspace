{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letrang Mm, Ss, at Aa</title><style>html,body{height:100%;overflow:hidden}body{margin:0;background:#e8f6f1;color:#164b5d;font-family:Arial,sans-serif}.page{height:100dvh;padding:8px 12px}.card{height:calc(100dvh - 42px);max-width:1000px;margin:6px auto;padding:clamp(12px,2vw,24px);overflow:hidden;background:#fffdf5;border-radius:28px;text-align:center}.back{font-weight:900;color:#164b5d}.head{display:flex;justify-content:space-between;text-align:left}.eyebrow{font-weight:900;color:#e46b58}.head h1{margin:3px 0;font-size:clamp(1.4rem,3vw,2.2rem)}.instruction{font-weight:800}.focus{height:calc(100% - 105px);display:flex;align-items:center;justify-content:center;gap:clamp(18px,5vw,65px)}.picture img{width:min(35vw,300px);height:min(52vh,330px);object-fit:contain}.wordbox{font-size:clamp(2rem,5vw,3.4rem);font-weight:900}.blank{display:inline-block;min-width:150px;border-bottom:5px solid #e6a33a}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}.choice,.action{border:0;border-radius:16px;padding:14px 22px;background:#e6a33a;color:#fff;font:900 1.15rem Arial;cursor:pointer;box-shadow:0 5px #b77b1b}.choice{background:#2d8b78}.status{min-height:28px;font-weight:900}.placed{color:#2d8b78}.wrong{color:#b33b2f}@media(max-width:650px){.focus{flex-direction:column;gap:5px}.picture img{height:32vh}.wordbox{font-size:2rem}.choice{padding:10px 16px}}</style></head><body><div class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik</a><main class="card" id="app"></main></div>{{ lesson_6_data|json_script:"lesson-six-data" }}<script>
const d=JSON.parse(document.getElementById('lesson-six-data').textContent),items=d.items,total=items.length,p=d.progress,base="{% static 'pabasa_app/images/letrang_m_s_a/' %}",url="{{ lesson_6_progress_url }}",csrf=()=>document.cookie.match(/csrftoken=([^;]+)/)?.[1]||'';let i=Math.min(total,Number(p.current_index)||0),score=Number(p.correct_items)||0,phase='identify',tries=0,listens=0,answers=p.answers||[],busy=false;const app=document.getElementById('app');async function save(done=false){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({activity_key:'lesson-6-gawain-1',total_items:total,current_index:i,completed_items:i,correct_items:score,activity_completed:done,state:{answers,phase}})});if(!r.ok)throw Error('save failed')}function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'')}function render(){if(i>=total){app.innerHTML='<h1>Magaling! Natapos mo ang gawain!</h1><button class="action" id="finish">TAPUSIN</button>';document.getElementById('finish').onclick=async()=>{await save(true);location.href="{% url 'assessment' %}"};return}const x=items[i],reading=phase==='identify'||phase==='recovery';app.innerHTML='<div class="head"><div><div class="eyebrow">LESSON 6 · GAWAIN 1</div><h1>Letrang Mm, Ss, at Aa</h1></div><b>'+(i+1)+' / '+total+'</b></div><p class="instruction">Ilagay ang tamang pantig sa patlang.</p><section class="focus"><div class="picture"><img src="'+base+x.image+'" alt="'+x.word+'"></div><div><div class="wordbox">'+(reading?'<span class="read-label">Ano ang nasa larawan?</span>':'<span class="blank" id="blank">______</span>'+x.suffix)+'</div><div class="status" id="status">'+(reading?'':'Piliin at ilagay ang tamang sagot.')+'</div>'+(reading?'<button class="action" id="read">'+(phase==='recovery'?'READ NOW':'Basahin ngayon')+'</button><button class="action" id="aloud" hidden>READ ALOUD</button>':'<div class="choices">'+x.choices.map(v=>'<button class="choice" draggable="true" data-value="'+v+'">'+v+'</button>').join('')+'</div>')+'</div></section>';if(phase==='recovery'){document.getElementById('read').onclick=()=>{phase='identify';tries=0;listens=0;render()};return}if(phase==='identify'){document.getElementById('read').onclick=record;document.getElementById('aloud').onclick=()=>{listens++;speechSynthesis?.speak(new SpeechSynthesisUtterance(x.word));if(listens>=3){phase='recovery';render()}};return}const blank=document.getElementById('blank');document.querySelectorAll('.choice').forEach(b=>{b.onclick=()=>place(b.dataset.value);b.ondragstart=e=>e.dataTransfer.setData('text/plain',b.dataset.value)});blank.ondragover=e=>e.preventDefault();blank.ondrop=e=>{e.preventDefault();place(e.dataTransfer.getData('text/plain'))}}async function place(value){if(busy||phase!=='classify')return;const x=items[i],blank=document.getElementById('blank'),status=document.getElementById('status');if(!value)return;busy=true;blank.textContent=value;blank.className='blank '+(value===x.answer?'placed':'wrong');if(value===x.answer){await new Promise(r=>setTimeout(r,1400));answers[i]=value;i++;score++;tries=0;phase='identify';await save();busy=false;render()}else{await new Promise(r=>setTimeout(r,700));status.textContent='Subukan muli.';await new Promise(r=>setTimeout(r,800));blank.textContent='______';blank.className='blank';busy=false}}async function record(){if(busy)return;const b=document.getElementById('read'),s=document.getElementById('status'),x=items[i];if(!navigator.mediaDevices?.getUserMedia||!MediaRecorder){s.textContent='Hindi available ang mikropono.';return}busy=true;b.disabled=true;b.textContent='Nagbabasa...';let stream,parts=[];try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const r=new MediaRecorder(stream);r.ondataavailable=e=>e.data.size&&parts.push(e.data);const stopped=new Promise(ok=>r.onstop=()=>ok(new Blob(parts,{type:r.mimeType||'audio/webm'})));r.start();setTimeout(()=>r.state==='recording'&&r.stop(),3500);const blob=await stopped;stream.getTracks().forEach(t=>t.stop());b.textContent='Pinoproseso...';const f=new FormData();f.append('audio',blob,'lesson6.webm');f.append('target_text',x.word);f.append('language','Filipino');f.append('mode','reading');const z=await(await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f})).json();if(z.success&&norm(z.transcript).includes(norm(x.word))){phase='classify';tries=0;render()}else{tries++;s.textContent=z.error||'Subukan muli. ('+tries+'/3)';if(tries>=3)document.getElementById('aloud').hidden=false;b.disabled=false;b.textContent='Basahin ngayon'}}catch(e){s.textContent='Hindi nakuha ang iyong boses.';b.disabled=false;b.textContent='Basahin ngayon'}finally{if(stream)stream.getTracks().forEach(t=>t.stop());busy=false}}render();</script></body></html>
