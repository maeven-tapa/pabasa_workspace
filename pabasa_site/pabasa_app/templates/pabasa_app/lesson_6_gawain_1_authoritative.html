{% load static %}
<!doctype html>
<html lang="fil" class="activity-responsive">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Letrang Mm, Ss, at Aa</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
  <style>
    @font-face{font-family:'Fredoka One';src:url("{% static 'pabasa_app/font/fredoka-one.one-regular.ttf' %}") format('truetype');font-display:swap}
    html,body{height:100%;overflow:hidden}body{margin:0;background:#bce8eb url("{% static 'pabasa_app/prescribed/PRESCRIBED-BG.jpg' %}") center/cover no-repeat fixed;color:#164b5d;font-family:'Nunito',sans-serif}.page{box-sizing:border-box;height:100dvh;padding:clamp(8px,1.6vw,18px);display:flex;flex-direction:column}.card{height:calc(100dvh - 78px);max-height:720px;max-width:1000px;width:100%;margin:6px auto 0;padding:clamp(14px,2vw,24px);overflow:hidden;background:rgba(255,253,247,.94);border:1px solid rgba(255,255,255,.92);border-radius:28px;box-shadow:0 16px 42px rgba(20,75,93,.24);text-align:center}.back{align-self:center;width:min(100%,1000px);font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:900;color:#164b5d;text-decoration:none}.head{display:flex;justify-content:space-between;align-items:flex-start;text-align:left}.eyebrow{font-family:'Fredoka One';font-weight:400;letter-spacing:.055em;color:#e46b58}.head h1,#app>h1{margin:3px 0;font-family:'Fredoka One';font-size:clamp(1.4rem,3vw,2.2rem);font-weight:400;line-height:1.1}.head>b{padding:7px 10px;border-radius:12px;background:#e8f5f4;color:#287287;font-family:'Nunito',sans-serif;font-size:.96rem;font-weight:900}.instruction{margin:10px 0 0;color:#286473;font-family:'Nunito',sans-serif;font-size:18px;font-weight:800;line-height:1.4}.instruction--identify{margin-top:40px;font-size:23px;font-weight:900}.instruction--classify{margin-top:0;font-size:23px;font-weight:900}.focus{height:calc(100% - 105px);display:flex;align-items:center;justify-content:center;gap:clamp(18px,5vw,65px)}.picture img{width:min(35vw,300px);height:min(52vh,330px);object-fit:contain}.wordbox{font-family:'Fredoka One';font-size:clamp(2rem,5vw,3.4rem);font-weight:400;line-height:1.15}.read-label,.red-label,.blank,.placed,.wrong{font-family:'Fredoka One'}.blank{display:inline-block;min-width:150px;border-bottom:5px solid #e6a33a}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}.choice,.action{border:0;border-radius:16px;padding:14px 22px;color:#fff;cursor:pointer;box-shadow:0 5px #b77b1b}.action{background:#e6a33a;font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:900}.choice{background:#2d8b78;font-family:'Fredoka One';font-size:1.35rem;font-weight:400;line-height:1}.choice:disabled,.action:disabled{cursor:default;filter:saturate(.65);opacity:.72}.status{min-height:28px;font-family:'Nunito',sans-serif;font-weight:900}.placed{color:#2d8b78}.wrong{color:#b33b2f}@media(max-width:650px){body{background-attachment:scroll}.page{padding:8px}.card{height:calc(100dvh - 58px)}.instruction--identify{margin-top:30px;font-size:21px}.instruction--classify{margin-top:30px;font-size:21px}.focus{flex-direction:column;gap:5px}.picture img{height:32vh}.wordbox{font-size:2rem}.choice{padding:10px 16px}}
  </style>
  <link rel="stylesheet" href="{% static 'pabasa_app/css/responsive_activity_layout.css' %}">
</head>
<body class="lesson-6-responsive">
  <div class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik</a><main class="card" id="app"></main></div>
  {{ lesson_6_data|json_script:"lesson-six-data" }}
  <script>
    const d=JSON.parse(document.getElementById('lesson-six-data').textContent),items=d.items,total=items.length,p=d.progress,base="{% static 'pabasa_app/images/letrang_m_s_a/' %}",url="{{ lesson_6_progress_url }}",readAloudUrl="{% url 'reading_read_aloud_api' %}",csrf=()=>document.cookie.match(/csrftoken=([^;]+)/)?.[1]||'';
    let i=Math.min(total,Number(p.current_index)||0),score=Number(p.correct_items)||0,phase='identify',tries=0,listens=0,answers=p.answers||[],busy=false,narrationVersion=0,narrationAudio=null;
    const app=document.getElementById('app'),identifyInstruction='Tukuyin ang pangalan ng larawan!',classifyInstruction='Ilagay ang tamang pantig sa patlang.';
    async function save(done=false){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({activity_key:'lesson-6-gawain-1',total_items:total,current_index:i,completed_items:i,correct_items:score,activity_completed:done,state:{answers,phase}})});if(!r.ok)throw Error('save failed')}
    function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'')}
    function stopNarration(){narrationVersion++;if(narrationAudio){narrationAudio.onended=null;narrationAudio.onerror=null;narrationAudio.pause();narrationAudio.currentTime=0;narrationAudio=null}}
    function isCurrent(version,itemIndex,expectedPhase){return version===narrationVersion&&itemIndex===i&&expectedPhase===phase}
    async function narrate(text,itemIndex,expectedPhase){const version=++narrationVersion;if(narrationAudio){narrationAudio.onended=null;narrationAudio.onerror=null;narrationAudio.pause();narrationAudio.currentTime=0;narrationAudio=null}const form=new FormData();form.append('target_text',text);form.append('language','Filipino');form.append('mode','word');const response=await fetch(readAloudUrl,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json();if(!response.ok||!result.success)throw Error(result.error||'Hindi available ang audio.');if(!isCurrent(version,itemIndex,expectedPhase))return false;const audio=new Audio('data:'+(result.mime_type||'audio/mpeg')+';base64,'+result.audio_content);narrationAudio=audio;await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=()=>reject(new Error('Hindi available ang audio.'));audio.play().catch(reject)});if(narrationAudio===audio)narrationAudio=null;return isCurrent(version,itemIndex,expectedPhase)}
    function setStatus(text){const status=document.getElementById('status');if(status)status.textContent=text}
    function setChoicesEnabled(enabled){document.querySelectorAll('.choice').forEach(button=>{button.disabled=!enabled;button.draggable=enabled})}
    function bindChoices(){const blank=document.getElementById('blank');document.querySelectorAll('.choice').forEach(button=>{button.onclick=()=>place(button.dataset.value);button.ondragstart=event=>event.dataTransfer.setData('text/plain',button.dataset.value)});if(blank){blank.ondragover=event=>event.preventDefault();blank.ondrop=event=>{event.preventDefault();place(event.dataTransfer.getData('text/plain'))}}}
    async function beginIdentifyNarration(itemIndex){const read=document.getElementById('read');if(!read)return;read.disabled=true;try{const first=await narrate(identifyInstruction,itemIndex,'identify');if(!first)return;const label=document.querySelector('.red-label'),second=await narrate(label?.textContent.trim()||'',itemIndex,'identify');if(second&&itemIndex===i&&phase==='identify')read.disabled=false}catch(error){if(itemIndex===i&&phase==='identify')setStatus(error.message||'Hindi available ang audio.')}}
    async function beginClassifyNarration(itemIndex){setChoicesEnabled(false);try{const finished=await narrate(classifyInstruction,itemIndex,'classify');if(finished&&itemIndex===i&&phase==='classify')setChoicesEnabled(true)}catch(error){if(itemIndex===i&&phase==='classify')setStatus(error.message||'Hindi available ang audio.')}}
    function render(){stopNarration();if(i>=total){app.innerHTML='<h1>Magaling! Natapos mo ang gawain!</h1><button class="action" id="finish">TAPUSIN</button>';document.getElementById('finish').onclick=async()=>{await save(true);location.href="{% url 'assessment' %}"};return}const x=items[i],reading=phase==='identify'||phase==='recovery',instruction=reading?identifyInstruction:classifyInstruction;app.innerHTML='<div class="head"><div><div class="eyebrow">LESSON 6 · GAWAIN 1</div><h1>Letrang Mm, Ss, at Aa</h1></div><b>'+(i+1)+' / '+total+'</b></div><p class="instruction '+(reading?'instruction--identify':'instruction--classify')+'">'+instruction+'</p><section class="focus"><div class="picture"><img src="'+base+x.image+'" alt="'+x.word+'"></div><div><div class="wordbox">'+(reading?'<span class="read-label red-label">Ano ang nasa larawan</span>':'<span class="blank" id="blank">______</span>'+x.suffix)+'</div><div class="status" id="status">'+(reading?'':'Piliin at ilagay ang tamang sagot.')+'</div>'+(reading?'<button class="action" id="read" disabled>'+(phase==='recovery'?'READ NOW':'Basahin ngayon')+'</button><button class="action" id="aloud" hidden>READ ALOUD</button>':'<div class="choices">'+x.choices.map(value=>'<button class="choice" draggable="false" disabled data-value="'+value+'">'+value+'</button>').join('')+'</div>')+'</div></section>';
      if(phase==='recovery'){const read=document.getElementById('read');read.disabled=false;read.onclick=()=>{phase='identify';tries=0;listens=0;record()};return}
      if(phase==='identify'){document.getElementById('read').onclick=record;document.getElementById('aloud').onclick=listen;beginIdentifyNarration(i);return}bindChoices();beginClassifyNarration(i)}
    async function listen(){if(busy||phase!=='identify')return;const button=document.getElementById('aloud'),itemIndex=i;if(!button)return;busy=true;button.disabled=true;listens++;try{await narrate(items[itemIndex].word,itemIndex,'identify');if(itemIndex===i&&phase==='identify'&&listens>=3){phase='recovery';render()}else if(itemIndex===i&&phase==='identify')button.disabled=false}catch(error){if(itemIndex===i&&phase==='identify'){setStatus(error.message||'Hindi available ang audio.');button.disabled=false}}finally{busy=false}}
    async function record(){if(busy||phase!=='identify')return;const button=document.getElementById('read'),status=document.getElementById('status'),x=items[i],itemIndex=i;if(!navigator.mediaDevices?.getUserMedia||!MediaRecorder){status.textContent='Hindi available ang mikropono.';return}busy=true;button.disabled=true;button.textContent='Nagbabasa...';let stream,parts=[];try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const recorder=new MediaRecorder(stream);recorder.ondataavailable=event=>event.data.size&&parts.push(event.data);const stopped=new Promise(resolve=>recorder.onstop=()=>resolve(new Blob(parts,{type:recorder.mimeType||'audio/webm'})));recorder.start();setTimeout(()=>recorder.state==='recording'&&recorder.stop(),3500);const blob=await stopped;stream.getTracks().forEach(track=>track.stop());button.textContent='Pinoproseso...';const form=new FormData();form.append('audio',blob,'lesson6.webm');form.append('target_text',x.word);form.append('language','Filipino');form.append('mode','reading');const response=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json();if(itemIndex!==i||phase!=='identify')return;if(result.success&&norm(result.transcript).includes(norm(x.word))){phase='classify';tries=0;render()}else{tries++;status.textContent=result.error||'Subukan muli. ('+tries+'/3)';if(tries>=3)document.getElementById('aloud').hidden=false;button.disabled=false;button.textContent='Basahin ngayon'}}catch(error){if(itemIndex===i&&phase==='identify'){status.textContent='Hindi nakuha ang iyong boses.';button.disabled=false;button.textContent='Basahin ngayon'}}finally{if(stream)stream.getTracks().forEach(track=>track.stop());busy=false}}
    async function place(value){if(busy||phase!=='classify')return;const x=items[i],itemIndex=i,blank=document.getElementById('blank');if(!value||!blank)return;busy=true;setChoicesEnabled(false);blank.textContent=value;blank.className='blank '+(value===x.answer?'placed':'wrong');try{if(value===x.answer){setStatus('Magaling');await narrate('Magaling',itemIndex,'classify');if(itemIndex!==i||phase!=='classify')return;answers[i]=value;i++;score++;tries=0;phase='identify';await save();render()}else{setStatus('Subukan Muli');await narrate('Subukan Muli',itemIndex,'classify');if(itemIndex!==i||phase!=='classify')return;blank.textContent='______';blank.className='blank';setChoicesEnabled(true)}}catch(error){if(itemIndex===i&&phase==='classify'){setStatus(error.message||'Hindi available ang audio.');if(value!==x.answer){blank.textContent='______';blank.className='blank';setChoicesEnabled(true)}}}finally{busy=false}}
    addEventListener('pagehide',stopNarration);render();
  </script>
  <script>(function(){const sync=()=>{const button=document.getElementById('aloud'),read=document.getElementById('read');if(button&&button.textContent!=='Pakinggan')button.textContent='Pakinggan';if(read&&read.textContent.trim()==='READ NOW')read.textContent='Basahin ngayon';if(button&&!button.hidden&&read&&read.textContent.trim()==='Basahin ngayon'&&!read.hidden)read.hidden=true};sync();new MutationObserver(sync).observe(document.getElementById('app'),{childList:true,subtree:true,attributes:true,attributeFilter:['hidden']})})()</script>
</body>
</html>
