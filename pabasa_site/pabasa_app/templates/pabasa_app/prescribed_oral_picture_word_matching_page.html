Picture===i.id?'selected':''}" data-picture="${esc(i.id)}" ${s.matches[i.id]?'disabled':''}><img src="${esc(i.image_url)}" alt="${esc(i.alt_text)}"><span>${esc(i.label)}</span></button>`).join('')}</section><section class="column"><h2>Mga ngalan</h2>${words.map(w=>`<button type="button" class="word-card ${used.has(w)?'matched':''} ${selectedWord===w?'selected':''}" data-word="${esc(w)}" ${used.has(w)?'disabled':''}>${esc(w)}</button>`).join('')}</section></div><p id="status" class="status ${kind}">${esc(message||'Pumili ng isang larawan at isang ngalan.')}</p>`;app.querySelectorAll('[data-picture]').forEach(b=>b.onclick=()=>{selectedPicture=b.dataset.picture;pair()});app.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{selectedWord=b.dataset.word;pair()})}async function read(word){if(busy)return;busy=true;const mine=++token,b=document.getElementById('oral');try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono.');b.disabled=true;b.textContent='Nagbabasa...';stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[],recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);const audio=await new Promise(ok=>{recorder.onstop=()=>ok(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));recorder.start();setTimeout(()=>recorder.state==='recording'&&recorder.stop(),3500)});stop();if(mine!==token)return;b.textContent='Pinoproseso...';const f=new FormData();f.append('audio',audio,'prescribed-reading.webm');f.append('target_text',word);f.append('language','Filipino');f.append('mode','reading');const response=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await response.json();if(mine!==token)return;if(response.ok&&j.success&&norm(j.transcript).includes(norm(word))){s.unlocked_oral_words.push(word);s.current_oral_word_index=s.unlocked_oral_words.length;s.stt_attempts[word]=0;s.read_aloud_plays[word]=0;s.phase=s.unlocked_oral_words.length===5?'matching':'oral_reading';await save();render('Tama ang pagbasa!','good')}else{s.stt_attempts[word]=Math.min(3,(s.stt_attempts[word]||0)+1);await save();render(s.stt_attempts[word]>=3?'Pakinggan muna ang salita.':'Hindi pa. Subukan muli.','bad')}}catch(e){if(mine===token){s.stt_attempts[word]=Math.min(3,(s.stt_attempts[word]||0)+1);try{await save()}catch(_){}render(e.message||'Hindi nakuha ang boses. Subukan muli.','bad')}}finally{stop();busy=false}}async function listen(word){if(busy)return;busy=true;const mine=++token,b=document.getElementById('oral');try{b.disabled=true;b.textContent='Nilo-load...';const f=new FormData();f.append('text',word);f.append('language','Filipino');f.append('prescribed_activity_key','lesson-17-18-gawain-7');const r=await fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json();if(mine!==token)return;if(!r.ok||!j.success||j.tts_language!=='fil-PH'||j.voice_name!=='fil-PH-Wavenet-A')throw Error(j.error||'Hindi available ang Filipino audio.');b.textContent='Pinakikinggan...';const a=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(j.audio_content),c=>c.charCodeAt(0))],{type:j.mime_type||'audio/mpeg'})));await a.play();await new Promise(ok=>a.onended=ok);if(mine!==token)return;s.read_aloud_plays[word]=Math.min(3,(s.read_aloud_plays[word]||0)+1);if(s.read_aloud_plays[word]===3){s.stt_attempts[word]=0;s.read_aloud_plays[word]=0}await save();render('Subukan mong basahin ang salita.')}catch(e){if(mine===token)render(e.message||'Hindi available ang audio. Subukan muli.','bad')}finally{busy=false}}async function pair(){if(!selectedPicture||!selectedWord||busy){render();return}const item=items.find(x=>x.id===selectedPicture);if(!item)return;if(item.word!==selectedWord){selectedPicture=selectedWord='';render('Subukan muli.','bad');return}busy=true;s.matches[selectedPicture]=selectedWord;s.se
