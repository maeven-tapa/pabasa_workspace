(()=>{'use strict';const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),items=d.items||[],words=d.word_bank||[],app=document.getElementById('app'),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||''),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');let s=Object.assign({phase:'intro',current_oral_word_index:0,unlocked_oral_words:[],stt_attempts:{},read_aloud_plays:{},matches:{},selected_pair:{},state_version:0},d.progress?.state||{}),busy=false,token=0,selectedPicture='',selectedWord='',stream=null,supportAudio=null;const total=10,count=()=>s.unlocked_oral_words.length+Object.keys(s.matches).length,head=()=>`<p class="eyebrow">SESSION 6 · LESSON 17 AT 18 · GAWAIN 7</p><h1>${esc(d.display_title)}</h1><h2>${esc(d.title)}</h2><p class="instruction">${esc(d.instruction)}</p><div class="track"><i style="width:${count()/total*100}%"></i></div>`;const stop=()=>{stream?.getTracks().forEach(t=>t.stop());stream=null};async function say(text){if(!text)throw Error('Walang tekstong babasahin.');supportAudio?.pause();const f=new FormData();f.append('text',text);f.append('language','Filipino');f.append('prescribed_activity_key',d.activity_key);const r=await fetch(d.read_aloud_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success||j.tts_language!=='fil-PH'||j.voice_name!=='fil-PH-Wavenet-A')throw Error(j.error||'Hindi available ang Filipino audio.');const a=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(j.audio_content),c=>c.charCodeAt(0))],{type:j.mime_type||'audio/mpeg'})));supportAudio=a;await a.play();await new Promise((ok,bad)=>{a.onended=ok;a.onerror=()=>bad(Error('Hindi ma-play ang audio.'))});if(supportAudio===a)supportAudio=null}const announce=text=>{say( =head()+`<p class="hint">Piliin ang larawan, pagkatapos ay ang tamang ngalan nito.</p><div class="board"><section class="column"><h2>Mga larawan</h2>${items.map(i=>`<button type="button" class="item ${s.matches[i.id]?'matched':''} ${selectedPicture===i.id?'selected':''}" data-picture="${esc(i.id)}" ${s.matches[i.id]?'disabled':''}><img src="${esc(i.image_url)}" alt="${esc(i.alt_text)}"></button>`).join('')}</section><section class="column"><h2>Mga ngalan</h2>${words.map(w=>`<button type="button" class="word-card ${used.has(w)?'matched':''} ${selectedWord===w?'selected':''}" data-word="${esc(w)}" ${used.has(w)?'disabled':''}>${esc(w)}</button>`).join('')}</section></div><p id="status" class="status ${kind}">${esc(message||'Pumili ng isang larawan at isang ngalan.')}</p>`;app.querySelectorAll('[data-picture]').forEach(b=>b.onclick=()=>{selectedPicture=b.dataset.picture;pair()});app.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{selectedWord=b.dataset.word;pair()})}async function read(word){if(busy)return;busy=true;const mine=++token,b=document.getElementById('oral');try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono.');b.disabled=true;b.textContent='Nagbabasa...';stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[],recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);const audio=await new Promise(ok=>{recorder.onstop=()=>ok(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));recorder.start();setTimeout(()=>recorder.state==='recording'&&recorder.stop(),3500)});stop();if(mine!==token)return;b.textContent='Pinoproseso...';const f=new FormData();f.append('audio',audio,'prescribed-reading.webm');f.append('target_text',word);f.append('language','Filipino');f.append('mode','reading');const response=await fetch(d.transcribe_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await response.json();if ;render(e.message,'bad');announce(e.message)}finally{busy=false}}async function finish(){s.phase='completion';try{const r=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Hindi na-save ang pagtatapos.');d.progress.activity_completed=true;render();announce('Magaling! Natapos mo ang Lesson 17 at 18: Gawain 7.')}catch(e){s.phase='matching';render(e.message,'bad');announce(e.message);const status=document.getElementById('status');if(status){const retry=document.createElement('button');retry.className='button';retry.textContent='SUBUKANG MULI';retry.onclick=finish;status.after(retry)}}}addEventListener('pagehide',()=>{stop();supportAudio?.pause();supportAudio=null});render()})();
