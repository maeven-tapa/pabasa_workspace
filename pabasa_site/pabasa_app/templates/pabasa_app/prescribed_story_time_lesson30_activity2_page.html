ecoration:underline;text-decoration-thickness:3px}.status{min-height:2.5em;margin:18px auto}.status.good{color:var(--good)}.status.bad{color:var(--bad)}.actions{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}.button{min-width:min(310px,42vw);min-height:72px;border:0;border-radius:999px;background:var(--teal);box-shadow:0 7px 0 var(--dark),0 12px 24px #187b7a40;color:#fff;padding:16px 24px;font:inherit;font-size:clamp(1rem,1.8vw,1.45rem);font-weight:900;cursor:pointer}.button.secondary{background:#fffffff0;color:var(--dark);border:4px solid var(--line);box-shadow:0 6px 0 #b7d6dc}.button:disabled{opacity:.65}.progress{display:flex;justify-content:center;gap:12px;margin:30px auto}.step{display:grid;place-items:center;width:42px;height:42px;border:3px solid #e2e8e8;border-radius:50%;background:#ffffffe8;color:#55727e;font-weight:900}.step.active{border-color:var(--gold);background:#f4c866}.step.done{border-color:#53ae83;background:#53ae83;color:#fff}.complete{min-height:400px;display:grid;place-items:center;color:var(--good);font-size:clamp(1.5rem,3vw,2.2rem);font-weight:900}.backdrop{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#e7f7f7c9;backdrop-filter:blur(3px)}.backdrop[hidden]{display:none}.modal{width:min(500px,calc(100vw - 36px));padding:36px 34px;border-radius:30px;background:#fffffff3;text-align:center;box-shadow:0 22px 60px #173f6325}.modal p{color:var(--muted);font-weight:800}.modal h2{font-size:clamp(1.8rem,4vw,2.6rem);margin:14px 0}.start-label{color:#277f82!important;letter-spacing:.08em}.start-actions{display:grid;gap:14px}.start-actions button{min-height:64px;border:0;border-radius:999px;font:inherit;font-size:1.15rem;font-weight:900;cursor:pointer}.start{background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--dark)}.later{border:3px solid var(--line)!important;background:#fff;color:var(--dark);box-shadow:0 4px 0 #b7d6dc}@media(max-width:680px){.page{width:min(100% - 24px,680px)}.stage{min-height:0;margin-t
