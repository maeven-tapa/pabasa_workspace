        const read=game.querySelector('#read'),listen=game.querySelector('#listen');
        if(read&&read.hidden)read.hidden=false;
        if(!listen)return;
        if(listen.hidden)listen.hidden=false;
        if(listen.textContent!=='🔊 Pakinggan')listen.textContent='🔊 Pakinggan';
        if(listen.dataset.alwaysAvailable==='1')return;
        const original=listen.onclick;
        listen.dataset.alwaysAvailable='1';
        listen.onclick=async function(event){
          if(this.disabled)return;
          this.disabled=true;
          try{if(original)await original.call(this,event)}
          finally{this.disabled=false;if(this.hidden)this.hidden=false;if(this.textContent!=='🔊 Pakinggan')this.textContent='🔊 Pakinggan'}
        };
      };

// Keep the dynamically rendered header aligned with the prescribed activity structure.
(function () {
  function applyActivityIdentity() {
    document.querySelectorAll('.gawain-2 .brand').forEach(function (brand) {
      const title = brand.querySelector('h1');
      const eyebrow = brand.querySelector('p');
      if (title && title.textContent !== 'Salitang Magkatugma') {
        title.textContent = 'Salitang Magkatugma';
      }
      if (eyebrow) {
        if (!eyebrow.classList.contains('eyebrow')) eyebrow.classList.add('eyebrow');
        if (eyebrow.textContent !== 'SESSION 1 · LESSON 3 · GAWAIN 2') {
          eyebrow.textContent = 'SESSION 1 · LESSON 3 · GAWAIN 2';
        }
        if (title && brand.firstElementChild !== eyebrow) {
          brand.insertBefore(eyebrow, title);
        }
      }
    });
  }
  const game = document.getElementById('game');
  if (game) {
    new MutationObserver(applyActivityIdentity).observe(game, { childList: true, subtree: true });
    applyActivityIdentity();
  }
}());
