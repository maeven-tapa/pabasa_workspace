<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>.gawain-2 .pairs .word::before{content:none!important;display:none!important}.gawain-2 .pairs .word.active::before{content:'SABIHIN ITO'!important;display:block!important;position:absolute;top:-18px;left:50%;z-index:3;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:#ffc928;color:#5b3b00;font-size:.72rem;font-weight:900;letter-spacing:.06em;white-space:nowrap;box-shadow:0 3px 8px #b77b1b55}.gawain-2:not(:has(.answers)) .status{font-size:1rem!important}.gawain-2:not(:has(.answers)) .status::after{content:none!important}</style>

<body class="gawain-2">
  <main class="app">
    <nav class="nav"><a class="back" href="{% url 'assessment' %}">← Bumalik</a></nav>
    <section id="game" class="game"></section>
  </main>
  <script src="{% static 'pabasa_app/js/lesson3_gawain_2_sequence.js' %}?v=20260917-4"></script>
  <script>
    const savedLesson3Progress = {{ lesson_3_progress|safe }};
    if (savedLesson3Progress) localStorage.setItem('pabasa:lesson-3-gawain-2:progress', String(savedLesson3Progress.activity_completed?6:savedLesson3Progress.current_index));
    const lesson3ProgressUrl = "{{ lesson_3_progress_url }}";const originalSetItem=localStorage.setItem.bind(localStorage);localStorage.setItem=(key,value)=>{originalSetItem(key,value);if(key.includes('lesson-3-gawain-')){fetch(lesson3ProgressUrl,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''},body:JSON.stringify({activity_key:key.includes('gawain-1')?'lesson-3-gawain-1':'lesson-3-gawain-2',current_index:Number(value),completed_items:Number(value),correct_items:Number(value),total_items:6,activity_completed:false})}).catch(error=>console.error('Lesson 3 progress save failed',error))};
    new MutationObserver(() => { const card = document.querySelector('.complete'); if (!card || card.querySelector('.complete-done')) return; const button = document.createElement('button'); button.className = 'complete-done'; button.type = 'button'; button.textContent = 'Done'; card.append(button); button.onclick = async () => { button.disabled = true; button.textContent = 'Saving...'; try { const response = await fetch(lesson3ProgressUrl, {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json','X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''}, body:JSON.stringify({activity_key:'lesson-3-gawain-2', current_index:6, completed_items:6, correct_items:6, total_items:6, activity_completed:true})}); const data = await response.json(); if (!response.ok || !data.success) throw new Error(data.error || 'save failed'); location.href = "{% url 'assessment' %}"; } catch (error) { console.error('Lesson 3 Gawain 2 completion save failed', error); button.disabled = false; button.textContent = 'Done'; let errorText = card.querySelector('.complete-error'); if (!errorText) { errorText = document.createElement('p'); errorText.className = 'complete-error'; card.append(errorText); } errorText.textContent = 'Hindi na-save ang progress. Subukan muli.'; } }; }).observe(document.getElementById('game'), {childList:true, subtree:true});
  </script>
  <script>
    mountLesson3RhymeActivity({
      pairs: {{ lesson_3_gawain_2_pairs_json|safe }},
      imageBase: "{% static 'pabasa_app/images/salitang_magkatugma/lesson_3_gawain_2/' %}",
      storageKey: 'pabasa:lesson-3-gawain-2:progress',
      progressUrl: "{{ lesson_3_progress_url }}",
      initialProgress: {{ lesson_3_progress|default:'null'|safe }},
      transcribeUrl: "{% url 'reading_transcribe_api' %}",
      readAloudUrl: "{% url 'reading_read_aloud_api' %}",
      exitUrl: "{% url 'assessment' %}"
    });
  </script>
  <script>
    (() => {
      const phase2Instruction = 'Magkatunog ba ang dalawang larawan na ito? Pindutin ang nawawastong sagot.';
      const syncPhase2Instruction = () => {
        const game = document.getElementById('game');
        if (!game || !game.querySelector('.answers')) return;
        const instruction = game.querySelector('.instruction');
        if (instruction && instruction.textContent.trim() !== phase2Instruction) instruction.textContent = phase2Instruction;
      };
      new MutationObserver(syncPhase2Instruction).observe(document.getElementById('game'), {childList: true, subtree: true, characterData: true});
      syncPhase2Instruction();
      window.setInterval(syncPhase2Instruction, 100);
    })();
  </script>
</body>
</html>
<!-- duplicate legacy Gawain 2 handlers intentionally disabled; the shared activity script above owns the flow.
document.addEventListener('click', async function(event){
  const button=event.target.closest('#read');
  if(!button||button.dataset.ttsUnlocked==='1'||button.dataset.ttsPlaying==='1')return;
  event.preventDefault();
  event.stopImmediatePropagation();
  button.dataset.ttsPlaying='1';
  const indicator=document.querySelector('.audio-cue');
  indicator?.classList.add('active-audio');
  try{
    const response=await fetch("{% url 'reading_read_aloud_api' %}",{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-CSRFToken':document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||''},body:new URLSearchParams({target_text:'Sabihin ito.',language:'Filipino',mode:'word'})});
    const data=await response.json();
    if(!response.ok||!data.success||!data.audio_content)throw new Error(data.error||'TTS unavailable');
    const audio=new Audio('data:'+(data.mime_type||'audio/mpeg')+';base64,'+data.audio_content);
    await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=reject;audio.play().catch(reject)});
  }catch(error){console.error('Lesson 3 Gawain 2 instruction audio failed',error)}
  finally{
    indicator?.classList.remove('active-audio');
    button.dataset.ttsPlaying='0';
    button.dataset.ttsUnlocked='1';
    button.click();
    setTimeout(()=>button.removeAttribute('data-tts-unlocked'),0);
  }
},true);
</script>
<script>
(function(){
  const game=document.getElementById('game');
  if(!game)return;
  const ttsUrl="{% url 'reading_read_aloud_api' %}";
  let audio=null,sequence=0,initialNarrated=false,lastStatus='';
  const csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';
  const speak=async text=>{
    const id=++sequence;
    if(audio){audio.pause();audio=null}
    const indicator=game.querySelector('.audio-cue');
    indicator?.classList.add('active-audio');
    try{
      const response=await fetch(ttsUrl,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-CSRFToken':csrf()},body:new URLSearchParams({target_text:text,language:'Filipino',mode:'word'})});
      const data=await response.json();
      if(id!==sequence||!response.ok||!data.success||!data.audio_content)return;
      audio=new Audio('data:'+(data.mime_type||'audio/mpeg')+';base64,'+data.audio_content);
      await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=reject;audio.play().catch(reject)});
    }catch(error){console.error('Lesson 3 Gawain 2 feedback TTS failed',error)}
    finally{if(id===sequence){audio=null;indicator?.classList.remove('active-audio')}}
  };
  const statusNarration=()=>{
    const status=game.querySelector('#status');
    if(!status||status.textContent===lastStatus)return;
    lastStatus=status.textContent;
    if(/^Hindi pa\./i.test(status.textContent))speak('Hindi ito ang tamang sagot. Subukan natin muli.');
  };
  const initialInstruction=async()=>{
    if(initialNarrated)return;
    initialNarrated=true;
    const instruction=game.querySelector('.instruction')?.textContent?.trim();
    if(!instruction)return;
    await speak(instruction);
    if(document.querySelector('.word.active'))await speak('Sabihin ito.');
  };
  setTimeout(initialInstruction,150);
  new MutationObserver(statusNarration).observe(game,{subtree:true,childList:true,characterData:true});
})();
</script>
<script>document.addEventListener('click',function(e){const b=e.target.closest('.answer');if(!b)return;setTimeout(function(){const s=document.getElementById('status');if(s&&s.textContent.trim()==='')s.textContent='Subukan muli.'},0)},true);</script>
<script>document.addEventListener('click',function(e){const b=e.target.closest('.answer');if(!b)return;const before=document.querySelector('.progress')?.textContent;setTimeout(function(){if(before===document.querySelector('.progress')?.textContent){const s=document.getElementById('status');if(s){s.textContent='Subukan muli.';s.classList.add('warning')}}},80)},true);</script>
<script>(function(){const p=document.querySelector('.progress');if(!p)return;let saved=0;const url="{{ lesson_3_progress_url }}",csrf=document.cookie.match(/csrftoken=([^;]+)/)?.[1]||'';function save(done,n){fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:JSON.stringify({activity_key:'lesson-3-gawain-2',current_index:n,completed_items:n,correct_items:n,total_items:6,activity_completed:done,state:{}})}).catch(console.error)}setInterval(function(){const n=Number((p.textContent.match(/\d+/)||[0])[0]);if(n>saved){saved=n;save(n>=6,n)}if(document.querySelector('.complete'))save(true,6)},250)})();</script>
