<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 15 Gawain 1 | PABASA</title>

<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Fredoka,"Segoe UI",sans-serif;color:#183e63}body{background:url("{% static 'pabasa_app/prescribed/PRESCRIBED-BG.jpg' %}") center/cover fixed}.page{min-height:100vh;padding:26px 20px 40px}.shell{position:relative;width:min(1120px,100%);min-height:calc(100vh - 66px);margin:auto;display:flex;align-items:center;justify-content:center}.back{position:absolute;top:0;left:0;display:inline-flex;align-items:center;gap:12px;min-width:240px;padding:14px 24px;border-radius:999px;background:#fff;color:#183e63;text-decoration:none;font-weight:700;line-height:1.05;box-shadow:0 8px 18px #173f6330}.card{width:min(1120px,100%);min-height:560px;padding:38px 55px 28px;border:1px solid #fff;border-radius:34px;background:#ffffff38;box-shadow:0 18px 40px #173f6330;text-align:center}.eyebrow{display:inline-block;margin:0 0 14px;padding:10px 25px;border-radius:999px;background:#278b89;color:#fff;font-weight:700}.title{margin:0 0 12px;font-size:clamp(2.3rem,5vw,4rem);line-height:1.08;font-weight:700}.picture{width:min(700px,100%);height:250px;margin:18px auto 16px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:4px solid #8bd8d3;border-radius:28px;background:#fff}.picture img{width:auto;height:90%;max-width:90%;object-fit:contain}.actions{display:flex;justify-content:center;gap:18px;margin:16px auto 22px}.button{min-width:220px;min-height:60px;padding:14px 24px;border:0;border-radius:999px;background:#29a39e;color:#fff;font:700 1.1rem Fredoka,"Segoe UI",sans-serif;box-shadow:0 6px 0 #147570;cursor:pointer}.button.secondary{background:#b5c5c9;box-shadow:none}.actions .button{display:inline-flex;align-items:center;justify-content:center;gap:15px;min-width:min(330px,40vw);min-height:76px;padding:14px 24px;font-size:clamp(1.1rem,1.8vw,1.65rem);font-weight:900}.button:disabled{opacity:.78;cursor:not-allowed}.button i{margin-right:9px}.eyebrow+.eyebrow{display:block;width:max-content;margin-left:auto;margin-right:auto}.progress{display:flex;justify-content:center;gap:10px}.step{display:grid;place-items:center;width:30px;height:30px;border:2px solid #e1e8e8;border-radius:50%;background:#ffffffe8;font-weight:700}.step.active{background:#f4c866;border-color:#e7ae36}.choices{display:flex;justify-content:center;gap:28px;margin:24px auto}.choice{width:170px;height:170px;border:5px solid #8bd8d3;border-radius:50%;background:#fff;color:#183e63;font:700 2rem Fredoka,"Segoe UI",sans-serif;cursor:pointer}.choice.selected{background:#f4c866;border-color:#d79a25}.start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#ffffffc2}.modal{width:min(520px,calc(100vw - 40px));padding:30px;border:2px solid #ffffffc7;border-radius:30px;background:#fffffff2;backdrop-filter:blur(14px);box-shadow:0 22px 60px #173f6340;text-align:center}.modal-session,.modal-part{margin:0 0 8px;color:#278b89;font-weight:700;letter-spacing:.06em}.modal h2{margin:10px 0 24px;font-size:clamp(1.65rem,3.5vw,2.25rem)}.modal button{width:100%;min-height:58px;margin-top:12px;padding:12px 20px;border:0;border-radius:999px;background:#299e9a;color:#fff;font:700 1rem Fredoka,"Segoe UI",sans-serif}.modal button:last-child{background:#fff;color:#187b7a;border:3px solid #94d9d6}@media(max-width:700px){.shell{align-items:flex-start;padding-top:82px}.back{left:50%;transform:translateX(-50%);justify-content:center}.card{padding:28px 16px;min-height:0}.actions{flex-wrap:wrap}.button{width:100%;min-width:0}.picture{height:220px}.choices{gap:12px}.choice{width:130px;height:130px;font-size:1.5rem}}
</style></head><body class="page"><main class="shell"><a class="back" href="{% url 'assessment' %}"><i class="bi bi-arrow-left"></i><span>Bumalik sa<br>Aking Aralin</span></a><section id="app" class="card" aria-live="polite"></section></main>{{ lesson15_gawain1_data|json_script:"lesson15-gawain1-data" }}<div id="intro" class="start"><div class="modal"><p class="modal-session">SESSION 5 · LESSON 15 · GAWAIN 1</p><h2>Basahin ang mga sumusunod</h2><button id="start-button" type="button">SIMULAN</button><button id="later-button" type="button">MAMAYA NA LANG</button></div></div>
<script>
(()=>{const d=JSON.parse(document.getElementById('lesson15-gawain1-data').textContent||'{}'),app=document.getElementById('app'),items=(Array.isArray(d.items)?d.items.slice(0,6):[]).map((item,i)=>({...item,word:i===2?'wagi':item.word,image_url:["{% static 'pabasa_app/prescribed/audio/SESSION_5/LESSON_15/tawa.jpg' %}","{% static 'pabasa_app/prescribed/audio/SESSION_5/LESSON_15/lawa.jpg' %}","{% static 'pabasa_app/prescribed/audio/SESSION_5/LESSON_15/wagi.png' %}","{% static 'pabasa_app/prescribed/audio/SESSION_5/LESSON_15/kawa.jpg' %}","{% static 'pabasa_app/prescribed/audio/SESSION_5/LESSON_15/walo.avif' %}","{% static 'pabasa_app/prescribed/audio/SESSION_5/LESSON_15/walis.jpg' %}"][i],choices:i===2?['gawa','wagi']:item.choices})),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'',norm=v=>String(v||'').toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,''),feedbackBase="{% static 'pabasa_app/prescribed/audio/all/' %}";let index=0,part=1,attempts=0,plays=0,recording=false,activeAudio=null,stream=null;
function speak(text){activeAudio?.pause();const files=text==='Tukuyin ang nasa larawan.'?["{% static 'pabasa_app/prescribed/audio/SESSION_5/LESSON_14/GAWAIN_1/tukuyin-larawan_s5-l14-g1.mp3' %}"]:text==='Magaling!'?['magalingp1.mp3','magalingp2.mp3','mahusayp1.mp3','mahusayp2.mp3']:text==='Subukan muli.'?['subukanp1.mp3','subukanp2.mp3']:text==='Ayos lang'?['ayoslang.mp3']:[];if(!files.length)return Promise.resolve();const file=files[Math.floor(Math.random()*files.length)];const a=new Audio(file.startsWith("/")?file:feedbackBase+file);activeAudio=a;return new Promise(resolve=>{const done=()=>{if(activeAudio===a)activeAudio=null;resolve()};a.onended=done;a.onerror=done;Promise.resolve(a.play()).catch(done)})}
function render(){const x=items[index];if(!x)return;app.innerHTML=part===1?'<p class="eyebrow">SESSION 5 · LESSON 15 · GAWAIN 1</p><p class="eyebrow">PART 1/2</p><h1 class="title">Tukuyin ang nasa larawan</h1><div class="picture"><img src="'+x.image_url+'" alt="Larawan"></div><div class="actions"><button class="button" id="read" '+(attempts>=3||recording?'disabled':'')+'><i class="bi bi-mic-fill"></i>Basahin ngayon</button><button class="button '+(attempts>=3&&plays<3?'':'secondary')+'" id="listen" '+(attempts>=3&&plays<3?'':'disabled')+'><i class="bi bi-volume-up-fill"></i>Pakinggan</button><button class="button secondary" id="next-test" type="button">NEXT (TEST)</button></div><div class="progress">'+items.map((_,i)=>'<span class="step '+(i===index?'active':'')+'">'+(i+1)+'</span>').join('')+'</div>':'<p class="eyebrow">SESSION 5 · LESSON 15 · GAWAIN 1</p><p class="eyebrow">PART 2/2</p><h1 class="title">Tukuyin ang nasa larawan</h1><div class="picture"><img src="'+x.image_url+'" alt="Larawan"></div><div class="choices">'+(x.choices||[]).map(c=>'<button class="choice" data-choice="'+c+'" type="button">'+c+'</button>').join('')+'</div><div class="progress">'+items.map((_,i)=>'<span class="step '+(i===index?'active':'')+'">'+(i+1)+'</span>').join('')+'</div>';if(part===1){document.getElementById('read').onclick=readItem;document.getElementById('listen').onclick=listenItem;document.getElementById('next-test').disabled=false;document.getElementById('next-test').onclick=nextTest}else app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(b.dataset.choice))}
function nextTest(){if(part!==1)return;index++;attempts=0;plays=0;if(index>=items.length){part=2;index=0}render()}
async function readItem(){if(recording)return;recording=true;render();const x=items[index];try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const r=new MediaRecorder(stream),chunks=[];r.ondataavailable=e=>e.data.size&&chunks.push(e.data);const blob=await new Promise(resolve=>{r.onstop=()=>resolve(new Blob(chunks,{type:r.mimeType||'audio/webm'}));r.start();setTimeout(()=>r.state==='recording'&&r.stop(),4000)});stream.getTracks().forEach(t=>t.stop());stream=null;recording=false;render();const f=new FormData();f.append('audio',blob,'lesson-15-gawain-1.webm');f.append('target_text',x.word);f.append('language','Filipino');f.append('mode','word');f.append('prescribed_activity_key','lesson-15-gawain-1');const response=await fetch(d.transcribe_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf(),'X-Requested-With':'XMLHttpRequest'},body:f}),j=await response.json().catch(()=>({}));const heard=norm(j.transcript),ok=Boolean(response.ok&&j.success&&heard&&(j.complete||heard===norm(x.word)||heard.includes(norm(x.word))));if(ok){await speak('Magaling!');index++;attempts=0;plays=0;if(index>=items.length){part=2;index=0}}else{attempts++;await speak('Subukan muli.')}render()}catch(e){stream?.getTracks().forEach(t=>t.stop());stream=null;recording=false;render()}}
async function listenItem(){if(attempts<3||plays>=3||activeAudio)return;plays++;const x=items[index];const r=await fetch(d.read_aloud_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-CSRFToken':csrf()},body:new URLSearchParams({target_text:x.word,language:'Filipino',mode:'word',prescribed_activity_key:'lesson-15-gawain-1'})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.audio_content){render();return}const a=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(j.audio_content),c=>c.charCodeAt(0))],{type:j.mime_type||'audio/mpeg'})));activeAudio=a;render();await new Promise(resolve=>{a.onended=resolve;a.onerror=resolve;Promise.resolve(a.play()).catch(resolve)});activeAudio=null;render()}
async function choose(value){const x=items[index],match=norm(x.word)===norm(value);await speak(match?'Magaling!':'Ayos lang');save({current_index:index+1,selected_answers:{[String(x.id||index)]:{expected:x.word,selected:value,match}},state_version:1});index++;if(index>=items.length){fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});return}render()}
async function save(state){return fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state})})}
document.getElementById('start-button').onclick=()=>{document.getElementById('intro').remove();index=0;part=1;attempts=0;plays=0;render();speak('Tukuyin ang nasa larawan.')};document.getElementById('later-button').onclick=()=>{location.href="{% url 'assessment' %}"};render()})();
</script></body></html>
