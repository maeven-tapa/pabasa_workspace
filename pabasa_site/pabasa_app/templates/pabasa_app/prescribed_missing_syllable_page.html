kground:#fff;color:var(--ink);font-size:1.35rem;font-weight:1000;cursor:pointer}.choice:hover,.choice:focus-visible{border-color:var(--blue);outline:3px solid #d7eff4}.write-form{display:flex;justify-content:center;gap:10px;max-width:470px;margin:auto}.write-form input{min-width:0;width:100%;padding:13px 16px;border:3px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font-size:1.35rem;font-weight:900;text-align:center}.hint{min-height:1.4em;margin:16px 0 0;color:#526e78;font-weight:800}.error{color:#9a3434;font-weight:900}.complete{padding:18px}.complete .star{font-size:3rem}.score{margin:18px auto;padding:14px;border:2px solid #c9e2d3;border-radius:16px;max-width:340px;background:#effbf3;font-weight:900}@media(max-width:560px){.page{width:calc(100% - 18px);padding-top:10px}.card{border-radius:23px}.choices{grid-template-columns:1fr}.write-form{flex-direction:column}.image{height:220px}}

    .lesson-16-gawain-page .prompt{margin:0 0 12px;font-size:clamp(1.5rem,3.2vw,2.45rem);line-height:1.15}.lesson-16-gawain-page .blank{border-color:#277f82}.lesson-16-gawain-page .choices{gap:14px;max-width:650px}.lesson-16-gawain-page .choice{min-height:68px;border:4px solid #94d9d6;border-radius:999px;background:#fffffff0;color:#187b7a;font-size:clamp(1.18rem,2vw,1.55rem);box-shadow:0 4px 0 #b7d6dc}.lesson-16-gawain-page .choice:hover,.lesson-16-gawain-page .choice:focus-visible{border-color:#e7af45;background:#fff8e7;outline:0;transform:translateY(-2px)}.lesson-16-gawain-page .write-form{align-items:center;max-width:610px}.lesson-16-gawain-page .write-form input{min-height:62px;border:4px solid #94d9d6;border-radius:999px;background:#fffffff0;color:#187b7a;font-size:clamp(1.15rem,2vw,1.45rem);box-shadow:inset 0 1px 0 #fff}.lesson-16-gawain-page .write-form input:focus{border-color:#e7af45;outline:4px solid #f5d47c55}.lesson-16-gawain-page .hint{min-height:1.2em;margin:10px 0 0;color:#456876;font-size:.94rem}.lesson-16-gawain-page .complete{padding:0}.lesson-16-gawain-page .complete .star{font-size:clamp(2.5rem,6vh,4rem)}.lesson-16-gawain-page .score{margin:12px auto;padding:11px 16px;border-color:#a9ded1;border-radius:999px;background:#effbf3}

<body{% if prescribed_activity_data.activity_key == 'lesson-16-gawain-1' or prescribed_activity_data.activity_key == 'lesson-16-gawain-2' %} class="lesson-16-gawain-page"{% endif %}>
  <main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card" aria-live="polite"></section></main>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script>
  (() => {
    'use strict';
    const data = JSON.parse(document.getElementById('prescribed-activity-data').textContent || '{}');
    const items = Array.isArray(data.items) ? data.items : [];
    const app = document.getElementById('app');
    const escape = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const csrf = () => ((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/) || [])[1] || '');
    const normalize = value => String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]/g, '');
    const restored = data.progress?.state && typeof data.progress.state === 'object' ? data.progress.state : {};
    let answers = Array.isArray(data.progress?.answers) ? data.progress.answers.slice(0, items.length) : [];
    let index = Math.min(answers.length, items.length);
    let phase = restored.phase === 'written' ? 'written' : 'oral';
    let oralMode = restored.oral_mode === 'aloud' ? 'aloud' : 'read';
    let readingAttempts = Math.min(3, Math.max(0, Number(restored.reading_attempts) || 0));
    let aloudAttempts = Math.min(3, Math.max(0, Number(restored.aloud_attempts) || 0));
    let writtenAttempts = Math.min(3, Math.max(0, Number(restored.written_attempts) || 0));
    let stateVersion = Math.max(0, Number(restored.state_version) || 0);
    let requestVersion = 0, attemptVersion = 0, activeAttemptController = null, activeRecordingButton = null, activeRecordingLabel = '', busy = false, startedAt = Date.now(), activeNarration = null, narratedKey = '', narrationQueue = Promise.resolve();
    const isLesson16Gawain = ['lesson-16-gawain-1', 'lesson-16-gawain-2'].includes(data.activity_key);
    const isLesson16Gawain1 = data.activity_key === 'lesson-16-gawain-1';
    const isLesson16Gawain2 = data.activity_key === 'lesson-16-gawain-2';
    const lesson16Gawain1Audio = {
      readingSuccess: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/01_reading_success_choose_missing_syllable.mp3' %}",
      listenFirst: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/02_listen_first_prompt.mp3' %}",
      gumamelaWord: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/03_item_01_gumamela_word.mp3' %}",
      gumamelaPrompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/04_item_01_gumamela_missing_syllable_prompt.mp3' %}",
      bangaWord: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/05_item_02_banga_word.mp3' %}",
      bangaPrompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/06_item_02_banga_missing_syllable_prompt.mp3' %}",
      gusaliWord: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/07_item_03_gusali_word.mp3' %}",
      gusaliPrompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/08_item_03_gusali_missing_syllable_prompt.mp3' %}",
      ngitiWord: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/09_item_04_ngiti_word.mp3' %}",
      ngitiPrompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/10_item_04_ngiti_missing_syllable_prompt.mp3' %}",
      gataWord: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/11_item_05_gata_word.mp3' %}",
      gataPrompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/12_item_05_gata_missing_syllable_prompt.mp3' %}",
      completion: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/13_feedback_final_correct.mp3' %}",
      tryAgain: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/14_feedback_try_again.mp3' %}",
      correct: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_1/15_feedback_item_correct.mp3' %}",
    };
    const lesson16Gawain1ItemAudio = [
      {word: 'gumamelaWord', prompt: 'gumamelaPrompt'}, {word: 'bangaWord', prompt: 'bangaPrompt'},
      {word: 'gusaliWord', prompt: 'gusaliPrompt'}, {word: 'ngitiWord', prompt: 'ngitiPrompt'},
      {word: 'gataWord', prompt: 'gataPrompt'},
    ];
    const lesson16Gawain2Audio = {
      readingSuccess: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/01_reading_success_choose_missing_syllable.mp3' %}",
      listenFirst: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/02_listen_first_prompt.mp3' %}",
      gumamelaWord: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/03_item_01_gumamela_word.mp3' %}",
      gumamelaPrompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/04_item_01_gumamela_missing_syllable_prompt.mp3' %}",
      bangaWord: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/05_item_02_banga_word.mp3' %}",
      bangaPrompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/06_item_02_banga_missing_syllable_prompt.mp3' %}",
      gusaliWord: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/07_item_03_gusali_word.mp3' %}",
      gusaliPrompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/08_item_03_gusali_missing_syllable_prompt.mp3' %}",
      ngitiWord: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/09_item_04_ngiti_word.mp3' %}",
      ngitiPrompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/10_item_04_ngiti_missing_syllable_prompt.mp3' %}",
      gataWord: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/11_item_05_gata_word.mp3' %}",
      gataPrompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/12_item_05_gata_missing_syllable_prompt.mp3' %}",
      completion: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/13_feedback_final_correct.mp3' %}",
      tryAgain: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/14_feedback_try_again.mp3' %}",
      correct: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_2/15_feedback_item_correct.mp3' %}",
    };
    const lesson16Gawain2ItemAudio = [
      {word: 'gumamelaWord', prompt: 'gumamelaPrompt'}, {word: 'bangaWord', prompt: 'bangaPrompt'},
      {word: 'gusaliWord', prompt: 'gusaliPrompt'}, {word: 'ngitiWord', prompt: 'ngitiPrompt'},
      {word: 'gataWord', prompt: 'gataPrompt'},
    ];
    const hasMappedLesson16Audio = isLesson16Gawain1 || isLesson16Gawain2;
    const mappedLesson16Audio = isLesson16Gawain1 ? lesson16Gawain1Audio : isLesson16Gawain2 ? lesson16Gawain2Audio : {};
    const mappedLesson16ItemAudio = isLesson16Gawain1 ? lesson16Gawain1ItemAudio : isLesson16Gawain2 ? lesson16Gawain2ItemAudio : [];

    const state = () => ({phase, oral_mode: oralMode, reading_attempts: readingAttempts, aloud_attempts: aloudAttempts, written_attempts: writtenAttempts, state_version: ++stateVersion});
    const heading = () => `<p class="eyebrow">Session 6 · Lesson ${data.lesson_number} · Gawain ${data.gawain_number}</p><h1>${escape(data.title)}</h1><p class="instruction">${escape(data.instruction)}</p><div class="count">${Math.min(index + 1, items.length)} / ${items.length}</div><div class="track" aria-hidden="true"><i style="width:${items.length ? index / items.length * 100 : 0}%"></i></div>`;
    const picture = item => `<img class="image" src="${escape(item.image_url)}" alt="Larawan ng ${escape(item.word)}">`;
    const resetOral = () => { phase = 'oral'; oralMode = 'read'; readingAttempts = 0; aloudAttempts = 0; writtenAttempts = 0; };

    async function request(url, body, signal) {
      const response = await fetch(url, {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf()}, body: JSON.stringify(body), ...(signal ? {signal} : {})});
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success) throw Error(result.error || 'Hindi na-save ang iyong sagot.');
      return result;
    }
    async function save(extra = {}, signal) {
      const sequence = ++requestVersion;
      const result = await request(data.progress_url, {material_id: data.material_id, current_index: index, answers, state: state(), ...extra}, signal);
      if (sequence === requestVersion && result.progress?.state) {
        stateVersion = Math.max(stateVersion, Number(result.progress.state.state_version) || 0);
      }
      return result;
    }
    async function playPrescribedReadAloud(text) {
      if (!isLesson16Gawain || !data.read_aloud_url || !text) return;
      if (activeNarration) { activeNarration.pause(); activeNarration = null; }
      const form = new FormData();
      form.append('text', text); form.append('language', 'Filipino'); form.append('prescribed_activity_key', data.activity_key);
      const response = await fetch(data.read_aloud_url, {method: 'POST', credentials: 'same-origin', headers: {'X-CSRFToken': csrf()}, body: form});
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success || !result.audio_content) throw Error(result.error || 'Hindi available ang audio.');
      const source = URL.createObjectURL(new Blob([Uint8Array.from(atob(result.audio_content), char => char.charCodeAt(0))], {type: result.mime_type || 'audio/mpeg'}));
      const audio = new Audio(source); activeNarration = audio;
      const clear = () => { if (activeNarration === audio) activeNarration = null; URL.revokeObjectURL(source); };
      audio.onended = clear; audio.onerror = clear;
      await audio.play();
    }
    function playMappedAudio(audioKey) {
      const source = mappedLesson16Audio[audioKey];
      if (!source) return Promise.resolve();
      narrationQueue = narrationQueue.then(() => new Promise((resolve, reject) => {
        if (activeNarration) { activeNarration.pause(); activeNarration = null; }
        const audio = new Audio(source); activeNarration = audio;
        const clear = () => { if (activeNarration === audio) activeNarration = null; };
        audio.onended = () => { clear(); resolve(); };
        audio.onerror = () => { clear(); reject(Error('Hindi ma-play ang nakatalagang audio.')); };
        audio.play().catch(error => { clear(); reject(error); });
      })).catch(() => {});
      return narrationQueue;
    }
    function narrate(text, key, mappedAudioKey = '') {
      if (!isLesson16Gawain || narratedKey === key) return;
      narratedKey = key;
      if (hasMappedLesson16Audio) { playMappedAudio(mappedAudioKey); return; }
      playPrescribedReadAloud(text).catch(() => {});
    }
    function render() {
      if (!items.length) { app.innerHTML = '<p class="error">Walang laman ang gawaing ito.</p>'; return; }
      if (data.progress?.activity_completed || index >= items.length) { complete(); return; }
      const item = items[index];
      if (phase === 'oral') {
        const listen = oralMode === 'aloud';
        app.innerHTML = heading() + picture(item) + `<p class="oral">Basahin nang malakas: <strong data-expected-text="${escape(item.word)}">${escape(item.word)}</strong>.</p><p class="hint">${listen ? 'Pakinggan ang salita nang tatlong beses bago muling magbasa.' : 'May tatlong pagkakataon kang basahin ang salita.'}</p><button class="button ${listen ? 'gold' : ''}" id="oralAction" type="button">${listen ? '🔊 Pakinggan' : '🎙 Simulan ang Pagbasa'}</button><p class="hint" id="oralStatus"></p>`;
        const oralAction = document.getElementById('oralAction');
        oralAction.dataset.defaultLabel = oralAction.textContent;
        oralAction.onclick = listen ? () => readAloud(item) : () => readWord(item);
        if (hasMappedLesson16Audio && readingAttempts === 0 && aloudAttempts === 0) {
          narrate('', `missing-syllable-prompt-${index}`, mappedLesson16ItemAudio[index]?.prompt);
        }
        if (!isLesson16Gawain1 && index === 0 && readingAttempts === 0 && aloudAttempts === 0) narrate(`${data.instruction} Basahin nang malakas ang ${item.word}.`, 'lesson-16-instruction');
        return;
      }
      const prompt = `<span class="blank">${'_'.repeat(Number(item.blank_length) || 2)}</span>${escape(item.stem)}`;
      const control = data.interaction === 'choice'
        ? `<div class="choices">${(item.choices || []).map(choice => `<button class="choice" type="button" data-answer="${escape(choice)}">${escape(choice)}</button>`).join('')}</div>`
        : `<form id="writeForm" class="write-form"><input id="answerInput" maxlength="12" autocomplete="off" autocapitalize="none" aria-label="Nawawalang pantig" placeholder="Isulat ang pantig" required><button class="button" type="submit">Isumite</button></form>`;
      app.innerHTML = heading() + picture(item) + `<p class="prompt">${prompt}</p>${control}<p class="hint" id="hint">${writtenAttempts ? `Subukan muli. (${writtenAttempts}/3)` : ''}</p>`;
      if (data.interaction === 'choice') app.querySelectorAll('[data-answer]').forEach(button => { button.onclick = () => submit(button.dataset.answer); });
      else { const form = document.getElementById('writeForm'), input = document.getElementById('answerInput'); input.focus(); form.onsubmit = event => { event.preventDefault(); submit(input.value); }; }
    }
    function restoreRecordingButton() {
      const button = document.getElementById('oralAction') || activeRecordingButton;
      if (!button) return;
      button.disabled = false;
      button.textContent = activeRecordingLabel || button.dataset.defaultLabel || 'Simulan ang Pagbasa';
      activeRecordingButton = null;
      activeRecordingLabel = '';
    }
    async function readWord(item) {
      if (busy) return;
      const attempt = ++attemptVersion;
      const controller = new AbortController();
      activeAttemptController = controller;
      const status = document.getElementById('oralStatus'), button = document.getElementById('oralAction');
      activeRecordingButton = button;
      activeRecordingLabel = button?.textContent || '';
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { status.textContent = 'Hindi available ang mikropono sa browser na ito.'; return; }
      busy = true; button.disabled = true; button.textContent = 'Nakikinig…'; let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({audio: true});
        if (attempt !== attemptVersion || controller.signal.aborted) return;
        const chunks = [], recorder = new MediaRecorder(stream);
        recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
        const finished = new Promise(resolve => { recorder.onstop = () => resolve(new Blob(chunks, {type: recorder.mimeType || 'audio/webm'})); });
        recorder.start(); setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 3500);
        const audio = await finished; stream.getTracks().forEach(track => track.stop()); button.textContent = 'Sinusuri…';
        if (attempt !== attemptVersion || controller.signal.aborted) return;
        const form = new FormData(); form.append('audio', audio, 'prescribed-reading.webm'); form.append('target_text', item.word); form.append('language', 'Filipino'); form.append('mode', 'reading');
        const response = await fetch('{% url "reading_transcribe_api" %}', {method: 'POST', credentials: 'same-origin', headers: {'X-CSRFToken': csrf()}, body: form, signal: controller.signal});
        const result = await response.json();
        if (attempt !== attemptVersion || controller.signal.aborted) return;
        if (result.success && normalize(result.transcript).includes(normalize(item.word))) { if (attempt !== attemptVersion || controller.signal.aborted) return; phase = 'written'; oralMode = 'read'; readingAttempts = 0; aloudAttempts = 0; writtenAttempts = 0; narrate('Tama! Magaling ang iyong pagbasa. Piliin ang nawawalang pantig.', `reading-correct-${index}`, 'readingSuccess'); await save({}, controller.signal); if (attempt !== attemptVersion || controller.signal.aborted) return; render(); return; }
        readingAttempts++;
        if (readingAttempts >= 3) oralMode = 'aloud';
        narrate(readingAttempts >= 3 ? 'Pakinggan muna ang salita bago muling magbasa.' : 'Hindi pa. Subukan muli.', `reading-feedback-${index}-${readingAttempts}`, readingAttempts >= 3 ? 'listenFirst' : 'tryAgain');
        await save({}, controller.signal); if (attempt !== attemptVersion || controller.signal.aborted) return; render();
      } catch (error) { button.disabled = false; button.textContent = '🎙 Subukang Muli'; status.textContent = 'Hindi nakuha ang iyong boses. Subukan muli.'; }
      finally { if (stream) stream.getTracks().forEach(track => track.stop()); if (activeAttemptController === controller) activeAttemptController = null; if (attempt !== attemptVersion || controller.signal.aborted) restoreRecordingButton(); else if (activeRecordingButton === button) { button.disabled = false; activeRecordingButton = null; activeRecordingLabel = ''; } busy = false; }
    }
    async function readAloud(item) {
      if (busy) return;
      busy = true; aloudAttempts++;
      if (aloudAttempts >= 3) { oralMode = 'read'; readingAttempts = 0; aloudAttempts = 0; }
      try { if (hasMappedLesson16Audio) await playMappedAudio(mappedLesson16ItemAudio[index]?.word); else await playPrescribedReadAloud(item.word); await save(); render(); } catch (error) { const status = app.querySelector('#oralStatus'); if (status) status.textContent = error.message; } finally { busy = false; }
    }
    async function submit(value) {
      if (busy) return;
      const answer = String(value || '').trim().toLowerCase(); if (!answer) return;
      busy = true; writtenAttempts++; const hint = document.getElementById('hint'); if (hint) hint.textContent = 'Sinusuri ang sagot…';
      try {
        const result = await save({candidate_answer: answer});
        if (result.accepted) { answers.push(answer); index = answers.length; narrate(index >= items.length ? 'Tama! Magaling!' : 'Tama! Magaling ang iyong sagot.', `answer-correct-${index}`, index >= items.length ? 'completion' : 'correct'); resetOral(); busy = false; render(); return; }
        narrate('Hindi pa tama. Subukan muli.', `answer-feedback-${index}-${writtenAttempts}`, 'tryAgain');
        await save(); render();
      } catch (error) { if (hint) hint.textContent = error.message; }
      finally { busy = false; }
    }
    async function complete() {
      if (busy) return;
      busy = true; app.innerHTML = heading() + '<p class="oral">Itinatala ang iyong natapos na gawain…</p>';
      try { const result = await request(data.completion_url, {material_id: data.material_id, answers, duration_seconds: Math.max(1, Math.round((Date.now() - startedAt) / 1000))}); showDone(result.result); }
      catch (error) { app.innerHTML = heading() + `<p class="error">${escape(error.message)}</p><button class="button" id="retry" type="button">Subukang muli</button>`; document.getElementById('retry').onclick = () => { busy = false; complete(); }; }
    }
    function showDone(result) { const correct = Number(result?.correct_items ?? data.progress?.correct_items ?? 0); app.innerHTML = `<div class="complete"><div class="star">⭐</div><h1>Magaling!</h1><p class="instruction">Natapos mo ang Lesson ${data.lesson_number}: Gawain ${data.gawain_number}.</p><div class="score">Puntos: ${correct} / ${items.length}</div><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`; busy = false; }
    function stopMappedAudio() {
      if (activeNarration) {
        activeNarration.onended = null;
        activeNarration.onerror = null;
        activeNarration.pause();
        activeNarration = null;
      }
      // A canceled Audio promise never fires onended/onerror after pause().
      // Reset the serial queue so later TTS is not left waiting forever.
      narrationQueue = Promise.resolve();
      narratedKey = '';
    }
    addEventListener('session6-prescribed-cancel', () => { requestVersion += 1; attemptVersion += 1; activeAttemptController?.abort(); activeAttemptController = null; restoreRecordingButton(); busy = false; stopMappedAudio(); });
    const session6Render = render; render = (...args) => { const result = session6Render(...args); window.dispatchEvent(new CustomEvent('session6-prescribed-render')); return result; };
    render();
  })();
  </script>
  {% include "pabasa_app/includes/session6_prescribed_controls.html" %}
