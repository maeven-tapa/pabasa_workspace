{% load static %}
<link rel="stylesheet" href="{% static 'pabasa_app/css/prescribed_stt_settings.css' %}?v=1">
<div class="prescribed-stt-settings" data-prescribed-stt>
  <label class="prescribed-stt-label">
    <input type="checkbox" data-prescribed-stt-toggle>
    <span>Use Microsoft Azure for speech recognition</span>
  </label>
  <p class="prescribed-stt-status" data-prescribed-stt-status aria-live="polite">Google speech recognition is selected.</p>
  <p class="prescribed-stt-help">Applies to your microphone in prescribed lessons and session activities. Read-aloud audio stays the same.</p>
</div>
<script src="{% static 'pabasa_app/js/prescribed_stt_settings.js' %}?v=1"></script>
