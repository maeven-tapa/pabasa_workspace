{% load static %}
<link rel="stylesheet" href="{% static 'pabasa_app/css/prescribed_stt_settings.css' %}?v=2">
<div class="prescribed-stt-settings" data-prescribed-stt>
  <label class="prescribed-stt-label">
    <span>Speech recognition</span>
    <select class="prescribed-stt-select" data-prescribed-stt-select>
      <option value="google">Google (activity default)</option>
      <option value="chirp_2">Chirp 2 — word-level values</option>
      <option value="chirp_3">Chirp 3</option>
      <option value="knowlez">Knowlez STT</option>
    </select>
  </label>
  <p class="prescribed-stt-status" data-prescribed-stt-status aria-live="polite">Google speech recognition is selected.</p>
  <p class="prescribed-stt-help">Saved for reading assessments, prescribed lessons, and session activities. Takes effect on your next speech request. Read-aloud audio stays the same.</p>
</div>
<script src="{% static 'pabasa_app/js/prescribed_stt_settings.js' %}?v=4"></script>
