<aside class="session67-debug {{ debug_class }}" id="{{ prefix }}-debug-panel" hidden aria-hidden="true" aria-live="polite">
  <strong>Speech Debug Panel</strong>
  <div class="session67-debug-row {{ row_class }}"><span class="session67-debug-key {{ key_class }}">Speech Status</span><span class="session67-debug-value {{ value_class }}" id="{{ prefix }}-debug-status">Ready</span></div>
  <div class="session67-debug-row {{ row_class }}"><span class="session67-debug-key {{ key_class }}">Expected Text</span><span class="session67-debug-value {{ value_class }}" id="{{ prefix }}-debug-expected">Not available</span></div>
  <div class="session67-debug-row {{ row_class }}"><span class="session67-debug-key {{ key_class }}">Reading Result</span><span class="session67-debug-value {{ value_class }}" id="{{ prefix }}-debug-result">Not available</span></div>
  <div class="session67-debug-row {{ row_class }}"><span class="session67-debug-key {{ key_class }}">Microphone</span><span class="session67-debug-value {{ value_class }}" id="{{ prefix }}-debug-mic">Inactive · Unmuted</span></div>
  <div class="session67-debug-row {{ row_class }}"><span class="session67-debug-key {{ key_class }}">Recorder</span><span class="session67-debug-value {{ value_class }}" id="{{ prefix }}-debug-recorder">Not available</span></div>
  <div class="session67-debug-row {{ row_class }}"><span class="session67-debug-key {{ key_class }}">VAD State</span><span class="session67-debug-value {{ value_class }}" id="{{ prefix }}-debug-vad">Not available</span></div>
  <div class="session67-debug-row {{ row_class }}"><span class="session67-debug-key {{ key_class }}">Error</span><span class="session67-debug-value {{ value_class }}" id="{{ prefix }}-debug-error">Not available</span></div>
  <div class="session67-debug-row {{ row_class }}"><span class="session67-debug-key {{ key_class }}">Recent Debug Output</span><code class="session67-debug-value session67-debug-output {{ value_class }} {{ output_class }}" id="{{ prefix }}-debug-output" data-speech-debug-output>Waiting for activity events…</code></div>
</aside>
