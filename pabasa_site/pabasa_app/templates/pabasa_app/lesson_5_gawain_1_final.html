{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letrang Aa</title><style>html,body{height:100%;overflow:hidden}body{margin:0;background:#e8f6f1;color:#164b5d;font-family:Arial,sans-serif}.page{height:100dvh;padding:8px 12px}.card{height:calc(100dvh - 42px);max-width:1000px;margin:6px auto;padding:clamp(10px,2vw,24px);overflow:hidden;background:#fffdf5;border-radius:28px;text-align:center}.back{font-weight:900;color:#164b5d}.head{display:flex;justify-content:space-between;text-align:left}.eyebrow{font-weight:900;color:#e46b58}.head h1{margin:3px 0;font-size:clamp(1.6rem,4vw,2.5rem)}.instruction{font-weight:800;font-size:1.15rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(720px,100%);margin:16px auto}.tile{border:3px solid #d4ebe1;border-radius:16px;padding:5px}.tile img{display:block;width:100%;height:clamp(64px,15vh,160px);object-fit:contain}.focus{height:calc(100% - 125px);display:flex;flex-direction:column;align-items:center;justify-content:center}.focus img{width:min(70vw,390px);height:min(48vh,330px);object-fit:contain}.word{font-size:2rem;font-weight:900}.status{min-height:28px;font-weight:900}.action,.choice{border:0;border-radius:18px;padding:13px 30px;background:#e6a33a;color:#fff;font:900 1.1rem Arial;cursor:pointer;box-shadow:0 5px #b77b1b}.action:disabled{opacity:.65;cursor:wait}.actions{display:flex;gap:14px}.choice{min-width:130px;background:#2d8b78;font-size:1.8rem}.error{color:#b33b2f}</style></head><body><div class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik</a><main class="card" id="app"></main></div>{{ lesson_5_data|json_script:"lesson-five-data" }}<script>
const d=JSON.parse(document.getElementById('lesson-five-data').textContent),items=d.items,total=items.length,p=d.progress,base="{% static 'pabasa_app/images/letrang_a/' %}",url="{{ lesson_5_progress_url }}",csrf=()=>document.cookie.match(/csrftoken=([^;]+)/)?.[1]||'';let i=Math.min(total,Number(p.current_index)||0),score=Number(p.correct_items)||0,phase='preview',tries=0,listens=0,answers=p.answers||[],busy=false;const app=document.getElementById('app');
async function save(done=false){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({activity_key:'lesson-5-gawain-1',total_items:total,current_index:i,completed_items:i,correct_items:score,activity_completed:done,state:{answers}})});if(!r.ok)throw Error('Progress save failed')}
function grid(){return '<div class="grid">'+items.map(x=>'<div class="tile"><img src="'+base+x.image+'" alt="'+x.word+'"></div>').join('')+'</div>'}function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'')}
function render(){if(phase==='preview'){app.innerHTML='<h1>Letrang Aa</h1><p class="instruction">Ikahon ang mga larawang nagsisimula sa tunog /a/.</p>'+grid()+'<button class="action" id="start">MAGSIMULA</button>';document.getElementById('start').onclick=()=>{phase='identify';render()};return}if(i>=total){app.innerHTML='<h1>Magaling!</h1>'+grid()+'<button class="action" id="finish">TAPUSIN</button>';document.getElementById('finish').onclick=async()=>{await save(true);location.href="{% url 'assessment' %}"};return}const x=items[i],recovery=phase==='identify-again',identifying=phase==='identify'||recovery;const controls=identifying?'<button class="action" id="identify">'+(recovery?'READ NOW':'Basahin ngayon')+'</button><button class="action" id="aloud" hidden>READ ALOUD</button>':'<div class="actions"><button class="choice" data-v="true">OO</button><button class="choice" data-v="false">HINDI</button></div>';app.innerHTML='<div class="head"><div><div class="eyebrow">LESSON 5 · GAWAIN 1</div><h1>Letrang Aa</h1></div><b>'+(i+1)+' / '+total+'</b></div><p class="instruction">Ikahon ang mga larawang nagsisimula sa tunog /a/.</p><section class="focus"><img src="'+base+x.image+'" alt="'+x.word+'"><div class="word">'+(identifying?x.word:'')+'</div><div class="status" id="status">'+(identifying?'Basahin ang larawan.':'Ikahon?')+'</div>'+controls+'</section>';if(recovery){document.getElementById('identify').onclick=()=>{phase='identify';tries=0;listens=0;render()};return}if(phase==='identify'){document.getElementById('identify').onclick=record;document.getElementById('aloud').onclick=()=>{listens++;speechSynthesis?.speak(new SpeechSynthesisUtterance(x.word));if(listens>=3){phase='identify-again';render()}}}else document.querySelectorAll('.choice').forEach(b=>b.onclick=async()=>{if(b.dataset.v===String(x.starts_a)){answers[i]=b.dataset.v;i++;score++;tries=0;listens=0;phase='identify';await save();render()}else if(++tries>=3){tries=0;phase='identify';render()}else document.getElementById('status').textContent='Subukan muli.'})}
async function record(){if(busy)return;const button=document.getElementById('identify'),status=document.getElementById('status'),item=items[i];if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Hindi available ang mikropono sa browser na ito.';return}busy=true;button.disabled=true;button.textContent='Pinoproseso...';let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const parts=[],recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&parts.push(e.data);const stopped=new Promise(resolve=>recorder.onstop=()=>resolve(new Blob(parts,{type:recorder.mimeType||'audio/webm'})));recorder.start();setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},3500);const blob=await stopped;stream.getTracks().forEach(t=>t.stop());const form=new FormData();form.append('audio',blob,'lesson5.webm');form.append('target_text',item.word);form.append('language','Filipino');form.append('mode','reading');const response=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json();if(result.success&&norm(result.transcript).includes(norm(item.word))){phase='classify';tries=0;render()}else{tries++;status.textContent=result.error||'Hindi pa. Subukan muli. ('+tries+'/3)';if(tries>=3){document.getElementById('aloud').hidden=false;status.textContent='Pakinggan ang tamang salita.'}button.disabled=false;button.textContent='Basahin ngayon'}}catch(error){status.textContent='Hindi nakuha ang iyong boses. Subukan muli.';button.disabled=false;button.textContent='Basahin ngayon'}finally{if(stream)stream.getTracks().forEach(t=>t.stop());busy=false}}
render();</script></body></html>
