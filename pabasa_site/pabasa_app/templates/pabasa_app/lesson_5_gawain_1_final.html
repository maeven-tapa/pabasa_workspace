{% load static %}
<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letrang Aa</title>
<style>
@font-face{font-family:Fredoka;src:url("{% static 'pabasa_app/font/fredoka-one.one-regular.ttf' %}") format('truetype');font-display:swap}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{color:#183e63;font-family:Fredoka,"Segoe UI",sans-serif;background:url("{% static 'pabasa_app/prescribed/PRESCRIBED-BG.jpg' %}") center/cover fixed no-repeat}
.page{height:100dvh;padding:16px clamp(10px,4vw,42px) 22px;overflow:hidden}
.card{position:relative;width:min(1250px,100%);height:calc(100dvh - 38px);min-height:0;margin:0 auto;padding:clamp(24px,3.2vh,42px) clamp(18px,6vw,80px) 20px;border:2px solid #ffffffaa;border-radius:42px;background:#ffffff63;backdrop-filter:blur(10px);box-shadow:0 18px 45px #1e5b7a35;text-align:center;overflow:hidden}
.back{position:absolute;top:16px;left:clamp(18px,5vw,80px);z-index:2;display:inline-flex;align-items:center;justify-content:center;min-height:58px;padding:12px 24px;border-radius:999px;background:#fff;color:#183e63;font-size:1.1rem;text-decoration:none;box-shadow:0 8px 17px #145ca744}
#app{height:100%;min-height:0;padding-top:48px;display:flex;flex-direction:column;align-items:center}h1{margin:0;color:#183e63;font-size:clamp(2rem,4vw,3.7rem);line-height:1.08}
.eyebrow{width:max-content;max-width:100%;margin:0 auto 14px;padding:10px 30px;border-radius:999px;background:#277f82;color:#fff;font-size:clamp(.85rem,1.4vw,1.15rem);letter-spacing:.02em}
.head{position:relative;width:100%;text-align:center}.head>b{position:absolute;right:0;top:6px;padding:10px 18px;border-radius:999px;background:#fff;color:#277f82;font-size:1.05rem;box-shadow:0 6px 14px #145ca733}
.instruction{width:min(820px,100%);margin:20px auto 18px;padding:14px 22px;border:2px solid #94d9d6;border-radius:18px;background:#ffffffe8;color:#315875;font-size:clamp(1rem,1.8vw,1.25rem);line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(720px,100%);margin:14px auto 18px}.tile{padding:6px;border:3px solid #94d9d6;border-radius:18px;background:#ffffffe8}.tile img{display:block;width:100%;height:clamp(58px,11vh,122px);object-fit:contain}
#app:has(#start){padding-top:38px}#app:has(#start) .instruction{margin-top:14px;margin-bottom:12px}#app:has(#start) .grid{margin-top:10px;margin-bottom:12px}#app:has(#start) #start{min-height:58px;margin-top:10px;flex:0 0 auto}
#app:has(#finish) #finish{margin-top:18px}
.focus{width:min(760px,100%);min-height:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin:0 auto;padding:12px 20px;border:4px solid #94d9d6;border-radius:32px;background:#ffffffe8;overflow:hidden}
.focus img{display:block;width:min(52vw,330px);height:min(29vh,220px);object-fit:contain}.status{min-height:30px;color:#315875;font-size:1.1rem;font-weight:900}.feedback{margin:0}.feedback.bad{color:#cf5e5e}
.actions{display:flex;justify-content:center;gap:16px;width:min(680px,100%)}.action,.choice{display:inline-flex;align-items:center;justify-content:center;min-height:64px;padding:13px 24px;border:0;border-radius:999px;background:#299e9a;color:#fff;font:inherit;font-size:clamp(1rem,1.8vw,1.35rem);font-weight:900;cursor:pointer;box-shadow:0 7px 0 #187b7a,0 10px 20px #187b7a40;transition:.16s}.action{width:min(330px,100%)}
.action.secondary{background:#fffffff0;color:#187b7a;border:4px solid #94d9d6;box-shadow:0 5px 0 #b7d6dc,0 8px 16px #187b7a20}.action:not(:disabled):hover{transform:translateY(-2px);background:#38b0aa}.action.secondary:not(:disabled):hover{background:#f4fffe}
.action:disabled,.action:disabled:hover,.choice:disabled{background:#b5c5c7!important;color:#edf3f4!important;border-color:transparent!important;box-shadow:none!important;cursor:not-allowed!important;transform:none!important}
.choice{width:100%;background:#299e9a;font-size:1.7rem}.choice-row{display:flex;gap:16px;width:min(680px,100%)}.done{display:flex;align-items:center;justify-content:center;flex:1;width:100%;color:#277f82;font-size:clamp(2rem,4vw,3.2rem);font-weight:900}
@media(max-width:600px){.page{padding:10px 8px 12px}.card{height:calc(100dvh - 22px);border-radius:28px;padding:20px 14px 14px}.back{top:12px;left:14px;min-height:48px;padding:10px 16px;font-size:.92rem}.head>b{top:2px;padding:8px 12px;font-size:.9rem}#app{padding-top:42px}.instruction{margin:14px auto 12px;padding:11px 14px}.focus{padding:10px 12px;border-radius:24px}.focus img{width:min(72vw,270px);height:min(28vh,180px)}.actions,.choice-row{gap:10px}.action{min-height:56px;padding:10px 12px}.grid{gap:6px}.tile{padding:4px}}
</style>
</head>
<body>
<div class="page"><main class="card"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><div id="app"></div></main></div>
{{ lesson_5_data|json_script:"lesson-five-data" }}
<script>
window.addEventListener('lesson-start-ready', function startLesson5Gawain1() {
const data=JSON.parse(document.getElementById('lesson-five-data').textContent),items=data.items,total=items.length,progress=data.progress,base="{% static 'pabasa_app/images/letrang_a/' %}",wordAudioBase="{% static 'pabasa_app/prescribed/audio/SESSION 2/LESSON 5/GAWAIN 1/' %}",wordAudioFiles={apa:'apa.mp3',aso:'aso.mp3',lamesa:'mesa.mp3',sabon:'sabon.mp3',medalya:'medalya.mp3',anim:'anim.mp3',araw:'araw.mp3',pamaypay:'pamaypay.mp3',avocado:'avocado.mp3'},progressUrl="{{ lesson_5_progress_url }}",transcribeUrl="{% url 'reading_transcribe_api' %}",readAloudUrl="{% url 'reading_read_aloud_api' %}",csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';
let i=Math.min(total,Number(progress.current_index)||0),score=Number(progress.correct_items)||0,phase='preview',tries=0,answers=progress.answers||[],busy=false,narrationToken=0;
const app=document.getElementById('app'),instructionText='Tukuyin ang pangalan ng larawang nasa ibaba.',questionText='Ano ang nasa larawan?',norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
async function save(done=false){const r=await fetch(progressUrl,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({activity_key:'lesson-5-gawain-1',total_items:total,current_index:i,completed_items:i,correct_items:score,activity_completed:done,state:{answers}})});if(!r.ok)throw Error('Progress save failed')}
function grid(){return '<div class="grid">'+items.map(x=>'<div class="tile"><img src="'+base+x.image+'" alt="'+x.word+'"></div>').join('')+'</div>'}
function setButtons(disabled){document.querySelectorAll('#identify,#aloud,.choice').forEach(b=>{b.disabled=disabled})}
function setStatus(text,kind=''){const s=document.getElementById('status');if(!s)return;if(kind==='bad'){s.innerHTML='<p id="feedback" class="feedback bad">Hindi pa. Subukan muli</p>'}else{s.textContent=text;s.className='status status'}}
async function prescribed(text,mode='sentence'){const response=await fetch(readAloudUrl,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-CSRFToken':csrf()},body:new URLSearchParams({target_text:text,language:'Filipino',mode})}),result=await response.json();if(!response.ok||!result.success||!result.audio_content)throw Error(result.error||'Hindi available ang prescribed audio.');const audio=new Audio('data:'+(result.mime_type||'audio/mpeg')+';base64,'+result.audio_content);await audio.play();await new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;audio.onended=null;audio.onerror=null;resolve()};audio.onended=finish;audio.onerror=finish})}
async function narrate(text,mode='sentence'){try{await prescribed(text,mode)}catch(error){console.warn('Narration unavailable:',error)}}
async function narrateInitial(){const token=++narrationToken;const start=document.getElementById('start');if(start)start.disabled=true;await narrate(instructionText);if(token===narrationToken)await narrate('Magsimula na tayo!');if(token===narrationToken&&start)start.disabled=false}
async function narrateCurrent(){const token=++narrationToken;setButtons(true);await narrate(instructionText);if(token===narrationToken)await narrate(questionText);if(token===narrationToken)setButtons(false)}
async function narrateFeedback(text){const token=++narrationToken;setButtons(true);await narrate(text);if(token===narrationToken)setButtons(false)}
async function narrateClassify(){const token=++narrationToken;setButtons(true);await narrate('Nagsisimula ba ang larawan sa tunog ey? Piliin ang Oo o Hindi.');if(token===narrationToken)setButtons(false)}
function render(){
  if(phase==='preview'){app.innerHTML='<h1>Letrang Aa</h1><p class="instruction">'+instructionText+'</p>'+grid()+'<button class="action" id="start" type="button">MAGSIMULA</button>';const start=document.getElementById('start');start.onclick=()=>{if(start.disabled)return;phase='identify';render()};narrateInitial();return}
  if(i>=total){app.innerHTML='<h1>Magaling!</h1>'+grid()+'<button class="action" id="finish" type="button">TAPUSIN</button>';document.getElementById('finish').onclick=async()=>{await save(true);location.href="{% url 'assessment' %}"};return}
  const item=items[i];
  if(phase==='classify'){app.innerHTML='<div class="head"><div><div class="eyebrow">LESSON 5 · GAWAIN 1</div><h1>Letrang Aa</h1></div><b>'+(i+1)+' / '+total+'</b></div><p class="instruction">'+instructionText+'</p><section class="focus"><img src="'+base+item.image+'" alt="'+item.word+'"><div class="status status" id="status">Nagsisimula ba ang larawan sa tunog A? Piliin ang Oo o Hindi.</div><div class="choice-row"><button class="choice" data-v="true" type="button">OO</button><button class="choice" data-v="false" type="button">HINDI</button></div></section>';narrateClassify();document.querySelectorAll('.choice').forEach(b=>b.onclick=async()=>{if(b.disabled)return;if(b.dataset.v===String(item.starts_a)){setButtons(true);setStatus('Magaling!');await narrate('Magaling!');i++;score++;tries=0;phase='identify';await save();render()}else{setStatus('', 'bad');await narrateFeedback('Hindi pa. Subukan muli')}});return}
  app.innerHTML='<div class="head"><div><div class="eyebrow">LESSON 5 · GAWAIN 1</div><h1>Letrang Aa</h1></div><b>'+(i+1)+' / '+total+'</b></div><p class="instruction">'+instructionText+'</p><section class="focus"><img src="'+base+item.image+'" alt="'+item.word+'"><div class="status status" id="status">'+questionText+'</div><div class="actions"><button class="action" id="identify" type="button">Basahin ngayon</button><button class="action secondary" id="aloud" type="button">Pakinggan</button></div></section>';
  document.getElementById('identify').onclick=record;document.getElementById('aloud').onclick=readAloud;narrateCurrent();
}
async function record(){if(busy)return;const button=document.getElementById('identify'),status=document.getElementById('status'),item=items[i];if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Hindi available ang mikropono sa browser na ito.';return}busy=true;setButtons(true);button.textContent='Pinoproseso...';let stream,recorder,timer;try{stream=await Promise.race([navigator.mediaDevices.getUserMedia({audio:true}),new Promise((_,reject)=>setTimeout(()=>reject(Error('Hindi tumugon ang mikropono.')),8000))]);const parts=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data?.size&&parts.push(e.data);const blob=await new Promise((resolve,reject)=>{recorder.onstop=()=>resolve(new Blob(parts,{type:recorder.mimeType||'audio/webm'}));recorder.onerror=()=>reject(Error('Hindi mabasa ang recording.'));recorder.start();timer=setTimeout(()=>recorder.state==='recording'&&recorder.stop(),3500)});const form=new FormData();form.append('audio',blob,'lesson5.webm');form.append('target_text',item.word);form.append('language','Filipino');form.append('mode','reading');const controller=new AbortController(),abortTimer=setTimeout(()=>controller.abort(),12000);let response;try{response=await fetch(transcribeUrl,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form,signal:controller.signal})}finally{clearTimeout(abortTimer)}const result=await response.json(),transcript=result.raw_transcript||result.transcript||'';if(result.success&&norm(transcript).includes(norm(item.word))){phase='classify';tries=0;render()}else{tries++;setStatus('', 'bad');await narrateFeedback('Hindi pa. Subukan muli');button.textContent='Basahin ngayon'}}catch(error){setStatus(error.name==='AbortError'?'Nagtagal ang pagproseso. Subukan muli.':(error.message||'Hindi nakuha ang iyong boses.'));button.textContent='Basahin ngayon'}finally{clearTimeout(timer);if(recorder?.state==='recording')recorder.stop();stream?.getTracks().forEach(track=>track.stop());busy=false;if(phase==='identify')setButtons(false)}}
async function readAloud(){if(busy)return;const button=document.getElementById('aloud'),item=items[i],audioFile=wordAudioFiles[norm(item.word)];busy=true;setButtons(true);button.textContent='Pakinggan...';try{if(!audioFile)throw Error('Missing prescribed word audio');const audio=new Audio(wordAudioBase+audioFile);await audio.play();await new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;audio.onended=null;audio.onerror=null;resolve()};audio.onended=finish;audio.onerror=finish})}catch(error){console.warn('Prescribed word audio unavailable:',error)}button.textContent='Pakinggan';busy=false;if(phase==='identify')setButtons(false)}
render();
}, { once: true });
</script><script src="{% static 'pabasa_app/js/lesson_start_modal.js' %}?v=6"></script>
</body>
</html>
