{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Match It! | PABASA</title>
  <style>
    :root{--ink:#16465d;--blue:#147b99;--line:#cfe2e7;--good:#25834d;--bad:#bd3d43}
    *{box-sizing:border-box}body{margin:0;background:#eef8f6;color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}
    .page{width:min(980px,calc(100% - 24px));margin:18px auto}.back{color:var(--ink);font-weight:800;text-decoration:none}
    .card{margin-top:18px;min-height:calc(100vh - 85px);padding:clamp(20px,4vw,48px);background:#fff;border:1px solid var(--line);border-radius:24px;text-align:center;box-shadow:0 16px 42px #16465d12}
    .eyebrow{font-weight:900;letter-spacing:.1em;color:#39778a}.lead{color:#58727c}.track{height:10px;max-width:620px;margin:20px auto;background:#e3eeee;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:#27a96b;transition:width .2s}
    .word{font-size:clamp(3rem,11vw,6rem);font-weight:900;line-height:1.2;margin:28px auto}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:18px}.button{border:0;border-radius:13px;background:var(--blue);color:#fff;padding:14px 22px;font:800 1rem inherit;cursor:pointer}.button:disabled{opacity:.6;cursor:wait}.button.gold{background:#d79524}.status{min-height:28px;font-weight:800}.bad{color:var(--bad)}.good{color:var(--good)}
    .pictures{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;max-width:780px;margin:24px auto}.picture{display:flex;align-items:center;justify-content:center;min-height:150px;padding:10px;border:2px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;transition:.15s}.picture img{width:100%;height:125px;object-fit:contain}.picture:hover{border-color:#78b4c0;transform:translateY(-2px)}.picture.wrong{border-color:var(--bad);background:#fff0f0;box-shadow:0 0 0 3px #bd3d4330}.picture.correct{border-color:var(--good);background:#e9f8ed;box-shadow:0 0 0 3px #25834d25;cursor:default}.done{padding:8vh 0}.done h1{font-size:clamp(2rem,6vw,4rem)}
    @media(max-width:520px){.pictures{grid-template-columns:repeat(2,minmax(0,1fr))}.picture{min-height:125px}.picture img{height:100px}}
  </style>
</head>
<body><main class="page"><a class="back" href="{% url 'assessment' %}">← Back to My Lessons</a><section class="card" id="app" aria-live="polite"></section></main>
{{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
<script>
(()=>{'use strict';
const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),app=document.getElementById('app'),words=d.word_bank||[],items=d.items||[];
let s=Object.assign({phase:'intro',current_oral_word_index:0,unlocked_oral_words:[],stt_attempts:{},read_aloud_plays:{},matches:{},state_version:0},d.progress?.state||{}),busy=false,stream=null;
const csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||''),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,''),index=()=>Math.min(Object.keys(s.matches||{}).length,words.length),word=()=>words[index()],done=()=>d.progress?.activity_completed||Object.keys(s.matches||{}).length>=words.length;
async function save(){const r=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:(Number(s.state_version)||0)+1}})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Progress could not be saved.');s=j.progress.state;return j}
function header(){return `<p class="eyebrow">SESSION ${esc(d.session_number)} · LESSON ${esc(d.lesson_number)} · ACTIVITY ${esc(d.gawain_number)}</p><h1>${esc(d.title)}</h1><p class="lead">${esc(d.instruction)}</p><div class="track"><i style="width:${index()/words.length*100}%"></i></div>`}
function render(message='',kind=''){if(done()){app.innerHTML=`<div class="done"><div>⭐</div><h1>Great work!</h1><p>You matched all five words.</p><a class="button" href="{% url 'assessment' %}">Back to My Lessons</a></div>`;return}
const current=word(),needsHelp=(s.stt_attempts?.[current]||0)>=3,matched=s.matches||{};
if(s.phase==='intro'){app.innerHTML=header()+`<p class="lead">Read each word first. Then choose the picture that matches it.</p><button class="button" id="start">Start</button>`;app.querySelector('#start').onclick=async()=>{s.phase='oral_reading';try{await save();render()}catch(e){render(e.message,'bad')}};return}
if(s.unlocked_oral_words?.[index()]!==current){s.phase='oral_reading'}
if(s.phase==='matching'){app.innerHTML=header()+`<p class="lead">Item ${index()+1} of ${words.length} · Choose the picture for:</p><div class="word">${esc(current)}</div><div class="pictures">${items.map(i=>`<button class="picture" type="button" data-id="${esc(i.id)}" aria-label="Choose ${esc(i.alt_text)}"><img src="${esc(i.image_url)}" alt="${esc(i.alt_text)}"></button>`).join('')}</div><p class="status ${kind}" id="status">${esc(message||'Choose the matching picture.')}</p>`;app.querySelectorAll('.picture').forEach(b=>b.onclick=()=>choose(b));return}
app.innerHTML=header()+`<p class="lead">Item ${index()+1} of ${words.length} · Say the word you see.</p><div class="word">${esc(current)}</div><div class="actions"><button class="button" id="speak">🎙 ${needsHelp?'Try saying the word again':'Say the word'}</button>${needsHelp?'<button class="button gold" id="hear">🔊 Hear the word</button>':''}</div><p class="status ${kind}" id="status">${esc(message)}</p>`;
app.querySelector('#speak').onclick=()=>read(current);app.querySelector('#hear')?.addEventListener('click',()=>listen(current));}
async function read(target){if(busy)return;busy=true;const button=app.querySelector('#speak');button.disabled=true;button.textContent='Listening…';try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Microphone is unavailable.');stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[],recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);const blob=await new Promise(resolve=>{recorder.onstop=()=>resolve(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));recorder.start();setTimeout(()=>recorder.state==='recording'&&recorder.stop(),3500)});stream.getTracks().forEach(t=>t.stop());stream=null;const f=new FormData();f.append('audio',blob,'match-it-reading.webm');f.append('target_text',target);f.append('language','English');f.append('mode','reading');const r=await fetch(d.transcribe_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json(),heard=norm(j.transcript),ok=Boolean(r.ok&&j.success&&heard&&heard.includes(norm(target)));if(!ok){s.stt_attempts[target]=Math.min(99,(s.stt_attempts[target]||0)+1);await save();render(s.stt_attempts[target]>=3?'Listen to the word, then try saying it again.':'Not quite—please try again.','bad');return}s.unlocked_oral_words=[...new Set([...(s.unlocked_oral_words||[]),target])];s.current_oral_word_index=index();s.phase='matching';s.stt_attempts[target]=0;await save();render('Now choose the matching picture.','good')}catch(e){stream?.getTracks().forEach(t=>t.stop());stream=null;s.stt_attempts[target]=Math.min(99,(s.stt_attempts[target]||0)+1);try{await save()}catch(_){}render(e.message||'Could not hear you. Please try again.','bad')}finally{busy=false}}
async function listen(target){if(busy)return;busy=true;const button=app.querySelector('#hear');button.disabled=true;try{const f=new FormData();f.append('text',target);f.append('language','English');const r=await fetch(d.read_aloud_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'Audio is unavailable.');const audio=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(j.audio_content),c=>c.charCodeAt(0))],{type:j.mime_type||'audio/mpeg'})));await audio.play();await new Promise(resolve=>audio.onended=resolve);s.read_aloud_plays[target]=Math.min(99,(s.read_aloud_plays[target]||0)+1);await save();render('Now say the word.')}catch(e){render(e.message,'bad')}finally{busy=false}}
async function choose(button){if(busy)return;const item=items.find(i=>i.id===button.dataset.id),target=word();if(!item)return;if(item.word!==target){button.classList.add('wrong');const status=app.querySelector('#status');if(status){status.textContent='That is not the matching picture. Try again.';status.className='status bad'}setTimeout(()=>button.classList.remove('wrong'),800);return}busy=true;button.classList.remove('wrong');button.classList.add('correct');button.disabled=true;s.matches[item.id]=target;s.phase='oral_reading';s.current_oral_word_index=Object.keys(s.matches).length;try{await save();if(Object.keys(s.matches).length===words.length){await finish();return}render('Correct! Read the next word.','good')}catch(e){delete s.matches[item.id];render(e.message,'bad')}finally{busy=false}}
async function finish(){s.phase='completion';try{const r=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Could not save completion.');d.progress.activity_completed=true;render()}catch(e){s.phase='matching';render(e.message,'bad')}}
addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));render();
})();
</script></body></html>
