{% extends 'pabasa_app/base_dashboard.html' %}
{% load static %}
{% block content %}
<style>
.sd-wrap{max-width:780px;margin:1.5rem auto;padding:1rem}.sd-card{background:#fff;border:1px solid #dbeafe;border-radius:24px;box-shadow:0 18px 45px rgba(15,23,42,.1);padding:clamp(1rem,4vw,2.5rem);text-align:center}.sd-kicker{color:#2563eb;font-weight:800}.sd-progress{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.sd-progress>span{display:block;height:100%;background:#22c55e;transition:width .25s}.sd-image{width:min(260px,70vw);height:230px;object-fit:contain;margin:1rem auto}.sd-word{font-size:clamp(2rem,7vw,3.5rem);font-weight:900;letter-spacing:.06em}.sd-options{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-top:1.5rem}.sd-option{border:2px solid #bfdbfe;background:#eff6ff;border-radius:16px;padding:1rem .5rem;font-weight:800;color:#1e3a8a}.sd-option:hover,.sd-option:focus{border-color:#2563eb;transform:translateY(-2px)}.sd-option.correct{background:#dcfce7;border-color:#22c55e;color:#166534}.sd-option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}.sd-feedback{min-height:2rem;margin-top:1rem;font-weight:800}.sd-next{margin-top:.5rem;border:0;border-radius:14px;background:#2563eb;color:white;padding:.8rem 1.4rem;font-weight:800}.sd-complete{padding:3rem 1rem}.sd-listen{border:0;background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:.5rem .9rem;font-weight:800}@media(max-width:540px){.sd-options{grid-template-columns:1fr}.sd-image{height:190px}}
</style>
<main class="sd-wrap"><section class="sd-card" id="sdGame" aria-live="polite"></section></main>
{{ sound_detective_material_json|json_script:"sound-detective-data" }}
<script>
(()=>{const data=JSON.parse(document.getElementById('sound-detective-data').textContent),root=document.getElementById('sdGame');let items=[...(data.items||[])];if(data.randomize_questions)items.sort(()=>Math.random()-.5);items=items.slice(0,data.number_of_questions||items.length);let index=0,correct=0,locked=false;const labels=['Beginning','Middle','End'];function speak(){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();window.speechSynthesis.speak(new SpeechSynthesisUtterance(items[index].word))}function render(){if(index>=items.length){root.innerHTML=`<div class="sd-complete"><div style="font-size:4rem">🏅</div><h1>Great detective work!</h1><p>You found ${correct} of ${items.length} sounds.</p><a class="sd-next d-inline-block text-decoration-none" href="{% url 'assessment' %}">Back to activities</a></div>`;return}locked=false;const item=items[index],choices=[...labels];if(data.randomize_answer_choices)choices.sort(()=>Math.random()-.5);root.innerHTML=`<div class="d-flex justify-content-between gap-3 mb-2"><span class="sd-kicker">🔎 ${data.title||'Sound Detective'}</span><span>${index+1} of ${items.length}</span></div><div class="sd-progress"><span style="width:${index/items.length*100}%"></span></div><h2 class="mt-4">Listen for: <strong>${item.target_sound}</strong> <button class="sd-listen" type="button" aria-label="Hear ${item.word}">🔊 Listen</button></h2><img class="sd-image" src="${item.image_url}" alt="${item.word}"><div class="sd-word">${item.word.toUpperCase()}</div><p class="mt-2 mb-0">Where do you hear the ${item.target_sound} sound?</p><div class="sd-options">${choices.map(choice=>`<button class="sd-option" type="button" data-choice="${choice}">${choice}</button>`).join('')}</div><div class="sd-feedback" role="status"></div>`;root.querySelector('.sd-listen').onclick=speak;root.querySelectorAll('.sd-option').forEach(button=>button.onclick=()=>answer(button,item))}function answer(button,item){if(locked)return;const ok=button.dataset.choice===item.position,feedback=root.querySelector('.sd-feedback');button.classList.add(ok?'correct':'wrong');if(ok){locked=true;correct++;feedback.textContent='Correct! You found it!';root.querySelectorAll('.sd-option').forEach(b=>b.disabled=true);const next=document.createElement('button');next.className='sd-next';next.textContent=index+1===items.length?'Finish':'Next word';next.onclick=()=>{index++;render()};feedback.after(next)}else{feedback.textContent=data.allow_retry?'Try again — listen carefully.':`The sound is at the ${item.position.toLowerCase()}.`;if(!data.allow_retry){locked=true;root.querySelector(`[data-choice="${item.position}"]`)?.classList.add('correct');setTimeout(()=>{index++;render()},1100)}}}render()})();
</script>
{% endblock %}
