{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sound Detective | PABASA</title>
    <link rel="icon" href="{% static 'pabasa_app/images/pabasalogo.png' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'pabasa_app/sound_detective.css' %}?v=20260901-10">
    <style>
        :root {
            --sd-activity-bg: #f8f1dd;
            --sd-panel-shadow: rgba(26, 17, 14, 0.2);
        }

        * { box-sizing: border-box; }
        html, body {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        body {
            background:
                linear-gradient(180deg, rgba(19, 15, 13, 0.12), rgba(19, 15, 13, 0.08)),
                url("{% static 'pabasa_app/images/sound_detective/sound_detective_bg.jpg' %}") center/cover no-repeat fixed;
            color: #302a32;
            font-family: "Nunito", "Segoe UI", sans-serif;
        }

        .sound-detective-activity {
            width: 100vw;
            height: 100vh;
            min-height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            padding: 14px 16px 18px;
            background: transparent;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sound-detective-nav {
            width: min(1240px, 100%);
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex: 0 0 auto;
        }

        .sound-detective-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 42px;
            padding: 9px 14px;
            border: 1px solid rgba(84, 63, 52, 0.22);
            border-radius: 14px;
            background: rgba(255, 250, 233, 0.82);
            color: #2f2d25;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 900;
            letter-spacing: 0.02em;
            box-shadow: 0 10px 18px rgba(37, 28, 22, 0.09);
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .sound-detective-back:hover,
        .sound-detective-back:focus-visible {
            background: rgba(255, 255, 255, 0.92);
            transform: translateX(-2px);
            box-shadow: 0 12px 22px rgba(37, 28, 22, 0.12);
            text-decoration: none;
        }

        #soundDetectiveGame {
            width: min(1240px, 100%);
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            margin: 0 auto;
            display: block;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
        }

        .sound-detective-stage {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            min-height: 0;
            padding: 0;
            border-radius: 0;
            border: 0;
            background: transparent !important;
            background-image: none !important;
            box-shadow: none;
            overflow: hidden;
        }

        .sd-game {
            width: min(1200px, calc(100% - 10px));
            height: 100%;
            max-height: 100vh;
            min-height: 0;
            margin: 0 auto;
            border-radius: 30px;
            box-shadow: inset 0 1px rgba(255,255,255,0.7);
        }

        @media (max-width: 850px) {
            .sound-detective-activity {
                padding: 10px 10px 12px;
            }
            #soundDetectiveGame,
            .sound-detective-stage {
                min-height: 0;
                height: 100%;
            }
            .sd-game {
                width: min(100%, calc(100% - 4px));
                min-height: 0;
                height: 100%;
                border-radius: 20px;
            }
        }

        @media (max-width: 570px) {
            .sound-detective-nav {
                margin-bottom: 8px;
            }
            .sound-detective-back {
                min-height: 38px;
                font-size: 0.8rem;
            }
            .sd-game {
                width: 100%;
                min-height: 0;
                height: 100%;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="sound-detective-activity">
        <nav class="sound-detective-nav activity-nav" aria-label="Activity navigation">
            <a class="sound-detective-back activity-back" href="{% url 'assessment' %}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Assessment</a>
        </nav>
        <main id="soundDetectiveGame" class="activity sound-detective-stage" aria-live="polite"></main>
    </div>

    {{ sound_detective_material_json|json_script:"sound-detective-data" }}
    <script src="{% static 'pabasa_app/js/sound_detective.js' %}?v=20260901-3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let data = JSON.parse(document.getElementById('sound-detective-data').textContent);
            if (typeof data === 'string') data = JSON.parse(data);
            data.detective_url = "{% static 'pabasa_app/images/sound_detective/detective2.png' %}";
            data.magnifier_url = "{% static 'pabasa_app/images/sound_detective/magnifying.png' %}";
            data.back_url = "{% url 'assessment' %}";
            data.student_name = "{{ first_name|default:'' }} {{ last_name|default:'' }}".trim() || "Young Detective";
            window.SoundDetective.mount(document.getElementById('soundDetectiveGame'), data);
        });
    </script>
</body>
</html>
