<!doctype html>
<html lang="fil">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gawain 1: Tunog ng mga Letra</title>
    <style>
        :root { color: #244b5b; font-family: Nunito, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #dff3f7; }
        .page { min-height: 100vh; padding: 20px; position: relative; overflow: hidden; }
        .page::before, .page::after { background: #fff3bd; border-radius: 50%; content: ""; height: 240px; opacity: .65; position: absolute; width: 240px; }
        .page::before { left: -100px; top: 17%; }
        .page::after { background: #f8d9c8; bottom: -120px; right: -70px; }
        .back { background: #fffdf5; border: 2px solid #c7dfe2; border-radius: 16px; box-shadow: 0 5px 15px #39627518; color: #315d6b; display: inline-block; font-size: .92rem; font-weight: 900; padding: 12px 17px; position: relative; text-decoration: none; z-index: 1; }
        .activity { align-items: center; background: #fffdf9; border-radius: 34px; box-shadow: 0 22px 60px #3962752b; display: flex; flex-direction: column; justify-content: center; margin: clamp(18px, 4vh, 42px) auto 0; max-width: 900px; min-height: calc(100vh - 145px); padding: clamp(24px, 5vw, 52px); position: relative; text-align: center; width: min(100%, 900px); z-index: 1; }
        .context { color: #d58b35; font-size: .78rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
        h1 { color: #16465d; font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.05; margin: 8px 0 10px; }
        .instruction { color: #59737d; font-size: clamp(1.05rem, 2.2vw, 1.3rem); font-weight: 800; margin: 0; }
        .learning-card { background: linear-gradient(145deg, #eefafd, #fff8df); border: 1px solid #c9e6e7; border-radius: 30px; box-shadow: 0 15px 30px #3962751f; margin: clamp(24px, 4vh, 38px) auto 20px; padding: clamp(22px, 4vw, 38px) clamp(28px, 7vw, 80px) 32px; width: min(100%, 500px); }
        .letter { color: #16465d; font-size: clamp(9rem, 25vw, 14rem); font-weight: 900; line-height: .82; margin: 0 0 26px; }
        .start-reading { align-items: center; background: #1f6f8b; border: 0; border-radius: 999px; box-shadow: 0 8px 0 #16566d, 0 14px 22px #1f6f8b35; color: #fff; cursor: pointer; display: inline-flex; font-size: clamp(1rem, 2vw, 1.2rem); font-weight: 900; gap: 10px; justify-content: center; min-height: 58px; padding: 14px 30px; width: 100%; }
        .start-reading.recording { background: #d85e55; box-shadow: 0 8px 0 #a9413c, 0 14px 22px #d85e5535; }
        .start-reading:hover, .start-reading:focus-visible { background: #277e9b; outline: 3px solid #f1c36a; outline-offset: 3px; }
        .start-reading:active { box-shadow: 0 4px 0 #16566d, 0 8px 14px #1f6f8b35; transform: translateY(4px); }
        .footer { align-items: center; color: #59737d; display: flex; font-size: 1rem; font-weight: 900; gap: 14px; justify-content: center; }
        .dots { display: flex; gap: 8px; }
        .dots i { background: #c7dfe2; border-radius: 50%; height: 12px; width: 12px; }
        .dots i.active { background: #e5a344; }
        .actions { display: flex; gap: 10px; }
        .secondary-action { background: #fff; border: 2px solid #c7dfe2; border-radius: 999px; color: #315d6b; cursor: pointer; font-weight: 900; min-height: 54px; padding: 12px 16px; width: 50%; }
        .secondary-action.primary-next { background: #e5a344; border-color: #d58b35; color: #fff; }
        .message { color: #b34e47; font-size: .9rem; font-weight: 800; margin: 13px 0 0; min-height: 1.35em; }
        .completion-modal { background: #fffdf9; border: 0; border-radius: 26px; box-shadow: 0 22px 60px #244b5b45; color: #244b5b; max-width: 410px; padding: 34px 30px 28px; text-align: center; width: calc(100% - 32px); }
        .completion-modal::backdrop { background: #244b5b66; }
        .completion-modal h2 { color: #16465d; font-size: 2rem; margin: 0 0 10px; }
        .completion-modal p { color: #59737d; font-size: 1.05rem; font-weight: 800; line-height: 1.45; margin: 0 0 24px; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { border-radius: 999px; cursor: pointer; font-weight: 900; min-height: 52px; padding: 12px 14px; width: 50%; }
        .modal-back { background: #fff; border: 2px solid #c7dfe2; color: #315d6b; }
        .modal-next { background: #e5a344; border: 2px solid #d58b35; color: #fff; }
        @media (max-width: 560px) { .page { padding: 12px; } .activity { border-radius: 25px; margin-top: 12px; min-height: calc(100vh - 100px); padding: 24px 18px; } .learning-card { margin-top: 26px; } }
    </style>
</head>
<body>
    <div class="page">
        <a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a>
        <main class="activity">
            <div class="context">Session 4 · Lessons 10, 11, at 12</div>
            <h1>Gawain 1: Tunog ng mga Letra</h1>
            <p class="instruction">Sabihin ang tunog ng mga letra sa ibaba.</p>
            <section class="learning-card" aria-label="Letter B">
                <div class="letter" id="letter">B</div>
                <div id="controls"><button class="start-reading" id="recordButton" type="button"><span aria-hidden="true">🎙</span> SIMULAN</button></div>
                <p class="message" id="message" role="status" aria-live="polite"></p>
            </section>
            <div class="footer"><span id="progressText">1 of 4</span><span class="dots" id="dots" aria-label="1 of 4"><i></i><i></i><i></i><i></i></span></div>
        </main>
    </div>
    <dialog class="completion-modal" id="completionModal" aria-labelledby="completionTitle">
        <h2 id="completionTitle">🎉 Magaling!</h2>
        <p>Tapos na ang Gawain 1!<br>Handa ka na para sa Gawain 2.</p>
        <div class="modal-actions"><button class="modal-back" id="modalBack" type="button">BALIK</button><button class="modal-next" id="modalNext" type="button">TULOY SA GAWAIN 2</button></div>
    </dialog>
    <script>
        (() => {
            const letters = ['B', 'b', 'U', 'u'];
            let index = Math.max(0, Math.min(letters.length - 1, Number({{ session4_progress.current_index|default:0 }}))), recorder = null, stream = null, chunks = [], recordings = [];
            const saveProgress = completed_items => fetch('{% url "prescribed_activity_progress" activity_key="session-4-gawain-1" %}', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json','X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''}, body:JSON.stringify({completed_items}));
            const letter = document.getElementById('letter'), controls = document.getElementById('controls');
            const recordButton = document.getElementById('recordButton'), message = document.getElementById('message');
            const progressText = document.getElementById('progressText'), dots = document.getElementById('dots');
            const setMessage = text => { message.textContent = text || ''; };
            const renderProgress = () => {
                progressText.textContent = `${index + 1} of ${letters.length}`;
                dots.setAttribute('aria-label', `${index + 1} of ${letters.length}`);
                dots.querySelectorAll('i').forEach((dot, itemIndex) => dot.classList.toggle('active', itemIndex === index));
            };
            const resetItem = () => {
                letter.textContent = letters[index];
                letter.parentElement.setAttribute('aria-label', `Letter ${letters[index]}`);
                controls.innerHTML = '<button class="start-reading" id="recordButton" type="button"><span aria-hidden="true">🎙</span> SIMULAN</button>';
                setMessage('');
                renderProgress();
                recorder = null;
                chunks = [];
                stopStream();
                document.getElementById('recordButton').addEventListener('click', () => { if (recorder?.state === 'recording') stopRecording(); else startRecording(); });
            };
            const stopStream = () => { if (stream) stream.getTracks().forEach(track => track.stop()); stream = null; };
            const showRecordedActions = () => {
                controls.innerHTML = `<div class="actions"><button class="secondary-action" id="repeatButton" type="button">ULITIN</button><button class="secondary-action primary-next" id="nextButton" type="button">${index === letters.length - 1 ? 'TAPUSIN ANG GAWAIN' : 'SUNOD NA LETRA'}</button></div>`;
                document.getElementById('repeatButton').addEventListener('click', () => { recordings[index] = null; resetItem(); });
                document.getElementById('nextButton').addEventListener('click', async () => {
                    await saveProgress(index + 1);
                    if (index === letters.length - 1) { document.getElementById('completionModal').showModal(); return; }
                    index += 1; resetItem();
                });
            };
            const startRecording = async () => {
                const activeButton = document.getElementById('recordButton');
                setMessage('');
                if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) { setMessage('Hindi available ang voice recording sa device na ito.'); return; }
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    chunks = [];
                    recorder = new MediaRecorder(stream);
                    recorder.addEventListener('dataavailable', event => { if (event.data.size) chunks.push(event.data); });
                    recorder.addEventListener('stop', () => {
                        recordings[index] = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
                        stopStream();
                        showRecordedActions();
                    }, { once: true });
                    recorder.start();
                    activeButton.classList.add('recording');
                    activeButton.innerHTML = '<span aria-hidden="true">🔴</span> NAG-RE-RECORD...';
                    setMessage('Sabihin ang tunog ng letra.');
                } catch (error) { stopStream(); setMessage('Pakibukas ang mikropono para makapag-record.'); }
            };
            const stopRecording = () => { if (recorder && recorder.state === 'recording') recorder.stop(); };
            document.getElementById('modalBack').addEventListener('click', () => document.getElementById('completionModal').close());
            document.getElementById('modalNext').addEventListener('click', async () => { await fetch('{% url "prescribed_activity_progress" activity_key="session-4-gawain-1" %}', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json','X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''}, body:JSON.stringify({completed_items:4})}); window.location.href = '{% url "lesson_4_gawain_2_page" %}'; });
            recordButton.addEventListener('click', () => { if (recorder?.state === 'recording') stopRecording(); else startRecording(); });
            renderProgress();
        })();
    </script>
</body>
</html>
