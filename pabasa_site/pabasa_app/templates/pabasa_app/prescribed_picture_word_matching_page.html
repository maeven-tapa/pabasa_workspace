<body{% if prescribed_activity_data.activity_key == 'lesson-16-gawain-3' %} class="lesson-16-gawain-3-page"{% endif %}>
  <main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card" aria-live="polite"></section></main>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script>
  (() => {
    'use strict';
    const data = JSON.parse(document.getElementById('prescribed-activity-data').textContent || '{}');
    const items = Array.isArray(data.items) ? data.items : [];
    const words = Array.isArray(data.word_bank) ? data.word_bank : [];
    const app = document.getElementById('app');
    const escape = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const csrf = () => ((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/) || [])[1] || '');
    const restored = data.progress?.state && typeof data.progress.state === 'object' ? data.progress.state : {};
    let matches = data.progress?.matches && typeof data.progress.matches === 'object' ? {...data.progress.matches} : {};
    let selectedWord = null, matchAttempts = Math.max(0, Number(restored.match_attempts) || 0);
    let stateVersion = Math.max(0, Number(restored.state_version) || 0), requestVersion = 0, busy = false, startedAt = Date.now(), phase = restored.phase === 'matching' ? 'matching' : 'oral_reading', oralIndex = Math.max(0, Math.min(items.length, Number(restored.oral_index) || 0)), readingAttempts = 0, aloudAttempts = 0, oralMode = 'read', oralStatus = '', stream = null, oralAudio = null, announcedOralIndex = -1, announcedMatching = false, mappedAudioQueue = Promise.resolve();
    let sttAttempts = restored.stt_attempts && typeof restored.stt_attempts === 'object' ? {...restored.stt_attempts} : {};
    let ttsPlays = restored.tts_plays && typeof restored.tts_plays === 'object' ? {...restored.tts_plays} : {};
    const restoreOralAttempts = () => { readingAttempts = Math.max(0, Number(sttAttempts[String(oralIndex)]) || 0); aloudAttempts = Math.max(0, Number(ttsPlays[String(oralIndex)]) || 0); oralMode = readingAttempts >= 3 ? 'aloud' : 'read'; };
    restoreOralAttempts();
    const isLesson16Gawain3 = data.activity_key === 'lesson-16-gawain-3';
    const lesson16Gawain3Audio = {
      readingCorrect: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/11_feedback_reading_correct.mp3' %}",
      readingRetry: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/12_feedback_reading_retry.mp3' %}",
      matchingStart: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/13_matching_start_prompt.mp3' %}",
      matchingCorrect: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/14_feedback_matching_correct.mp3' %}",
      matchingRetry: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/15_feedback_matching_retry.mp3' %}",
      completion: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/16_feedback_completion.mp3' %}",
    };
    const lesson16Gawain3Items = [
      {prompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/01_item_01_sanga_match_prompt.mp3' %}", word: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/02_item_01_sanga_word.mp3' %}"},
      {prompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/03_item_02_goma_match_prompt.mp3' %}", word: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/04_item_02_goma_word.mp3' %}"},
      {prompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/05_item_03_bunga_match_prompt.mp3' %}", word: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/06_item_03_bunga_word.mp3' %}"},
      {prompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/07_item_04_panga_match_prompt.mp3' %}", word: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/08_item_04_panga_word.mp3' %}"},
      {prompt: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/09_item_05_gamot_match_prompt.mp3' %}", word: "{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_16/GAWAIN_3/10_item_05_gamot_word.mp3' %}"},
    ];

    const state = () => ({match_attempts: matchAttempts, phase, oral_index: oralIndex, stt_attempts: sttAttempts, tts_plays: ttsPlays, state_version: ++stateVersion});
    const completed = () => Object.keys(matches).length;
    const heading = () => `<p class="eyebrow">Session 6 · Lesson ${data.lesson_number} · Gawain ${data.gawain_number}</p><h1>${escape(data.title)}</h1><p class="instruction">${escape(data.instruction)}</p><div class="count">${completed()} / ${items.length} na naiuugnay</div><div class="track" aria-hidden="true"><i style="width:${items.length ? completed() / items.length * 100 : 0}%"></i></div>`;

    async function request(url, body) {
      const response = await fetch(url, {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json','X-CSRFToken':csrf()}, body:JSON.stringify(body)});
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success) throw Error(result.error || 'Hindi na-save ang iyong sagot.');
      return result;
    }
    async function save(candidateMatch) {
      const sequence = ++requestVersion;
      const result = await request(data.progress_url, {material_id:data.material_id, matches, state:state(), ...(candidateMatch ? {candidate_match:candidateMatch} : {})});
      if (sequence === requestVersion && result.progress) {
        matches = result.progress.matches && typeof result.progress.matches === 'object' ? {...result.progress.matches} : matches;
        stateVersion = Math.max(stateVersion, Number(result.progress.state?.state_version) || 0);
        phase = result.progress.state?.phase === 'matching' ? 'matching' : 'oral_reading';
        oralIndex = Math.max(0, Math.min(items.length, Number(result.progress.state?.oral_index) || oralIndex));
        sttAttempts = result.progress.state?.stt_attempts && typeof result.progress.state.stt_attempts === 'object' ? {...result.progress.state.stt_attempts} : sttAttempts;
        ttsPlays = result.progress.state?.tts_plays && typeof result.progress.state.tts_plays === 'object' ? {...result.progress.state.tts_plays} : ttsPlays;
        restoreOralAttempts();
      }
      return result;
    }
    const stopOral = () => { stream?.getTracks().forEach(track => track.stop()); stream = null; if (oralAudio) { oralAudio.pause(); oralAudio = null; } };
    async function playPrescribedReadAloud(text) {
      const form = new FormData(); form.append('text', text); form.append('language', 'Filipino'); form.append('prescribed_activity_key', data.activity_key);
      const response = await fetch(data.read_aloud_url, {method:'POST', credentials:'same-origin', headers:{'X-CSRFToken':csrf()}, body:form}), result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success || !result.audio_content || result.tts_language !== 'fil-PH' || result.voice_name !== 'fil-PH-Wavenet-A') throw Error(result.error || 'Hindi available ang Filipino audio.');
      if (oralAudio) oralAudio.pause(); oralAudio = new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(result.audio_content), char => char.charCodeAt(0))], {type:result.mime_type || 'audio/mpeg'}))); await oralAudio.play(); await new Promise((resolve, reject) => { oralAudio.onended = resolve; oralAudio.onerror = () => reject(Error('Hindi ma-play ang audio.')); });
    }
    function playMappedAudio(source) {
      if (!source) return Promise.resolve();
      mappedAudioQueue = mappedAudioQueue.then(() => new Promise((resolve, reject) => {
        if (oralAudio) { oralAudio.pause(); oralAudio = null; }
        const audio = new Audio(source); oralAudio = audio;
        const clear = () => { if (oralAudio === audio) oralAudio = null; };
        audio.onended = () => { clear(); resolve(); };
        audio.onerror = () => { clear(); reject(Error('Hindi ma-play ang nakatalagang audio.')); };
        audio.play().catch(error => { clear(); reject(error); });
      })).catch(() => {});
      return mappedAudioQueue;
    }
    const narrateFeedback = async (message, mappedAudio = '') => { try { if (isLesson16Gawain3) await playMappedAudio(lesson16Gawain3Audio[mappedAudio]); else await playPrescribedReadAloud(message); } catch (error) { const status = app.querySelector('.oral-status, .hint'); if (status) status.textContent = error.message || 'Hindi available ang Filipino audio.'; } };
    // The match prompt introduces each item. Its word recording is reserved for
    // the learner's Pakinggan action after three unsuccessful reading attempts.
    const announceOralItem = () => { const item = items[oralIndex]; if (!item || announcedOralIndex === oralIndex) return; announcedOralIndex = oralIndex; if (isLesson16Gawain3) { void playMappedAudio(lesson16Gawain3Items[oralIndex]?.prompt); return; } void playPrescribedReadAloud(`${data.instruction} Basahin ang salita: ${item.read_word}.`).catch(error => { const status = app.querySelector('.oral-status'); if (status) status.textContent = error.message || 'Hindi available ang Filipino audio.'; }); };
    const announceMatching = () => { if (announcedMatching) return; announcedMatching = true; if (isLesson16Gawain3) { void playMappedAudio(lesson16Gawain3Audio.matchingStart); return; } void playPrescribedReadAloud(data.instruction).catch(error => { const status = app.querySelector('.hint'); if (status) status.textContent = error.message || 'Hindi available ang Filipino audio.'; }); };
    function renderOral(message = '', kind = '') {
      const item = items[oralIndex];
      const actionLabel = oralMode === 'aloud' ? '🔊 Pakinggan muna' : oralStatus || window.BasahinButton.LABEL;
      app.innerHTML = heading() + `<p class="hint">Basahin nang malakas ang salita bago magpatuloy sa pagkakabit. Salita ${oralIndex + 1} sa ${items.length}.</p><img class="oral-image" src="${escape(item.image_url)}" alt="${escape(item.alt_text || item.placeholder_label)}"><div class="oral-word">${escape(item.read_word)}</div><button data-basahin-button class="button ${oralMode === 'aloud' ? 'gold' : ''}" id="oral-action" type="button" ${busy ? 'disabled' : ''}>${escape(actionLabel)}</button><p class="oral-status ${kind}">${escape(message)}</p>`;
      window.Basahin.bindActivity(app.querySelector('#oral-action'),oralMode === 'aloud' ? listenCurrentWord : readCurrentWord);
      announceOralItem();
    }
    async function readCurrentWord() {
      if (busy) return;
      const item = items[oralIndex], button = app.querySelector('#oral-action');
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { readingAttempts = Math.min(3, readingAttempts + 1); oralMode = readingAttempts >= 3 ? 'aloud' : 'read'; const feedback = oralMode === 'aloud' ? 'Pakinggan muna ang salita.' : `Hindi available ang mikropono. May ${3 - readingAttempts} pagkakataon pa.`; renderOral(feedback, 'error'); await narrateFeedback(feedback, 'readingRetry'); return; }
      busy = true; oralStatus = '🎙 Nakikinig…'; renderOral('Nakikinig sa iyong pagbasa…', 'good');
      try {
        button.disabled = true; button.textContent = 'Nagbabasa...';
        stream = await window.Basahin.openMicrophone({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
        let parts = [], recorder = null;const recording = await window.Basahin.capture({button:document.querySelector('[data-basahin-button]'),stream: stream, onRecorder: value => { recorder = value; }});
        stopOral(); oralStatus = '⏳ Pinoproseso…'; renderOral('Pinoproseso ang iyong pagbasa…', 'good');
        const form = new FormData(); form.append('audio', recording, 'lesson16-gawain3-reading.webm'); form.append('target_text', item.read_word); form.append('language', 'Filipino'); form.append('mode', 'reading');
        const response = await fetch(data.transcribe_url, {method:'POST', credentials:'same-origin', headers:{'X-CSRFToken':csrf()}, body:form}), result = await response.json().catch(() => ({}));
        if (!response.ok || !result.success || !String(result.transcript || '').toLowerCase().includes(item.read_word.toLowerCase())) throw Error('Hindi pa. Subukan muli.');
        sttAttempts[String(oralIndex)] = 0; ttsPlays[String(oralIndex)] = 0;
        oralIndex += 1; phase = oralIndex >= items.length ? 'matching' : 'oral_reading'; restoreOralAttempts();
        await save(); oralStatus = ''; await narrateFeedback('Tama ang pagbasa!', 'readingCorrect');
        if (phase === 'matching') render(); else renderOral('Tama ang pagbasa!', 'good');
      } catch (error) {
        oralStatus = ''; if(!window.Basahin.isCaptureError(error)){readingAttempts = Math.min(3, readingAttempts + 1);} if(!window.Basahin.isCaptureError(error)){sttAttempts[String(oralIndex)] = readingAttempts;} if (readingAttempts >= 3) oralMode = 'aloud'; await save().catch(() => {});
        const feedback = oralMode === 'aloud' ? 'Pakinggan muna ang salita.' : error.message || 'Hindi nakuha ang boses. Subukan muli.'; renderOral(feedback, 'error'); await narrateFeedback(feedback, 'readingRetry');
      } finally {
        stopOral();
        busy = false;
        // renderOral can run while the recording request is still marked busy.
        // Restore the newly-rendered control once that request has finished so
        // the learner can continue to the next word.
        const action = app.querySelector('#oral-action');
        if (action) action.disabled = false;
      }
    }
    async function listenCurrentWord() {
      if (busy) return;
      const item = items[oralIndex], button = app.querySelector('#oral-action'); busy = true;
      try {
        button.disabled = true; button.textContent = 'Nilo-load...'; if (isLesson16Gawain3) await playMappedAudio(lesson16Gawain3Items[oralIndex]?.word); else await playPrescribedReadAloud(item.read_word);
        aloudAttempts = Math.min(3, aloudAttempts + 1); ttsPlays[String(oralIndex)] = aloudAttempts; if (aloudAttempts >= 3) { readingAttempts = 0; aloudAttempts = 0; sttAttempts[String(oralIndex)] = 0; ttsPlays[String(oralIndex)] = 0; oralMode = 'read'; } await save(); renderOral('Subukan mong basahin ang salita.');
      } catch (error) { renderOral(error.message || 'Hindi available ang Read Aloud.', 'error'); }
      finally {
        stopOral();
        busy = false;
        // See readCurrentWord: the render happens before `busy` is cleared.
        const action = app.querySelector('#oral-action');
        if (action) action.disabled = false;
      }
    }
    function render() {
      if (!items.length || !words.length) { app.innerHTML = '<p class="hint error">Walang laman ang gawaing ito.</p>'; return; }
      if (data.progress?.activity_completed) { showDone(); return; }
      if (phase === 'matching' && completed() >= items.length) { complete(); return; }
      if (phase === 'oral_reading') { renderOral(); return; }
      const usedWords = new Set(Object.values(matches));
      app.innerHTML = heading() + `<div class="matching-board"><section><h2 class="board-heading">Mga salita</h2><div class="word-bank">${words.map(word => `<button class="word${selectedWord === word ? ' is-selected' : ''}${usedWords.has(word) ? ' is-used' : ''}" type="button" data-word="${escape(word)}" draggable="${!usedWords.has(word)}" ${usedWords.has(word) ? 'disabled' : ''}>${escape(word)}</button>`).join('')}</div></section><section><h2 class="board-heading">Mga larawan</h2><div class="picture-list">${items.map(item => { const matched = matches[item.id]; return `<button class="picture${matched ? ' is-matched' : ''}" type="button" data-target="${escape(item.id)}" ${matched ? 'disabled' : ''}><span class="image-frame"><img src="${escape(item.image_url)}" alt="${escape(item.alt_text || item.placeholder_label)}"><span class="image-placeholder">${escape(item.placeholder_label)}<br>Idagdag ang larawan</span></span><span class="picture-status">${matched ? `✓ ${escape(matched)}` : 'Piliin ang katumbas na salita'}${matched ? '<small>Tamang pagkakabit</small>' : '<small>I-tap o i-drag ang salita rito</small>'}</span></button>`; }).join('')}</div></section></div><p class="hint" id="hint">${selectedWord ? `Napili: ${escape(selectedWord)}. I-tap ang katumbas na larawan.` : 'Pumili ng salita, pagkatapos ay i-tap ang katumbas na larawan.'}</p>`;
      app.querySelectorAll('.image-frame img').forEach(image => image.addEventListener('error', () => image.parentElement.classList.add('is-placeholder'), {once:true}));
      app.querySelectorAll('[data-word]').forEach(button => { button.addEventListener('click', () => { selectedWord = button.dataset.word; render(); }); button.addEventListener('dragstart', event => event.dataTransfer.setData('text/plain', button.dataset.word)); });
      app.querySelectorAll('[data-target]').forEach(target => { target.addEventListener('click', () => submit(target.dataset.target)); target.addEventListener('dragover', event => event.preventDefault()); target.addEventListener('drop', event => { event.preventDefault(); submit(target.dataset.target, event.dataTransfer.getData('text/plain')); }); }); announceMatching();
    }
    async function submit(targetId, draggedWord = '') {
      const word = draggedWord || selectedWord;
      const hint = document.getElementById('hint');
      if (!word) { hint.textContent = 'Pumili muna ng salita.'; hint.className = 'hint error'; return; }
      if (busy) return;
      busy = true; matchAttempts++; hint.textContent = 'Sinusuri ang pagkakabit…'; hint.className = 'hint';
      try {
        const result = await save({target_id:targetId, word});
        if (result.accepted) { selectedWord = null; const finalMatch = completed() >= items.length; const feedback = 'Tama! Magaling!'; await narrateFeedback(feedback, finalMatch ? 'completion' : 'matchingCorrect'); if (finalMatch) { busy = false; await complete(); return; } render(); return; }
        const feedback = 'Hindi magkatugma. Subukan muli.'; hint.textContent = feedback; hint.className = 'hint error'; await narrateFeedback(feedback, 'matchingRetry');
      } catch (error) { hint.textContent = error.message; hint.className = 'hint error'; }
      finally { busy = false; }
    }
    async function complete() {
      if (busy) return;
      busy = true; app.innerHTML = heading() + '<p class="hint">Itinatala ang iyong natapos na gawain…</p>';
      try { const result = await request(data.completion_url, {material_id:data.material_id, matches, duration_seconds:Math.max(1, Math.round((Date.now() - startedAt) / 1000))}); showDone(result.result); }
      catch (error) { app.innerHTML = heading() + `<p class="hint error">${escape(error.message)}</p><button class="button" id="retry" type="button">Subukang muli</button>`; document.getElementById('retry').onclick = () => { busy = false; complete(); }; }
    }
    function showDone(result) { const correct = Number(result?.correct_items ?? completed()); app.innerHTML = `<div class="complete"><div class="star">⭐</div><h1>Magaling!</h1><p class="instruction">Natapos mo ang Lesson ${data.lesson_number}: Gawain ${data.gawain_number}.</p><div class="score">Puntos: ${correct} / ${items.length}</div><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`; busy = false; }
    addEventListener('pagehide', stopOral);
    render();
  })();
  </script>
</body>
