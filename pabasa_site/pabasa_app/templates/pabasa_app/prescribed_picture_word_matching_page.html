  <style>
    :root{--ink:#16465d;--blue:#1f6f8b;--gold:#e6a33a;--paper:#fffdf7;--line:#bfdde4;--success:#2d8b78;--error:#a63b3b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#e1f5f7,#fff3d8);color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(1040px,calc(100% - 28px));margin:auto;padding:20px 0 38px}.back{display:inline-flex;padding:11px 15px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:900;text-decoration:none}.card{margin-top:18px;padding:clamp(22px,5vw,42px);border-radius:30px;background:var(--paper);box-shadow:0 20px 54px #2d697326;text-align:center}.eyebrow{margin:0;color:#997124;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.card h1{margin:.3rem 0 .65rem;font-size:clamp(2rem,5vw,3.2rem);line-height:1.05}.instruction{margin:0 auto 18px;max-width:660px;color:#526e78;font-size:1.08rem;font-weight:700;line-height:1.45}.count{font-weight:900}.track{height:12px;margin:12px auto 26px;max-width:760px;overflow:hidden;border-radius:999px;background:#dcebed}.track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),#f6cb55)}.matching-board{display:grid;grid-template-columns:minmax(180px,.72fr) minmax(280px,1.35fr);gap:clamp(18px,4vw,54px);align-items:start;max-width:900px;margin:auto;text-align:left}.board-heading{margin:0 0 10px;font-size:.88rem;font-weight:1000;letter-spacing:.06em;text-transform:uppercase}.word-bank,.picture-list{display:grid;gap:11px}.word,.picture{font:inherit;font-weight:900}.word{min-height:58px;border:2px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font-size:1.2rem;cursor:grab}.word:hover,.word:focus-visible,.word.is-selected{border-color:var(--blue);outline:3px solid #d7eff4}.word.is-selected{background:#edf9fb}.word.is-used{opacity:.48;cursor:not-allowed;text-decoration:line-through}.picture{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;min-height:116px;padding:10px;border:2px dashed var(--line);border-radius:18px;background:#fff;cursor:pointer}.picture:hover,.picture:focus-visible{border-color:var(--blue);outline:3px solid #d7eff4}.picture.is-matched{border-style:solid;border-color:#8dcdbd;background:#effbf3;cursor:default}.image-frame{position:relative;display:grid;place-items:center;width:110px;height:92px;border-radius:12px;background:#edf6f4;overflow:hidden}.image-frame img{display:block;width:100%;height:100%;object-fit:contain}.image-placeholder{display:none;padding:10px;color:#526e78;font-size:.78rem;font-weight:900;line-height:1.25;text-align:center}.image-frame.is-placeholder img{display:none}.image-frame.is-placeholder .image-placeholder{display:block}.picture-status{font-size:1.05rem}.picture-status small{display:block;margin-top:4px;color:#526e78;font-size:.8rem;font-weight:800}.picture.is-matched .picture-status{color:var(--success)}.hint{min-height:1.5em;margin:19px 0 0;color:#526e78;font-weight:800}.hint.error{color:var(--error)}.complete{padding:18px}.complete .star{font-size:3rem}.score{margin:18px auto;padding:14px;border:2px solid #c9e2d3;border-radius:16px;max-width:340px;background:#effbf3;font-weight:900}.button{display:inline-flex;justify-content:center;align-items:center;min-height:54px;padding:12px 22px;border:0;border-radius:16px;background:var(--blue);box-shadow:0 5px 0 #155369;color:#fff;font:900 1rem Nunito,"Segoe UI",sans-serif;text-decoration:none;cursor:pointer}@media(max-width:650px){.page{width:calc(100% - 18px);padding-top:10px}.card{border-radius:23px}.matching-board{grid-template-columns:1fr}.picture{grid-template-columns:92px 1fr}.image-frame{width:92px;height:78px}}
     .activity-intro{display:flex;flex-direction:column;align-items:center;gap:12px}.activity-intro h1{margin:0}.activity-intro .instruction{margin:0}.intro-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(760px,100%);margin:4px auto 2px;padding:0;list-style:none;counter-reset:intro-step}.intro-steps li{padding:12px 10px;border:2px solid #94d9d6;border-radius:18px;background:#ffffffe8;color:#456876;font-weight:900;counter-increment:intro-step}.intro-steps li::before{display:block;margin-bottom:4px;color:#e7af45;font-size:1.35rem;content:counter(intro-step)}.intro-preview{display:flex;justify-content:center;gap:10px;width:100%;margin:2px 0}.intro-preview-item{display:grid;place-items:center;gap:4px;width:92px;padding:7px;border:3px solid #94d9d6;border-radius:18px;background:#ffffffe8;color:#187b7a;font-weight:900}.intro-preview-item img{width:64px;height:52px;object-fit:contain}.intro-error{min-height:1.2em;margin:0;color:#a63b3b;font-weight:900}@media(max-width:680px){.intro-steps{grid-template-columns:1fr;gap:6px}.intro-steps li{padding:8px}.intro-steps li::before{display:inline;margin-right:6px}.intro-preview-item{width:76px;padding:5px}.intro-preview-item img{width:52px;height:42px}}

<body>
  <main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card" aria-live="polite"></section></main>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script>
  (() => {
    'use strict';
    const data = JSON.parse(document.getElementById('prescribed-activity-data').textContent || '{}');
    const items = Array.isArray(data.items) ? data.items : [];
    const words = Array.isArray(data.word_bank) ? data.word_bank : [];
    const app = document.getElementById('app');
    const escape = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const csrf = () => ((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/) || [])[1] || '');
    const restored = data.progress?.state && typeof data.progress.state === 'object' ? data.progress.state : {};
    let matches = data.progress?.matches && typeof data.progress.matches === 'object' ? {...data.progress.matches} : {};
     let selectedWord = null, matchAttempts = Math.max(0, Number(restored.match_attempts) || 0);
     const introEnabled = Boolean(data.intro_enabled);
     let stateVersion = Math.max(0, Number(restored.state_version) || 0), requestVersion = 0, attemptVersion = 0, activeAttemptController = null, activeAttemptSnapshot = null, activeAttemptCommitted = false, matchVersion = 0, activeMatchController = null, activeMatchCommitted = false, busy = false, startedAt = Date.now(), phase = restored.phase === 'matching' ? 'matching' : 'oral_reading', oralIndex = Math.max(0, Math.min(items.length, Number(restored.oral_index) || 0)), readingAttempts = 0, aloudAttempts = 0, oralMode = 'read', oralStatus = '', stream = null, oralAudio = null, announcedOralIndex = -1, announcedMatching = false;
    let sttAttempts = restored.stt_attempts && typeof restored.stt_attempts === 'object' ? {...restored.stt_attempts} : {};
    let ttsPlays = restored.tts_plays && typeof restored.tts_plays === 'object' ? {...restored.tts_plays} : {};
    const restoreOralAttempts = () => { readingAttempts = Math.max(0, Number(sttAttempts[String(oralIndex)]) || 0); aloudAttempts = Math.max(0, Number(ttsPlays[String(oralIndex)]) || 0); oralMode = readingAttempts >= 3 ? 'aloud' : 'read'; };
    restoreOralAttempts();

    const state = () => ({match_attempts: matchAttempts, phase, oral_index: oralIndex, stt_attempts: sttAttempts, tts_plays: ttsPlays, state_version: ++stateVersion});
    const completed = () => Object.keys(matches).length;
    const heading = () => `<p class="eyebrow">Session 6 · Lesson ${data.lesson_number} · Gawain ${data.gawain_number}</p><h1>${escape(data.title)}</h1><p class="instruction">${escape(data.instruction)}</p><div class="count">${completed()} / ${items.length} na naiuugnay</div><div class="track" aria-hidden="true"><i style="width:${items.length ? completed() / items.length * 100 : 0}%"></i></div>`;
    function renderIntro() {
      const steps = (data.intro_steps || []).map(step => `<li>${escape(step)}</li>`).join('');
      const preview = items.slice(0, 3).map(item => `<div class="intro-preview-item"><img src="${escape(item.image_url)}" alt="${escape(item.alt_text || item.placeholder_label)}"><span>Larawan ${escape(item.id.split('-').pop())}</span></div>`).join('');
      app.innerHTML = `<div class="activity-intro"><p class="eyebrow">Session 6 · Lesson ${escape(data.lesson_number)} · Gawain ${escape(data.gawain_number)}</p><h1>${escape(data.title)}</h1><p class="instruction">${escape(data.instruction)}</p><div class="intro-preview" aria-label="Mga halimbawa ng larawan">${preview}</div><ol class="intro-steps">${steps}</ol><p class="intro-error" id="introError"></p><button class="button" id="activityStart" type="button">SIMULAN</button></div>`;
      document.getElementById('activityStart').onclick = async () => {
        if (busy) return;
        busy = true; phase = 'oral_reading';
        try { await save(); render(); }
        catch (error) { phase = 'intro'; const status = document.getElementById('introError'); if (status) status.textContent = error.message; }
        finally { busy = false; }
      };
    }

    async function request(url, body, signal) {
      const response = await fetch(url, {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json','X-CSRFToken':csrf()}, body:JSON.stringify(body), ...(signal ? {signal} : {})});
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success) throw Error(result.error || 'Hindi na-save ang iyong sagot.');
      return result;
    }
    async function save(candidateMatch, signal) {
      const sequence = ++requestVersion;
      const result = await request(data.progress_url, {material_id:data.material_id, matches, state:state(), ...(candidateMatch ? {candidate_match:candidateMatch} : {})}, signal);
      if (sequence === requestVersion && result.progress) {
        matches = result.progress.matches && typeof result.progress.matches === 'object' ? {...result.progress.matches} : matches;
        stateVersion = Math.max(stateVersion, Number(result.progress.state?.state_version) || 0);
        phase = result.progress.state?.phase === 'matching' ? 'matching' : 'oral_reading';
        oralIndex = Math.max(0, Math.min(items.length, Number(result.progress.state?.oral_index) || oralIndex));
        sttAttempts = result.progress.state?.stt_attempts && typeof result.progress.state.stt_attempts === 'object' ? {...result.progress.state.stt_attempts} : sttAttempts;
        ttsPlays = result.progress.state?.tts_plays && typeof result.progress.state.tts_plays === 'object' ? {...result.progress.state.tts_plays} : ttsPlays;
        restoreOralAttempts();
      }
      return result;
    }
    const stopOral = () => { stream?.getTracks().forEach(track => track.stop()); stream = null; if (oralAudio) { oralAudio.pause(); oralAudio = null; } };
    async function playPrescribedReadAloud(text) {
      const form = new FormData(); form.append('text', text); form.append('language', 'Filipino'); form.append('prescribed_activity_key', data.activity_key);
      const response = await fetch(data.read_aloud_url, {method:'POST', credentials:'same-origin', headers:{'X-CSRFToken':csrf()}, body:form}), result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success || !result.audio_content || result.tts_language !== 'fil-PH' || result.voice_name !== 'fil-PH-Wavenet-A') throw Error(result.error || 'Hindi available ang Filipino audio.');
      if (oralAudio) oralAudio.pause(); oralAudio = new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(result.audio_content), char => char.charCodeAt(0))], {type:result.mime_type || 'audio/mpeg'}))); await oralAudio.play(); await new Promise((resolve, reject) => { oralAudio.onended = resolve; oralAudio.onerror = () => reject(Error('Hindi ma-play ang audio.')); });
    }
    const narrateFeedback = async message => { try { await playPrescribedReadAloud(message); } catch (error) { const status = app.querySelector('.oral-status, .hint'); if (status) status.textContent = error.message || 'Hindi available ang Filipino audio.'; } };
    // Each oral item starts with its dedicated word recording. Match prompts
    // are reserved for the matching phase and feedback remains separate.
    const announceOralItem = () => { const item = items[oralIndex]; if (!item || announcedOralIndex === oralIndex) return; announcedOralIndex = oralIndex; void playPrescribedReadAloud(`${data.instruction} Basahin ang salita: ${item.read_word}.`).catch(error => { const status = app.querySelector('.oral-status'); if (status) status.textContent = error.message || 'Hindi available ang Filipino audio.'; }); };
    const announceMatching = () => { if (announcedMatching) return; announcedMatching = true; void playPrescribedReadAloud(data.instruction).catch(error => { const status = app.querySelector('.hint'); if (status) status.textContent = error.message || 'Hindi available ang Filipino audio.'; }); };
     function renderOral(message = '', kind = '') {
      const item = items[oralIndex];
      const actionLabel = oralMode === 'aloud' ? '🔊 Pakinggan muna' : oralStatus || '🎙 Basahin ngayon';
      app.innerHTML = heading() + `<p class="hint">Basahin nang malakas ang salita bago magpatuloy sa pagkakabit. Salita ${oralIndex + 1} sa ${items.length}.</p><img class="oral-image" src="${escape(item.image_url)}" alt="${escape(item.alt_text || item.placeholder_label)}"><div class="oral-word">${escape(item.read_word)}</div><button class="button ${oralMode === 'aloud' ? 'gold' : ''}" id="oral-action" type="button" ${oralMode === 'aloud' ? '' : 'data-basahin-button'} ${busy ? 'disabled' : ''}>${escape(actionLabel)}</button><p class="oral-status ${kind}">${escape(message)}</p>`;
      const oralAction = app.querySelector('#oral-action');
      if (oralMode === 'aloud') oralAction.onclick = listenCurrentWord;
      else window.Basahin.bindActivity(oralAction, readCurrentWord);
       announceOralItem();
     }
     async function readCurrentWord() {
      if (busy) return;
      const attempt = ++attemptVersion;
      const controller = new AbortController();
      activeAttemptController = controller;
      activeAttemptSnapshot = {oralIndex, phase, readingAttempts, aloudAttempts, oralMode};
      activeAttemptCommitted = false;
      let item = items[oralIndex], button = app.querySelector('#oral-action');
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder || !window.Basahin) { readingAttempts = Math.min(3, readingAttempts + 1); oralMode = readingAttempts >= 3 ? 'aloud' : 'read'; const feedback = oralMode === 'aloud' ? 'Pakinggan muna ang salita.' : `Hindi available ang mikropono. May ${3 - readingAttempts} pagkakataon pa.`; renderOral(feedback, 'error'); await narrateFeedback(feedback, 'readingRetry'); return; }
      busy = true; oralStatus = '🎙 Nakikinig…'; renderOral('Nakikinig sa iyong pagbasa…', 'good');
      try {
        button = app.querySelector('#oral-action');
        button.disabled = true; button.textContent = 'Nagbabasa...';
        stream = await window.Basahin.openMicrophone({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}, {signal:controller.signal});
        if (attempt !== attemptVersion || controller.signal.aborted) return;
        const recording = await window.Basahin.capture({button, stream, signal:controller.signal});
        if (attempt !== attemptVersion || controller.signal.aborted) return;
        stopOral(); oralStatus = '⏳ Pinoproseso…'; renderOral('Pinoproseso ang iyong pagbasa…', 'good');
        const form = new FormData(); form.append('audio', recording, 'lesson16-gawain3-reading.webm');window.Basahin.attachStreamResult?.(form,recording); form.append('target_text', item.read_word); form.append('language', 'Filipino'); form.append('mode', 'reading');
        const response = await fetch(data.transcribe_url, {method:'POST', credentials:'same-origin', headers:{'X-CSRFToken':csrf()}, body:form, signal:controller.signal}), result = await response.json().catch(() => ({}));
        if (attempt !== attemptVersion || controller.signal.aborted) return;
        if (!response.ok || !result.success || result.complete !== true) throw Error('Hindi pa. Subukan muli.');
        sttAttempts[String(oralIndex)] = 0; ttsPlays[String(oralIndex)] = 0;
        oralIndex += 1; phase = oralIndex >= items.length ? 'matching' : 'oral_reading'; restoreOralAttempts();
        await save(undefined, controller.signal); if (attempt !== attemptVersion || controller.signal.aborted) return; activeAttemptCommitted = true; oralStatus = ''; await narrateFeedback('Tama ang pagbasa!', 'readingCorrect');
        if (phase === 'matching') render(); else renderOral('Tama ang pagbasa!', 'good');
      } catch (error) {
        if (attempt !== attemptVersion || controller.signal.aborted) return;
        oralStatus = ''; readingAttempts = Math.min(3, readingAttempts + 1); sttAttempts[String(oralIndex)] = readingAttempts; if (readingAttempts >= 3) oralMode = 'aloud'; await save(undefined, controller.signal).catch(() => {});
        const feedback = oralMode === 'aloud' ? 'Pakinggan muna ang salita.' : error.message || 'Hindi nakuha ang boses. Subukan muli.'; renderOral(feedback, 'error'); await narrateFeedback(feedback, 'readingRetry');
      } finally {
        stopOral();
        if (activeAttemptController === controller) { activeAttemptController = null; activeAttemptSnapshot = null; }
        busy = false;
        // renderOral can run while the recording request is still marked busy.
        // Restore the newly-rendered control once that request has finished so
        // the learner can continue to the next word.
        const action = app.querySelector('#oral-action');
        if (action) action.disabled = false;
      }
    }
    async function listenCurrentWord() {
      if (busy) return;
      const item = items[oralIndex], button = app.querySelector('#oral-action'); busy = true;
      try {
        button.disabled = true; button.textContent = 'Nilo-load...'; await playPrescribedReadAloud(item.read_word);
        aloudAttempts = Math.min(3, aloudAttempts + 1); const completedListeningCycle = aloudAttempts === 3; ttsPlays[String(oralIndex)] = aloudAttempts; if (completedListeningCycle) { readingAttempts = 0; aloudAttempts = 0; sttAttempts[String(oralIndex)] = 0; ttsPlays[String(oralIndex)] = 0; oralMode = 'read'; } await save(); renderOral(completedListeningCycle ? 'Subukan mong basahin ang salita.' : 'Pakinggan muli kung kailangan.');
      } catch (error) { renderOral(error.message || 'Hindi available ang Read Aloud.', 'error'); }
      finally {
        stopOral();
        busy = false;
        // See readCurrentWord: the render happens before `busy` is cleared.
        const action = app.querySelector('#oral-action');
        if (action) action.disabled = false;
      }
    }
    function render() {
      if (!items.length || !words.length) { app.innerHTML = '<p class="hint error">Walang laman ang gawaing ito.</p>'; return; }
      if (data.progress?.activity_completed) { showDone(); return; }
      if (phase === 'matching' && completed() >= items.length) { complete(); return; }
       if (phase === 'matching' && oralIndex < items.length) { phase = 'oral_reading'; restoreOralAttempts(); }
       if (phase === 'oral_reading') { renderOral(); return; }
      const usedWords = new Set(Object.values(matches));
      app.innerHTML = heading() + `<div class="matching-board"><section><h2 class="board-heading">Mga salita</h2><div class="word-bank">${words.map(word => `<button class="word${selectedWord === word ? ' is-selected' : ''}${usedWords.has(word) ? ' is-used' : ''}" type="button" data-word="${escape(word)}" draggable="${!usedWords.has(word)}" ${usedWords.has(word) ? 'disabled' : ''}>${escape(word)}</button>`).join('')}</div></section><section><h2 class="board-heading">Mga larawan</h2><div class="picture-list">${items.map(item => { const matched = matches[item.id]; return `<button class="picture${matched ? ' is-matched' : ''}" type="button" data-target="${escape(item.id)}" ${matched ? 'disabled' : ''}><span class="image-frame"><img src="${escape(item.image_url)}" alt="${escape(item.alt_text || item.placeholder_label)}"><span class="image-placeholder">${escape(item.placeholder_label)}<br>Idagdag ang larawan</span></span><span class="picture-status">${matched ? `✓ ${escape(matched)}` : 'Piliin ang katumbas na salita'}${matched ? '<small>Tamang pagkakabit</small>' : '<small>I-tap o i-drag ang salita rito</small>'}</span></button>`; }).join('')}</div></section></div><p class="hint" id="hint">${selectedWord ? `Napili: ${escape(selectedWord)}. I-tap ang katumbas na larawan.` : 'Pumili ng salita, pagkatapos ay i-tap ang katumbas na larawan.'}</p>`;
      app.querySelectorAll('.image-frame img').forEach(image => image.addEventListener('error', () => image.parentElement.classList.add('is-placeholder'), {once:true}));
      app.querySelectorAll('[data-word]').forEach(button => { button.addEventListener('click', () => { selectedWord = button.dataset.word; render(); }); button.addEventListener('dragstart', event => event.dataTransfer.setData('text/plain', button.dataset.word)); });
      app.querySelectorAll('[data-target]').forEach(target => { target.addEventListener('click', () => submit(target.dataset.target)); target.addEventListener('dragover', event => event.preventDefault()); target.addEventListener('drop', event => { event.preventDefault(); submit(target.dataset.target, event.dataTransfer.getData('text/plain')); }); }); announceMatching();
    }
    async function submit(targetId, draggedWord = '') {
      const word = draggedWord || selectedWord;
      const hint = document.getElementById('hint');
      if (!word) { hint.textContent = 'Pumili muna ng salita.'; hint.className = 'hint error'; return; }
      if (busy) return;
      const operation = ++matchVersion;
      const controller = new AbortController();
      activeMatchController = controller;
      activeMatchCommitted = false;
      busy = true; matchAttempts++; hint.textContent = 'Sinusuri ang pagkakabit…'; hint.className = 'hint';
      try {
        const validation = await request(data.progress_url, {matches, state:state(), candidate_match:{target_id:targetId, word}, validate_only:true}, controller.signal);
        if (operation !== matchVersion || controller.signal.aborted) return;
        if (validation.accepted) {
          const pendingMatches = {...matches, [targetId]: word};
          const committed = await request(data.progress_url, {matches:pendingMatches, state:state()}, controller.signal);
          if (operation !== matchVersion || controller.signal.aborted) return;
          matches = committed.progress?.matches && typeof committed.progress.matches === 'object' ? {...committed.progress.matches} : pendingMatches;
          activeMatchCommitted = true;
          selectedWord = null;
          const finalMatch = completed() >= items.length;
          await narrateFeedback('Tama! Magaling!', finalMatch ? 'completion' : 'matchingCorrect');
          if (operation !== matchVersion || controller.signal.aborted) return;
          if (finalMatch) { busy = false; await complete(); return; }
          render();
          return;
        }
        const result = await save({target_id:targetId, word}, controller.signal);
        if (operation !== matchVersion || controller.signal.aborted) return;
        activeMatchCommitted = true;
        if (result.accepted) { selectedWord = null; const finalMatch = completed() >= items.length; const feedback = 'Tama! Magaling!'; await narrateFeedback(feedback, finalMatch ? 'completion' : 'matchingCorrect'); if (operation !== matchVersion || controller.signal.aborted) return; if (finalMatch) { busy = false; await complete(); return; } render(); return; }
        const feedback = 'Hindi magkatugma. Subukan muli.'; hint.textContent = feedback; hint.className = 'hint error'; await narrateFeedback(feedback, 'matchingRetry');
      } catch (error) { if (operation !== matchVersion || controller.signal.aborted) return; hint.textContent = error.message; hint.className = 'hint error'; }
      finally { if (activeMatchController === controller) activeMatchController = null; busy = false; }
    }
    async function complete() {
      if (busy) return;
      busy = true; app.innerHTML = heading() + '<p class="hint">Itinatala ang iyong natapos na gawain…</p>';
      try { const result = await request(data.completion_url, {material_id:data.material_id, matches, duration_seconds:Math.max(1, Math.round((Date.now() - startedAt) / 1000))}); showDone(result.result); }
      catch (error) { app.innerHTML = heading() + `<p class="hint error">${escape(error.message)}</p><button class="button" id="retry" type="button">Subukang muli</button>`; document.getElementById('retry').onclick = () => { busy = false; complete(); }; }
    }
    function showDone(result) { const correct = Number(result?.correct_items ?? completed()); app.innerHTML = `<div class="complete"><div class="star">⭐</div><h1>Magaling!</h1><p class="instruction">Natapos mo ang Lesson ${data.lesson_number}: Gawain ${data.gawain_number}.</p><div class="score">Puntos: ${correct} / ${items.length}</div><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`; busy = false; }
    addEventListener('pagehide', stopOral);
    let ttsPaused = false;
    addEventListener('session6-prescribed-cancel', event => {
      const reason = event.detail?.reason || 'cancel';
      const preserveMatchingTts = (reason === 'help' || reason === 'pause') && activeMatchController;
      const committedMatch = activeMatchCommitted;
      requestVersion += 1;
      attemptVersion += 1;
      if (!preserveMatchingTts) {
        matchVersion += 1;
        activeMatchController?.abort();
        activeMatchController = null;
        activeMatchCommitted = false;
      } else if (oralAudio) {
        oralAudio.pause();
        ttsPaused = true;
      }
      if (activeAttemptController && !activeAttemptCommitted && activeAttemptSnapshot) {
        oralIndex = activeAttemptSnapshot.oralIndex; phase = activeAttemptSnapshot.phase;
        readingAttempts = activeAttemptSnapshot.readingAttempts; aloudAttempts = activeAttemptSnapshot.aloudAttempts; oralMode = activeAttemptSnapshot.oralMode;
      }
      activeAttemptController?.abort(); activeAttemptController = null; activeAttemptSnapshot = null; activeAttemptCommitted = false;
      busy = Boolean(preserveMatchingTts);
      oralStatus = '';
      const status = app.querySelector('.oral-status'); if (status) status.textContent = '';
      const action = app.querySelector('#oral-action'); if (action) { action.disabled = false; action.textContent = oralMode === 'aloud' ? 'Pakinggan muna' : 'Basahin ngayon'; }
      if (!preserveMatchingTts) stopOral();
      if (reason === 'mute' && committedMatch) render();
    });
    addEventListener('session6-prescribed-resume', () => {
      if (!ttsPaused || !oralAudio) return;
      ttsPaused = false;
      oralAudio.play().catch(() => {});
    });
    const session6RenderOral = renderOral, session6Render = render;
    renderOral = (...args) => { const result = session6RenderOral(...args); window.dispatchEvent(new CustomEvent('session6-prescribed-render')); return result; };
    render = (...args) => { const result = session6Render(...args); window.dispatchEvent(new CustomEvent('session6-prescribed-render')); return result; };
    render();
  })();
  </script>
