<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAWAIN 4: Letrang Oo | PABASA</title><style>html,body{height:100%;margin:0;overflow:hidden}body{background:#e1f5f7;color:#16465d;font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(980px,calc(100% - 24px));height:100%;margin:auto;padding:14px 0 8px;display:flex;flex-direction:column}.back{align-self:flex-start;padding:8px 13px;border:2px solid #bfdde4;border-radius:12px;background:#fff;color:#16465d;font-weight:900;text-decoration:none}.card{flex:1;min-height:0;margin-top:10px;padding:22px;border-radius:26px;background:#fffdf7;text-align:center;overflow:hidden}h1{margin:4px 0;font-size:clamp(1.7rem,4vw,2.6rem)}.eyebrow{margin:0;color:#997124;font-size:.75rem;font-weight:900}.instruction{margin:0 0 10px;font-weight:800}.progress{height:8px;background:#dcebed;border-radius:99px}.progress i{display:block;height:100%;background:#e6a33a}.sheet{padding:8px 14px;border:2px solid #dce8ed;border-radius:18px;background:#fff}.row{position:relative;height:clamp(70px,12vh,105px);margin:8px 0;border-block:4px solid #2b83bd}.row:after{content:"";position:absolute;inset:50% 0 auto;border-top:3px dashed #d64c55}.row canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}.model{position:absolute;left:13%;bottom:0;color:#398ac5;font:700 clamp(3.5rem,8vh,5rem)/1 cursive;opacity:.22}.hint{min-height:22px;margin:6px 0;font-weight:800;color:#71828a}.actions{display:flex;justify-content:center;gap:10px}.button{width:120px;min-height:48px;border:0;border-radius:13px;background:#2b83bd;color:#fff;font-weight:900;cursor:pointer}.clear{background:#fff;color:#16465d;border:2px solid #bfdde4}.done{display:grid;place-items:center;height:100%;color:#25714a}.done>div{width:min(100%,560px);padding:42px 28px;border:2px solid #c9e2d3;border-radius:26px;background:#ffffffd9;box-shadow:0 16px 34px #2d69731c}.done>div:before{content:"✓";display:grid;place-items:center;width:76px;height:76px;margin:0 auto 18px;border-radius:50%;background:#dff4e6;color:#26784e;font-size:2.5rem;font-weight:900;box-shadow:0 5px 0 #b7d9c1}.done h1{margin:0;font-size:clamp(2.2rem,6vw,3.5rem);line-height:1.05}.done p{margin:14px 0 24px;font-size:1.1rem;font-weight:800}.done .button{width:240px;min-height:50px}</style></head><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card"></section></main>{{ handwriting_activity_data|json_script:"handwriting-data" }}<script>
(()=>{const d=JSON.parse(document.getElementById('handwriting-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'',getRows=()=>[...app.querySelectorAll('canvas')];let complete=!!d.progress?.activity_completed,busy=false;const component=pts=>{if(pts.length<10)return false;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),e=Math.max(...ys),w=b-a+1,h=e-c+1,cx=(a+b)/2,cy=(c+e)/2;if(w<10||h<14||w>h*2)return false;return pts.filter(p=>Math.abs(p[0]-cx)<w*.25&&Math.abs(p[1]-cy)<h*.28).length/pts.length<.35};const valid=c=>{const p=c.getContext('2d').getImageData(0,0,c.width,c.height).data,pts=[];for(let y=0;y<c.height;y+=2)for(let x=0;x<c.width;x+=2)if(p[(y*c.width+x)*4+3]>35)pts.push([x,y]);if(pts.length<25)return false;const cols=new Map;pts.forEach(([x])=>cols.set(x,(cols.get(x)||0)+1));const xs=[...cols.keys()].sort((a,b)=>a-b);let gap=0,split=xs[Math.floor(xs.length/2)];for(let i=1;i<xs.length;i++){const g=xs[i]-xs[i-1];if(g>gap){gap=g;split=(xs[i]+xs[i-1])/2}}return gap>=4&&component(pts.filter(p=>p[0]<=split))&&component(pts.filter(p=>p[0]>split))};const save=()=>fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({activity_key:d.activity_key,current_index:3,completed_items:3,state:{activity_key:d.activity_key,completed_areas:3}})});const draw=c=>{const r=c.getBoundingClientRect(),q=devicePixelRatio||1;c.width=r.width*q;c.height=r.height*q;const x=c.getContext('2d');x.scale(q,q);x.strokeStyle='#286b93';x.lineWidth=5;x.lineCap='round';let down=false,pt=e=>({x:e.clientX-r.left,y:e.clientY-r.top});c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const p=pt(e);x.beginPath();x.moveTo(p.x,p.y)};c.onpointermove=e=>{if(down){const p=pt(e);x.lineTo(p.x,p.y);x.stroke()}};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false};const render=()=>{if(complete){app.innerHTML='<div class="done"><div><h1>Magaling!</h1><p>Natapos mo ang GAWAIN 4: Letrang Oo.</p><button class="button" id="return">Bumalik sa Aking Aralin</button></div>';document.getElementById('return').onclick=()=>location.href='/dashboard/assessment/';return}app.innerHTML='<p class="eyebrow">SESSION 3 · LESSON 7 · GAWAIN 4</p><h1>GAWAIN 4: Letrang Oo</h1><p class="instruction">Magsanay Magsulat</p><div class="progress"><i></i></div><div class="sheet">'+[0,1,2].map(()=>'<div class="row"><span class="model">Oo</span><canvas></canvas></div>').join('')+'</div><p class="hint" id="hint">Isulat ang Oo sa bawat hanay.</p><div class="actions"><button class="button clear" id="clear">Burahin</button><button class="button" id="submit">Isumite</button></div>';getRows().forEach(draw);clear.onclick=()=>getRows().forEach(c=>c.getContext('2d').clearRect(0,0,c.width,c.height));submit.onclick=async()=>{if(busy)return;const hint=document.getElementById('hint');if(!getRows().every(valid)){hint.textContent='May kulang o maling sulat. Tingnan muli ang bawat hanay at subukan ulit.';return}busy=true;const saved=await save();const done=saved.ok&&await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});complete=!!done;busy=false;render()}};render()})();</script></body></html>
