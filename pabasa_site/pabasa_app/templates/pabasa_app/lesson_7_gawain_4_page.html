{% load static %}
<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GAWAIN 4: Letrang Oo | PABASA</title>
  <link rel="stylesheet" href="{% static 'pabasa_app/css/lesson_7_gawain_4.css' %}?v=20260918-2">
</head>
<body>
  <main class="page">
    <a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a>
    <section id="app" class="card"></section>
  </main>
  {{ handwriting_activity_data|json_script:"handwriting-data" }}
  <script>
  (() => {
    const data=JSON.parse(document.getElementById('handwriting-data').textContent||'{}');
    const app=document.getElementById('app');
    const instructionText='Magsanay magsulat ng Letrang Oo. Isulat nang tatlong beses ang Letrang Oo.';
    const narrationText='Magsanay magsulat ng letrang o. Isulat nang tatlong beses ang letrang o.';
    const normalHint='Isulat ang Oo sa bawat hanay.';
    const retryMessage='Subukan ulit! Isulat nang malinaw ang letrang Oo.';
    const retryNarration='Subukan ulit! Isulat nang malinaw ang letrang Oo.';
    const csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';
    let index=Math.max(0,Math.min(3,Number(data.progress?.current_index)||0));
    let busy=false;
    let instructionPlayedFor=-1;
    const rows=[[],[],[]];

    const speak=text=>fetch('{% url "reading_read_aloud_api" %}',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8','X-CSRFToken':csrf()},body:new URLSearchParams({target_text:text,prescribed_activity_key:'lesson7-gawain4'})}).then(response=>response.ok?response.json():null).then(result=>new Promise(resolve=>{if(!result?.success||!result.audio_content){resolve();return}const audio=new Audio('data:'+(result.mime_type||'audio/mpeg')+';base64,'+result.audio_content);audio.onended=resolve;audio.onerror=resolve;audio.play().catch(resolve)})).catch(()=>{});
    const controls=()=>[app.querySelector('#clear'),app.querySelector('#next')].filter(Boolean);
    const setControlsDisabled=disabled=>controls().forEach(button=>{button.disabled=disabled});
    const setHint=text=>{const hint=app.querySelector('#hint');if(hint)hint.textContent=text};
    const narrateInstruction=async()=>{if(index>=3||instructionPlayedFor===index)return;instructionPlayedFor=index;busy=true;setControlsDisabled(true);await speak(narrationText);busy=false;setControlsDisabled(false)};
    const retry=async()=>{setHint(retryMessage);busy=true;setControlsDisabled(true);await speak(retryNarration);busy=false;setControlsDisabled(false)};
    const point=(event,canvas)=>{const rect=canvas.getBoundingClientRect();return{x:(event.clientX-rect.left)/rect.width,y:(event.clientY-rect.top)/rect.height}};

    const valid=canvas=>{
      const pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data,points=[];
      for(let y=0;y<canvas.height;y+=2)for(let x=0;x<canvas.width;x+=2)if(pixels[(y*canvas.width+x)*4+3]>35)points.push([x,y]);
      if(points.length<60)return false;
      const xs=points.map(point=>point[0]),ys=points.map(point=>point[1]),left=Math.min(...xs),right=Math.max(...xs),top=Math.min(...ys),bottom=Math.max(...ys),width=right-left+1,height=bottom-top+1;
      if(width<30||height<20||width/height<.65||width/height>4.5)return false;
      const scale=2,gridWidth=Math.ceil(canvas.width/scale),gridHeight=Math.ceil(canvas.height/scale),ink=new Uint8Array(gridWidth*gridHeight),outside=new Uint8Array(gridWidth*gridHeight);
      for(let gy=0;gy<gridHeight;gy++)for(let gx=0;gx<gridWidth;gx++)if(pixels[((gy*scale)*canvas.width+(gx*scale))*4+3]>35)ink[gy*gridWidth+gx]=1;
      const flood=(start,seen)=>{const cells=[start];seen[start]=1;for(let cursor=0;cursor<cells.length;cursor++){const cell=cells[cursor],gx=cell%gridWidth,gy=Math.floor(cell/gridWidth),neighbors=[];if(gx>0)neighbors.push(cell-1);if(gx<gridWidth-1)neighbors.push(cell+1);if(gy>0)neighbors.push(cell-gridWidth);if(gy<gridHeight-1)neighbors.push(cell+gridWidth);neighbors.forEach(next=>{if(!ink[next]&&!seen[next]){seen[next]=1;cells.push(next)}})}return cells};
      const outsideSeen=new Uint8Array(gridWidth*gridHeight),edgeStarts=[];
      for(let gx=0;gx<gridWidth;gx++){edgeStarts.push(gx,(gridHeight-1)*gridWidth+gx)}
      for(let gy=0;gy<gridHeight;gy++){edgeStarts.push(gy*gridWidth,gy*gridWidth+gridWidth-1)}
      [...new Set(edgeStarts)].forEach(cell=>{if(!ink[cell]&&!outsideSeen[cell])flood(cell,outsideSeen)});
      const seen=new Uint8Array(gridWidth*gridHeight),holes=[];
      for(let gy=1;gy<gridHeight-1;gy++)for(let gx=1;gx<gridWidth-1;gx++){const start=gy*gridWidth+gx;if(ink[start]||outsideSeen[start]||seen[start])continue;const cells=flood(start,seen);if(cells.length<8)continue;const holeXs=cells.map(cell=>cell%gridWidth),holeYs=cells.map(cell=>Math.floor(cell/gridWidth)),holeWidth=Math.max(...holeXs)-Math.min(...holeXs)+1,holeHeight=Math.max(...holeYs)-Math.min(...holeYs)+1;if(holeWidth>=2&&holeHeight>=2&&holeWidth/holeHeight>=.3&&holeWidth/holeHeight<=3)holes.push({area:cells.length,width:holeWidth,height:holeHeight})}
      if(holes.length!==2)return false;
      const inkDensity=points.length/(width*height);
      return inkDensity>.01&&inkDensity<.6&&holes.every(hole=>hole.area>=8);
    };


    const bindCanvas=canvas=>{const rect=canvas.getBoundingClientRect(),ratio=devicePixelRatio||1;canvas.width=Math.max(1,Math.round(rect.width*ratio));canvas.height=Math.max(1,Math.round(rect.height*ratio));const context=canvas.getContext('2d');context.setTransform(ratio,0,0,ratio,0,0);context.strokeStyle='#286b93';context.lineWidth=5;context.lineCap='round';context.lineJoin='round';let active=null;const append=event=>{if(!active)return;const pointValue=point(event,canvas),last=active.points[active.points.length-1];if(!last||pointValue.x!==last.x||pointValue.y!==last.y){active.points.push(pointValue);context.lineTo(pointValue.x*rect.width,pointValue.y*rect.height);context.stroke()}};canvas.addEventListener('pointerdown',event=>{if(busy)return;event.preventDefault();const pointValue=point(event,canvas);active={pointerId:event.pointerId,points:[pointValue]};rows[index].push(active.points);context.beginPath();context.moveTo(pointValue.x*rect.width,pointValue.y*rect.height);canvas.setPointerCapture?.(event.pointerId)});canvas.addEventListener('pointermove',event=>{if(active?.pointerId===event.pointerId)(event.getCoalescedEvents?.()||[event]).forEach(append)});const finish=event=>{if(active?.pointerId!==event.pointerId)return;append(event);canvas.releasePointerCapture?.(event.pointerId);active=null};canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish)};

    async function submitCurrent(){
      if(busy)return;
      const canvas=app.querySelector('canvas');
      if(!canvas||!valid(canvas)){await retry();return}
      busy=true;setControlsDisabled(true);
      try{
        const response=await fetch(data.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({current_index:index+1,completed_items:index+1,state:{activity_key:data.activity_key,completed_areas:index+1}})});
        if(!response.ok){await retry();return}
        if(index<2){index+=1;render();return}
        const completion=await fetch(data.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});
        const result=await completion.json().catch(()=>null);
        if(!completion.ok||!result?.success){await retry();return}
        index=3;render();
      }catch(error){await retry()}
      finally{busy=false;if(index<3)setControlsDisabled(false)}
    }

    function render(){
      if(index>=3){app.innerHTML='<div class="done"><div><h1>Magaling!</h1><p>Natapos mo ang GAWAIN 4: Letrang Oo.</p></div></div>';return}
      const row='<div class="row"><span class="model"><b>O</b><i>o</i></span><canvas aria-label="Hanay '+(index+1)+'"></canvas></div>';
      app.innerHTML='<p class="eyebrow">SESSION 3 · LESSON 7 · GAWAIN 4</p><h1>GAWAIN 4: Letrang Oo</h1><p class="instruction">'+instructionText+'</p><p class="progress">Hanay '+(index+1)+' ng 3</p><div class="sheet">'+row+'</div><p class="hint" id="hint">'+normalHint+'</p><div class="actions"><button class="button clear" id="clear" type="button">Burahin</button><button class="button" id="next" type="button">'+(index===2?'Tapusin':'Susunod')+'</button></div>';
      const canvas=app.querySelector('canvas');
      bindCanvas(canvas);
      app.querySelector('#clear').onclick=()=>{if(busy)return;rows[index]=[];canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);setHint()};
      app.querySelector('#next').onclick=submitCurrent;
      narrateInstruction();
    }
    render();
  })();
  </script>
{% include 'pabasa_app/session3_prescribed_controls.html' with prefix='prescribed-s3l7g4' help_text='Magsanay sumulat ng letrang Oo.' %}</body>
</html>
