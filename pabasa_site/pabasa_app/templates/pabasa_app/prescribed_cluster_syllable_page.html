{% load static %}
<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lesson 20 at 21: Gawain 1</title>
  <style>
    @font-face{font-family:Fredoka;src:url("{% static 'pabasa_app/font/fredoka-one.one-regular.ttf' %}") format('truetype');font-display:swap}:root{--ink:#183e63;--teal:#299e9a;--teal-dark:#187b7a;--accent:#e7af45;--good:#26784e;--bad:#ad3c3c;--line:#94d9d6}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;color:var(--ink);font-family:Fredoka,Nunito,"Segoe UI",sans-serif;background:url("{% static 'pabasa_app/prescribed/PRESCRIBED-BG.jpg' %}") center/cover no-repeat}.page{position:relative;width:min(1250px,calc(100% - 32px));height:100dvh;margin:auto}.back{position:absolute;top:16px;left:0;z-index:2;display:inline-flex;align-items:center;justify-content:center;gap:13px;width:280px;min-height:64px;border-radius:999px;background:#fff;color:var(--ink);font-size:1.2rem;line-height:1.15;text-align:center;text-decoration:none;box-shadow:0 8px 17px #145ca744}.card{position:absolute;top:50%;left:50%;display:flex;flex-direction:column;justify-content:center;transform:translate(-50%,-50%);width:100%;max-height:calc(100dvh - 32px);padding:clamp(20px,3vh,38px) clamp(20px,6vw,80px);overflow:hidden;border:2px solid #ffffffaa;border-radius:42px;background:#ffffff63;backdrop-filter:blur(10px);box-shadow:0 18px 45px #1e5b7a35;text-align:center}.card h1{margin:0;color:var(--ink);font-size:clamp(1.75rem,3.7vw,3.45rem);line-height:1.08}.card h2{margin:7px 0 0;color:var(--teal-dark);font-size:clamp(1.08rem,2.1vw,1.65rem);line-height:1.2}.eyebrow{width:max-content;max-width:100%;margin:0 auto 12px;padding:8px 24px;border-radius:999px;background:#277f82;color:#fff;font-family:Nunito,"Segoe UI",sans-serif;font-size:clamp(.76rem,1.2vw,1rem);font-weight:900;letter-spacing:.04em}.instruction,.hint{margin:10px auto;color:#466879;font-family:Nunito,"Segoe UI",sans-serif;font-size:clamp(.95rem,1.4vw,1.15rem);font-weight:800}.track{width:min(700px,100%);height:11px;margin:12px auto 16px;background:#dcebea;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#72c8d5)}.picture{width:min(330px,58vw);height:clamp(150px,27vh,250px);margin:12px auto;padding:12px;border:4px solid var(--line);border-radius:28px;background:#ffffffe8}.picture img{width:100%;height:100%;object-fit:contain}.button,.chip{min-height:62px;margin:7px;padding:13px 28px;border:0;border-radius:999px;background:var(--teal);box-shadow:0 6px 0 var(--teal-dark),0 10px 20px #187b7a40;color:#fff;font:900 clamp(1rem,1.5vw,1.25rem) inherit;cursor:pointer;transition:.16s}.button:hover:not(:disabled){background:#38b0aa;transform:translateY(-2px)}.button.gold{background:var(--accent);box-shadow:0 6px 0 #b7842d,0 10px 20px #b7842d44}.button:disabled,.chip:disabled{background:#b5c5c7!important;color:#edf3f4!important;box-shadow:none!important;cursor:not-allowed!important;opacity:1}.chips{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px auto}.chip{min-width:96px;background:#fffffff0;color:var(--teal-dark);border:4px solid var(--line);box-shadow:0 5px 0 #b7d6dc,0 8px 16px #187b7a20;font-size:clamp(1.1rem,2vw,1.5rem)}.chip.selected{border-color:var(--accent);background:#fff6da;box-shadow:0 0 0 5px #f5d47c55,0 5px 0 #d7b45d}.chip.locked{border-color:var(--good);background:#e3f7e8;color:var(--good)}.status{min-height:26px;margin:8px 0 0;font-family:Nunito,"Segoe UI",sans-serif;font-weight:900}.good{color:var(--good)}.bad{color:var(--bad)}.preview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:min(840px,100%);margin:14px auto}.preview figure{margin:0;padding:8px;border:2px solid #ffffffaa;border-radius:18px;background:#ffffffe8}.preview img{width:100%;height:clamp(48px,9vh,76px);object-fit:contain}.preview figcaption{font-family:Nunito,"Segoe UI",sans-serif;font-size:clamp(.72rem,1.1vw,.92rem);font-weight:900;overflow-wrap:anywhere}.done{padding:clamp(60px,15vh,150px) 0}.done h1{font-size:clamp(2rem,6vw,4rem)}@media(max-width:700px){.page{width:calc(100% - 24px)}.back{top:12px;width:230px;min-height:56px;font-size:1rem}.card{max-height:calc(100dvh - 24px);padding:78px 14px 16px;border-radius:30px}.preview{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.preview figure{padding:5px;border-radius:12px}.preview figure:last-child{grid-column:2}.button,.chip{min-height:54px;margin:5px;padding:10px 20px}.picture{height:clamp(126px,24vh,190px)}}@media(max-width:430px){.card h1{font-size:1.5rem}.card h2{font-size:1rem}.instruction,.hint{font-size:.9rem}.eyebrow{margin-bottom:8px;padding:6px 14px}.track{margin:8px auto}.preview img{height:42px}.preview figcaption{font-size:.68rem}.picture{height:120px;margin:8px auto}.chips{gap:5px;margin:6px auto}.chip{min-width:76px}.done{padding:80px 0}}
    .back>span:first-child{font-family:"Segoe UI",sans-serif;font-size:2rem;font-weight:700;line-height:1}
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="{% url 'assessment' %}"><span aria-hidden="true">&larr;</span><span>Bumalik sa<br>Aking Aralin</span></a>
    <section id="app" class="card" aria-live="polite"></section>
  </main>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script>
  (()=>{'use strict';
    const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),items=d.items||[],app=document.getElementById('app');
    const csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||'');
    const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const normalize=value=>String(value||'').toLocaleLowerCase('fil-PH').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
    const spokenWordMatches=(target,transcript)=>{const expected=normalize(target),heard=normalize(transcript);return heard.includes(expected)||(expected==='tsek'&&heard.includes('check'))};
    const itemKey=index=>String(index);
    let state=Object.assign({phase:'intro',current_item_index:0,completed_oral_reads:[],stt_attempts:{},tts_plays:{},correct_answers:[],selected_answers:{},state_version:0},d.progress?.state||{}),busy=false,requestId=0,stream=null,audio=null;
    const stopMedia=()=>{stream?.getTracks().forEach(track=>track.stop());stream=null;if(audio){audio.pause();audio=null}};
    async function playReadAloud(text){
      if(!text)return;
      const response=await fetch(d.read_aloud_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-CSRFToken':csrf()},body:new URLSearchParams({target_text:text,language:'Filipino',mode:'word',prescribed_activity_key:d.activity_key})}),data=await response.json().catch(()=>({}));
      if(!response.ok||!data.success||!data.audio_content)throw Error(data.error||'Hindi available ang audio.');
      const url=URL.createObjectURL(new Blob([Uint8Array.from(atob(data.audio_content),character=>character.charCodeAt(0))],{type:data.mime_type||'audio/mpeg'}));
      const spoken=new Audio(url);
      try{await spoken.play();await new Promise((resolve,reject)=>{spoken.onended=resolve;spoken.onerror=reject})}finally{URL.revokeObjectURL(url)}
    }
    const current=()=>Number(state.current_item_index)||0,total=items.length;
    const header=()=>`<p class="eyebrow">SESSION 7 · LESSON 20 AT 21 · GAWAIN 1</p><h1>${esc(d.display_title)}</h1><h2>${esc(d.title)}</h2><p class="instruction">${esc(d.instruction)}</p><div class="track" aria-label="${state.correct_answers.length} sa ${total} natapos"><i style="width:${total?state.correct_answers.length/total*100:0}%"></i></div>`;
    const picture=item=>`<div class="picture"><img src="${esc(item.image_url)}" alt="${esc(item.alt_text)}"></div>`;
    async function save(extra={}){
      const mine=++requestId,response=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...state,state_version:(Number(state.state_version)||0)+1},...extra})}),data=await response.json().catch(()=>({}));
      if(!response.ok||!data.success)throw Error(data.error||'Hindi na-save ang progress. Subukan muli.');
      if(mine!==requestId)return null;state=data.progress.state;return data;
    }
    function render(message='',kind=''){
      if(d.progress?.activity_completed||state.phase==='completion'){app.innerHTML=`<div class="done"><h1>Magaling!</h1><p>Natapos mo ang Lesson 20 at 21: Gawain 1.</p><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`;return}
      const index=current(),item=items[index];
      if(state.phase==='intro'){
        app.innerHTML=header()+`<p class="hint">Pagmasdan ang mga larawan. Basahin ang salita bago bilugan ang pantig na may klaster.</p><div class="preview">${items.map(value=>`<figure><img src="${esc(value.image_url)}" alt="${esc(value.alt_text)}"><figcaption>${esc(value.word)}</figcaption></figure>`).join('')}</div><button class="button" id="start" type="button">SIMULAN</button><p class="status ${kind}">${esc(message)}</p>`;
        app.querySelector('#start').onclick=async()=>{state.phase='oral_reading';try{await save();render();playReadAloud(d.instruction).catch(()=>{})}catch(error){render(error.message,'bad')}};return;
      }
      if(state.phase==='feedback'){
        const previous=items[state.correct_answers.length-1];
        app.innerHTML=header()+picture(previous)+`<p class="status good">Tama! Magaling ang iyong sagot.</p><button class="chip locked" disabled>${esc(state.correct_answers.at(-1))}</button><br><button class="button" id="next">${state.correct_answers.length===total?'TAPUSIN':'SUSUNOD'}</button>`;
        app.querySelector('#next').onclick=async()=>{if(state.correct_answers.length===total)return finish();state.current_item_index=state.correct_answers.length;state.phase='oral_reading';try{await save();render()}catch(error){render(error.message,'bad')}};return;
      }
      if(!item){finish();return}
      if(state.phase==='oral_reading'){
        const recovery=(state.stt_attempts[itemKey(index)]||0)>=3;
        app.innerHTML=header()+`<p class="hint">Salita ${index+1} sa ${total}</p>${picture(item)}<p class="hint">${recovery?'Pakinggan muna ang salita.':'Basahin nang malakas ang salitang nasa larawan.'}</p><button class="button ${recovery?'gold':''}" id="oral" type="button">${recovery?'Pakinggan / Read Aloud':'Basahin ngayon'}</button><p class="status ${kind}">${esc(message)}</p>`;
        app.querySelector('#oral').onclick=()=>recovery?listen(index):read(index);return;
      }
      let selected='';
      app.innerHTML=header()+`<p class="hint">Salita ${index+1} sa ${total}</p>${picture(item)}<p class="hint">Bilugan ang pantig na may klaster.</p><div class="chips">${item.choices.map(choice=>`<button class="chip" data-choice="${esc(choice)}" type="button">${esc(choice)}</button>`).join('')}</div><button class="button" id="check" disabled>SURIIN</button><p class="status ${kind}">${esc(message)}</p>`;
      const check=app.querySelector('#check');
      app.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>{selected=button.dataset.choice;app.querySelectorAll('[data-choice]').forEach(chip=>chip.classList.toggle('selected',chip===button));check.disabled=false});
      check.onclick=()=>answer(selected);
    }
    function recordingMimeType(){return window.MediaRecorder?.isTypeSupported?.('audio/webm;codecs=opus')?'audio/webm;codecs=opus':''}
    async function read(index){
      if(busy)return;busy=true;const mine=++requestId,button=app.querySelector('#oral');
      try{
        if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono.');
        button.disabled=true;button.textContent='Nagbabasa...';
        stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
        const chunks=[],mimeType=recordingMimeType(),blob=await new Promise((resolve,reject)=>{const recorder=new MediaRecorder(stream,mimeType?{mimeType}:undefined);recorder.addEventListener('dataavailable',event=>{if(event.data?.size)chunks.push(event.data)});recorder.addEventListener('error',()=>reject(Error('Hindi naitala ang boses.')),{once:true});recorder.addEventListener('stop',()=>resolve(new Blob(chunks,{type:recorder.mimeType||mimeType||'audio/webm'})),{once:true});recorder.start();setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},3500)});
        stopMedia();if(!blob.size)throw Error('Walang narinig na boses. Subukan muli.');if(mine!==requestId)return;
        button.textContent='Pinoproseso...';const form=new FormData();form.append('audio',blob,'session7-lesson20-21.webm');form.append('target_text',items[index].word);form.append('language','Filipino');form.append('mode','reading');
        const response=await fetch(d.transcribe_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),data=await response.json().catch(()=>({}));
        if(mine!==requestId)return;
        if(response.ok&&data.success&&spokenWordMatches(items[index].word,data.transcript)){state.completed_oral_reads=[...new Set([...state.completed_oral_reads,index])];state.stt_attempts[itemKey(index)]=0;state.tts_plays[itemKey(index)]=0;state.phase='syllable_selection';await save();const message='Tama ang pagbasa! Piliin ang pantig na may klaster.';render(message,'good');playReadAloud(message).catch(()=>{})}else throw Error('Hindi pa. Subukan muli.');
      }catch(error){if(mine===requestId){state.stt_attempts[itemKey(index)]=Math.min(3,(state.stt_attempts[itemKey(index)]||0)+1);try{await save()}catch(_){}const message=(state.stt_attempts[itemKey(index)]||0)>=3?'Pakinggan muna ang salita.':error.message||'Hindi nakuha ang boses. Subukan muli.';render(message,'bad');playReadAloud(message).catch(()=>{})}}finally{stopMedia();busy=false}
    }
    async function listen(index){
      if(busy)return;busy=true;const mine=++requestId,button=app.querySelector('#oral');
      try{
        button.disabled=true;button.textContent='Nilo-load...';const form=new URLSearchParams({target_text:items[index].word,language:'Filipino',mode:'word',prescribed_activity_key:d.activity_key});
        const response=await fetch(d.read_aloud_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-CSRFToken':csrf()},body:form}),data=await response.json().catch(()=>({}));
        if(mine!==requestId)return;if(!response.ok||!data.success||data.tts_language!=='fil-PH'||data.voice_name!=='fil-PH-Wavenet-A')throw Error(data.error||'Hindi available ang Filipino audio.');
        button.textContent='Pinakikinggan...';audio=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(data.audio_content),character=>character.charCodeAt(0))],{type:data.mime_type||'audio/mpeg'})));await audio.play();await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=()=>reject(Error('Hindi ma-play ang audio.'))});
        if(mine!==requestId)return;state.tts_plays[itemKey(index)]=Math.min(3,(state.tts_plays[itemKey(index)]||0)+1);if(state.tts_plays[itemKey(index)]===3){state.stt_attempts[itemKey(index)]=0;state.tts_plays[itemKey(index)]=0}state.phase='oral_reading';await save();const message='Subukan mong basahin ang salita.';render(message);playReadAloud(message).catch(()=>{});
      }catch(error){if(mine===requestId){const message=error.message||'Hindi available ang audio. Subukan muli.';render(message,'bad');playReadAloud(message).catch(()=>{})}}finally{busy=false}
    }
    async function answer(value){if(busy)return;busy=true;try{const data=await save({candidate_answer:value});if(data.accepted){state.phase='feedback';render();playReadAloud('Tama! Magaling ang iyong sagot.').catch(()=>{})}else{const message='Subukan muli. Bilugan ang pantig na may klaster.';render(message,'bad');playReadAloud(message).catch(()=>{})}}catch(error){render(error.message,'bad')}finally{busy=false}}
    async function finish(){if(busy)return;busy=true;state.phase='completion';try{const response=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'}),data=await response.json().catch(()=>({}));if(!response.ok||!data.success)throw Error(data.error||'Hindi na-save ang pagtatapos. Subukan muli.');d.progress.activity_completed=true;render();playReadAloud('Magaling! Natapos mo ang Lesson 20 at 21: Gawain 1.').catch(()=>{})}catch(error){state.phase='feedback';render(error.message,'bad');const retry=document.createElement('button');retry.className='button';retry.textContent='SUBUKANG MULI';retry.onclick=finish;app.querySelector('.status')?.after(retry)}finally{busy=false}}
    addEventListener('pagehide',stopMedia);render();
  })();
  </script>
</body>
</html>
