<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 17 at 18: Gawain 5 | PABASA</title><style>
:root{--ink:#16465d;--blue:#1f6f8b;--line:#b9dce4;--ok:#278565;--bad:#a63b3b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e1f5f7,#fff3d8);color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(1060px,calc(100% - 24px));margin:auto;padding:16px 0}.back,.button{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;padding:11px 16px;font-weight:900;text-decoration:none}.back{border:2px solid var(--line);background:#fff;color:var(--ink)}.card{position:relative;margin-top:14px;padding:clamp(18px,3vw,30px);overflow:hidden;border-radius:28px;background:#fffdf7;box-shadow:0 16px 42px #2d697326;text-align:center}.eyebrow{margin:0;font-size:.8rem;font-weight:900;text-transform:uppercase}.card h1{margin:.25rem 0;font-size:clamp(1.8rem,4vw,2.7rem)}.instruction{max-width:720px;margin:.4rem auto;color:#526e78;font-weight:700}.meta{font-size:.85rem;font-weight:800}.track{height:10px;max-width:800px;margin:10px auto 18px;overflow:hidden;border-radius:20px;background:#dcebed}.track i{display:block;height:100%;background:#e6a33a}.board{position:relative;display:grid;grid-template-columns:minmax(260px,1fr) minmax(140px,.4fr);gap:min(25vw,260px);max-width:860px;margin:auto;text-align:left}.column{display:grid;gap:10px;align-content:start}.heading{margin:0 0 2px;font-size:.85rem;font-weight:1000;text-transform:uppercase}.item,.syllable{position:relative;z-index:2;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:900 1.05rem inherit;cursor:pointer}.item{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;min-height:76px;padding:7px;text-align:left}.item img{width:84px;height:60px;object-fit:contain}.syllable{min-height:58px;font-size:1.4rem}.item:hover,.syllable:hover,.item:focus-visible,.syllable:focus-visible,.selected{border-color:var(--blue);outline:3px solid #d7eff4}.matched{border-color:#82c8ad;background:#effbf3;cursor:default}.matched::after{content:'✓ </style></head><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card" aria-live="polite"></section></main>{{ prescribed_activity_data|json_script:"prescribed-activity-data" }}<script>(()=>{'use strict';const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),app=document.getElementById('app'),items=d.items||[],syllables=d.word_bank||[],csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||'');let matches={...(d.progress?.matches||{})},selectedItem=null,selectedSyllable=null,busy=false,version=Number(d.progress?.state?.state_version)||0,attempts=Number(d.progress?.state?.match_attempts)||0;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const count=()=>Object.keys(matches).length;const save=async candidate=>{const r=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({matches,state:{match_attempts:attempts,state_version:++version},candidate_match:candidate})}),j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'Hindi na-save ang sagot.');matches={...(j.progress.matches||matches)};version=Math.max(version,Number(j.progress.state?.state_version)||0);return j};function draw(){const svg=app.querySelector('.lines'),board=app.querySelector('.board');if(!svg||!board)return;const b=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);svg.innerHTML='';Object.entries(matches).forEach(([id,syllable])=>{const a=board.querySelector(`[data-item-key="${CSS.escape(id)}"]`),z=board.querySelector(`[data-syllable="${CSS.escape(syllable)}"]`);if(!a||!z)return;const ar=a.getBoundingClientRect(),zr=z.getBoundingClientRect();svg.insertAdjacentHTML('beforeend',`<line x1="${ar.right-b.left-5}" y1="${ar.top+ar.height/2-b.top}" x2="${zr.left-b.left+5}" y2="${zr.top+zr.height/2-b.top}"/>`)});}function done(){app.innerHTML=`<div>⭐</div><h1>Magaling!</h1><p class="instruction">Natapos mo ang Lesson 17 at 18: Gawain 5.</p><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a>`}async function finish(){try{const r=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({matches})}),j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'Hindi na-save ang pagtatapos.');done()}catch(e){app.querySelector('#message').textContent=e.message;app.querySelector('#message').className='message error';busy=false}}function render(message=''){if(d.progress?.activity_completed){done();return}const used=new Set(Object.values(matches));app.innerHTML=`<p class="eyebrow">Session 6 · Lesson 17 at 18 · Gawain 5</p><h1>${esc(d.title)}</h1><p class="instruction">${esc(d.instruction)}</p><p class="meta">Phonics · Phonological Awareness · Vocabulary · ${count()} / ${items.length}</p><div class="track"><i style="width:${count()/items.length*100}%"></i></div><div class="board"><svg class="lines" aria-hidden="true"></svg><section class="column"><h2 class="heading">Mga larawan</h2>${items.map(i=>`<button class="item ${matches[i.id]?'matched':''} ${selectedItem===i.id?'selected':''}" type="button" data-item-key="${esc(i.id)}" ${matches[i.id]?'disabled':''}><img src="${esc(i.image_url)}" alt="${esc(i.alt_text)}"><span>${esc(i.label)}</span></button>`).join('')}</section><section class="column"><h2 class="heading">Simulang pantig</h2>${syllables.map(s=>`<button class="syllable ${used.has(s)?'used':''} ${selectedSyllable===s?'selected':''}" type="button" data-syllable="${esc(s)}" ${used.has(s)?'disabled':''}>${esc(s)}</button>`).join('')}</section></div><p id="message" class="message">${esc(message||'Piliin ang larawan, pagkatapos ang simulang pantig.')}</p>`;app.querySelectorAll('[data-item-key]').forEach(x=>x.onclick=()=>{selectedItem=x.dataset.itemKey;tryPair()});app.querySelectorAll('[data-syllable]').forEach(x=>x.onclick=()=>{selectedSyllable=x.dataset.syllable;tryPair()});draw()}async function tryPair(){if(!selectedItem||!selectedSyllable){render();return}if(busy)return;busy=true;attempts++;try{const r=await save({target_id:selectedItem,word:selectedSyllable});if(r.accepted){selectedItem=null;selectedSyllable=null;if(count()===items.length){await finish();return}render('Tama! Nakabit na ang pares.')}else{selectedSyllable=null;render('Hindi tugma. Subukan muli.');app.querySelector('#message').className='message error'}}catch(e){render(e.message);app.querySelector('#message').className='message error'}finally{busy=false}}addEventListener('resize',draw);render()})();</script></body></html>
