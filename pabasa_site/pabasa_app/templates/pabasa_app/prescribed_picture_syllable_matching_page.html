{% load static %}
<!doctype html>
<html lang="fil">
<head>{% include 'pabasa_app/basahin_script.html' %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lesson 17 at 18: Gawain 5 | PABASA</title>
  <style>
    @font-face{font-family:Fredoka;src:url("{% static 'pabasa_app/font/fredoka-one.one-regular.ttf' %}") format('truetype');font-display:swap}
    :root{--ink:#183e63;--teal:#299e9a;--teal-dark:#187b7a;--accent:#e7af45;--line:#94d9d6;--good:#278565;--bad:#a63b3b}
    *{box-sizing:border-box}
    body{min-height:100svh;margin:0;overflow:hidden;color:var(--ink);font-family:Fredoka,Nunito,"Segoe UI",sans-serif;background:url("{% static 'pabasa_app/prescribed/PRESCRIBED-BG.jpg' %}") center/cover no-repeat}
    .page{position:relative;width:min(1250px,calc(100% - 32px));height:100svh;margin:auto}
    .back,.button,.listen-button{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:900;text-decoration:none;cursor:pointer}
    .back{position:absolute;top:16px;left:0;z-index:3;gap:12px;min-width:280px;min-height:64px;padding:10px 24px;border:0;border-radius:999px;background:#fff;color:var(--ink);font-size:clamp(1rem,1.6vw,1.2rem);line-height:1.15;box-shadow:0 8px 17px #145ca744}
    .back::first-letter{font-size:1.75em}
    .card{position:absolute;top:50%;left:50%;display:flex;flex-direction:column;justify-content:center;width:100%;max-height:calc(100svh - 112px);padding:clamp(12px,2.2vh,22px) clamp(14px,5vw,72px);overflow:hidden;border:2px solid #ffffffaa;border-radius:42px;background:#ffffff63;backdrop-filter:blur(10px);box-shadow:0 18px 45px #1e5b7a35;text-align:center;transform:translate(-50%,-50%)}
    .eyebrow{width:max-content;max-width:100%;margin:0 auto 6px;padding:5px 20px;border-radius:999px;background:#277f82;color:#fff;font-size:clamp(.68rem,1vw,.88rem);letter-spacing:.03em;text-transform:uppercase}
    .card h1{margin:0;font-size:clamp(1.5rem,3vw,2.45rem);line-height:1.05}
    .instruction{max-width:760px;margin:5px auto 0;color:#385c6b;font-family:Nunito,"Segoe UI",sans-serif;font-size:clamp(.82rem,1.25vw,1rem);font-weight:800;line-height:1.25}
    .activity-tools{display:flex;justify-content:center;margin:6px 0 4px}
    .listen-button{gap:7px;min-height:36px;padding:6px 15px;border:3px solid var(--line);border-radius:999px;background:#fffffff0;color:var(--teal-dark);font-size:clamp(.78rem,1.1vw,.92rem);box-shadow:0 4px 0 #b7d6dc;transition:transform .16s,background .16s}
    .listen-button:not(:disabled):hover{background:#f4fffe;transform:translateY(-1px)}
    .listen-button:disabled{opacity:.65;cursor:wait}
    .meta{margin:2px 0 0;color:#55727e;font-family:Nunito,"Segoe UI",sans-serif;font-size:.75rem;font-weight:800}
    .track{height:8px;max-width:810px;margin:7px auto 10px;overflow:hidden;border-radius:999px;background:#dcebed}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#72c8d5)}
    .board{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,.42fr);gap:clamp(26px,14vw,190px);width:min(980px,100%);margin:auto;text-align:left}
    .column{display:grid;gap:5px;align-content:start}.heading{margin:0;color:#277f82;font-family:Nunito,"Segoe UI",sans-serif;font-size:.72rem;font-weight:1000;letter-spacing:.05em;text-transform:uppercase}
    .item,.syllable{position:relative;z-index:2;border:3px solid var(--line);border-radius:18px;background:#fffffff0;color:var(--ink);font:900 clamp(.9rem,1.45vw,1.08rem) inherit;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s}
    .item{display:grid;grid-template-columns:clamp(44px,6vw,62px) 1fr;gap:clamp(7px,1.2vw,11px);align-items:center;min-height:clamp(48px,7vh,58px);padding:4px 9px;text-align:left}.item img{width:100%;height:clamp(38px,5.4svh,46px);object-fit:contain}
    .syllable{min-height:clamp(44px,6.4svh,52px);font-size:clamp(1rem,1.75vw,1.3rem)}
    .item:hover,.syllable:hover,.item:focus-visible,.syllable:focus-visible,.selected{border-color:var(--accent);outline:0;box-shadow:0 0 0 4px #f8df9a;transform:translateY(-1px)}
    .matched{border-color:#82c8ad;background:#effbf3;color:#26784e;cursor:default}.matched::after{position:absolute;right:9px;bottom:4px;content:'✓ Nakabit';font-family:Nunito,"Segoe UI",sans-serif;font-size:.62rem;font-weight:900}.used{opacity:.55;cursor:default}
    .lines{position:absolute;z-index:1;inset:0;width:100%;height:100%;pointer-events:none}.lines line{stroke:var(--good);stroke-width:4;stroke-linecap:round}
    .message{min-height:1.25em;margin:7px 0 0;font-family:Nunito,"Segoe UI",sans-serif;font-size:clamp(.78rem,1.15vw,.92rem);font-weight:900}.error{color:var(--bad)}
    .button{min-height:58px;padding:12px 26px;border:0;border-radius:999px;background:var(--teal);box-shadow:0 6px 0 var(--teal-dark),0 10px 20px #187b7a40;color:#fff;font-size:1.05rem}.button:not(:disabled):hover{background:#38b0aa;transform:translateY(-2px)}
    .done{padding:clamp(14px,6vh,54px) 0}.done>div{font-size:2.5rem}.done h1{margin:8px 0;font-size:clamp(2rem,5vw,3.8rem)}.done .button{margin-top:14px}
    .oral-image{display:block;width:min(280px,62vw);height:min(180px,27svh);margin:7px auto;object-fit:contain}.oral-word{margin:4px 0 9px;font-size:clamp(2.4rem,6vw,4.6rem);font-weight:900;letter-spacing:.05em;line-height:1.05}.oral-status{min-height:1.3em;margin:8px 0 0;font-family:Nunito,"Segoe UI",sans-serif;font-weight:900}.oral-status.error{color:var(--bad)}.oral-status.good{color:var(--good)}
    @media(max-width:680px){.page{width:calc(100% - 20px)}.back{top:10px;min-width:0;min-height:52px;padding:8px 17px;font-size:.9rem}.card{max-height:calc(100svh - 76px);padding:14px 10px;border-radius:28px}.eyebrow{margin-bottom:7px;padding:6px 13px}.instruction{margin-top:6px}.activity-tools{margin:7px 0 4px}.listen-button{min-height:36px;padding:6px 12px}.track{margin:8px auto 10px}.board{grid-template-columns:minmax(0,1fr) 94px;gap:14px}.heading{font-size:.66rem}.item{grid-template-columns:45px 1fr;gap:6px;min-height:52px;padding:4px 6px;font-size:.82rem}.item img{height:42px}.syllable{min-height:48px;border-width:2px;font-size:1.08rem}.message{margin-top:7px;font-size:.78rem}.lines line{stroke-width:3}}
    @media(max-height:640px) and (min-width:681px){.back{top:8px;min-height:54px}.card{max-height:calc(100svh - 76px);padding-top:12px;padding-bottom:12px}.eyebrow{margin-bottom:6px;padding:6px 18px}.instruction{margin-top:5px}.activity-tools{margin:6px 0 3px}.listen-button{min-height:35px}.track{margin:7px auto 9px}.board{gap:clamp(20px,11vw,130px)}.item{min-height:48px}.item img{height:40px}.syllable{min-height:44px}.message{margin-top:6px}}
    @media(max-height:640px) and (max-width:680px){.back{top:4px;min-height:42px;padding:5px 13px}.card{max-height:calc(100svh - 54px);padding:6px 8px}.eyebrow{margin-bottom:3px;padding:3px 10px;font-size:.62rem}.card h1{font-size:1.35rem}.instruction{margin-top:3px;font-size:.74rem;line-height:1.18}.activity-tools{margin:3px 0}.listen-button{min-height:30px;padding:4px 9px;border-width:2px;font-size:.7rem;box-shadow:0 2px 0 #b7d6dc}.meta{margin:1px 0;font-size:.64rem}.track{height:7px;margin:4px auto 5px}.board{gap:8px}.column{gap:4px}.heading{font-size:.58rem}.item{grid-template-columns:37px 1fr;min-height:42px;padding:3px 4px;font-size:.72rem}.item img{height:34px}.syllable{min-height:42px;font-size:.94rem}.message{min-height:1em;margin:4px 0 0;font-size:.66rem}.lines line{stroke-width:2}}
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a>
    <section id="app" class="card" aria-live="polite"></section>
  </main>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script>
  (()=>{'use strict';
    const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),app=document.getElementById('app'),items=d.items||[],syllables=d.word_bank||[],csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||'');
    const restored=d.progress?.state&&typeof d.progress.state==='object'?d.progress.state:{};
    let matches={...(d.progress?.matches||{})},selectedItem=null,selectedSyllable=null,busy=false,version=Number(restored.state_version)||0,attempts=Number(restored.match_attempts)||0,narration=null,narrationRequest=0,requestVersion=0,phase=restored.phase==='matching'?'matching':'oral_reading',oralIndex=Math.max(0,Math.min(items.length,Number(restored.oral_index)||0)),readingAttempts=0,aloudAttempts=0,oralMode='read',oralStatus='',stream=null,announcedOralIndex=-1,announcedMatching=false;
    let sttAttempts=restored.stt_attempts&&typeof restored.stt_attempts==='object'?{...restored.stt_attempts}:{},ttsPlays=restored.tts_plays&&typeof restored.tts_plays==='object'?{...restored.tts_plays}:{},mappedAudioQueue=Promise.resolve();
    const restoreOral=()=>{readingAttempts=Math.max(0,Number(sttAttempts[String(oralIndex)])||0);aloudAttempts=Math.max(0,Number(ttsPlays[String(oralIndex)])||0);oralMode=readingAttempts>=3?'aloud':'read'};restoreOral();
    const gawain5Audio={
      intro:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/01_activity_intro.mp3' %}",
      readingCorrect:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/12_feedback_reading_correct.mp3' %}",
      matchingCorrect:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/13_feedback_matching_correct.mp3' %}",
      matchingRetry:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/14_feedback_matching_retry.mp3' %}",
      completion:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/15_feedback_completion.mp3' %}",
    };
    const gawain5Items=[
      {prompt:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/02_item_01_robot_read_prompt.mp3' %}",word:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/03_item_01_robot_word.mp3' %}"},
      {prompt:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/04_item_02_payong_read_prompt.mp3' %}",word:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/05_item_02_payong_word.mp3' %}"},
      {prompt:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/06_item_03_pitaka_read_prompt.mp3' %}",word:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/07_item_03_pitaka_word.mp3' %}"},
      {prompt:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/08_item_04_riles_read_prompt.mp3' %}",word:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/09_item_04_riles_word.mp3' %}"},
      {prompt:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/10_item_05_puso_read_prompt.mp3' %}",word:"{% static 'pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_5/11_item_05_puso_word.mp3' %}"},
    ];
    const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm=x=>String(x||'').toLocaleLowerCase('fil-PH').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
    const count=()=>Object.keys(matches).length;
    const stopNarration=()=>{if(narration){narration.pause();narration.currentTime=0;narration=null}};
    const playMappedAudio=source=>{if(!source)return Promise.resolve();mappedAudioQueue=mappedAudioQueue.then(()=>new Promise(resolve=>{stopNarration();narration=new Audio(source);narration.onended=resolve;narration.onerror=resolve;narration.play().catch(resolve)}));return mappedAudioQueue};
    const announceOralItem=()=>{const item=items[oralIndex];if(!item||announcedOralIndex===oralIndex)return;announcedOralIndex=oralIndex;if(oralIndex===0)void playMappedAudio(gawain5Audio.intro);void playMappedAudio(gawain5Items[oralIndex]?.prompt)};
    const announceMatching=()=>{if(announcedMatching)return;announcedMatching=true};
    const save=async candidate=>{const mine=++requestVersion,r=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({matches,state:{match_attempts:attempts,phase,oral_index:oralIndex,stt_attempts:sttAttempts,tts_plays:ttsPlays,state_version:++version},...(candidate?{candidate_match:candidate}:{})})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Hindi na-save ang sagot.');if(mine!==requestVersion)return null;matches={...(j.progress.matches||matches)};version=Math.max(version,Number(j.progress.state?.state_version)||0);phase=j.progress.state?.phase==='matching'?'matching':'oral_reading';oralIndex=Math.max(0,Math.min(items.length,Number(j.progress.state?.oral_index)||oralIndex));sttAttempts=j.progress.state?.stt_attempts&&typeof j.progress.state.stt_attempts==='object'?{...j.progress.state.stt_attempts}:sttAttempts;ttsPlays=j.progress.state?.tts_plays&&typeof j.progress.state.tts_plays==='object'?{...j.progress.state.tts_plays}:ttsPlays;restoreOral();return j};
    const stopOral=()=>{stream?.getTracks().forEach(track=>track.stop());stream=null};
    function renderOral(message='',kind=''){
      const item=items[oralIndex];
      const actionLabel=oralMode==='aloud'?'🔊 Pakinggan muna':oralStatus||window.BasahinButton.LABEL;
      app.innerHTML=`<p class="eyebrow">Session 6 · Lesson 17 at 18 · Gawain 5</p><h1>${esc(d.title)}</h1><p class="instruction">Basahin muna nang malakas ang salitang nasa larawan.</p><p class="meta">Pagbasa muna · ${oralIndex+1} / ${items.length}</p><div class="track"><i style="width:${(oralIndex+1)/items.length*100}%"></i></div><section class="oral-card"><img class="oral-image" src="${esc(item.image_url)}" alt="${esc(item.alt_text)}"><p class="oral-word">${esc(item.label)}</p><button data-basahin-button class="button" id="oral-action" type="button" ${busy?'disabled':''}>${esc(actionLabel)}</button><p class="oral-status ${esc(kind)}">${esc(message||'Basahin ang salita, pagkatapos pindutin ang button.')}</p></section>`;
      window.Basahin.bindActivity(app.querySelector('#oral-action'),oralMode==='aloud'?listenCurrentWord:readCurrentWord);
      announceOralItem();
    }
    async function readCurrentWord(){
      if(busy)return;
      if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){readingAttempts=Math.min(3,readingAttempts+1);sttAttempts[String(oralIndex)]=readingAttempts;oralMode=readingAttempts>=3?'aloud':'read';try{await save()}catch(_){}renderOral(oralMode==='aloud'?'Pakinggan muna ang salita.':`Hindi available ang mikropono. May ${3-readingAttempts} pagkakataon pa.`,'error');return}
      busy=true;oralStatus='🎙 Nakikinig…';const requestedIndex=oralIndex;
      try{
        stream=await window.Basahin.openMicrophone({audio:true});
        renderOral('Nakikinig... basahin ang salita.','');
        const basahinAudio=await window.Basahin.capture({button:document.querySelector('[data-basahin-button]'),stream});
          stopOral();
          try{
            oralStatus='⏳ Pinoproseso…';renderOral('Pinoproseso ang iyong pagbasa…','good');const form=new FormData();form.append('audio',basahinAudio,'oral-reading.webm');form.append('target_text',items[oralIndex].label);form.append('language','Filipino');form.append('mode','reading');
            const response=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form});
            const result=await response.json();if(!response.ok||!result.success||!norm(result.transcript).includes(norm(items[oralIndex].label)))throw Error('Hindi pa malinaw ang pagbasa.');
            if(requestedIndex!==oralIndex)return;
            sttAttempts[String(oralIndex)]=0;ttsPlays[String(oralIndex)]=0;oralIndex++;phase=oralIndex===items.length?'matching':'oral_reading';restoreOral();await save();oralStatus='';await playMappedAudio(gawain5Audio.readingCorrect);if(phase==='matching'){render();return}renderOral('Magaling! Basahin ang susunod na salita.','good');
          }catch(error){oralStatus='';readingAttempts=Math.min(3,readingAttempts+1);sttAttempts[String(oralIndex)]=readingAttempts;if(readingAttempts>=3)oralMode='aloud';try{await save()}catch(_){}const feedback=readingAttempts>=3?'Makinig muna sa salita nang hanggang tatlong beses.':`Subukan muli. May ${3-readingAttempts} pagkakataon pa.`;renderOral(feedback,'error')}finally{busy=false;const action=app.querySelector('#oral-action');if(action)action.disabled=false}

      }catch(error){stopOral();oralStatus='';if(!window.Basahin.isCaptureError(error)){readingAttempts=Math.min(3,readingAttempts+1);}if(!window.Basahin.isCaptureError(error)){sttAttempts[String(oralIndex)]=readingAttempts;}oralMode=readingAttempts>=3?'aloud':'read';try{await save()}catch(_){}const feedback=oralMode==='aloud'?'Pakinggan muna ang salita.':`Pahintulutan ang mikropono. May ${3-readingAttempts} pagkakataon pa.`;renderOral(feedback,'error');busy=false}
    }
    async function listenCurrentWord(){
      if(busy)return;busy=true;const requestedIndex=oralIndex;try{
        await playMappedAudio(gawain5Items[oralIndex]?.word);
        if(requestedIndex!==oralIndex)return;aloudAttempts++;ttsPlays[String(oralIndex)]=aloudAttempts;if(aloudAttempts>=3){readingAttempts=0;aloudAttempts=0;sttAttempts[String(oralIndex)]=0;ttsPlays[String(oralIndex)]=0;oralMode='read';}await save();renderOral(aloudAttempts?'Pakinggan muli kung kailangan.':'Subukan mo nang basahin ang salita.','good');
      }catch(error){renderOral(error.message||'Hindi ma-play ang salita. Subukan muli.','error')}finally{busy=false;const action=app.querySelector('#oral-action');if(action)action.disabled=false}
    }
    function draw(){const svg=app.querySelector('.lines'),board=app.querySelector('.board');if(!svg||!board)return;const b=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);svg.innerHTML='';Object.entries(matches).forEach(([id,syllable])=>{const a=board.querySelector(`[data-item-key="${CSS.escape(id)}"]`),z=board.querySelector(`[data-syllable="${CSS.escape(syllable)}"]`);if(!a||!z)return;const ar=a.getBoundingClientRect(),zr=z.getBoundingClientRect();svg.insertAdjacentHTML('beforeend',`<line x1="${ar.right-b.left-5}" y1="${ar.top+ar.height/2-b.top}" x2="${zr.left-b.left+5}" y2="${zr.top+zr.height/2-b.top}"/>`)})}
    function done(){app.innerHTML=`<div class="done"><div>⭐</div><h1>Magaling!</h1><p class="instruction">Natapos mo ang Lesson 17 at 18: Gawain 5.</p><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`}
    async function finish(){try{const r=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({matches})}),j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'Hindi na-save ang pagtatapos.');done();playMappedAudio(gawain5Audio.completion)}catch(e){app.querySelector('#message').textContent=e.message;app.querySelector('#message').className='message error';busy=false}}
    function render(message=''){if(d.progress?.activity_completed){done();return}const used=new Set(Object.values(matches));app.innerHTML=`<p class="eyebrow">Session 6 · Lesson 17 at 18 · Gawain 5</p><h1>${esc(d.title)}</h1><p class="instruction">${esc(d.instruction)}</p><p class="meta">Phonics · Phonological Awareness · Vocabulary · ${count()} / ${items.length}</p><div class="track"><i style="width:${count()/items.length*100}%"></i></div><div class="board"><svg class="lines" aria-hidden="true"></svg><section class="column"><h2 class="heading">Mga larawan</h2>${items.map(i=>`<button class="item ${matches[i.id]?'matched':''} ${selectedItem===i.id?'selected':''}" type="button" data-item-key="${esc(i.id)}" ${matches[i.id]?'disabled':''}><img src="${esc(i.image_url)}" alt="${esc(i.alt_text)}"><span>${esc(i.label)}</span></button>`).join('')}</section><section class="column"><h2 class="heading">Simulang pantig</h2>${syllables.map(s=>`<button class="syllable ${used.has(s)?'used':''} ${selectedSyllable===s?'selected':''}" type="button" data-syllable="${esc(s)}" ${used.has(s)?'disabled':''}>${esc(s)}</button>`).join('')}</section></div><p id="message" class="message">${esc(message||'Piliin ang larawan, pagkatapos ang simulang pantig.')}</p>`;app.querySelectorAll('[data-item-key]').forEach(x=>x.onclick=()=>{selectedItem=x.dataset.itemKey;tryPair()});app.querySelectorAll('[data-syllable]').forEach(x=>x.onclick=()=>{selectedSyllable=x.dataset.syllable;tryPair()});draw();announceMatching()}
    async function tryPair(){if(!selectedItem||!selectedSyllable){render();return}if(busy)return;busy=true;attempts++;try{const r=await save({target_id:selectedItem,word:selectedSyllable});if(r.accepted){selectedItem=null;selectedSyllable=null;if(count()===items.length){await finish();return}const feedback='Tama! Nakabit na ang pares.';render(feedback);playMappedAudio(gawain5Audio.matchingCorrect)}else{selectedSyllable=null;const feedback='Hindi tugma. Subukan muli.';render(feedback);app.querySelector('#message').className='message error';playMappedAudio(gawain5Audio.matchingRetry)}}catch(e){render(e.message);app.querySelector('#message').className='message error'}finally{busy=false}}
    addEventListener('resize',draw);addEventListener('pagehide',()=>{stopNarration();stopOral()});phase==='oral_reading'?renderOral():render();
  })();
  </script>
</body>
</html>
