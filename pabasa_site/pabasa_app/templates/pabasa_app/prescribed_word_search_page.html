<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Search | PABASA</title>
<style>#app .words{display:none!important}#app .grid-wrap{position:relative!important;width:min(44vw,46vh,560px)!important;max-width:none!important;max-height:none!important}#app .cell.locked{background:#d5e2e2!important;color:#173f50!important}#app .grid-wrap:has(.cell.locked){overflow:hidden!important}#app .grid-wrap:has(.cell.locked)::after{content:''!important;position:absolute;inset:0;display:block!important;border-radius:24px;background:rgba(59,83,88,.42)!important;pointer-events:none}#app .grid-wrap:has(.cell.locked)::before{content:'Read the word first'!important;position:absolute;left:50%;top:50%;z-index:2;display:block!important;transform:translate(-50%,-50%);border-radius:14px;background:rgba(35,57,62,.9);color:#fff;padding:.8rem 1.2rem;font-size:clamp(1rem,2vw,1.5rem);font-weight:900;text-align:center;white-space:nowrap}@media(max-width:760px){#app .grid-wrap{width:min(78vw,520px)!important}}</style>
<style>html,body{height:100%;overflow:hidden}.page{height:100vh;padding:12px 0;display:flex;flex-direction:column}.card{flex:1;min-height:0;overflow:hidden;margin-top:10px;padding:clamp(18px,3vh,34px)}.layout{flex:1;min-height:0;margin-top:12px;align-items:center}.grid-wrap{position:relative;max-height:min(64vh,620px);max-width:min(48vw,620px);margin:auto}.grid{height:100%}.cell{font-size:clamp(1.25rem,3.2vw,2.7rem)}.words,.helper{display:none}.word-panel{display:flex;flex-direction:column;align-items:center;justify-content:center}.grid-wrap.is-locked::after{content:'Basahin ang salita muna';position:absolute;inset:0;display:grid;place-items:center;border-radius:24px;background:rgba(59,83,88,.7);color:#fff;font-size:clamp(1rem,2vw,1.5rem);font-weight:900;text-align:center;padding:1rem;pointer-events:none}.grid-wrap.is-locked{overflow:hidden}@media(max-width:760px){html,body{overflow:auto}.page{height:auto;min-height:100vh}.card{overflow:visible}.layout{flex:none}.grid-wrap{max-width:100%;max-height:none}}</style>
<style>.subtitle{display:none}.grid-wrap{width:min(46vw,48vh,620px);max-width:none;max-height:none}.cell.locked{background:#d5e2e2;color:#173f50}.grid-wrap:has(.cell.locked)::after{content:'Read the word first'}</style>
<style>.grid-wrap:has(.cell.locked)::after{content:'Basahin ang salita muna';position:absolute;inset:0;display:grid;place-items:center;border-radius:24px;background:rgba(59,83,88,.7);color:#fff;font-size:clamp(1rem,2vw,1.5rem);font-weight:900;text-align:center;padding:1rem;pointer-events:none}.grid-wrap:has(.cell.locked){overflow:hidden}</style>
<style>:root{--ink:#16465d;--blue:#197b99;--muted:#5b7680;--line:#d6e7e8;--gold:#efb947}*{box-sizing:border-box}body{margin:0;background:#f3faf8;color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(1120px,calc(100% - 28px));margin:auto;padding:24px 0 40px}.back{color:var(--ink);font-weight:900;text-decoration:none}.card{margin-top:22px;border:1px solid var(--line);border-radius:28px;background:#fff;padding:clamp(22px,4vw,52px);box-shadow:0 18px 45px #24545d18}.eyebrow{color:#42768a;font-size:.78rem;font-weight:900;letter-spacing:.14em}.title{margin:.25rem 0 0;font-size:clamp(2rem,5vw,3.8rem)}.subtitle{margin:.2rem 0 1.4rem;color:var(--blue);font-weight:900;font-size:1.1rem}.instruction{max-width:760px;color:var(--muted);font-weight:700;line-height:1.5}.layout{display:grid;grid-template-columns:minmax(230px,.8fr) minmax(360px,1.2fr);gap:clamp(24px,6vw,72px);align-items:center;margin-top:28px}.word-panel{text-align:center}.label{color:#527585;font-size:.86rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.word{font-size:clamp(3rem,8vw,6rem);font-weight:1000;line-height:1.1;margin:12px 0}.status{min-height:2.5em;color:var(--muted);font-weight:800}.button{border:0;border-radius:13px;background:var(--blue);box-shadow:0 4px 0 #126078;color:#fff;padding:13px 20px;font:inherit;font-weight:900;cursor:pointer}.button:disabled{opacity:.6;cursor:wait}.grid-wrap{border-radius:24px;background:#8ba2a5;padding:15px;box-shadow:inset 0 0 0 3px #587278}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.cell{aspect-ratio:1;border:0;border-radius:12px;background:#d5e2e2;color:#173f50;font-size:clamp(1.5rem,4vw,3rem);font-weight:1000;cursor:pointer}.cell:hover,.cell.hover{background:#f4d26d;transform:scale(1.03)}.cell.locked{background:#6f8588;color:#294d58;cursor:not-allowed}.cell.selected{background:#efb947;color:#fff}.cell.found{background:#24889a;color:#fff}.helper{margin:14px 0 0;color:var(--muted);font-size:.9rem;font-weight:800}.words{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:25px}.words span{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:900}.words span.done{background:#d8f0df;color:#227145;text-decoration:line-through}.done{display:inline-block;margin-top:25px;color:#287b4c;font-weight:900}@media(max-width:760px){.layout{grid-template-columns:1fr}.grid-wrap{max-width:480px;width:100%;margin:auto}}
</style></head><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section class="card" id="app"></section></main>{{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
<script>(()=>{const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),app=document.getElementById('app'),grid=d.grid||[],words=d.words||[],csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||'');let matches=d.progress?.matches||{},reading=d.progress?.state?.reading||{},attempts=d.progress?.state?.attempts||{},index=Number(Object.keys(matches).length),selected=null,busy=false;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(body){return fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(body)}).then(async r=>{const x=await r.json();if(!r.ok||!x.success)throw Error(x.error||'Could not save progress');return x})}function render(){const wi=words.findIndex((_,i)=>!matches[String(i)]);index=wi<0?words.length:wi;const word=words[index]||'';app.innerHTML=`<div class="eyebrow">SESSION ${d.session_number} · LESSON ${d.lesson_number} · ACTIVITY ${d.gawain_number}</div><h1 class="title">Word Search</h1><p class="instruction">${esc(d.instruction)}</p><div class="layout"><section class="word-panel"><div class="label">READ THE WORD ALOUD FIRST</div><div class="word">${esc(word)}</div><p class="status" id="status">${reading[String(index)]?'Correct! Find the word in the grid.':'Read the word aloud to unlock the grid.'}</p><button class="button" id="read">${reading[String(index)]?'Read again':'Read the word'}</button></section><section><div class="grid-wrap"><div class="grid">${grid.flatMap((row,r)=>row.map((letter,c)=>{const locked=!reading[String(index)]||!!matches[String(index)];return `<button class="cell ${locked?'locked':''} ${matches[String(index)]&&matches[String(index)].start[0]<=r&&matches[String(index)].end[0]>=r?'found':''}" data-r="${r}" data-c="${c}" ${locked?'disabled':''}>${letter}</button>`})).join('')}</div></div><p class="helper">${reading[String(index)]?'I-click ang unang letra, pagkatapos ang huling letra.':'Naka-lock ang grid habang binabasa mo ang salita.'}</p></section></div><div class="words">${words.map((w,i)=>`<span class="${matches[String(i)]?'done':''}">${i+1}. ${esc(w)}</span>`).join('')}</div>`;document.getElementById('read').onclick=()=>readWord();app.querySelectorAll('.cell:not(.locked)').forEach(b=>b.onclick=()=>pick(b));}async function readWord(){if(busy)return;busy=true;const s=document.getElementById('status'),b=document.getElementById('read');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){s.textContent='Microphone is not available in this browser.';busy=false;return}b.disabled=true;b.textContent='Listening…';let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true});const rec=new MediaRecorder(st),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(res=>rec.onstop=()=>res(new Blob(chunks,{type:rec.mimeType||'audio/webm'})));rec.start();setTimeout(()=>rec.state==='recording'&&rec.stop(),3000);const audio=await done;st.getTracks().forEach(t=>t.stop());const f=new FormData();f.append('audio',audio,'reading.webm');f.append('target_text',word);f.append('language','Filipino');f.append('mode','reading');const rr=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),res=await rr.json();const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');const ok=!!(res.success&&norm(res.transcript).includes(norm(word)));await save({word_index:index,reading_result:ok});if(ok){reading[String(index)]=true;s.textContent='Correct! Find the word in the grid.'}else{s.textContent=`Try again. (${(attempts[String(index)]||0)+1}/3)`}render()}catch(e){s.textContent='Hindi nakuha ang iyong boses. Try again.'}finally{if(st)st.getTracks().forEach(t=>t.stop());busy=false}}async function pick(btn){if(selected===null){selected=[+btn.dataset.r,+btn.dataset.c];btn.classList.add('selected');return}const end=[+btn.dataset.r,+btn.dataset.c],start=selected;selected=null;try{const res=await save({candidate_match:{word_index:index,start,end}});if(res.accepted){matches= res.progress.matches;render();if(Object.keys(matches).length===words.length){await save({});await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({matches})});app.innerHTML='<div class="done">🎉 Great job! You completed the Word Search.</div>'}}else{document.getElementById('status').textContent='Hindi tugma. Try again.';render()}}catch(e){document.getElementById('status').textContent=e.message;render()}}render()})();</script></body></html>
