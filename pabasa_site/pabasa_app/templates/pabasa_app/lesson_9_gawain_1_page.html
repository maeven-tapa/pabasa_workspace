{% load static %}
<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ lesson9_gawain1_data.title }}</title>
<style>
:root{color:#16465d;font-family:Nunito,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#e1f5f7}.page{width:min(1000px,calc(100% - 24px));margin:auto;padding:8px}.back{color:#16465d;font-weight:900}.card{height:calc(100dvh - 54px);min-height:520px;margin-top:8px;padding:clamp(12px,2.5vh,24px);border-radius:24px;background:#fffdf7;text-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden}.eyebrow{color:#997124;font-size:.8rem;font-weight:900;letter-spacing:.04em}.card h1{margin:5px 0;font-size:clamp(1.55rem,4vw,2.3rem)}.instruction{max-width:720px;margin:5px auto 10px;font-weight:800}.task{width:min(760px,100%)}.phase{display:inline-block;padding:7px 14px;border-radius:999px;background:#eef8fb;color:#28748a;font-weight:900}.syllables{display:flex;justify-content:center;align-items:center;gap:clamp(14px,4vw,36px);margin:18px auto;font-size:clamp(2rem,6vw,3.8rem);font-weight:900}.syllable{padding:12px 22px;border:3px solid #bfdde4;border-radius:18px;background:#fff;color:#176078}.tiles,.building{display:flex;justify-content:center;gap:12px;min-height:70px;margin:12px auto;flex-wrap:wrap}.tile{border:3px solid #2b83bd;border-radius:14px;background:#fff;color:#176078;padding:14px 24px;font-size:1.35rem;font-weight:900;cursor:pointer}.tile:disabled{opacity:.45;cursor:default}.building{align-items:center;border:2px dashed #bfdde4;border-radius:16px;padding:10px}.building .tile{background:#eef8fb}.action{border:0;border-radius:14px;background:#2b83bd;color:#fff;padding:14px 30px;min-width:210px;font-size:1.08rem;font-weight:900;box-shadow:0 4px 0 #155369;cursor:pointer}.action.reading{background:#d64c55;animation:pulse 1.2s infinite}.action.processing{background:#e6a33a;box-shadow:0 0 18px #e6a33aaa;cursor:wait}.action:disabled{opacity:.7;cursor:wait}.status{min-height:28px;margin:8px auto;color:#397b56;font-weight:900}.feedback{min-height:25px;color:#b33b2f;font-weight:800}.progress{margin:8px;color:#71828a;font-weight:900}.word{margin:20px auto;font-size:clamp(2.7rem,9vw,5rem);font-weight:900;color:#176078}@keyframes pulse{50%{box-shadow:0 0 0 10px #d64c5500,0 0 24px #d64c55b3}}.done{color:#26784e;font-weight:900;font-size:1.35rem}.done a{display:inline-block;margin-top:18px;color:#176078}@media(max-width:600px){.card{min-height:0;height:calc(100dvh - 46px);padding:8px}.instruction{font-size:.92rem}.syllables{margin:10px auto}.tile{padding:11px 17px;font-size:1.1rem}.action{padding:12px 24px}}
</style>
<style>.focus-syllable{border-color:#e3a32f!important;box-shadow:0 0 0 6px #f8dfb0;animation:focusPulse 1.2s infinite}@keyframes focusPulse{50%{box-shadow:0 0 0 10px #f8dfb000,0 0 22px #e3a32f99}}.task>.eyebrow,.task>h1,.task>.phase,.task>.progress,.task>.status{display:none}.instruction{font-size:clamp(1.25rem,3vw,1.8rem);line-height:1.25;margin:0 auto 18px}.feedback{margin:10px auto}</style></head>
<body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card"></section></main>
{{ lesson9_gawain1_data|json_script:"lesson9-data" }}
<script>
(()=>{const d=JSON.parse(document.getElementById('lesson9-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'',total=d.items.length;
let s=Object.assign({current_item:0,phase:'oral_syllables',syllable_index:0,read_attempts:0,listen_attempts:0,phase1_completed:false,selected_syllables:[],phase2_completed:false,phase3_completed:false,completed_items:[],state_version:0},d.progress?.state||{}),busy=false,audioUrl='';
const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
const current=()=>d.items[Math.min(total-1,s.current_item)];
const save=async()=>{const r=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:(s.state_version||0)+1}})});if(!r.ok)throw Error('Hindi na-save ang progreso.');};
const speak=async text=>{const f=new FormData();f.append('target_text',text);f.append('language','Filipino');f.append('mode','reading');f.append('prescribed_activity_key',d.activity_key);f.append('tts_profile','crla');const r=await fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f});const x=await r.json();if(!r.ok||!x.success)throw Error(x.error||'Audio is unavailable.');const bin=atob(x.audio_content||''),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const a=new Audio(URL.createObjectURL(new Blob([bytes],{type:x.mime_type||'audio/mpeg'})));await a.play();};
const finish=async()=>{await save();const r=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()}});if(!r.ok)throw Error('Hindi makumpleto ang gawain.');d.progress.activity_completed=true;render();};
const render=()=>{if(d.progress.activity_completed||s.phase==='complete'){app.innerHTML='<div class="done">✓<br>Magaling! Natapos mo ang GAWAIN 1: Letrang Ii, Oo, Ee.<br><a href="{% url "assessment" %}">Bumalik sa Aking Aralin</a></div>';return}const x=current(),i=s.current_item;
if(s.phase==='oral_syllables'){const n=s.syllable_index||0;app.innerHTML='<div class="task"><div class="eyebrow">SESSION 3 · LESSON 9 · GAWAIN 1</div><h1>Letrang Ii, Oo, Ee</h1><p class="instruction">'+d.instruction+'</p><span class="phase">1 · Basahin ang mga pantig isa-isa</span><div class="syllables"><span class="'+(n===0?'syllable focus-syllable':'inactive-syllable')+'">'+x.syllables[0]+'</span><b>+</b><span class="'+(n===1?'syllable focus-syllable':'inactive-syllable')+'">'+(n===1?x.syllables[1]:'_')+'</span></div><p class="progress">Aytem '+(i+1)+' / '+total+' · Pantig '+(n+1)+' / 2</p><p class="status" id="status">Basahin ang pantig na naka-kahon.</p><p class="feedback" id="feedback"></p><button class="action" id="read">Sabihin ang pantig</button></div>';bindOral(x.syllables[n],true);return}
if(s.phase==='combine'){app.innerHTML='<div class="task"><div class="eyebrow">SESSION 3 · LESSON 9 · GAWAIN 1</div><h1>Letrang Ii, Oo, Ee</h1><p class="instruction">'+d.instruction+'</p><span class="phase">2 · Pagsasama ng mga pantig</span><div class="building" id="building"><span class="status">Piliin ang unang pantig.</span></div><div class="tiles">'+x.syllables.map((v,j)=>'<button class="tile" data-i="'+j+'" '+(s.selected_syllables.includes(j)?'disabled':'')+'>'+v+'</button>').join('')+'</div><p class="progress">Aytem '+(i+1)+' / '+total+'</p><p class="feedback" id="feedback"></p><button class="action" id="combine" disabled>IPAGSAMA</button><button class="action" id="reset" type="button">I-RESET</button></div>';document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{s.selected_syllables=[...s.selected_syllables,+b.dataset.i];updateCombine()});document.getElementById('reset').onclick=()=>{s.selected_syllables=[];updateCombine()};document.getElementById('combine').onclick=async()=>{if(s.selected_syllables.join(',')!== '0,1'){document.getElementById('feedback').textContent='Hindi pa tama. Ayusin ang pagkakasunod-sunod at subukan muli.';return}s.phase='oral_word';s.phase1_completed=true;s.phase2_completed=true;s.selected_syllables=[];await save();render()};updateCombine();return}
app.innerHTML='<div class="task"><div class="eyebrow">SESSION 3 · LESSON 9 · GAWAIN 1</div><h1>Letrang Ii, Oo, Ee</h1><p class="instruction">Bagong Salita</p><span class="phase">3 · Bigkasin ang bagong salita</span><div class="word">'+x.word+'</div><p class="progress">Aytem '+(i+1)+' / '+total+'</p><p class="status" id="status">Bigkasin ang bagong salita.</p><p class="feedback" id="feedback"></p><button class="action" id="read">Sabihin ang salita</button></div>';bindOral(x.word,false)};
const updateCombine=()=>{const box=document.getElementById('building'),b=document.getElementById('combine');if(!box)return;const x=current();box.innerHTML=s.selected_syllables.length? s.selected_syllables.map(i=>'<span class="tile">'+x.syllables[i]+'</span>').join('<b>+</b>'):'<span class="status">Piliin ang unang pantig.</span>';b.disabled=s.selected_syllables.length!==2;};
const bindOral=(expected,isSyllables)=>{const b=document.getElementById('read'),status=document.getElementById('status'),feedback=document.getElementById('feedback'),listen=async()=>{if(busy)return;busy=true;b.disabled=true;b.classList.add('processing');b.textContent='Pakinggan…';try{await speak(expected)}catch(e){feedback.textContent='Hindi available ang audio. Subukan muli.'}s.listen_attempts=(s.listen_attempts||0)+1;busy=false;b.classList.remove('processing');if(s.listen_attempts>=3){s.read_attempts=0;s.listen_attempts=0;b.textContent='Basahin muli ang pantig';status.textContent='Basahin muli ang pantig na naka-kahon.';b.onclick=()=>{s.phase='oral_syllables';render()}}else{b.disabled=false;b.textContent='Pakinggan';await save()}};b.onclick=async()=>{if(busy)return;busy=true;b.disabled=true;b.classList.add('reading');b.textContent='Nakikinig…';const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){feedback.textContent='Hindi available ang mikropono. Subukan muli.';busy=false;b.disabled=false;b.classList.remove('reading');return}const r=new R();r.lang='fil-PH';r.onresult=async e=>{b.classList.remove('reading');b.classList.add('processing');b.textContent='Pinoproseso…';const ok=norm(e.results[0][0].transcript).includes(norm(expected));if(!ok){s.read_attempts=(s.read_attempts||0)+1;if(s.read_attempts>=3){status.textContent='Pakinggan ang pantig na naka-kahon.';b.disabled=false;b.textContent='Pakinggan';b.onclick=listen}else{feedback.textContent='Hindi pa tama. Subukan muli.';b.disabled=false;b.textContent='Sabihin ang pantig'}busy=false;await save();return}if(isSyllables){if((s.syllable_index||0)===0){s.syllable_index=1;s.read_attempts=0;s.listen_attempts=0;await save();busy=false;render();return}s.phase='combine';s.phase1_completed=true}else{s.phase3_completed=true;s.completed_items=[...new Set([...s.completed_items,s.current_item])];if(s.current_item===total-1){s.phase='complete';await finish();return}s.current_item++;s.phase='oral_syllables';s.syllable_index=0;s.phase1_completed=false;s.phase2_completed=false}s.read_attempts=0;s.listen_attempts=0;await save();busy=false;render()};r.onerror=async()=>{s.read_attempts=(s.read_attempts||0)+1;b.classList.remove('reading','processing');b.disabled=false;b.textContent=s.read_attempts>=3?'Pakinggan':'Sabihin ang pantig';status.textContent=s.read_attempts>=3?'Pakinggan ang pantig na naka-kahon.':'Hindi narinig. Subukan muli.';if(s.read_attempts>=3)b.onclick=listen;busy=false;await save()};r.start()};};
render();setInterval(()=>{const b=document.getElementById('read');if(b&&b.textContent.trim()==='Basahin muli ang pantig')b.disabled=false},50)})();
</script></body></html>
