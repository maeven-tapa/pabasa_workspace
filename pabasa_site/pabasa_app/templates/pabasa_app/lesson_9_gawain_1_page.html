<style>
:root{--ink:#183e63;--teal:#299e9a;--teal-dark:#187b7a;--accent:#e7af45;color:var(--ink);font-family:Fredoka,Nunito,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}@font-face{font-family:Fredoka;src:url("{% static 'pabasa_app/font/fredoka-one.one-regular.ttf' %}") format('truetype');font-display:swap}body{min-height:100vh;margin:0;overflow:hidden;background:url("{% static 'pabasa_app/prescribed/PRESCRIBED-BG.jpg' %}") center/cover no-repeat}.page{width:min(1250px,100%);height:100vh;margin:auto;padding:16px clamp(16px,4vw,42px) 22px;position:relative}.back{position:absolute;top:16px;left:clamp(16px,4vw,42px);z-index:2;display:inline-flex;align-items:center;justify-content:center;width:280px;min-height:64px;padding:12px 22px;border-radius:999px;background:#fff;color:var(--ink);font-size:1.2rem;font-weight:900;line-height:1.15;text-align:center;text-decoration:none;box-shadow:0 8px 17px #145ca744}.card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(1250px,calc(100% - 32px));height:calc(100vh - 190px);max-height:calc(100vh - 190px);padding:clamp(22px,3.2vh,42px) clamp(20px,6vw,80px) 20px;border:2px solid #ffffffaa;border-radius:42px;background:#ffffff63;backdrop-filter:blur(10px);box-shadow:0 18px 45px #1e5b7a35;text-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden}.task{width:min(860px,100%)}.eyebrow{width:max-content;max-width:100%;margin:-8px auto 16px;padding:10px 30px;border-radius:999px;background:#277f82;color:#fff;font-size:clamp(.85rem,1.4vw,1.15rem);letter-spacing:.02em;font-weight:900}.card h1{margin:0;color:var(--ink);font-size:clamp(2rem,4vw,3.7rem);line-height:1.08;font-weight:900}.instruction{max-width:760px;margin:12px auto 16px;color:#315b74;font-size:clamp(1.05rem,2vw,1.45rem);line-height:1.3;font-weight:800}.phase{display:inline-block;padding:9px 20px;border-radius:999px;background:#eef8fb;color:#277f82;font-weight:900}.syllables{display:flex;justify-content:center;align-items:center;gap:clamp(14px,4vw,36px);margin:18px auto;font-size:clamp(2rem,6vw,3.8rem);font-weight:900}.syllable{padding:12px 22px;border:4px solid #94d9d6;border-radius:24px;background:#ffffffe8;color:#176078;box-shadow:0 5px 0 #b7d6dc}.tiles,.building{display:flex;justify-content:center;gap:14px;min-height:70px;margin:16px auto;flex-wrap:wrap}.tile{border:4px solid #94d9d6;border-radius:20px;background:#ffffffe8;color:#176078;padding:14px 24px;font:inherit;font-size:1.35rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #b7d6dc,0 8px 16px #187b7a20;transition:.16s}.tile:not(:disabled):hover{transform:translateY(-2px);border-color:#299e9a}.tile:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.building{align-items:center;border:3px dashed #94d9d6;border-radius:24px;padding:12px;background:#ffffff80}.building .tile{background:#eef8fb}.oral-actions{display:flex;align-items:stretch;justify-content:center;gap:14px;width:min(680px,100%);margin:8px auto 0}.oral-actions .action{flex:1;min-width:0}.action{display:inline-flex;align-items:center;justify-content:center;min-width:min(330px,80vw);min-height:64px;margin:6px 7px;padding:14px 24px;border:0;border-radius:999px;background:var(--teal);color:#fff;font:inherit;font-size:clamp(1.05rem,1.8vw,1.35rem);font-weight:900;box-shadow:0 7px 0 var(--teal-dark),0 10px 20px #187b7a40;cursor:pointer;transition:.16s}.action:not(:disabled):hover{background:#38b0aa;transform:translateY(-2px)}.action.reading{background:#d64c55;animation:pulse 1.2s infinite}.action.processing{background:#e6a33a;box-shadow:0 7px 0 #b97920,0 10px 20px #b9792040;cursor:wait}.action:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}.status{min-height:28px;margin:8px auto;color:#397b56;font-weight:900}.feedback{min-height:25px;margin:10px auto;color:#b33b2f;font-weight:900}.progress{margin:8px;color:#71828a;font-weight:900}.word{margin:18px auto;font-size:clamp(2.7rem,9vw,5rem);font-weight:900;color:#176078}.focus-syllable{border-color:#e3a32f!important;box-shadow:0 0 0 6px #f8dfb0;animation:focusPulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px #d64c5500,0 0 24px #d64c55b3}}@keyframes focusPulse{50%{box-shadow:0 0 0 10px #f8dfb000,0 0 22px #e3a32f99}}.done{color:#26784e;font-size:1.8rem;font-weight:900}.done a{display:inline-flex;align-items:center;justify-content:center;margin-top:18px;min-height:58px;padding:12px 26px;border-radius:999px;background:var(--teal);color:#fff;font:inherit;font-size:1.1rem;font-weight:900;box-shadow:0 6px 0 var(--teal-dark);text-decoration:none}
</style>
<style>.task>.eyebrow,.task>h1,.task>.phase,.task>.progress{display:none}.instruction{font-size:clamp(1.25rem,3vw,1.8rem);line-height:1.25;margin:0 auto 18px}@media(max-width:800px){.card{border-radius:30px;width:calc(100% - 24px)}.back{width:240px;min-height:58px;font-size:1.05rem}.action{min-width:0;width:calc(50% - 18px);margin-left:5px;margin-right:5px}}@media(max-width:520px){.oral-actions{gap:8px;width:100%}body{overflow:auto}.page{height:100svh;padding:12px}.back{top:12px;left:12px;width:230px;min-height:54px;font-size:1rem}.card{top:54%;width:calc(100% - 24px);height:calc(100svh - 174px);max-height:calc(100svh - 174px);padding:18px 12px;border-radius:28px}.eyebrow{padding:8px 16px}.card h1{font-size:clamp(1.7rem,8vw,2.35rem)}.instruction{font-size:1rem}.syllables{gap:8px;margin:10px auto}.syllable{padding:10px 14px}.tiles,.building{gap:8px;margin:10px auto}.tile{padding:10px 14px;font-size:1.05rem}.action{width:calc(50% - 14px);min-height:56px;padding:12px 10px;font-size:.98rem}.word{margin:12px auto;font-size:clamp(2.4rem,14vw,4rem)}}.feedback{margin:10px auto}</style>
<style>.building.is-disabled{opacity:.45;filter:grayscale(.7);pointer-events:none}.tile.is-selected{opacity:.45;cursor:not-allowed;box-shadow:none}</style><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card"></section></main>
{{ lesson9_gawain1_data|json_script:"lesson9-data" }}
<script>
(()=>{const d=JSON.parse(document.getElementById('lesson9-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'',total=d.items.length;
let s=Object.assign({current_item:0,phase:'oral_syllables',syllable_index:0,read_attempts:0,listen_attempts:0,phase1_completed:false,selected_syllables:[],phase2_completed:false,phase3_completed:false,completed_items:[],state_version:0},d.progress?.state||{}),busy=false,audioUrl='',oralInstructionItem=-1;
const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
const current=()=>d.items[Math.min(total-1,s.current_item)];
const save=async()=>{const r=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:(s.state_version||0)+1}})});if(!r.ok)throw Error('Hindi na-save ang progreso.');};
const speak=async text=>{const f=new FormData();f.append('target_text',text);f.append('language','Filipino');f.append('mode','reading');f.append('prescribed_activity_key',d.activity_key);f.append('tts_profile','crla');const r=await fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f});const x=await r.json();if(!r.ok||!x.success)throw Error(x.error||'Audio is unavailable.');const bin=atob(x.audio_content||''),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const a=new Audio(URL.createObjectURL(new Blob([bytes],{type:x.mime_type||'audio/mpeg'})));await new Promise((resolve,reject)=>{a.onended=resolve;a.onerror=reject;const playback=a.play();if(playback?.catch)playback.catch(reject)})};
const finish=async()=>{await save();const r=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()}});if(!r.ok)throw Error('Hindi makumpleto ang gawain.');d.progress.activity_completed=true;render();};
const render=()=>{if(d.progress.activity_completed||s.phase==='complete'){app.innerHTML='<div class="done">✓<br>Magaling! Natapos mo ang GAWAIN 1: Letrang Ii, Oo, Ee.</div>';return}const x=current(),i=s.current_item;
if(s.phase==='oral_syllables'){const n=s.syllable_index||0;app.innerHTML='<div class="task"><div class="eyebrow">SESSION 3 · LESSON 9 · GAWAIN 1</div><h1>Letrang Ii, Oo, Ee</h1><p class="instruction">Basahin ang pantig na nasa loob ng kahon.</p><span class="phase">1 · Basahin ang mga pantig isa-isa</span><div class="syllables"><span class="'+(n===0?'syllable focus-syllable':'inactive-syllable')+'">'+x.syllables[0]+'</span><b>+</b><span class="'+(n===1?'syllable focus-syllable':'inactive-syllable')+'">'+(n===1?x.syllables[1]:'_')+'</span></div><p class="progress">Aytem '+(i+1)+' / '+total+' · Pantig '+(n+1)+' / 2</p><p class="feedback" id="feedback"></p><div class="oral-actions"><button class="action" id="read" type="button">Sabihin ang salita</button><button class="action" id="listen" type="button">Pakinggan</button></div></div>';bindOral(x.syllables[n],true);return}
if(s.phase==='combine'){app.innerHTML='<div class="task"><div class="eyebrow">SESSION 3 · LESSON 9 · GAWAIN 1</div><h1>Letrang Ii, Oo, Ee</h1><p class="instruction">Pagsamahin ang mga pantig na binasa.</p><span class="phase">2 · Pagsasama ng mga pantig</span><div class="building" id="building"><span class="status">Piliin ang unang pantig.</span></div><div class="tiles">'+x.syllables.map((v,j)=>'<button class="tile" data-i="'+j+'" '+(s.selected_syllables.includes(j)?'disabled':'')+'>'+v+'</button>').join('')+'</div><p class="progress">Aytem '+(i+1)+' / '+total+'</p><p class="feedback" id="feedback"></p><button class="action" id="combine" disabled>IPAGSAMA</button><button class="action" id="reset" type="button">I-RESET</button></div>';document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(busy||b.disabled)return;s.selected_syllables=[...s.selected_syllables,+b.dataset.i];updateCombine()});document.getElementById('reset').onclick=()=>{if(busy)return;s.selected_syllables=[];updateCombine()};document.getElementById('combine').onclick=async()=>{if(busy)return;if(s.selected_syllables.join(',')!== '0,1'){const feedback=document.getElementById('feedback');feedback.textContent='Hindi pa tama. Ayusin ang pagkakasunod-sunod at subukan muli.';busy=true;updateCombine();try{await speak('Hindi pa tama. Ayusin ang pagkakasunod-sunod at subukan muli.')}catch(e){}busy=false;updateCombine();return}document.getElementById('feedback').textContent='Magaling!';busy=true;updateCombine();try{await speak('Magaling!')}catch(e){}s.phase='oral_word';s.phase1_completed=true;s.phase2_completed=true;s.selected_syllables=[];await save();busy=false;render()};updateCombine();busy=true;updateCombine();speak('Pagsamahin ang mga pantig na binasa.').catch(()=>{}).finally(()=>{busy=false;updateCombine()});return}
app.innerHTML='<div class="task"><div class="eyebrow">SESSION 3 · LESSON 9 · GAWAIN 1</div><h1>Letrang Ii, Oo, Ee</h1><p class="instruction">Basahin ang bagong salitang nabuo</p><span class="phase">3 · Bigkasin ang bagong salita</span><div class="word">'+x.word+'</div><p class="progress">Aytem '+(i+1)+' / '+total+'</p><p class="feedback" id="feedback"></p><div class="oral-actions"><button class="action" id="read" type="button">Sabihin ang salita</button><button class="action" id="listen" type="button">Pakinggan</button></div></div>';bindOral(x.word,false,'Basahin ang bagong salitang nabuo')};
const updateCombine=()=>{const box=document.getElementById('building'),b=document.getElementById('combine'),r=document.getElementById('reset');if(!box)return;const x=current(),selected=s.selected_syllables,locked=busy;box.innerHTML=selected.length? selected.map(i=>'<span class="tile is-selected">'+x.syllables[i]+'</span>').join('<b>+</b>'):'<span class="status">Piliin ang unang pantig.</span>';box.classList.toggle('is-disabled',locked);box.setAttribute('aria-disabled',locked?'true':'false');document.querySelectorAll('.tiles .tile').forEach(tile=>{const chosen=selected.includes(+tile.dataset.i);tile.disabled=locked||chosen;tile.classList.toggle('is-selected',chosen)});b.disabled=locked||selected.length!==2;if(r)r.disabled=locked;};
const bindOral=(expected,isSyllables,instructionText)=>{const b=document.getElementById('read'),listenButton=document.getElementById('listen'),status=document.getElementById('status'),feedback=document.getElementById('feedback'),setButtons=enabled=>{b.disabled=!enabled;if(listenButton)listenButton.disabled=!enabled},narrate=async text=>{setButtons(false);try{await speak(text)}catch(e){}setButtons(true)},listen=async()=>{if(busy)return;busy=true;setButtons(false);b.classList.add('processing');try{await speak((expected==='A'||expected==='a')?'Ah':expected);s.listen_attempts=(s.listen_attempts||0)+1;await save()}catch(e){feedback.textContent='Hindi available ang audio. Subukan muli.'}finally{b.classList.remove('processing');busy=false;setButtons(true)}},startRead=async()=>{if(busy)return;busy=true;setButtons(false);b.classList.add('reading');b.textContent='Nakikinig…';const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){feedback.textContent='Hindi available ang mikropono. Subukan muli.';b.classList.remove('reading');b.textContent='Sabihin ang salita';busy=false;setButtons(true);return}const r=new R();r.lang='fil-PH';r.onresult=async e=>{b.classList.remove('reading');b.classList.add('processing');b.textContent='Pinoproseso…';const ok=norm(e.results[0][0].transcript).includes(norm(expected));if(!ok){s.read_attempts=(s.read_attempts||0)+1;const wrong=isSyllables?'Hindi iyon ang tamang pantig. Subukan muli magsalita.':'Hindi iyon ang tamang salita. Subukan muli magsalita';feedback.textContent=wrong;await save();await narrate(wrong);b.classList.remove('reading','processing');b.textContent='Sabihin ang salita';busy=false;return}feedback.textContent='Magaling!';setButtons(false);try{await speak('Magaling!')}catch(e){}if(isSyllables){if((s.syllable_index||0)===0){s.syllable_index=1;s.read_attempts=0;s.listen_attempts=0;await save();busy=false;render();return}s.phase='combine';s.phase1_completed=true}else{s.phase3_completed=true;s.completed_items=[...new Set([...s.completed_items,s.current_item])];if(s.current_item===total-1){s.phase='complete';await finish();return}s.current_item++;s.phase='oral_syllables';s.syllable_index=0;s.phase1_completed=false;s.phase2_completed=false}s.read_attempts=0;s.listen_attempts=0;await save();busy=false;render()};r.onerror=async()=>{s.read_attempts=(s.read_attempts||0)+1;b.classList.remove('reading','processing');b.textContent='Sabihin ang salita';if(status)status.textContent=s.read_attempts>=3?'Pakinggan ang pantig na naka-kahon.':'Hindi narinig. Subukan muli.';busy=false;setButtons(true);await save()};r.start()};b.onclick=startRead;if(listenButton)listenButton.onclick=listen;if(isSyllables&&oralInstructionItem!==s.current_item+':'+(s.syllable_index||0)){oralInstructionItem=s.current_item+':'+(s.syllable_index||0);busy=true;setButtons(false);speak('Basahin ang pantig na nasa loob ng kahon.').catch(()=>{}).finally(()=>{busy=false;setButtons(true)})}if(instructionText){busy=true;setButtons(false);speak(instructionText).catch(()=>{}).finally(()=>{busy=false;setButtons(true)})}};
render();setInterval(()=>{const b=document.getElementById('read');if(b&&b.textContent.trim()==='Basahin muli ang pantig')b.disabled=false},50)})();
</script></body></html>
