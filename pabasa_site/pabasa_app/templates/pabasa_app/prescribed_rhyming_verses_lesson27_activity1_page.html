{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rhyming Verses | PABASA</title>
  <style>
    @font-face{font-family:Lesson27Fredoka;src:url("{% static 'pabasa_app/images/lesson_27/lesson27-fredoka.ttf' %}") format('truetype');font-display:swap}
    :root{--ink:#183e63;--muted:#55768b;--line:#94d9d6;--gold:#efb947;--good:#24845f;--bad:#b33b43;--teal:#299e9a;--teal-dark:#187b7a}
    *{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;min-height:100dvh;background:#49b8e0 url("{% static 'pabasa_app/images/lesson_27/lesson27-ui-background.jpg' %}") center/cover fixed no-repeat;color:var(--ink);font-family:Lesson27Fredoka,Nunito,"Segoe UI",sans-serif}
    .page{width:min(1250px,calc(100% - 36px));height:100dvh;min-height:0;margin:auto;padding:16px 0 18px;display:flex;flex-direction:column;overflow:visible}.back{align-self:flex-start;display:flex;align-items:center;justify-content:center;gap:12px;width:280px;min-height:64px;padding:10px 22px;border-radius:999px;background:#fff;color:var(--ink);font-size:1.15rem;line-height:1.1;text-align:center;text-decoration:none;box-shadow:0 8px 17px #145ca744;transition:transform .16s,box-shadow .16s}.back:hover{transform:translateY(-2px);box-shadow:0 10px 22px #145ca755}.back:active{transform:translateY(2px);box-shadow:0 3px 8px #145ca744}.back:focus-visible,.lesson27-button:focus-visible,.lesson27-word:focus-visible,.lesson27-start-actions button:focus-visible{outline:3px solid var(--line);outline-offset:3px}
    .lesson27-stage{position:relative;flex:1;min-height:0;margin:clamp(18px,4vh,44px) 0 0;padding:clamp(22px,3.5vh,42px) clamp(22px,5vw,72px) 24px;border:2px solid #ffffffaa;border-radius:42px;background:#ffffff63;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 18px 45px #1e5b7a35;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:visible;transition:filter .2s,opacity .2s}.lesson27-stage.is-waiting{filter:blur(2px);opacity:.58;pointer-events:none}#app{width:100%}
    .lesson27-eyebrow{width:max-content;max-width:100%;margin:0 auto 18px;padding:11px 28px;border-radius:999px;background:#277f82;color:#fff;font-size:clamp(.82rem,1.25vw,1rem);font-weight:900;letter-spacing:.06em;box-shadow:0 7px 16px #277f8244}.lesson27-title{margin:0;font-size:clamp(2.6rem,5vw,4.5rem);line-height:1.08;font-weight:900}.lesson27-instruction{max-width:850px;margin:18px auto 0;color:var(--muted);font-size:clamp(1rem,1.5vw,1.25rem);line-height:1.45}.lesson27-content{width:min(100%,1050px);margin:clamp(22px,3.2vh,38px) auto 0}.lesson27-poem-title{margin:0 0 16px;font-size:clamp(1.45rem,2.4vw,2.1rem)}
    .lesson27-verses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:left}.lesson27-verse{min-height:70px;padding:14px 18px;border:2px solid #b7cdd0;border-radius:16px;background:#ffffffd9;color:var(--ink);font-size:clamp(1.1rem,2vw,1.5rem);line-height:1.55;transition:border-color .16s,background .16s,transform .16s,box-shadow .16s}.lesson27-verse.active{border-color:var(--teal);background:#f5fffe;box-shadow:0 0 0 2px #94d9d655}.lesson27-verse.read{border-color:#65b790;background:#e5f5eb}.lesson27-word{display:inline;border:0;border-radius:8px;background:transparent;color:inherit;padding:2px 4px;font:inherit;cursor:pointer;transition:background .14s,color .14s,transform .14s,box-shadow .14s}.lesson27-word:hover:not(:disabled){background:#f4d26d;color:#183e63;transform:translateY(-1px);box-shadow:0 2px 0 #d1a83a}.lesson27-word:disabled{cursor:default}.lesson27-word.selected{background:#d8f2df;color:var(--good);font-weight:900}.lesson27-word.wrong{background:#f7dada;color:var(--bad)}
    .lesson27-prompt{margin:22px 0 10px;font-size:clamp(1.05rem,1.8vw,1.4rem);font-weight:900}.lesson27-status{min-height:2em;margin:10px 0 14px;color:var(--muted);font-weight:800}.lesson27-status.good{color:var(--good)}.lesson27-status.bad{color:var(--bad)}.lesson27-actions{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}.lesson27-button{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-width:min(310px,42vw);min-height:76px;border:0;border-radius:999px;background:var(--teal);box-shadow:0 8px 0 var(--teal-dark),0 12px 24px #187b7a40;color:#fff;padding:16px 24px;font:inherit;font-size:clamp(1rem,1.8vw,1.45rem);font-weight:900;cursor:pointer;transition:transform .16s,filter .16s,box-shadow .16s}.lesson27-button.secondary{border:4px solid var(--line);background:#fffffff0;color:var(--teal-dark);box-shadow:0 6px 0 #b7d6dc,0 10px 20px #187b7a20}.lesson27-button:hover:not(:disabled){background:#38b0aa;transform:translateY(-2px);filter:none}.lesson27-button.secondary:hover:not(:disabled){background:#f4fffe;transform:translateY(-2px);box-shadow:0 6px 16px #187b7a26}.lesson27-button:active:not(:disabled){background:#218783;transform:translateY(3px);box-shadow:0 2px 0 var(--teal-dark)}.lesson27-button.secondary:active:not(:disabled){background:#d8f2f0;transform:translateY(3px);box-shadow:0 2px 0 #b7d6dc}.lesson27-button:disabled{background:#b5c5c7!important;color:#edf3f4!important;border-color:transparent!important;box-shadow:none!important;cursor:not-allowed;transform:none;filter:none}
    .lesson27-progress{display:flex;justify-content:center;gap:12px;margin:clamp(22px,3vh,34px) auto 0}.lesson27-step{display:grid;place-items:center;width:42px;height:42px;border:3px solid #e2e8e8;border-radius:50%;background:#ffffffe8;color:#55727e;font-weight:900}.lesson27-step.active{border-color:var(--gold);background:#f4c866;color:#6c511e;box-shadow:0 0 0 4px #ffffffaa}.lesson27-step.done{border-color:#53ae83;background:#53ae83;color:#fff}.lesson27-complete{width:min(100%,900px);min-height:420px;display:grid;align-content:center;margin:auto;color:var(--good);font-size:clamp(1.5rem,3vw,2.2rem);font-weight:900}
    .lesson27-start-backdrop{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:#e7f7f7c9;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}.lesson27-start-backdrop[hidden]{display:none}.lesson27-start-modal{width:min(500px,calc(100vw - 36px));padding:36px 34px 34px;border:2px solid #ffffffd9;border-radius:30px;background:#fffffff3;box-shadow:0 22px 60px #173f6325;text-align:center}.lesson27-start-label{margin:0 0 18px;color:#277f82;font-size:1rem;font-weight:900;letter-spacing:.08em}.lesson27-start-title{margin:0 0 14px;color:var(--ink);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;line-height:1.16}.lesson27-start-description{margin:0 0 26px;color:var(--muted);font-size:1.02rem;line-height:1.4}.lesson27-start-actions{display:grid;gap:14px}.lesson27-start-actions button{width:100%;min-height:64px;padding:14px 20px;border:0;border-radius:999px;font:inherit;font-size:1.15rem;font-weight:900;cursor:pointer;transition:transform .16s,filter .16s,box-shadow .16s}.lesson27-start-actions button:hover{transform:translateY(-2px);filter:brightness(1.04)}.lesson27-start-actions button:active{transform:translateY(2px)}.lesson27-start-actions button:focus-visible{outline:3px solid var(--line);outline-offset:3px}.lesson27-start-button{background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--teal-dark)}.lesson27-later-button{border:3px solid var(--line)!important;background:#fff;color:var(--teal-dark);box-shadow:0 4px 0 #b7d6dc}
    @media(max-height:1100px) and (min-width:801px){.lesson27-stage{padding-top:18px;padding-bottom:16px}.lesson27-content{margin-top:18px}.lesson27-verses{gap:9px}.lesson27-verse{min-height:62px;padding:10px 16px}.lesson27-progress{margin-top:16px}}
    @media(max-width:800px){.page{width:min(100% - 24px,680px);padding-top:12px;padding-bottom:12px}.lesson27-stage{min-height:0;margin-top:20px;padding:24px 18px 18px;border-radius:30px}.lesson27-verses{grid-template-columns:1fr}.lesson27-button{min-width:min(270px,44vw)}.lesson27-complete{min-height:55vh}}
    @media(max-width:480px){.back{width:245px;min-height:58px;font-size:1rem}.lesson27-stage{padding:28px 12px 20px}.lesson27-start-modal{padding:30px 22px 26px}.lesson27-eyebrow{padding:9px 15px}.lesson27-actions{gap:12px}.lesson27-button{width:100%;min-width:0;min-height:62px}.lesson27-step{width:34px;height:34px;font-size:.9rem}.lesson27-verse{padding:12px;font-size:1.05rem}}
  </style>
  <style>
    /* Match Lesson 28's compact prescribed card while preserving Lesson 27 behavior. */
    html body .page{position:relative;display:block;width:min(1250px,calc(100% - 36px));height:100dvh;padding:16px 0 22px}
    html body .page .back{position:absolute;top:16px;left:0;z-index:2;width:280px;min-height:64px}
    html body .page .lesson27-stage{position:absolute;top:clamp(136px,18vh,188px);left:50%;right:auto;bottom:clamp(18px,5vh,50px);width:100%;height:auto;min-height:0;margin:0;transform:translateX(-50%);padding:clamp(22px,3.3vh,42px) clamp(20px,6vw,80px) 20px;border-radius:42px;display:flex;place-items:center;overflow:hidden}
    html body .page #app{width:min(100%,1050px);max-height:100%}
    html body .lesson27-eyebrow{margin:-8px auto 16px;padding:10px 30px;font-size:clamp(.85rem,1.4vw,1.15rem);letter-spacing:.02em}
    html body .lesson27-title{font-size:clamp(2.2rem,4.2vw,3.8rem)}
    html body .lesson27-instruction{margin:14px auto 0;font-size:clamp(1rem,1.5vw,1.25rem)}
    html body .lesson27-content{margin:clamp(14px,2.5vh,26px) auto 0}
    html body .lesson27-verses{gap:10px}
    html body .lesson27-verse{min-height:64px;padding:11px 16px}
    html body .lesson27-prompt{margin:16px 0 8px}
    html body .lesson27-status{min-height:1.8em;margin:8px 0 10px}
    html body .lesson27-progress{gap:9px;margin-top:clamp(14px,2vh,24px)}
    html body .lesson27-step{width:36px;height:36px}
    @media(max-width:800px){html body .page{width:min(100% - 24px,680px);padding:12px}html body .page .back{top:12px;left:0;width:245px;min-height:58px}html body .page .lesson27-stage{top:116px;bottom:12px;padding:22px 14px 16px;border-radius:30px}html body .lesson27-verse{min-height:60px;padding:10px 12px}}
  </style>
  <style>
    .lesson27-button.is-busy{animation:lesson27ButtonPulse 1.15s ease-in-out infinite}
    @keyframes lesson27ButtonPulse{0%,100%{transform:scale(1);box-shadow:0 8px 0 var(--teal-dark),0 12px 24px #187b7a40}50%{transform:scale(1.025);box-shadow:0 0 0 9px #f5d47c55,0 8px 0 var(--teal-dark),0 15px 28px #187b7a55}}
  </style>
<link rel="stylesheet" href="{% static 'pabasa_app/css/lesson_button_animation.css' %}?v=1">
<style>html body .page .lesson27-stage{top:calc(50% + 24px);bottom:auto;height:auto;max-height:calc(100dvh - 32px);padding:20px 48px 16px;transform:translate(-50%,-50%)}html body .lesson27-instruction{margin-top:12px}html body .lesson27-content{margin-top:14px}html body .lesson27-poem-title{margin-bottom:10px}html body .lesson27-prompt{margin:12px 0 6px}html body .lesson27-progress{margin-top:14px}@media(max-width:800px){html body .page .lesson27-stage{top:calc(50% + 12px);bottom:auto;max-height:calc(100dvh - 24px);padding:18px 14px 14px;transform:translate(-50%,-50%)}}</style>
</head>
<body>
  <main class="page"><a class="back" id="lesson27-back" href="{% url 'assessment' %}"><span aria-hidden="true">←</span><span>Back to My Lessons</span></a><section class="lesson27-stage is-waiting" id="lesson27-stage"><div id="app" aria-live="polite"></div></section></main>
  <div class="lesson27-start-backdrop" id="lesson27-start" role="dialog" aria-modal="true" aria-labelledby="lesson27-start-title"><div class="lesson27-start-modal"><p class="lesson27-start-label">SESSION 11 · LESSON 27 · ACTIVITY 1</p><h2 class="lesson27-start-title" id="lesson27-start-title">RHYMING VERSES</h2><p class="lesson27-start-description">Read each verse, then select the words that rhyme with “at.”</p><div class="lesson27-start-actions"><button class="lesson27-start-button" id="lesson27-start-button" type="button">START</button><button class="lesson27-later-button" id="lesson27-later-button" type="button">NOT NOW</button></div></div></div>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script src="{% static 'pabasa_app/js/prescribed_lesson26_31_ui.js' %}?v=lesson26-31-ui-3" defer></script><script src="{% static 'pabasa_app/js/prescribed_rhyming_verses_lesson27_activity1.js' %}?v=lesson27-ui-17-resume2-startover" defer></script>
  <script>(()=>{const modal=document.getElementById('lesson27-start'),stage=document.getElementById('lesson27-stage'),start=document.getElementById('lesson27-start-button');start.addEventListener('click',()=>{modal.hidden=true;stage.classList.remove('is-waiting')});start.focus()})();</script>
</body>
</html>
