</style></head><body><div class="page"><a class="back" href="{% url 'assessment' %}">← BUMALIK SA AKING ARALIN</a><main class="activity"><div class="context">Session 4 · Lessons 10, 11, at 12</div><h1>Gawain 4: I-Decode ang mga Pangungusap</h1><p class="instruction">I-decode o basahin ang mga pangungusap na nasa ibaba.</p><section class="sentence-card"><div class="sentence" id="sentence">Ubo si Bibo</div><div id="controls"><button class="button" id="record" type="button">🎙 SIMULAN</button></div><p class="message" id="message" role="status"></p></section><div class="footer"><span id="progress">1 of 4</span><span class="dots" id="dots"><i class="active"></i><i></i><i></i><i></i></span></div></main></div><dialog id="done"><h2>🎉 Magaling!</h2><p>Tapos na ang Gawain 4!</p><button class="button" type="button" onclick="done.close()">BALIK</button><button class="button" type="button" disabled title="Gawain 5 ay hindi pa magagamit">TULOY SA GAWAIN 5</button></dialog><script>
(()=>{const sentences=['Ubo si Bibo','Bibo ang bibe.','Ibaba ang babae.','Buo ang bao.'];let i=0,r=null,s=null,c=[];const sentence=document.getElementById('sentence'),controls=document.getElementById('controls'),message=document.getElementById('message'),progress=document.getElementById('progress'),dots=document.getElementById('dots');const stop=()=>{if(s)s.getTracks().forEach(t=>t.stop());s=null};const render=()=>{sentence.textContent=sentences[i];progress.textContent=`${i+1} of 4`;dots.querySelectorAll('i').forEach((d,n)=>d.classList.toggle('active',n===i));controls.innerHTML='<button class="button" id="record" type="button">🎙 SIMULAN</button>';message.textContent='';document.getElementById('record').onclick=toggle};const actions=()=>{controls.innerHTML=`<div class="actions"><button class="action" id="again" type="button">ULITIN</button><button class="action next" id="advance" type="button">${i===3?'TAPUSIN ANG GAWAIN':'SUNOD NA PANGUNGUSAP'}</button></div>`;again.onclick=()=>{r=null;c=[];stop();render()};advance.onclick=async()=>{if(i===3){await fetch('{% url "prescribed_activity_progress" activity_key="session-4-gawain-4" %}',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''},body:JSON.stringify({completed_items:4})});done.showModal();return}i++;render()}};const start=async()=>{const b=document.getElementById('record');if(!window.MediaRecorder||!navigator.mediaDevices?.getUserMedia){message.textContent='Hindi available ang voice recording sa device na ito.';return}try{s=await navigator.mediaDevices.getUserMedia({audio:true});c=[];r=new MediaRecorder(s);r.ondataavailable=e=>e.data.size&&c.push(e.data);r.onstop=()=>{stop();actions()};r.start();b.classList.add('recording');b.textContent='🔴 NAG-RE-RECORD...';message.textContent='Basahin ang pangungusap.'}catch(e){stop();message.textContent='Hindi mabuksan ang mikropono. Subukan muli.')}};const toggle=()=>r?.state==='recording'?r.stop():start();document.getElementById('record').onclick=toggle;addEventListener('pagehide',stop)})();
</script></body></html>
