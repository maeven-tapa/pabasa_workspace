<body><div class="stars"></div><main class="app"><header class="top"><a class="back" href="{% url 'assessment' %}"><i class="bi bi-arrow-left"></i> Back</a><div class="score" id="progress">Round 1 of 0</div></header><section class="sign"><h1>Match the Letter to Its Sound</h1></section><section class="stall" id="stall"><div class="roulette-stage"><div class="roulette" id="roulette"><div class="letter-target" id="letterTarget" aria-label="Target letter"></div><button class="balloon b0" data-choice-index="0" aria-label="Choose balloon 1"></button><button class="balloon b1" data-choice-index="1" aria-label="Choose balloon 2"></button><button class="balloon b2" data-choice-index="2" aria-label="Choose balloon 3"></button><button class="balloon b3" data-choice-index="3" aria-label="Choose balloon 4"></button><button class="balloon b4" data-choice-index="4" aria-label="Choose balloon 5"></button><button class="audio-handle h0" data-audio-index="0" aria-label="Play balloon 1 sound"><i class="bi bi-volume-up-fill"></i></button><button class="audio-handle h1" data-audio-index="1" aria-label="Play balloon 2 sound"><i class="bi bi-volume-up-fill"></i></button><button class="audio-handle h2" data-audio-index="2" aria-label="Play balloon 3 sound"><i class="bi bi-volume-up-fill"></i></button><button class="audio-handle h3" data-audio-index="3" aria-label="Play balloon 4 sound"><i class="bi bi-volume-up-fill"></i></button><button class="audio-handle h4" data-audio-index="4" aria-label="Play balloon 5 sound"><i class="bi bi-volume-up-fill"></i></button></div></div><div class="dart" id="dart"></div><p class="instruction">Tap a handle to hear its balloon, then pop the balloon that matches the letter.</p><p class="feedback" id="feedback" aria-live="polite"></p><div class="complete" id="complete"><div class="complete-card"><h2>Assessment Complete</h2><p id="completionLabel">Correct Balloon Popped!</p><strong id="finalScore">0 / 0</strong><button id="finishButton">Back to Assessments</button></div></div></section></main>
<script>
(()=>{'use strict';
const material={{ letter_sound_correspondence_material_json|safe }};
const completion={{ letter_sound_correspondence_completion_json|safe }};
const allItems=Array.isArray(material.items)?material.items.filter(item=>item&&item.letter):[];
let index=0,correct=0,locked=false,currentChoices=[];
const answers=[];const $=id=>document.getElementById(id);const soundEffects={balloonPop:"{% static 'pabasa_app/audio/letter_sound_correspondence/balloon-pop.mp3' %}",rouletteSpin:"{% static 'pabasa_app/audio/letter_sound_correspondence/roulette-spin.mp3' %}",confetti:"{% static 'pabasa_app/audio/letter_sound_correspondence/confetti.mp3' %}"};
const balloons=[...document.querySelectorAll('.balloon')];
const handles=[...document.querySelectorAll('.audio-handle')];
function playEffect(name,wait=false){const source=soundEffects[name];if(!source)return Promise.resolve();const audio=new Audio(source);if(!wait){audio.play().catch(()=>{});return Promise.resolve()}return new Promise(resolve=>{let settled=false;const done=()=>{if(settled)return;settled=true;window.clearTimeout(timeout);resolve()};const timeout=window.setTimeout(done,8000);audio.addEventListener('ended',done,{once:true});audio.addEventListener('error',done,{once:true});audio.play().catch(done)})}
function playCompletionTransition(reveal){const audio=new Audio(soundEffects.confetti);let revealed=false;const show=()=>{if(revealed)return;revealed=true;reveal()};const revealHalfway=()=>{const duration=Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:1.2;window.setTimeout(show,Math.max(250,Math.min(4000,duration*500)))};audio.play().then(()=>{if(audio.readyState>=1)revealHalfway();else audio.addEventListener('loadedmetadata',revealHalfway,{once:true})}).catch(show);audio.addEventListener('error',show,{once:true});window.setTimeout(show,4500)}function readInstruction(){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance('Tap a handle to hear its balloon, then pop the balloon that matches the letter.');utterance.lang=String(material.language).toLowerCase()==='english'?'en-US':'fil-PH';utterance.rate=.92;window.speechSynthesis.speak(utterance)}
function current(){return allItems[index]||null}
function choicesFor(item){const others=allItems.filter(entry=>String(entry.letter).toUpperCase()!==String(item.letter).toUpperCase()).sort((a,b)=>String(a.letter).localeCompare(String(b.letter))).slice(0,4);const choices=[item,...others];for(let i=choices.length-1;i>0;i--){const swap=(index*11+i*7)%(i+1);[choices[i],choices[swap]]=[choices[swap],choices[i]]}return choices}
function render(){const item=current();if(!item){finish();return}currentChoices=choicesFor(item);$('letterTarget').textContent=item.letter;$('letterTarget').setAttribute('aria-label',`Target letter ${item.letter}`);balloons.forEach((balloon,position)=>{balloon.className=`balloon b${position}`;balloon.disabled=false;balloon.dataset.letter=currentChoices[position]?.letter||''});handles.forEach((handle,position)=>{handle.disabled=false;handle.dataset.audioIndex=position});$('progress').textContent=`Round ${index+1} of ${allItems.length}`;$('feedback').textContent=''}
function audioPath(item){const language=String(material.language).toLowerCase()==='english'?'english':'filipino';const code=language==='english'?'E':'T';const vowels=['A','E','I','O','U'];const category=vowels.includes(String(item.letter).toUpperCase())?'vowels':'syllables';return `/static/pabasa_app/audio/phonics/${language}/${category}/${encodeURIComponent(item.letter)}%20(${code}).MP3`}
function playChoiceAudio(position){if(locked)return;const choice=currentChoices[position];if(!choice)return;const audio=new Audio(audioPath(choice));audio.play().catch(()=>{$('feedback').textContent='Unable to play that balloon sound. Please try again.'})}
function dartTo(balloon){const stall=$('stall').getBoundingClientRect(),target=balloon.getBoundingClientRect(),startX=window.innerWidth/2,startY=window.innerHeight+36,dx=target.left+target.width/2-startX,dy=target.top+target.height/2-startY,angle=Math.atan2(dy,dx)*180/Math.PI,distance=Math.max(0,Math.hypot(dx,dy)-20),dart=$('dart');dart.style.left=`${startX-stall.left}px`;dart.style.top=`${startY-stall.top}px`;dart.style.setProperty('--dart-angle',`${angle}deg`);dart.style.setProperty('--dart-distance',`${distance}px`);dart.classList.remove('fly');void dart.offsetWidth;dart.classList.add('fly')}
function spinRoulette(){const wheel=$('roulette');wheel.classList.remove('spinning');void wheel.offsetWidth;wheel.classList.add('spinning');setTimeout(()=>wheel.classList.remove('spinning'),5000)}
function pop(balloon){if(locked)return;locked=true;const item=current(),selected=balloon.dataset.letter,isCorrect=String(selected).toUpperCase()===String(item.letter).toUpperCase();balloons.forEach(button=>button.disabled=true);handles.forEach(handle=>handle.disabled=true);dartTo(balloon);setTimeout(async()=>{balloon.classList.add('popped',isCorrect?'correct':'wrong');$('dart').classList.remove('fly');if(isCorrect)correct++;answers.push({selected_letter:selected,is_correct:isCorrect});$('feedback').textContent=isCorrect?'Wonderful! That balloon matches the letter.':'Nice try! The next round is ready.';await playEffect('balloonPop',true);spinRoulette();playEffect('rouletteSpin');setTimeout(()=>{index++;locked=false;render()},5120)},390)}
function showCompletion(score,total){$('finalScore').textContent=`${score} / ${total}`;document.body.classList.add('completion-view');$('complete').classList.add('show')}
async function finish(){balloons.forEach(balloon=>balloon.disabled=true);handles.forEach(handle=>handle.disabled=true);$('progress').textContent='Game complete';const duration=Math.round(performance.now()/1000);try{const res=await fetch('{% url "record_assessment_completion" %}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},body:JSON.stringify({material_id:material.id,activity_type:'letter_sound_correspondence',status:'completed',items_completed:allItems.length,scores:{answers,duration_seconds:duration}})});const result=await res.json();if(!res.ok||!result.success)throw new Error(result.error)}catch(error){console.error(error);$('feedback').textContent='Your score could not be saved. Please try again.';return}playCompletionTransition(()=>showCompletion(correct,allItems.length))}
function getCookie(name){for(const entry of document.cookie.split(';')){const value=entry.trim();if(value.startsWith(`${name}=`))return decodeURIComponent(value.slice(name.length+1))}return ''}
handles.forEach(handle=>handle.addEventListener('click',()=>playChoiceAudio(Number(handle.dataset.audioIndex))));
balloons.forEach(balloon=>balloon.addEventListener('click',()=>pop(balloon)));
$('finishButton').addEventListener('click',()=>location.href='{% url "assessment" %}');
if(completion.completed){correct=Number(completion.correct_items)||0;const total=Number(completion.total_items)||allItems.length;balloons.forEach(balloon=>balloon.disabled=true);handles.forEach(handle=>handle.disabled=true);showCompletion(correct,total)}else if(!allItems.length){$('feedback').textContent='This activity has no available reading sets.';balloons.forEach(balloon=>balloon.disabled=true);handles.forEach(handle=>handle.disabled=true)}else{render();readInstruction()}})();
</script></body></html>
