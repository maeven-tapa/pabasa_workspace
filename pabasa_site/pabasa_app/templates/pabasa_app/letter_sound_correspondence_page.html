    .canopy{top:calc(-1 * var(--booth-top));height:var(--canopy-height)}.roulette{width:min(540px,78vw,62dvh)}.instruction{margin-top:clamp(9px,1.8dvh,20px)}
    @media(max-width:700px){.roulette{width:min(440px,76vw,58dvh)}.stall{padding-top:clamp(24px,4.2dvh,40px)}.curtain{bottom:18px}.instruction{margin-top:10px}}
    @media(max-height:640px){:root{--booth-top:70px;--canopy-height:106px}.sign{padding:6px 13px}.sign h1{font-size:.86rem}.stall{padding-top:20px}.roulette{width:min(420px,62vw,54dvh)}.instruction{padding:6px 11px;font-size:.73rem}.feedback{margin:5px 0 0}.booth-side:after{display:none}}
  </style>
  <style>
    @font-face{font-family:"Carnevalee";src:url("{% static 'pabasa_app/font/Carnevalee Freakshow.ttf' %}") format("truetype");font-weight:400;font-style:normal;font-display:swap}
    :root{--wheel-size:min(540px,78vw,calc(100dvh - 285px))}
    .sign h1,.instruction,.feedback,.complete-card h2,.complete-card button{font-family:"Carnevalee",Georgia,serif}.sign h1{font-size:clamp(1.05rem,2.5vw,1.55rem);letter-spacing:.075em}.instruction{font-size:clamp(.92rem,2vw,1.15rem);letter-spacing:.025em;line-height:1.18}.feedback{font-family:"Carnevalee",Georgia,serif;font-size:clamp(.95rem,2vw,1.2rem);letter-spacing:.03em}
    .stall{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;justify-items:center;align-items:center;gap:clamp(4px,1dvh,10px);overflow:visible}.roulette{grid-row:1;width:var(--wheel-size);max-width:100%;max-height:100%;align-self:center}.instruction{grid-row:2;position:relative;margin:0;align-self:end}.feedback{grid-row:3;position:relative;height:auto;min-height:clamp(20px,2.8dvh,28px);margin:0 0 clamp(2px,.6dvh,6px);align-self:start}
    .booth-side:before{content:"✦\A❦\A✦";white-space:pre;position:absolute;inset:14px 0;display:grid;place-items:center;color:#f1c95f;font-family:Georgia,serif;font-size:clamp(1rem,2.4vw,1.7rem);line-height:2.7;text-shadow:0 1px #64202a,0 2px 4px #250c15}.booth-side:after{content:"";position:absolute;inset:8px;border:1px solid #f3d276;border-radius:45% 45% 0 0;box-shadow:inset 0 0 0 3px #7d202b,0 0 0 1px #4c1721}.booth-side{background:repeating-linear-gradient(135deg,#b52d32 0 10px,#fff0d6 10px 20px),linear-gradient(#9d252d,#661b27)}
    @media(max-width:700px){:root{--wheel-size:min(440px,76vw,calc(100dvh - 238px))}.instruction{width:min(470px,92%);font-size:clamp(.78rem,3.2vw,.98rem)}.booth-side:before{inset:10px 0;font-size:clamp(.85rem,4vw,1.15rem);line-height:2.35}.booth-side:after{inset:4px}}
    @media(max-height:640px){:root{--wheel-size:min(420px,62vw,calc(100dvh - 205px))}.instruction{font-size:.76rem;min-height:26px;display:flex;align-items:center;justify-content:center}.feedback{font-size:.78rem}.stall{gap:2px}}
  </style>
  <style>
    /* Keep the game board stable: wheel above, permanent instruction rail below. */
    :root{--wheel-size:min(540px,78vw,62dvh);--instruction-clearance:clamp(72px,11dvh,105px)}
    .stall{grid-template-rows:minmax(0,1fr) auto;padding-bottom:var(--instruction-clearance)}
    .roulette{grid-row:1;aspect-ratio:1/1;width:var(--wheel-size);height:auto;max-height:100%;min-width:0;min-height:0;align-self:center;justify-self:center;transform-origin:center center}
    .instruction{position:absolute;z-index:12;left:50%;bottom:clamp(35px,5.7dvh,60px);width:min(470px,calc(100% - clamp(44px,12vw,170px)));min-height:clamp(38px,5.5dvh,50px);margin:0;display:flex;align-items:center;justify-content:center;padding:7px 18px;transform:translateX(-50%);text-align:center;white-space:normal;overflow:visible}
    .feedback{grid-row:2;margin:0;min-height:20px;align-self:end}
    @media(max-width:700px){:root{--wheel-size:min(440px,76vw,58dvh);--instruction-clearance:clamp(64px,10dvh,86px)}.instruction{bottom:clamp(27px,4.6dvh,42px);width:calc(100% - 72px);min-height:34px;padding:6px 12px}}
    @media(max-height:640px){:root{--wheel-size:min(420px,62vw,54dvh);--instruction-clearance:58px}.instruction{bottom:23px;min-height:28px;padding:4px 10px}.feedback{display:none}}
  </style>
  <style>
    /* Instruction stays at the bottom of the screen, independent of booth height. */
    .instruction{position:fixed;z-index:40;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);margin:0}
    @media(max-width:700px){.instruction{bottom:max(9px,env(safe-area-inset-bottom));width:calc(100vw - 32px)}}
    @media(max-height:640px){.instruction{bottom:max(6px,env(safe-area-inset-bottom))}}
  </style>
  <style>
    /* One dimension drives both axes so the roulette cannot be stretched into an oval. */
    :root{--wheel-size:min(540px,78vw,calc(100dvh - 200px))}
    .roulette{inline-size:var(--wheel-size);block-size:var(--wheel-size);width:var(--wheel-size);height:var(--wheel-size);min-width:var(--wheel-size);min-height:var(--wheel-size);max-width:none;max-height:none;aspect-ratio:1/1;flex:none}
    @media(max-width:700px){:root{--wheel-size:min(440px,76vw,calc(100dvh - 178px))}.roulette{inline-size:var(--wheel-size);block-size:var(--wheel-size)}}
    @media(max-height:640px){:root{--wheel-size:min(420px,62vw,calc(100dvh - 158px))}}
  </style>
  <style>
    /* Keep the full circle inside the booth's inner stage, above its bottom rail. */
    :root{--wheel-size:min(520px,86vw,calc(100dvh - 178px))}
    .roulette{position:relative;top:clamp(7px,1.5dvh,12px);justify-self:center;align-self:center}
    @media(max-width:700px){:root{--wheel-size:min(470px,82vw,calc(100dvh - 152px))}.roulette{top:clamp(5px,1.2dvh,9px)}}
    @media(max-height:640px){:root{--wheel-size:min(420px,76vw,calc(100dvh - 138px))}.roulette{top:6px}}
  </style>
  <style>
    /* The roulette is sized from the actual inner stage, not the browser viewport. */
    .roulette-stage{position:absolute;z-index:5;top:clamp(46px,7.2dvh,62px);right:0;bottom:clamp(48px,7dvh,60px);left:0;display:grid;place-items:center;container-type:size;pointer-events:none}
    .roulette-stage .roulette{--wheel-size:min(86vw,100cqh);position:relative;top:0;inline-size:var(--wheel-size);block-size:var(--wheel-size);width:var(--wheel-size);height:var(--wheel-size);min-width:0;min-height:0;max-width:none;max-height:none;justify-self:center;align-self:center;pointer-events:auto}
    .instruction{bottom:max(2px,env(safe-area-inset-bottom))}
    @media(max-width:700px){.roulette-stage{top:clamp(35px,6dvh,48px);bottom:clamp(41px,6dvh,52px)}.roulette-stage .roulette{--wheel-size:min(82vw,100cqh)}.instruction{bottom:max(1px,env(safe-area-inset-bottom))}}
  </style>
</head>
<body><div class="stars"></div><main class="app"><header class="top"><a class="back" href="{% url 'assessment' %}"><i class="bi bi-arrow-left"></i> Back</a><div class="score" id="progress">Round 1 of 0</div></header><section class="sign"><h1>Pop the Sound Balloon!</h1><p>Listen, then pop the letter that makes the sound.</p></section><section class="stall" id="stall"><div class="canopy" aria-hidden="true"></div><div class="marquee" aria-hidden="true"></div><div class="booth-side left" aria-hidden="true"></div><div class="booth-side right" aria-hidden="true"></div><div class="curtain left" aria-hidden="true"></div><div class="curtain right" aria-hidden="true"></div><div class="wheel-pointer"></div><div class="roulette-stage"><div class="roulette" id="roulette"><button class="sound-button" id="soundButton" aria-label="Play the letter sound"><i class="bi bi-volume-up-fill"></i><small>LISTEN</small></button><button class="balloon b0" data-choice-index="0"></button><button class="balloon b1" data-choice-index="1"></button><button class="balloon b2" data-choice-index="2"></button><button class="balloon b3" data-choice-index="3"></button><button class="balloon b4" data-choice-index="4"></button></div></div><div class="dart" id="dart"></div><p class="instruction">Tap the golden speaker, then choose a balloon to pop.</p><p class="feedback" id="feedback" aria-live="polite"></p><div class="complete" id="complete"><div class="complete-card"><h2>🎪 Great game!</h2><p>You matched</p><strong id="finalScore">0 / 0</strong><button id="finishButton">Finish</button></div></div></section></main>
<script>
(()=>{'use strict';const material={{ letter_sound_correspondence_material_json|safe }};const allItems=Array.isArray(material.items)?material.items.filter(i=>i&&i.letter):[];let index=0,correct=0,locked=false,rotation=0;const answers=[];const $=id=>document.getElementById(id);const buttons=[...document.querySelectorAll('.balloon')];
function escapeText(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function current(){return allItems[index]||null}function choicesFor(item){const others=allItems.filter(x=>String(x.letter).toUpperCase()!==String(item.letter).toUpperCase()).sort((a,b)=>String(a.letter).localeCompare(String(b.letter))).slice(0,4);const choices=[item,...others];for(let i=choices.length-1;i>0;i--){const j=(index*11+i*7)% (i+1);[choices[i],choices[j]]=[choices[j],choices[i]]}return choices;}
function render(){const item=current();if(!item){finish();return}const choices=choicesFor(item);buttons.forEach((button,i)=>{button.className=`balloon b${i}`;button.disabled=false;button.dataset.letter=choices[i]?.letter||'';button.textContent=choices[i]?.letter||''});$('progress').textContent=`Round ${index+1} of ${allItems.length}`;$('feedback').textContent='';rotation+=360+(index%5)*72;$('roulette').style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{buttons.forEach(b=>b.style.transform=`translate(-50%,-50%) rotate(${-rotation}deg)`);$('soundButton').style.transform=`translate(-50%,-50%) rotate(${-rotation}deg)`},20);}
function audioPath(item){const lang=String(material.language).toLowerCase()==='english'?'english':'filipino';const code=lang==='english'?'E':'T';const vowels=['A','E','I','O','U'];const category=vowels.includes(String(item.letter).toUpperCase())?'vowels':'syllables';return `/static/pabasa_app/audio/phonics/${lang}/${category}/${encodeURIComponent(item.letter)}%20(${code}).MP3`;}
function playAudio(){const item=current();if(!item)return;const audio=new Audio(audioPath(item));audio.play().catch(()=>{$('feedback').textContent='Tap Listen again to hear the sound.'});}
function dartTo(button){const stall=$('stall').getBoundingClientRect(),source=$('soundButton').getBoundingClientRect(),target=button.getBoundingClientRect(),startX=source.left+source.width/2,startY=source.top+source.height/2,dx=target.left+target.width/2-startX,dy=target.top+target.height/2-startY,angle=Math.atan2(dy,dx)*180/Math.PI,distance=Math.max(0,Math.hypot(dx,dy)-20),dart=$('dart');dart.style.left=`${startX-stall.left}px`;dart.style.top=`${startY-stall.top}px`;dart.style.setProperty('--dart-angle',`${angle}deg`);dart.style.setProperty('--dart-distance',`${distance}px`);dart.classList.remove('fly');void dart.offsetWidth;dart.classList.add('fly');}
function pop(button){if(locked)return;locked=true;const item=current(),selected=button.dataset.letter,isCorrect=String(selected).toUpperCase()===String(item.letter).toUpperCase();buttons.forEach(b=>b.disabled=true);dartTo(button);setTimeout(()=>{button.classList.add('popped',isCorrect?'correct':'wrong');$('dart').classList.remove('fly');if(isCorrect)correct++;answers.push({selected_letter:selected,is_correct:isCorrect});$('feedback').textContent=isCorrect?'Wonderful! That is the matching letter!':'Nice try! Let’s spin to a new sound.';setTimeout(()=>{index++;locked=false;render()},900)},390)}
async function finish(){buttons.forEach(b=>b.disabled=true);$('progress').textContent='Game complete';const duration=Math.round(performance.now()/1000);try{const res=await fetch('{% url "record_assessment_completion" %}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},body:JSON.stringify({material_id:material.id,activity_type:'letter_sound_correspondence',status:'completed',items_completed:allItems.length,scores:{answers,duration_seconds:duration}})});const result=await res.json();if(!res.ok||!result.success)throw new Error(result.error)}catch(error){console.error(error);$('feedback').textContent='Your score could not be saved. Please try again.';return}$('finalScore').textContent=`${correct} / ${allItems.length}`;$('complete').classList.add('show')}
function getCookie(name){for(const entry of document.cookie.split(';')){const value=entry.trim();if(value.startsWith(`${name}=`))return decodeURIComponent(value.slice(name.length+1))}return ''}$('soundButton').addEventListener('click',playAudio);buttons.forEach(b=>b.addEventListener('click',()=>pop(b)));$('finishButton').addEventListener('click',()=>location.href='{% url "assessment" %}');if(!allItems.length){$('feedback').textContent='This activity has no available reading sets.';buttons.forEach(b=>b.disabled=true)}else render();})();
</script></body></html>
