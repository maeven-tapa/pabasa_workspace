{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letrang Aa</title><style>html,body{height:100%;overflow:hidden}body{margin:0;background:#e8f6f1;color:#164b5d;font-family:Arial,sans-serif}.page{height:100dvh;padding:8px 12px}.card{height:calc(100dvh - 42px);max-width:1000px;margin:6px auto;padding:clamp(10px,2vw,24px);overflow:hidden;background:#fffdf5;border-radius:28px;text-align:center}.back{font-weight:900;color:#164b5d}.head{display:flex;justify-content:space-between;text-align:left}.eyebrow{font-weight:900;color:#e46b58}.head h1{margin:3px 0;font-size:clamp(1.6rem,4vw,2.5rem)}.instruction{font-weight:800;font-size:1.15rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(720px,100%);margin:16px auto}.tile{border:3px solid #d4ebe1;border-radius:16px;padding:5px}.tile img{display:block;width:100%;height:clamp(64px,15vh,160px);object-fit:contain}.focus{height:calc(100% - 125px);display:flex;flex-direction:column;align-items:center;justify-content:center}.focus img{width:min(70vw,390px);height:min(48vh,330px);object-fit:contain}.word{font-size:2rem;font-weight:900}.status{min-height:28px;font-weight:900}.action,.choice{border:0;border-radius:18px;padding:13px 30px;background:#e6a33a;color:#fff;font:900 1.1rem Arial;cursor:pointer;box-shadow:0 5px #b77b1b}.actions{display:flex;gap:14px}.choice{min-width:130px;background:#2d8b78;font-size:1.8rem}</style></head><body><div class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik</a><main class="card" id="app"></main></div>{{ lesson_5_data|json_script:"lesson-five-data" }}<script>
const d=JSON.parse(document.getElementById('lesson-five-data').textContent),items=d.items,total=items.length,p=d.progress,base="{% static 'pabasa_app/images/letrang_a/' %}",url="{{ lesson_5_progress_url }}",token=()=>document.cookie.match(/csrftoken=([^;]+)/)?.[1]||'';let i=Math.min(total,Number(p.current_index)||0),score=Number(p.correct_items)||0,phase='preview',tries=0,listens=0,answers=p.answers||[];const app=document.getElementById('app');async function save(done=false){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':token()},body:JSON.stringify({activity_key:'lesson-5-gawain-1',total_items:total,current_index:i,completed_items:i,correct_items:score,activity_completed:done,state:{answers}})});if(!r.ok)throw Error('save failed')}function grid(){return '<div class="grid">'+items.map(x=>'<div class="tile"><img src="'+base+x.image+'" alt="'+x.word+'"></div>').join('')+'</div>'}function render(){if(phase==='preview'){app.innerHTML='<h1>Letrang Aa</h1><p class="instruction">Ikahon ang mga larawang nagsisimula sa tunog /a/.</p>'+grid()+'<button class="action" id="start">MAGSIMULA</button>';start.onclick=()=>{phase='identify';render()};return}if(i>=total){app.innerHTML='<h1>Magaling!</h1>'+grid()+'<button class="action" id="finish">TAPUSIN</button>';finish.onclick=async()=>{await save(true);location.href="{% url 'assessment' %}"};return}const x=items[i];let controls=phase==='identify'?'<button class="action" id="identify">Basahin ngayon</button><button class="action" id="aloud" hidden>READ ALOUD</button>':'<div class="actions"><button class="choice" data-v="true">OO</button><button class="choice" data-v="false">HINDI</button></div>';app.innerHTML='<div class="head"><div><div class="eyebrow">LESSON 5 · GAWAIN 1</div><h1>Letrang Aa</h1></div><b>'+(i+1)+' / '+total+'</b></div><p class="instruction">Ikahon ang mga larawang nagsisimula sa tunog /a/.</p><section class="focus"><img src="'+base+x.image+'" alt="'+x.word+'"><div class="word">'+(phase==='identify'?x.word:'')+'</div><div class="status" id="status">'+(phase==='identify'?'Basahin ang larawan.':'Ikahon?')+'</div>'+controls+'</section>';if(phase==='identify'){identify.onclick=()=>{tries++;if(tries<3)status.textContent='Subukan muli.';else{aloud.hidden=false;status.textContent='Pakinggan ang tamang salita.'}};aloud.onclick=()=>{listens++;speechSynthesis?.speak(new SpeechSynthesisUtterance(x.word));if(listens>=3){phase='identify-again';render()}}}else if(phase==='identify-again'){identify.textContent='READ NOW';identify.onclick=()=>{phase='classify';render()}}else document.querySelectorAll('.choice').forEach(b=>b.onclick=async()=>{if(b.dataset.v===String(x.starts_a)){answers[i]=b.dataset.v;i++;score++;tries=0;listens=0;phase='identify';await save();render()}else if(++tries>=3){tries=0;phase='identify';render()}else status.textContent='Subukan muli.'})}render();</script></body></html>
