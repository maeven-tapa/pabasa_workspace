{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ prescribed_activity_data.title }}</title><link rel="stylesheet" href="{% static 'pabasa_app/sound_detective.css' %}"><style>body{background:linear-gradient(135deg,#0c5570,#78d7d0);font-family:Segoe UI,sans-serif;color:#164b5d}.page{min-height:100vh;padding:12px}.back{color:#fff;font-weight:800}.card{min-height:calc(100vh - 70px);max-width:900px;margin:8px auto;background:#f8ffff;border-radius:24px;padding:clamp(14px,3vw,30px);text-align:center}.head{display:flex;justify-content:space-between;text-align:left}.instruction{font-weight:800;font-size:1.2rem}.focus{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8vh}.focus img{width:min(50vw,340px);height:min(45vh,290px);object-fit:contain}.word{font-size:clamp(1.8rem,5vw,3rem);font-weight:900}.actions button{font-size:2rem;min-width:110px;min-height:76px;margin:5px;border:0;border-radius:14px;background:#ef7180;color:#fff;font-weight:900}.good{background:#43b982!important}</style></head><body><div class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><main class="card"><div class="head"><div><div>Session 2 · Lesson 4 · Gawain 2</div><h1>{{ prescribed_activity_data.title }}</h1></div><strong id="progress"></strong></div><p class="instruction">{{ prescribed_activity_data.instruction }}</p><section class="focus"><img id="picture" alt=""><div id="word" class="word"></div><div id="prompt">Piliin ang unang tunog.</div><div id="actions" class="actions"></div></section></main></div>{{ prescribed_activity_data|json_script:"activity-data" }}<script>(async()=>{const d=JSON.parse(document.getElementById('activity-data').textContent),items=d.items,p=d.progress||{},$=x=>document.getElementById(x);let i=Number(p.completed_items)||0;const csrf=()=>document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'';async function save(done=false){await fetch(d.progress_url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({total_items:items.length,current_index:i,completed_items:i,correct_items:i,activity_completed:done})})}function render(){if(i>=items.length){$('word').textContent='Magaling! Natapos mo ang gawain!';$('picture').hidden=true;$('actions').innerHTML='<a href="{% url 'assessment' %}">Bumalik sa mga gawain</a>';return}const x=items[i];$('picture').src=x.image_url;$('picture').alt=x.alt_text||x.word;$('word').textContent=x.word;$('progress').textContent=`${i+1} / ${items.length}`;$('actions').innerHTML=x.choices.map(v=>`<button data-v="${v}">${v}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{if(b.dataset.v!==x.answer)return;b.classList.add('good');i++;await save(i===items.length);render()})}render()})()</script></body></html>
