{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ prescribed_activity_data.title }}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"><style>
@font-face{font-family:'Fredoka One';src:url("{% static 'pabasa_app/font/fredoka-one.one-regular.ttf' %}") format('truetype');font-display:swap}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100dvh;background:#bce8eb url("{% static 'pabasa_app/prescribed/PRESCRIBED-BG.jpg' %}") center/cover no-repeat fixed;color:#174b60;font-family:'Nunito',sans-serif}.page{min-height:100dvh;display:grid;place-items:center;padding:clamp(14px,2.5vw,30px)}.card{position:relative;width:min(100%,850px);min-height:min(690px,calc(100dvh - 28px));padding:clamp(18px,2.4vw,28px);border:1px solid rgba(255,255,255,.88);border-radius:28px;background:rgba(255,253,247,.94);box-shadow:0 18px 48px rgba(20,68,82,.26);display:flex;flex-direction:column;gap:12px;overflow:hidden}.activity-topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.back{display:inline-flex;align-items:center;min-height:34px;color:#1c6d81;font-family:'Nunito',sans-serif;font-size:.93rem;font-weight:900;text-decoration:none;transition:color .18s,transform .18s}.back:hover{color:#e26457;transform:translateX(-2px)}.progress-label{color:#437787;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:800}.head{display:flex;align-items:end;justify-content:space-between;gap:18px;padding-bottom:2px;text-align:left}.eyebrow{margin-bottom:3px;color:#e36f5d;font-family:'Fredoka One';font-size:clamp(.72rem,1.6vw,.9rem);letter-spacing:.055em}.head h1{margin:0;color:#195a70;font-family:'Fredoka One';font-size:clamp(1.65rem,3.2vw,2.35rem);font-weight:400;line-height:1.05}.progress-number{flex:none;min-width:50px;padding:7px 10px;border-radius:12px;background:#e8f5f4;color:#287287;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;text-align:center}.instruction{margin:0;padding:12px 20px;border:1px solid #bee1e0;border-radius:17px;background:#eaf8f5;color:#286473;font-family:'Nunito',sans-serif;font-size:clamp(1rem,1.8vw,1.13rem);font-weight:800;line-height:1.4;text-align:center}.focus{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0;text-align:center}.image-card{width:min(100%,360px);height:clamp(170px,27dvh,250px);padding:12px;border:1px solid #c9e4e5;border-radius:22px;background:#fff;box-shadow:0 8px 20px rgba(48,115,130,.12);display:grid;place-items:center;overflow:hidden}.image-card img{display:block!important;width:100%!important;height:100%!important;max-width:100%;max-height:100%;min-width:0;min-height:0;object-fit:contain}.word{min-height:1.25em;color:#1d5f72;font-family:'Fredoka One';font-size:clamp(1.8rem,4vw,2.75rem);font-weight:400;line-height:1.12}.prompt{min-height:1.4em;color:#286473;font-family:'Nunito',sans-serif;font-size:clamp(1rem,1.8vw,1.14rem);font-weight:900;line-height:1.3}.actions{display:flex;justify-content:center;gap:14px;min-height:70px}.actions button,.actions a{min-width:132px;min-height:70px;padding:10px 24px;border:0;border-radius:18px;background:#ec7a75;color:#fff;box-shadow:0 6px 0 #c8595c;cursor:pointer;font-family:'Fredoka One';font-size:2rem;font-weight:400;line-height:1;text-decoration:none;transition:transform .16s,box-shadow .16s,filter .16s}.actions a{display:inline-flex;align-items:center;justify-content:center;min-width:220px;background:#2d9b91;box-shadow:0 5px 0 #1b716b;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900}.actions button+button{margin-left:14px}.actions button:hover,.actions a:hover{filter:brightness(1.06);transform:translateY(-2px)}.actions button:active,.actions a:active{transform:translateY(3px);box-shadow:0 2px 0 #c8595c}.actions .good{background:#4abf86!important;box-shadow:0 6px 0 #27865a}.actions button:focus-visible,.actions a:focus-visible,.back:focus-visible{outline:4px solid #f0bd5c;outline-offset:3px}@media(max-height:700px) and (min-width:601px){.card{min-height:calc(100dvh - 24px);gap:8px;padding:16px 24px}.image-card{height:150px}.instruction{padding:8px 16px}.actions button{min-height:58px}}@media(max-width:600px){body{background-attachment:scroll}.page{display:block;padding:10px}.card{min-height:calc(100dvh - 20px);border-radius:23px;padding:16px;gap:11px}.activity-topbar{gap:8px}.back{font-size:.82rem}.progress-label{font-size:.76rem}.head{align-items:center}.image-card{width:min(100%,320px);height:clamp(160px,29dvh,220px)}.actions{gap:10px}.actions button{min-width:118px}.actions button+button{margin-left:0}}
</style></head><body><div class="page"><main class="card"><div class="activity-topbar"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><div class="progress-label">Pag-unlad</div></div><div class="head"><div><div class="eyebrow">SESSION 2 · LESSON 4 · GAWAIN 2</div><h1>{{ prescribed_activity_data.title }}</h1></div><strong id="progress" class="progress-number" aria-label="Pag-unlad"></strong></div><p id="instruction" class="instruction">{{ prescribed_activity_data.instruction }}</p><section class="focus"><div class="image-card"><img id="picture" alt=""></div><div id="word" class="word"></div><div id="prompt" class="prompt">Piliin ang unang tunog.</div><div id="actions" class="actions"></div></section></main></div>{{ prescribed_activity_data|json_script:"activity-data" }}<script type="text/plain" id="legacy-activity-script">(async()=>{const d=JSON.parse(document.getElementById('activity-data').textContent),items=d.items,p=d.progress||{},$=x=>document.getElementById(x);let i=Number(p.completed_items)||0;const csrf=()=>document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'';async function save(done=false){await fetch(d.progress_url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({total_items:items.length,current_index:i,completed_items:i,correct_items:i,activity_completed:done})})}function render(){if(i>=items.length){$('word').textContent='Magaling! Natapos mo ang gawain!';$('picture').hidden=true;$('actions').innerHTML='<a href="{% url 'assessment' %}">Bumalik sa mga gawain</a>';return}const x=items[i];$('picture').src=x.image_url;$('picture').alt=x.alt_text||x.word;$('word').textContent=x.word;$('progress').textContent=`${i+1} / ${items.length}`;$('actions').innerHTML=x.choices.map(v=>`<button data-v="${v}">${v}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{if(b.dataset.v!==x.answer)return;b.classList.add('good');i++;await save(i===items.length);render()})}render()})()</script><script>(function(){const d=JSON.parse(document.getElementById('activity-data').textContent),items=d.items,$=id=>document.getElementById(id),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||''),norm=v=>String(v||'').toLowerCase().replace(/[^a-z]/g,''),oral='Tingnan ang larawan. Sabihin ang pangalan nito.',sound='Ano ang unang tunog ng salita? Piliin ang tamang sagot.';let i=Number(d.progress?.completed_items)||0,phase='say',busy=false,stream,audio,version=0;const stop=()=>{version++;stream?.getTracks().forEach(t=>t.stop());if(audio){audio.pause();audio=null}};const note=(text,kind)=>{let e=$('feedback');if(!e){e=document.createElement('p');e.id='feedback';$('actions').after(e)}e.className='feedback '+(kind||'');e.textContent=text||''};async function tts(text){const n=++version,f=new FormData();f.append('target_text',text);f.append('language','Filipino');f.append('mode','word');f.append('prescribed_activity_key',d.activity_key);const r=await fetch('{% url "reading_read_aloud_api" %}',{method:'POST',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json();if(n!==version)return false;audio=new Audio('data:'+(j.mime_type||'audio/mpeg')+';base64,'+j.audio_content);await audio.play();await new Promise(ok=>audio.onended=ok);return n===version}async function save(action,value){const body={action:action,item_index:i};if(action==='oral')body.heard=value;else body.choice=value;const r=await fetch(d.progress_url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(body)}),j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'Hindi na-save ang sagot.');return j}function go(){stop();note('');if(i>=items.length){$('instruction').textContent='Magaling! Natapos mo ang gawain!';$('actions').innerHTML='<a href="{% url 'assessment' %}">Bumalik sa mga gawain</a>';return}const x=items[i];$('picture').src=x.image_url;$('picture').alt=x.alt_text||x.word;$('progress').textContent=(i+1)+' / '+items.length;$('word').hidden=phase==='say';$('prompt').hidden=phase==='say';$('instruction').textContent=phase==='say'?oral:sound;if(phase==='say'){$('actions').innerHTML='<button id="oral" class="oral-button" disabled aria-busy="true">Sabihin ngayon</button>';ready('say')}else{$('word').textContent=x.word;$('actions').innerHTML=x.choices.map(v=>'<button data-v="'+v+'" disabled>'+v+'</button>').join('');ready('sound')}}async function ready(p){try{await tts($('instruction').textContent);if(p!==phase)return;const bs=$('actions').querySelectorAll('button');bs.forEach(b=>{b.disabled=false;b.removeAttribute('aria-busy')});if(p==='say')$('oral').onclick=record;else bs.forEach(b=>b.onclick=()=>answer(b))}catch(e){note('Hindi available ang audio. Maaari nang magpatuloy.','bad');const bs=$('actions').querySelectorAll('button');bs.forEach(b=>b.disabled=false);if(p==='say')$('oral').onclick=record;else bs.forEach(b=>b.onclick=()=>answer(b))}}async function record(){if(busy)return;busy=true;const b=$('oral');try{b.disabled=true;b.textContent='Nakikinig...';stream=await navigator.mediaDevices.getUserMedia({audio:true});const c=[],r=new MediaRecorder(stream);r.ondataavailable=e=>e.data.size&&c.push(e.data);const blob=await new Promise(ok=>{r.onstop=()=>ok(new Blob(c,{type:r.mimeType||'audio/webm'}));r.start();setTimeout(()=>r.state==='recording'&&r.stop(),3500)});stream.getTracks().forEach(t=>t.stop());const f=new FormData();f.append('audio',blob,'oral.webm');f.append('target_text',items[i].word);f.append('language','Filipino');f.append('mode','reading');const q=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',headers:{'X-CSRFToken':csrf()},body:f}),j=await q.json();if(q.ok&&j.success&&norm(j.transcript).includes(norm(items[i].word))){const saved=await save('oral',j.transcript);if(!saved.accepted)throw Error('Hindi pa. Subukan muli.');note('Magaling!','good');await tts('Magaling!');phase='sound';go()}else{const saved=await save('oral',j.transcript||'');note('Hindi pa. Subukan muli.','bad');await tts('Hindi pa. Subukan muli.');b.disabled=false;if(Number(saved.progress?.state?.oral_attempts||0)>=3){b.textContent='Pakinggan';b.onclick=listen}else{b.textContent='Sabihin ngayon';b.onclick=record}}}catch(e){note('Hindi nakuha ang boses. Subukan muli.','bad');b.disabled=false;b.textContent='Sabihin ngayon';b.onclick=record}finally{busy=false}}async function listen(){if(busy)return;busy=true;const b=$('oral');try{b.disabled=true;b.textContent='Pinakikinggan...';await tts(items[i].word);b.disabled=false;b.textContent='Sabihin ngayon';b.onclick=record}catch(e){note(e.message||'Hindi available ang audio.','bad');b.disabled=false;b.textContent='Pakinggan';b.onclick=listen}finally{busy=false}}async function answer(b){const ok=b.dataset.v===items[i].answer;if(!ok){note('Hindi pa. Subukan muli.','bad');setTimeout(()=>$('actions').querySelectorAll('button').forEach(x=>x.disabled=false),500);return}busy=true;const saved=await save('choose',b.dataset.v);if(!saved.accepted){busy=false;note('Hindi pa. Subukan muli.','bad');$('actions').querySelectorAll('button').forEach(x=>x.disabled=false);return}b.classList.add('good');note('Magaling!','good');await tts('Magaling!');i++;phase='say';busy=false;go()}addEventListener('pagehide',stop);go()})()</script></body></html>
