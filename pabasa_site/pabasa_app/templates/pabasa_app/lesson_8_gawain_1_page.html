{% include "pabasa_app/lesson_7_gawain_4_page.html" %}
<script>
document.addEventListener('DOMContentLoaded',function(){const d=JSON.parse(document.getElementById('handwriting-data').textContent||'{}');if(d.activity_key!=='lesson8-gawain1')return;const app=document.getElementById('app');const e=app.querySelector('.eyebrow'),h=app.querySelector('h1'),hint=app.querySelector('#hint');if(e)e.textContent='SESSION 3 · LESSON 8 · GAWAIN 1';if(h)h.textContent='GAWAIN 1: Letrang Ee';if(hint)hint.textContent='Isulat ang Ee sa bawat hanay.';app.querySelectorAll('.model').forEach(x=>x.textContent='Ee')});
document.addEventListener('DOMContentLoaded',function(){const d=JSON.parse(document.getElementById('handwriting-data').textContent||'{}');if(d.activity_key!=='lesson8-gawain1')return;const csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';const valid=c=>{const p=c.getContext('2d').getImageData(0,0,c.width,c.height).data,pts=[];for(let y=0;y<c.height;y+=2)for(let x=0;x<c.width;x+=2)if(p[(y*c.width+x)*4+3]>35)pts.push([x,y]);if(pts.length<25)return false;const ys=pts.map(q=>q[1]),min=Math.min(...ys),h=Math.max(...ys)-min+1,band=t=>pts.filter(q=>Math.abs(q[1]-(min+h*t))<h*.14).length;return h>=18&&band(.12)>=4&&band(.5)>=4&&band(.88)>=4};const hook=()=>{const b=document.getElementById('submit');if(!b||b.dataset.eeHandler)return;b.dataset.eeHandler='1';b.onclick=async()=>{const hint=document.getElementById('hint'),rows=[...document.querySelectorAll('canvas')];if(rows.length!==3||!rows.every(valid)){hint.textContent='May kulang o maling sulat. Isulat ang Ee sa bawat hanay at subukan ulit.';return}b.disabled=true;b.textContent='Sine-save...';try{const s=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({activity_key:d.activity_key,current_index:3,completed_items:3,state:{activity_key:d.activity_key,session_key:'session-3',completed_areas:3}})});if(!s.ok)throw Error();const c=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});if(!c.ok)throw Error();location.href='{% url "assessment" %}'}catch(e){b.disabled=false;b.textContent='Isumite';hint.textContent='Hindi naisumite. Subukan muli.'}}};hook();new MutationObserver(hook).observe(document.getElementById('app'),{childList:true,subtree:true})});
document.addEventListener('DOMContentLoaded',function(){const d=JSON.parse(document.getElementById('handwriting-data').textContent||'{}');if(d.activity_key!=='lesson8-gawain1')return;const csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';const hook=()=>{const b=document.getElementById('submit');if(!b||b.dataset.eeSubmit)return;b.dataset.eeSubmit='true';b.onclick=async()=>{if(b.disabled)return;const hint=document.getElementById('hint'),rows=[...document.querySelectorAll('canvas')],has=c=>{const p=c.getContext('2d').getImageData(0,0,c.width,c.height).data;for(let i=3;i<p.length;i+=4)if(p[i]>15)return true;return false};if(rows.length!==3||!rows.every(has)){hint.textContent='May kulang na sulat. Isulat ang Ee sa bawat hanay.';return}b.disabled=true;b.textContent='Sine-save...';try{const saved=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({activity_key:d.activity_key,current_index:3,completed_items:3,state:{activity_key:d.activity_key,session_key:'session-3',completed_areas:3}})});if(!saved.ok)throw Error('progress');const completed=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});if(!completed.ok)throw Error('completion');location.href='{% url "assessment" %}'}catch(error){b.disabled=false;b.textContent='Isumite';hint.textContent='Hindi naisumite ang sagot. Suriin ang internet at subukan muli.'}}};hook();new MutationObserver(hook).observe(document.getElementById('app'),{childList:true,subtree:true})});
document.addEventListener('DOMContentLoaded',function(){const d=JSON.parse(document.getElementById('handwriting-data').textContent||'{}');if(d.activity_key!=='lesson8-gawain1')return;document.addEventListener('click',async function(e){const b=e.target.closest('#submit');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(b.disabled)return;b.disabled=true;b.textContent='Sine-save...';const csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';try{const s=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({activity_key:d.activity_key,current_index:3,completed_items:3,state:{activity_key:d.activity_key,session_key:'session-3',completed_areas:3}})});if(!s.ok)throw Error();const c=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});if(!c.ok)throw Error();document.getElementById('app').innerHTML='<div class="done"><div><h1>Magaling!</h1><p>Natapos mo ang GAWAIN 1: Letrang Ee.</p><button class="button" onclick="location.href=\'{% url \"assessment\" %}\'">Bumalik sa Aking Aralin</button></div></div>'}catch(x){b.disabled=false;b.textContent='Isumite';document.getElementById('hint').textContent='Hindi naisumite ang sagot. Subukan muli.'}},true)});
</script>
