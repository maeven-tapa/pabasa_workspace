{% load static %}
<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gawain 4B</title>
  <style>
    html,body{height:100%;margin:0;overflow:hidden}
    body{background:#e1f5f7;color:#16465d;font-family:Nunito,"Segoe UI",sans-serif}
    .page{padding:10px}
    .back{padding:8px;background:#fff;border:2px solid #bfdde4;border-radius:12px;color:#16465d;font-weight:900;text-decoration:none}
    .card{height:calc(100dvh - 70px);max-width:980px;margin:8px auto;background:#fffdf7;border-radius:24px;padding:12px;box-sizing:border-box;text-align:center;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
    h1{font-size:clamp(1.5rem,4vw,2.4rem)}
    .instruction,.status,.progress{font-weight:900}
    .sound-i{color:#d26a2e;font-weight:1000}
    .sound-o{color:#287fbd;font-weight:1000}
    .reading img,.item img{width:min(280px,55vw);height:min(235px,30vh);object-fit:contain;border:3px solid #dce8ed;border-radius:18px;background:#fff}
    .reading-actions{display:flex;justify-content:center;align-items:stretch;gap:12px;width:min(520px,100%);margin:0 auto;position:relative;flex-wrap:nowrap}
    .reading-actions .button{flex:1 1 0;min-height:56px;padding:0 18px;border:0;border-radius:14px;background:#2b83bd;color:#fff;font-weight:900;cursor:pointer;transition:transform .16s ease,background .2s ease,box-shadow .2s ease}
    .button{min-height:48px;padding:0 30px;border:0;border-radius:13px;background:#2b83bd;color:#fff;font-weight:900;cursor:pointer;transition:transform .16s ease,background .2s ease,box-shadow .2s ease}
    .button:hover{background:#2475aa;transform:translateY(-2px)}
    .button:active{transform:translateY(1px)}
    .button.is-listening,.button:disabled{background:#a7adb3;color:#f5f7f8;box-shadow:0 0 0 5px #d9dde1;cursor:wait}
    .button.is-listening{animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{50%{box-shadow:0 0 0 10px #f8dfb000}}
    .items{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:760px}
    .item{padding:8px;border:2px solid #dce8ed;border-radius:15px;background:#fff}
    .item.is-disabled{opacity:.5;filter:grayscale(1)}
    .item img{width:100%;height:clamp(95px,15vh,145px);border:0}
    .item input{width:52px;height:40px;font-size:1.6rem;text-align:center;font-weight:900;border:2px solid #bfdde4;border-radius:9px}
    .item input:disabled{background:#d9dde1;color:#77818a;cursor:not-allowed}
    .done{font-weight:900;color:#26784e;font-size:clamp(1.8rem,4vw,3rem);line-height:1.2}
  </style>
  {% if shape_read_activity_data.activity_key == 'lesson7-gawain4b' %}
    <link rel="stylesheet" href="{% static 'pabasa_app/css/lesson_7_gawain_4b.css' %}?v=20260918-1">
  {% endif %}
</head>
<body class="{% if shape_read_activity_data.activity_key == 'lesson7-gawain4b' %}lesson7-gawain4b-page{% endif %}">
  <main class="page">
    <a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a>
    <section id="app" class="card"></section>
  </main>
  {{ shape_read_activity_data|json_script:"shape-read-data" }}
  <script>
    (()=>{
      const d=JSON.parse(document.getElementById('shape-read-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';
      const wordAudioFiles={orasan:'orasan.mp3',ilog:'ilog.mp3',ibon:'ibon.mp3',okra:'okra.mp3',oso:'oso.mp3',ilaw:'ilaw.mp3'},wordAudioBase='/static/pabasa_app/prescribed/audio/SESSION%203/LESSON%207/GAWAIN%204B/';
      let state=Object.assign({phase:'oral',current_reading_item:0,completed_reading_items:[],read_attempts:0,listen_attempts:0,answers:[null,null,null,null,null,null]},d.progress?.state||{});
      let audioBusy=false,introPlayed=false,part2IntroPlayed=false;
      const PART2_INSTRUCTION='I-type ang i kung ang larawan ay nagsisimula sa titik /i/. I-type ang o kung ang larawan ay nagsisimula sa titik /o/.';
      const PART2_INSTRUCTION_AUDIO='ee-type ang i kung ang larawan ay nagsisimula sa titik /i/. ee-type ang o kung ang larawan ay nagsisimula sa titik /o/.';
      const PART2_WRONG='May mali. Tingnan muli ang mga larawan at subukan ulit.';
      const requestPart2Audio=text=>fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8','X-CSRFToken':csrf()},body:new URLSearchParams({target_text:text,language:'Filipino',mode:'reading',prescribed_activity_key:'lesson7-gawain4b'})}).then(response=>response.ok?response.json():null).then(result=>new Promise(resolve=>{if(!result?.success||!result.audio_content){resolve();return}const audio=new Audio('data:'+(result.mime_type||'audio/mpeg')+';base64,'+result.audio_content);audio.onended=resolve;audio.onerror=resolve;audio.play().catch(resolve)})).catch(error=>console.error('Lesson 7 Gawain 4B Part 2 narration failed',error));
      const setPart2ControlsDisabled=disabled=>{app.querySelectorAll('.item input,#submit').forEach(control=>{control.disabled=disabled;control.classList.toggle('is-disabled',disabled);control.closest('.item')?.classList.toggle('is-disabled',disabled);})};
      const setupPart2Narration=()=>{const submit=document.getElementById('submit');if(!submit)return;const originalSubmit=submit.onclick;submit.onclick=async()=>{if(submit.disabled)return;setPart2ControlsDisabled(true);await originalSubmit();const status=document.getElementById('status');if(status?.textContent===PART2_WRONG){setPart2ControlsDisabled(true);await requestPart2Audio(PART2_WRONG);setPart2ControlsDisabled(false)}else{setPart2ControlsDisabled(false)}};if(!part2IntroPlayed){part2IntroPlayed=true;setPart2ControlsDisabled(true);requestPart2Audio(PART2_INSTRUCTION_AUDIO).then(()=>setPart2ControlsDisabled(false))}};
      async function save(){await fetch(d.progress_url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state})})}
      function formatPart2Instruction(){const instruction=app.querySelector('.instruction');if(instruction)instruction.innerHTML=instruction.innerHTML.replace('. I-type ang ','.<br>I-type ang ')}
      function render(){if(d.progress?.activity_completed){app.innerHTML='<div class="done">Magaling! Tama ang pagkakapili mo.</div>';return}if(state.phase!=='written'){oral();return}written();formatPart2Instruction();setupPart2Narration()}
      function oral(){const i=state.current_reading_item,x=d.items[i];app.innerHTML='<h1>GAWAIN 4B: Letrang Oo</h1><p class="instruction">Tingnan ang larawan at sabihin ang salita.</p><div class="reading"><img src="'+x.image_url+'" alt="Larawan"></div><p class="progress">Larawan '+(i+1)+' / 6</p><p id="status" class="status">Sabihin ang salita.</p><button class="button" id="read">Sabihin ang salita</button>';if(state.read_attempts>=3){read.textContent='Pakinggan';read.onclick=async()=>{state.listen_attempts++;read.disabled=true;read.textContent='Pakinggan…';const u=new SpeechSynthesisUtterance(x.word);u.lang='fil-PH';u.onend=async()=>{if(state.listen_attempts>=3){state.read_attempts=0;state.listen_attempts=0;await save();read.disabled=false;read.textContent='Sabihin ang salita';read.onclick=()=>listen(x)}else{read.disabled=false;read.textContent='Pakinggan';await save()}};speechSynthesis.cancel();speechSynthesis.speak(u)}}else read.onclick=()=>listen(x)}
      function listen(x){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){state.phase='written';save();render();return}read.disabled=true;read.classList.add('is-listening');read.textContent='Nakikinig…';const r=new R();r.lang='fil-PH';r.onresult=async e=>{const ok=String(e.results[0][0].transcript).toLowerCase().includes(x.word);if(ok){state.completed_reading_items.push(state.current_reading_item);state.current_reading_item++;state.read_attempts=0;if(state.current_reading_item===6)state.phase='written';await save();render()}else{state.read_attempts++;const needsListen=state.read_attempts>=3;document.getElementById('status').textContent=needsListen?'Pakinggan ang salita.':'Hindi iyon ang tamang pangalan. Subukan muli.';read.disabled=false;read.classList.remove('is-listening');read.textContent=needsListen?'Pakinggan':'Subukan muli';if(needsListen)read.onclick=async()=>{state.listen_attempts++;read.disabled=true;read.textContent='Pakinggan…';const u=new SpeechSynthesisUtterance(x.word);u.lang='fil-PH';u.onend=async()=>{if(state.listen_attempts>=3){state.read_attempts=0;state.listen_attempts=0;await save();read.disabled=false;read.textContent='Sabihin ang salita';read.onclick=()=>listen(x)}else{read.disabled=false;read.textContent='Pakinggan';await save()}};speechSynthesis.cancel();speechSynthesis.speak(u)}}};r.onerror=()=>{state.read_attempts++;document.getElementById('status').textContent='Hindi narinig. Subukan muli.';read.disabled=false;read.classList.remove('is-listening');read.textContent=state.read_attempts>=3?'Pakinggan':'Subukan muli';if(state.read_attempts>=3)read.onclick=async()=>{state.listen_attempts++;read.disabled=true;read.textContent='Pakinggan…';const u=new SpeechSynthesisUtterance(x.word);u.lang='fil-PH';u.onend=async()=>{if(state.listen_attempts>=3){state.read_attempts=0;state.listen_attempts=0;await save();read.disabled=false;read.textContent='Sabihin ang salita';read.onclick=()=>listen(x)}else{read.disabled=false;read.textContent='Pakinggan';await save()}};speechSynthesis.cancel();speechSynthesis.speak(u)}};r.start()}
      function written(){app.innerHTML='<h1>GAWAIN 4B: Letrang Oo</h1><p class="instruction">I-type ang <span class="sound-i">i</span> kung ang larawan ay nagsisimula sa titik <span class="sound-i">/i/</span>. I-type ang <span class="sound-o">o</span> kung ang larawan ay nagsisimula sa titik <span class="sound-o">/o/</span>.</p><div class="items">'+d.items.map((x,i)=>'<label class="item"><img src="'+x.image_url+'" alt="Larawan"><input maxlength="1" data-i="'+i+'" value="'+(state.answers[i]||'')+'"></label>').join('')+'</div><p id="status" class="status">Isulat ang i o o sa bawat larawan.</p><button class="button" id="submit">ISUMITE</button>';document.querySelectorAll('input').forEach(q=>q.oninput=()=>{state.answers[+q.dataset.i]=q.value.toLowerCase().replace(/[^io]/g,'');save()});submit.onclick=async()=>{const r=await fetch(d.completion_url,{method:'POST',headers:{'X-CSRFToken':csrf()}});if(r.ok){d.progress.activity_completed=true;render()}else{state.answers=[null,null,null,null,null,null];await save();render();document.getElementById('status').textContent='May mali. Tingnan muli ang mga larawan at subukan ulit.'}}}
      function oral(){const i=state.current_reading_item,x=d.items[i],R=window.SpeechRecognition||window.webkitSpeechRecognition;app.innerHTML='<h1>GAWAIN 4B: Letrang Oo</h1><p class="instruction">Tingnan ang larawang nasa kahon. Ano ito?</p><div class="reading"><img src="'+x.image_url+'" alt="Larawan"></div><p class="progress">Larawan '+(i+1)+' / 6</p><p id="status" class="status">Sabihin ang salita.</p><div class="reading-actions"><button class="button" id="read" type="button">Sabihin ang salita</button><button class="button" id="listen" type="button">Pakinggan</button></div>';const read=document.getElementById('read'),listenButton=document.getElementById('listen'),buttons=[read,listenButton],setDisabled=disabled=>buttons.forEach(button=>{button.disabled=disabled}),requestAudio=text=>fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8','X-CSRFToken':csrf()},body:new URLSearchParams({target_text:text,language:'Filipino',mode:'reading',prescribed_activity_key:'lesson7-gawain4b'})}).then(response=>response.ok?response.json():null).then(result=>new Promise(resolve=>{if(!result?.success||!result.audio_content){resolve();return}const audio=new Audio('data:'+(result.mime_type||'audio/mpeg')+';base64,'+result.audio_content);audio.onended=resolve;audio.onerror=resolve;audio.play().catch(resolve)})).catch(error=>console.error('Lesson 7 Gawain 4B narration failed',error)),narrate=async text=>{audioBusy=true;setDisabled(true);document.getElementById('status').textContent=text;await requestAudio(text);audioBusy=false;setDisabled(false)},playWord=async()=>{if(audioBusy)return;const audioFile=wordAudioFiles[String(x.word||'').toLowerCase()];if(!audioFile)return;audioBusy=true;setDisabled(true);try{const audio=new Audio(wordAudioBase+audioFile);await new Promise(resolve=>{audio.onended=resolve;audio.onerror=resolve;audio.play().catch(resolve)})}finally{audioBusy=false;setDisabled(false)}},resetRead=()=>{if(audioBusy)return;setDisabled(false);read.classList.remove('is-listening');read.textContent='Sabihin ang salita';read.onclick=startRead},startRead=()=>{if(audioBusy||read.disabled)return;if(!R){document.getElementById('status').textContent='Hindi available ang speech check sa browser na ito.';return}setDisabled(true);read.classList.add('is-listening');read.textContent='Nakikinig...';const recognition=new R();recognition.lang='fil-PH';recognition.continuous=false;recognition.interimResults=false;recognition.onresult=async event=>{read.textContent='Pinoproseso...';const ok=String(event.results[0][0].transcript||'').toLowerCase().includes(x.word.toLowerCase());if(ok){await narrate('Magaling!');state.completed_reading_items.push(state.current_reading_item);state.current_reading_item++;state.read_attempts=0;state.listen_attempts=0;if(state.current_reading_item===6)state.phase='written';await save();introPlayed=false;render()}else{state.read_attempts++;await narrate('Hindi iyon ang tamang pangalan ng larawan. Subukan muli magsalita.');await save();resetRead()}};recognition.onerror=async()=>{document.getElementById('status').textContent='Hindi narinig. Subukan muli.';await save();resetRead()};recognition.onend=()=>{if(!recognition.finalTranscript)resetRead()};recognition.start()};listenButton.onclick=playWord;read.onclick=startRead;if(!R){setDisabled(true)}if(!introPlayed){introPlayed=true;narrate('Tingnan ang larawang nasa kahon. Ano ito?')}}
      render()
    })();
  </script>
</body>
</html>
