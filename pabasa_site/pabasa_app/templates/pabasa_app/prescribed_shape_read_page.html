{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gawain 4B</title><style>html,body{height:100%;margin:0;overflow:hidden}body{background:#e1f5f7;color:#16465d;font-family:Nunito,"Segoe UI",sans-serif}.page{padding:10px}.back{padding:8px;background:#fff;border:2px solid #bfdde4;border-radius:12px;color:#16465d;font-weight:900;text-decoration:none}.card{height:calc(100dvh - 70px);max-width:980px;margin:8px auto;background:#fffdf7;border-radius:24px;padding:12px;box-sizing:border-box;text-align:center;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}h1{font-size:clamp(1.5rem,4vw,2.4rem)}.instruction,.status,.progress{font-weight:900}.sound-i{color:#d26a2e;font-weight:1000}.sound-o{color:#287fbd;font-weight:1000}.reading img,.item img{width:min(280px,55vw);height:min(235px,30vh);object-fit:contain;border:3px solid #dce8ed;border-radius:18px;background:#fff}.button{min-height:48px;padding:0 30px;border:0;border-radius:13px;background:#2b83bd;color:#fff;font-weight:900;cursor:pointer;transition:transform .16s ease,background .2s ease,box-shadow .2s ease}.button:hover{background:#2475aa;transform:translateY(-2px)}.button:active{transform:translateY(1px)}.button.is-listening,.button:disabled{background:#e39a32;box-shadow:0 0 0 5px #f8dfb0;cursor:wait}.button.is-listening{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px #f8dfb000}}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:760px}.item{padding:8px;border:2px solid #dce8ed;border-radius:15px;background:#fff}.item img{width:100%;height:clamp(95px,15vh,145px);border:0}.item input{width:52px;height:40px;font-size:1.6rem;text-align:center;font-weight:900;border:2px solid #bfdde4;border-radius:9px}.done{font-weight:900;color:#26784e;font-size:1.4rem}</style></head><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card"></section></main>{{ shape_read_activity_data|json_script:"shape-read-data" }}<script>(()=>{const d=JSON.parse(document.getElementById('shape-read-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';let state=Object.assign({phase:'oral',current_reading_item:0,completed_reading_items:[],read_attempts:0,listen_attempts:0,answers:[null,null,null,null,null,null]},d.progress?.state||{});async function save(){await fetch(d.progress_url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state})})}function render(){if(d.progress?.activity_completed){app.innerHTML='<div class="done">Magaling! Tama ang pagkakapili mo.<br><button class="button" id="back">Bumalik sa Aking Aralin</button></div>';back.onclick=()=>location.href='{% url "assessment" %}';return}if(state.phase!=='written'){oral();return}written()}function oral(){const i=state.current_reading_item,x=d.items[i];app.innerHTML='<h1>GAWAIN 4B: Letrang Oo</h1><p class="instruction">Tingnan ang larawan at sabihin ang salita.</p><div class="reading"><img src="'+x.image_url+'" alt="Larawan"></div><p class="progress">Larawan '+(i+1)+' / 6</p><p id="status" class="status">Sabihin ang salita.</p><button class="button" id="read">Sabihin ang salita</button>';if(state.read_attempts>=3){read.textContent='Pakinggan';read.onclick=async()=>{state.listen_attempts++;read.disabled=true;read.textContent='Pakinggan…';const u=new SpeechSynthesisUtterance(x.word);u.lang='fil-PH';u.onend=async()=>{if(state.listen_attempts>=3){state.read_attempts=0;state.listen_attempts=0;await save();read.disabled=false;read.textContent='Sabihin ang salita';read.onclick=()=>listen(x)}else{read.disabled=false;read.textContent='Pakinggan';await save()}};speechSynthesis.cancel();speechSynthesis.speak(u)}}else read.onclick=()=>listen(x)}function listen(x){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){state.phase='written';save();render();return}read.disabled=true;read.classList.add('is-listening');read.textContent='Nakikinig…';const r=new R();r.lang='fil-PH';r.onresult=async e=>{const ok=String(e.results[0][0].transcript).toLowerCase().includes(x.word);if(ok){state.completed_reading_items.push(state.current_reading_item);state.current_reading_item++;state.read_attempts=0;if(state.current_reading_item===6)state.phase='written';await save();render()}else{state.read_attempts++;const needsListen=state.read_attempts>=3;document.getElementById('status').textContent=needsListen?'Pakinggan ang salita.':'Hindi iyon ang tamang pangalan. Subukan muli.';read.disabled=false;read.classList.remove('is-listening');read.textContent=needsListen?'Pakinggan':'Subukan muli';if(needsListen)read.onclick=async()=>{state.listen_attempts++;read.disabled=true;read.textContent='Pakinggan…';const u=new SpeechSynthesisUtterance(x.word);u.lang='fil-PH';u.onend=async()=>{if(state.listen_attempts>=3){state.read_attempts=0;state.listen_attempts=0;await save();read.disabled=false;read.textContent='Sabihin ang salita';read.onclick=()=>listen(x)}else{read.disabled=false;read.textContent='Pakinggan';await save()}};speechSynthesis.cancel();speechSynthesis.speak(u)}}};r.onerror=()=>{state.read_attempts++;document.getElementById('status').textContent='Hindi narinig. Subukan muli.';read.disabled=false;read.classList.remove('is-listening');read.textContent=state.read_attempts>=3?'Pakinggan':'Subukan muli';if(state.read_attempts>=3)read.onclick=async()=>{state.listen_attempts++;read.disabled=true;read.textContent='Pakinggan…';const u=new SpeechSynthesisUtterance(x.word);u.lang='fil-PH';u.onend=async()=>{if(state.listen_attempts>=3){state.read_attempts=0;state.listen_attempts=0;await save();read.disabled=false;read.textContent='Sabihin ang salita';read.onclick=()=>listen(x)}else{read.disabled=false;read.textContent='Pakinggan';await save()}};speechSynthesis.cancel();speechSynthesis.speak(u)}};r.start()}function written(){app.innerHTML='<h1>GAWAIN 4B: Letrang Oo</h1><p class="instruction">I-type ang <span class="sound-i">i</span> kung ang larawan ay nagsisimula sa titik <span class="sound-i">/i/</span>. I-type ang <span class="sound-o">o</span> kung ang larawan ay nagsisimula sa titik <span class="sound-o">/o/</span>.</p><div class="items">'+d.items.map((x,i)=>'<label class="item"><img src="'+x.image_url+'" alt="Larawan"><input maxlength="1" data-i="'+i+'" value="'+(state.answers[i]||'')+'"></label>').join('')+'</div><p id="status" class="status">Isulat ang i o o sa bawat larawan.</p><button class="button" id="submit">ISUMITE</button>';document.querySelectorAll('input').forEach(q=>q.oninput=()=>{state.answers[+q.dataset.i]=q.value.toLowerCase().replace(/[^io]/g,'');save()});submit.onclick=async()=>{const r=await fetch(d.completion_url,{method:'POST',headers:{'X-CSRFToken':csrf()}});if(r.ok){d.progress.activity_completed=true;render()}else{state.answers=[null,null,null,null,null,null];await save();render();document.getElementById('status').textContent='May mali. Tingnan muli ang mga larawan at subukan ulit.'}}}render()})();</script></body></html>
