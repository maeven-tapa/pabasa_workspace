{% load static %}
<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gawain 3: Letrang Oo</title>
  <style>
    body{margin:0;overflow:hidden;background:#e1f5f7;color:#16465d;font-family:Nunito,"Segoe UI",sans-serif}
    .page{width:min(1000px,calc(100% - 20px));margin:auto;padding:8px}
    .card{height:calc(100dvh - 40px);padding:clamp(14px,2.5vh,26px);border-radius:24px;background:#fffdf7;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
    .card>div{width:100%}h1{margin:4px;font-size:clamp(1.6rem,4vw,2.4rem)}
    .eyebrow{color:#997124;font-size:.75rem;font-weight:900}
    .instruction{margin:8px auto;padding:8px 14px;border-radius:14px;background:#eef8fb;font-weight:800;max-width:620px}
    .reading img{width:min(80vw,360px);height:min(48vh,330px);object-fit:contain;padding:12px;border:3px solid #dce8ed;border-radius:24px;background:#fff;box-shadow:0 8px 18px #2d69731f}
    .progress{color:#71828a;margin:10px;font-weight:800;white-space:nowrap;display:block;line-height:1.5}
    .button{border:0;border-radius:14px;padding:13px 28px;background:#2b83bd;color:#fff;font-size:1.05rem;font-weight:900;box-shadow:0 4px 0 #155369;cursor:pointer}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:800px;margin:14px auto}
    .choice{padding:8px;border:2px solid #dce8ed;border-radius:18px;background:#fff;cursor:pointer}
    .choice img{width:100%;height:clamp(130px,25vh,220px);object-fit:contain}
    .choice.selected{border-color:#ef922b;box-shadow:0 0 0 5px #ef922b;border-radius:50%}
    .status{min-height:28px;color:#397b56;font-weight:900}
    .done{font-size:1.4rem;color:#26784e;font-weight:900}
    @media(max-width:560px){.choices{gap:6px}.choice img{height:120px}}
  </style>
  <link rel="stylesheet" href="{% static 'pabasa_app/css/lesson_7_gawain_3.css' %}?v=20260918-2">
</head>
<body>
  <main class="page">
    <a href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a>
    <section id="app" class="card"></section>
  </main>
  {{ lesson7_gawain3_data|json_script:"activity-data" }}
  <script>
  (() => {
    const d=JSON.parse(document.getElementById('activity-data').textContent);
    const app=document.getElementById('app');
    const csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';
    const wordAudioFiles={ulap:'ulap.mp3',orasan:'orasan.mp3',ulan:'ulan.mp3',ilaw:'ilaw.mp3',elepante:'elepante.mp3',elesi:'elesi.mp3',manok:'manok.mp3',durian:'durian.mp3',ngipin:'ngipin.mp3',kandila:'kandila.mp3',pamaypay:'pamaypay.mp3',sandok:'sandok.mp3',isa:'isa.mp3',apoy:'apoy.mp3',okra:'okra.mp3'},wordAudioBase='/static/pabasa_app/prescribed/audio/SESSION%203/LESSON%207/GAWAIN%203/';
    const INTRO_TITLE='Tukuyin ang larawan';
    const INTRO_INSTRUCTION='Tingnan ang larawang nasa kahon. Ano ito?';
    const WRONG='Hindi iyon ang tamang pangalan ng larawan. Subukan muli magsalita.';
    const CORRECT='Magaling!';
    const PART2_WRONG='Hindi iyon ang tamang larawan, Pumili muna at subukan ulit.';
    let s=Object.assign({current_phase:'oral_reading',current_reading_item:0,completed_reading_items:[],read_attempts:0,listen_attempts:0,oral_reading_completed:false,current_target:0,selections:{},correct_count:0,state_version:0},d.progress?.state||{});
    let audioBusy=false;
    let introPlayed=false;
    let part2NarratedTarget=-1;

    const save=()=>fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:++s.state_version}})});
    const requestAudio=text=>fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8','X-CSRFToken':csrf()},body:new URLSearchParams({target_text:text,language:'Filipino',mode:'reading',prescribed_activity_key:'lesson7-gawain3'})}).then(response=>response.ok?response.json():null).then(result=>new Promise(resolve=>{if(!result?.success||!result.audio_content){resolve();return}const audio=new Audio('data:'+(result.mime_type||'audio/mpeg')+';base64,'+result.audio_content);audio.onended=resolve;audio.onerror=resolve;audio.play().catch(resolve)})).catch(error=>console.error('Lesson 7 Gawain 3 narration failed',error));
    const readingButtons=()=>[...app.querySelectorAll('.reading-actions button')];
    const setReadingButtonsDisabled=disabled=>readingButtons().forEach(button=>{button.disabled=disabled});
    const setStatus=text=>{const status=document.getElementById('status');if(status)status.textContent=text};
    const narrateReading=async text=>{audioBusy=true;setReadingButtonsDisabled(true);await requestAudio(text);audioBusy=false;setReadingButtonsDisabled(false)};
    const narrateIntro=async()=>{if(introPlayed)return;introPlayed=true;audioBusy=true;setReadingButtonsDisabled(true);await requestAudio(INTRO_TITLE);await requestAudio(INTRO_INSTRUCTION);audioBusy=false;setReadingButtonsDisabled(false)};
    const setPart2ControlsDisabled=(disabled,next)=>{next.disabled=disabled;app.querySelectorAll('.choices .choice').forEach(choice=>{choice.disabled=disabled;choice.classList.toggle('is-disabled',disabled)})};
    const narratePart2=async(text,next)=>{audioBusy=true;setPart2ControlsDisabled(true,next);await requestAudio(text);audioBusy=false;setPart2ControlsDisabled(false,next)};
    const narratePart2Instruction=async(next,target,text)=>{if(part2NarratedTarget===target)return;part2NarratedTarget=target;await narratePart2(text,next)};

    function render(){
      if(d.progress?.activity_completed){app.innerHTML='<div class="done">✓<br>Magaling! Natapos mo ang Gawain 3.</div>';return}
      if(!s.oral_reading_completed){
        const i=s.current_reading_item,it=d.items[i];
        app.innerHTML='<div><p class="eyebrow">SESSION 3 · LESSON 7 · GAWAIN 3</p><h1>Tukuyin ang larawan</h1><p class="instruction">Tingnan ang larawang nasa kahon. Ano ito?</p><div class="reading"><img src="'+it.image_url+'" alt="Larawan"></div><p class="progress">Larawan '+(i+1)+' / '+d.items.length+'</p><p id="status" class="status">Handa ka na? Sabihin ang salita.</p><div class="reading-actions"><button class="button" id="read" type="button">Sabihin ang salita</button><button class="button" id="listen" type="button">Pakinggan</button></div></div>';
        const read=document.getElementById('read'),listenButton=document.getElementById('listen'),Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
        const resetRead=()=>{if(audioBusy)return;setReadingButtonsDisabled(false);read.textContent='Sabihin ang salita';read.onclick=startRead};
        const listen=async()=>{if(audioBusy||read.disabled)return;const audioFile=wordAudioFiles[String(it.word||'').toLowerCase()];if(!audioFile)return;audioBusy=true;setReadingButtonsDisabled(true);try{const audio=new Audio(wordAudioBase+audioFile);await new Promise(resolve=>{audio.onended=resolve;audio.onerror=resolve;audio.play().catch(resolve)})}finally{audioBusy=false;setReadingButtonsDisabled(false)}};
        const startRead=()=>{if(audioBusy||read.disabled||!Recognition)return;setReadingButtonsDisabled(true);read.textContent='Nakikinig…';const recognition=new Recognition();recognition.lang='fil-PH';recognition.interimResults=false;recognition.continuous=false;recognition.onresult=async event=>{read.textContent='Pinoproseso…';const heard=String(event.results[0][0].transcript).toLowerCase();if(heard.includes(String(it.word).toLowerCase())){setStatus(CORRECT);await narrateReading(CORRECT);s.completed_reading_items.push(i);s.current_reading_item=i+1;s.read_attempts=0;s.listen_attempts=0;if(i===d.items.length-1){s.oral_reading_completed=true;s.current_phase='main_activity'}else{introPlayed=false}await save();render()}else{s.read_attempts=(s.read_attempts||0)+1;setStatus(WRONG);await narrateReading(WRONG);await save();resetRead()}};recognition.onerror=async()=>{s.read_attempts=(s.read_attempts||0)+1;setStatus(WRONG);await narrateReading(WRONG);await save();resetRead()};recognition.start()};
        read.onclick=startRead;
        listenButton.onclick=listen;
        if(!Recognition){read.disabled=true;listenButton.disabled=true}
        if(!introPlayed)narrateIntro();
        return
      }
      const t=d.targets[s.current_target],sel=s.selections[s.current_target],instructionText='Saan sa mga larawang ito ang nagsisimula sa tunog '+String(t.letter).toLowerCase()+'?';
      app.innerHTML='<div><p class="eyebrow">SESSION 3 · LESSON 7 · GAWAIN 3</p><h1>'+t.letter+'</h1><p class="instruction">'+instructionText+'</p><div class="choices">'+t.items.map((x,i)=>'<button class="choice '+(sel===i?'selected':'')+'" data-i="'+i+'"><img src="'+x.image_url+'" alt="Larawan"></button>').join('')+'</div><p class="progress">'+(('● '.repeat(s.current_target+1))+('○ '.repeat(4-s.current_target)))+'<br>'+(s.current_target+1)+' / 5</p><p id="status" class="status">Pumili ng isang larawan.</p><button class="button" id="next" type="button">'+(s.current_target===4?'TAPUSIN':'SUSUNOD')+'</button></div>';
      const next=document.getElementById('next');
      document.querySelectorAll('.choice').forEach(button=>button.onclick=()=>{s.selections[s.current_target]=+button.dataset.i;render()});
      next.onclick=async()=>{if(audioBusy)return;const answer=t.answer;if(s.selections[s.current_target]!==answer){delete s.selections[s.current_target];app.querySelectorAll('.choice').forEach(choice=>choice.classList.remove('selected'));setStatus(PART2_WRONG);await narratePart2(PART2_WRONG,next);return}setStatus(CORRECT);await narratePart2(CORRECT,next);s.correct_count++;if(s.current_target===4){await save();const response=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});if(response.ok){d.progress.activity_completed=true;render()}return}s.current_target++;await save();render()};
      narratePart2Instruction(next,s.current_target,instructionText);
    }
    render();
  })();
  </script>
{% include 'pabasa_app/session3_prescribed_controls.html' with prefix='prescribed-s3l7g3' help_text='Basahin ang salita at ikahon ang tamang larawan.' %}</body>
</html>
