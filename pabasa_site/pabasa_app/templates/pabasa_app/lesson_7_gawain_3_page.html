{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gawain 3: Letrang Oo</title><style>body{margin:0;overflow:hidden;background:#e1f5f7;color:#16465d;font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(1000px,calc(100% - 20px));margin:auto;padding:8px}.card{height:calc(100dvh - 40px);padding:clamp(14px,2.5vh,26px);border-radius:24px;background:#fffdf7;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}.card>div{width:100%}h1{margin:4px;font-size:clamp(1.6rem,4vw,2.4rem)}.eyebrow{color:#997124;font-size:.75rem;font-weight:900}.instruction{margin:8px auto;padding:8px 14px;border-radius:14px;background:#eef8fb;font-weight:800;max-width:620px}.reading img{width:min(80vw,360px);height:min(48vh,330px);object-fit:contain;padding:12px;border:3px solid #dce8ed;border-radius:24px;background:#fff;box-shadow:0 8px 18px #2d69731f}.progress{color:#71828a;margin:10px;font-weight:800;white-space:nowrap;display:block;line-height:1.5}.button{border:0;border-radius:14px;padding:13px 28px;background:#2b83bd;color:#fff;font-size:1.05rem;font-weight:900;box-shadow:0 4px 0 #155369;cursor:pointer}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:800px;margin:14px auto}.choice{padding:8px;border:2px solid #dce8ed;border-radius:18px;background:#fff;cursor:pointer}.choice img{width:100%;height:clamp(130px,25vh,220px);object-fit:contain}.choice.selected{border-color:#ef922b;box-shadow:0 0 0 5px #ef922b;border-radius:50%}.status{min-height:28px;color:#397b56;font-weight:900}.done{font-size:1.4rem;color:#26784e;font-weight:900}@media(max-width:560px){.choices{gap:6px}.choice img{height:120px}}</style></head><body><main class="page"><a href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card"></section></main>{{ lesson7_gawain3_data|json_script:"activity-data" }}<script>(()=>{const d=JSON.parse(document.getElementById('activity-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';let s=Object.assign({current_phase:'oral_reading',current_reading_item:0,completed_reading_items:[],read_attempts:0,listen_attempts:0,oral_reading_completed:false,current_target:0,selections:{},correct_count:0,state_version:0},d.progress?.state||{});const save=()=>fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:++s.state_version}})});function render(){if(d.progress?.activity_completed){app.innerHTML='<div class="done">✓<br>Magaling! Natapos mo ang Gawain 3.<br><a href="{% url "assessment" %}">Bumalik sa Aking Aralin</a></div>';return}if(!s.oral_reading_completed){let i=s.current_reading_item,it=d.items[i];app.innerHTML='<div><p class="eyebrow">SESSION 3 · LESSON 7 · GAWAIN 3</p><h1>Tukuyin ang larawan</h1><p class="instruction">Tingnan ang larawan at sabihin ang salita.</p><div class="reading"><img src="'+it.image_url+'" alt="Larawan"></div><p class="progress">Larawan '+(i+1)+' / '+d.items.length+'</p><p id="status" class="status">Handa ka na? Sabihin ang salita.</p><button class="button" id="read">Sabihin ang salita</button></div>';let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;const resetRead=()=>{read.disabled=false;read.textContent='Sabihin ang salita';read.onclick=startRead};const listen=async()=>{read.disabled=true;read.textContent='Pakinggan…';s.listen_attempts=(s.listen_attempts||0)+1;await save();let u=new SpeechSynthesisUtterance(it.word);let v=speechSynthesis.getVoices().find(x=>/^fil(?:-|$)/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/^tl(?:-|$)/i.test(x.lang));u.lang=v?.lang||'fil-PH';if(v)u.voice=v;u.onend=()=>{if(s.listen_attempts>=3){s.read_attempts=0;s.listen_attempts=0;save();resetRead()}else{read.disabled=false;read.textContent='Pakinggan';read.onclick=listen}};speechSynthesis.cancel();speechSynthesis.speak(u)};const startRead=()=>{let r=new R();r.lang='fil-PH';read.disabled=true;read.textContent='Nakikinig…';r.onresult=async e=>{if(String(e.results[0][0].transcript).toLowerCase().includes(it.word)){s.completed_reading_items.push(i);s.current_reading_item=i+1;s.read_attempts=0;s.listen_attempts=0;if(i===d.items.length-1){s.oral_reading_completed=true;s.current_phase='main_activity'}await save();render()}else{s.read_attempts=(s.read_attempts||0)+1;document.getElementById('status').textContent=s.read_attempts>=3?'Pakinggan ang salita.':'Hindi iyon ang tamang pangalan ng larawan. Subukan muli magsalita.';if(s.read_attempts>=3){read.disabled=false;read.textContent='Pakinggan';read.onclick=listen}else resetRead();await save()}};r.onerror=()=>{s.read_attempts=(s.read_attempts||0)+1;document.getElementById('status').textContent=s.read_attempts>=3?'Pakinggan ang salita.':'Hindi narinig. Subukan muli.';if(s.read_attempts>=3){read.disabled=false;read.textContent='Pakinggan';read.onclick=listen}else resetRead();save()};r.start()};read.onclick=startRead;return}let t=d.targets[s.current_target],sel=s.selections[s.current_target];app.innerHTML='<div><p class="eyebrow">SESSION 3 · LESSON 7 · GAWAIN 3</p><h1>'+t.letter+'</h1><p class="instruction">Piliin ang larawang nagsisimula sa tunog /'+t.letter.toLowerCase()+'/.</p><div class="choices">'+t.items.map((x,i)=>'<button class="choice '+(sel===i?'selected':'')+'" data-i="'+i+'"><img src="'+x.image_url+'" alt="Larawan"></button>').join('')+'</div><p class="progress">'+(('● '.repeat(s.current_target+1))+('○ '.repeat(4-s.current_target)))+'<br>'+(s.current_target+1)+' / 5</p><p id="status" class="status">Pumili ng isang larawan.</p><button class="button" id="next">'+(s.current_target===4?'TAPUSIN':'SUSUNOD')+'</button></div>';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{s.selections[s.current_target]=+b.dataset.i;render()});next.onclick=async()=>{let answer=t.answer;if(s.selections[s.current_target]!==answer){document.getElementById('status').textContent='Hindi iyon ang tamang larawan. Pumili muli at subukan ulit.';return}s.correct_count++;if(s.current_target===4){await save();let r=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});if(r.ok){d.progress.activity_completed=true;render()}return}s.current_target++;await save();render()}}render()})();</script></body></html>
