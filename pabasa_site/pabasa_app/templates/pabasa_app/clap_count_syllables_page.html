{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clap &amp; Count Syllables | PABASA</title>
<style>
:root{--teal:#176d88;--deep:#0d5065;--cream:#fffdf5;--yellow:#f6ca65;--page:#eaf6f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 5%,#caebef 0 12%,transparent 31%),radial-gradient(circle at 95% 88%,#ffe6b2 0 10%,transparent 28%),var(--page);color:#17313a;font-family:"Segoe UI",Arial,sans-serif}button,a{font:inherit}.app{width:min(1240px,calc(100% - 32px));height:100vh;height:100dvh;margin:auto;padding:clamp(12px,2vh,22px) 0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(12px,2vh,20px)}
.top{display:grid;grid-template-columns:1fr minmax(280px,1.5fr) 1fr;align-items:center;gap:18px;min-height:70px;padding:12px 22px;border:1px solid #fff;border-radius:22px;background:#fffdf5ed;box-shadow:0 8px 26px #18536818}.back{justify-self:start;color:var(--deep);font-weight:800;text-decoration:none}.back:hover{text-decoration:underline}.title{margin:0;text-align:center;color:var(--deep);font-size:clamp(1.05rem,2vw,1.4rem);font-weight:900}.progress-wrap{justify-self:end;width:min(180px,100%)}.progress-text{display:block;margin-bottom:7px;text-align:right;color:var(--deep);font-size:.84rem;font-weight:900}.progress-track{height:8px;overflow:hidden;border-radius:20px;background:#d9e6e5}.progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal),#43a8aa);transition:width .3s}
.stage{min-height:0;display:grid;place-items:center}.forest-card{position:relative;width:100%;height:100%;min-height:500px;max-height:760px;overflow:hidden;border:5px solid var(--cream);border-radius:34px;background:linear-gradient(#0b3d342e,#0b3d342e),url("{% static 'pabasa_app/images/forest2.jpg' %}") center/cover no-repeat;box-shadow:0 20px 45px #164f5538,0 0 0 2px #176d8840;text-align:center;isolation:isolate}.forest-card:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 43%,#fffbd34d 0 20%,#0c3e262c 70%,#092f285c);pointer-events:none}.activity-content{position:relative;z-index:2;width:min(850px,calc(100% - 220px));height:100%;margin:auto;padding:clamp(30px,6vh,70px) 12px clamp(30px,4vh,48px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.word-safe-area{width:100%;min-width:0;padding:0 clamp(10px,3vw,34px);overflow:hidden}.word{display:inline-block;max-width:100%;color:var(--deep);font-size:1rem;line-height:1;white-space:nowrap;text-transform:uppercase;font-weight:950;letter-spacing:.02em;text-shadow:0 2px 0 #fff8dc,0 4px 10px #fffdf5,0 0 24px #fffdf5;opacity:0}.word.is-fitted{opacity:1}.listen{display:inline-flex;align-items:center;gap:9px;margin-top:clamp(18px,3vh,28px);padding:10px 20px;border:2px solid #6db6bf;border-radius:999px;background:#f4fcfbe8;color:var(--deep);font-weight:850;box-shadow:0 5px 0 #367f88,0 9px 18px #153c3030;cursor:pointer;transition:.16s}.listen:hover{transform:translateY(-2px);background:#fff}.listen:active{transform:translateY(3px);box-shadow:0 2px 0 #367f88}
.instruction{margin:clamp(24px,4vh,38px) 0 14px;padding:5px 14px;border-radius:999px;background:#fffdf5d9;color:var(--deep);font-size:clamp(1.05rem,2.2vw,1.35rem);font-weight:900;box-shadow:0 4px 14px #153c3020}.stars{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.6vw,18px);width:100%}.star-option{display:grid;grid-template-columns:auto auto;place-items:center;gap:3px;min-width:clamp(58px,7vw,78px);min-height:clamp(62px,8vw,82px);padding:4px 8px;border:2px solid #1a6f78;border-radius:22px;background:#fffdf5e8;color:var(--deep);box-shadow:0 5px 0 #2f7d68,0 9px 18px #153c3028;cursor:pointer;transition:.16s}.star-icon{color:#e5a91d;font-size:clamp(2rem,4vw,3rem);line-height:1}.star-number{font-size:clamp(1rem,2vw,1.25rem);font-weight:950}.star-option:hover{transform:translateY(-3px);background:#fff7d5}.star-option:active{transform:translateY(3px);box-shadow:0 2px 0 #2f7d68}.star-option.is-selected{border-color:var(--deep);background:var(--yellow);box-shadow:0 5px 0 #bc8b22,0 0 0 5px #fffdf5a8}.star-option.is-selected .star-icon{color:#fff;text-shadow:0 2px 0 #bc8b22}
.feedback{min-height:24px;margin:14px 0 0;color:#fff;font-weight:900;text-shadow:0 2px 5px #17313a}.actions{display:flex;justify-content:center;gap:clamp(18px,3vw,34px);margin-top:12px}.minor,.primary{min-width:145px;min-height:54px;padding:11px 25px;border-radius:18px;font-weight:900;cursor:pointer;transition:.16s}.minor{border:2px solid #b8cdca;background:#fffdf5e8;color:#536a6b;box-shadow:0 5px 0 #91aaa7}.primary{border:2px solid var(--deep);background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--deep),0 10px 20px #0b3e4138}.minor:hover,.primary:hover{transform:translateY(-2px);filter:brightness(1.05)}.minor:active,.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #547879}.primary:disabled{cursor:not-allowed;filter:grayscale(.35);opacity:.62;transform:none}.mascot{position:absolute;z-index:3;right:clamp(0px,1.5vw,18px);bottom:clamp(-86px,-6vw,-48px);width:clamp(130px,18vw,230px);height:auto;pointer-events:none;filter:drop-shadow(0 9px 8px #082d274d)}
.complete{position:absolute;z-index:2;left:50%;top:50%;width:min(620px,calc(100% - 180px));padding:32px;border-radius:28px;background:#fffdf5e8;color:var(--deep);box-shadow:0 14px 36px #143d3540;backdrop-filter:blur(5px);transform:translate(-50%,-50%)}.complete-label{font-size:.78rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.complete h2{margin:12px 0;font-size:clamp(2.1rem,5vw,4rem)}.complete p{font-size:1.08rem;font-weight:750}.complete .primary{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;text-decoration:none}button:focus-visible,a:focus-visible{outline:4px solid var(--yellow);outline-offset:4px}
/* Forest game HUD */
.top{position:relative;z-index:5;grid-template-columns:1fr auto 1fr;min-height:76px;padding:10px 15px;border:2px solid #fff;border-bottom-color:#b8d8cf;border-radius:24px;background:linear-gradient(180deg,#fffdf7 0%,#f8f4e7 100%);box-shadow:0 7px 0 #b9d8cf,0 14px 28px #164f5525}.top:before,.top:after{content:"◆";position:absolute;color:#71a866;font-size:.72rem;transform:rotate(45deg);opacity:.72}.top:before{left:12px;bottom:-6px}.top:after{right:15px;top:-6px}.back{display:inline-flex;align-items:center;justify-content:center;justify-self:start;min-height:42px;padding:8px 15px;border:2px solid #b6d5d1;border-radius:15px;background:#fffdf5;color:var(--deep);box-shadow:0 4px 0 #91bdb7;font-size:.9rem;font-weight:900;transition:.16s}.back:hover{text-decoration:none;transform:translateY(-1px);background:#eef9f5}.back:active{transform:translateY(3px);box-shadow:0 1px 0 #91bdb7}.title{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 17px;border-radius:16px;color:var(--deep);font-size:clamp(1.08rem,2vw,1.42rem);letter-spacing:.01em}.title-leaf{color:#4d9b67;font-size:1.08em;filter:drop-shadow(0 2px 0 #d8ecd8)}.hud-status{justify-self:end;display:grid;grid-template-columns:auto minmax(110px,160px);align-items:center;gap:8px 12px;padding:7px 11px;border:1px solid #c5ddd7;border-radius:17px;background:#fffdf5c9;box-shadow:inset 0 1px 0 #fff}.clap-status{grid-row:1/3;display:flex;align-items:center;gap:5px;min-width:58px;padding:7px 9px;border-radius:12px;background:#e3f3ef;color:var(--deep);font-weight:950}.clap-icon{font-size:1.15rem}.progress-text{margin:0;text-align:right;color:var(--deep);font-size:.88rem}.progress-track{height:9px;border:1px solid #c5d8d5;background:#e3ece9}.activity-content.is-wrong{animation:friendlyShake .38s ease}.activity-content.is-correct .stars{animation:successPulse .42s ease}.star-option.is-wrong{border-color:#d87373;background:#ffe5e1;color:#9d4646;box-shadow:0 5px 0 #c96e6e,0 0 0 4px #fff1ed}.star-option.is-wrong .star-icon{color:#db6969}.star-option.is-correct{border-color:#308b68;background:#d8f2df;box-shadow:0 5px 0 #35805f,0 0 0 5px #effff2}.feedback.is-wrong{color:#fff3ef}.feedback.is-correct{color:#effff2}@keyframes friendlyShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes successPulse{50%{transform:scale(1.055);filter:drop-shadow(0 0 10px #d8ffe1)}}
@media(max-width:760px){.app{width:calc(100% - 18px);padding:9px 0;gap:9px}.top{grid-template-columns:64px 1fr auto;gap:5px;min-height:64px;padding:7px 8px;border-radius:17px;box-shadow:0 5px 0 #b9d8cf,0 10px 20px #164f5520}.back{min-height:38px;padding:6px 9px;font-size:.78rem;border-radius:12px}.title{gap:4px;padding:3px;font-size:.88rem;line-height:1.08}.hud-status{grid-template-columns:auto 58px;gap:4px;padding:5px}.clap-status{min-width:43px;padding:5px;font-size:.78rem}.progress-wrap{width:58px}.progress-text{font-size:.68rem}.progress-track{height:7px}.forest-card{min-height:0;border-width:3px;border-radius:25px}.activity-content{width:100%;padding:24px 8px 120px}.stars{gap:5px}.star-option{grid-template-columns:1fr;gap:0;min-width:0;flex:1;padding:2px;border-radius:16px}.star-icon{font-size:clamp(1.65rem,8vw,2.35rem)}.actions{gap:14px}.minor,.primary{min-width:120px}.mascot{right:-9px;width:135px}.complete{width:calc(100% - 28px);padding:24px 16px}}@media(max-height:690px){.forest-card{min-height:0}.activity-content{padding-top:14px;padding-bottom:70px}.listen{margin-top:12px;padding:7px 16px}.instruction{margin-top:16px;margin-bottom:8px}.star-option{min-height:56px}.feedback{margin-top:8px}.actions{margin-top:5px}.minor,.primary{min-height:46px}.mascot{width:clamp(105px,15vw,165px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="app"><header class="top"><a class="back" href="{% url 'assessment' %}">← Back</a><h1 class="title"><span class="title-leaf" aria-hidden="true">🌿</span>Clap &amp; Count Syllables</h1><div class="hud-status"><div class="clap-status" aria-label="Current count"><span class="clap-icon" aria-hidden="true">👏</span><span id="hudClapCount">0</span></div><div class="progress-wrap"><span class="progress-text" id="progress"></span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div></div></header><section class="stage" id="stage" aria-live="polite"></section></main>
<script id="material" type="application/json">{{ clap_count_material_json|safe }}</script><script id="completion" type="application/json">{{ clap_count_completion_json|safe }}</script>
<script>
window.addEventListener('DOMContentLoaded',()=>{const data=JSON.parse(document.getElementById('material').textContent),completion=JSON.parse(document.getElementById('completion').textContent||'{}'),stage=document.getElementById('stage'),progress=document.getElementById('progress'),fill=document.getElementById('progressFill'),hudClapCount=document.getElementById('hudClapCount');let items=[...(data.items||[])],index=0,selected=null,answers=[];const started=Date.now();if(data.randomize_order&&!completion.completed){for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}}const esc=value=>String(value??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),mascot=`<img class="mascot" src="{% static 'pabasa_app/images/footer-mascot.png' %}" alt="PABASA mascot">`,shell=content=>`<article class="forest-card">${content}${mascot}</article>`;
function speak(word){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang=data.language==='Filipino'?'fil-PH':'en-US';speechSynthesis.speak(u)}function fitWord(){const safe=document.getElementById('wordSafeArea'),word=document.getElementById('heroWord');if(!safe||!word)return;const available=Math.max(1,safe.clientWidth-16),length=word.textContent.trim().length,preferred=length<=5?120:length<=8?104:length<=11?88:length<=15?72:58;word.style.fontSize=preferred+'px';word.style.fontSize=Math.max(24,Math.min(preferred,preferred*available/Math.max(word.scrollWidth,1)))+'px';word.classList.add('is-fitted')}function setProgress(){progress.textContent=`${Math.min(index+1,items.length)} / ${items.length}`;fill.style.width=`${items.length?((index+1)/items.length)*100:100}%`;hudClapCount.textContent=selected??0}
function render(message=''){if(index>=items.length)return finish();const item=items[index];setProgress();stage.innerHTML=shell(`<div class="activity-content"><div class="word-safe-area" id="wordSafeArea"><div class="word" id="heroWord">${esc(item.word)}</div></div><button class="listen" id="listen" type="button"><span aria-hidden="true">🔊</span> Listen to the word</button><p class="instruction">Tap stars to count syllables</p><div class="stars" role="radiogroup" aria-label="Choose the number of syllables">${[1,2,3,4,5].map(n=>`<button class="star-option ${selected===n?'is-selected':''}" type="button" role="radio" aria-checked="${selected===n}" data-count="${n}"><span class="star-icon" aria-hidden="true">${selected===n?'★':'☆'}</span><span class="star-number">${n}</span></button>`).join('')}</div><p class="feedback">${esc(message)}</p><div class="actions"><button class="minor" id="clear" type="button">Clear</button><button class="primary" id="check" type="button" ${selected===null?'disabled':''}>Check ✓</button></div></div>`);requestAnimationFrame(fitWord);document.getElementById('listen').onclick=()=>speak(item.word);document.querySelectorAll('.star-option').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.count);render()});document.getElementById('clear').onclick=()=>{selected=null;render()};document.getElementById('check').onclick=check}
function check(){if(selected===null)return;const item=items[index],correct=selected===Number(item.syllable_count),content=stage.querySelector('.activity-content'),feedback=stage.querySelector('.feedback'),checkButton=document.getElementById('check'),countButtons=[...stage.querySelectorAll('.star-option')].filter(button=>Number(button.dataset.count)<=selected);answers.push({word_id:item.id,answer:selected,claps:0});checkButton.disabled=true;if(correct){content.classList.add('is-correct');countButtons.forEach(button=>button.classList.add('is-correct'));feedback.classList.add('is-correct');feedback.textContent='✓ Great counting!';setTimeout(()=>{stage.innerHTML=shell(`<div class="complete"><div class="complete-label">Wonderful work!</div><h2>Great job! ⭐</h2><p><strong>${esc(item.word)}</strong> has ${item.syllable_count} ${item.syllable_count===1?'syllable':'syllables'}.</p><button class="primary" id="next">${index===items.length-1?'Finish':'Next Word'} →</button></div>`);document.getElementById('next').onclick=()=>{index++;selected=null;hudClapCount.textContent='0';render()}},420)}else{content.classList.add('is-wrong');countButtons.forEach(button=>button.classList.add('is-wrong'));feedback.classList.add('is-wrong');feedback.textContent='❌ Try again!';setTimeout(()=>{content.classList.remove('is-wrong');countButtons.forEach(button=>button.classList.remove('is-wrong'));feedback.classList.remove('is-wrong');feedback.textContent='Choose another count and check again.';checkButton.disabled=false},650)}}
async function finish(){progress.textContent='Complete ✓';fill.style.width='100%';stage.innerHTML=shell(`<div class="complete"><div class="complete-label">Saving result…</div><h2>Great job! 🎉</h2><p>You completed Clap &amp; Count Syllables.</p></div>`);try{const response=await fetch('{% url "record_assessment_completion" %}',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''},body:JSON.stringify({material_id:data.id,activity_type:'assessment',assessment_type:'word',items_completed:items.length,scores:{answers,duration_seconds:Math.round((Date.now()-started)/1000)}})}),result=await response.json();if(!response.ok||!result.success)throw new Error(result.error||'Unable to save result.');stage.innerHTML=shell(`<div class="complete"><div class="complete-label">Activity complete</div><h2>Great job! 🎉</h2><p>${Number(result.correct_items||0)} of ${Number(result.items_completed||0)} correct · ${Number(result.accuracy||0)}%</p><a class="primary" href="{% url 'assessment' %}">Back to Assessments →</a></div>`)}catch(e){stage.innerHTML=shell(`<div class="complete"><div class="complete-label">Result not saved</div><h2>Please try again</h2><p>${esc(e.message)}</p><button class="primary" id="retrySave" type="button">Save again</button></div>`);document.getElementById('retrySave').onclick=finish}}
if(completion.completed){progress.textContent='Completed ✓';fill.style.width='100%';stage.innerHTML=shell(`<div class="complete"><div class="complete-label">Completed ✓</div><h2>Activity finished!</h2><p>${Number(completion.correct_items||0)} of ${Number(completion.total_items||0)} correct · ${Number(completion.accuracy||0)}%</p><a class="primary" href="{% url 'assessment' %}">Back to Assessments →</a></div>`)}else render();window.addEventListener('resize',()=>requestAnimationFrame(fitWord));if(document.fonts?.ready)document.fonts.ready.then(fitWord)});
</script>
<style>
</style>
<script>
window.addEventListener('DOMContentLoaded',()=>{const stage=document.getElementById('stage'),count=document.getElementById('hudClapCount'),badge=count?.closest('.clap-status'),completion=JSON.parse(document.getElementById('completion')?.textContent||'{}');let earned=completion.completed?Number(completion.correct_items||0):0,wasCorrect=false;const sync=()=>{if(count)count.textContent=earned};new MutationObserver(()=>{const isCorrect=Boolean(stage.querySelector('.feedback.is-correct'));if(isCorrect&&!wasCorrect){earned++;sync();badge?.classList.remove('is-earned');void badge?.offsetWidth;badge?.classList.add('is-earned');setTimeout(()=>badge?.classList.remove('is-earned'),620)}else sync();wasCorrect=isCorrect}).observe(stage,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});sync()});
</script>
<style>
.clap-area{width:100%;min-height:150px;display:grid;place-items:center}.clap-pad{position:relative;width:130px;height:130px;border:2px solid #1a6f78;border-radius:24px;background:#fffdf5e8;color:var(--deep);box-shadow:0 5px 0 #2f7d68,0 9px 18px #153c3028;cursor:pointer}.clap-animation{display:block;width:88px;height:88px;margin:auto}.clap-number{display:block;font-size:1.5rem;font-weight:950}.clap-hint{margin:3px 0 0;color:#fff;font-weight:900;text-shadow:0 2px 5px #17313a}.phase-recording .primary{min-width:190px}.phase-count .instruction{margin-bottom:4px}
.word{transition:font-size .2s ease,transform .2s ease}.phase-count .word{transform:scale(1.02)}
.phase2-wrong{color:#b64242!important;animation:phase2Wrong .42s ease}.phase2-correct{animation:phase2Correct .42s ease}@keyframes phase2Wrong{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@keyframes phase2Correct{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>
<script src="{% static 'pabasa_app/js/lottie.min.js' %}"></script><script>window.CLAP_ANIMATION_URL="{% static 'pabasa_app/animations/clap/clap.json' %}";window.CLAP_MASCOT_URL="{% static 'pabasa_app/images/footer-mascot.png' %}";</script><script src="{% static 'pabasa_app/js/clap_count_syllables.js' %}?v={% now 'U' %}"></script>
</body></html>
