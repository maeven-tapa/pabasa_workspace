{% load static %}
<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GAWAIN 2: Letrang Ii | PABASA</title>
  <style>
    @font-face{font-family:Fredoka;src:url("{% static 'pabasa_app/font/fredoka-one.one-regular.ttf' %}") format('truetype');font-display:swap}
    :root{--ink:#183e63;--teal:#299e9a;--teal-dark:#187b7a;--guide-blue:#2b83bd;--guide-red:#df5b62;--guide-border:#94d9d6}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#d8f1ef;color:var(--ink);font-family:Fredoka,Nunito,"Segoe UI",sans-serif}body{background:url("{% static 'pabasa_app/prescribed/PRESCRIBED-BG.jpg' %}") center/cover no-repeat}.page{width:min(1250px,100%);height:100vh;margin:auto;padding:16px clamp(16px,4vw,42px) 22px;display:flex;flex-direction:column}.back{align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;width:280px;min-height:64px;padding:10px 24px;border:0;border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:1.15rem;font-weight:900;box-shadow:0 8px 17px #145ca744;text-decoration:none}.card{width:100%;flex:1;min-height:0;margin:14px auto 0;padding:clamp(22px,3.2vh,38px) clamp(18px,6vw,80px) 18px;overflow:hidden;border:2px solid #ffffffaa;border-radius:42px;background:#ffffff63;backdrop-filter:blur(10px);box-shadow:0 18px 45px #1e5b7a35;text-align:center}.eyebrow{width:max-content;max-width:100%;margin:0 auto 12px;padding:10px 30px;border-radius:999px;background:#277f82;color:#fff;font-size:clamp(.8rem,1.3vw,1.05rem);font-weight:900;letter-spacing:.02em}.card h1{margin:0;font-size:clamp(2rem,4vw,3.7rem);line-height:1.08}.instruction{margin:8px auto 12px;font-size:clamp(1rem,1.7vw,1.25rem);font-weight:900}.progress{height:12px;max-width:760px;margin:0 auto 14px;border-radius:999px;background:#ffffffe8}.progress i{display:block;height:100%;border-radius:inherit;background:#f4c866}.sheet{width:min(850px,88vw);margin:auto;padding:clamp(8px,1.5vh,14px) clamp(14px,2.5vw,30px);border:5px solid var(--guide-border);border-radius:34px;background:#ffffffe8}.canvas-wrap{height:clamp(58px,9.4vh,82px);margin-top:9px;position:relative;background:linear-gradient(var(--guide-blue),var(--guide-blue)) 0 12%/100% 3px no-repeat,linear-gradient(var(--guide-red),var(--guide-red)) 0 50%/100% 3px no-repeat,linear-gradient(var(--guide-blue),var(--guide-blue)) 0 88%/100% 3px no-repeat}.canvas-wrap:first-child{margin-top:0}.canvas-wrap canvas{position:absolute;inset:0;z-index:2;width:100%;height:100%;touch-action:none;cursor:crosshair}.canvas-wrap.locked{opacity:.55}.canvas-wrap.locked canvas{pointer-events:none}.model{position:absolute;z-index:1;top:0;left:13%;font-size:clamp(3.4rem,7vh,5rem);font-weight:900;color:#398ac533;pointer-events:none}.hint{min-height:1.4em;margin:8px 0 0;color:#527585;font-size:clamp(.84rem,1.4vw,1rem);font-weight:900}.actions{display:flex;justify-content:center;gap:18px;margin-top:13px}.button{min-width:min(330px,40vw);min-height:68px;padding:12px 24px;border:0;border-radius:999px;background:var(--teal);color:#fff;font:inherit;font-size:clamp(1.05rem,1.8vw,1.45rem);font-weight:900;cursor:pointer;box-shadow:0 7px 0 var(--teal-dark)}.button:disabled{cursor:wait;opacity:.65}.button.clear{background:#fffffff0;color:var(--teal-dark);border:4px solid var(--guide-border);box-shadow:0 5px 0 #b7d6dc}.done{display:grid;place-items:center;min-height:70%;padding:28px;color:#26784e}.done p{font-weight:900}@media(max-width:800px){.page{padding:12px}.back{width:230px;min-height:58px;font-size:1rem}.card{border-radius:30px;padding:20px 14px 14px}.sheet{width:100%}.button{min-width:220px;min-height:58px}}@media(max-width:520px){.card h1{font-size:1.75rem}.canvas-wrap{height:clamp(52px,10vh,70px)}.button{width:100%;min-width:0}.actions{gap:10px}}
    .card:has(.done){display:grid;place-items:center;padding:clamp(24px,5vh,60px);background:linear-gradient(145deg,#fffdfbe8,#e9fbf7dd)}.done{width:min(100%,520px);min-height:0;padding:clamp(30px,5vw,54px) clamp(22px,5vw,48px);border:3px solid #bfe6d8;border-radius:34px;background:#ffffffeb;box-shadow:0 18px 40px #1b74642b;color:#237a55}.done::before{content:'✓';display:grid;place-items:center;width:78px;height:78px;margin:0 auto 20px;border-radius:50%;background:#dff5e9;color:#23825a;font-size:2.8rem;font-family:Arial,sans-serif;font-weight:900;box-shadow:0 6px 0 #b9dfca}.done h1{font-size:clamp(2.5rem,5vw,4.2rem);color:#237a55}.done p{margin:15px auto 28px;max-width:350px;color:#467565;font-size:clamp(1rem,1.7vw,1.2rem);line-height:1.5}.done .button{min-width:min(100%,330px)}
    .model{font-family:Fredoka,Nunito,"Segoe UI",sans-serif}
  </style>
  <style>
    #app.card:not(:has(.done)){display:flex;flex-direction:column;justify-content:center;align-items:center}
    #app.card:not(:has(.done))>p:not(.eyebrow),#app.card:not(:has(.done))>.sheet,#app.card:not(:has(.done))>.actions{width:100%}
    #app.card:not(:has(.done))>.sheet{margin:8px auto}
    #app.card:not(:has(.done))>.eyebrow{margin:0 auto 10px}
    #app.card:not(:has(.done))>.instruction{margin:8px auto 10px}
    #app.card:not(:has(.done))>.instruction,#app.card:not(:has(.done))>.row-count{width:max-content;max-width:100%;margin:8px auto;padding:8px 18px;border-radius:999px;background:#ffffffaa;color:#405c65;font-weight:900;line-height:1.25}
    #app.card:not(:has(.done))>.hint{margin:6px 0 8px}
    #app.card:not(:has(.done))>.actions{margin-top:8px}
  </style>
</head>
<body>
  <main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card"></section></main>
  {{ handwriting_activity_data|json_script:"handwriting-data" }}
  <script>
  (() => {
    const data = JSON.parse(document.getElementById('handwriting-data').textContent || '{}');
    const app = document.getElementById('app');
    const instructionText = 'Magsanay magsulat ng Letrang Ii. Isulat nang tatlong beses ang Letrang Ii.';
    const narrationText = 'Magsanay magsulat ng letrang ay. Isulat nang tatlong beses ang letrang ay.';
    const normalHint = 'Isulat ang Ii sa bawat hanay.';
    const retryMessage = 'Subukan ulit! Isulat nang malinaw ang letrang Ii.';
    const csrf = () => document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1] || '';
    let index = Math.max(0, Math.min(3, Number(data.progress?.current_index) || 0));
    let busy = false;
    const rows = [[], [], []];
    const speak = text => fetch('{% url "reading_read_aloud_api" %}', {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8','X-CSRFToken':csrf()},body:new URLSearchParams({target_text:text,prescribed_activity_key:'lesson7-gawain2c'})}).then(r => r.ok ? r.json() : null).then(result => {if (result?.success && result.audio_content) new Audio('data:' + (result.mime_type || 'audio/mpeg') + ';base64,' + result.audio_content).play().catch(() => {})}).catch(() => {});
    const setHint = (text = normalHint) => {const hint = app.querySelector('.hint'); if (hint) hint.textContent = text};
    const retry = () => {setHint(retryMessage); speak(retryMessage.replace('letrang Ii', 'letrang ay'))};
    const point = (event, canvas) => {const rect = canvas.getBoundingClientRect(); return {x:(event.clientX - rect.left) / rect.width, y:(event.clientY - rect.top) / rect.height}};

    function bindCanvas(canvas, row) {
      const rect = canvas.getBoundingClientRect(), ratio = devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * ratio)); canvas.height = Math.max(1, Math.round(rect.height * ratio));
      const ctx = canvas.getContext('2d'); ctx.setTransform(ratio, 0, 0, ratio, 0, 0); ctx.strokeStyle = '#286b93'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      let active = null;
      const append = event => {if (!active) return; const p = point(event, canvas), last = active.points[active.points.length - 1]; if (!last || p.x !== last.x || p.y !== last.y) {active.points.push(p); ctx.lineTo(p.x * rect.width, p.y * rect.height); ctx.stroke()}};
      canvas.addEventListener('pointerdown', event => {if (busy || row !== index) return; event.preventDefault(); const p = point(event, canvas); active = {pointerId:event.pointerId, points:[p]}; rows[row].push(active.points); ctx.beginPath(); ctx.moveTo(p.x * rect.width, p.y * rect.height); canvas.setPointerCapture?.(event.pointerId)});
      canvas.addEventListener('pointermove', event => {if (active?.pointerId === event.pointerId) (event.getCoalescedEvents?.() || [event]).forEach(append)});
      const finish = event => {if (active?.pointerId !== event.pointerId) return; append(event); canvas.releasePointerCapture?.(event.pointerId); active = null};
      canvas.addEventListener('pointerup', finish); canvas.addEventListener('pointercancel', finish);
    }

    async function submitCurrent() {
      if (busy) return;
      const strokes = rows[index];
      if (!strokes.some(stroke => stroke.length >= 2)) {retry(); return}
      busy = true; app.querySelector('#next').disabled = true; app.querySelector('#clear').disabled = true;
      try {
        const response = await fetch(data.progress_url, {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({row_index:index,strokes})});
        const result = await response.json().catch(() => null);
        if (!response.ok || !result?.success) {retry(); return}
        if (index < 2) {index += 1; render(); return}
        const completion = await fetch(data.completion_url, {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});
        if (!completion.ok || !(await completion.json().catch(() => null))?.success) {retry(); return}
        index = 3; render();
      } catch (error) {retry()}
      finally {busy = false; if (index < 3) {app.querySelector('#next').disabled = false; app.querySelector('#clear').disabled = false}}
    }

    function render() {
      if (index >= 3) {app.innerHTML = '<div class="done"><h1>Magaling!</h1><p>Natapos mo ang GAWAIN 2: Letrang Ii. Ang husay mong magsulat!</p><button class="button" id="return">Bumalik sa Aking Aralin</button></div>'; app.querySelector('#return').onclick = () => location.href = "{% url 'assessment' %}"; return}
      const sheet = '<div class="canvas-wrap"><span class="model">Ⅰi</span><canvas data-row="' + index + '" aria-label="Hanay ' + (index + 1) + '"></canvas></div>';
      app.innerHTML = '<p class="eyebrow">SESSION 3 · LESSON 7 · GAWAIN 2C</p><h1>GAWAIN 2: Letrang Ii</h1><p class="instruction">' + instructionText + '</p><p class="row-count">Hanay ' + (index + 1) + ' ng 3</p><div class="progress"><i style="width:' + (index / 3 * 100) + '%"></i></div><div class="sheet">' + sheet + '</div><p class="hint">' + normalHint + '</p><div class="actions"><button class="button clear" id="clear">Burahin</button><button class="button" id="next">' + (index === 2 ? 'Tapusin' : 'Susunod') + '</button></div>';
      app.querySelectorAll('canvas').forEach(canvas => bindCanvas(canvas, Number(canvas.dataset.row)));
      app.querySelector('#clear').onclick = () => {rows[index] = []; const canvas = app.querySelector('canvas[data-row="' + index + '"]'); canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height); setHint()};
      app.querySelector('#next').onclick = submitCurrent;
    }
    render();
    speak(narrationText);
  })();
  </script>
{% include 'pabasa_app/session3_prescribed_controls.html' with prefix='prescribed-s3l7g2c' help_text='Isulat ang letrang Ii sa mga kahon.' %}</body>
</html>
