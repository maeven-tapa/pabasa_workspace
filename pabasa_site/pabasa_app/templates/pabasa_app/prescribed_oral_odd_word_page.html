{% load static %}
<!doctype html>
<html lang="fil">
<head>
  {% include 'pabasa_app/basahin_script.html' %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lesson 17 at 18: Gawain 8 | PABASA</title>
  <script>window.__gawain8OwnAudio = true;</script>
  <script defer src="{% static 'pabasa_app/js/prescribed_session6_tts.js' %}?v=gawain8-owned-audio-1"></script>
  <style>
    @font-face{font-family:Fredoka;src:url("{% static 'pabasa_app/font/fredoka-one.one-regular.ttf' %}") format('truetype');font-display:swap}
    :root{--ink:#183e63;--teal:#299e9a;--teal-dark:#187b7a;--gold:#e7af45;--line:#94d9d6;--muted:#78909b;--good:#278565;--bad:#a63b3b}
    *{box-sizing:border-box}
    body.gawain8-page{height:100svh;min-height:540px;margin:0;overflow:hidden;background:url("{% static 'pabasa_app/prescribed/PRESCRIBED-BG.jpg' %}") center/cover no-repeat;color:var(--ink);font-family:Fredoka,Nunito,"Segoe UI",sans-serif}
    .page{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;width:min(1250px,calc(100% - 32px));height:100svh;margin:auto;padding:16px 0}
    .back{display:inline-flex;align-items:center;justify-content:center;justify-self:start;z-index:3;min-width:280px;min-height:60px;padding:10px 24px;border-radius:999px;background:#fffffff2;color:var(--ink);font-size:clamp(1rem,1.5vw,1.2rem);line-height:1.15;text-align:center;text-decoration:none;box-shadow:0 8px 17px #145ca744}
    .card{display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;min-height:0;max-height:100%;padding:clamp(16px,3vh,32px) clamp(18px,5vw,72px);overflow:auto;border:2px solid #ffffffaa;border-radius:40px;background:#ffffff85;backdrop-filter:blur(10px);box-shadow:0 18px 45px #1e5b7a35;text-align:center}
    .eyebrow{margin:0 auto 8px;padding:7px 20px;border-radius:999px;background:#277f82;color:#fff;font-family:Nunito,"Segoe UI",sans-serif;font-size:clamp(.72rem,1vw,.9rem);font-weight:900;letter-spacing:.04em;text-transform:uppercase}
    h1{margin:0;color:var(--ink);font-size:clamp(1.8rem,3.4vw,3rem);line-height:1.08}h2{margin:5px 0 0;color:#277f82;font-family:Nunito,"Segoe UI",sans-serif;font-size:clamp(1rem,1.6vw,1.3rem);font-weight:1000}
    .instruction,.hint{max-width:760px;margin:9px auto 0;color:#385c6b;font-family:Nunito,"Segoe UI",sans-serif;font-size:clamp(1rem,1.35vw,1.2rem);font-weight:850;line-height:1.35}.reading-instruction{margin:12px auto 0;color:#385c6b;font:1000 clamp(1.15rem,1.65vw,1.4rem) Nunito,"Segoe UI",sans-serif;line-height:1.3}
    .intro{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}.intro .instruction{margin:4px auto 14px}.button{display:inline-flex;align-items:center;justify-content:center;min-width:min(360px,100%);min-height:66px;margin:7px 0;padding:14px 28px;border:0;border-radius:999px;background:var(--teal);box-shadow:0 6px 0 var(--teal-dark),0 10px 20px #187b7a40;color:#fff;font:900 clamp(1.05rem,1.5vw,1.25rem) Nunito,"Segoe UI",sans-serif;cursor:pointer;transition:transform .16s,background .16s}.button:hover:not(:disabled){background:#38b0aa;transform:translateY(-2px)}.button:active:not(:disabled){transform:translateY(2px)}.button:disabled{opacity:.55;cursor:wait}
    .progress{display:flex;justify-content:center;gap:12px;margin:10px auto 4px}.step{display:grid;place-items:center;width:38px;height:38px;border:3px solid #c6d9dd;border-radius:50%;background:#ffffffe8;color:var(--muted);font:900 1rem Nunito,"Segoe UI",sans-serif}.step.done{border-color:var(--teal);background:#dff5f0;color:var(--teal-dark)}.step.current{border-color:var(--gold);background:#ffe8aa;color:#684c16;box-shadow:0 0 0 4px #ffffffa8}
    .group-label{margin:7px 0 0;color:#456876;font:900 clamp(1rem,1.4vw,1.15rem) Nunito,"Segoe UI",sans-serif}.word-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.5vw,18px);width:min(820px,100%);margin:clamp(20px,3vh,32px) auto}.word{position:relative;display:flex;align-items:center;justify-content:center;min-height:clamp(86px,14vh,126px);padding:12px 8px;border:4px solid var(--line);border-radius:26px;background:#fffffff2;color:var(--ink);font:900 clamp(1.45rem,3vw,2.35rem) Fredoka,Nunito,"Segoe UI",sans-serif;transition:border-color .15s,box-shadow .15s,background .15s;overflow:visible}.word.read-target{border-color:var(--gold);box-shadow:0 0 0 6px #f8df9a,0 5px 12px #a1792b22}.word.selectable{cursor:pointer}.word.selectable:hover,.word.selectable:focus-visible{border-color:var(--gold);outline:0;box-shadow:0 0 0 4px #f8df9a}.word.selected{border-color:var(--gold);box-shadow:0 0 0 5px #f8df9a}.word.answer-correct{border-color:var(--gold);background:#fff8e5;box-shadow:0 0 0 6px #f4c75d,0 7px 16px #a1792b30}.word.answer-correct::after{position:absolute;top:-14px;right:-11px;display:grid;place-items:center;width:34px;height:34px;border:2px solid #fff;border-radius:50%;background:var(--gold);color:#fff;font:900 1.1rem Nunito,"Segoe UI",sans-serif;content:'✓'}
    .status{min-height:1.5em;margin:6px 0 0;font:900 clamp(.95rem,1.25vw,1.1rem) Nunito,"Segoe UI",sans-serif}.good{color:var(--good)}.bad{color:var(--bad)}.words-hint{min-height:1.4em;margin:0;color:#456876;font:800 1rem Nunito,"Segoe UI",sans-serif}
    .done{display:flex;flex-direction:column;align-items:center;gap:8px}.done .star{font-size:clamp(3rem,8vh,5rem)}
    .gawain8-page :focus-visible{outline:4px solid #f5d47c;outline-offset:4px}
    @media(max-width:680px){body.gawain8-page{min-height:500px}.page{width:calc(100% - 20px);padding:10px 0}.back{min-width:0;min-height:50px;padding:8px 18px;font-size:.92rem}.card{padding:16px 12px;border-radius:28px}.eyebrow{margin-bottom:6px;padding:6px 13px}.word-row{gap:7px;margin:16px auto}.word{min-height:78px;padding:8px 3px;border-width:3px;border-radius:18px;font-size:clamp(1.05rem,5vw,1.5rem)}.progress{gap:8px}.step{width:32px;height:32px;font-size:.85rem}.button{min-height:58px}}
    @media(max-width:360px){.word-row{grid-template-columns:1fr;gap:8px;width:min(280px,100%);margin:12px auto}.word{min-height:58px}.card{justify-content:flex-start}}
    @media(max-height:640px){.page{padding:8px 0}.back{min-height:44px}.card{padding:10px 18px;border-radius:28px}.eyebrow{margin-bottom:4px;padding:4px 12px;font-size:.68rem}h1{font-size:1.6rem}h2{font-size:.9rem}.instruction,.hint{margin-top:5px;font-size:.88rem}.progress{gap:7px;margin:5px auto 2px}.step{width:29px;height:29px}.group-label{margin-top:4px}.word-row{gap:8px;margin:9px auto}.word{min-height:62px;font-size:1.35rem}.button{min-height:48px;margin:4px;padding:8px 22px;font-size:.95rem}}
  </style>
</head>
<body class="gawain8-page">
  <main class="page">
    <a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a>
    <section id="app" class="card" aria-live="polite" aria-atomic="true"></section>
  </main>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script>
  (() => {
    'use strict';
    const d = JSON.parse(document.getElementById('prescribed-activity-data').textContent || '{}');
    const groups = d.groups || [];
    const app = document.getElementById('app');
    const csrf = () => ((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/) || [])[1] || '');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const setDebug = (field, value) => { const node = document.getElementById(`prescribed-s6-${d.activity_key}-debug-${field}`); if (node) node.textContent = String(value ?? 'Not available'); };
    let s = Object.assign({phase:'intro',current_group_index:0,current_oral_word_index:0,oral_completed:{},stt_attempts:{},read_aloud_plays:{},selected_answer:{},completed_answers:{},state_version:0}, d.progress?.state || {});
    let busy = false, token = 0, stream = null, player = null, cancelCurrentAudio = null, narrationGeneration = 0, introPlayed = false, feedbackAudioPending = false, lastHandoff = '';
    const key = (g,w) => `${g}:${w}`;
    const pendingFeedbackGroup = () => {
      const g = Number(s.feedback_group_index);
      return s.phase === 'correct_feedback' && Number.isInteger(g) && g >= 0 && s.completed_answers?.[String(g)] !== undefined ? g : -1;
    };
    const groupCues = ['unang_pangkat_sa_lima.mp3','ikalawang_pangkat_sa_lima.mp3','ikatlong_pangkat_sa_lima.mp3','ika_apat_na_pangkat_sa_lima.mp3','ikalimang_pangkat_sa_lima.mp3'];
    const wordPositionCues = ['unang_salit_sa_tatlo.mp3','ikalawang_salita_sa_tatlo.mp3','ikatlong_salita_sa_tatlo.mp3'];
    const wordAudio = {palaka:'salitang_babasahin_palaka_tts.mp3',peluka:'salitang_babasahin_peluka_tts.mp3',palaro:'salitang_babasahin_palaro_tts.mp3',palara:'salitang_babasahin_palara_tts.mp3',resibo:'salitang_babasahin_resibo_tts.mp3',resita:'salitang_babasahin_resita_tts.mp3',pilay:'salitang_babasahin_pilay_tts.mp3',palay:'salitang_babasahin_palay_tts.mp3',bareta:'salitang_babasahin_bareta_tts.mp3',balita:'salitang_babasahin_balita_tts.mp3'};
    const stopAudio = () => { narrationGeneration++; if (cancelCurrentAudio) cancelCurrentAudio(); else if (player) { player.pause(); player.currentTime = 0; player = null; } };
    const playFile = (filename, generation) => new Promise(resolve => {
      if (!filename || generation !== narrationGeneration) { resolve(); return; }
      const audio = new Audio(`/static/pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_8/${filename}`);
      player = audio;
      const done = () => { audio.onended = audio.onerror = audio.onpause = null; if (player === audio) player = null; if (cancelCurrentAudio === cancel) cancelCurrentAudio = null; resolve(); };
      const cancel = () => { audio.pause(); done(); };
      cancelCurrentAudio = cancel;
      audio.onended = done; audio.onerror = done; audio.onpause = done; audio.play().catch(done);
    });
    const playSequence = async files => { stopAudio(); const generation = narrationGeneration; for (const file of files) { if (generation !== narrationGeneration) return; await playFile(file, generation); } };
    const header = () => `<p class="eyebrow">Session 6 · Lesson 17 at 18 · Gawain 8</p><h1>${esc(d.title)}</h1>`;
    const progress = group => `<div class="progress" aria-label="Pangkat ${group + 1} ng 5">${groups.map((_,i) => `<span class="step ${i < group ? 'done' : i === group ? 'current' : ''}" aria-current="${i === group ? 'step' : 'false'}">${i + 1}</span>`).join('')}</div>`;
    const wordCards = (group, mode, selected, answer) => `<div class="word-row">${group.words.map((word,i) => {
      const cls = ['word'];
      if (mode === 'oral' && i === s.current_oral_word_index) cls.push('read-target');
      if (mode === 'select') cls.push('selectable', selected === i ? 'selected' : '');
      if (mode === 'correct' && answer === i) cls.push('answer-correct');
      return mode === 'select' ? `<button class="${cls.join(' ')}" type="button" data-answer="${i}" aria-pressed="${selected === i}">${esc(word)}</button>` : `<div class="${cls.join(' ')}">${esc(word)}</div>`;
    }).join('')}</div>`;
    async function save() {
      const mine = ++token;
      const response = await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:(Number(s.state_version)||0)+1}})});
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success) throw Error(result.error || 'Hindi na-save ang progress.');
      if (mine !== token) return null;
      s = result.progress.state;
      return result;
    }
    function renderIntro(message = '') {
      app.innerHTML = `<div class="intro">${header()}<p class="instruction">Basahin ang tatlong salita. Pagkatapos, piliin ang salitang naiiba.</p><p class="status bad" id="status">${esc(message)}</p><button class="button" id="start" type="button">SIMULAN</button></div>`;
      document.getElementById('start').onclick = async () => {
        if (busy) return;
        busy = true; stopAudio(); s.phase = 'oral_reading';
        try { await save(); render(); playPrompt(0,0); }
        catch (error) { s.phase = 'intro'; renderIntro(error.message); }
        finally { busy = false; }
      };
    }
    function playPrompt(groupIndex, wordIndex) {
      const word = groups[groupIndex]?.words?.[wordIndex];
      void playSequence([...(wordIndex === 0 ? [groupCues[groupIndex]] : []),wordPositionCues[wordIndex],wordAudio[word]]);
    }
    function render(message = '', kind = '') {
      if (d.progress?.activity_completed || s.phase === 'completion') { app.innerHTML = `<div class="done"><div class="star" aria-hidden="true">⭐</div>${header()}<p class="instruction">Magaling! Natapos mo ang gawain.</p><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`; return; }
      if (s.phase === 'intro') { renderIntro(message); return; }
      const feedbackGroup = pendingFeedbackGroup();
      const g = feedbackGroup >= 0 ? feedbackGroup : Math.min(groups.length - 1, Number(s.current_group_index) || 0), group = groups[g];
      if (!group) { app.innerHTML = '<p class="status bad">Walang laman ang gawaing ito.</p>'; return; }
      if (s.phase === 'oral_reading') {
        const w = Math.min(2, Number(s.current_oral_word_index) || 0), recover = (s.stt_attempts[key(g,w)] || 0) >= 3;
        app.innerHTML = `${header()}${progress(g)}<p class="reading-instruction">${recover ? 'Pakinggan muna ang salita.' : 'Basahin ang mga salita.'}</p><p class="group-label">Pangkat ${g + 1} ng ${groups.length}</p><p class="words-hint">Salita ${w + 1} ng 3</p>${wordCards(group,'oral')}<button data-basahin-button data-expected-text="${esc(group.words[w])}" class="button" id="oral" type="button">${recover ? '🔊 PAKINGGAN' : window.BasahinButton.LABEL}</button><p class="status ${kind}" id="status" aria-live="polite">${esc(message)}</p>`;
        window.Basahin.bindActivity(document.getElementById('oral'), () => recover ? listen(g,w,group.words[w]) : read(g,w,group.words[w]));
        return;
      }
      const selected = s.selected_answer[String(g)];
      if (feedbackGroup >= 0) {
        const answer = s.completed_answers[String(g)];
        app.innerHTML = `${header()}${progress(g)}<p class="group-label">Pangkat ${g + 1} ng ${groups.length}</p><p class="hint">Alin ang salitang naiiba?</p>${wordCards(group,'correct',undefined,answer)}<p class="status good" aria-live="polite">Tama! Ito ang salitang naiiba.</p>${feedbackAudioPending ? '' : `<button class="button" id="next" type="button">${g === groups.length - 1 ? 'TAPUSIN' : 'SUSUNOD'}</button>`}`;
        const next = document.getElementById('next');
        if (next) next.onclick = async () => {
          if (busy) return;
          if (g === groups.length - 1) { await finish(); return; }
          busy = true; stopAudio(); s.feedback_group_index = null; s.current_group_index = g + 1; s.current_oral_word_index = 0; s.phase = 'oral_reading';
          try { await save(); render(); playPrompt(g + 1, 0); } catch (error) { render(error.message,'bad'); } finally { busy = false; }
        };
        return;
      }
      app.innerHTML = `${header()}${progress(g)}<p class="group-label">Pangkat ${g + 1} ng ${groups.length}</p><p class="hint">Alin ang salitang naiiba?</p>${wordCards(group,'select',selected)}<button class="button" id="check" type="button" ${selected === undefined ? 'disabled' : ''}>SURIIN</button><p class="status ${kind}" id="status" aria-live="polite">${esc(message)}</p>`;
      app.querySelectorAll('[data-answer]').forEach(button => button.onclick = () => { stopAudio(); s.selected_answer[String(g)] = Number(button.dataset.answer); render(); });
      document.getElementById('check').onclick = () => answer(g);
    }
    async function read(g,w,word) {
      if (busy) return;
      busy = true; stopAudio(); const mine = ++token, button = document.getElementById('oral');
      const restoreReadButton = () => {
        if (!button?.isConnected) return;
        button.disabled = false;
        window.BasahinButton?.setState(button, 'idle');
      };
      try {
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) throw Error('Hindi available ang mikropono sa browser na ito.');
        setDebug('expected', word); setDebug('status', 'Listening'); setDebug('mic', 'Active · Unmuted'); setDebug('error', '—');
        button.disabled = true; button.textContent = 'Nakikinig…';
        stream = await window.Basahin.openMicrophone({audio:true});
        const blob = await window.Basahin.capture({button,stream,keepStream:false});
        stream?.getTracks().forEach(track => track.stop()); stream = null;
        setDebug('mic', 'Inactive · Unmuted'); setDebug('status', 'Processing');
        if (mine !== token) return;
        const form = new FormData(); form.append('audio',blob,'prescribed-reading.webm'); form.append('target_text',word); form.append('language','Filipino'); form.append('mode','reading');
        const response = await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form});
        const result = await response.json();
        restoreReadButton();
        const transcript = result.raw_transcript || result.transcript || '';
        setDebug('status', 'STT complete'); setDebug('result', `${transcript || 'No transcript returned'} · ${response.ok && result.success && result.complete === true ? 'Correct' : 'Incorrect / incomplete'}`); setDebug('error', response.ok && !result.error ? '—' : (result.error || `HTTP ${response.status}`));
        if (mine !== token) return;
        if (response.ok && result.success && result.complete === true) {
          s.oral_completed[String(g)] = [...(s.oral_completed[String(g)] || []),w]; s.current_oral_word_index = w + 1;
          s.stt_attempts[key(g,w)] = 0; s.read_aloud_plays[key(g,w)] = 0;
          s.phase = w === 2 ? 'written_selection' : 'oral_reading';
          await save(); render('Tama ang pagbasa!','good');
          if (w < 2) {
            const nextWord = groups[g].words[w + 1];
            void playSequence(['magaling_tama_ang_nabasa_mo_tts.mp3',wordPositionCues[w + 1],wordAudio[nextWord]]);
          } else {
            void playSequence(['magaling_tama_ang_nabasa_mo_tts.mp3']);
          }
        } else {
          s.stt_attempts[key(g,w)] = Math.min(3,(s.stt_attempts[key(g,w)] || 0) + 1); await save();
          const feedback = s.stt_attempts[key(g,w)] >= 3 ? 'Pakinggan muna ang salita.' : 'Hindi pa. Subukan muli.';
          render(feedback,'bad');
          void playSequence([s.stt_attempts[key(g,w)] >= 3 ? 'pakinggan_muna_ang_salita_tts.mp3' : 'hindi_pa_tama_tts.mp3']);
        }
      } catch (error) {
        setDebug('mic', 'Inactive · Unmuted'); setDebug('status', 'Error'); setDebug('error', error.message || 'Reading failed');
        if (mine === token) { if (!window.Basahin.isCaptureError(error)) s.stt_attempts[key(g,w)] = Math.min(3,(s.stt_attempts[key(g,w)] || 0) + 1); try { await save(); } catch (_) {} render(error.message || 'Hindi nakuha ang boses. Subukan muli.','bad'); }
      } finally { stream?.getTracks().forEach(track => track.stop()); stream = null; restoreReadButton(); busy = false; }
    }
    async function listen(g,w,word) {
      if (busy) return;
      busy = true; stopAudio(); const generation = narrationGeneration, button = document.getElementById('oral');
      try {
        setDebug('expected', word);
        button.disabled = true; button.textContent = 'Nilo-load…';
        const form = new FormData(); form.append('text',word); form.append('language','Filipino'); form.append('prescribed_activity_key',d.activity_key);
        const response = await fetch(d.read_aloud_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}); const result = await response.json();
        if (generation !== narrationGeneration) return;
        if (!response.ok || !result.success || !result.audio_content) throw Error(result.error || 'Hindi available ang audio.');
        const source = URL.createObjectURL(new Blob([Uint8Array.from(atob(result.audio_content),c => c.charCodeAt(0))],{type:result.mime_type || 'audio/mpeg'}));
        await new Promise(resolve => { const audio = new Audio(source); player = audio; const done = () => { audio.onended = audio.onerror = audio.onpause = null; if (player === audio) player = null; if (cancelCurrentAudio === cancel) cancelCurrentAudio = null; URL.revokeObjectURL(source); resolve(); }; const cancel = () => { audio.pause(); done(); }; cancelCurrentAudio = cancel; audio.onended = done; audio.onerror = done; audio.onpause = done; audio.play().catch(done); });
        if (generation !== narrationGeneration) return;
        s.read_aloud_plays[key(g,w)] = Math.min(3,(s.read_aloud_plays[key(g,w)] || 0) + 1);
        if (s.read_aloud_plays[key(g,w)] >= 3) { s.stt_attempts[key(g,w)] = 0; s.read_aloud_plays[key(g,w)] = 0; }
        await save(); render(s.stt_attempts[key(g,w)] ? 'Pakinggan muli ang salita.' : 'Subukan mong basahin ang salita.', s.stt_attempts[key(g,w)] ? 'good' : '');
      } catch (error) { render(error.message || 'Hindi available ang audio. Subukan muli.','bad'); }
      finally { busy = false; }
    }
    async function replayAnswerFeedback() {
      if (pendingFeedbackGroup() < 0) return;
      feedbackAudioPending = true; render();
      await playSequence(['tama_nabilugan_mo_ang_salitang_naiiba_tts.mp3']);
      feedbackAudioPending = false; render();
    }
    async function answer(g) {
      if (busy) return;
      const selected = s.selected_answer[String(g)], correct = groups[g].answer_index;
      if (selected !== correct) {
        delete s.selected_answer[String(g)]; render('Subukan muli.','bad'); void playSequence(['hindi_pa_tama_tts.mp3']); return;
      }
      busy = true; stopAudio(); s.completed_answers[String(g)] = selected; delete s.selected_answer[String(g)]; s.feedback_group_index = g; s.current_group_index = g + 1; s.phase = 'correct_feedback';
      try { await save(); await replayAnswerFeedback(); }
      catch (error) { s.phase = 'written_selection'; delete s.completed_answers[String(g)]; s.feedback_group_index = null; render(error.message,'bad'); }
      finally { busy = false; }
    }
    async function finish() {
      if (busy) return;
      busy = true; stopAudio(); s.feedback_group_index = null; s.phase = 'completion';
      try { const response = await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'}); const result = await response.json().catch(() => ({})); if (!response.ok || !result.success) throw Error(result.error || 'Hindi na-save ang pagtatapos.'); d.progress.activity_completed = true; render(); void playSequence(['magaling_tama_ang_nabasa_mo_tts.mp3']); }
      catch (error) { s.phase = 'correct_feedback'; render(error.message,'bad'); }
      finally { busy = false; }
    }
    const resumeFromHandoff = () => {
      const feedbackGroup = pendingFeedbackGroup();
      const signature = [s.phase, s.current_group_index, s.current_oral_word_index, feedbackGroup].join(':');
      if (signature === lastHandoff) return;
      lastHandoff = signature;
      if (s.phase === 'intro' && !introPlayed) { introPlayed = true; void playSequence(['basahin_bilugan_naiiba_sa_pangkat_tts.mp3']); }
      else if (feedbackGroup >= 0) void replayAnswerFeedback();
      else if (s.phase === 'oral_reading') playPrompt(Number(s.current_group_index) || 0, Number(s.current_oral_word_index) || 0);
      else if (s.phase === 'written_selection') void playSequence(['basahin_bilugan_naiiba_sa_pangkat_tts.mp3']);
    };
    addEventListener('lesson-start-ready', resumeFromHandoff);
    addEventListener('session6-prescribed-resume', event => { if (event.detail?.prefix) resumeFromHandoff(); });
    addEventListener('session6-prescribed-cancel', event => { stopAudio(); lastHandoff = ''; if (event.detail?.reason === 'pause' && s.phase === 'intro') introPlayed = false; token++; stream?.getTracks().forEach(track => track.stop()); stream = null; busy = false; });
    addEventListener('pagehide', () => { stopAudio(); stream?.getTracks().forEach(track => track.stop()); });
    render();
  })();
  </script>
  {% include "pabasa_app/includes/session6_prescribed_controls.html" %}
  <script>
  (() => {
    'use strict';
    const data = JSON.parse(document.getElementById('prescribed-activity-data')?.textContent || '{}');
    if (data.activity_key !== 'lesson-17-18-gawain-8' || data.progress?.activity_completed) return;
    const modalId = 'session6-start-lesson-17-18-gawain-8';
    if (document.getElementById(modalId)) return;
    const state = data.progress?.state || {};
    const saved = Number(data.progress?.completed_items) > 0 || Number(data.progress?.correct_items) > 0 ||
      Number(state.current_group_index) > 0 || Number(state.current_oral_word_index) > 0 ||
      state.phase === 'written_selection' || state.phase === 'correct_feedback' || state.phase === 'completion' ||
      Object.values(state.oral_completed || {}).some(words => Array.isArray(words) && words.length > 0) ||
      Object.keys(state.completed_answers || {}).length > 0;
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const modal = document.createElement('div');
    modal.className = 'lesson-start-backdrop lesson-13-start-backdrop';
    modal.id = modalId;
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-labelledby', `${modalId}-title`);
    modal.innerHTML = `<div class="lesson-start-modal lesson-13-start-modal"><p class="lesson-start-label lesson-13-start-label">${saved ? 'MAY NA-SAVE KANG PROGRESO!' : 'SESSION 6 · LESSON 17 AT 18 · GAWAIN 8'}</p><h2 class="lesson-start-title lesson-13-start-title" id="${modalId}-title">${saved ? 'May nasimulan ka nang gawain. Gusto mo bang ipagpatuloy ang iyong nasimulan?' : escapeHtml(data.title)}</h2><div class="lesson-start-actions lesson-13-start-actions"><button type="button" data-g8-start>${saved ? 'IPAGPATULOY' : 'SIMULAN'}</button><button type="button" data-g8-later>${saved ? 'SIMULAN ULIT' : 'MAMAYA NA LANG'}</button></div></div>`;
    const close = () => {
      window.__session6IntroReady = true;
      window.__session6IntroModalOpen = false;
      modal.remove();
      document.body.classList.remove('lesson-start-open');
      window.dispatchEvent(new Event('lesson-start-ready'));
      window.dispatchEvent(new Event('session6-prescribed-resume'));
    };
    modal.querySelector('[data-g8-start]').onclick = close;
    modal.querySelector('[data-g8-later]').onclick = async () => {
      if (!saved) { window.location.href = '{% url "assessment" %}'; return; }
      const response = await fetch(data.progress_url, {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/) || [])[1] || '')},body:JSON.stringify({reset:true})});
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success) throw Error(result.error || 'Hindi na-reset ang gawain.');
      window.location.reload();
    };
    document.body.prepend(modal);
    document.body.classList.add('lesson-start-open');
    modal.querySelector('[data-g8-start]').focus();
  })();
  </script>
