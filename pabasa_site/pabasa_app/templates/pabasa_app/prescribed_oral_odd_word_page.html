<script>
(()=>{
  // Superseded by prescribed_session6_tts.js.  Keep this legacy block inert
  // until it can be removed with the malformed historical markup around it.
  return;
  const app=document.getElementById('app'),data=document.getElementById('prescribed-activity-data');
  if(!app||!data)return;
  const activity=JSON.parse(data.textContent||'{}'),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||'');
  let narration=null,narrating=false;
  const say=async text=>{
    if(!text||narrating)return;
    narrating=true;
    try{
      narration?.pause();
      const response=await fetch(activity.read_aloud_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8','X-CSRFToken':csrf()},body:new URLSearchParams({target_text:text,language:'Filipino',mode:'reading',prescribed_activity_key:activity.activity_key})});
      const result=await response.json().catch(()=>null);
      if(!response.ok||!result?.success||!result.audio_content)return;
      const audio=new Audio(`data:${result.mime_type||'audio/mpeg'};base64,${result.audio_content}`);narration=audio;
      await new Promise(resolve=>{audio.onended=resolve;audio.onerror=resolve;audio.play().catch(resolve)});
    }finally{narrating=false;narration=null}
  };
  const mountInstructionButton=()=>{
    const instruction=app.querySelector('.instruction');
    if(!instruction||app.querySelector('#listen-instruction'))return;
    const tools=document.createElement('div'),button=document.createElement('button');
    tools.className='activity-tools';button.className='listen-button';button.id='listen-instruction';button.type='button';button.textContent='🔊 Pakinggan ang panuto';
    button.addEventListener('click',async()=>{button.disabled=true;await say(instruction.textContent.trim());button.disabled=false});
    tools.append(button);instruction.after(tools);
  };
  const narrateInstruction=()=>say([app.querySelector('.instruction')?.textContent,app.querySelector('.hint')?.textContent].filter(Boolean).join(' '));
  mountInstructionButton();
  app.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.id==='start'||button.id==='next'){mountInstructionButton();narrateInstruction();return}
    if(button.id==='check'){
      const selected=Number(app.querySelector('[data-answer].selected')?.dataset.answer),words=[...app.querySelectorAll('[data-answer]')].map(choice=>choice.textContent.trim()),group=activity.groups?.find(item=>item.words.every((word,index)=>word===words[index]));
      if(group&&Number.isInteger(selected))say(selected===group.answer_index?'Tama! Bilog ang salitang naiiba.':'Subukan muli.');
    }
  },true);
  addEventListener('pagehide',()=>narration?.pause());
})();
