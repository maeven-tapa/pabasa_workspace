{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Interview | PABASA</title><style>@font-face{font-family:R;src:url('{% static "pabasa_app/font/Righteous-Regular.ttf" %}')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:R;background:#201635}.set{height:100dvh;padding:clamp(14px,2.5vw,34px);color:#fff;background:url('{% static "pabasa_app/images/story_response/bg.jpg" %}') center/cover no-repeat}.show{height:100%;max-width:1240px;margin:auto;display:flex;flex-direction:column}.brand{font-size:clamp(.8rem,1.5vw,1.1rem);letter-spacing:.13em;text-shadow:0 2px 3px #0008}.segment{margin:.15rem 0;font-size:clamp(1.1rem,2.2vw,1.75rem)}.story{margin:0;color:#fff1b9;font-size:clamp(.9rem,1.6vw,1.2rem)}.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,1fr) minmax(330px,.78fr);align-items:center;gap:clamp(18px,5vw,70px)}.tv{position:relative;width:min(680px,100%);justify-self:center;aspect-ratio:1.52}.tvframe{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;pointer-events:none}.screen{position:absolute;z-index:1;left:14%;top:20%;width:61%;height:54%;display:grid;place-items:end center;overflow:hidden;border-radius:9% 8% 10% 9%;background:radial-gradient(circle at 50% 20%,#6dc0df,#183f67 62%,#10253f)}.host{max-height:105%;max-width:90%;object-fit:contain;filter:drop-shadow(0 5px 4px #0008)}.onair{position:absolute;z-index:3;top:12%;left:17%;padding:4px 8px;border-radius:5px;background:#df3f44;color:#fff;font-size:clamp(.55rem,1vw,.75rem);letter-spacing:.08em}.hostlabel{position:absolute;z-index:3;bottom:24%;left:20%;padding:4px 8px;background:#182a45e8;font-size:clamp(.55rem,1vw,.75rem);letter-spacing:.08em}.talk{align-self:center}.asks{margin:0 0 .5rem;color:#fff7c9;font-size:clamp(.75rem,1.3vw,.95rem);letter-spacing:.12em;text-shadow:0 2px 3px #0008}.prompt{margin:0;color:#fff;font-size:clamp(1.5rem,3.2vw,2.7rem);line-height:1.22;text-shadow:0 3px 5px #0009}.turn{margin:clamp(20px,4vh,42px) 0 .6rem;color:#ffe177;font-size:clamp(1rem,1.8vw,1.4rem);letter-spacing:.1em;text-shadow:0 2px 3px #0008}.btn{font-family:R;cursor:pointer;border:0;border-radius:12px;padding:.8rem 1rem}.answer{display:inline-flex;align-items:center;gap:10px;min-height:58px;background:#ef5e52;color:#fff;border-bottom:5px solid #a8393d;font-size:clamp(1.05rem,1.9vw,1.35rem);box-shadow:0 7px 14px #30152866}.hear{display:block;margin-top:13px;background:#fff4ca;color:#554e52;border:1px solid #c8983d;font-size:.85rem}.recording,.processing,.playback{display:none;margin-top:14px}.recording.show,.processing.show,.playback.show{display:block}.recording{color:#fff;font-size:1rem;text-shadow:0 2px 3px #000}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f33}.time{font-size:1.4rem}.playback{width:min(100%,350px);padding:12px;background:#fff4ca;color:#453153;border-radius:12px}.row{display:grid;grid-template-columns:42px 1fr;gap:8px}.play{border:0;border-radius:8px;background:#f1b941}.progress{width:100%}.again{margin-top:8px;background:#8066ab;color:#fff}.back{color:#fff;text-decoration:none;font-size:.85rem;text-shadow:0 2px 3px #0008}@media(max-width:760px){.set{padding:14px}.stage{grid-template-columns:1fr;gap:0;align-content:center}.tv{width:min(500px,92vw);max-height:52vh}.talk{text-align:center}.prompt{font-size:clamp(1.25rem,5vw,1.85rem)}.turn{margin:12px 0 .4rem}.answer{min-height:48px}.back{margin-top:8px}}@media(max-height:620px){.tv{width:min(530px,60vw)}.turn{margin:10px 0}.answer{min-height:46px}}</style></head><body><main class="set"><section class="show"><header><div class="brand">STORYTIME ADVENTURES</div><h1 class="segment">STORY INTERVIEW</h1><p class="story" id="story"></p></header><section class="stage"><div class="tv"><div class="screen"><img id="avatar" class="host" src="{% static 'pabasa_app/images/story_response/female_idle.png' %}" alt="Story host"></div><img class="tvframe" src="{% static 'pabasa_app/images/story_response/tv.png' %}" alt=""><span class="onair">● ON AIR</span><span class="hostlabel">STORY HOST</span></div><section class="talk"><p class="asks">HOST ASKS:</p><p class="prompt" id="prompt"></p><p class="turn" id="state">YOUR TURN!</p><div id="recording" class="recording"><span class="dot"></span> RECORDING<div id="timer" class="time">00:00</div></div><div id="processing" class="processing">The host is listening...</div><div id="playback" class="playback"><b>Your Answer</b><div class="row"><button id="play" class="play">▶</button><input id="progress" class="progress" type="range" min="0" max="0" value="0"></div><span id="current">0:00</span> / <span id="total">0:00</span><button id="again" class="btn again">↻ Record Again</button></div><div id="stack"><button id="record" class="btn answer" hidden>🎙 Answer Now</button><button id="hear" class="btn hear" hidden>🔊 Hear Question</button></div></section></section><a id="back" class="back" href="{% url 'assessment' %}">← Back to Activities</a></section></main><script>const a={{story_response_data|safe}},P='{% static "pabasa_app/images/story_response/" %}',A={female:{idle:P+'female_idle.png',listening:P+'female_listening.png',thinking:P+'female_thinking.png',speaking:P+'female_speaking.png'},male:{idle:P+'male_idle.png',listening:P+'male_listening.png',thinking:P+'male_thinking.png',speaking:P+'male_speaking.png'}},$=x=>document.getElementById(x);let r,s,c=[],t,url,audio;function state(x){$('avatar').src=A[a.student_avatar_set==='male'?'male':'female'][x];$('state').textContent=x==='speaking'?'YOUR TURN — SPEAK!':x==='thinking'?'THE HOST IS LISTENING...':'YOUR TURN!'}function ui(x){$('recording').classList.toggle('show',x==='rec');$('processing').classList.toggle('show',x==='think');$('playback').classList.toggle('show',x==='review');$('stack').hidden=x==='think'||x==='review';$('record').textContent=x==='rec'?'⏹ Stop Recording':'🎙 Answer Now'}function f(n){return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}async function rec(){if(r?.state==='recording'){clearInterval(t);state('thinking');ui('think');r.stop();return}try{s=await navigator.mediaDevices.getUserMedia({audio:true});c=[];r=new MediaRecorder(s);r.ondataavailable=e=>c.push(e.data);r.onstop=()=>{s.getTracks().forEach(x=>x.stop());url=URL.createObjectURL(new Blob(c));audio=new Audio(url);audio.onloadedmetadata=()=>{$('progress').max=audio.duration;$('total').textContent=f(audio.duration)};audio.ontimeupdate=()=>{$('progress').value=audio.currentTime;$('current').textContent=f(audio.currentTime)};state('idle');ui('review')};r.start();let q=Date.now();t=setInterval(()=>$('timer').textContent=f((Date.now()-q)/1000),250);state('speaking');ui('rec')}catch(e){alert('Please allow microphone access to record your answer.')}}$('story').textContent=a.source_story_title||'';$('prompt').textContent=a.response_prompt||'What would you like to share about the story?';$('back').href=a.return_url||'{% url "assessment" %}';$('hear').hidden=!a.read_aloud_enabled;$('record').hidden=!a.voice_recording_enabled;state('idle');ui('ready');$('hear').onclick=()=>{state('listening');let u=new SpeechSynthesisUtterance(a.response_prompt);u.lang=String(a.language).toLowerCase().startsWith('fil')?'fil-PH':'en-US';u.onend=()=>state('idle');speechSynthesis.speak(u)};$('record').onclick=rec;$('again').onclick=()=>{audio?.pause();state('idle');ui('ready')};$('play').onclick=()=>audio?.play();$('progress').oninput=e=>audio&&(audio.currentTime=e.target.value)</script></body></html>

<style>

.set{overflow:hidden;background:#182f64;}
.set:before{content:'';position:absolute;z-index:0;inset:-18px;pointer-events:none;background:linear-gradient(110deg,rgba(13,36,86,.36),rgba(94,165,205,.12) 54%,rgba(255,198,133,.18)),url('{% static "pabasa_app/images/story_response/bg.jpg" %}') center/cover no-repeat;filter:blur(6px);transform:scale(1.035);}
.set:after{z-index:0;background:radial-gradient(ellipse at center,transparent 28%,rgba(7,25,71,.28) 100%);}
.show>header{padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;}
.brand{font-size:0;letter-spacing:0;}.brand:after{content:'THE STORYVENTURE';font-size:clamp(1.15rem,2.3vw,1.75rem);letter-spacing:.08em;color:#fff4bc;text-shadow:0 2px 4px rgba(5,18,57,.72);}.segment{display:none;}
.stage{grid-template-columns:minmax(460px,1.35fr) minmax(340px,.75fr);gap:clamp(14px,2.5vw,38px);}

.host{width:auto;height:115%;max-height:115%;max-width:108%;transform:translateY(5%);}
.hostlabel{font-size:clamp(.78rem,1.15vw,1rem);}
.talk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(500px,40vw);max-width:none;aspect-ratio:1;padding:21% 11% 33%;overflow:hidden;border:0;border-radius:0;background:url('{% static "pabasa_app/images/story_response/bubble4.png" %}') center/contain no-repeat;box-shadow:none;filter:drop-shadow(0 10px 12px rgba(6,19,49,.24));backdrop-filter:none;-webkit-backdrop-filter:none;transform:translateX(clamp(-78px,-4.5vw,-40px));}
.talk:before{display:none;content:none;}
.asks{display:none;}
.prompt{margin:0;padding:0;border:0;border-radius:0;background:transparent;color:#1e3550;font-size:clamp(1rem,1.65vw,1.45rem);line-height:1.24;text-align:center;box-shadow:none;text-shadow:none;}
#stack:not([hidden]){display:flex;flex-direction:row;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(8px,1vw,12px);max-width:100%;min-width:0;box-sizing:border-box;margin-top:clamp(12px,1.6vw,18px);}
#stack .story-response-action{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:40px;min-width:0;margin:0;padding:.45rem .7rem;border:1px solid #c8983d;border-bottom-width:4px;border-radius:12px;font-family:R;font-size:clamp(.78rem,1vw,.9rem);font-weight:400;line-height:1.2;text-align:center;box-shadow:0 5px 10px rgba(48,21,40,.2);transition:transform .15s ease,box-shadow .15s ease;}
#finish{margin-left:8px;background:#54c2f0;color:#15324a;}
#stack .story-response-action:hover{transform:translateY(-1px);box-shadow:0 7px 12px rgba(48,21,40,.25);}
#stack .story-response-action:active{transform:translateY(2px);box-shadow:0 2px 5px rgba(48,21,40,.2);}
#stack .answer{order:2;background:#e94f52;border-color:#9f3439;color:#fff;}
#stack .hear{order:1;background:#fff4ca;color:#554e52;}
#stack .answer[hidden],#stack .hear[hidden]{display:none;}
.recording,.processing,.playback{order:2;align-self:center;}
.story-response-state{width:100%;height:auto;max-width:100%;min-width:0;min-height:0;flex:0 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.2vw,14px);box-sizing:border-box;}
.story-response-state>.recording,.story-response-state>.processing,.story-response-state>.playback{margin:0;max-width:100%;min-width:0;box-sizing:border-box;text-align:center;}

.story-response-state>.playback .again{margin-top:6px;}

@media(max-height:620px) and (min-width:761px){.tv{width:min(560px,46vw)}.talk{width:min(370px,38vw)}.prompt{font-size:clamp(.88rem,1.45vw,1.05rem)}#stack:not([hidden]){margin-top:7px}.turn{margin-top:6px}}
</style>
<form class="d-none">{% csrf_token %}</form>
<script>
document.querySelector('.hostlabel').textContent='STORY EXPLORER';
document.querySelector('.turn')?.remove();
state=x=>{$('avatar').src=A[a.student_avatar_set==='male'?'male':'female'][x]};
document.querySelectorAll('#stack .btn').forEach(button=>button.classList.add('story-response-action'));
const speechBubble=document.querySelector('.talk');
const responseState=document.createElement('div');
responseState.className='story-response-state';
['prompt','stack','recording','processing','playback'].forEach(id=>responseState.append($(`${id}`)));
speechBubble.replaceChildren(responseState);
const timeDisplay=document.createElement('div');
timeDisplay.className='time-display';
timeDisplay.append($('current'),document.createTextNode(' / '),$('total'));
$('again').before(timeDisplay);
Array.from($('playback').childNodes).filter(node=>node.nodeType===Node.TEXT_NODE&&node.textContent.includes('/')).forEach(node=>node.remove());
const setResponseActionLabels=()=>{$('hear').textContent='🔊 Hear';if(r?.state!=='recording')$('record').textContent='🎙 Answer';};
const renderResponseUi=ui;
ui=x=>{renderResponseUi(x);responseState.dataset.phase=x;$('prompt').hidden=x==='think'||x==='review';if(x==='ready'){$('hear').hidden=!a.read_aloud_enabled;$('record').hidden=!a.voice_recording_enabled}else if(x==='rec'){$('hear').hidden=true;$('record').hidden=false}setResponseActionLabels();};
setResponseActionLabels();
const finishButton=document.createElement('button');
finishButton.id='finish';
finishButton.className='btn again';
finishButton.type='button';
finishButton.textContent='Finish';
const responseActions=document.createElement('div');
responseActions.className='story-response-actions';
const againButton=$('again');
againButton.replaceWith(responseActions);
responseActions.append(againButton,finishButton);
finishButton.addEventListener('click',async()=>{
	if(!c.length||finishButton.disabled)return;
	finishButton.disabled=true;
	finishButton.textContent='Saving...';
	try{
		const blob=new Blob(c,{type:'audio/webm'});
		const form=new FormData();
		form.append('material_id',String(a.material_id||a.id));
		form.append('response_text','');
		form.append('duration_seconds','0');
		form.append('audio',blob,`story-response-${Date.now()}.webm`);
		const csrfToken=document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';
		const response=await fetch('/api/story-response/submit/',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':decodeURIComponent(csrfToken)},body:form});
		const result=await response.json().catch(()=>({}));
		if(!response.ok||!result.success)throw new Error(result.error||'Your response could not be submitted. Please try again.');
		audio?.pause();
		responseState.innerHTML='<div class="story-response-submitted"><h2>🎉 Response Submitted!</h2><p>Great job! Your response has been submitted.</p><strong>🎙️ Recording Saved</strong><p>Status: Waiting for Teacher Review</p><small>Your teacher will listen to your response and review your answer.</small></div>';
	}catch(error){
		finishButton.disabled=false;
		finishButton.textContent='Finish';
		const feedback=document.createElement('div');
		feedback.className='submission-error';
		feedback.textContent=error.message;
		$('playback').appendChild(feedback);
	}
});
</script>
