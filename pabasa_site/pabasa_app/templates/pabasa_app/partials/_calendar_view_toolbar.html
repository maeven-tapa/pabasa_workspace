<div class="calendar-toolbar">
            <div class="calendar-toolbar-group">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="{{ calendar_controls_prefix }}Prev{{ calendar_controls_suffix }}">Previous</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="{{ calendar_controls_prefix }}Today{{ calendar_controls_suffix }}">Today</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="{{ calendar_controls_prefix }}Next{{ calendar_controls_suffix }}">Next</button>
            </div>
            <span class="calendar-month-title" id="{{ calendar_title_id }}" aria-live="polite">Month</span>
            <div class="calendar-toolbar-group" aria-label="Calendar view selector">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="{{ calendar_controls_prefix }}Month{{ calendar_controls_suffix }}">Month</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="{{ calendar_controls_prefix }}Week{{ calendar_controls_suffix }}">Week</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="{{ calendar_controls_prefix }}Year{{ calendar_controls_suffix }}">Year</button>
            </div>
        </div>
