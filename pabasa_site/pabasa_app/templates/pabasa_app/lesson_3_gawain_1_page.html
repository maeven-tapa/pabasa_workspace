<script>
// Completion is silent: stop any narration already in flight and block queued audio.
(function () {
  const game = document.getElementById('game');
  if (!game) return;
  const stopOnCompletion = () => {
    if (!game.querySelector('.complete')) return;
    window.__lesson3CompletionReached = true;
    window.speechSynthesis?.cancel();
    window.__lesson3StopAudio?.();
  };
  new MutationObserver(stopOnCompletion).observe(game, { childList: true, subtree: true });
  stopOnCompletion();
})();
</script>

      configurable: true,
      get: () => document.getElementById('status'),
    });
  } catch (error) {
    console.warn('Lesson 3 status binding could not be installed', error);
  }
})();

<script>
(function () {
  const game = document.getElementById('game');
  if (!game || window.__lesson3ReadAloudControlsInstalled) return;
  window.__lesson3ReadAloudControlsInstalled = true;

  const readAloudUrl = "{% url 'reading_read_aloud_api' %}";
  const csrf = () => document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1] || '';
  const wordAudioBase = "{% static 'pabasa_app/prescribed/audio/SESSION 1/LESSON 3/GAWAIN 1/' %}";
  const wordAudioFiles = { MAIS: 'mais.mp3', LAPIS: 'lapis.mp3', BATA: 'bata.mp3', MATA: 'mata.mp3', TASA: 'tasa.mp3', PAGONG: 'pagong.mp3', WALO: 'walo.mp3', TATLO: 'tatlo.mp3', BAKA: 'baka.mp3', BABOY: 'baboy.mp3', KAHON: 'kahon.mp3', DAHON: 'dahon.mp3' };
  const nativeFetch = window.fetch.bind(window);
  const readAloudEndpoint = new URL(readAloudUrl, window.location.href).href;
  window.fetch = function (input, init = {}) {
    const requestUrl = typeof input === 'string' ? new URL(input, window.location.href).href : input?.url;
    if (requestUrl === readAloudEndpoint) {
      const headers = new Headers(init.headers || {});
      if (headers.get('X-Lesson3-Narration') !== 'controller') {
        return Promise.resolve({ ok: false, status: 204, json: async () => ({ success: false }) });
      }
    }
    return nativeFetch(input, init);
  };
  let introFinished = false;
  let introStarted = false;
  let narrationPhase = 'boot';
  let narrationBusy = false;
  let feedbackToken = 0;
  let previousPair = '';
  let previousActiveWord = '';
  let previousWarning = '';

  const currentWord = () => game.querySelector('.word.active img')?.alt || '';
  const pairKey = () => game.querySelector('.progress')?.textContent?.trim() || '';
  const readButton = () => game.querySelector('#read');
  const status = () => game.querySelector('#status');

  async function readAloud(text, audioUrl) {
    if (!text) return false;
    if (audioUrl) {
      const audio = new Audio(audioUrl);
      await new Promise(resolve => { audio.onended = resolve; audio.onerror = resolve; audio.play().catch(resolve); });
      return true;
    }
    window.speechSynthesis?.cancel();
    const response = await fetch(readAloudUrl, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'X-CSRFToken': csrf(),
        'X-Lesson3-Narration': 'controller',
      },
      body: new URLSearchParams({ target_text: text, language: 'Filipino', mode: 'word' }),
    });
    const data = await response.json();
    if (!response.ok || !data.success || !data.audio_content) return false;
    const audio = new Audio(`data:${data.mime_type || 'audio/mpeg'};base64,${data.audio_content}`);
    await new Promise((resolve) => {
      audio.onended = resolve;
      audio.onerror = resolve;
      audio.play().catch(resolve);
    });
    return true;
  }

  function ensureControls() {
    const read = readButton();
    if (!read) return null;
    let actions = game.querySelector('.lesson3-read-actions');
    if (!actions) {
      actions = document.createElement('div');
      actions.className = 'lesson3-read-actions';
      read.parentNode.insertBefore(actions, read);
      actions.appendChild(read);
    }
    let listen = actions.querySelector('#prescribed-listen');
    if (!listen) {
      listen = document.createElement('button');
      listen.id = 'prescribed-listen';
      listen.type = 'button';
      listen.textContent = '🔊 Pakinggan';
      actions.appendChild(listen);
      listen.addEventListener('click', async () => {
        if (narrationBusy || listen.disabled) return;
        const word = currentWord();
        if (!word) return;
        narrationBusy = true;
        syncControls();
        try { await readAloud(word, wordAudioFiles[word] ? wordAudioBase + wordAudioFiles[word] : ''); } catch (error) { console.error('Lesson 3 Pakinggan failed', error); }
        narrationBusy = false;
        syncControls();
      });
    }
    return listen;
  }

  function syncControls() {
    const read = readButton();
    const listen = ensureControls();
    if (!read || !listen) return;
    const locked = narrationBusy;
    const readIsRecording = read.classList.contains('is-recording') || read.classList.contains('is-processing');
    if (locked) {
      if (read.textContent !== '🎙 Sabihin ngayon') read.textContent = '🎙 Sabihin ngayon';
      read.disabled = true;
    } else if ((narrationPhase === 'ready' || read.dataset.pictureFlowReady === '1') && !readIsRecording) {
      if (read.textContent !== '🎙 Basahin ngayon') read.textContent = '🎙 Basahin ngayon';
      read.disabled = false;
    }
    if (listen.disabled !== locked) listen.disabled = locked;
    const ariaBusy = locked ? 'true' : 'false';
    if (read.getAttribute('aria-busy') !== ariaBusy) read.setAttribute('aria-busy', ariaBusy);
  }

  async function speakFeedback(text, retry) {
    const currentToken = ++feedbackToken;
    const target = status();
    if (!target) return;
    target.textContent = text;
    target.dataset.feedbackControllerText = text;
    target.classList.add('lesson3-feedback');
    target.classList.toggle('retry', Boolean(retry));
    if (retry) target.classList.remove('warning');
    if (retry) game.querySelectorAll('.answer').forEach(button => { button.disabled = true; });
    narrationBusy = true;
    syncControls();
    try { await readAloud(text); } catch (error) { console.error('Lesson 3 feedback narration failed', error); }
    if (currentToken !== feedbackToken) return;
    narrationBusy = false;
    syncControls();
    if (retry && typeof wi !== 'undefined' && wi >= 2) {
      game.querySelectorAll('.answer').forEach(button => { button.disabled = false; });
    }
    const next = status();
    if (next && next.classList.contains('lesson3-feedback') && !next.classList.contains('retry')) {
      next.textContent = `Basahin ang ${currentWord()}.`;
      next.classList.remove('lesson3-feedback');
    }
  }
  window.__lesson3SpeakFeedback = speakFeedback;

  async function startIntro() {
    if (window.__lesson3PictureFlowInstalled || introStarted || narrationBusy) return;
    const read = readButton();
    if (!read) return;
    introStarted = true;
    introFinished = false;
    narrationPhase = 'narrating';
    narrationBusy = true;
    syncControls();
    try {
      await readAloud('Tingnan ang kumikislap na larawan. Sabihin ang pangalan nito at pakinggan ang iyong sarili.');
      await readAloud('Sabihin ito.');
    } catch (error) { console.error('Lesson 3 intro narration failed', error); }
    narrationBusy = false;
    introFinished = true;
    narrationPhase = 'ready';
    syncControls();
  }

  function inspectState() {
    const listen = ensureControls();
    if (!listen) return;
    syncControls();
    const pair = pairKey();
    const word = currentWord();
    const currentStatus = status();
    const pictureChanged = pair !== previousPair || word !== previousActiveWord;
    if (pictureChanged) previousWarning = '';
    if (!previousPair) previousPair = pair;
    if (!previousActiveWord) previousActiveWord = word;

    if (!window.__lesson3PictureFlowInstalled && (typeof wi === 'undefined' || wi < 2) && pair === previousPair && word && previousActiveWord && word !== previousActiveWord && !narrationBusy) {
      speakFeedback('Magaling! Susunod na larawan.', false);
    }
    if (currentStatus?.classList.contains('warning') && currentStatus.textContent !== previousWarning && !narrationBusy) {
      previousWarning = currentStatus.textContent;
      speakFeedback('Hindi pa. Subukan muli.', true);
    }
    previousPair = pair;
    previousActiveWord = word;
  }

  // Do not observe attributes here: syncControls() changes disabled/aria-busy,
  // and observing those attributes would create a self-triggering loop.
  new MutationObserver(inspectState).observe(game, { childList: true, subtree: true, characterData: true });
  ensureControls();
  syncControls();
  setTimeout(startIntro, 80);
})();
</script>

// Keep the existing Lesson 3 activity flow, but ensure its layered narration
// helpers can never play two audio responses at the same time.
(function () {
  if (window.__lesson3AudioArbiterInstalled) return;
  window.__lesson3AudioArbiterInstalled = true;
  const NativeAudio = window.Audio;
  let activeAudio = null;
  window.__lesson3StopAudio = () => {
    if (activeAudio) {
      activeAudio.pause();
      activeAudio.currentTime = 0;
      activeAudio = null;
    }
  };

  window.Audio = function (...args) {
    const audio = new NativeAudio(...args);
    const nativePlay = audio.play.bind(audio);
    audio.play = function () {
      if (window.__lesson3CompletionReached) {
        audio.pause();
        return Promise.resolve();
      }
      if (activeAudio && activeAudio !== audio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
      }
      activeAudio = audio;
      const playback = nativePlay();
      if (playback && typeof playback.catch === 'function') playback.catch(() => {});
      return playback;
    };
    const release = () => { if (activeAudio === audio) activeAudio = null; };
    audio.addEventListener('ended', release);
    audio.addEventListener('error', release);
    return audio;
  };
  window.Audio.prototype = NativeAudio.prototype;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
})();
</script>

<script>
(function () {
  const game = document.getElementById('game');
  if (!game || window.__lesson3PartTransitionInstalled) return;
  window.__lesson3PartTransitionInstalled = true;

  const readAloudUrl = "{% url 'reading_read_aloud_api' %}";
  const csrf = () => document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1] || '';
  const firstPrompt = 'Magkatunog ba ang dalawang larawan na ito? Pindutin ang nawawastong sagot.';
  const secondPrompt = 'Piliin ang tamang kamay.';
  let part2Key = '';
  let part2Busy = false;

  async function narrate(text) {
    const response = await fetch(readAloudUrl, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'X-CSRFToken': csrf(),
        'X-Lesson3-Narration': 'controller',
      },
      body: new URLSearchParams({ target_text: text, language: 'Filipino', mode: 'word' }),
    });
    const data = await response.json();
    if (!response.ok || !data.success || !data.audio_content) return;
    const audio = new Audio(`data:${data.mime_type || 'audio/mpeg'};base64,${data.audio_content}`);
    await new Promise(resolve => {
      audio.onended = resolve;
      audio.onerror = resolve;
      audio.play().catch(resolve);
    });
  }

  function answers() { return [...game.querySelectorAll('.answer')]; }
  function setAnswersDisabled(disabled) {
    answers().forEach(button => { if (button.disabled !== disabled) button.disabled = disabled; });
  }
  function setInstruction(text) {
    const instruction = game.querySelector('.instruction');
    if (instruction && instruction.textContent !== text) instruction.textContent = text;
  }

  async function beginPart2(key) {
    if (part2Busy || part2Key === key) return;
    part2Busy = true;
    part2Key = key;
    game.classList.remove('part1-phase', 'part1-ready', 'part1-instruction', 'part1-feedback', 'part1-transition', 'part2-ready');
    game.classList.add('part2-narrating');
    setAnswersDisabled(true);
    setInstruction(firstPrompt);
    try {
      await narrate(firstPrompt);
      setInstruction(secondPrompt);
      await narrate(secondPrompt);
    } catch (error) {
      console.error('Lesson 3 Part 2 instruction narration failed', error);
    }
    setAnswersDisabled(false);
    game.classList.remove('part2-narrating');
    game.classList.add('part2-ready');
    part2Busy = false;
  }

  function syncPart() {
    if (typeof wi === 'undefined') return;
    const key = game.querySelector('.progress')?.textContent?.trim() || '';
    if (wi >= 2) {
      if (part2Key === key && !part2Busy) {
        game.classList.remove('part1-phase', 'part1-ready', 'part1-instruction', 'part1-feedback', 'part1-transition', 'part2-narrating');
        game.classList.add('part2-ready');
        setInstruction(secondPrompt);
        setAnswersDisabled(false);
      } else {
        beginPart2(key);
      }
    } else {
      part2Key = '';
      part2Busy = false;
      game.classList.remove('part2-narrating', 'part2-ready');
      game.classList.add('part1-phase');
    }
  }

  new MutationObserver(syncPart).observe(game, { childList: true, subtree: true, characterData: true });
  syncPart();
})();
</script>

      read.dataset.pictureFlowReady = disabled ? '0' : '1';
      if (read.disabled !== disabled) read.disabled = disabled;
      if (read.getAttribute('aria-busy') !== String(disabled)) read.setAttribute('aria-busy', String(disabled));
    }
    if (listen && listen.disabled !== disabled) listen.disabled = disabled;
  }

  function setPictureState(phase, activeIndex) {
    picturePhase = phase;
    pictureIndex = activeIndex;
    applyPictureState();
  }

  function applyPictureState() {
    const pair = pairs();
    if (!pair) return;
    if (!pair.classList.contains('picture-naming-phase')) pair.classList.add('picture-naming-phase');
    if (!pair.classList.contains('picture-naming-phrase')) pair.classList.add('picture-naming-phrase');
    cards().forEach((card, index) => {
      const active = (picturePhase === 'transition' || picturePhase === 'ready') && index === pictureIndex;
      card.classList.toggle('active', active);
      const disabled = picturePhase !== 'ready' || !active;
      if (card.getAttribute('aria-disabled') !== String(disabled)) {
        card.setAttribute('aria-disabled', String(disabled));
      }
    });
    ['part1-instruction', 'part1-feedback', 'part1-transition'].forEach(className => {
      if (className !== `part1-${picturePhase}` && game.classList.contains(className)) {
        game.classList.remove(className);
      }
    });
    const phaseClass = `part1-${picturePhase}`;
    if (!game.classList.contains(phaseClass)) game.classList.add(phaseClass);
  }

  async function runFirstPicture() {
    flowBusy = true;
    setPictureState('instruction', 0);
    setControls(true);
    setText(game.querySelector('.instruction'), instructionText);
    try {
      await narrate(instructionText);
      setPictureState('transition', 0);
      setText(status(), `Basahin ang ${currentWord(0)}.`);
      await narrate(sayItText);
    } catch (error) { console.error('Lesson 3 first-picture narration failed', error); }
    setPictureState('ready', 0);
    setControls(false);
    flowBusy = false;
  }

  async function runNextPicture(index) {
    flowBusy = true;
    setPictureState('feedback', index);
    setControls(true);
    setText(status(), nextText);
    try {
      await narrate(nextText);
      setPictureState('transition', index);
      setText(status(), `Basahin ang ${currentWord(index)}.`);
      await narrate(sayItText);
    } catch (error) { console.error('Lesson 3 next-picture narration failed', error); }
    setPictureState('ready', index);
    setControls(false);
    flowBusy = false;
  }

  function syncPictureFlow() {
    if (typeof wi === 'undefined' || wi >= 2) return;
    const nextKey = key();
    if (flowBusy || nextKey === stateKey) return;
    stateKey = nextKey;
    if (!initialized) {
      initialized = true;
      runFirstPicture();
    } else if (window.__lesson3Part2CorrectPending) {
      window.__lesson3Part2CorrectPending = false;
      // A correct Part 2 answer starts the next pair's normal Part 1 flow.
      runFirstPicture();
    } else {
      runNextPicture(wi);
    }
  }

  new MutationObserver(() => {
    if (typeof wi !== 'undefined' && wi >= 2) return;
    applyPictureState();
    syncPictureFlow();
  }).observe(game, {
    childList: true,
    subtree: true,
    characterData: true,
    attributes: true,
    attributeFilter: ['class'],
  });
  syncPictureFlow();
})();
</script>

<script>
// Ensure Part 1 retry feedback is visible even when a legacy observer races the controller.
(function () {
  const game = document.getElementById('game');
  if (!game) return;
  const retryText = 'Hindi pa. Subukan muli.';
  const url = "{% url 'reading_read_aloud_api' %}";
  const csrf = () => document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1] || '';
  let audio = null;

  async function narrate() {
    try {
      const response = await fetch(url, {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'X-CSRFToken': csrf(),
          'X-Lesson3-Narration': 'controller',
        },
        body: new URLSearchParams({ target_text: retryText, language: 'Filipino', mode: 'word' }),
      });
      const data = await response.json();
      if (!response.ok || !data.success || !data.audio_content) return;
      audio = new Audio(`data:${data.mime_type || 'audio/mpeg'};base64,${data.audio_content}`);
      await new Promise(resolve => { audio.onended = resolve; audio.onerror = resolve; audio.play().catch(resolve); });
    } catch (error) { console.error('Lesson 3 picture retry feedback failed', error); }
    audio = null;
  }

  new MutationObserver(() => {
    if (typeof wi === 'undefined' || wi >= 2) return;
    const status = game.querySelector('#status');
    if (!status || !status.classList.contains('warning')) return;
    const sourceText = status.textContent;
    const controllerClaimed = status.dataset.feedbackControllerText === sourceText;
    status.textContent = retryText;
    status.classList.add('lesson3-feedback', 'retry');
    status.dataset.feedbackMode = 'feedback';
    status.dataset.feedbackText = retryText;
    if (controllerClaimed || status.dataset.retryNarrated === '1') return;
    status.dataset.retryNarrated = '1';
    const feedback = window.__lesson3SpeakFeedback;
    if (typeof feedback === 'function') {
      Promise.resolve(feedback(retryText, true)).finally(() => { status.dataset.retryNarrated = '0'; });
    } else {
      narrate().finally(() => { status.dataset.retryNarrated = '0'; });
    }
  }).observe(game, { childList: true, subtree: true, characterData: true });
})();
</script>
