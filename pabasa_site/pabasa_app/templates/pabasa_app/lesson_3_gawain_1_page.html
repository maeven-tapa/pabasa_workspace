gress:0,wi=0,rt=[0,0],li=[0,0],at=0,busy=false,generation=0;const game=document.getElementById('game'),words=()=>[pairs[pi].a,pairs[pi].b],norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');function speak(s){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='fil-PH';u.rate=.85;speechSynthesis.speak(u)}function render(){generation++;if(pi===pairs.length){localStorage.removeItem(progressKey);game.innerHTML='<div class="complete"><div style="font-size:3rem">🎉</div><h2>Magaling! Natapos mo ang gawain!</h2></div>';return}let p=pairs[pi];game.innerHTML=`<header class="header"><div class="brand"><h1>Salitang Magkatugma</h1><p>Lesson 3 · Gawain 1</p></div><div class="progress">Pares ${pi+1} / 6<div class="segments">${pairs.map((_,i)=>`<i class="${i<pi?'done':''}"></i>`).join('')}</div></div></header><div class="instruction">Pangalanan ang dalawang larawan. Sabihin ang mga salita at pakinggan ang iyong sarili.</div><div class="pairs">${words().map((w,i)=>`<div class="word ${i===wi?'active ':''}${i<wi?'done':''}"><img src="${base}${w.toLowerCase()}.png" alt="${w}"><strong>${w}</strong></div>`).join('')}</div><div id="status" class="status">Basahin ang ${words()[wi]}.</div><button id="read" class="read">🎙️ Basahin ngayon</button><button id="listen" class="listen" hidden>🔊 Basahin nang malakas</button><div class="answers"><button class="answer" data-v="yes" ${wi<2?'disabled':''}>👍<small>Magkapareho ang tunog sa hulihan</small></button><button class="answer" data-v="no" ${wi<2?'disabled':''}>👎<small>Hindi magkapareho ang tunog sa hulihan</small></button></div>`;read.onclick=record;listen.onclick=listen;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b.dataset.v))}async function record(){if(busy)return;let my=generation,w=words()[wi],r=read,s=status,l=listen;if(!navigator.mediaDevices?.getUserMedia||!MediaRecorder){s.textContent='Hindi available ang mikropono sa browser na ito.';return}busy=true;r.disabled=true;r.textContent='🎙️ Nakikinig…';let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});let c=[],m=new MediaRecorder(stream);m.ondataavailable=e=>e.data.size&&c.push(e.data);let done=new Promise(ok=>m.onstop=()=>ok(new Blob(c,{type:m.mimeType||'audio/webm'})));m.start();setTimeout(()=>m.state==='recording'&&m.stop(),3500);let blob=await done;stream.getTracks().forEach(x=>x.stop());let f=new FormData();f.append('audio',blob,'rhyme.webm');f.append('target_text',w);f.append('language','Filipino');f.append('mode','reading');let d=await (await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''},body:f})).json();if(my!==generation)return;if(d.success&&norm(d.transcript).includes(norm(w))){wi++;render()}else{rt[wi]++;s.textContent=`Hindi pa. Subukan muli. (${rt[wi]}/3)`;s.classList.add('warning');if(rt[wi]>=3)l.hidden=false;r.disabled=false;r.textContent='🎙️ Basahin ngayon'}}catch(e){if(my===generation){s.textContent='Hindi nakuha ang iyong boses. Subukan muli.';r.disabled=false;r.textContent='🎙️ Basahin ngayon'}}finally{busy=false}}function listen(){if(li[wi]>=3)return;li[wi]++;speak(words()[wi]);if(li[wi]>=3){listen.hidden=true;rt[wi]=0;read.hidden=false;read.disabled=false;read.textContent='🎙️ Basahin ngayon';status.textContent='Basahin muli ang salita.';status.classList.remove('warning')}}function answer(v){if(v===(pairs[pi].yes?'yes':'no')){pi++;localStorage.setItem(progressKey,String(pi));wi=0;rt=[0,0];li=[0,0];at=0;render()}else{at++;if(at>=3){at=0;wi=0;rt=[0,0];li=[0,0];render()}else{status.textContent=`Subukan muli. (${at}/3)`;status.classList.add('warning')}}}render();</script></body></html>
