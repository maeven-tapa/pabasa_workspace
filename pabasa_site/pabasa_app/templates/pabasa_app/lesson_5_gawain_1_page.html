{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letrang Aa</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8f6f1;color:#164b5d;font-family:Nunito,Arial,sans-serif}.page{min-height:100dvh;padding:12px}.back{color:#164b5d;font-weight:900}.card{max-width:1000px;min-height:calc(100dvh - 55px);margin:8px auto;background:#fffdf5;border-radius:28px;padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 12px 32px #164f5530}.head{width:100%;display:flex;justify-content:space-between;align-items:start;text-align:left}.eyebrow{font-weight:900;color:#e46b58}.head h1{margin:3px 0;font-size:clamp(1.6rem,4vw,2.5rem)}#progress{font-weight:900;color:#52727a}.instruction{font-weight:800;font-size:1.15rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(720px,100%);margin:auto}.tile{background:#fff;border:3px solid #d4ebe1;border-radius:16px;padding:8px}.tile img{width:100%;height:clamp(90px,17vw,160px);object-fit:contain}.start,.action{border:0;border-radius:18px;padding:13px 30px;background:#e6a33a;color:#fff;font:900 1.1rem Arial;cursor:pointer;box-shadow:0 5px #b77b1b}.focus{width:100%;display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center}.focus img{width:min(70vw,390px);height:min(48vh,330px);object-fit:contain}.word{font-size:2rem;font-weight:900}.prompt{font-size:1.35rem;font-weight:900}.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.choice{min-width:130px;background:#2d8b78;color:#fff;border:0;border-radius:16px;padding:18px;font:900 1.8rem Arial;cursor:pointer}.status{min-height:28px;font-weight:900}.bad{color:#9a3d25}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#164b5d88}.modal>div{background:#fffdf5;border-radius:24px;padding:32px;font-size:2rem;font-weight:900}.hidden{display:none}@media(max-width:600px){.grid{gap:6px}.tile{padding:4px}.tile img{height:95px}}
</style></head><body><div class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik</a><main class="card" id="app"></main></div>{{ lesson_5_data|json_script:"lesson-five-data" }}<script>
const d=JSON.parse(document.getElementById('lesson-five-data').textContent),items=d.items,total=items.length,p=d.progress,key='lesson-5-gawain-1',base="{% static 'pabasa_app/images/letrang_a/' %}",url="{{ lesson_5_progress_url }}",token=()=>document.cookie.match(/csrftoken=([^;]+)/)?.[1]||'';let i=Math.min(total,Number(p.current_index)||0),score=Number(p.correct_items)||0,phase='preview',tries=0,listens=0,answers=p.answers||[];const app=document.getElementById('app'),save=async(done=false)=>{const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':token()},body:JSON.stringify({activity_key:key,total_items:total,current_index:i,completed_items:i,correct_items:score,activity_completed:done,state:{answers}})});if(!r.ok)throw Error('save')};function grid(){return `<div class="grid">${items.map(x=>`<div class="tile"><img src="${base}${x.image}" alt="${x.word}"></div>`).join('')}</div>`}function render(){if(phase==='preview'){app.innerHTML=`<div class="head"><div><div class="eyebrow">LESSON 5 · GAWAIN 1</div><h1>Letrang Aa</h1></div></div><p class="instruction">Ikahon ang mga larawang nagsisimula sa tunog /a/.</p>${grid()}<button class="start" id="start">MAGSIMULA</button>`;start.onclick=()=>{phase='identify';render()};return}if(i>=total){app.innerHTML=`<h1>Magaling!</h1>${grid()}<button class="action" id="finish">TAPUSIN</button>`;finish.onclick=async()=>{await save(true);app.innerHTML=grid();setTimeout(()=>{app.innerHTML=`<div class="modal"><div>${score} / 9</div></div>`;setTimeout(()=>location.href="{% url 'assessment' %}",1800)},1500)};return}const x=items[i];app.innerHTML=`<div class="head"><div><div class="eyebrow">LESSON 5 · GAWAIN 1</div><h1>Letrang Aa</h1></div><span id="progress">${i+1} / ${total}</span></div><p class="instruction">Ikahon ang mga larawang nagsisimula sa tunog /a/.</p><section class="focus"><img src="${base}${x.image}" alt="Larawan ng ${x.word}"><div class="word">${phase==='classify'?'':x.word}</div><div class="status ${tries?'bad':''}" id="status">${phase==='identify'?'Basahin ang larawan.':'Ikahon?'}</div>${phase==='identify'?`<button class="action" id="read">${listens>=3?'READ NOW':'Basahin ngayon'}</button>${listens>=3?'':`<button class="action" id="aloud">${listens?'READ ALOUD ('+listens+'/3)':'READ ALOUD'}</button>`}`:`<div class="actions"><button class="choice" data-v="true">OO</button><button class="choice" data-v="false">HINDI</button></div>`}</section>`;if(phase==='identify'){read.onclick=()=>{if(listens>=3){phase='identify';tries=0;listens=0;render()}else{tries++;if(tries>=3){aloud.hidden=false;status.textContent='Pakinggan ang tamang salita.'}else status.textContent='Subukan muli.'}};aloud?.addEventListener('click',()=>{speechSynthesis?.speak(new SpeechSynthesisUtterance(x.word));listens++;if(listens>=3)render()})}else document.querySelectorAll('.choice').forEach(b=>b.onclick=async()=>{if(b.dataset.v===String(x.starts_a)){answers[i]=b.dataset.v;score+=1;i++;tries=0;phase='identify';await save();render()}else{tries++;status.textContent='Subukan muli.';if(tries>=3){tries=0;phase='identify';render()}}})}render();
</script><style>html,body{height:100%;overflow:hidden}.page{height:100dvh;overflow:hidden;padding:8px 12px}.card{height:calc(100dvh - 42px);min-height:0;overflow:hidden;padding:clamp(10px,2vw,24px)}.grid{gap:clamp(4px,1vw,12px);max-height:calc(100dvh - 190px)}.tile{padding:clamp(3px,1vw,8px);min-height:0}.tile img{height:clamp(64px,15vh,160px);display:block}</style></body></html>
