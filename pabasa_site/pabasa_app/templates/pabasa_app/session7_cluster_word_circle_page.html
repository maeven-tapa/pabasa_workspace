<body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card" aria-live="polite"></section></main>{{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
<script>(()=>{'use strict';
const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),items=d.items||[],app=document.getElementById('app'),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||''),esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),norm=x=>String(x||'').toLocaleLowerCase('fil-PH').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,''),attemptKey=(row,word)=>`${row}:${word}`;
let s=Object.assign({phase:'intro',current_row_index:0,current_reading_index:0,orally_completed_words:{},stt_attempt_counts:{},read_aloud_play_counts:{},selected_answers:{},selected_words:[],completed_rows:0,correct_answer_count:0,state_version:0},d.progress?.state||{}),busy=false,request=0,stream=null,audio=null,narrationAudio=null,narrationRequest=0;
let total=items.length,current=()=>Number(s.current_row_index)||0,oralDone=row=>s.orally_completed_words[String(row)]||[],stop=()=>{stream?.getTracks().forEach(track=>track.stop());stream=null;if(audio){audio.pause();audio=null}},header=()=>`<p class="eyebrow">SESSION 7 · LESSON 20 AT 21 · GAWAIN 4</p><h1>${esc(d.display_title)}</h1><h2>${esc(d.title)}</h2><p class="instruction">${esc(d.instruction)}</p><div class="track" aria-label="${s.selected_words.length} sa ${total} natapos"><i style="width:${total?s.selected_words.length/total*100:0}%"></i></div>`;
const renderHeader=header;header=()=>{const text=s.phase==='intro'?d.instruction:s.phase==='feedback'?'Tama! Magaling ang iyong sagot.':s.phase==='oral_reading'?'Basahin ang naka-highlight na salita.':'Alin ang salitang may klaster? I-tap upang bilugan.';void narrate(text);return renderHeader()};
async function narrate(text){if(!text||!d.read_aloud_url)return;const mine=++narrationRequest,form=new FormData();narrationAudio?.pause();narrationAudio=null;form.append('target_text',text);form.append('language','Filipino');form.append('prescribed_activity_key',d.activity_key);try{const response=await fetch(d.read_aloud_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json().catch(()=>({}));if(mine!==narrationRequest||!response.ok||!result.success||result.tts_language!=='fil-PH'||result.voice_name!=='fil-PH-Wavenet-A')return;narrationAudio=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(result.audio_content),character=>character.charCodeAt(0))],{type:result.mime_type||'audio/mpeg'})));narrationAudio.onended=()=>{if(mine===narrationRequest)narrationAudio=null};await narrationAudio.play()}catch(error){const status=app.querySelector('.status');if(status)status.textContent=error.message||'Hindi available ang Filipino audio.'}}
async function save(extra={}){const mine=++request,response=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:(Number(s.state_version)||0)+1},...extra})}),result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw Error(result.error||'Hindi na-save ang progress. Subukan muli.');if(mine!==request)return null;s=result.progress.state;return result}
function render(message='',kind=''){const complete=d.progress?.activity_completed||s.phase==='completion';if(complete){app.classList.remove('intro-card');app.innerHTML=`<div class="done"><div>⭐</div><h1>Magaling!</h1><p>Natapos mo ang Lesson 20 at 21: Gawain 4.</p><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`;return}const row=current(),item=items[row];if(s.phase==='intro'){app.classList.add('intro-card');app.innerHTML=header()+`<p class="hint">Basahin ang bawat pangkat ng salita. Bilugan ang salitang may klaster.</p><div class="intro-rows">${items.map((entry,index)=>`<div class="intro-row"><b>${index+1}.</b>${entry.words.map(word=>`<span>${esc(word)}</span>`).join('')}</div>`).join('')}</div><button class="button" id="start" type="button">SIMULAN</button><p class="status ${kind}">${esc(message)}</p>`;app.querySelector('#start').onclick=async()=>{s.phase='oral_reading';try{await save();render()}catch(error){render(error.message,'bad')}};return}app.classList.remove('intro-card');if(s.phase==='feedback'){const previous=items[s.selected_words.length-1],answer=s.selected_words.at(-1);app.innerHTML=header()+`<p class="status good">Tama! Magaling ang iyong sagot.</p><div class="word-grid">${previous.words.map(word=>`<button class="word ${word===answer?'selected':''}" disabled>${esc(word)}</button>`).join('')}</div><button class="button" id="next" type="button">${s.selected_words.length===total?'TAPUSIN':'SUSUNOD'}</button>`;app.querySelector('#next').onclick=async()=>{if(s.selected_words.length===total)return finish();s.phase='oral_reading';try{await save();render()}catch(error){render(error.message,'bad')}};return}if(!item)return finish();const done=oralDone(row),readingIndex=done.length;if(s.phase==='oral_reading'){const word=item.words[readingIndex],recovery=(s.stt_attempt_counts[attemptKey(row,readingIndex)]||0)>=3;app.innerHTML=header()+`<p class="row-label">Pangkat ${row+1} sa ${total} · Salita ${readingIndex+1} sa 4</p><div class="word-grid">${item.words.map((choice,index)=>`<div class="word ${index===readingIndex?'active':''} ${done.includes(index)?'read':''}">${esc(choice)}</div>`).join('')}</div><p class="hint">${recovery?'Pakinggan muna ang salita.':'Basahin ang naka-highlight na salita.'}</p><button class="button ${recovery?'gold':''}" id="oral" type="button">${recovery?'🔊 Pakinggan / Read Aloud':'🎙 Basahin ngayon'}</button><p class="status ${kind}">${esc(message)}</p>`;const button=app.querySelector('#oral');button.onclick=()=>recovery?listen(row,readingIndex,word,button):read(row,readingIndex,word,button);return}const selected=s.selected_answers[String(row)]||'';app.innerHTML=header()+`<p class="row-label">Pangkat ${row+1} sa ${total}</p><p class="hint">Alin ang salitang may klaster? I-tap upang bilugan.</p><div class="word-grid">${item.words.map(word=>`<button class="word ${selected===word?'selected':''}" data-choice="${esc(word)}">${esc(word)}</button>`).join('')}</div><p class="status ${kind}">${esc(message)}</p>`;app.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>answer(button.dataset.choice));}
async function read(row,wordIndex,word,button){if(busy)return;busy=true;const mine=++request;try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono.');button.disabled=true;button.textContent='Nagbabasa...';stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});const chunks=[],recorder=new MediaRecorder(stream);recorder.ondataavailable=event=>event.data.size&&chunks.push(event.data);const blob=await new Promise((resolve,reject)=>{recorder.onerror=()=>reject(Error('Hindi naitala ang boses.'));recorder.onstop=()=>resolve(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));recorder.start();setTimeout(()=>recorder.state==='recording'&&recorder.stop(),3500)});stop();if(!blob.size)throw Error('Walang narinig na boses. Subukan muli.');if(mine!==request)return;button.textContent='Pinoproseso...';const form=new FormData();form.append('audio',blob,'session7-lesson20-21-gawain4.webm');form.append('target_text',word);form.append('language','Filipino');form.append('mode','reading');const response=await fetch(d.transcribe_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json().catch(()=>({}));if(mine!==request)return;if(!response.ok||!result.success||!norm(result.transcript).includes(norm(word)))throw Error('Hindi pa. Subukan muli.');s.orally_completed_words[String(row)]=[...oralDone(row),wordIndex];s.current_reading_index=wordIndex+1;s.stt_attempt_counts[attemptKey(row,wordIndex)]=0;s.read_aloud_play_counts[attemptKey(row,wordIndex)]=0;s.phase=wordIndex===3?'word_selection':'oral_reading';await save();render(wordIndex===3?'Tama ang pagbasa! Bilugan ang salitang may klaster.':'Tama ang pagbasa!','good')}catch(error){if(mine===request){const key=attemptKey(row,wordIndex);s.stt_attempt_counts[key]=Math.min(3,(s.stt_attempt_counts[key]||0)+1);try{await save()}catch(_){}render((s.stt_attempt_counts[key]||0)>=3?'Pakinggan muna ang salita.':error.message||'Hindi nakuha ang boses. Subukan muli.','bad')}}finally{stop();busy=false}}
async function listen(row,wordIndex,word,button){if(busy)return;busy=true;const mine=++request;try{button.disabled=true;button.textContent='Nilo-load...';const form=new FormData();form.append('target_text',word);form.append('language','Filipino');form.append('prescribed_activity_key',d.activity_key);const response=await fetch(d.read_aloud_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json().catch(()=>({}));if(mine!==request)return;if(!response.ok||!result.success||result.tts_language!=='fil-PH'||result.voice_name!=='fil-PH-Wavenet-A')throw Error(result.error||'Hindi available ang Filipino audio.');button.textContent='Pinakikinggan...';audio=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(result.audio_content),char=>char.charCodeAt(0))],{type:result.mime_type||'audio/mpeg'})));await audio.play();await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=()=>reject(Error('Hindi ma-play ang audio.'))});if(mine!==request)return;const key=attemptKey(row,wordIndex);s.read_aloud_play_counts[key]=Math.min(3,(s.read_aloud_play_counts[key]||0)+1);if(s.read_aloud_play_counts[key]===3){s.stt_attempt_counts[key]=0;s.read_aloud_play_counts[key]=0}s.phase='oral_reading';await save();render('Subukan mong basahin ang salita.')}catch(error){if(mine===request)render(error.message||'Hindi available ang audio. Subukan muli.','bad')}finally{busy=false}}
async function answer(value){if(busy||!value)return;busy=true;s.selected_answers={[String(current())]:value};try{const result=await save({candidate_answer:value});if(result?.accepted){s.phase='feedback';render()}else render('Hindi pa tama. Subukan muli.','bad')}catch(error){render(error.message,'bad')}finally{busy=false}}
async function finish(){if(busy)return;busy=true;s.phase='completion';try{const response=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'}),result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw Error(result.error||'Hindi na-save ang pagtatapos. Subukan muli.');d.progress.activity_completed=true;render()}catch(error){s.phase='feedback';render(error.message,'bad')}finally{busy=false}}
addEventListener('pagehide',()=>{stop();narrationAudio?.pause();narrationAudio=null});render();})();
</script></body></html>
