<script src="{% static 'pabasa_app/js/prescribed_narration_resolver.js' %}?v=20260924-5"></script>
<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gawain 2B: Letrang Ii</title>
  <link rel="stylesheet" href="{% static 'pabasa_app/css/lesson_7_gawain_2b.css' %}?v=20260918-6">
</head>
<body>
  <main class="page">
    <a href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a>
    <section id="app" class="card"></section>
  </main>
  {{ lesson7_gawain2b_data|json_script:"activity-data" }}
  <script>
  (()=>{
    const d=JSON.parse(document.getElementById('activity-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';
    const wordAudioFiles={ilog:'ilog.mp3',ipis:'ipis.mp3',ibon:'ibon.mp3',atis:'atis.mp3',mais:'mais.mp3',mangga:'mangga.mp3'},wordAudioBase='/static/pabasa_app/prescribed/audio/SESSION%203/LESSON%207/GAWAIN%202B/';
    let s=Object.assign({current_reading_item:0,oral_reading_completed:false,completed_reading_items:[],read_attempts:0,listen_attempts:0,selections:[],correct_count:0,state_version:0},d.progress?.state||{}),audioBusy=false,introPlayed=false,part2InstructionPlayed=false;
    const WRONG='Hindi iyon ang tamang pangalan ng larawan. Subukan muli magsalita.',CORRECT='Magaling!',INTRO_TITLE='Tukuyin ang larawan',INTRO_INSTRUCTION='Tingnan ang larawang nasa kahon. Ano ito?',PART2_INSTRUCTION='Pindutin ang larawang nagsisimula sa titik I para bilugan.',PART2_WRONG='May kulang o maling sagot. Tingnan muli ang mga larawan at subukan ulit.';
    const save=()=>fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:++s.state_version}})});
    const requestAudio=text=>fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8','X-CSRFToken':csrf()},body:new URLSearchParams({target_text:text,language:'Filipino',mode:'reading',prescribed_activity_key:'lesson7-gawain2b'})}).then(response=>response.ok?response.json():null).then(result=>new Promise(resolve=>{if(!result?.success||!result.audio_content){resolve();return}const audio=new Audio(`data:${result.mime_type||'audio/mpeg'};base64,${result.audio_content}`);audio.onended=resolve;audio.onerror=resolve;audio.play().catch(resolve)})).catch(error=>console.error('Lesson 7 Gawain 2B narration failed',error));
    const readingButtons=()=>[...app.querySelectorAll('.reading-actions button')];
    const setReadingButtonsDisabled=disabled=>readingButtons().forEach(button=>{button.disabled=disabled});
    const part2Controls=()=>[...app.querySelectorAll('.grid .choice'),app.querySelector('#submit')].filter(Boolean);
    const setPart2ControlsDisabled=disabled=>part2Controls().forEach(control=>{control.disabled=disabled;control.classList.toggle('is-disabled',disabled)});
    const renderReadingStatus=text=>{const status=document.getElementById('status');if(status)status.textContent=text;if(text==='Hindi narinig. Subukan muli.')requestAudio(text)};
    const narrateFeedback=async text=>{audioBusy=true;setReadingButtonsDisabled(true);renderReadingStatus(text);await requestAudio(text);audioBusy=false;setReadingButtonsDisabled(false)};
    const narrateIntro=async()=>{if(introPlayed)return;introPlayed=true;audioBusy=true;setReadingButtonsDisabled(true);await requestAudio(INTRO_TITLE);await requestAudio(INTRO_INSTRUCTION);audioBusy=false;setReadingButtonsDisabled(false)};
    const narratePart2=async text=>{audioBusy=true;setPart2ControlsDisabled(true);await requestAudio(text);audioBusy=false;setPart2ControlsDisabled(false)};
    function render(){
      if(d.progress?.activity_completed){app.innerHTML='<div class="done"><div class="done-badge" aria-hidden="true">✓</div><h1>Magaling!</h1><p>Natapos mo ang Gawain 2B.</p></div>';return}
      if(!s.oral_reading_completed){
        let i=s.current_reading_item||0,it=d.items[i];
        app.innerHTML='<h1>Tukuyin ang larawan</h1><p>Tingnan ang larawang nasa kahon. Ano ito?</p><img src="'+it.image_url+'" alt="Larawan: '+it.word+'"><p id="status">Larawan '+(i+1)+' sa 6</p><div class="reading-actions"><button class="button" id="read">Sabihin ang salita</button><button class="button secondary" id="listen">Pakinggan</button></div>';
        const read=document.getElementById('read'),listenButton=document.getElementById('listen'),R=window.SpeechRecognition||window.webkitSpeechRecognition;
        const listen=async()=>{if(audioBusy||read.disabled)return;const audioFile=wordAudioFiles[String(it.word||'').toLowerCase()];if(!audioFile)return;audioBusy=true;setReadingButtonsDisabled(true);try{const audio=new Audio(wordAudioBase+audioFile);await new Promise(resolve=>{audio.onended=resolve;audio.onerror=resolve;audio.play().catch(resolve)})}finally{audioBusy=false;setReadingButtonsDisabled(false)}};
        listenButton.onclick=listen;
        const resetRead=()=>{if(audioBusy)return;setReadingButtonsDisabled(false);read.textContent='Sabihin ang salita';read.onclick=startRead};
        const startRead=()=>{if(audioBusy||read.disabled)return;if(!R){renderReadingStatus('Hindi available ang speech check sa browser na ito.');return}setReadingButtonsDisabled(true);read.textContent='Nakikinig...';let r=new R();r.lang='fil-PH';r.continuous=false;r.interimResults=false;r.onresult=async e=>{read.textContent='Pinoproseso...';let ok=String(e.results[0][0].transcript).toLowerCase().includes(it.word.toLowerCase());if(ok){await narrateFeedback(CORRECT);s.completed_reading_items=[...(s.completed_reading_items||[]),i];s.current_reading_item=i+1;s.read_attempts=0;s.listen_attempts=0;if(i===5)s.oral_reading_completed=true;else introPlayed=false;await save();render()}else{s.read_attempts=(s.read_attempts||0)+1;await narrateFeedback(WRONG);await save();resetRead()}};r.onerror=async()=>{renderReadingStatus('Hindi narinig. Subukan muli.');await save();resetRead()};r.start()};
        read.onclick=startRead;
        if(!R){read.disabled=true;listenButton.disabled=true}
        if(!introPlayed)narrateIntro();
        return
      }
      app.innerHTML='<h1>Gawain 2B: Letrang Ii</h1><p>'+PART2_INSTRUCTION+'</p><div class="grid">'+d.items.map((x,i)=>'<button class="choice '+(s.selections.includes(i)?'selected':'')+'" data-i="'+i+'"><img src="'+x.image_url+'" alt="Larawan"></button>').join('')+'</div><p id="status">Piliin ang mga larawan, pagkatapos ay isumite.</p><button class="button" id="submit">ISUMITE</button>';
      if(!part2InstructionPlayed){part2InstructionPlayed=true;narratePart2(PART2_INSTRUCTION)}
      document.querySelectorAll('.choice').forEach(b=>b.onclick=async()=>{let i=+b.dataset.i;s.selections=s.selections.includes(i)?s.selections.filter(x=>x!==i):[...s.selections,i];await save();render()});
      document.getElementById('submit').onclick=async()=>{let want=d.items.map((x,i)=>x.target?i:null).filter(x=>x!==null).sort(),got=[...s.selections].sort(),ok=want.length===got.length&&want.every((x,i)=>x===got[i]);s.correct_count=ok?6:0;await save();if(ok){let r=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});if(r.ok){d.progress.activity_completed=true;render();return}}s.selections=s.selections.filter(x=>want.includes(x));document.querySelectorAll('.choice').forEach(b=>{if(!s.selections.includes(+b.dataset.i))b.classList.remove('selected')});await save();document.getElementById('status').textContent=PART2_WRONG;await narratePart2(PART2_WRONG)};
    }
    render();
  })();
  </script>

</html>
