{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gawain 2B: Letrang Ii</title><style>body{margin:0;overflow:hidden;background:#e1f5f7;color:#16465d;font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(1000px,calc(100% - 20px));margin:auto;padding:8px}.card{padding:clamp(14px,2.5vh,24px);border-radius:24px;background:#fffdf7;min-height:calc(100dvh - 40px);height:calc(100dvh - 40px);overflow:hidden;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{min-height:150px;padding:6px;border:2px solid #dce8ed;border-radius:16px;background:#fff;cursor:pointer}.choice img{width:100%;height:125px;object-fit:contain}.choice.selected{border-color:#ef922b;box-shadow:0 0 0 5px #ef922b;border-radius:50%}.button{border:0;border-radius:16px;padding:14px 30px;min-height:58px;background:#2b83bd;color:#fff;font-size:1.15rem;font-weight:900;transition:.2s ease;box-shadow:0 4px 0 #155369}.status{min-height:34px;margin:12px auto;color:#397b56;font-size:clamp(1.05rem,2.4vw,1.35rem);font-weight:900;line-height:1.25;max-width:760px}.button.reading{background:#d64c55;animation:readingPulse 1.2s infinite}.button.processing{background:#e6a33a;box-shadow:0 0 18px rgba(230,163,58,.65)}.button:disabled{opacity:.8;cursor:wait}@keyframes readingPulse{0%,100%{box-shadow:0 0 0 0 rgba(214,76,85,.55)}50%{box-shadow:0 0 0 10px rgba(214,76,85,0),0 0 24px rgba(214,76,85,.7)}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}.card h1{margin:4px 0 8px}.card>p:first-of-type{margin:0 auto 10px;padding:8px 14px;border-radius:14px;background:#eef8fb;color:#397b56;font-size:1.05rem;font-weight:800}.card>img{display:block;width:min(80vw,360px)!important;height:min(43vh,300px)!important;margin:8px auto;padding:12px;border:3px solid #dce8ed;border-radius:24px;background:#fff;box-shadow:0 8px 18px rgba(45,105,115,.12);object-fit:contain}.card>#status{font-size:1rem;letter-spacing:.08em;color:#71828a}.card>#read{min-width:220px}.done{display:block;min-height:0;color:#26784e;font-size:1.4rem;font-weight:900;line-height:1.5;text-align:center}.done a{display:inline-block;margin-top:14px}</style></head><body><main class="page"><a href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card"></section></main>{{ lesson7_gawain2b_data|json_script:"activity-data" }}<script>(()=>{const d=JSON.parse(document.getElementById('activity-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';let s=Object.assign({current_reading_item:0,oral_reading_completed:false,completed_reading_items:[],read_attempts:0,listen_attempts:0,selections:[],correct_count:0,state_version:0},d.progress?.state||{});const save=()=>fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:++s.state_version}})});function render(){if(d.progress?.activity_completed){app.innerHTML='<div class="done">✓<br>Magaling! Natapos mo ang Gawain 2B.<br><a href="{% url "assessment" %}">Bumalik sa Aking Aralin</a></div>';return}if(!s.oral_reading_completed){let i=s.current_reading_item||0,it=d.items[i];app.innerHTML='<h1>Tukuyin ang larawan</h1><p>Tingnan ang larawan at sabihin ang salita.</p><img style="width:min(55vw,280px);height:45vh;object-fit:contain" src="'+it.image_url+'"><p id="status">Larawan '+(i+1)+' sa 6</p><button class="button" id="read">Sabihin ang salita</button>';let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;const resetRead=()=>{read.disabled=false;read.classList.remove('reading','processing');read.textContent='Sabihin ang salita';read.onclick=startRead};const listen=async()=>{read.disabled=true;read.classList.remove('reading');read.classList.add('processing');read.textContent='Pakinggan…';s.listen_attempts=(s.listen_attempts||0)+1;await save();let u=new SpeechSynthesisUtterance(it.word);let voices=speechSynthesis.getVoices(),voice=voices.find(v=>/^fil(?:-|$)/i.test(v.lang))||voices.find(v=>/^tl(?:-|$)/i.test(v.lang));u.lang=voice?.lang||'fil-PH';if(voice)u.voice=voice;u.onend=()=>{if(s.listen_attempts>=3){s.read_attempts=0;s.listen_attempts=0;save();resetRead()}else{read.disabled=false;read.classList.remove('processing');read.textContent='Pakinggan';read.onclick=listen}};speechSynthesis.cancel();speechSynthesis.speak(u)};const startRead=()=>{let r=new R();r.lang='fil-PH';read.disabled=true;read.classList.add('reading');read.textContent='Nakikinig…';r.onresult=async e=>{read.classList.remove('reading');read.classList.add('processing');read.textContent='Pinoproseso…';if(String(e.results[0][0].transcript).toLowerCase().includes(it.word)){s.completed_reading_items.push(i);s.current_reading_item=i+1;s.read_attempts=0;s.listen_attempts=0;if(i===5)s.oral_reading_completed=true;await save();render()}else{s.read_attempts=(s.read_attempts||0)+1;document.getElementById('status').textContent=s.read_attempts>=3?'Pakinggan ang salita.':'Hindi iyon ang tamang pangalan ng larawan. Subukan muli magsalita.';if(s.read_attempts>=3){read.disabled=false;read.classList.remove('processing');read.textContent='Pakinggan';read.onclick=listen}else resetRead();await save()}};r.onerror=()=>{s.read_attempts=(s.read_attempts||0)+1;document.getElementById('status').textContent=s.read_attempts>=3?'Pakinggan ang salita.':'Hindi narinig. Subukan muli.';if(s.read_attempts>=3){read.disabled=false;read.textContent='Pakinggan';read.onclick=listen}else resetRead();save()};r.start()};read.onclick=startRead;return}app.innerHTML='<h1>Gawain 2B: Letrang Ii</h1><p>Bilugan ang larawang nagsisimula sa titik Ii.</p><div class="grid">'+d.items.map((x,i)=>'<button class="choice '+(s.selections.includes(i)?'selected':'')+'" data-i="'+i+'"><img src="'+x.image_url+'"></button>').join('')+'</div><p id="status">Piliin ang mga larawan, pagkatapos ay isumite.</p><button class="button" id="submit">ISUMITE</button>';document.querySelectorAll('.choice').forEach(b=>b.onclick=async()=>{let i=+b.dataset.i;s.selections=s.selections.includes(i)?s.selections.filter(x=>x!==i):[...s.selections,i];await save();render()});submit.onclick=async()=>{let want=d.items.map((x,i)=>x.target?i:null).filter(x=>x!==null).sort(),got=[...s.selections].sort(),ok=want.length===got.length&&want.every((x,i)=>x===got[i]);s.correct_count=ok?6:0;await save();if(ok){let r=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});if(r.ok){d.progress.activity_completed=true;render();return}}s.selections=s.selections.filter(x=>want.includes(x));document.querySelectorAll('.choice').forEach(b=>{if(!s.selections.includes(+b.dataset.i))b.classList.remove('selected')});await save();document.getElementById('status').textContent='May kulang o maling sagot. Tingnan muli ang mga larawan at subukan ulit.'}}render()})();</script></body></html>
