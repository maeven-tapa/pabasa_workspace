{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Ride | PABASA</title>
<style>
:root{--navy:#172948;--orange:#f78a45;--red:#de595b;--blue:#317da7}*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;color:var(--navy);font-family:"Trebuchet MS","Segoe UI",sans-serif;background:#78cce3}button,a{font:inherit}.cab{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:100%;height:100dvh;min-height:100vh;overflow:hidden;background:linear-gradient(155deg,#ffe27b 0%,#92d9ed 35%,#65bdd8 100%)}
/* CSS-only moving view through the truck windshield: no PNG vehicle artwork. */.scenery,.wind,.cab:before,.cab:after{position:absolute;pointer-events:none}.scenery{inset:0;background:linear-gradient(transparent 0 56%,#95c978 56% 65%,#617e58 65% 67%,#516370 67%),radial-gradient(ellipse at 20% 32%,#fff 0 6%,transparent 6.3%),radial-gradient(ellipse at 73% 21%,#fff 0 7%,transparent 7.3%);opacity:.85}.wind{z-index:1;inset:8% 4% 24%;overflow:hidden}.wind:before,.wind:after{content:"";position:absolute;width:45%;height:3px;border-radius:99px;background:#fff9;box-shadow:15vw 13vh #fff7,33vw 27vh #fff8,56vw 7vh #fff7,66vw 20vh #fff8,5vw 41vh #fff6;animation:wind 2.3s linear infinite}.wind:after{top:32%;animation-delay:-1.2s;opacity:.7}@keyframes wind{from{transform:translateX(105vw)}to{transform:translateX(-64vw)}}.cab:before{z-index:2;top:0;left:0;width:17vw;height:76%;min-width:80px;background:linear-gradient(90deg,#ec7141,#f5a247 70%,#ffcc6a);clip-path:polygon(0 0,100% 0,78% 100%,0 100%);box-shadow:10px 0 #b94c3d}.cab:after{z-index:2;top:0;right:0;width:17vw;height:76%;min-width:80px;background:linear-gradient(270deg,#ec7141,#f5a247 70%,#ffcc6a);clip-path:polygon(0 0,100% 0,100% 100%,22% 100%);box-shadow:-10px 0 #b94c3d}
.topbar{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:clamp(12px,2.2vw,24px) clamp(18px,5vw,78px);color:#fff;background:linear-gradient(180deg,#172948f0,#172948ac,transparent)}.back{min-height:44px;padding:10px 16px;border:2px solid #fff9;border-radius:15px;color:#fff;background:#223b60e6;font-weight:900;text-decoration:none;box-shadow:0 4px #10213b}.brand{font-weight:1000;font-size:clamp(1rem,2.2vw,1.35rem);letter-spacing:.06em}.badge{padding:8px 13px;border-radius:999px;background:#ffd45a;color:#533b00;font-size:.9rem;font-weight:1000}
.windshield{position:relative;z-index:3;display:grid;place-items:center;min-height:0;padding:0 clamp(32px,10vw,180px) clamp(10px,2vh,25px)}.panel{width:min(970px,100%);padding:clamp(22px,4.4vw,54px);border:clamp(7px,1.2vw,15px) solid #f6a54c;border-radius:35px 35px 22px;background:#fffdf6ed;box-shadow:inset 0 0 0 4px #fff5c4,0 13px #b84a3c,0 25px 50px #1729486b;text-align:center}.eyebrow{margin:0 0 8px;color:#b85b2f;font-size:.82rem;font-weight:1000;letter-spacing:.09em;text-transform:uppercase}.panel h1{margin:0;color:#253d61;font-size:clamp(1.45rem,3.5vw,2.5rem);line-height:1.1}.instruction{margin:9px auto 18px;max-width:680px;font-weight:800}.passage,.reading-now{max-width:800px;margin:0 auto;color:#182d4d;font-family:Georgia,serif;font-size:clamp(1.4rem,3.3vw,2.55rem);font-weight:700;line-height:1.5;text-wrap:balance}.status{min-height:25px;margin:17px 0 0;color:#39627c;font-weight:900}.controls{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-top:22px}.button{display:inline-flex;align-items:center;justify-content:center;min-width:170px;min-height:62px;padding:14px 25px;border:3px solid transparent;border-radius:19px;font-size:1.15rem;font-weight:1000;cursor:pointer;box-shadow:0 6px #9f3f34}.button:focus-visible{outline:4px solid #253d61;outline-offset:4px}.start{background:var(--orange);border-color:#ffe297;color:#fff}.listen{background:var(--blue);border-color:#bdeefa;color:#fff;box-shadow:0 6px #1d5479}.stop{background:var(--red);border-color:#ffd5bd;color:#fff}.button:disabled{opacity:.6;cursor:not-allowed}.countdown{font-size:clamp(5rem,16vw,10rem);font-weight:1000;line-height:1;color:var(--orange);text-shadow:0 6px #b85035}.timer{display:grid;place-items:center;width:clamp(104px,16vw,145px);height:clamp(104px,16vw,145px);margin:0 auto 14px;border:10px solid #d3e8eb;border-top-color:var(--orange);border-radius:50%;background:#fff;font-size:clamp(1.8rem,5vw,2.6rem);font-weight:1000}.result h2,.error h2{margin:5px 0 12px;font-size:clamp(1.8rem,4vw,2.7rem)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:760px;margin:20px auto}.metric{padding:15px 8px;border:3px solid #d0e3e5;border-radius:18px;background:#fff}.metric strong{display:block;margin-top:4px;color:#246f74;font-size:clamp(1.55rem,4vw,2.2rem)}.action{display:inline-flex;align-items:center;justify-content:center;min-height:52px;margin-top:8px;padding:11px 22px;border-radius:16px;background:var(--blue);color:#fff;font-weight:1000;text-decoration:none;box-shadow:0 5px #1d5479}.dashboard{position:relative;z-index:4;min-height:clamp(94px,16vh,140px);border-top:11px solid var(--navy);background:linear-gradient(180deg,#394f70,#172948 76%);box-shadow:0 -9px 20px #17294855}.wheel{position:absolute;bottom:-80px;left:50%;width:210px;height:210px;transform:translateX(-50%);border:27px solid #131f34;border-radius:50%;background:#415879;box-shadow:inset 0 0 0 11px #8fa8b5}.wheel:after{content:"";position:absolute;inset:53px;border-radius:50%;background:#f2a149;box-shadow:0 0 0 10px #253954}.speed{position:absolute;bottom:18px;left:calc(50% - 230px);color:#fff;font-size:.86rem;font-weight:1000}.speed b{display:block;color:#ffdc63;font-size:1.25rem}.mirror{position:absolute;right:8%;top:20px;width:80px;height:47px;border:7px solid #e58541;border-radius:9px 17px 17px 9px;background:linear-gradient(135deg,#d7f7fb,#74b9d4)}
@media(max-width:650px){.cab:before,.cab:after{width:20vw;min-width:36px;height:69%}.topbar{padding:10px 15px}.back{min-height:40px;padding:9px 11px}.back span{display:none}.brand{font-size:.86rem}.badge{font-size:.75rem}.windshield{padding:0 21px 5px}.panel{padding:22px 17px;border-width:7px;border-radius:24px 24px 17px}.button{min-width:145px;min-height:56px;font-size:1rem}.metrics{grid-template-columns:1fr}.dashboard{min-height:82px}.speed{left:20px;bottom:14px}.wheel{width:155px;height:155px;bottom:-66px;border-width:20px}.wheel:after{inset:38px}.mirror{right:7%;width:55px;height:35px}.passage,.reading-now{font-size:clamp(1.22rem,6.2vw,1.85rem)}}@media(prefers-reduced-motion:reduce){.wind:before,.wind:after{animation:none}}
</style></head><body>
<main class="cab"><div class="scenery" aria-hidden="true"></div><div class="wind" aria-hidden="true"></div><header class="topbar"><a class="back" href="{% url 'assessment' %}" aria-label="Back to activities">&larr; <span>Activities</span></a><span class="brand">PABASA READING RIDE</span><span class="badge" id="languageBadge"></span></header><section class="windshield"><section class="panel" id="activityStage" aria-live="polite"><p class="eyebrow" id="setName"></p><h1 id="activityTitle">Reading Ride</h1><p class="instruction" id="instruction"></p><p class="passage" id="passage"></p><div class="controls" id="controls"><button class="button start" id="startButton" type="button">Start</button><button class="button listen" id="listenButton" type="button">Read Aloud</button></div><p class="status" id="status" role="status"></p></section></section><footer class="dashboard" aria-hidden="true"><span class="speed">READING TIME <b id="dashTimer">00:00</b></span><span class="wheel"></span><span class="mirror"></span></footer></main>
{{ fluency_activity|json_script:"fluency-activity-data" }}
<script>
(()=>{'use strict';const node=document.getElementById('fluency-activity-data'),data=node?JSON.parse(node.textContent):{},passage=String(data.passage||'').trim(),fil=String(data.language||'').toLowerCase().startsWith('fil'),copy=fil?{instruction:'Basahin ang talata nang malakas at tuloy-tuloy. May isang minuto ka.',start:'Simulan',listen:'Basahin nang Malakas',ready:'Pindutin ang Simulan kapag handa ka. Pagkatapos ng bilang, magsalita kaagad.',count:'Maghanda...',recording:'Nagbabasa na. Pindutin ang HUMINTO kapag tapos ka.',stop:'HUMINTO',limit:'Natapos ang isang minuto. Sinusuri ang iyong pagbasa...',saving:'Sinusuri at itinatala ang iyong pagbasa...',done:'Naitala ang iyong pagbasa!',correct:'Tamang salita',accuracy:'Katumpakan',cwpm:'Tamang salita bawat minuto',back:'Bumalik sa mga Gawain',retry:'Subukang Muli',saveError:'Hindi nasuri o naitala ang recording.',audioError:'Hindi available ang modelong audio ngayon.',micError:'Payagan ang mikropono upang magsimula.',noSupport:'Hindi kayang mag-record ng browser na ito.'}:{instruction:'Read the passage aloud smoothly. You have one minute.',start:'Start',listen:'Read Aloud',ready:'Press Start when you are ready. Speak as soon as the countdown ends.',count:'Get ready...',recording:'Reading now. Press STOP when you finish.',stop:'STOP',limit:'One minute is complete. Checking your reading...',saving:'Checking and recording your reading...',done:'Your reading is recorded!',correct:'Correct words',accuracy:'Accuracy',cwpm:'Correct words per minute',back:'Back to Activities',retry:'Try Again',saveError:'The recording could not be analyzed or saved.',audioError:'Model audio is unavailable right now.',micError:'Allow microphone access to start.',noSupport:'Recording is unavailable in this browser.'},el=id=>document.getElementById(id);let activeAudio=null,stream=null,recorder=null,chunks=[],recordStarted=0,timerId=null,elapsed=0,lastBlob=null;const MAX_SECONDS=60,csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'',base64Blob=(value,type)=>{const bytes=atob(value),array=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)array[i]=bytes.charCodeAt(i);return new Blob([array],{type:type||'audio/mpeg'})},mimeType=()=>['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(type=>window.MediaRecorder?.isTypeSupported?.(type))||'';
el('activityTitle').textContent=data.title||'Reading Ride';el('instruction').textContent=data.instructions||copy.instruction;el('languageBadge').textContent=fil?'Filipino':'English';el('setName').textContent=[data.assigned_week_display,data.reading_set].filter(Boolean).join(' • ')||'Reading Fluency';el('passage').textContent=passage;el('startButton').textContent=copy.start;el('listenButton').textContent=copy.listen;el('status').textContent=copy.ready;
function time(v){return `${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`}function setTimer(v){const value=time(v);el('dashTimer').textContent=value;const recordTimer=el('recordTimer');if(recordTimer)recordTimer.textContent=value}async function playNarration(){const button=el('listenButton');if(activeAudio){activeAudio.pause();activeAudio=null}button.disabled=true;try{const form=new FormData();form.append('target_text',passage);form.append('mode','paragraph');form.append('language',data.language||'');form.append('material_id',data.material_id||data.id);const response=await fetch(data.tts_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json();if(!response.ok||!result.success)throw Error(result.error||copy.audioError);const url=URL.createObjectURL(base64Blob(result.audio_content,result.mime_type));activeAudio=new Audio(url);activeAudio.onended=()=>{URL.revokeObjectURL(url);activeAudio=null};await activeAudio.play()}catch(e){el('status').textContent=copy.audioError}finally{button.disabled=false}}
function countdown(seconds=3){return new Promise(resolve=>{el('controls').hidden=true;el('passage').hidden=true;el('status').textContent=copy.count;const n=document.createElement('div');n.className='countdown';el('activityStage').insertBefore(n,el('controls'));let v=seconds;n.textContent=v;const id=setInterval(()=>{v--;if(v<=0){clearInterval(id);n.remove();resolve()}else n.textContent=v},1000)})}async function beginTest(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){el('status').textContent=copy.noSupport;return}if(activeAudio){activeAudio.pause();activeAudio=null}el('startButton').disabled=true;el('listenButton').disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});await countdown();chunks=[];const type=mimeType();recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onerror=()=>recordError(copy.saveError);recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder?.mimeType||type||'audio/webm'});lastBlob=blob;cleanup();submit(blob)};recorder.start();recordStarted=Date.now();elapsed=0;setTimer(0);timerId=setInterval(()=>{elapsed=Math.min(MAX_SECONDS,Math.max(1,Math.round((Date.now()-recordStarted)/1000)));setTimer(elapsed);if(elapsed>=MAX_SECONDS){el('status').textContent=copy.limit;stopTest()}},250);showRecording()}catch(e){cleanup();el('controls').hidden=false;el('passage').hidden=false;el('startButton').disabled=false;el('listenButton').disabled=false;el('status').textContent=e?.name==='NotAllowedError'?copy.micError:copy.saveError}}
function showRecording(){el('passage').hidden=true;const timer=document.createElement('div');timer.className='timer';timer.id='recordTimer';timer.textContent='00:00';const reading=document.createElement('p');reading.className='reading-now';reading.textContent=passage;el('activityStage').insertBefore(timer,el('controls'));el('activityStage').insertBefore(reading,el('controls'));el('controls').hidden=false;el('listenButton').hidden=true;el('startButton').disabled=false;el('startButton').className='button stop';el('startButton').textContent=copy.stop;el('startButton').onclick=stopTest;el('status').textContent=copy.recording}function stopTest(){if(recorder?.state==='recording'){elapsed=Math.min(MAX_SECONDS,Math.max(1,Math.round((Date.now()-recordStarted)/1000)));clearInterval(timerId);el('startButton').disabled=true;recorder.stop()}}function cleanup(){clearInterval(timerId);timerId=null;stream?.getTracks().forEach(t=>t.stop());stream=null;recorder=null}function recordError(message){cleanup();el('startButton').disabled=false;el('startButton').className='button start';el('startButton').textContent=copy.start;el('startButton').onclick=beginTest;el('listenButton').hidden=false;el('listenButton').disabled=false;el('status').textContent=message}
async function submit(blob){el('activityStage').innerHTML='<div class="saving"><div class="timer">...</div><h2></h2><p></p></div>';const root=el('activityStage');root.querySelector('h2').textContent=copy.saving;root.querySelector('p').textContent=copy.recording;try{if(!blob?.size)throw Error(copy.saveError);const form=new FormData();form.append('material_id',data.material_id||data.id);form.append('duration_seconds',String(Math.min(MAX_SECONDS,Math.max(1,elapsed)));form.append('audio',blob,`fluency-${Date.now()}.webm`);const response=await fetch(data.completion_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json();if(!response.ok||!result.success)throw Error(result.error||copy.saveError);resultView(result.result||{})}catch(e){el('activityStage').innerHTML='<div class="error"><h2></h2><p></p><button class="button stop" type="button"></button><a class="action" href="{% url 'assessment' %}"></a></div>';const r=el('activityStage');r.querySelector('h2').textContent=copy.saveError;r.querySelector('p').textContent=e.message||copy.saveError;r.querySelector('button').textContent=copy.retry;r.querySelector('button').onclick=()=>lastBlob?submit(lastBlob):location.reload();r.querySelector('a').textContent=copy.back}}function resultView(result){const correct=Number(result.correct_items||0),total=Number(result.items_completed||0),accuracy=Number(result.accuracy||0),cwpm=Number(result.wpm||0);el('activityStage').innerHTML='<div class="result"><h2></h2><div class="metrics"><div class="metric"><span></span><strong></strong></div><div class="metric"><span></span><strong></strong></div><div class="metric"><span></span><strong></strong></div></div><a class="action" href="{% url 'assessment' %}"></a></div>';const r=el('activityStage'),m=r.querySelectorAll('.metric');r.querySelector('h2').textContent=copy.done;m[0].querySelector('span').textContent=copy.correct;m[0].querySelector('strong').textContent=`${correct} / ${total}`;m[1].querySelector('span').textContent=copy.accuracy;m[1].querySelector('strong').textContent=`${accuracy.toFixed(1)}%`;m[2].querySelector('span').textContent=copy.cwpm;m[2].querySelector('strong').textContent=cwpm.toFixed(1);r.querySelector('a').textContent=copy.back}window.addEventListener('beforeunload',cleanup);el('listenButton').onclick=playNarration;el('startButton').onclick=beginTest;if(data.completion?.completed)resultView(data.completion);else if(!passage){el('activityStage').innerHTML='<div class="error"><h2>Activity content is unavailable.</h2><a class="action" href="{% url 'assessment' %}">Back to Activities</a></div>'}})();
</script></body></html>
