{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Read With Me | PABASA</title><link rel="icon" href="{% static 'pabasa_app/images/pabasalogo.png' %}">
<style>
:root{--ink:#24304f;--violet:#6457c7;--dark:#403696;--blue:#238fbd;--green:#23844f}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;background:radial-gradient(circle at 8% 14%,#c9f0ff 0 9%,transparent 10%),radial-gradient(circle at 92% 8%,#e6d9ff 0 10%,transparent 11%),linear-gradient(145deg,#eefaff,#faf6ff 55%,#fffbe9)}button,a{font:inherit}.app{width:min(1020px,calc(100% - 28px));margin:auto;padding:20px 0 36px}.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;margin-bottom:18px}.back{display:inline-flex;align-items:center;gap:7px;min-height:48px;padding:10px 16px;border:2px solid #c9dce8;border-radius:16px;background:#fff;color:#28566f;font-weight:900;text-decoration:none;box-shadow:0 4px 0 #d6e4ec}.logo{height:48px;justify-self:center}.language{padding:9px 14px;border:2px solid #d4cdf6;border-radius:999px;background:#efeaff;color:var(--dark);font-weight:900}.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:24px 28px;border:3px solid #a9bce9;border-radius:28px;background:linear-gradient(130deg,#d7f2ff,#e9e1ff);box-shadow:0 8px 0 #c4ceed}.eyebrow{margin:0 0 5px;color:#4b4396;font-size:.8rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(1.65rem,4vw,2.5rem);line-height:1.05}.hero p{margin:8px 0 0;font-weight:700}.mascot{width:clamp(90px,14vw,135px);filter:drop-shadow(0 8px 5px #3e38722f)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 15px}.step{display:flex;align-items:center;justify-content:center;gap:8px;min-height:51px;padding:8px;border:2px solid #d7ddf3;border-radius:17px;background:#f8fbff;color:#657286;font-weight:900}.step b{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#e6eaf5}.step.active{color:#fff;border-color:var(--dark);background:var(--violet);box-shadow:0 5px 0 #433a98}.step.active b{background:#fff;color:var(--dark)}.card{padding:clamp(22px,5vw,42px);border:3px solid #c9c5f3;border-radius:30px;background:#fffffff7;box-shadow:0 9px 0 #d8d5f4,0 18px 34px #2933561b}.stage-label{text-align:center;color:var(--dark);font-size:1.05rem;font-weight:900;margin-bottom:14px}.passage{max-width:820px;margin:auto;font-family:Georgia,serif;font-size:clamp(1.35rem,3.2vw,2rem);line-height:1.8;text-align:center}.phrases{display:grid;gap:12px;max-width:780px;margin:auto}.phrase{min-height:64px;padding:12px 18px;border:3px solid #d9d6f5;border-radius:18px;background:#f8f7ff;color:var(--ink);font-family:Georgia,serif;font-size:clamp(1.1rem,2.5vw,1.45rem);line-height:1.4;text-align:left;cursor:pointer}.phrase:hover,.phrase:focus-visible{outline:none;border-color:var(--violet);transform:translateY(-1px)}.phrase.practiced{border-color:#58a9cc;background:#edf9ff}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:12px 22px;border-radius:17px;font-weight:900;cursor:pointer}.listen{border:2px solid #147ca8;background:var(--blue);color:#fff;box-shadow:0 5px 0 #176685}.next{border:2px solid var(--dark);background:var(--violet);color:#fff;box-shadow:0 5px 0 var(--dark)}.button:active{transform:translateY(3px);box-shadow:0 2px 0 #344567}.note{min-height:29px;margin:20px 0 0;text-align:center;color:#4d478d;font-weight:900}.checklist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:800px;margin:26px auto 0}.check{display:flex;align-items:center;gap:10px;min-height:67px;padding:12px;border:3px solid #dcd9f4;border-radius:18px;background:#faf9ff;font-weight:900;cursor:pointer}.check input{width:25px;height:25px;accent-color:var(--green)}.empty,.complete{text-align:center;padding:38px 10px}.complete h2{font-size:clamp(2rem,5vw,3rem);margin:0}.complete a{display:inline-flex;margin-top:18px;padding:13px 22px;border-radius:16px;background:var(--violet);color:#fff;font-weight:900;text-decoration:none}.stars{font-size:2.5rem;letter-spacing:7px;margin-bottom:8px}@media(max-width:700px){.app{width:calc(100% - 18px);padding-top:10px}.top{grid-template-columns:auto 1fr}.logo{justify-self:end;height:39px}.language{grid-column:1/-1;justify-self:center}.hero{padding:20px}.mascot{width:82px}.steps{gap:5px}.step{font-size:.78rem}.step b{width:25px;height:25px}.card{border-radius:24px}.checklist{grid-template-columns:1fr}.back span{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="app"><header class="top"><a class="back" href="{% url 'assessment' %}" aria-label="Back to activities">← <span>Activities</span></a><img class="logo" src="{% static 'pabasa_app/images/pabasalogo.png' %}" alt="PABASA"><span class="language" id="languageBadge"></span></header><section class="hero"><div><p class="eyebrow" id="setName"></p><h1 id="activityTitle">Read With Me</h1><p id="instruction"></p></div><img class="mascot" src="{% static 'pabasa_app/images/footer-mascot.png' %}" alt="PABASA reading buddy"></section><nav class="steps" aria-label="Reading steps"><div class="step active"><b>1</b><span id="listenStep"></span></div><div class="step"><b>2</b><span id="practiceStep"></span></div><div class="step"><b>3</b><span id="readStep"></span></div></nav><section class="card" id="activityCard" aria-live="polite"><div class="stage-label" id="stageLabel"></div><div class="passage" id="passage"></div><div class="phrases" id="phrases" hidden></div><div class="checklist" id="checklist" hidden></div><div class="controls"><button class="button listen" id="listenButton" type="button">🔊 <span id="listenLabel"></span></button><button class="button next" id="nextButton" type="button"></button></div><p class="note" id="note" role="status"></p></section></main>
{{ fluency_activity|json_script:"fluency-activity-data" }}
<script>(()=>{'use strict';const node=document.getElementById('fluency-activity-data'),data=node?JSON.parse(node.textContent):{},passage=String(data.passage||'').trim(),given=Array.isArray(data.phrases)?data.phrases.map(String).map(x=>x.trim()).filter(Boolean):[],phrases=given.length?given:(passage.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[]).map(x=>x.trim()).filter(Boolean),fil=String(data.language||'').toLowerCase().startsWith('fil'),copy=fil?{steps:['Makinig','Magsanay','Bumasa'],model:'Pakinggan muna ang mahusay na pagbasa.',practice:'Pindutin at basahin ang bawat bahagi.',read:'Basahin nang malakas ang buong talata.',listen:'Pakinggan',buttons:['Magsanay →','Buong Pagbasa →','Tapos Na Ako'],notes:['Pakinggan ang bilis, paghinto, at malinaw na pagbigkas.','Basahin ang bawat bahagi nang hindi minamadali.','Basahin nang wasto, tuloy-tuloy, at malinaw.'],checks:['Wasto ang mga salita','Tuloy-tuloy ang pagbasa','Malinaw ang boses'],checkFirst:'Lagyan ng tsek ang tatlong gabay bago matapos.',done:'Mahusay na pagbasa!',doneText:'Natapos mo ang pakikinig, pagsasanay, at pagbasa.',back:'Bumalik sa mga Gawain',empty:'Walang talatang nakalagay sa gawaing ito.'}:{steps:['Listen','Practice','Read'],model:'Listen to a smooth reading first.',practice:'Tap and practice each reading chunk.',read:'Read the whole passage aloud.',listen:'Listen',buttons:['Start Practice →','Read the Passage →','I Finished!'],notes:['Listen for pace, pauses, and clear words.','Read each chunk smoothly without rushing.','Read accurately, smoothly, and clearly.'],checks:['My words were accurate','My reading was smooth','My voice was clear'],checkFirst:'Check all three reading goals before you finish.',done:'Wonderful reading!',doneText:'You completed listen, practice, and read.',back:'Back to Activities',empty:'This activity does not have a passage yet.'},el=id=>document.getElementById(id);let stage=0;el('activityTitle').textContent=data.title||'Read With Me';el('instruction').textContent=data.instructions||(fil?'Makinig, magsanay, at basahin nang wasto, tuloy-tuloy, at malinaw.':'Listen, practice, then read accurately, smoothly, and clearly.');el('languageBadge').textContent=fil?'Filipino':'English';el('setName').textContent=[data.assigned_week_display,data.reading_set].filter(Boolean).join(' • ')||'Reading Fluency';['listenStep','practiceStep','readStep'].forEach((id,n)=>el(id).textContent=copy.steps[n]);el('listenLabel').textContent=copy.listen;const speak=text=>{if(!('speechSynthesis'in window)||!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=fil?'fil-PH':'en-PH';u.rate=.78;speechSynthesis.speak(u)},finish=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();el('activityCard').innerHTML='<div class="complete"><div class="stars" aria-hidden="true">⭐ ⭐ ⭐</div><h2></h2><p></p><a href="{% url 'assessment' %}"></a></div>';const r=el('activityCard');r.querySelector('h2').textContent=copy.done;r.querySelector('p').textContent=copy.doneText;r.querySelector('a').textContent=copy.back};function render(){if(!passage){el('activityCard').innerHTML='<div class="empty"><h2></h2></div>';el('activityCard').querySelector('h2').textContent=copy.empty;return}document.querySelectorAll('.step').forEach((x,n)=>x.classList.toggle('active',n===stage));el('passage').hidden=stage===1;el('phrases').hidden=stage!==1;el('checklist').hidden=stage!==2;el('stageLabel').textContent=[copy.model,copy.practice,copy.read][stage];el('note').textContent=copy.notes[stage];el('note').style.color='';el('nextButton').textContent=copy.buttons[stage];el('listenButton').onclick=()=>speak(passage);if(stage!==1)el('passage').textContent=passage;if(stage===1){const r=el('phrases');r.replaceChildren();phrases.forEach(text=>{const b=document.createElement('button');b.type='button';b.className='phrase';b.textContent=text;b.onclick=()=>{b.classList.add('practiced');speak(text)};r.appendChild(b)})}if(stage===2){const r=el('checklist');r.replaceChildren();copy.checks.forEach(text=>{const label=document.createElement('label');label.className='check';const box=document.createElement('input');box.type='checkbox';const span=document.createElement('span');span.textContent=text;label.append(box,span);r.appendChild(label)})}el('nextButton').onclick=()=>{if(stage<2){stage++;render();return}const boxes=[...el('checklist').querySelectorAll('input')];if(boxes.some(x=>!x.checked)){el('note').textContent=copy.checkFirst;el('note').style.color='#a2463e';return}finish()}}render()})();</script></body></html>
