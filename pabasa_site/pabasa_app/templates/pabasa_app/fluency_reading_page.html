{% load static %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Road Challenge | PABASA</title><link rel="icon" href="{% static 'pabasa_app/images/pabasalogo.png' %}">
<style>
:root{--sky:#8dd9f3;--ink:#173450;--road:#3f4650;--yellow:#ffd04a;--red:#e95555;--green:#34a866;--blue:#267fa8;--paper:#fffdf7}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;background:linear-gradient(#8bd9f4 0 38%,#d7f1ca 38% 53%,#555d64 53% 100%);overflow-x:hidden}button,a{font:inherit}.clouds{position:fixed;inset:0 0 auto;height:38vh;pointer-events:none;background:radial-gradient(ellipse at 12% 24%,#fff 0 5%,transparent 5.5%),radial-gradient(ellipse at 18% 24%,#fff 0 7%,transparent 7.5%),radial-gradient(ellipse at 82% 17%,#fff 0 6%,transparent 6.5%),radial-gradient(ellipse at 88% 17%,#fff 0 4.5%,transparent 5%);opacity:.82}.road{position:fixed;z-index:0;left:0;right:0;bottom:0;height:47vh;background:linear-gradient(90deg,transparent 0 48%,#f3e27c 48% 49%,transparent 49% 51%,#f3e27c 51% 52%,transparent 52%),linear-gradient(#464d55,#353b42)}.road:before,.road:after{content:"";position:absolute;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 72px)}.road:before{left:0;right:0;top:28%;height:8px}.road:after{left:0;right:0;bottom:26%;height:8px}.crosswalk{position:fixed;z-index:0;left:50%;bottom:0;width:190px;height:47vh;transform:translateX(-50%);background:repeating-linear-gradient(0deg,#ffffffde 0 18px,transparent 18px 38px);clip-path:polygon(26% 0,74% 0,100% 100%,0 100%);opacity:.82}.app{position:relative;z-index:2;width:min(1040px,calc(100% - 28px));margin:auto;padding:18px 0 42px}.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;margin-bottom:15px}.back{display:inline-flex;align-items:center;gap:7px;min-height:48px;padding:10px 16px;border:2px solid #ffffffcc;border-radius:16px;background:#225f7fe8;color:#fff;font-weight:900;text-decoration:none;box-shadow:0 5px 0 #16425b}.logo{height:47px;justify-self:center}.badge{padding:9px 14px;border:2px solid #f3b93f;border-radius:999px;background:#ffd25b;color:#4a3500;font-weight:900}.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;padding:20px 26px;border:3px solid #fff;border-radius:28px;background:#ffffffec;box-shadow:0 9px 0 #5ca7c4,0 18px 40px #1c526b47}.eyebrow{margin:0 0 5px;color:#247b9f;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(1.6rem,4vw,2.45rem);line-height:1.05}.hero p{max-width:700px;margin:8px 0 0;font-weight:700}.mascot{width:clamp(80px,13vw,122px)}.route{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 15px}.route:before{content:"";position:absolute;left:8%;right:8%;top:50%;height:7px;transform:translateY(-50%);background:#fff;border:2px solid #d7bf64}.step{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;padding:8px;border:3px solid #fff;border-radius:18px;background:#eaf7fc;color:#5e7380;font-weight:900;box-shadow:0 5px 0 #9eb9c4}.step b{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#cadde5}.step.active{background:#ffd45b;color:#493600;border-color:#fff0a1;box-shadow:0 5px 0 #c29129}.step.done{background:#dff6e7;color:#236543;box-shadow:0 5px 0 #72aa86}.stage{position:relative;padding:clamp(22px,5vw,40px);border:4px solid #fff;border-radius:30px;background:#fffdf8fa;box-shadow:0 10px 0 #2c343c,0 24px 50px #16212b66;overflow:hidden}.traffic{position:absolute;right:20px;top:18px;display:grid;gap:5px;padding:8px;border:3px solid #202932;border-radius:15px;background:#39444e}.light{width:18px;height:18px;border-radius:50%;background:#172028}.light.red.on{background:var(--red);box-shadow:0 0 12px var(--red)}.light.yellow.on{background:var(--yellow);box-shadow:0 0 12px var(--yellow)}.light.green.on{background:var(--green);box-shadow:0 0 12px var(--green)}.stage-label{padding-right:55px;text-align:center;color:#216f91;font-size:1.05rem;font-weight:900;margin-bottom:14px}.passage{max-width:830px;margin:auto;font-family:Georgia,serif;font-size:clamp(1.3rem,3vw,1.85rem);line-height:1.75;text-align:center}.phrases{display:grid;gap:11px;max-width:800px;margin:auto}.phrase{min-height:61px;padding:11px 18px;border:3px solid #a8d7e8;border-radius:17px;background:#f1fbff;color:var(--ink);font-family:Georgia,serif;font-size:clamp(1.05rem,2.4vw,1.35rem);line-height:1.4;text-align:left;cursor:pointer}.phrase.practiced{border-color:#49a66e;background:#e9f9ef}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:12px 22px;border:2px solid transparent;border-radius:17px;font-weight:900;cursor:pointer}.listen{border-color:#1e6687;background:#2b8db8;color:#fff;box-shadow:0 5px 0 #195979}.next{border-color:#9b7422;background:#ffd252;color:#443000;box-shadow:0 5px 0 #ae8126}.stop{border-color:#9c3333;background:#ef5a58;color:#fff;box-shadow:0 5px 0 #9d3332}.button:disabled{opacity:.55;cursor:not-allowed}.note{min-height:29px;margin:19px 0 0;text-align:center;color:#336c84;font-weight:900}.timer{display:grid;place-items:center;width:132px;height:132px;margin:8px auto 17px;border:9px solid #d5e9ef;border-top-color:#f0b92f;border-radius:50%;background:#fff;font-size:2rem;font-weight:1000;color:#244c5f}.countdown{font-size:clamp(5rem,15vw,8rem);font-weight:1000;color:#e9a625;text-align:center;text-shadow:0 6px 0 #865f16}.car-track{position:relative;height:47px;margin:22px 0 0;border-radius:12px;background:#474e56;overflow:hidden}.car-track:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:4px dashed #fff6a2}.car{position:absolute;z-index:1;left:4%;bottom:8px;width:66px;height:25px;border-radius:13px 18px 7px 7px;background:#ef5b43;transition:left .6s}.car:before{content:"";position:absolute;left:15px;top:-13px;width:35px;height:18px;border-radius:16px 16px 0 0;background:#ef5b43}.car:after{content:"●     ●";position:absolute;left:9px;top:16px;color:#17232b;font-size:18px;letter-spacing:18px}.saving,.result,.error{text-align:center;padding:30px 8px}.result h2,.error h2{margin:7px 0;font-size:clamp(2rem,5vw,2.8rem)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:760px;margin:23px auto}.metric{padding:16px 10px;border:3px solid #cce3ea;border-radius:18px;background:#fff}.metric strong{display:block;color:#216f91;font-size:clamp(1.6rem,4vw,2.2rem)}.transcript{max-width:760px;margin:15px auto;padding:14px;border-radius:15px;background:#edf5f7;text-align:left}.action{display:inline-flex;align-items:center;justify-content:center;min-height:52px;margin:8px;padding:11px 22px;border:0;border-radius:16px;background:#287da2;color:#fff;font-weight:900;text-decoration:none;cursor:pointer;box-shadow:0 5px 0 #17536e}.retry{background:#ec5d53;box-shadow:0 5px 0 #9f382f}@media(max-width:700px){.app{width:calc(100% - 18px);padding-top:10px}.top{grid-template-columns:auto 1fr}.logo{justify-self:end;height:39px}.badge{grid-column:1/-1;justify-self:center}.hero{padding:17px}.mascot{width:72px}.route{gap:5px}.step{font-size:.76rem}.step b{width:24px;height:24px}.stage{border-radius:24px}.metrics{grid-template-columns:1fr}.traffic{right:10px;top:10px}.back span{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="clouds"></div><div class="road"></div><div class="crosswalk"></div><main class="app"><header class="top"><a class="back" href="{% url 'assessment' %}" aria-label="Back to activities">← <span>Activities</span></a><img class="logo" src="{% static 'pabasa_app/images/pabasalogo.png' %}" alt="PABASA"><span class="badge" id="languageBadge"></span></header><section class="hero"><div><p class="eyebrow" id="setName"></p><h1 id="activityTitle">Reading Road Challenge</h1><p id="instruction"></p></div><img class="mascot" src="{% static 'pabasa_app/images/footer-mascot.png' %}" alt="PABASA reading buddy"></section><nav class="route" aria-label="Reading route"><div class="step active"><b>1</b><span id="listenStep"></span></div><div class="step"><b>2</b><span id="practiceStep"></span></div><div class="step"><b>3</b><span id="readStep"></span></div></nav><section class="stage" id="activityStage" aria-live="polite"><div class="traffic" aria-label="Traffic signal"><span class="light red"></span><span class="light yellow on"></span><span class="light green"></span></div><div class="stage-label" id="stageLabel"></div><div class="passage" id="passage"></div><div class="phrases" id="phrases" hidden></div><div id="recordingArea" hidden></div><div class="controls" id="controls"><button class="button listen" id="listenButton" type="button">🔊 <span id="listenLabel"></span></button><button class="button next" id="nextButton" type="button"></button></div><p class="note" id="note" role="status"></p><div class="car-track" aria-hidden="true"><span class="car" id="car"></span></div></section></main>
{{ fluency_activity|json_script:"fluency-activity-data" }}
<script>
(()=>{'use strict';
const node=document.getElementById('fluency-activity-data'),data=node?JSON.parse(node.textContent):{},passage=String(data.passage||'').trim(),given=Array.isArray(data.phrases)?data.phrases.map(String).map(x=>x.trim()).filter(Boolean):[],phrases=given.length?given:(passage.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[]).map(x=>x.trim()).filter(Boolean),fil=String(data.language||'').toLowerCase().startsWith('fil'),copy=fil?{steps:['Makinig','Magsanay','Bumasa'],labels:['Pakinggan ang mahusay na pagbasa.','Pindutin at basahin ang bawat bahagi.','Humanda sa iyong Reading Road Test.'],listen:'Pakinggan',buttons:['Magsanay →','Pumunta sa Test →','Simulan ang Test'],notes:['Pakinggan ang bilis, paghinto, at malinaw na pagbigkas.','Basahin nang tuloy-tuloy at huwag magmadali.','Pindutin ang Simulan kapag handa ka na.'],recording:'Basahin nang malakas. Pindutin ang Tapos kapag natapos.',finish:'Tapos Na Ako',saving:'Sinusuri at itinatala ang iyong pagbasa…',done:'Naitala ang iyong Reading Road Test!',correct:'Tamang salita',accuracy:'Katumpakan',cwpm:'Tamang salita bawat minuto',back:'Bumalik sa mga Gawain',retry:'Subukang Muli',saveError:'Hindi nasuri o naitala ang recording.',audioError:'Hindi available ang modelong audio ngayon.',micError:'Payagan ang mikropono upang simulan ang test.',noSupport:'Hindi kayang mag-record ng browser na ito.',transcript:'Narinig na pagbasa'}:{steps:['Listen','Practice','Read'],labels:['Listen to a smooth model reading.','Tap and practice each reading chunk.','Get ready for your Reading Road Test.'],listen:'Listen',buttons:['Start Practice →','Go to the Test →','Start the Test'],notes:['Listen for pace, pauses, and clear words.','Read smoothly without rushing.','Press Start when you are ready.'],recording:'Read aloud. Press Finish when you reach the end.',finish:'I Finished',saving:'Checking and recording your reading…',done:'Your Reading Road Test is recorded!',correct:'Correct words',accuracy:'Accuracy',cwpm:'Correct words per minute',back:'Back to Activities',retry:'Try Again',saveError:'The recording could not be analyzed or saved.',audioError:'Model audio is unavailable right now.',micError:'Allow microphone access to start the test.',noSupport:'Recording is unavailable in this browser.',transcript:'Recognized reading'},el=id=>document.getElementById(id);let stage=0,activeAudio=null,stream=null,recorder=null,chunks=[],recordStarted=0,timerId=null,elapsed=0,lastBlob=null;
const csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'',base64Blob=(value,type)=>{const bytes=atob(value),array=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)array[i]=bytes.charCodeAt(i);return new Blob([array],{type:type||'audio/mpeg'})},mimeType=()=>['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(type=>window.MediaRecorder?.isTypeSupported?.(type))||'';
el('activityTitle').textContent=data.title||'Reading Road Challenge';el('instruction').textContent=data.instructions||(fil?'Makinig, magsanay, at basahin nang wasto, tuloy-tuloy, at malinaw.':'Listen, practice, then read accurately, smoothly, and clearly.');el('languageBadge').textContent=fil?'Filipino':'English';el('setName').textContent=[data.assigned_week_display,data.reading_set].filter(Boolean).join(' • ')||'Reading Fluency';['listenStep','practiceStep','readStep'].forEach((id,n)=>el(id).textContent=copy.steps[n]);el('listenLabel').textContent=copy.listen;
function lights(color){document.querySelectorAll('.light').forEach(x=>x.classList.remove('on'));document.querySelector(`.light.${color}`)?.classList.add('on')}
function routeState(position){document.querySelectorAll('.step').forEach((x,n)=>{x.classList.toggle('active',n===position);x.classList.toggle('done',n<position)});el('car').style.left=[4,37,67,88][Math.min(position,3)]+'%'}
async function playNarration(text){if(activeAudio){activeAudio.pause();activeAudio=null}const button=el('listenButton');button.disabled=true;try{const form=new FormData();form.append('target_text',text);form.append('mode','paragraph');form.append('language',data.language||'');form.append('material_id',data.material_id||data.id);const response=await fetch(data.tts_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json();if(!response.ok||!result.success)throw new Error(result.error||copy.audioError);const url=URL.createObjectURL(base64Blob(result.audio_content,result.mime_type));activeAudio=new Audio(url);activeAudio.onended=()=>{URL.revokeObjectURL(url);activeAudio=null};await activeAudio.play()}catch(error){el('note').textContent=copy.audioError;el('note').style.color='var(--red)'}finally{button.disabled=false}}
function render(){routeState(stage);lights(stage===2?'red':'yellow');el('passage').hidden=stage===1;el('phrases').hidden=stage!==1;el('recordingArea').hidden=true;el('controls').hidden=false;el('stageLabel').textContent=copy.labels[stage];el('note').textContent=copy.notes[stage];el('note').style.color='';el('nextButton').textContent=copy.buttons[stage];el('listenButton').hidden=stage===2;el('listenButton').onclick=()=>playNarration(passage);if(stage!==1)el('passage').textContent=passage;if(stage===1){const root=el('phrases');root.replaceChildren();phrases.forEach(text=>{const button=document.createElement('button');button.type='button';button.className='phrase';button.textContent=text;button.onclick=()=>{button.classList.add('practiced');playNarration(text)};root.appendChild(button)})}el('nextButton').onclick=()=>{if(stage<2){stage++;render()}else beginTest()}}
function countdown(seconds=3){return new Promise(resolve=>{el('passage').hidden=true;el('phrases').hidden=true;el('controls').hidden=true;const area=el('recordingArea');area.hidden=false;area.innerHTML='<div class="countdown"></div>';let value=seconds;area.firstElementChild.textContent=value;lights('yellow');const id=setInterval(()=>{value--;if(value<=0){clearInterval(id);resolve()}else area.firstElementChild.textContent=value},800)})}
async function beginTest(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){el('note').textContent=copy.noSupport;el('note').style.color='var(--red)';return}if(activeAudio){activeAudio.pause();activeAudio=null}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});await countdown();chunks=[];let failed=false;const type=mimeType();recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);recorder.ondataavailable=event=>{if(event.data?.size)chunks.push(event.data)};recorder.onerror=()=>{failed=true;recordError(copy.saveError)};recorder.onstop=()=>{if(failed)return;const blob=new Blob(chunks,{type:recorder?.mimeType||type||'audio/webm'});lastBlob=blob;cleanupRecorder();submitRecording(blob)};recorder.start();recordStarted=Date.now();elapsed=0;timerId=setInterval(()=>{elapsed=Math.max(1,Math.round((Date.now()-recordStarted)/1000));const value=el('timerValue');if(value)value.textContent=`${elapsed}s`;if(elapsed>=180)stopTest()},250);showRecording();lights('green');routeState(2)}catch(error){cleanupRecorder();el('controls').hidden=false;el('recordingArea').hidden=true;el('note').textContent=error?.name==='NotAllowedError'?copy.micError:copy.saveError;el('note').style.color='var(--red)'}}
function showRecording(){el('recordingArea').hidden=false;el('recordingArea').innerHTML='<div class="timer"><span id="timerValue">0s</span></div><div class="passage"></div>';el('recordingArea').querySelector('.passage').textContent=passage;el('controls').hidden=false;el('listenButton').hidden=true;el('nextButton').className='button stop';el('nextButton').textContent=copy.finish;el('nextButton').onclick=stopTest;el('stageLabel').textContent=copy.recording;el('note').textContent=copy.recording}
function stopTest(){if(recorder?.state==='recording'){elapsed=Math.max(1,Math.round((Date.now()-recordStarted)/1000));clearInterval(timerId);recorder.stop();el('nextButton').disabled=true;lights('red')}}
function cleanupRecorder(){clearInterval(timerId);timerId=null;stream?.getTracks().forEach(track=>track.stop());stream=null;recorder=null}
function recordError(message){cleanupRecorder();el('nextButton').disabled=false;el('nextButton').className='button next';el('nextButton').textContent=copy.buttons[2];el('nextButton').onclick=beginTest;el('note').textContent=message;el('note').style.color='var(--red)'}
async function submitRecording(blob){el('activityStage').innerHTML='<div class="saving"><div class="timer">…</div><h2></h2><p></p></div>';const root=el('activityStage');root.querySelector('h2').textContent=copy.saving;root.querySelector('p').textContent=copy.recording;try{if(!blob?.size)throw new Error(copy.saveError);const form=new FormData();form.append('material_id',data.material_id||data.id);form.append('duration_seconds',String(Math.max(1,elapsed)));form.append('audio',blob,`fluency-${Date.now()}.webm`);const response=await fetch(data.completion_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json();if(!response.ok||!result.success)throw new Error(result.error||copy.saveError);resultView(result.result||{})}catch(error){el('activityStage').innerHTML='<div class="error"><h2></h2><p></p><button class="action retry" type="button"></button><a class="action" href="{% url 'assessment' %}"></a></div>';const errorRoot=el('activityStage');errorRoot.querySelector('h2').textContent=copy.saveError;errorRoot.querySelector('p').textContent=error.message||copy.saveError;errorRoot.querySelector('button').textContent=copy.retry;errorRoot.querySelector('button').onclick=()=>lastBlob?submitRecording(lastBlob):location.reload();errorRoot.querySelector('a').textContent=copy.back}}
function resultView(result){routeState(3);lights('green');const correct=Number(result.correct_items||0),total=Number(result.items_completed||0),accuracy=Number(result.accuracy||0),cwpm=Number(result.wpm||0);el('activityStage').innerHTML='<div class="result"><div class="car-track" aria-hidden="true"><span class="car" style="left:88%"></span></div><h2></h2><div class="metrics"><div class="metric"><span></span><strong></strong></div><div class="metric"><span></span><strong></strong></div><div class="metric"><span></span><strong></strong></div></div><div class="transcript"><strong></strong><p></p></div><a class="action" href="{% url 'assessment' %}"></a></div>';const root=el('activityStage'),metrics=root.querySelectorAll('.metric');root.querySelector('h2').textContent=copy.done;metrics[0].querySelector('span').textContent=copy.correct;metrics[0].querySelector('strong').textContent=`${correct} / ${total}`;metrics[1].querySelector('span').textContent=copy.accuracy;metrics[1].querySelector('strong').textContent=`${accuracy.toFixed(1)}%`;metrics[2].querySelector('span').textContent=copy.cwpm;metrics[2].querySelector('strong').textContent=cwpm.toFixed(1);root.querySelector('.transcript strong').textContent=copy.transcript;root.querySelector('.transcript p').textContent=result.transcript||'—';root.querySelector('a').textContent=copy.back}
window.addEventListener('beforeunload',cleanupRecorder);if(data.completion?.completed)resultView(data.completion);else if(!passage){el('activityStage').innerHTML='<div class="error"><h2>Activity content is unavailable.</h2><a class="action" href="{% url 'assessment' %}">Back to Activities</a></div>'}else render();
})();
</script></body></html>
