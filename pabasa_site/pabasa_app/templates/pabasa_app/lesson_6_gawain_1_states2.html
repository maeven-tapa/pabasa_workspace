{% include "pabasa_app/lesson_6_gawain_1_authoritative.html" %}<style>#read.reading-state{animation:lesson6Pulse 1.15s ease-in-out infinite;box-shadow:0 0 0 6px #f4c85d55,0 5px #b77b1b}#read.processing-state{cursor:wait;box-shadow:0 0 0 6px #80cfd055,0 0 24px #2d8b7888,0 5px #1f6659}#read.processing-state:before{content:'';display:inline-block;width:14px;height:14px;margin-right:8px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:lesson6Spin .8s linear infinite}#read.read-now-state{animation:lesson6Pulse 1.15s ease-in-out infinite;background:#2d8b78}@keyframes lesson6Pulse{50%{transform:translateY(-2px);box-shadow:0 0 0 12px #f4c85d00,0 0 24px #f4c85db3,0 5px #b77b1b}}@keyframes lesson6Spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#read.reading-state,#read.read-now-state{animation:none}}</style><script type="text/plain" data-activity-bootstrap="lesson-6-gawain-1">document.addEventListener('click',function(e){if(e.target.id!=='read')return;const b=e.target;b.classList.add('reading-state');setTimeout(function(){if(b.disabled){b.classList.remove('reading-state');b.classList.add('processing-state')}},3600)},true);setInterval(function(){const b=document.getElementById('read');if(b?.textContent.trim()==='READ NOW')b.classList.add('read-now-state')},50)</script>
