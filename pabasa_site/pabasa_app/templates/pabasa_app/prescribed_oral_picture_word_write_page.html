<script>
(()=>{'use strict';const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),items=d.items||[],app=document.getElementById('app'),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||''),esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),norm=x=>String(x||'').trim().toLocaleLowerCase('fil-PH').replace(/\s+/g,' '),key=i=>String(i);let s=Object.assign({phase:'intro',current_item_index:0,completed_oral_reads:[],oral_attempts:{},read_aloud_plays:{},answers:[],completed_item_count:0,correct_answer_count:0,state_version:0},d.progress?.state||{}),busy=false,request=0,stream=null,narration=null,narrated='';const current=()=>Number(s.current_item_index)||0,total=items.length,done=()=>s.answers.length,stop=()=>{stream?.getTracks().forEach(t=>t.stop());stream=null},head=()=>`<p class="eyebrow">SESSION 6 &middot; LESSON 17 AT 18 &middot; GAWAIN 9</p><h1>${esc(d.display_title)}</h1><h2>${esc(d.title)}</h2><p class="instruction">${esc(d.instruction)}</p><div class="track"><i style="width:${done()/total*100}%"></i></div>`,picture=i=>`<div class="picture"><img src="${esc(i.image_url)}" alt="${esc(i.alt_text)}"></div>`;

async function read(n){if(busy)return;busy=true;const mine=++request,b=app.querySelector('#oral');try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono.');b.disabled=true;b.textContent='Nagbabasa...';stream=await navigator.mediaDevices.getUserMedia({audio:true});const parts=[],recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&parts.push(e.data);const audio=await new Promise(ok=>{recorder.onstop=()=>ok(new Blob(parts,{type:recorder.mimeType||'audio/webm'}));recorder.start();setTimeout(()=>recorder.state==='recording'&&recorder.stop(),3500)});stop();if(mine!==request)return;b.textContent='Pinoproseso...';const f=new FormData();f.append('audio',audio,'prescribed-reading.webm');f.append('target_text',items[n].id);f.append('language','Filipino');f.append('mode','reading');const r=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json().catch(()=>({}));if(mine!==request)return;if(r.ok&&j.success&&norm(j.transcript).includes(norm(items[n].id))){s.completed_oral_reads=[...new Set([...s.completed_oral_reads,n])];s.oral_attempts[key(n)]=0;s.read_aloud_plays[key(n)]=0;s.phase='written_answer';await save();render('Tama ang pagbasa! Isulat naman ang salita.','good')}else{s.oral_attempts[key(n)]=Math.min(3,(s.oral_attempts[key(n)]||0)+1);await save();render(s.oral_attempts[key(n)]>=3?'Pakinggan muna ang salita.':'Hindi pa. Subukan muli.','bad')}}catch(e){if(mine===request){s.oral_attempts[key(n)]=Math.min(3,(s.oral_attempts[key(n)]||0)+1);try{await save()}catch(_){}render(e.message||'Hindi nakuha ang boses. Subukan muli.','bad')}}finally{stop();busy=false}}
