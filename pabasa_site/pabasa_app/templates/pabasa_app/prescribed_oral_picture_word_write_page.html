{% load static %}
<script defer src="{% static 'pabasa_app/js/prescribed_session6_tts.js' %}?v=gawain9-local-audio-3"></script>
<!doctype html>
<html lang="fil">
<head>
  {% include 'pabasa_app/basahin_script.html' %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Basahin at Isulat ang Salita</title>
  <style>
    @font-face{font-family:Fredoka;src:url("{% static 'pabasa_app/font/fredoka-one.one-regular.ttf' %}") format('truetype');font-display:swap}
    *{box-sizing:border-box}
    :root{--ink:#183e63;--teal:#187f80;--teal-dark:#12696b;--mint:#a9ded1;--gold:#e7af45;--good:#26784e;--bad:#a43d48}
    body{height:100dvh;min-height:100dvh;margin:0;overflow:hidden;background:url("{% static 'pabasa_app/prescribed/PRESCRIBED-BG.jpg' %}") center/cover no-repeat;color:var(--ink);font-family:Fredoka,Nunito,"Segoe UI",sans-serif}
    .page{position:relative;display:grid;place-items:center;width:min(1180px,calc(100% - 40px));height:100dvh;margin:auto;padding:88px 0 18px}
    .back{position:fixed;top:16px;left:max(20px,calc((100vw - 1180px)/2));z-index:12;display:inline-flex;align-items:center;min-height:52px;padding:9px 18px;border-radius:999px;background:#fffffff0;color:var(--ink);font-size:1rem;text-decoration:none;box-shadow:0 5px 15px #145ca733}
    .back::before{content:"←";margin-right:9px;font-size:1.35rem}
    .card{display:flex;flex-direction:column;justify-content:center;width:min(100%,1000px);max-height:100%;padding:clamp(18px,3vh,32px) clamp(18px,4vw,48px);overflow-x:hidden;overflow-y:auto;border:2px solid #ffffffc7;border-radius:32px;background:#fffffff0;box-shadow:0 18px 45px #1e5b7a35;text-align:center}
    .eyebrow{margin:0 auto 7px;padding:6px 15px;border-radius:999px;background:#277f82;color:#fff;font-size:clamp(.7rem,1.1vw,.86rem);letter-spacing:.04em}
    h1{margin:0 0 9px;font-size:clamp(1.65rem,3.5vw,2.7rem);line-height:1.1}
    .instruction,.hint{margin:4px auto;color:#456876;font-weight:800;line-height:1.3}
    .instruction{max-width:720px;font-size:clamp(1rem,1.8vw,1.3rem)}
    .hint{font-size:clamp(1rem,1.7vw,1.2rem)}
    .button{min-width:min(290px,90%);min-height:66px;margin:9px auto 0;padding:13px 28px;border:0;border-radius:999px;background:var(--teal);box-shadow:0 5px 0 var(--teal-dark);color:#fff;font:inherit;font-size:clamp(1.15rem,2vw,1.4rem);font-weight:900;text-transform:uppercase;cursor:pointer}
    .button.gold{background:var(--gold);box-shadow:0 5px 0 #ae7927;color:#302700}
    .button[data-basahin-button]::before{content:"🎙️";margin-right:.45em}
    .button:disabled{opacity:.58;cursor:wait}
    .button:focus-visible,.back:focus-visible,input:focus-visible{outline:4px solid #e7af45;outline-offset:3px}
    .image-stage{display:grid;place-items:center;align-self:center;width:min(400px,100%);height:clamp(150px,28vh,245px);min-height:0;margin:10px auto;padding:12px;overflow:hidden;border:4px solid var(--mint);border-radius:25px;background:#fff}
    .image-stage img{display:block;width:100%;height:100%;min-width:0;min-height:0;max-width:100%;max-height:100%;object-fit:contain}
    .steps{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,22px);margin:8px auto 10px;color:var(--teal);font-size:clamp(1rem,2vw,1.25rem);font-weight:900}
    .steps span{padding:8px 13px;border-radius:18px;background:#e7f6f2}
    .steps b{color:#a47925;font-size:1.35em}
    .progress-wrap{width:min(650px,100%);margin:6px auto 9px}
    .dots{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}
    .dot{display:grid;place-items:center;width:30px;height:30px;border:2px solid #a9c7c7;border-radius:50%;background:#fff;color:#456876;font-size:.9rem}
    .dot.done{border-color:var(--teal);background:var(--teal);color:#fff}
    .track{height:10px;overflow:hidden;border-radius:999px;background:#e1eeee}
    .track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal),#83cbbc);transition:width .2s}
    .picture{height:clamp(150px,28vh,245px)}
    .action-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    .action-row .button{min-width:min(300px,100%);margin:7px 0}
    .action-row .button:only-child{min-width:min(360px,100%)}
    .status{min-height:1.4em;margin:5px 0 0;font-size:clamp(.95rem,1.6vw,1.12rem);font-weight:900}
    .good{color:var(--good)}.bad{color:var(--bad)}
    .letter-boxes{display:flex;justify-content:center;gap:clamp(4px,1vw,10px);margin:12px auto}
    .letter-box{display:grid;place-items:center;width:clamp(38px,7vw,58px);height:clamp(46px,8vh,64px);border:3px solid var(--mint);border-radius:12px;background:#fff;color:var(--teal-dark);font-size:clamp(1.35rem,3vw,2rem);font-weight:900}
    .answer{align-self:center;width:min(430px,100%);min-height:62px;padding:12px 18px;border:4px solid var(--mint);border-radius:18px;background:#fff;color:var(--ink);font:inherit;font-size:1.35rem;text-align:center}
    .answer{caret-color:var(--ink);cursor:text}
    .answer::placeholder{color:#77949a;opacity:1}
    .answer:focus::placeholder{color:transparent;opacity:0}
    .check{display:block;margin:8px auto 0}
    .success-check{color:var(--good);font-size:clamp(2.2rem,6vh,3.5rem);line-height:1}
    @media(max-width:650px){.page{width:calc(100% - 20px);padding:132px 0 10px}.back{top:72px;left:10px;min-height:44px;padding:8px 13px;font-size:.85rem}.card{padding:15px 12px;border-radius:24px}.image-stage{height:clamp(130px,23vh,185px);margin:8px auto;padding:9px;border-width:3px}.button{min-height:58px}.steps{margin:4px auto}.steps span{padding:7px 9px}}
    @media(max-height:650px){.page{padding-top:72px}.card{padding:10px 16px}.eyebrow{margin-bottom:4px;padding:4px 12px}h1{font-size:1.65rem;margin-bottom:4px}.image-stage{height:clamp(105px,24vh,150px);margin:5px auto;padding:7px}.progress-wrap{margin:3px auto 5px}.dot{width:25px;height:25px}.button{min-height:49px;margin-top:5px}.steps{margin:4px auto}.letter-boxes{margin:6px auto}.letter-box{height:43px}}
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="{% url 'assessment' %}">Bumalik sa Aking Aralin</a>
    <section id="app" class="card" aria-live="polite"></section>
  </main>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script>
  (()=>{
    'use strict';
    const data=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}');
    const items=data.items||[], app=document.getElementById('app');
    const root='/static/pabasa_app/prescribed/audio/SESSION_6/LESSON_17_18/GAWAIN_9/';
    const prompts=['unang_larawan_pana_tts.mp3','ikalawang_larawan_pisara_tts.mp3','ikatlong_larawan_palaka_tts.mp3','ika_apat_na_larawan_pito_tts.mp3','ikalimang_larawan_regalo_tts.mp3'];
    const csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||'');
    const esc=value=>String(value??'').replace(/[&<>\'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const norm=value=>String(value||'').trim().toLocaleLowerCase('fil-PH').replace(/\s+/g,' ');
    const defaults={phase:'intro',current_item_index:0,completed_oral_reads:[],oral_attempts:{},read_aloud_plays:{},answers:[],completed_item_count:0,correct_answer_count:0,state_version:0};
    let state={...defaults,...(data.progress?.state||{})},busy=false,request=0,stream=null,activePlayer=null;
    const savedPhase=String(state.phase||'intro');
    let initialNarrationStarted=false,started=savedPhase!=='intro',showActivityIntro=!data.progress?.activity_completed&&savedPhase==='intro',feedbackPlayedFor=-1,feedbackAudio=null;
    const current=()=>Math.max(0,Number(state.current_item_index)||0);
    const completed=()=>Array.isArray(state.answers)?state.answers.length:0;
    const stopAudio=()=>{if(activePlayer){activePlayer.pause();activePlayer=null}window.__session6AudioBus?.cancel?.()};
    const stopMic=()=>{stream?.getTracks().forEach(track=>track.stop());stream=null};
    const playFiles=async files=>{
      stopAudio();
      const bus=window.__session6AudioBus;
      if(bus?.begin){const lease=bus.begin();for(const file of files){if(!lease.isCurrent())return;await lease.play(root+file)}return}
      for(const file of files){const audio=new Audio(root+file);activePlayer=audio;await new Promise(resolve=>{const done=()=>{audio.onended=audio.onerror=audio.onpause=null;if(activePlayer===audio)activePlayer=null;resolve()};audio.onended=done;audio.onerror=done;audio.onpause=done;Promise.resolve(audio.play()).catch(done)})}
    };
    const progressMarkup=()=>`<div class="progress-wrap" aria-label="Progreso: larawan ${Math.min(current()+1,items.length)} sa ${items.length}"><div class="dots">${items.map((_,i)=>`<span class="dot ${i<current()?'done':''}" ${i<current()?'aria-label="Natapos"':'aria-label="Larawan '+(i+1)+'"'}>${i<current()?'✓':i+1}</span>`).join('')}</div><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${current()}"><i style="width:${current()/items.length*100}%"></i></div></div>`;
    const heading=()=>`<p class="eyebrow">SESSION 6 · LESSON 17 AT 18 · GAWAIN 9</p><h1>Basahin at Isulat ang Salita</h1>`;
    const picture=item=>`<div class="image-stage picture"><img src="${esc(item.image_url)}" alt="${esc(item.alt_text)}"></div>`;
    const letterBoxes=(word,filled=false,index=current())=>`<div class="letter-boxes" aria-label="${filled?'Salitang '+esc(word):'Mga kahon ng titik'}" ${filled?'':'aria-hidden="true"'}>${Array.from({length:Number(items[index]?.letter_count)||word.length},(_,i)=>`<span class="letter-box">${filled?esc(word[i]||''):''}</span>`).join('')}</div>`;
    async function save(extra={}){
      const mine=++request;
      const response=await fetch(data.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...state,state_version:(Number(state.state_version)||0)+1},...extra})});
      const result=await response.json().catch(()=>({}));
      if(!response.ok||!result.success)throw Error(result.error||'Hindi na-save ang progress. Subukan muli.');
      if(mine!==request)return null;
      state=result.progress.state;return result;
    }
    async function sayItemPrompt(index=current()){
      if(index>=0&&index<items.length)await playFiles([prompts[index]]);
    }
    async function sayInitial(){
      if(initialNarrationStarted||data.progress?.activity_completed)return;
      initialNarrationStarted=true;
      const start=app.querySelector('#start');if(start)start.disabled=true;
      try{
        if(state.phase==='intro')await playFiles(['intro_basahin_isulat_ngalan_larawan_tts.mp3']);
        else if(state.phase==='oral_reading')await sayItemPrompt();
        else if(state.phase==='written_answer')await playFiles(['tama_pagbasa_isulat_salita_tts.mp3']);
      }
      catch(_){/* Local narration may fail; the learner can still continue. */}
      finally{const currentStart=app.querySelector('#start');if(currentStart)currentStart.disabled=false}
    }
    function render(message='',kind=''){
      if(data.progress?.activity_completed||state.phase==='completion'){
        app.innerHTML=`${heading()}<div class="success-check" aria-label="Tapos">✓</div><p class="hint">${esc('Magaling! Natapos mo ang gawain.')}</p>`;
        if(feedbackPlayedFor!==items.length){feedbackPlayedFor=items.length;void playFiles(['mahusay_ang_ginawa_mo_ngayon_natapos_aralin_tts.mp3'])}
        return;
      }
      if(showActivityIntro||state.phase==='intro'){
        const sample=items[0];
        app.innerHTML=`${heading()}<p class="instruction">Tingnan ang larawan. Basahin ang ngalan nito. Pagkatapos, isulat ang salita.</p><div class="image-stage intro-image"><img src="${esc(sample?.image_url||'')}" alt="${esc(sample?.alt_text||'Larawan ng pana')}"></div><div class="steps" aria-label="Tingnan, Basahin, Isulat"><span>Tingnan</span><b>→</b><span>Basahin</span><b>→</b><span>Isulat</span></div><button class="button" id="start" type="button" disabled>SIMULAN</button><p class="status ${kind}">${esc(message)}</p>`;
        app.querySelector('#start').onclick=async()=>{
          if(busy)return;busy=true;started=true;showActivityIntro=false;
          try{if(state.phase==='intro')state.phase='oral_reading';await save();render();if(state.phase==='oral_reading')await sayItemPrompt();else if(state.phase==='written_answer')await playFiles(['tama_pagbasa_isulat_salita_tts.mp3'])}
          catch(error){render(error.message,'bad')}
          finally{busy=false}
        };
        return;
      }
      const index=current(),item=items[index];
      if(state.phase==='feedback'){
        const word=state.answers[completed()-1]||items[completed()-1]?.answer||'';
        app.innerHTML=`${heading()}${progressMarkup()}<div class="success-check" aria-label="Tama">✓</div>${letterBoxes(word,true,completed()-1)}<p class="hint good">Tama! Magaling ang iyong sagot.</p><button class="button" id="next" type="button" ${feedbackAudio?'disabled':''}>${completed()>=items.length?'TAPUSIN':'SUSUNOD'}</button>`;
        app.querySelector('#next').onclick=async()=>{
          if(busy||feedbackAudio)return;busy=true;stopAudio();
          try{if(completed()>=items.length){state.phase='completion';await save();await finish();return}state.current_item_index=completed();state.phase='oral_reading';await save();render();await sayItemPrompt()}
          catch(error){render(error.message,'bad')}
          finally{busy=false}
        };
        if(feedbackPlayedFor!==completed()){feedbackPlayedFor=completed();feedbackAudio=playFiles(['tama_magaling_ang_iyong_sagot_tts.mp3']).finally(()=>{feedbackAudio=null;const next=app.querySelector('#next');if(next)next.disabled=false})}
        return;
      }
      if(!item){void finish();return}
      const photo=picture(item),attempts=Number(state.oral_attempts?.[String(index)]||0);
      if(state.phase==='oral_reading'){
        app.innerHTML=`${heading()}<p class="hint">Larawan ${index+1} sa ${items.length}</p>${progressMarkup()}${photo}<p class="hint">Ano ang ngalan ng larawan?</p><div class="action-row"><button data-basahin-button class="button" id="oral" type="button">BASAHIN</button>${attempts>=3?'<button class="button gold" id="listen" type="button">PAKINGGAN</button>':''}</div><p id="status" class="status ${kind}">${esc(message)}</p>`;
        window.Basahin.bindActivity(app.querySelector('#oral'),()=>read(index));
        if(attempts>=3)app.querySelector('#listen').onclick=()=>listen(index);
        return;
      }
      app.innerHTML=`${heading()}<p class="hint">Larawan ${index+1} sa ${items.length}</p>${progressMarkup()}${photo}<p class="hint">Tama ang pagbasa! Isulat naman ang salita.</p>${letterBoxes('',false)}<label class="hint" for="answer">Isulat ang salita</label><input id="answer" class="answer" autocomplete="off" inputmode="text" aria-label="Isulat ang salita" placeholder="Isulat dito"><button class="button check" id="check" type="button" disabled>SURIIN</button><p id="status" class="status ${kind}">${esc(message)}</p>`;
      const input=app.querySelector('#answer'),check=app.querySelector('#check');input.oninput=()=>{check.disabled=!input.value.trim()};check.onclick=()=>answer(input.value);
    }
    async function read(index){
      if(busy)return;busy=true;stopAudio();const mine=++request,button=app.querySelector('#oral');
      try{
        if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono.');
        button.disabled=true;button.textContent='Nakikinig…';stream=await window.Basahin.openMicrophone({audio:true});
        const blob=await window.Basahin.capture({button,stream,keepStream:false});stopMic();if(mine!==request)return;
        const form=new FormData();form.append('audio',blob,'prescribed-reading.webm');form.append('target_text',items[index].answer);form.append('language','Filipino');form.append('mode','reading');
        const response=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form});const result=await response.json().catch(()=>({}));if(mine!==request)return;
        if(response.ok&&result.success&&result.complete===true){state.completed_oral_reads=[...new Set([...(state.completed_oral_reads||[]),index])];state.oral_attempts[String(index)]=0;state.read_aloud_plays[String(index)]=0;state.phase='written_answer';await save();render();await playFiles(['tama_pagbasa_isulat_salita_tts.mp3'])}
        else{state.oral_attempts[String(index)]=Math.min(3,(state.oral_attempts[String(index)]||0)+1);await save();render('Hindi pa. Subukan muli.','bad');await playFiles(['hindi_pa_tama_tts.mp3'])}
      }catch(error){if(mine===request){if(!window.Basahin.isCaptureError(error))state.oral_attempts[String(index)]=Math.min(3,(state.oral_attempts[String(index)]||0)+1);try{await save()}catch(_){}render(error.message||'Hindi nakuha ang boses. Subukan muli.','bad');if(!window.Basahin.isCaptureError(error))await playFiles(['hindi_pa_tama_tts.mp3'])}}
      finally{stopMic();busy=false}
    }
    async function listen(index){
      if(busy)return;busy=true;stopAudio();const button=app.querySelector('#listen');button.disabled=true;
      try{await playFiles(['pakinggan_ang_salita_bago_basahin_tts.mp3',`${items[index].id}_tts.mp3`,'subukan_mong_basahin_salita_tts.mp3']);if(Number(state.read_aloud_plays[String(index)]||0)<3)state.read_aloud_plays[String(index)]=(Number(state.read_aloud_plays[String(index)]||0)+1);await save();render('Subukan mong basahin ang salita.','good')}
      catch(error){render(error.message||'Hindi available ang audio. Subukan muli.','bad')}
      finally{busy=false}
    }
    async function answer(value){
      if(busy||!String(value||'').trim())return;busy=true;stopAudio();
      try{const result=await save({candidate_answer:value});if(result?.accepted){state.phase='feedback';render()}else{render('Subukan muli.','bad');await playFiles(['hindi_pa_tama_tts.mp3'])}}
      catch(error){render(error.message,'bad')}
      finally{busy=false}
    }
    async function finish(){
      if(busy&&state.phase!=='completion')return;stopAudio();
      try{const response=await fetch(data.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw Error(result.error||'Hindi na-save ang pagtatapos.');data.progress.activity_completed=true;state.phase='completion';render()}
      catch(error){state.phase='feedback';render(error.message,'bad')}
    }
    addEventListener('lesson-start-ready',()=>{if(!initialNarrationStarted)void sayInitial()});
    addEventListener('session6-prescribed-resume',()=>{if(!initialNarrationStarted)void sayInitial()});
    addEventListener('session6-prescribed-cancel',()=>{request++;stopMic();stopAudio();busy=false});
    addEventListener('pagehide',()=>{stopMic();stopAudio()});
    render();
  if(data.activity_key==='lesson-17-18-gawain-9')window.__session6LeaveAdapter={saveCurrentProgress:()=>save()};
    })();
  </script>
  {% include "pabasa_app/includes/session6_prescribed_controls.html" %}
</body>
</html>
