<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 17 at 18: Gawain 9</title><style>:root{--ink:#16465d;--blue:#197b99;--gold:#d98c27;--good:#278750;--bad:#ad3c3c;--line:#bfdde4}*{box-sizing:border-box}body{margin:0;background:#eaf7f7;color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(760px,calc(100% - 24px));margin:auto;padding:16px 0}.back{color:var(--ink);font-weight:900;text-decoration:none}.card{min-height:calc(100vh - 60px);margin-top:12px;padding:clamp(20px,5vw,42px);border-radius:28px;background:#fffdf7;text-align:center;box-shadow:0 18px 45px #24545d18}.eyebrow{color:#997124;font-size:.8rem;font-weight:900;letter-spacing:.08em}.instruction,.hint{color:#526e78;font-weight:700}.track{height:11px;max-width:580px;margin:14px auto 24px;background:#dcebea;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#2b9b63,#8bd19c)}.picture{width:min(310px,100%);height:240px;margin:22px auto;padding:12px;border:3px solid var(--line);border-radius:22px;background:#fff}.picture img{width:100%;height:100%;object-fit:contain}.button{min-height:52px;margin:8px;padding:12px 24px;border:0;border-radius:15px;background:var(--blue);box-shadow:0 4px 0 #155369;color:#fff;font:900 1rem inherit;cursor:pointer}.button.gold{background:var(--gold);box-shadow:0 4px 0 #a96c1e}.button:disabled{opacity:.6;cursor:wait}.status{min-height:30px;font-weight:900}.good{color:var(--good)}.bad{color:var(--bad)}.answer{width:min(390px,100%);padding:12px 16px;border:0;border-bottom:4px solid #4a7180;background:transparent;color:var(--ink);font:900 1.5rem inherit;letter-spacing:.12em;text-align:center}.answer:focus{outline:3px solid #8cd5e5;border-radius:8px}.locked{margin:12px auto;padding:12px;border-radius:12px;background:#e3f7e8;color:var(--good);font-size:1.35rem;font-weight:900}.intro-art{display:grid;grid-template-columns:repeat(5,1fr) a.':'Hindi pa. Subukan muli.','bad')}}catch(e){if(mine===request){s.oral_attempts[key(n)]=Math.min(3,(s.oral_attempts[key(n)]||0)+1);try{await save()}catch(_){}render(e.message||'Hindi nakuha ang boses. Subukan muli.','bad')}}finally{stop();busy=false}}async function listen(n){if(busy)return;busy=true;const mine=++request,b=app.querySelector('#oral');try{b.disabled=true;b.textContent='Nilo-load...';const f=new FormData();f.append('text',items[n].id);f.append('language','Filipino');f.append('prescribed_activity_key','lesson-17-18-gawain-9');const r=await fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),j=await r.json().catch(()=>({}));if(mine!==request)return;if(!r.ok||!j.success||j.tts_language!=='fil-PH'||j.voice_name!=='fil-PH-Wavenet-A')throw Error(j.error||'Hindi available ang Filipino audio.');b.textContent='Pinakikinggan...';const a=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(j.audio_content),c=>c.charCodeAt(0))],{type:j.mime_type||'audio/mpeg'})));await a.play();await new Promise(ok=>a.onended=ok);if(mine!==request)return;s.read_aloud_plays[key(n)]=Math.min(3,(s.read_aloud_plays[key(n)]||0)+1);if(s.read_aloud_plays[key(n)]===3){s.oral_attempts[key(n)]=0;s.read_aloud_plays[key(n)]=0}s.phase='oral_reading';await save();render('Subukan mong basahin ang salita.')}catch(e){if(mine===request)render(e.message||'Hindi available ang audio. Subukan muli.','bad')}finally{busy=false}}async function answer(value){if(busy)return;busy=true;try{const j=await save({candidate_answer:value});if(j.accepted){s.phase='feedback';render()}else{render('Subukan muli.','bad')}}catch(e){render(e.message,'bad')}finally{busy=false}}async function finish(){if(busy)return;busy=true;s.phase='completion';try{const r=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'}),j=await r.json().catch(()=>({}));if(!r.ok||!j.succes
