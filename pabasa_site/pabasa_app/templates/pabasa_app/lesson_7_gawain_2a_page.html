(()=>{const d=JSON.parse(document.getElementById('activity-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'';let s=Object.assign({current_phase:'oral_reading',current_reading_item:0,current_main_item:0,completed_reading_items:[],oral_reading_completed:false,answers:[null,null,null,null,null,null],correct_count:0,state_version:0},d.progress?.state||{}),busy=false;const save=async()=>fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:++s.state_version}})});const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');function draw(c){const r=c.getBoundingClientRect(),q=devicePixelRatio||1;c.width=r.width*q;c.height=r.height*q;const x=c.getContext('2d');x.scale(q,q);x.strokeStyle='#286b93';x.lineWidth=5;x.lineCap='round';let down=false,pt=e=>({x:e.clientX-r.left,y:e.clientY-r.top});c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);let p=pt(e);x.beginPath();x.moveTo(p.x,p.y)};c.onpointermove=e=>{if(down){let p=pt(e);x.lineTo(p.x,p.y);x.stroke()}};c.onpointerup=c.onpointercancel=()=>down=false}function hasMark(c){return c.getContext('2d').getImageData(0,0,c.width,c.height).data.some((v,i)=>i%4===3&&v>30)}function validI(c,lines){lines=lines||[];if(lines.length<2)return false;let info=lines.map(line=>{let xs=line.map(p=>p.x),ys=line.map(p=>p.y);return {x:xs.reduce((a,b)=>a+b,0)/xs.length,y:ys.reduce((a,b)=>a+b,0)/ys.length,span:Math.max(...ys)-Math.min(...ys),count:line.length}}).filter(x=>x.count>0);let stem=info.reduce((a,b)=>b.span>a.span?b:a),dot=info.find(x=>x!==stem&&x.y<stem.y);return Boolean(stem&&dot&&stem.span>8)||(!lines.length&&hasMark(c))}function render(){if(d.progress?.activity_completed){app.innerHTML='<div class="done">✓<br>Magaling! Natapos mo ang Gawain 2A.<br><a href="{% url "assessment" %}">Bumalik sa Aking Aralin</a></div>';return}if(!s.oral_reading_completed){let i=Math.min(5,s.current_reading_item||0),it=d.items[i];app.innerHTML='<p class="eyebrow">SESSION 3 · LESSON 7 · GAWAIN 2A</p><h1>Tukuyin ang larawan</h1><p class="instruction">Tingnan ang larawan, sabihin ang salita, at hintaying maproseso.</p><div class="reading"><img src="'+it.image_url+'" alt="Larawan: '+it.word+'"><p class="status" id="status">Larawan '+(i+1)+' sa 6</p><button id="read">🎙 Simulan ang pagbasa</button></div><div class="progress"><i style="width:'+(i/6*100)+'%"></i></div>';let b=document.getElementById('read'),R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById('status').textContent='Hindi available ang speech check sa browser na ito.';return}b.onclick=()=>{let r=new R();r.lang='fil-PH';r.continuous=false;r.interimResults=false;b.classList.add('recording');b.textContent='Nakikinig…';r.onresult=async e=>{let ok=norm(e.results[0][0].transcript).includes(norm(it.word));if(ok){s.completed_reading_items=[...(s.completed_reading_items||[]),i];s.current_reading_item=i+1;if(i===5){s.oral_reading_completed=true;s.current_phase='main_activity'}await save();render()}else{document.getElementById('status').textContent='Subukan muli. Sabihin ang salita nang malinaw.';b.classList.remove('recording');b.textContent='🎙 Subukan muli'}};r.onerror=()=>{document.getElementById('status').textContent='Hindi narinig. Subukan muli.';b.classList.remove('recording');b.textContent='🎙 Subukan muli'};r.start()};return}let mainItems=d.items,strokes=Array.isArray(s.handwriting_strokes)?s.handwriting_strokes:Array.from({length:6},()=>[]);
app.innerHTML='<p class="eyebrow">SESSION 3 · LESSON 7 · GAWAIN 2A</p><h1>Gawain 2A: Letrang Ii</h1><div class="action-cue"><span>👀<small>Tingnan</small></span><b>→</b><span>💭<small>Pag-isipan</small></span><b>→</b><span>✏️<small>Sumulat</small></span></div><p class="instruction">'+d.instruction+'</p><div class="grid">'+mainItems.map((x,n)=>'<div class="item"><img src="'+x.image_url+'" alt="Larawan"><canvas class="canvas" data-i="'+n+'"></canvas></div>').join('')+'</div><p class="status" id="status">Tingnan ang lahat ng larawan, pagkatapos ay isumite ang iyong mga sagot.</p><div class="actions"><button class="clear" id="clear">Burahin lahat</button><button id="submit">ISUMITE</button></div>';
function paint(c,lines){c.__lines=lines||[];const r=c.getBoundingClientRect(),q=devicePixelRatio||1;c.width=r.width*q;c.height=r.height*q;const x=c.getContext('2d');x.scale(q,q);x.strokeStyle='#286b93';x.lineWidth=5;x.lineCap='round';(lines||[]).forEach(line=>{x.beginPath();line.forEach((p,j)=>j?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()});let line=null;c.onpointerdown=e=>{line=[{x:e.offsetX,y:e.offsetY}];c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(e.offsetX,e.offsetY)};c.onpointermove=e=>{if(!line)return;line.push({x:e.offsetX,y:e.offsetY});x.lineTo(e.offsetX,e.offsetY);x.stroke()};c.onpointerup=c.onpointercancel=async()=>{if(line){strokes[Number(c.dataset.i)].push(line);c.__lines=strokes[Number(c.dataset.i)];line=null;s.handwriting_strokes=strokes;await save()}}}
