{% load static %}
<!doctype html>
<html lang="fil">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Learner Experience Rating | PAGBASA</title>
    {% include "pabasa_app/includes/typography.html" %}
    <link rel="stylesheet" href="{% static 'pabasa_app/css/learner_experience.css' %}">
</head>
<body style="margin: 0">
    <main class="learner-experience" aria-labelledby="page-title">
        <div class="learner-experience-content">
            <header class="learner-experience-heading">
                <h1 id="page-title">Ano ang pakiramdam mo sa pagbasa?</h1>
                <p class="learner-experience-instruction">Piliin ang mukha na katulad ng naramdaman mo.</p>
            </header>
            {% include "pabasa_app/partials/_learner_experience_choices.html" only %}
            <button class="rating-continue" id="continueButton" type="button" lang="en" disabled>Continue</button>
        </div>
    </main>
    <script>
        (() => {
            const choices = document.querySelector(".rating-form");
            const continueButton = document.getElementById("continueButton");
            choices.addEventListener("change", () => {
                continueButton.disabled = !choices.querySelector(".rating-input:checked");
            });
            continueButton.addEventListener("click", () => {
                const selected = choices.querySelector(".rating-input:checked");
                if (selected) console.log(`Learner Experience rating selected: ${selected.value}`);
            });
        })();
    </script>
</body>
</html>
