<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhyming Verses | PABASA</title>
<style>:root{--ink:#16465d;--blue:#197b99;--muted:#5b7680;--line:#d6e7e8;--good:#2b9b63;--bad:#c85555}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3faf8;color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(1220px,calc(100% - 28px));margin:auto;padding:30px 0}.back{color:var(--ink);font-weight:900;text-decoration:none}.card{margin-top:24px;border:1px solid var(--line);border-radius:28px;background:#fff;padding:clamp(28px,5vw,68px);box-shadow:0 18px 45px #24545d18}.eyebrow{color:#42768a;font-size:.9rem;font-weight:900;letter-spacing:.14em}.title{margin:.3rem 0;font-size:clamp(2.6rem,6vw,5.2rem)}.instruction{color:var(--muted);font-size:clamp(1.05rem,1.8vw,1.35rem);font-weight:700}.content{max-width:1000px;margin:38px auto 0;text-align:center}.verse-title{font-size:clamp(1.6rem,3vw,2.5rem);margin:0 0 22px}.verses{display:grid;gap:12px;max-width:900px;margin:auto;text-align:left}.verse{border:1px solid var(--line);border-radius:14px;background:#f7fbfa;padding:16px 22px;font-size:clamp(1.2rem,2.3vw,1.8rem);line-height:1.5}.verse.active{border-color:#e7b243;box-shadow:0 0 0 4px #f8df9a}.word{border-radius:8px;cursor:pointer;display:inline-block;padding:2px 5px;transition:.12s}.word:hover{background:#f5d47c}.word.selected{background:#d8f2df;color:var(--good);font-weight:900}.word.wrong{background:#f7dada;color:var(--bad)}.prompt{font-size:1.25rem;font-weight:900;margin:26px 0 14px}.button{border:0;border-radius:13px;background:var(--blue);box-shadow:0 4px 0 #126078;color:#fff;padding:14px 24px;font:inherit;font-weight:900;cursor:pointer}.button:disabled{opacity:.6}.status{min-height:28px;color:var(--muted);font-weight:800}.progress{color:var(--muted);font-weight:900}.done{padding:48px;text-align:center;color:var(--good);font-size:1.5rem;font-weight:900}</style></head><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Back to My Lessons</a><section class="card" id="app"></section></main>{{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
<script>(()=>{const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),app=document.getElementById('app'),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||'');let s={phase:'reading',item_index:0,verse_index:0,attempts:0,help_visible:false,selected:[],completed_items:0,...(d.progress?.state||{})},busy=false;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function save(body){const r=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(body)}),x=await r.json();if(!r.ok||!x.success)throw Error(x.error||'Could not save progress');s=x.progress.state;return x}function speak(text,done){if(!window.speechSynthesis){done?.();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.8;u.onend=()=>done?.();speechSynthesis.speak(u)}function words(line,lineIndex){return line.words.map(w=>`<span class="word ${s.selected.includes(w.id)?'selected':''}" data-id="${w.id}" data-line="${lineIndex}">${esc(w.text)}</span>`).join(' ')}function render(){if(s.phase==='complete'){app.innerHTML='<div class="done">Great job! You completed the rhyming verses activity.</div>';return}const item=d.items[s.item_index];app.innerHTML=`<div class="eyebrow">SESSION ${d.session_number} · LESSON ${d.lesson_number} · ACTIVITY ${d.gawain_number}</div><h1 class="title">${esc(d.title)}</h1><p class="instruction">${esc(d.instruction)}</p><div class="content"><h2 class="verse-title">${esc(item.title)}</h2><div class="verses">${item.lines.map((line,i)=>`<div class="verse ${s.phase==='reading'&&i===s.verse_index?'active':''}">${words(line,i)}</div>`).join('')}</div>${s.phase==='reading'?`<p class="prompt">Read verse ${s.verse_index+1} aloud.</p><p class="status" id="status">${s.help_visible?'Listen to the verse to hear how it should sound.':'Read the highlighted verse aloud.'}</p><button class="button" id="read">Read the verse</button>${s.help_visible?'<button class="button" id="help">Read aloud for me</button>':''}<p class="progress">Verse ${s.verse_index+1} of ${item.lines.length}</p>`:`<p class="prompt">Click all the words that rhyme with “at”.</p><p class="status">Words will turn green when selected. Incorrect words will turn red.</p>`}</div>`;if(s.phase==='reading'){const target=item.lines[s.verse_index].text;document.getElementById('read').onclick=()=>record(target);document.getElementById('help')?.addEventListener('click',()=>speak(target))}else app.querySelectorAll('.word').forEach(w=>w.onclick=()=>select(w))}async function record(target){if(busy)return;busy=true;const b=document.getElementById('read'),status=document.getElementById('status');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Microphone is not available.';busy=false;return}b.disabled=true;b.textContent='Listening…';let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const r=new MediaRecorder(stream),chunks=[];r.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(resolve=>r.onstop=()=>resolve(new Blob(chunks,{type:r.mimeType||'audio/webm'})));r.start();setTimeout(()=>r.state==='recording'&&r.stop(),4500);const blob=await done;stream.getTracks().forEach(x=>x.stop());const f=new FormData();f.append('audio',blob,'reading.webm');f.append('target_text',target);f.append('language','English');f.append('mode','reading');const x=await (await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f})).json();const norm=v=>String(v||'').toLowerCase().replace(/[^a-z]/g,'');await save({action:'verse_read',item_index:s.item_index,verse_index:s.verse_index,success:!!(x.success&&norm(x.transcript).includes(norm(target)))});render()}catch(e){status.textContent='Could not hear you. Try again.'}finally{stream?.getTracks().forEach(x=>x.stop());busy=false}}async function select(el){if(busy||el.classList.contains('selected'))return;busy=true;try{const x=await save({action:'rhyme_select',token_id:el.dataset.id});if(x.accepted){render()}else{el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),500)}}catch(e){document.querySelector('.status').textContent=e.message}finally{busy=false}}render()})();</script></body></html>
