{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Match It! | PABASA</title>
  <style>
    @font-face{font-family:L30;src:url("{% static 'pabasa_app/images/lesson_30/lesson30-fredoka.ttf' %}")}
    :root{--ink:#183e63;--muted:#55768b;--line:#94d9d6;--gold:#efb947;--teal:#299e9a;--dark:#187b7a;--good:#287b4c;--bad:#b33b43}
    *{box-sizing:border-box}html,body{height:100%;overflow:hidden}
    body{margin:0;background:#49b8e0 url("{% static 'pabasa_app/images/lesson_30/lesson30-ui-background.jpg' %}") center/cover fixed;color:var(--ink);font-family:L30,Nunito,sans-serif}
    .page{position:relative;width:min(1250px,calc(100% - 32px));height:100dvh;min-height:0;margin:auto;padding:16px clamp(16px,4vw,42px) 22px}
    .back{position:absolute;top:16px;left:clamp(16px,4vw,42px);z-index:3;display:flex;align-items:center;justify-content:center;gap:12px;width:280px;min-height:64px;border-radius:999px;background:#fff;color:var(--ink);font-size:1.15rem;text-decoration:none;box-shadow:0 8px 17px #145ca744;transition:transform .16s ease,box-shadow .16s ease}.back:hover{transform:translateY(-2px);box-shadow:0 11px 22px #145ca755}
    .stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(1250px,100%);height:min(820px,calc(100dvh - 32px));min-height:0;margin:0;padding:clamp(24px,3.3vh,42px) clamp(20px,5vw,72px) 24px;border:2px solid #ffffffaa;border-radius:42px;background:#ffffff63;backdrop-filter:blur(10px);box-shadow:0 18px 45px #1e5b7a35;display:grid;place-items:center;text-align:center;overflow:hidden}.stage.waiting{filter:blur(2px);opacity:.58;pointer-events:none}
    #app{display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(100%,980px);height:100%;max-height:100%;overflow:hidden}.eyebrow{display:inline-block;margin:0 auto 12px;padding:9px 24px;border-radius:999px;background:#277f82;color:#fff;font-size:clamp(.8rem,1.3vw,1.05rem);font-weight:900;letter-spacing:.06em}.title{margin:0;font-size:clamp(2.6rem,5vw,4.5rem);line-height:1.08}.instruction{margin:12px auto 8px;color:var(--muted);font-size:clamp(1rem,1.5vw,1.25rem);font-weight:800}
    .word{display:flex;align-items:center;justify-content:center;width:min(820px,100%);min-height:clamp(132px,20vh,190px);margin:14px auto 12px;padding:18px 28px;border:4px solid var(--line);border-radius:30px;background:#fffffff0;box-shadow:0 10px 22px #1e5b7a1c;font-size:clamp(3.5rem,10vw,6.8rem);font-weight:900;line-height:1}.status{min-height:0;margin:8px auto 10px;color:var(--muted);font-weight:800}.status.good{color:var(--good)}.status.bad{color:var(--bad)}
    .actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.button{min-width:min(310px,42vw);min-height:72px;border:0;border-radius:999px;background:var(--teal);box-shadow:0 7px 0 var(--dark),0 12px 24px #187b7a40;color:#fff;padding:16px 24px;font:inherit;font-size:clamp(1rem,1.8vw,1.45rem);font-weight:900;cursor:pointer;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}.button.secondary{background:#fffffff0;color:var(--dark);border:4px solid var(--line);box-shadow:0 6px 0 #b7d6dc}.button:disabled{opacity:.65}.button:not(:disabled):hover{background:#38b0aa;filter:brightness(1.04);transform:translateY(-2px)}.button.secondary:not(:disabled):hover{background:#f4fffe}.button:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 var(--dark)}
    .pictures{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:12px;width:min(980px,100%);margin:14px auto 12px}.picture{display:grid;place-items:center;min-height:clamp(130px,17vh,165px);border:4px solid var(--line);border-radius:24px;background:#fffffff0;padding:12px;cursor:pointer;box-shadow:0 8px 18px #1e5b7a18;transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease}.picture:hover{border-color:var(--teal);background:#f4fffe;box-shadow:0 10px 22px #1e5b7a2e;transform:translateY(-4px)}.picture:active{transform:translateY(1px)}.picture img{max-width:100%;max-height:clamp(95px,14vh,125px);object-fit:contain}.picture.wrong{border-color:var(--bad);background:#fff0f0}.picture.correct{border-color:var(--good);background:#e8f7ed;pointer-events:none}
    .progress{display:flex;justify-content:center;gap:9px;margin:12px auto 0}.step{display:grid;place-items:center;width:34px;height:34px;border:3px solid #e2e8e8;border-radius:50%;background:#ffffffe8;color:#55727e;font-weight:900}.step.active{border-color:var(--gold);background:#f4c866}.step.done{border-color:#53ae83;background:#53ae83;color:#fff}.complete{min-height:400px;display:grid;place-items:center;color:var(--good);font-size:clamp(1.5rem,3vw,2.2rem);font-weight:900}
    .backdrop{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#e7f7f7c9;backdrop-filter:blur(3px)}.backdrop[hidden]{display:none}.modal{width:min(500px,calc(100vw - 36px));padding:36px 34px;border-radius:30px;background:#fffffff3;text-align:center;box-shadow:0 22px 60px #173f6325}.modal p{color:var(--muted);font-weight:800}.modal h2{font-size:clamp(1.8rem,4vw,2.6rem);margin:14px 0}.start-label{color:#277f82!important;letter-spacing:.08em}.start-actions{display:grid;gap:14px}.start-actions button{min-height:64px;border:0;border-radius:999px;font:inherit;font-size:1.15rem;font-weight:900;cursor:pointer;transition:transform .16s ease,filter .16s ease}.start-actions button:hover{filter:brightness(1.05);transform:translateY(-2px)}.start-actions button:active{transform:translateY(2px)}.start{background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--dark)}.later{border:3px solid var(--line)!important;background:#fff;color:var(--dark);box-shadow:0 4px 0 #b7d6dc}
    @media(max-width:720px){.page{width:100%;padding:12px}.back{top:12px;left:12px;width:230px;min-height:58px;font-size:1rem}.stage{width:calc(100% - 24px);height:calc(100dvh - 24px);padding:76px 14px 18px;border-radius:30px}#app{overflow:hidden}.title{font-size:clamp(2.2rem,10vw,3.5rem)}.word{min-height:120px;padding:14px}.pictures{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px auto}.picture{min-height:112px;padding:8px}.picture img{max-height:88px}.button{width:100%;min-width:0;min-height:64px}.step{width:30px;height:30px;font-size:.9rem}}
  </style>
  <style>
    .button.is-busy{animation:l30ButtonPulse 1.15s ease-in-out infinite}
    @keyframes l30ButtonPulse{0%,100%{transform:scale(1);box-shadow:0 7px 0 var(--dark),0 12px 24px #187b7a40}50%{transform:scale(1.025);box-shadow:0 0 0 9px #f5d47c55,0 7px 0 var(--dark),0 15px 28px #187b7a55}}
    .stage{top:55%;height:min(640px,calc(100dvh - 120px));padding:18px clamp(20px,5vw,72px) 16px}
    #app{justify-content:center}
    .eyebrow{margin-bottom:8px}
    .instruction{margin:8px auto 6px}
    .word{min-height:clamp(118px,15vh,145px);margin:8px auto 6px}
    .status{margin:4px auto 6px}
    .pictures{margin:10px auto 8px}
    .progress{margin-top:16px}
    @media(max-width:720px){.stage{top:55%;height:calc(100dvh - 96px);padding:76px 14px 16px}}
  </style>
<style>.button.is-busy:disabled{background:#b5c5c7!important;color:#edf3f4!important;border-color:transparent!important;box-shadow:none!important;opacity:1!important;cursor:not-allowed}</style>
<style>.status{display:none!important}.actions{margin-top:12px!important}</style>
</head>
<body>
  <main class="page">
    <a class="back" id="lesson30a1-back" href="{% url 'assessment' %}">← <span>Back to My Lessons</span></a>
    <section class="stage waiting" id="lesson30a1-stage"><div id="app" aria-live="polite"></div></section>
  </main>
  <div class="backdrop" id="lesson30a1-start"><div class="modal"><p class="start-label">SESSION 14 · LESSON 30 · ACTIVITY 1</p><h2>MATCH IT!</h2><p>Read the word aloud first. Then choose the matching picture.</p><div class="start-actions"><button class="start" id="lesson30a1-go">START</button><button class="later" id="lesson30a1-later">NOT NOW</button></div></div></div>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script src="{% static 'pabasa_app/js/prescribed_match_it_lesson30_activity1.js' %}?v=lesson30a1-4" defer></script>
</body>
</html>
