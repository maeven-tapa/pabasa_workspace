<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fill in the Blank | PABASA</title>
  <style>
    :root{--ink:#16465d;--blue:#197b99;--muted:#5b7680;--line:#d6e7e8;--good:#2b9b63;--bad:#c85555;--gold:#efbd4d}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3faf8;color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}
    .page{width:min(1080px,calc(100% - 28px));margin:auto;padding:24px 0}.back{color:var(--ink);font-weight:900;text-decoration:none}
    .card{margin-top:20px;border:1px solid var(--line);border-radius:24px;background:#fff;padding:clamp(22px,4vw,48px);box-shadow:0 18px 45px #24545d18}
    .eyebrow{color:#42768a;font-size:.82rem;font-weight:900;letter-spacing:.14em}.title{font-size:clamp(2.2rem,5vw,3.6rem);margin:.3rem 0}.instruction{color:var(--muted);font-size:1.1rem;font-weight:750}
    .work{max-width:860px;margin:22px auto 0}.progress{color:var(--muted);font-size:.9rem;font-weight:900;text-align:right}.item{align-items:center;background:#fbfdfc;border:1px solid var(--line);border-radius:16px;display:grid;gap:clamp(18px,4vw,44px);grid-template-columns:minmax(150px,280px) minmax(0,1fr);margin:12px 0;padding:clamp(16px,3vw,28px)}
    .picture{background:#fff;border:1px solid #e3eeee;border-radius:10px;height:clamp(150px,30vw,250px);object-fit:contain;padding:8px;width:100%}.sentence{font-size:clamp(1.45rem,3vw,2.15rem);font-weight:750;line-height:1.6}.blank{border-bottom:3px solid #607985;color:var(--blue);display:inline-block;font-weight:900;min-width:2.2em;padding:0 .12em;text-align:center;white-space:nowrap}.prompt{font-size:1.1rem;font-weight:900;margin:16px 0;text-align:center}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px auto}.button{border:0;border-radius:12px;background:var(--blue);box-shadow:0 4px 0 #126078;color:#fff;padding:13px 22px;font:inherit;font-weight:900;cursor:pointer}.button.secondary{background:#edf7f6;color:var(--ink);box-shadow:0 4px 0 #c5dbdc}.button:disabled{opacity:.65;cursor:wait}
    .status{min-height:32px;color:var(--muted);font-size:1rem;font-weight:800;text-align:center}.status.good{color:var(--good)}.status.bad{color:var(--bad)}.done{padding:48px;text-align:center;color:var(--good);font-size:1.5rem;font-weight:900}
    @media(max-width:620px){.card{padding:18px}.item{grid-template-columns:1fr;gap:14px}.picture{height:clamp(150px,46vw,230px);max-width:340px;justify-self:center}.sentence{text-align:center}}
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="{% url 'assessment' %}">← Back to My Lessons</a>
    <section class="card" id="app"></section>
  </main>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script>
    (()=>{
      const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}');
      const app=document.getElementById('app');
      const csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||'');
      let s={current_item:0,attempts:0,hint_length:0,hint:'',help_visible:false,completed_items:0,...(d.progress?.state||{})};
      let busy=false,feedback='',feedbackType='',filledItem=null;
      const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      async function post(url,body){
        const response=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(body)});
        const result=await response.json();if(!response.ok||!result.success)throw Error(result.error||'Could not save progress');return result;
      }
      function sentence(item,word){return `${esc(item.before)}<span class="blank">${esc(word)}</span>${esc(item.after)}`}
      function speak(word){if(!window.speechSynthesis)return;speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word);utterance.lang='en-US';utterance.rate=.78;speechSynthesis.speak(utterance)}
      function render(){
        if(filledItem){
          app.innerHTML=`<div class="eyebrow">SESSION ${d.session_number} · LESSON ${d.lesson_number} · ACTIVITY ${d.gawain_number}</div><h1 class="title">${esc(d.title)}</h1><div class="work"><div class="item"><img class="picture" src="${esc(filledItem.image_url)}" alt="Picture clue"><div class="sentence">${sentence(filledItem,filledItem.answer)}</div></div><p class="status good">Correct! The word has been filled in.</p></div>`;return;
        }
        if(s.phase==='complete'||s.current_item>=d.items.length){app.innerHTML='<div class="done">Great work! You completed all five sentences.</div>';post(d.completion_url,{}).catch(()=>{});return}
        const item=d.items[s.current_item],revealed=String(s.hint||'').slice(0,item.word_length),blank=revealed+'_'.repeat(Math.max(0,item.word_length-revealed.length));
        app.innerHTML=`<div class="eyebrow">SESSION ${d.session_number} · LESSON ${d.lesson_number} · ACTIVITY ${d.gawain_number}</div><h1 class="title">${esc(d.title)}</h1><p class="instruction">${esc(d.instruction)}</p>
          <div class="work"><div class="progress">Item ${s.current_item+1} of ${d.items.length}</div><div class="item"><img class="picture" src="${esc(item.image_url)}" alt="Picture clue for item ${s.current_item+1}"><div class="sentence">${sentence(item,blank)}</div></div>
          <p class="prompt">Read the sentence, then say the missing word.</p><p class="status ${feedbackType}" id="status">${esc(feedback||'Look at the picture and complete the sentence aloud.')}</p>
          <div class="actions"><button class="button" id="answer">${busy?'Listening…':'Say the missing word'}</button>${s.help_visible?'<button class="button secondary" id="help">🔊 Hear the word</button>':''}</div></div>`;
        document.getElementById('answer').onclick=record;
        document.getElementById('help')?.addEventListener('click',()=>speak(s.help_word||s.hint));
      }
      async function record(){
        if(busy)return;
        const button=document.getElementById('answer'),status=document.getElementById('status');
        if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='A microphone is not available in this browser.';return}
        busy=true;button.disabled=true;button.textContent='Listening…';status.textContent='Listening. Say the word that completes the sentence.';let stream;
        try{
          stream=await navigator.mediaDevices.getUserMedia({audio:true});const recorder=new MediaRecorder(stream),chunks=[];
          recorder.ondataavailable=event=>event.data.size&&chunks.push(event.data);
          const stopped=new Promise(resolve=>recorder.onstop=()=>resolve(new Blob(chunks,{type:recorder.mimeType||'audio/webm'})));
          recorder.start();setTimeout(()=>recorder.state==='recording'&&recorder.stop(),2800);
          const audio=await stopped;stream.getTracks().forEach(track=>track.stop());const form=new FormData();
          form.append('audio',audio,'sentence-blank.webm');form.append('target_text',d.recognition_hints);form.append('language','English');form.append('mode','reading');
          const response=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),transcription=await response.json();
          const heard=transcription.success?String(transcription.raw_transcript||transcription.transcript||''):'';
          const item=d.items[s.current_item],result=await post(d.progress_url,{action:'answer',item_index:s.current_item,heard});
          if(result.accepted){filledItem={...item,answer:heard.trim().toLowerCase().replace(/[^a-z]/g,'')};s=result.progress.state;feedback='';feedbackType='';render();setTimeout(()=>{filledItem=null;render()},950)}
          else{s=result.progress.state;feedback=s.help_visible?'The word is shown. Listen to it, then say it.':(s.hint_length?'Not quite. Use the letter hint and try again.':'That is not correct yet. Try again.');feedbackType='bad';render()}
        }catch(error){const current=document.getElementById('status');if(current)current.textContent=error.message==='Permission denied'?'Please allow microphone access and try again.':'I could not hear you. Please try again.'}
        finally{stream?.getTracks().forEach(track=>track.stop());busy=false;const next=document.getElementById('answer');if(next){next.disabled=false;next.textContent='Say the missing word'}}
      }
      render();
    })();
  </script>
</body>
</html>
