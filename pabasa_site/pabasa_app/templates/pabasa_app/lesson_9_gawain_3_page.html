{% load static %}<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gawain 3: Letrang Ii, Oo, Ee</title><style>html,body{height:100%;margin:0;overflow:hidden}body{background:#e1f5f7;color:#183e63;font-family:Nunito,Arial,sans-serif}.page{height:100%;padding:10px}.back{color:#183e63;font-weight:900}.card{height:calc(100% - 34px);max-width:980px;margin:8px auto 0;padding:clamp(20px,4vh,42px);border-radius:42px;background:#ffffffb8;display:grid;place-items:center;text-align:center;overflow:auto}.task{width:min(760px,100%)}.eyebrow{color:#997124;font-size:.8rem;font-weight:900}.instruction{font-size:clamp(1.1rem,2.4vw,1.6rem);font-weight:900}..item{margin:clamp(28px,8vh,70px) auto;font-size:clamp(2.4rem,7vw,5.2rem);font-weight:1000}..status{min-height:28px;font-weight:900}..action{min-width:260px;min-height:62px;border:0;border-radius:999px;background:#299e9a;color:#fff;font:inherit;font-size:1.25rem;font-weight:900;cursor:pointer;box-shadow:0 7px #187b7a}.action.listening{background:#d64c55;animation:pulse 1.2s infinite}.action.processing{background:#e7af45;box-shadow:0 7px #b98220;cursor:wait}.action:disabled{background:#b5c5c7;box-shadow:none;cursor:not-allowed}.secondary{margin:14px 8px 0;border:2px solid #299e9a;border-radius:14px;padding:10px 18px;background:#fff;color:#183e63;font-weight:900;cursor:pointer}.done{font-size:1.5rem;font-weight:900;color:#26784e}@keyframes pulse{50%{box-shadow:0 0 0 10px #d64c5500,0 0 24px #d64c55b3}}</style></head><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card"></section></main>{{ lesson9_gawain3_data|json_script:"lesson9-g3-data" }}<script>
(()=>{const d=JSON.parse(document.getElementById('lesson9-g3-data').textContent),app=document.getElementById('app'),csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'',items=d.items||[],total=items.length;let state=Object.assign({current_item:0,attempts:0},d.progress?.state||{}),busy=false,requestId=0;state.current_item=Math.max(0,Math.min(total,Number(state.current_item)||0));const normalize=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(),close=(heard,want)=>{const a=normalize(heard),b=normalize(want);return a===b||a.includes(b)||b.includes(a)||a.split(' ').every(x=>b.includes(x))};const save=async()=>{await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state})})};const readAloud=async text=>{const f=new FormData();f.append('target_text',text);f.append('language','Filipino');f.append('mode','reading');f.append('prescribed_activity_key',d.activity_key);const r=await fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),x=await r.json();if(!r.ok||!x.success)throw Error();const raw=atob(x.audio_content||''),a=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(raw,c=>c.charCodeAt(0))],{type:x.mime_type||'audio/mpeg'})));await a.play()};function render(){if(d.progress?.activity_completed||state.current_item>=total){app.innerHTML='<div class="done">✓<h1>Magaling!</h1><p>Natapos mo ang GAWAIN 3: Letrang Ii, Oo, Ee.</p><a class="action" href="{% url "assessment" %}">Bumalik sa Aking Aralin</a></div>';return}const item=items[state.current_item];app.innerHTML='<div class="task"><p class="eyebrow">SESSION 3 · LESSON 9 · GAWAIN 3</p><h1>GAWAIN 3: Letrang Ii, Oo, Ee</h1><p class="instruction">Basahin ang mga salita at pangungusap.</p><div class="item">'+item.word+'</div><p class="status" id="status">Aytem '+(state.current_item+1)+' / '+total+' · Basahin nang malakas.</p><button class="action" id="read">BASAHIN</button></div>';document.getElementById('read').onclick=()=>record(item)}async function record(item){if(busy||state.attempts>=3)return;const button=document.getElementById('read'),status=document.getElementById('status'),id=++requestId;const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){status.textContent='Hindi available ang pagkilala sa boses.';return}busy=true;button.disabled=true;button.className='action listening';button.textContent='Nakikinig…';const rec=new Recognition();rec.lang='fil-PH';rec.interimResults=false;rec.continuous=false;rec.onresult=async e=>{if(id!==requestId)return;button.className='action processing';button.textContent='Pinoproseso…';status.textContent='Sinusuri ang iyong pagbasa…';const heard=e.results[0]?.[0]?.transcript||'';if(close(heard,item.word)){state.current_item++;state.attempts=0;await save();busy=false;render()}else{state.attempts++;await save();busy=false;button.disabled=false;button.className='action';button.textContent=state.attempts>=3?'PAKINGGAN':'SUBUKAN MULI';status.textContent=state.attempts>=3?'Pakinggan ang salita, pagkatapos subukan muli.':'Hindi narinig nang tama. Subukan muli.';if(state.attempts>=3){button.onclick=async()=>{button.disabled=true;button.textContent='PAKINGGAN…';try{await readAloud(item.word)}finally{button.disabled=false;button.textContent='SUBUKAN MULI';button.onclick=()=>{state.attempts=0;render()}}}}}};rec.onerror=async()=>{if(id!==requestId)return;state.attempts++;await save();busy=false;button.disabled=false;button.className='action';button.textContent='SUBUKAN MULI';status.textContent='Hindi narinig. Subukan muli.'};rec.start()}render()})();</script></body></html>
