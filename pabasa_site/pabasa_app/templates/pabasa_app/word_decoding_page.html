{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decode the Word | PABASA</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>
@font-face{font-family:"Super Bubble";src:url("{% static 'pabasa_app/font/Super Bubble.ttf' %}") format("truetype");font-weight:normal;font-style:normal;font-display:swap}
:root{--ink:#12395a;--green:#68ce94}*{box-sizing:border-box}body{margin:0;min-height:100dvh;overflow:hidden;color:var(--ink);font-family:"Super Bubble",Arial,sans-serif;background:#a8cdeb url("{% static 'pabasa_app/images/word-decoding-bg.jpg' %}") center / cover no-repeat fixed}button{font-family:inherit}.app{min-height:100dvh;display:grid;place-items:center;padding:22px}.back{position:fixed;z-index:4;top:22px;left:22px;padding:9px 15px;border:2px solid #fff;color:#fff;text-decoration:none;border-radius:999px;background:#0d5d9199;font-weight:900}.round{position:fixed;z-index:4;top:27px;right:28px;color:#fff;font-weight:1000;text-shadow:0 2px #0e5683}.board{position:relative;width:min(800px,100%);padding:clamp(32px,5vw,56px);border:7px solid #eaffff;border-radius:38px;text-align:center;background:linear-gradient(145deg,#ffffffdb,#c9f8f4e6);box-shadow:0 18px 0 #126a9b99,0 30px 58px #0b416466;overflow:hidden}.board:before{content:"";position:absolute;inset:auto -10% -79%;height:85%;border-radius:50%;background:#66d2e7;opacity:.34}.board>*{position:relative}.eyebrow{margin:0 0 9px;color:#0b6897;font-size:.82rem;font-weight:1000;letter-spacing:.14em;text-transform:uppercase}.word{margin:0;font-size:clamp(2.8rem,10vw,5.8rem);line-height:1;color:#0b4c79;text-shadow:0 3px #fff}.plus{padding:0 .16em;color:#f29a43}.instruction{margin:16px 0;font-size:clamp(1rem,2.5vw,1.2rem);font-weight:900}.checks{display:flex;justify-content:center;gap:clamp(9px,2vw,18px);min-height:64px;margin-bottom:22px}.check{width:clamp(45px,8vw,65px);height:clamp(45px,8vw,65px);display:grid;place-items:center;border:3px dashed #62b8cf;border-radius:13px;color:#fff;background:#eaffff;font-size:clamp(1.8rem,5vw,2.6rem);font-weight:1000}.check.correct{border-style:solid;border-color:#52b979;background:var(--green)}.check.wrong{border-style:solid;border-color:#df5a6c;background:#ef7180}.choices{display:flex;justify-content:center;gap:clamp(18px,4vw,42px);margin:auto}.choice{position:relative;width:clamp(112px,20vw,154px);height:clamp(112px,20vw,154px);border:4px solid #fff;border-radius:50%;background:linear-gradient(145deg,#75dbe8,#258ebe);box-shadow:inset -14px -16px #07517a28,0 8px 0 #0d668f66;cursor:pointer;transition:.2s}.choice:nth-child(2){background:linear-gradient(145deg,#f9bb6a,#ed8252)}.choice:nth-child(3){background:linear-gradient(145deg,#a690e1,#7359ac)}.choice:hover:not(:disabled){transform:translateY(-7px) scale(1.04)}.choice:disabled{cursor:default}.listen{position:absolute;z-index:2;top:calc(100% + 12px);left:50%;width:46px;height:46px;border:3px solid #fff;border-radius:50%;color:#0d5d91;background:#ffec9b;box-shadow:0 4px 0 #bf8535;cursor:pointer;font-size:1.15rem;transform:translateX(-50%)}.choice-correct{outline:6px solid #fff4a7;filter:brightness(1.12)}.choice-wrong{filter:grayscale(.55);opacity:.6}.word-read{display:none;margin:auto;padding:14px 20px;border:0;border-radius:15px;color:#fff;background:linear-gradient(135deg,#f36e83,#c94f6d);box-shadow:0 6px 0 #96384f;font-weight:1000;cursor:pointer;font-size:1rem}.word-read.show{display:inline-block}.word-read.listening{background:#eea142}.status{min-height:24px;margin:58px 0 0;font-weight:900}.complete{position:fixed;z-index:10;inset:0;display:none;place-items:center;padding:22px;background:#0d3d5ae8}.complete.show{display:grid}.complete-card{width:min(470px,100%);padding:42px 28px;border:6px solid #fff;border-radius:34px;color:#fff;text-align:center;background:linear-gradient(145deg,#209bc5,#0c5e96);box-shadow:0 13px 0 #073e65}.complete-card h1{margin:0;font-size:clamp(2rem,6vw,3rem)}.complete-card strong{display:block;margin:18px 0;font-size:clamp(3.5rem,12vw,5rem)}.complete-card button{padding:13px 20px;border:0;border-radius:12px;color:#104f72;background:#fff0a1;font-weight:1000;cursor:pointer}@media(max-width:560px){.app{padding:12px}.back{top:12px;left:12px}.round{top:17px;right:15px;font-size:.82rem}.board{padding:60px 15px 28px;border-width:5px}.choices{gap:12px}.choice{width:92px;height:92px}.listen{top:calc(100% + 8px);width:39px;height:39px}.checks{margin-bottom:13px}.instruction{margin:10px 0}.status{margin-top:49px}}/* Bubble-board presentation aligned to the supplied bubble background. */.board{width:min(800px,calc(100% - 32px));background:linear-gradient(145deg,#ffffffdf,#c9f8f4e8);box-shadow:0 18px 0 #277faa99,0 30px 58px #17577a66}.board:before{background:#78d9e7;opacity:.27}.choice{box-shadow:inset -14px -16px #07517a28,0 8px 0 #0d668f66,0 13px 20px #0c4e7240}.listen{box-shadow:0 4px 0 #bf8535,0 7px 12px #0c4e7240}/* Legible controls over the bubble artwork and a word-sized letter row. */.back{border-color:#0a5c8e;background:#0d669bd9;box-shadow:0 3px 0 #084d77,0 5px 12px #073d5b66}.round{padding:8px 12px;border:2px solid #fff;background:#0d669bd9;border-radius:999px;box-shadow:0 3px 0 #084d77,0 5px 12px #073d5b66}.word{display:flex;width:fit-content;max-width:100%;margin-inline:auto;justify-content:center;align-items:center;flex-wrap:wrap;column-gap:.16em;row-gap:.08em}.word .plus{padding:0}/* Independent bubble movement and a more dimensional bubble finish. */.instruction>span{display:block}.instruction .chance-line{margin-top:.28em}.choice{isolation:isolate;overflow:visible;background:radial-gradient(circle at 29% 21%,#ffffffb8 0 7%,transparent 8%),radial-gradient(circle at 54% 56%,#63d5e9 0 49%,#1f8bb9 72%,#106b9b 100%);box-shadow:inset -17px -20px #063d7028,inset 8px 8px #ffffff2b,0 9px 0 #0d668f66,0 15px 22px #0c4e7240}.choice:nth-child(2){background:radial-gradient(circle at 29% 21%,#ffffffb8 0 7%,transparent 8%),radial-gradient(circle at 54% 56%,#ffc579 0 49%,#ee8754 72%,#bd5e40 100%)}.choice:nth-child(3){background:radial-gradient(circle at 29% 21%,#ffffffb8 0 7%,transparent 8%),radial-gradient(circle at 54% 56%,#b9a8ef 0 49%,#8065ba 72%,#5c438e 100%)}.choice:before,.choice:after{content:"";position:absolute;z-index:1;pointer-events:none}.choice:before{top:12%;left:17%;width:23%;height:14%;border-radius:50%;background:#fff9;filter:blur(1px);transform:rotate(-30deg)}.choice:after{right:14%;bottom:13%;width:36%;height:24%;border-radius:50%;border:3px solid #fff2;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(24deg)}.choice:hover:not(:disabled){transform:none;filter:brightness(1.08)}.listen{z-index:3;transition:transform .18s ease,filter .18s ease}.listen:hover{filter:brightness(1.1);transform:translate(-50%,-5px) scale(1.08)}
</style></head><body><main class="app"><a class="back" href="{% url 'assessment' %}"><i class="bi bi-arrow-left"></i> Back</a><div class="round" id="round"></div><section class="board"><p class="eyebrow">Bubble Word Decoding</p><h1 class="word" id="word"></h1><p class="instruction" id="instruction"></p><div class="checks" id="checks"></div><div class="choices" id="choices"></div><button class="word-read" id="wordRead" type="button"><i class="bi bi-mic-fill"></i> Read the whole word</button><p class="status" id="status" aria-live="polite"></p></section></main><section class="complete" id="complete"><div class="complete-card"><h1>Decoding Complete!</h1><p>You completed the word set.</p><strong id="score"></strong><button id="finish" type="button">Back to Assessments</button></div></section><script>
(()=>{'use strict';const material={{ word_decoding_material_json|safe }},completion={{ word_decoding_completion_json|safe }},items=Array.isArray(material.items)?material.items.filter(x=>x&&x.word).slice(0,5):[];let round=0,letterIndex=0,chances=0,locked=false,answers=[];const $=id=>document.getElementById(id),isEnglish=String(material.language).toLowerCase()==='english',alphabet=isEnglish?['A','E','I','O','U','B','C','D','F','G','H','K','L','M','N','P','R','S','T']:['A','E','I','O','U','B','D','G','H','K','L','M','N','P','R','S','T'],language=isEnglish?'en-US':'fil-PH';const word=()=>items[round]||null,letters=()=>Array.from(String(word()?.word||'').toUpperCase());function audioToken(letter){return isEnglish||['A','E','I','O','U'].includes(letter)?letter:`${letter}A`}function playChoiceSound(letter){const token=audioToken(letter),category=['A','E','I','O','U'].includes(token)?'vowels':'syllables',audioLanguage=isEnglish?'english':'filipino',code=isEnglish?'E':'T',audio=new Audio(`/static/pabasa_app/audio/phonics/${audioLanguage}/${category}/${encodeURIComponent(token)}%20(${code}).MP3`);audio.play().catch(()=>{$('status').textContent='Unable to play that sound. Please try again.'})}function options(target){const pool=alphabet.filter(x=>x!==target),seed=(round+1)*37+(letterIndex+1)*19,wrong=[pool[seed%pool.length],pool[(seed*5+3)%pool.length]].filter((x,i,a)=>a.indexOf(x)===i);while(wrong.length<2)wrong.push(pool[(seed+wrong.length+9)%pool.length]);return [target,...wrong].sort((a,b)=>((a.charCodeAt(0)+seed)%11)-((b.charCodeAt(0)+seed)%11))}function render(){if(!word()){finish();return}letterIndex=0;chances=0;locked=false;$('round').textContent=`Round ${round+1} of ${items.length}`;$('word').innerHTML=letters().map(x=>`<span>${x}</span>`).join('<span class="plus"> + </span>');$('checks').innerHTML=letters().map(()=>'<span class="check"></span>').join('');$('wordRead').classList.remove('show');$('status').textContent='';renderChoices()}function renderChoices(){const target=letters()[letterIndex];$('instruction').innerHTML=`<span>Listen to each bubble. Choose the sound for “${target}”.</span><span class="chance-line">${2-chances} chance${2-chances===1?'':'s'} left.</span>`;$('choices').innerHTML=options(target).map(x=>`<button class="choice" type="button" data-letter="${x}" aria-label="Choose this sound"><span class="listen" role="button" tabindex="0" data-listen="${x}" aria-label="Hear this sound"><i class="bi bi-volume-up-fill"></i></span></button>`).join('');document.querySelectorAll('[data-listen]').forEach(x=>x.addEventListener('click',e=>{e.stopPropagation();playChoiceSound(x.dataset.listen)}));document.querySelectorAll('.choice').forEach(x=>x.addEventListener('click',()=>choose(x.dataset.letter,x)))}function choose(value,button){if(locked)return;locked=true;const correct=value===letters()[letterIndex],box=[...document.querySelectorAll('.check')][letterIndex];if(correct){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);button.classList.add('choice-correct');box.textContent='✓';box.className='check correct';letterIndex++;if(letterIndex===letters().length){$('choices').innerHTML='';$('instruction').textContent='All letters are checked! Read the whole word to continue.';$('wordRead').classList.add('show');$('status').textContent='';locked=false;return}$('status').textContent='Correct! Next letter…';chances=0;setTimeout(()=>{locked=false;renderChoices()},550);return}button.disabled=true;button.classList.add('choice-wrong');chances++;box.textContent='×';box.className='check wrong';if(chances<2){$('status').textContent='Try one of the remaining bubbles.';locked=false;return}$('status').textContent='Two tries used. The next word is ready.';answers.push({word:word().word,letter_sounds_completed:false,word_completed:false});setTimeout(()=>{round++;render()},1050)}function normalize(value){return String(value||'').toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'')}function readWholeWord(){if(locked)return;const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){$('status').textContent='Speech recognition is not available in this browser.';return}locked=true;$('wordRead').classList.add('listening');$('wordRead').innerHTML='<i class="bi bi-soundwave"></i> Listening…';const recognition=new Recognition();recognition.lang=language;recognition.interimResults=false;recognition.maxAlternatives=3;recognition.onresult=e=>{const expected=normalize(word().word),heard=[...e.results[0]].map(x=>normalize(x.transcript)),matched=heard.some(x=>x===expected||x.includes(expected));if(matched){answers.push({word:word().word,letter_sounds_completed:true,word_completed:true});$('status').textContent='Great reading! Next word…';setTimeout(()=>{round++;render()},750)}else $('status').textContent='Try reading the whole word again.'};recognition.onerror=()=>{$('status').textContent='I could not hear that. Try again.'};recognition.onend=()=>{locked=false;$('wordRead').classList.remove('listening');$('wordRead').innerHTML='<i class="bi bi-mic-fill"></i> Read the whole word'};recognition.start()}async function finish(){try{const res=await fetch('{% url "record_assessment_completion" %}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||''},body:JSON.stringify({material_id:material.id,activity_type:'word_decoding',status:'completed',items_completed:items.length,scores:{answers,duration_seconds:Math.round(performance.now()/1000)}})}),data=await res.json();if(!res.ok||!data.success)throw Error(data.error)}catch(e){$('status').textContent='Your result could not be saved. Please try again.';return}$('score').textContent=`${answers.filter(x=>x.word_completed).length} / ${items.length}`;$('complete').classList.add('show')}$('wordRead').addEventListener('click',readWholeWord);$('finish').addEventListener('click',()=>location.href='{% url "assessment" %}');if(completion.completed){$('score').textContent=`${completion.correct_items||0} / ${completion.total_items||items.length}`;$('complete').classList.add('show')}else if(items.length)render();else $('instruction').textContent='This activity has no available words.'})()
</script></body></html>
