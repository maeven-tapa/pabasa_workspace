{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Decode the Word | PABASA</title>
  <link rel="icon" href="{% static 'pabasa_app/images/pabasalogo.png' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root{--ink:#12395a;--ocean:#2589bf;--deep:#0d5d91;--mint:#8de5df;--bubble:#efffff;--coral:#f47b89;--gold:#ffd56b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;overflow:hidden;color:var(--ink);font-family:Nunito,Arial,sans-serif;background:radial-gradient(circle at 50% 25%,#c7fbfa 0 7%,transparent 28%),linear-gradient(#75d8ed 0%,#2e9dcc 56%,#1576ae 100%)}body:before,body:after{content:"";position:fixed;border:2px solid #fff9;border-radius:50%;opacity:.7;pointer-events:none;animation:float 8s ease-in-out infinite}body:before{width:92px;height:92px;left:7vw;bottom:12vh}body:after{width:42px;height:42px;right:10vw;top:16vh;animation-delay:-3s}@keyframes float{50%{transform:translateY(-26px) translateX(8px)}}.app{min-height:100dvh;display:grid;place-items:center;padding:22px}.back{position:fixed;z-index:4;top:22px;left:22px;padding:9px 15px;border:2px solid #fff;color:#fff;text-decoration:none;border-radius:999px;background:#0d5d9199;font-weight:900}.round{position:fixed;z-index:4;top:26px;right:28px;color:#fff;font-weight:900;text-shadow:0 2px #0e5683}.board{position:relative;width:min(760px,100%);padding:clamp(30px,6vw,62px);border:7px solid #eaffff;border-radius:38px;text-align:center;background:linear-gradient(145deg,#ffffffd9,#c9f8f4df);box-shadow:0 18px 0 #126a9b99,0 30px 58px #0b416466;overflow:hidden}.board:before{content:"";position:absolute;inset:auto -12% -72% -12%;height:75%;border-radius:50%;background:#68d2e7;opacity:.35}.board>*{position:relative}.eyebrow{margin:0 0 8px;color:#0b6897;font-size:.82rem;font-weight:1000;letter-spacing:.14em;text-transform:uppercase}.word{margin:0;font-size:clamp(3.4rem,12vw,7rem);letter-spacing:.04em;line-height:1;color:#0b4c79;text-shadow:0 3px #fff}.listen{display:inline-flex;align-items:center;gap:9px;margin:18px 0 27px;padding:12px 19px;border:0;border-radius:999px;color:#fff;background:linear-gradient(135deg,#2589bf,#0c6598);box-shadow:0 5px 0 #084d76;cursor:pointer;font-weight:1000;font-size:1rem}.listen:active{transform:translateY(4px);box-shadow:0 1px 0 #084d76}.letters{display:flex;justify-content:center;gap:clamp(7px,1.8vw,16px);min-height:100px;flex-wrap:wrap}.letter{width:clamp(50px,9vw,78px);height:clamp(62px,11vw,92px);display:grid;place-items:center;border:4px solid #fff;border-radius:50% 50% 47% 47%;color:#fff;background:linear-gradient(145deg,#7fd8ea,#248dbf);box-shadow:inset -10px -12px #07517a33,0 6px 0 #0d668f66;font-size:clamp(1.7rem,5vw,3rem);font-weight:1000;transition:.25s}.letter.active{border-color:var(--gold);background:linear-gradient(145deg,#ffd978,#f39b55);transform:translateY(-9px) scale(1.08);box-shadow:0 0 0 5px #fff9,0 7px 0 #bb633f}.letter.done{color:#095b75;background:linear-gradient(145deg,#d6ffdb,#68d998);border-color:#fff;transform:none}.prompt{min-height:28px;margin:25px auto 12px;font-size:clamp(1rem,2.7vw,1.24rem);font-weight:900}.mic{width:min(290px,100%);padding:15px 21px;border:0;border-radius:16px;color:#fff;background:linear-gradient(135deg,#f47b89,#d64c6c);box-shadow:0 6px 0 #a83751;cursor:pointer;font-weight:1000;font-size:1.04rem}.mic:disabled{opacity:.62;cursor:default}.mic.listening{background:#f5a33d;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.035)}}.status{min-height:23px;margin:16px 0 0;color:#0f5f82;font-weight:800}.complete{position:fixed;z-index:10;inset:0;display:none;place-items:center;padding:22px;background:#0d3d5ae8}.complete.show{display:grid}.complete-card{width:min(470px,100%);padding:42px 28px;border:6px solid #fff;border-radius:34px;color:#fff;text-align:center;background:linear-gradient(145deg,#209bc5,#0c5e96);box-shadow:0 13px 0 #073e65}.complete-card h1{margin:0;font-size:clamp(2rem,6vw,3rem)}.complete-card strong{display:block;margin:18px 0;font-size:clamp(3.5rem,12vw,5rem)}.complete-card button{padding:13px 20px;border:0;border-radius:12px;color:#104f72;background:#fff0a1;font-weight:1000;cursor:pointer}@media(max-width:560px){.app{padding:15px}.back{top:12px;left:12px}.round{top:17px;right:15px;font-size:.82rem}.board{padding:65px 18px 33px;border-width:5px}.letters{min-height:76px}.prompt{margin-top:18px}.letter{border-width:3px}}
  </style>
</head>
<body><main class="app"><a class="back" href="{% url 'assessment' %}"><i class="bi bi-arrow-left"></i> Back</a><div class="round" id="round"></div><section class="board"><p class="eyebrow">Bubble Word Decoding</p><h1 class="word" id="word"></h1><button class="listen" id="listen" type="button"><i class="bi bi-volume-up-fill"></i> Read aloud</button><div class="letters" id="letters" aria-label="Letters in the word"></div><p class="prompt" id="prompt"></p><button class="mic" id="mic" type="button"><i class="bi bi-mic-fill"></i> Speak now</button><p class="status" id="status" aria-live="polite"></p></section></main><section class="complete" id="complete"><div class="complete-card"><h1>Decoding Complete!</h1><p>You completed the word set.</p><strong id="score"></strong><button id="finish" type="button">Back to Assessments</button></div></section>
<script>
(()=>{'use strict';const material={{ word_decoding_material_json|safe }},completion={{ word_decoding_completion_json|safe }};const items=Array.isArray(material.items)?material.items.filter(item=>item&&item.word):[];let round=0,letterIndex=0,listening=false,answers=[];const $=id=>document.getElementById(id),lang=String(material.language).toLowerCase()==='english'?'en-US':'fil-PH';const letterNames={a:['a','ay','ah'],b:['b','be','bee','bi'],c:['c','ce','see','si'],d:['d','de','dee','di'],e:['e','ee','eh'],f:['f','ef'],g:['g','ge','gee','ji'],h:['h','aitch','eych'],i:['i','ay','ee'],j:['j','jay'],k:['k','kay','ke'],l:['l','el'],m:['m','em'],n:['n','en'],o:['o','oh'],p:['p','pe','pee'],q:['q','cue'],r:['r','ar'],s:['s','es'],t:['t','te','tee'],u:['u','you','oo'],v:['v','vee'],w:['w','double u'],x:['x','ex'],y:['y','why'],z:['z','zee','zed']};function item(){return items[round]||null}function normalize(value){return String(value||'').toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'')}function say(text){if(!('speechSynthesis'in window))return;$('status').textContent='Reading aloud…';speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang=lang;utterance.rate=.78;utterance.onend=()=>{$('status').textContent='';};speechSynthesis.speak(utterance)}function render(){const current=item();if(!current){finish();return}letterIndex=0;const word=String(current.word);$('word').textContent=word;$('round').textContent=`Round ${round+1} of ${items.length}`;$('letters').innerHTML=Array.from(word).map((letter,index)=>`<span class="letter ${index===0?'active':''}">${letter}</span>`).join('');$('prompt').textContent=`Say the sound for “${word[0]}”.`;$('status').textContent='';setTimeout(()=>say(word),350)}function currentExpected(){const word=String(item()?.word||'');return letterIndex<word.length?word[letterIndex]:word}function matches(transcript,expected,isWord){const heard=normalize(transcript),target=normalize(expected);if(!heard||!target)return false;if(isWord)return heard===target||heard.includes(target);return heard===target||(letterNames[target]||[]).some(value=>heard===normalize(value)||heard.includes(normalize(value)))}function updateLetters(){[...document.querySelectorAll('.letter')].forEach((node,index)=>node.className=`letter ${index<letterIndex?'done':index===letterIndex?'active':''}`)}function beginRecognition(){if(listening)return;const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){$('status').textContent='Speech recognition is not available in this browser.';return}const recognition=new Recognition();recognition.lang=lang;recognition.interimResults=false;recognition.maxAlternatives=3;listening=true;$('mic').disabled=true;$('mic').classList.add('listening');$('mic').innerHTML='<i class="bi bi-soundwave"></i> Listening…';$('status').textContent='Speak clearly.';recognition.onresult=event=>{const results=[...event.results[0]].map(result=>result.transcript);const expected=currentExpected(),wordStage=letterIndex>=String(item().word).length;const correct=results.some(result=>matches(result,expected,wordStage));if(!correct){$('status').textContent=wordStage?'Try saying the full word again.':`Try the sound for “${expected}” again.`;return}if(wordStage){answers.push({word:item().word,letter_sounds_completed:true,word_completed:true});round++;render();return}letterIndex++;updateLetters();const word=String(item().word);if(letterIndex===word.length){$('prompt').textContent=`Great! Now say the full word: “${word}”.`;say(word)}else{$('prompt').textContent=`Good! Now say the sound for “${word[letterIndex]}”.`}};recognition.onerror=()=>{$('status').textContent='I could not hear that. Please try again.'};recognition.onend=()=>{listening=false;$('mic').disabled=false;$('mic').classList.remove('listening');$('mic').innerHTML='<i class="bi bi-mic-fill"></i> Speak now'};recognition.start()}async function finish(){const duration=Math.round(performance.now()/1000);try{const response=await fetch('{% url "record_assessment_completion" %}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':document.cookie.split('; ').find(row=>row.startsWith('csrftoken='))?.split('=')[1]||''},body:JSON.stringify({material_id:material.id,activity_type:'word_decoding',status:'completed',items_completed:items.length,scores:{answers,duration_seconds:duration}})});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.error)}catch(error){$('status').textContent='Your result could not be saved. Please try again.';return}$('score').textContent=`${answers.length} / ${items.length}`;$('complete').classList.add('show')}$('listen').addEventListener('click',()=>say(item()?.word||''));$('mic').addEventListener('click',beginRecognition);$('finish').addEventListener('click',()=>location.href='{% url "assessment" %}');if(completion.completed){$('score').textContent=`${completion.correct_items||0} / ${completion.total_items||items.length}`;$('complete').classList.add('show')}else if(items.length)render();else{$('prompt').textContent='This activity has no available words.';$('mic').disabled=true}})();
</script></body></html>
