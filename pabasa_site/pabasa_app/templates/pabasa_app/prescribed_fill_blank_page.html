<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fill in the Blanks | PABASA</title>
<style>
:root{--ink:#16465d;--blue:#197b99;--muted:#5b7680;--line:#d6e7e8;--good:#2b9b63;--bad:#c85555}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3faf8;color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}
.page{width:min(1220px,calc(100% - 28px));margin:auto;padding:30px 0}.back{color:var(--ink);font-weight:900;text-decoration:none;font-size:1.1rem}.card{margin-top:24px;border:1px solid var(--line);border-radius:28px;background:#fff;padding:clamp(28px,5vw,68px);box-shadow:0 18px 45px #24545d18}.eyebrow{color:#42768a;font-size:clamp(.85rem,1.2vw,1rem);font-weight:900;letter-spacing:.14em}.title{margin:.3rem 0;font-size:clamp(2.7rem,6vw,5.2rem)}.instruction{font-size:clamp(1.05rem,1.8vw,1.35rem);color:var(--muted);font-weight:700;line-height:1.5}.content{max-width:1040px;margin:44px auto 0;text-align:center}.prompt{font-size:clamp(1.35rem,2.2vw,1.8rem);font-weight:900}.choices{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;margin:26px 0}.choice{position:relative;border:2px solid #9bb8bd;border-radius:14px;background:#f5fbfa;color:var(--ink);padding:16px 30px;font:inherit;font-size:clamp(1.1rem,1.8vw,1.45rem);font-weight:900;cursor:grab}.choice.reading{outline:4px solid #f2c45d}.choice.reading::after{content:'↓';position:absolute;left:50%;top:-2.05em;transform:translateX(-50%);color:#e0a923;font-size:1.7em;font-weight:1000;line-height:1}.choice.used{opacity:.45}.button{border:0;border-radius:13px;background:var(--blue);box-shadow:0 4px 0 #126078;color:#fff;padding:16px 26px;font:inherit;font-size:1.1rem;font-weight:900;cursor:pointer}.button:disabled{opacity:.6;cursor:wait}.help{margin:16px auto;color:var(--muted);font-weight:800}.sentence{font-size:clamp(1.6rem,3.4vw,2.5rem);line-height:2.5;margin:30px auto;max-width:1000px}.blank{display:inline-flex;vertical-align:middle;min-width:140px;min-height:52px;margin:0 7px;border-bottom:3px solid var(--ink);border-radius:8px 8px 0 0;background:#f0f6f5;align-items:center;justify-content:center;font-weight:900}.blank.correct{background:#d7f2df;color:var(--good);border-color:var(--good)}.blank.wrong{background:#f7dada;color:var(--bad)}.status{min-height:32px;font-size:1.1rem;color:var(--muted);font-weight:800}.complete{padding:52px;text-align:center;color:var(--good);font-size:1.6rem;font-weight:900}
</style>
<style>.choice-phase .choices{position:relative;padding-top:42px}.choice-phase .choices::before{display:none}.choice-phase .choice.reading::after{content:'↓';display:block;position:absolute;left:50%;top:-1.55em;transform:translateX(-50%);color:#d69712;font-size:2.8rem;font-weight:1000;line-height:.8;-webkit-text-stroke:1px #d69712}</style></head>
<body><main class="page"><a class="back" href="{% url 'assessment' %}">← Back to My Lessons</a><section class="card" id="app"></section></main>
{{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
<script>
(()=>{const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),app=document.getElementById('app'),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||''),state={...(d.progress?.state||{})};let busy=false,selected=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(text,done){if(!window.speechSynthesis){done?.();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;u.onend=()=>done?.();speechSynthesis.speak(u)}
async function save(body){const r=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(body)}),x=await r.json();if(!r.ok||!x.success)throw Error(x.error||'Could not save progress');Object.assign(state,x.progress.state||{});return x}
function readText(item){return item.parts.map((part,i)=>part+(i<(item.parts.length-1)?' blank ':'' )).join('')}
function render(){if(state.phase==='complete'){app.innerHTML='<div class="complete">Great job! You completed Activity 2.</div>';return}app.innerHTML=`<div class="eyebrow">SESSION ${d.session_number} · LESSON ${d.lesson_number} · ACTIVITY ${d.gawain_number}</div><h1 class="title">${esc(d.title)}</h1><p class="instruction">${esc(d.instruction)}</p><div class="content" id="content"></div>`;state.phase=state.phase||'choices';state.choice_index=Number(state.choice_index||0);state.current_item=Number(state.current_item||0);state.placements=state.placements||{};state.completed_items=Number(state.completed_items||0);state.choice_attempts=Number(state.choice_attempts||0);state.sentence_attempts=Number(state.sentence_attempts||0);state.sentence_read=!!state.sentence_read;state.choice_help=!!state.choice_help;state.sentence_help=!!state.sentence_help;state.phase==='choices'?renderChoices():renderSentence()}
function renderChoices(){const content=document.getElementById('content');content.classList.add('choice-phase');const i=state.choice_index,word=d.choices[i]||'';content.innerHTML=`<div class="prompt">Read each choice aloud, one at a time.</div><div class="choices">${d.choices.map((x,n)=>`<button class="choice ${n===i?'reading':''} ${n<i?'used':''}" data-choice="${n}" ${n!==i?'disabled':''}>${esc(x)}</button>`).join('')}</div><p class="status" id="status">${i<d.choices.length?`Read “${esc(word)}” aloud.`:'All choices read.'}</p><button class="button" id="read">Read the choice</button>${state.choice_help?'<button class="button" id="help">Read aloud for me</button>':''}`;document.getElementById('read')?.addEventListener('click',()=>record(word,i));document.getElementById('help')?.addEventListener('click',()=>speak(word,()=>{save({action:'choice_read',choice_index:i,success:true}).then(render)}))}
async function record(target,index){if(busy)return;busy=true;const status=document.getElementById('status'),button=document.getElementById('read');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Microphone is not available.';busy=false;return}button.disabled=true;button.textContent='Listening…';let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const rec=new MediaRecorder(stream),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(resolve=>rec.onstop=()=>resolve(new Blob(chunks,{type:rec.mimeType||'audio/webm'})));rec.start();setTimeout(()=>rec.state==='recording'&&rec.stop(),3000);const audio=await done;stream.getTracks().forEach(t=>t.stop());const f=new FormData();f.append('audio',audio,'reading.webm');f.append('target_text',target);f.append('language','English');f.append('mode','reading');const r=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),x=await r.json();const norm=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');const ok=!!(x.success&&norm(x.transcript).includes(norm(target)));await save({action:'choice_read',choice_index:index,success:ok});render()}catch(e){status.textContent='Could not hear you. Try again.'}finally{stream?.getTracks().forEach(t=>t.stop());busy=false}}
function renderSentence(){const content=document.getElementById('content');content.classList.remove('choice-phase');const item=d.items[state.current_item],p=state.placements||{};const parts=item.parts.map((part,i)=>part+(i<item.blank_count?`<span class="blank ${p[String(i)]?'correct':''}" data-blank="${i}">${esc(p[String(i)]||'Drop a word')}</span>`:'' )).join('');const available=d.choices.filter(x=>!Object.values(p).includes(x));content.innerHTML=`<div class="prompt">Listen to the sentence, then drag the correct words into the blanks.</div><button class="button" id="listen">🔊 Listen to the sentence</button><div class="sentence">${parts}</div><div class="choices">${available.map(x=>`<button draggable="true" class="choice" data-word="${esc(x)}">${esc(x)}</button>`).join('')}</div><p class="status" id="status">${state.sentence_read?'Choose the words for the blanks.':'Listen before filling in the blanks.'}</p>${state.sentence_help?'<button class="button" id="sentence-help">🔊 Read the sentence aloud</button>':''}`;const text=readText(item);const listen=()=>speak(text,async()=>{await save({action:'sentence_read'});render()});document.getElementById('listen').onclick=listen;if(!state.sentence_read)setTimeout(listen,250);app.querySelectorAll('[data-word]').forEach(el=>{el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.word);el.onclick=()=>{selected=el.dataset.word;app.querySelectorAll('.choice').forEach(x=>x.classList.remove('reading'));el.classList.add('reading')}});app.querySelectorAll('[data-blank]').forEach(el=>{el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();place(el.dataset.blank,e.dataTransfer.getData('text/plain'))};el.onclick=()=>selected&&place(el.dataset.blank,selected)});document.getElementById('sentence-help')?.addEventListener('click',()=>speak(text));}
async function place(blank,word){if(busy||!word)return;busy=true;try{const x=await save({action:'place_word',item_index:state.current_item,blank_index:Number(blank),word});if(!x.accepted){const el=document.querySelector(`[data-blank="${blank}"]`);el?.classList.add('wrong');setTimeout(()=>el?.classList.remove('wrong'),450)}else{selected=null;render();if(x.sentence_complete)setTimeout(showReadPrompt,100)}}catch(e){document.getElementById('status').textContent=e.message}finally{busy=false}}
function showReadPrompt(){const s=document.getElementById('status');if(s)s.textContent='Read the whole sentence aloud.';const b=document.createElement('button');b.className='button';b.textContent='Read the sentence';b.id='read-sentence';document.getElementById('content')?.appendChild(b);b.onclick=()=>recordSentence()}
async function recordSentence(){if(busy)return;busy=true;const item=d.items[state.current_item],target=item.parts.map((x,i)=>x+(i<item.blank_count?Object.values(state.placements||{})[i]||'':'' )).join(''),status=document.getElementById('status');try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error();const stream=await navigator.mediaDevices.getUserMedia({audio:true}),rec=new MediaRecorder(stream),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(resolve=>rec.onstop=()=>resolve(new Blob(chunks,{type:rec.mimeType||'audio/webm'})));rec.start();setTimeout(()=>rec.state==='recording'&&rec.stop(),4500);const audio=await done;stream.getTracks().forEach(t=>t.stop());const f=new FormData();f.append('audio',audio,'reading.webm');f.append('target_text',target);f.append('language','English');f.append('mode','reading');const r=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f}),x=await r.json();const norm=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');const ok=!!(x.success&&norm(x.transcript).includes(norm(target)));await save({action:'sentence_reading',success:ok});render()}catch(e){if(status)status.textContent='Could not hear you. Try again.'}finally{busy=false}}
render()})();
</script></body></html>
