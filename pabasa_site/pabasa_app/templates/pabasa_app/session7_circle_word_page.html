<!doctype html>
<html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 19: Gawain 3</title>
<style>:root{--ink:#16465d;--blue:#197b99;--gold:#d98c27;--good:#278750;--bad:#ad3c3c;--line:#bfdde4}*{box-sizing:border-box}body{margin:0;background:#eaf7f7;color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(760px,calc(100% - 24px));margin:auto;padding:16px 0}.back{color:var(--ink);font-weight:900;text-decoration:none}.card{min-height:calc(100vh - 58px);margin-top:12px;padding:clamp(20px,5vw,42px);border-radius:28px;background:#fffdf7;text-align:center;box-shadow:0 18px 45px #24545d18}.eyebrow{color:#997124;font-size:.82rem;font-weight:900;letter-spacing:.08em}.instruction,.hint{color:#526e78;font-weight:700}.track{height:11px;margin:14px auto 22px;background:#dcebea;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#197b99,#72c8d5)}.picture{width:min(330px,100%);height:235px;margin:18px auto;padding:12px;border:3px solid var(--line);border-radius:22px;background:#fff}.picture img{width:100%;height:100%;object-fit:contain}.button,.word{min-height:52px;margin:8px;padding:12px 24px;border:0;border-radius:15px;background:var(--blue);box-shadow:0 4px 0 #155369;color:#fff;font:900 1rem inherit;cursor:pointer}.button.gold{background:var(--gold);box-shadow:0 4px 0 #a96c1e}.button:disabled,.word:disabled{opacity:.6;cursor:wait}.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px auto;max-width:680px}.word{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:none;font-size:clamp(1rem,3.6vw,1.35rem);overflow-wrap:anywhere}.word.active{border-color:var(--gold);background:#fff3cd;box-shadow:0 0 0 5px #f6df9c}.word.read{border-color:var(--good);background:#e3f7e8}.word.selected,.word.locked{border:5px solid var(--good);border-radius:50%;background:#e3f7e8;color:var(--good)}.word.selected{border-color:var(--gold);color:var(--ink);background:#fff3cd}.status{min-height:30px;font-weight:900}.good{color:var(--good)}.bad{color:var(--bad)}.intro-art{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:24px auto}.intro-art img{height:70px;width:100%;object-fit:contain}.done{padding-top:12vh}.done h1{font-size:clamp(2rem,6vw,4rem)}@media(max-width:510px){.words{gap:5px}.word{margin:0;padding:10px 4px}.picture{height:205px}}</style></head>
<body><main class="page"><a class="back" href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card" aria-live="polite"></section></main>{{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
<script>(()=>{'use strict';
const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),items=d.items||[],app=document.getElementById('app'),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||''),esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),norm=x=>String(x||'').toLocaleLowerCase('fil-PH').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,''),attemptKey=(i,w)=>`${i}:${w}`;
let s=Object.assign({phase:'intro',current_item_index:0,current_oral_word_index:0,orally_completed_words:{},stt_attempt_counts:{},read_aloud_play_counts:{},selected_answers:{},completed_correct_answers:[],state_version:0},d.progress?.state||{}),busy=false,request=0,stream=null,audio=null;
const stop=()=>{stream?.getTracks().forEach(track=>track.stop());stream=null;if(audio){audio.pause();audio=null}},current=()=>Number(s.current_item_index)||0,total=items.length,oralDone=i=>s.orally_completed_words[String(i)]||[],progress=()=>Math.min(total*4,s.completed_correct_answers.length*4+(current()<total?oralDone(current()).length:0)),head=()=>`<p class="eyebrow">SESSION 7 · LESSON 19 · GAWAIN 3</p><h1>${esc(d.display_title)}</h1><h2>${esc(d.title)}</h2><p class="instruction">${esc(d.instruction)}</p><div class="track" aria-label="Progress"><i style="width:${total?progress()/(total*4)*100:0}%"></i></div>`,picture=item=>`<div class="picture"><img src="${esc(item.image_url)}" alt="${esc(item.alt_text)}"></div>`;
async function save(extra={}){const mine=++request,r=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({state:{...s,state_version:(Number(s.state_version)||0)+1},...extra})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Hindi na-save ang progress. Subukan muli.');if(mine!==request)return null;s=j.progress.state;return j}
function render(message='',kind=''){if(d.progress?.activity_completed||s.phase==='completion'){app.innerHTML=`<div class="done"><div>⭐</div><h1>Magaling!</h1><p>Natapos mo ang Lesson 19: Gawain 3.</p><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`;return}const i=current(),item=items[i];if(s.phase==='intro'){app.innerHTML=head()+`<p class="hint">Basahin muna ang tatlong salita bago piliin ang tumutukoy sa larawan.</p><div class="intro-art">${items.map(x=>`<img src="${esc(x.image_url)}" alt="${esc(x.alt_text)}">`).join('')}</div><button class="button" id="start" type="button">SIMULAN</button><p class="status ${kind}">${esc(message)}</p>`;app.querySelector('#start').onclick=async()=>{s.phase='oral_reading';try{await save();render()}catch(e){render(e.message,'bad')}};return}if(s.phase==='feedback'){const previous=items[s.completed_correct_answers.length-1],answer=s.completed_correct_answers.at(-1);app.innerHTML=head()+picture(previous)+`<p class="status good">Tama! Magaling ang iyong sagot.</p><button class="word locked" disabled>${esc(answer)}</button><br><button class="button" id="next">${s.completed_correct_answers.length===total?'TAPUSIN':'SUSUNOD'}</button>`;app.querySelector('#next').onclick=async()=>{if(s.completed_correct_answers.length===total)return finish();s.current_item_index=s.completed_correct_answers.length;s.current_oral_word_index=0;s.phase='oral_reading';try{await save();render()}catch(e){render(e.message,'bad')}};return}if(!item)return finish();const done=oralDone(i),wordIndex=done.length;
if(s.phase==='oral_reading'){const word=item.choices[wordIndex],recover=(s.stt_attempt_counts[attemptKey(i,wordIndex)]||0)>=3;app.innerHTML=head()+`<p class="hint">Larawan ${i+1} sa ${total} · Salita ${wordIndex+1} sa 3</p>${picture(item)}<div class="words">${item.choices.map((choice,index)=>`<div class="word ${index===wordIndex?'active':''} ${done.includes(index)?'read':''}">${esc(choice)}</div>`).join('')}</div><p class="hint">${recover?'Pakinggan muna ang salita.':'Basahin ang naka-highlight na salita.'}</p><button class="button ${recover?'gold':''}" id="oral" type="button">${recover?'🔊 Pakinggan muna':'🎙 Basahin ngayon'}</button><p class="status ${kind}">${esc(message)}</p>`;const button=app.querySelector('#oral');button.onclick=()=>recover?listen(i,wordIndex,word,button):read(i,wordIndex,word,button);return}
const selected=s.selected_answers[String(i)]||'';app.innerHTML=head()+`<p class="hint">Larawan ${i+1} sa ${total}</p>${picture(item)}<p class="hint">Alin ang tamang salita para sa larawan?</p><div class="words">${item.choices.map(choice=>`<button class="word ${selected===choice?'selected':''}" data-choice="${esc(choice)}">${esc(choice)}</button>`).join('')}</div><button class="button" id="check" ${selected?'':'disabled'}>SURIIN</button><p class="status ${kind}">${esc(message)}</p>`;const check=app.querySelector('#check');app.querySelectorAll('[data-choice]').forEach(button=>button.onclick=async()=>{if(busy)return;busy=true;s.selected_answers={[String(i)]:button.dataset.choice};try{await save();render()}catch(e){render(e.message,'bad')}finally{busy=false}});check.onclick=()=>answer(selected)}
async function read(i,w,word,button){if(busy)return;busy=true;const mine=++request;try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono.');button.disabled=true;button.textContent='Nagbabasa...';stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[],recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);const blob=await new Promise(resolve=>{recorder.onstop=()=>resolve(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));recorder.start();setTimeout(()=>recorder.state==='recording'&&recorder.stop(),3500)});stop();if(mine!==request)return;button.textContent='Pinoproseso...';const form=new FormData();form.append('audio',blob,'session7-lesson19-gawain3.webm');form.append('target_text',word);form.append('language','Filipino');form.append('mode','reading');const response=await fetch(d.transcribe_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json().catch(()=>({}));if(mine!==request)return;if(!response.ok||!result.success||!norm(result.transcript).includes(norm(word)))throw Error('Hindi pa. Subukan muli.');s.orally_completed_words[String(i)]=[...oralDone(i),w];s.current_oral_word_index=w+1;s.stt_attempt_counts[attemptKey(i,w)]=0;s.read_aloud_play_counts[attemptKey(i,w)]=0;s.phase=w===2?'word_selection':'oral_reading';await save();render(w===2?'Tama ang pagbasa! Piliin ang tamang salita.':'Tama ang pagbasa!','good')}catch(e){if(mine===request){const key=attemptKey(i,w);s.stt_attempt_counts[key]=Math.min(3,(s.stt_attempt_counts[key]||0)+1);try{await save()}catch(_){}render((s.stt_attempt_counts[key]||0)>=3?'Pakinggan muna ang salita.':e.message||'Hindi nakuha ang boses. Subukan muli.','bad')}}finally{stop();busy=false}}
async function listen(i,w,word,button){if(busy)return;busy=true;const mine=++request;try{button.disabled=true;button.textContent='Nilo-load...';const form=new FormData();form.append('text',word);form.append('language','Filipino');form.append('prescribed_activity_key','session-7-lesson-19-gawain-3');const response=await fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json().catch(()=>({}));if(mine!==request)return;if(!response.ok||!result.success||result.tts_language!=='fil-PH'||result.voice_name!=='fil-PH-Wavenet-A')throw Error(result.error||'Hindi available ang Filipino audio.');button.textContent='Pinakikinggan...';audio=new Audio(URL.createObjectURL(new Blob([Uint8Array.from(atob(result.audio_content),c=>c.charCodeAt(0))],{type:result.mime_type||'audio/mpeg'})));await audio.play();await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=()=>reject(Error('Hindi ma-play ang audio.'))});if(mine!==request)return;const key=attemptKey(i,w);s.read_aloud_play_counts[key]=Math.min(3,(s.read_aloud_play_counts[key]||0)+1);if(s.read_aloud_play_counts[key]===3){s.stt_attempt_counts[key]=0;s.read_aloud_play_counts[key]=0}s.phase='oral_reading';await save();render('Subukan mong basahin ang salita.')}catch(e){if(mine===request)render(e.message||'Hindi available ang audio. Subukan muli.','bad')}finally{busy=false}}
async function answer(value){if(busy||!value)return;busy=true;try{const result=await save({candidate_answer:value});if(result.accepted){s.phase='feedback';render()}else{s.selected_answers={};try{await save()}catch(_){}render('Subukan muli.','bad')}}catch(e){render(e.message,'bad')}finally{busy=false}}
async function finish(){if(busy)return;busy=true;s.phase='completion';try{const response=await fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'}),result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw Error(result.error||'Hindi na-save ang pagtatapos. Subukan muli.');d.progress.activity_completed=true;render()}catch(e){s.phase='feedback';render(e.message,'bad');const retry=document.createElement('button');retry.className='button';retry.textContent='SUBUKANG MULI';retry.onclick=finish;app.querySelector('.status')?.after(retry)}finally{busy=false}}
addEventListener('pagehide',stop);render();})();</script></body></html>
