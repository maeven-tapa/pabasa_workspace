<script>(()=>{'use strict';

async function read(i,w,word,button){if(busy)return;busy=true;const mine=++request;try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono.');button.disabled=true;button.textContent='Nagbabasa...';stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[],recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);const blob=await new Promise(resolve=>{recorder.onstop=()=>resolve(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));recorder.start();setTimeout(()=>recorder.state==='recording'&&recorder.stop(),3500)});stop();if(mine!==request)return;button.textContent='Pinoproseso...';const form=new FormData();form.append('audio',blob,'session7-lesson19-gawain3.webm');form.append('target_text',word);form.append('language','Filipino');form.append('mode','reading');const response=await fetch(d.transcribe_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json().catch(()=>({}));if(mine!==request)return;if(!response.ok||!result.success||!norm(result.transcript).includes(norm(word)))throw Error('Hindi pa. Subukan muli.');s.orally_completed_words[String(i)]=[...oralDone(i),w];s.current_oral_word_index=w+1;s.stt_attempt_counts[attemptKey(i,w)]=0;s.read_aloud_play_counts[attemptKey(i,w)]=0;s.phase=w===2?'word_selection':'oral_reading';await save();render(w===2?'Tama ang pagbasa! Piliin ang tamang salita.':'Tama ang pagbasa!','good')}catch(e){if(mine===request){const key=attemptKey(i,w);s.stt_attempt_counts[key]=Math.min(3,(s.stt_attempt_counts[key]||0)+1);try{await save()}catch(_){}render((s.stt_attempt_counts[key]||0)>=3?'Pakinggan muna ang salita.':e.message||'Hindi nakuha ang boses. Subukan muli.','bad')}}finally{stop();busy=false}}
