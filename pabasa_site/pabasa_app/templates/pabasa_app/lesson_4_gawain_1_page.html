<script type="text/plain" data-lesson4-g1-bootstrap>
document.addEventListener('DOMContentLoaded',()=>{
	const payload=JSON.parse(document.getElementById('lesson-four-data')?.textContent||'{}'),button=document.getElementById('start'),heading=document.querySelector('#app .overview h2'),paragraph=document.querySelector('#app .overview p');
	if(!button||!heading||!paragraph||Number(payload.progress?.current_index||0)>0||payload.progress?.activity_completed)return;
	button.disabled=true;
	const speak=async text=>{
		const form=new FormData();form.append('target_text',text);form.append('language','Filipino');form.append('mode','reading');
		const response=await fetch('{% url "reading_read_aloud_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':token()},body:form}),result=await response.json();
		if(!response.ok||!result.success)throw Error(result.error||'Hindi available ang audio.');
		const audio=new Audio('data:'+(result.mime_type||'audio/mpeg')+';base64,'+result.audio_content);
		await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=reject;audio.play().catch(reject)});
	};
	(async()=>{try{await speak(heading.textContent.trim());await speak(paragraph.textContent.trim());await speak('Magsimula na tayo!')}catch(error){}finally{button.disabled=false}})();
});
</script>
<script type="text/plain" data-lesson4-g1-bootstrap>
/* Use prescribed audio for Lesson 4 Gawain 1 target-word playback only. */
(function(){
  document.addEventListener('DOMContentLoaded',()=>{
    const wordAudioFiles={manok:'manok.mp3',manika:'manika.mp3',susi:'susi.mp3',mangga:'mangga.mp3',mais:'mais.mp3',mani:'mani.mp3'};
    const wordAudioBase='/static/pabasa_app/prescribed/audio/SESSION%202/LESSON%204/GAWAIN%201/';
    const playWordAudio=async word=>{const audio=new Audio(wordAudioBase+wordAudioFiles[String(word||'').toLowerCase()]);await audio.play();await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=reject})};
    const bind=()=>{const button=document.getElementById('read');if(button&&typeof phase==='string'&&phase==='listen')button.onclick=()=>playWordAudio(items[index].word).catch(()=>{})};
    const currentRender=window.render;
    if(typeof currentRender==='function')window.render=function(){const result=currentRender.apply(this,arguments);bind();return result};
    bind();
  }, {once:true});
})();
</script>

<script type="text/plain" data-lesson4-g1-bootstrap>
document.addEventListener('DOMContentLoaded',()=>{
	const app=document.getElementById('app');
	if(!app)return;
	let observedRead=null,readObserver=null,part2Active=false,part2NarrationKey='',part2NarrationPending=false,phaseOneNarrationKey='';
	const playNarration=async text=>{const form=new FormData();form.append('target_text',text);form.append('language','Filipino');form.append('mode','reading');const response=await fetch('{% url "reading_read_aloud_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':token()},body:form}),result=await response.json();if(!response.ok||!result.success||!result.audio_content)throw Error(result.error||'Hindi available ang audio.');const audio=new Audio('data:'+(result.mime_type||'audio/mpeg')+';base64,'+result.audio_content);await new Promise((resolve,reject)=>{audio.onended=()=>{audio.pause();audio.currentTime=0;resolve()};audio.onerror=reject;audio.play().catch(reject)});return true};
	let narrationQueue=Promise.resolve();
	const narrateFeedback=text=>{const next=narrationQueue.then(()=>playNarration(text));narrationQueue=next.catch(()=>{});return next};
	window.lesson4NarrateFeedback=narrateFeedback;
	const narrateNewItem=async itemIndex=>{const key=String(itemIndex);if(phaseOneNarrationKey===key)return;phaseOneNarrationKey=key;const read=app.querySelector('.focused .read'),listen=app.querySelector('.lesson4-audio-actions .listen');if(read)read.disabled=true;if(listen)listen.disabled=true;try{await narrateFeedback('Pangalanan ang larawan');await narrateFeedback('Sabihin ang salita nang malinaw')}catch(error){}finally{if(phaseOneNarrationKey===key&&phase==='read'){if(read?.isConnected)read.disabled=false;if(listen?.isConnected)listen.disabled=false;introReady=true}}};
	window.classify=async event=>{if(typeof phase!=='string'||phase!=='classify'||busy)return;busy=true;const yes=event.currentTarget.dataset.answer==='yes',correct=yes===items[index].starts_m,status=app.querySelector('#status');document.querySelectorAll('.choice').forEach(button=>button.disabled=true);try{if(!correct){if(status)status.textContent='Hindi pa ito tama. Subukan muli';await narrateFeedback('Hindi pa ito tama. Subukan muli');return}if(status)status.textContent='Magaling!';const feedbackFinished=await narrateFeedback('Magaling!');if(!feedbackFinished)return;score++;circled.push(index);responses.push(yes);index++;phase='read';tries=0;listens=0;introReady=true;part2Active=false;await save(index>=total);render();if(index<total)await narrateNewItem(index)}catch(error){if(status)status.textContent=correct?'Hindi available ang feedback. Subukan muli.':'Hindi pa ito tama. Subukan muli'}finally{busy=false;if(phase==='classify')document.querySelectorAll('.choice').forEach(button=>button.disabled=false)}};
	const sync=()=>{
		const read=app.querySelector('.focused .read'),controls=app.querySelector('.focused .controls');
		part2Active=part2Active||phase==='classify';
		app.dataset.lesson4Part2=part2Active?'1':'';
		const status=app.querySelector('.focused .status');
		if(phase==='classify'&&status&&/^Sabihin ang salita/.test(status.textContent))status.textContent='Piliin ang Oo o hindi.';
		if(phase==='classify'){
			const choices=[...document.querySelectorAll('.choice')],key=String(index);
			choices.forEach(button=>button.onclick=window.classify);
			if(part2NarrationKey!==key){
				part2NarrationKey=key;
				part2NarrationPending=true;
				choices.forEach(button=>button.disabled=true);
				(async()=>{try{await narrateFeedback('Nagsisimula ba ang salitang ito sa tunog em?');await narrateFeedback('Piliin ang Oo o Hindi.')}catch(error){}finally{if(part2NarrationKey===key&&phase==='classify'){part2NarrationPending=false;document.querySelectorAll('.choice').forEach(button=>button.disabled=false)}}})();
			}else if(part2NarrationPending){
				choices.forEach(button=>button.disabled=true);
			}
		}
		if(!read||!controls)return;
		if(read!==observedRead){readObserver?.disconnect();observedRead=read;readObserver=new MutationObserver(sync);readObserver.observe(read,{attributes:true,attributeFilter:['disabled']})}
		let actions=controls.querySelector('.lesson4-audio-actions');
		if(!actions){actions=document.createElement('div');actions.className='lesson4-audio-actions';read.parentNode.insertBefore(actions,read);actions.append(read)}
		let listen=actions.querySelector('#listen');
		if(!listen){listen=document.createElement('button');listen.type='button';listen.id='listen';listen.className='listen';listen.textContent='Pakinggan';actions.append(listen)}
		if(read.dataset.lesson4ReadBound!=='1'){
			const originalRead=read.onclick;
			read.dataset.lesson4ReadBound='1';
			read.onclick=async event=>{try{tries=0}catch(error){}if(read.disabled)return;app.dataset.lesson4Retry='1';await originalRead?.call(read,event);try{tries=0}catch(error){}const status=app.querySelector('#status');if(status&&/^Hindi pa(?: ito tama)?\./.test(status.textContent))status.textContent='Hindi pa ito tama. Subukan muli';if(typeof phase==='string'&&phase!=='read')delete app.dataset.lesson4Retry};
		}
		if(listen.dataset.lesson4ListenBound!=='1'){
			listen.dataset.lesson4ListenBound='1';
			listen.onclick=async()=>{if(listen.disabled||listen.dataset.busy==='1')return;listen.dataset.busy='1';listen.disabled=true;try{const wordAudioFiles={manok:'manok.mp3',manika:'manika.mp3',susi:'susi.mp3',mangga:'mangga.mp3',mais:'mais.mp3',mani:'mani.mp3'},audio=new Audio('/static/pabasa_app/prescribed/audio/SESSION%202/LESSON%204/GAWAIN%201/'+wordAudioFiles[items[index].word.toLowerCase()]);await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=reject;audio.play().catch(reject)})}catch(error){console.error('Lesson 4 Pakinggan narration failed',error)}finally{if(listen.isConnected){listen.disabled=false;listen.dataset.busy='0'}}};
		}
		listen.disabled=read.disabled;
	};
	window.lesson4Sync=sync;
	let appObserver;
	const originalRender=window.render;
	if(typeof originalRender==='function')window.render=function(){app.dataset.lesson4Part2=(part2Active||phase==='classify')?'1':'';originalRender();sync()};
	appObserver=new MutationObserver(()=>{appObserver.disconnect();sync();appObserver.observe(app,{childList:true,subtree:true})});
	appObserver.observe(app,{childList:true,subtree:true});
	sync();
});
</script>
