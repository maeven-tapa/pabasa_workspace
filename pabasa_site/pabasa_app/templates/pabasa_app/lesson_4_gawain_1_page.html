async function record(){if(busy)return;busy=true;const b=document.getElementById('read'),s=document.getElementById('status');b.disabled=true;b.classList.add('listening');b.textContent='Nagbabasa...';try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),chunks=[],m=new MediaRecorder(stream);m.ondataavailable=e=>e.data.size&&chunks.push(e.data);await new Promise(ok=>{m.onstop=ok;m.start();setTimeout(()=>m.stop(),3000)});stream.getTracks().forEach(t=>t.stop());b.classList.remove('listening');b.classList.add('processing');b.textContent='Pinoproseso...';const f=new FormData();f.append('audio',new Blob(chunks,{type:'audio/webm'}),'reading.webm');f.append('target_text',items[index].word);f.append('language','Filipino');f.append('mode','reading');const x=await(await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':token()},body:f})).json();if(x.success&&x.complete){phase='classify';render()}else{tries++;s.textContent='Hindi pa. Subukan muli. ('+tries+'/3)';if(tries>=3)phase='listen'}}catch(e){s.textContent='Hindi nakuha ang iyong boses. Subukan muli.'}finally{busy=false;if(phase!=='classify')render()}}
