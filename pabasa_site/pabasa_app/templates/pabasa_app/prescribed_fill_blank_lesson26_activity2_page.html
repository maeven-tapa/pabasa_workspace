{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fill in the Blanks | PABASA</title>
  <style>
    @font-face{font-family:Lesson26Fredoka;src:url("{% static 'pabasa_app/images/lesson_26/lesson26-fredoka.ttf' %}") format('truetype');font-display:swap}
    :root{--ink:#183e63;--blue:#197b99;--muted:#55768b;--line:#94d9d6;--gold:#efb947;--good:#24889a;--bad:#b33b43;--teal:#299e9a;--teal-dark:#187b7a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#49b8e0 url("{% static 'pabasa_app/images/lesson_26/lesson26-ui-background.jpg' %}") center/cover fixed no-repeat;color:var(--ink);font-family:Lesson26Fredoka,Nunito,"Segoe UI",sans-serif}
    .page{width:min(1250px,calc(100% - 36px));min-height:100vh;margin:auto;padding:16px 0 36px;display:flex;flex-direction:column}.back{align-self:flex-start;display:flex;align-items:center;justify-content:center;gap:12px;width:280px;min-height:64px;padding:10px 22px;border-radius:999px;background:#fff;color:var(--ink);font-size:1.15rem;line-height:1.1;text-align:center;text-decoration:none;box-shadow:0 8px 17px #145ca744;transition:.16s}.back:hover{transform:translateY(-2px)}.back:focus-visible,.button:focus-visible{outline:4px solid #f5d47c;outline-offset:4px}
    .lesson26-stage{position:relative;flex:1;min-height:700px;margin:clamp(38px,10vh,100px) 0 0;padding:clamp(38px,5vw,64px) clamp(22px,5vw,72px) 34px;border:2px solid #ffffffaa;border-radius:42px;background:#ffffff63;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 18px 45px #1e5b7a35;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:filter .2s,opacity .2s}.lesson26-stage.is-waiting{filter:blur(2px);opacity:.58;pointer-events:none}
    #app{width:100%}.eyebrow{width:max-content;max-width:100%;margin:0 auto 18px;padding:11px 28px;border-radius:999px;background:#277f82;color:#fff;font-size:clamp(.82rem,1.25vw,1rem);font-weight:900;letter-spacing:.06em;box-shadow:0 7px 16px #277f8244}.title{margin:0;font-size:clamp(2.6rem,5vw,4.5rem);line-height:1.08;font-weight:900}.instruction{max-width:850px;margin:18px auto 0;color:var(--muted);font-size:clamp(1rem,1.5vw,1.25rem);line-height:1.45}
    .lesson26-content{width:min(100%,1050px);margin:clamp(22px,3.5vh,42px) auto 0}.label{color:#527585;font-size:clamp(.82rem,1.15vw,1rem);font-weight:900;letter-spacing:.08em;text-transform:uppercase}.word{margin:12px 0;font-size:clamp(4.5rem,8vw,7rem);font-weight:900;line-height:1.05}.status{min-height:2.4em;margin:12px auto;color:var(--muted);font-size:clamp(.95rem,1.4vw,1.15rem);font-weight:700}.status.bad{color:var(--bad)}.status.good{color:#287b4c}.actions{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-width:min(310px,42vw);min-height:72px;border:0;border-radius:999px;background:var(--teal);box-shadow:0 7px 0 var(--teal-dark),0 12px 24px #187b7a40;color:#fff;padding:16px 24px;font:inherit;font-size:clamp(1rem,1.8vw,1.45rem);font-weight:900;cursor:pointer;transition:.16s}.button.secondary{background:#fffffff0;color:var(--teal-dark);border:4px solid var(--line);box-shadow:0 6px 0 #b7d6dc,0 10px 20px #187b7a20}.button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}.button:disabled{opacity:.65;cursor:wait}
    .word-bank{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:25px auto}.word-chip{border:2px solid #78969b;border-radius:14px;background:#e5eeee;color:#173f50;padding:12px 24px;font:inherit;font-size:clamp(1.1rem,1.8vw,1.45rem);font-weight:900;cursor:pointer}.word-chip-active{outline:4px solid #f2c45d}.word-chip-done{opacity:.55}.prompt{font-size:clamp(1.1rem,1.8vw,1.4rem);font-weight:800;color:var(--muted)}.sentence{max-width:980px;margin:20px auto 26px;font-size:clamp(1.5rem,3vw,2.25rem);line-height:2.2}.blank{display:inline-flex;vertical-align:middle;min-width:115px;min-height:48px;margin:0 7px;border:0;border-bottom:3px solid var(--ink);border-radius:8px 8px 0 0;background:#f0f6f5;color:var(--ink);align-items:center;justify-content:center;font:inherit;font-size:.8em;font-weight:900;cursor:pointer}.blank.correct{background:#d7f2df;color:#287b4c;border-color:#287b4c}.blank.wrong{background:#f7dada}.lesson26-progress{display:flex;justify-content:center;gap:12px;margin:clamp(22px,3vh,34px) auto 0}.lesson26-step{display:grid;place-items:center;width:42px;height:42px;border:3px solid #e2e8e8;border-radius:50%;background:#ffffffe8;color:#55727e;font-weight:900}.lesson26-step.active{border-color:var(--gold);background:#f4c866;color:#6c511e;box-shadow:0 0 0 4px #ffffffaa}.lesson26-step.done{border-color:#53ae83;background:#53ae83;color:#fff}.lesson26-complete-message{width:min(100%,980px);min-height:420px;display:grid;align-content:center;margin:auto;color:#287b4c;font-size:clamp(1.5rem,3vw,2.2rem);font-weight:900}
    .lesson26-start-backdrop{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:#e7f7f7c9;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}.lesson26-start-backdrop[hidden]{display:none}.lesson26-start-modal{width:min(500px,calc(100vw - 36px));padding:36px 34px 34px;border:2px solid #ffffffd9;border-radius:30px;background:#fffffff3;box-shadow:0 22px 60px #173f6325;text-align:center}.lesson26-start-label{margin:0 0 18px;color:#277f82;font-size:1rem;font-weight:900;letter-spacing:.08em}.lesson26-start-title{margin:0 0 14px;color:#183e63;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;line-height:1.16}.lesson26-start-description{margin:0 0 26px;color:var(--muted);font-size:1.02rem;line-height:1.4}.lesson26-start-actions{display:grid;gap:14px}.lesson26-start-actions button{width:100%;min-height:64px;padding:14px 20px;border:0;border-radius:999px;font:inherit;font-size:1.15rem;font-weight:900;cursor:pointer}.lesson26-start-button{background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--teal-dark)}.lesson26-later-button{border:3px solid var(--line)!important;background:#fff;color:var(--teal-dark);box-shadow:0 4px 0 #b7d6dc}
    @media(max-width:800px){.page{width:min(100% - 24px,680px);padding-top:12px}.lesson26-stage{min-height:0;margin-top:28px;padding:34px 18px 26px;border-radius:30px}.button{min-width:min(270px,44vw)}.lesson26-complete-message{min-height:55vh}}
    @media(max-width:480px){.back{width:245px;min-height:58px;font-size:1rem}.lesson26-stage{padding:28px 12px 20px}.lesson26-start-modal{padding:30px 22px 26px}.eyebrow{padding:9px 15px}.actions{gap:12px}.button{width:100%;min-width:0;min-height:62px}.lesson26-step{width:34px;height:34px;font-size:.9rem}.sentence{line-height:2}.blank{min-width:90px}}
  </style>
  <style>
    .back:focus-visible,.button:focus-visible,.lesson26-start-actions button:focus-visible,.word-chip:focus-visible,.blank:focus-visible{outline:3px solid var(--line);outline-offset:3px}
    .word-chip-active{outline:0;border-color:var(--teal);box-shadow:0 0 0 2px var(--line)}
    .word-chip{transition:transform .16s,background .16s,box-shadow .16s}
    .word-chip:hover:not(:disabled){transform:translateY(-2px);background:#f4d26d;box-shadow:0 5px 0 #d1a83a}
    .blank{transition:transform .16s,background .16s,box-shadow .16s}
    .blank:hover:not(.correct){transform:translateY(-2px);background:#fff;box-shadow:0 3px 8px #187b7a20}
    .lesson26-start-actions button{transition:transform .16s,filter .16s,box-shadow .16s}
    .lesson26-start-actions button:hover{transform:translateY(-2px);filter:brightness(1.04)}
    .lesson26-start-actions button:active{transform:translateY(2px)}
  </style>
</head>
<body>
  <main class="page"><a class="back" id="lesson26-back" href="{% url 'assessment' %}"><span aria-hidden="true">←</span><span>Back to My Lessons</span></a><section class="lesson26-stage is-waiting" id="lesson26-stage"><div id="app" aria-live="polite"></div></section></main>
  <div class="lesson26-start-backdrop" id="lesson26-start" role="dialog" aria-modal="true" aria-labelledby="lesson26-start-title"><div class="lesson26-start-modal"><p class="lesson26-start-label">SESSION 10 · LESSON 26 · ACTIVITY 2</p><h2 class="lesson26-start-title" id="lesson26-start-title">FILL IN THE BLANKS</h2><p class="lesson26-start-description">Read the words, then fill in the blanks.</p><div class="lesson26-start-actions"><button class="lesson26-start-button" id="lesson26-start-button" type="button">START</button><button class="lesson26-later-button" id="lesson26-later-button" type="button">NOT NOW</button></div></div></div>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script src="{% static 'pabasa_app/js/prescribed_fill_blank_lesson26_activity2.js' %}" defer></script>
  <script>(()=>{const modal=document.getElementById('lesson26-start'),stage=document.getElementById('lesson26-stage'),start=document.getElementById('lesson26-start-button');start.addEventListener('click',()=>{modal.hidden=true;stage.classList.remove('is-waiting')});start.focus()})();</script>
</body>
</html>
