{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Explorer | PABASA</title>
  <link rel="icon" href="{% static 'pabasa_app/images/pabasalogo.png' %}">
  <style>
    :root { --night:#190b42; --purple:#5d3196; --orange:#ff8a38; --sun:#ffc45b; --cream:#fffaf0; --ink:#352550; --good:#287b57; --bad:#bd4552; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; }
    body { min-height:100vh; margin:0; color:#fff8ea; font-family:"Trebuchet MS", "Segoe UI", sans-serif; overflow-x:hidden; background:linear-gradient(180deg,#150936 0,#342063 33%,#7a3d79 63%,#ef8248 100%); }
    button, a { font:inherit; }
    .sky, .sunset { position:fixed; inset:0; pointer-events:none; }
    .sky { z-index:0; overflow:hidden; mask-image:linear-gradient(#000 0 50%,transparent 84%); }
    .sky-star { position:absolute; left:var(--star-x); top:var(--star-y); width:var(--star-size); height:var(--star-size); border-radius:50%; background:var(--star-color); box-shadow:0 0 calc(var(--star-size) * 2.2) var(--star-color); opacity:var(--star-opacity); animation:star-pop .45s ease-out both; }
    @keyframes star-pop { from { opacity:0; transform:scale(.2); } to { opacity:var(--star-opacity); transform:scale(1); } }
    .sunset { inset:auto 50% -190px auto; width:min(760px,94vw); height:390px; transform:translateX(50%); border-radius:50%; background:radial-gradient(circle,#ffe9a4 0 22%,#ffb54f 23% 43%,#ff8b4c66 44% 61%,transparent 62%); filter:blur(1px); }
    .app { position:relative; z-index:1; display:grid; grid-template-rows:auto minmax(0,1fr); min-height:100vh; width:min(900px,calc(100% - 28px)); margin:auto; padding:18px 0 34px; }
    .top { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px; }
    .back { display:inline-flex; align-items:center; min-height:46px; padding:10px 15px; border:2px solid #ffffff4a; border-radius:16px; background:#281553c9; color:#fff; font-weight:900; text-decoration:none; box-shadow:0 5px 0 #14082f; }
    .logo { height:44px; justify-self:center; filter:drop-shadow(0 4px 8px #0c061f); }
    .badge { justify-self:end; padding:9px 14px; border:2px solid #ffd98c; border-radius:999px; background:#ff9b3c; color:#33134d; font-weight:900; }
    .activity-wrap { display:grid; place-items:center; min-height:0; padding:24px 0 8px; }
    .card { width:min(760px,100%); padding:clamp(24px,5vw,46px); border:3px solid #ffc26c; border-radius:32px; background:#fffaf0f5; color:var(--ink); box-shadow:0 10px 0 #d96b42,0 26px 56px #1b0a3d78; text-align:center; }
    .card-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; color:#74546d; font-size:.8rem; font-weight:900; letter-spacing:.06em; text-transform:uppercase; }
    .set-name { min-width:0; overflow:hidden; text-align:left; text-overflow:ellipsis; white-space:nowrap; }
    .progress-count { flex:0 0 auto; color:#63358f; }
    .track { height:12px; margin:0 0 28px; overflow:hidden; border:2px solid #e4c4d1; border-radius:999px; background:#f0e3ea; }
    .fill { width:0; height:100%; background:linear-gradient(90deg,#ff943f,#ffce5d); transition:width .35s ease; }
    .intro-icon { display:grid; place-items:center; width:86px; height:86px; margin:0 auto 18px; border:3px solid #ffbf69; border-radius:50%; background:linear-gradient(145deg,#fff2bc,#f6ddff); color:#5d3196; font-size:2.8rem; box-shadow:0 7px 0 #e7c1a0; }
    .intro h1, .complete h2, .error h2 { margin:0; color:#4f287d; font-size:clamp(2rem,5vw,3.2rem); line-height:1.06; }
    .intro p { max-width:560px; margin:16px auto 24px; color:#624d63; font-size:clamp(1.08rem,2.5vw,1.28rem); font-weight:700; line-height:1.55; }
    .rule-list { display:grid; gap:10px; max-width:550px; margin:0 auto 26px; text-align:left; }
    .rule { display:flex; gap:11px; align-items:flex-start; padding:12px 14px; border:2px solid #ead5bf; border-radius:17px; background:#fff; color:#59465a; font-weight:800; line-height:1.35; }
    .rule b { display:grid; place-items:center; flex:0 0 27px; width:27px; height:27px; border-radius:50%; background:#6c3b9d; color:#fff; font-size:.9rem; }
    .start-activity, .action { display:inline-flex; align-items:center; justify-content:center; min-height:58px; padding:13px 28px; border:0; border-radius:18px; background:linear-gradient(135deg,#7137a7,#f17d42); color:#fff; font-size:1.15rem; font-weight:1000; text-decoration:none; cursor:pointer; box-shadow:0 6px 0 #48206f; }
    .start-activity:focus-visible, .listen:focus-visible, .choice:focus-visible { outline:4px solid #ffb34e; outline-offset:3px; }
    .listen { display:flex; align-items:center; justify-content:center; gap:9px; width:min(390px,100%); min-height:54px; margin:0 auto 14px; border:2px solid #7644ad; border-radius:17px; background:linear-gradient(135deg,#fff1c6,#efddff 58%,#ffd49e); color:#4b207f; font-weight:900; cursor:pointer; box-shadow:0 5px 0 #c49acb; }
    .listen[aria-busy="true"] { opacity:.65; }
    .word { color:#542681; font-size:clamp(3.1rem,9vw,5.8rem); font-weight:1000; letter-spacing:.01em; text-shadow:0 3px 0 #ffd396; }
    .sentence { max-width:640px; margin:12px auto 20px; color:#4d3d51; font-size:clamp(1.08rem,2.6vw,1.38rem); font-weight:700; line-height:1.55; }
    .prompt { margin:0 0 14px; color:#715f78; font-weight:900; }
    .choices { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .choice { position:relative; min-height:106px; padding:15px; overflow:hidden; border:3px solid #d8c5e5; border-radius:21px; background:linear-gradient(145deg,#fff,#fff7e7); color:var(--ink); font-size:1.05rem; font-weight:900; cursor:pointer; transition:.16s ease; }
    .choice::after { content:"✦"; position:absolute; right:10px; top:5px; color:#ffc15a88; font-size:1.6rem; }
    .choice:hover { transform:translateY(-4px) rotate(-1deg); border-color:#7a48ba; box-shadow:0 7px 0 #e4d5ec,0 11px 20px #67348a24; }
    .choice.correct { border-color:var(--good); background:#e5f8ed; color:#1b6343; }
    .choice.wrong { border-color:var(--bad); background:#fff0f0; color:#96353f; }
    .feedback { min-height:30px; margin:18px 0 0; font-size:1.1rem; font-weight:900; }
    .reward-stars { min-height:38px; margin:-5px 0 12px; color:#f5a23d; font-size:1.7rem; letter-spacing:4px; }
    .saving, .complete, .error { padding:20px 6px; }
    .saving .reward-stars, .complete .reward-stars { font-size:2.2rem; }
    .score { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; max-width:540px; margin:22px auto; }
    .score div { padding:16px; border:2px solid #e4c7ab; border-radius:18px; background:#fff; }
    .score strong { display:block; color:#5c2d89; font-size:1.7rem; }
    .retry { margin-right:9px; background:#ef7f42; box-shadow:0 6px 0 #a8482b; }
    @media (max-width:680px) { .app { width:calc(100% - 18px); padding-top:10px; } .back { min-height:40px; padding:9px 12px; } .back span { display:none; } .logo { height:38px; } .badge { padding:8px 11px; font-size:.8rem; } .card { border-radius:26px; } .choices { grid-template-columns:1fr; } .choice { min-height:68px; } .activity-wrap { padding-top:12px; } }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div><div class="sunset" aria-hidden="true"></div>
  <main class="app">
    <header class="top"><a class="back" href="{% url 'assessment' %}" aria-label="Back to activities">← <span>Activities</span></a><img class="logo" src="{% static 'pabasa_app/images/pabasalogo.png' %}" alt="PABASA"><span class="badge" id="languageBadge"></span></header>
    <section class="activity-wrap"><section class="card" id="activityCard" aria-live="polite"></section></section>
  </main>
  {{ word_meaning_activity|json_script:"word-meaning-activity-data" }}
  <script>
  (() => {
    'use strict';
    const node = document.getElementById('word-meaning-activity-data');
    const data = node ? JSON.parse(node.textContent) : {};
    const items = Array.isArray(data.items) ? data.items.filter(item => item && typeof item === 'object') : [];
    const filipino = String(data.language || '').toLowerCase().startsWith('fil');
    const copy = filipino ? {
      introTitle:'Handa na bang maghanap ng kahulugan?', introButton:'Simulan Na', listen:'Pakinggan ang salita', prompt:'Ano ang kahulugan ng salita?',
      rules:['Basahin ang salita at ang pangungusap na gabay.','Piliin ang kahulugan na pinakamalapit sa salita.','Kung mali ang sagot, subukan muli.'],
      correct:'Tama! Mahusay!', wrong:'Subukan muli. Basahin ang pangungusap na gabay.', done:'Naitala ang iyong gawain!', score:'Tamang sagot sa unang pagsubok', mastered:'Mga salitang natutuhan', back:'Bumalik sa mga Gawain', saving:'Itinatala ang iyong resulta…', saveError:'Hindi naitala ang resulta.', retry:'Subukang Itala Muli', audioError:'Hindi available ang malinaw na audio ngayon.', unavailable:'Hindi available ang nilalaman ng gawain.'
    } : {
      introTitle:'Ready to explore word meanings?', introButton:'Let’s Start', listen:'Listen to the word', prompt:'What does this word mean?',
      rules:['Read the word and the clue sentence.','Choose the meaning that best matches the word.','If your answer is not correct, try again.'],
      correct:'Correct! Great thinking!', wrong:'Try again. Read the clue sentence.', done:'Your activity is recorded!', score:'Correct on the first try', mastered:'Words mastered', back:'Back to Activities', saving:'Saving your result…', saveError:'Your result was not saved.', retry:'Try Saving Again', audioError:'Clear audio is unavailable right now.', unavailable:'Activity content is unavailable.'
    };
    const el = id => document.getElementById(id);
    const card = el('activityCard');
    const backUrl = document.querySelector('.back').href;
    const sky = document.querySelector('.sky');
    const answers = [];
    let index = 0, locked = false, activeAudio = null, startedAt = 0, correctAnswers = 0;
    const csrf = () => (document.cookie.match(/(?:^|; )csrftoken=([^;]+)/) || [])[1] || '';
    const base64Blob = (value, type) => { const bytes = atob(value), array = new Uint8Array(bytes.length); for (let i = 0; i < bytes.length; i += 1) array[i] = bytes.charCodeAt(i); return new Blob([array], { type:type || 'audio/mpeg' }); };
    function addSkyStars(count) { if (!sky) return; for (let i = 0; i < count; i += 1) { const star = document.createElement('span'); const size = (.7 + Math.pow(Math.random(), .55) * 7.2).toFixed(2); star.className = 'sky-star'; star.style.setProperty('--star-x', `${(Math.random() * 96 + 2).toFixed(2)}%`); star.style.setProperty('--star-y', `${(Math.random() * 60 + 2).toFixed(2)}%`); star.style.setProperty('--star-size', `${size}px`); star.style.setProperty('--star-opacity', (Math.random() * .55 + .35).toFixed(2)); star.style.setProperty('--star-color', Math.random() > .62 ? '#ffd77a' : '#fff'); sky.appendChild(star); } }
    function topDetails() { const details = document.createElement('div'); details.className = 'card-top'; const set = document.createElement('span'); set.className = 'set-name'; set.textContent = [data.assigned_week_display, data.reading_set].filter(Boolean).join(' • ') || (filipino ? 'Paglinang ng Talasalitaan' : 'Vocabulary Development'); const progress = document.createElement('span'); progress.className = 'progress-count'; progress.id = 'progressText'; details.append(set, progress); return details; }
    function addProgress(container) { const track = document.createElement('div'); track.className = 'track'; track.setAttribute('aria-hidden', 'true'); const fill = document.createElement('div'); fill.className = 'fill'; fill.id = 'progressFill'; track.appendChild(fill); container.append(track); }
    function renderIntro() { card.replaceChildren(); const intro = document.createElement('div'); intro.className = 'intro'; const icon = document.createElement('div'); icon.className = 'intro-icon'; icon.textContent = '✦'; const title = document.createElement('h1'); title.textContent = data.title || copy.introTitle; const message = document.createElement('p'); message.textContent = copy.introTitle; const rules = document.createElement('div'); rules.className = 'rule-list'; copy.rules.forEach((rule, number) => { const row = document.createElement('div'); row.className = 'rule'; const badge = document.createElement('b'); badge.textContent = String(number + 1); const text = document.createElement('span'); text.textContent = rule; row.append(badge, text); rules.appendChild(row); }); const button = document.createElement('button'); button.type = 'button'; button.className = 'start-activity'; button.textContent = copy.introButton; button.onclick = () => { startedAt = Date.now(); renderQuestion(); }; intro.append(icon, title, message, rules, button); card.appendChild(intro); }
    async function playNarration(text) { const button = el('listenButton'); if (activeAudio) { activeAudio.pause(); activeAudio = null; } button.disabled = true; button.setAttribute('aria-busy', 'true'); try { const form = new FormData(); form.append('target_text', text); form.append('mode', 'word'); form.append('language', data.language || ''); form.append('material_id', data.material_id || data.id || ''); const response = await fetch(data.tts_url, { method:'POST', credentials:'same-origin', headers:{'X-CSRFToken':csrf()}, body:form }); const result = await response.json(); if (!response.ok || !result.success) throw new Error(); const url = URL.createObjectURL(base64Blob(result.audio_content, result.mime_type)); activeAudio = new Audio(url); activeAudio.onended = () => { URL.revokeObjectURL(url); activeAudio = null; }; await activeAudio.play(); } catch (error) { const feedback = el('feedback'); if (feedback) { feedback.textContent = copy.audioError; feedback.style.color = 'var(--bad)'; } } finally { button.disabled = false; button.removeAttribute('aria-busy'); } }
    function renderQuestion() { const item = items[index]; locked = false; if (!item) { saveResult(); return; } card.replaceChildren(topDetails()); addProgress(card); const listen = document.createElement('button'); listen.type = 'button'; listen.className = 'listen'; listen.id = 'listenButton'; listen.textContent = '🔊 ' + copy.listen; const word = document.createElement('div'); word.className = 'word'; word.textContent = String(item.word || ''); const sentence = document.createElement('p'); sentence.className = 'sentence'; sentence.textContent = String(item.sentence || ''); const prompt = document.createElement('p'); prompt.className = 'prompt'; prompt.textContent = copy.prompt; const choices = document.createElement('div'); choices.className = 'choices'; choices.id = 'choices'; const feedback = document.createElement('p'); feedback.className = 'feedback'; feedback.id = 'feedback'; const reward = document.createElement('div'); reward.className = 'reward-stars'; reward.id = 'rewardStars'; reward.setAttribute('aria-hidden', 'true'); card.append(listen, word, sentence, prompt, choices, feedback, reward); el('progressText').textContent = `${index + 1} / ${items.length}`; el('progressFill').style.width = `${(index / items.length) * 100}%`; listen.onclick = () => playNarration(`${item.word || ''}. ${item.sentence || ''}`); (Array.isArray(item.choices) ? item.choices : []).forEach((choice, choiceIndex) => { const button = document.createElement('button'); button.type = 'button'; button.className = 'choice'; button.textContent = String(choice || ''); button.onclick = () => answer(button, choiceIndex, item); choices.appendChild(button); }); }
    function answer(button, choiceIndex, item) { if (locked) return; let entry = answers[index]; if (!entry) { entry = { item_index:index, first_choice_index:choiceIndex, final_choice_index:choiceIndex, attempts:0 }; answers[index] = entry; } entry.attempts += 1; entry.final_choice_index = choiceIndex; const correctIndex = Number(item.answer_index); const correct = Number.isInteger(correctIndex) && choiceIndex === correctIndex; const feedback = el('feedback'); if (!correct) { button.classList.add('wrong'); feedback.textContent = copy.wrong; feedback.style.color = 'var(--bad)'; return; } locked = true; correctAnswers += 1; const starsToAdd = 4 + Math.min(correctAnswers, 5) + (entry.attempts === 1 ? 3 : 0); addSkyStars(starsToAdd); el('rewardStars').textContent = '✦'.repeat(Math.min(starsToAdd, 10)); button.classList.add('correct'); feedback.textContent = copy.correct; feedback.style.color = 'var(--good)'; el('choices').querySelectorAll('button').forEach(choice => { choice.disabled = true; }); setTimeout(() => { index += 1; renderQuestion(); }, 850); }
    function showError(message, allowRetry) { card.replaceChildren(); const root = document.createElement('div'); root.className = 'error'; const title = document.createElement('h2'); title.textContent = copy.saveError; const text = document.createElement('p'); text.textContent = message; root.append(title, text); if (allowRetry) { const retry = document.createElement('button'); retry.type = 'button'; retry.className = 'action retry'; retry.textContent = copy.retry; retry.onclick = saveResult; root.appendChild(retry); } const back = document.createElement('a'); back.className = 'action'; back.href = backUrl; back.textContent = copy.back; root.appendChild(back); card.appendChild(root); }
    async function saveResult() { card.innerHTML = '<div class="saving"><div class="reward-stars" aria-hidden="true">✦ ✦ ✦</div><h2></h2></div>'; card.querySelector('h2').textContent = copy.saving; const body = { material_id:data.material_id || data.id, duration_seconds:Math.max(1, Math.round((Date.now() - startedAt) / 1000)), answers }; try { const response = await fetch(data.completion_url, { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json','X-CSRFToken':csrf()}, body:JSON.stringify(body) }); const result = await response.json(); if (!response.ok || !result.success) throw new Error(result.error || copy.saveError); resultView(result.result || {}); } catch (error) { showError(error.message || copy.saveError, true); } }
    function resultView(result) { const details = result.details || {}; const correct = Number(result.correct_items || details.first_try_correct || 0); const total = Number(result.items_completed || items.length); const mastered = Number(details.mastered_words || total); card.innerHTML = '<div class="complete"><div class="reward-stars" aria-hidden="true">✦ ✦ ✦</div><h2></h2><div class="score"><div><span></span><strong></strong></div><div><span></span><strong></strong></div></div><a class="action"></a></div>'; const root = card.querySelector('.complete'); root.querySelector('h2').textContent = copy.done; const scoreCards = root.querySelectorAll('.score div'); scoreCards[0].querySelector('span').textContent = copy.score; scoreCards[0].querySelector('strong').textContent = `${correct} / ${total}`; scoreCards[1].querySelector('span').textContent = copy.mastered; scoreCards[1].querySelector('strong').textContent = `${mastered} / ${total}`; const back = root.querySelector('a'); back.href = backUrl; back.textContent = copy.back; }
    el('languageBadge').textContent = filipino ? 'Filipino' : 'English';
    addSkyStars(20);
    if (data.completion && data.completion.completed) resultView(data.completion); else if (!items.length) showError(copy.unavailable, false); else renderIntro();
  })();
  </script>
</body>
</html>
