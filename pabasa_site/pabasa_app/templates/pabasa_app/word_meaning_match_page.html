{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Explorer | PABASA</title><link rel="icon" href="{% static 'pabasa_app/images/pabasalogo.png' %}">
<style>
:root{--ink:#17364a;--teal:#147d78;--dark:#075c59;--bad:#b9433e;--good:#21864d}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;background:radial-gradient(circle at 12% 10%,#fff4b9 0 8%,transparent 9%),radial-gradient(circle at 90% 12%,#c8f1ed 0 9%,transparent 10%),linear-gradient(155deg,#eefbf8,#fff9e9 58%,#e9f6ff)}button,a{font:inherit}.app{width:min(980px,calc(100% - 28px));margin:auto;padding:20px 0 34px}.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;margin-bottom:18px}.back{display:inline-flex;align-items:center;gap:7px;min-height:48px;padding:10px 16px;border:2px solid #b9d8d5;border-radius:16px;background:#fff;color:var(--dark);font-weight:900;text-decoration:none;box-shadow:0 4px 0 #cfe4e1}.logo{height:48px;justify-self:center}.language{padding:9px 14px;border:2px solid #f4d66f;border-radius:999px;background:#fff4c7;color:#765500;font-weight:900}.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;padding:24px 28px;border:3px solid #efbd37;border-radius:28px;background:linear-gradient(130deg,#fff2a7,#ffd98e);box-shadow:0 8px 0 #e6c46d}.eyebrow{margin:0 0 5px;color:#7f5a00;font-size:.8rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(1.65rem,4vw,2.5rem);line-height:1.05}.hero p{margin:8px 0 0;font-weight:700}.mascot{width:clamp(90px,14vw,135px);filter:drop-shadow(0 8px 5px #8964002c)}.progress{display:flex;align-items:center;gap:14px;margin:22px 4px 13px;font-weight:900}.track{height:13px;flex:1;overflow:hidden;border:2px solid #bddbd7;border-radius:999px;background:#dcecea}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),#45bcae);transition:width .3s}.card{padding:clamp(22px,5vw,42px);border:3px solid #9dd5cf;border-radius:30px;background:#fffffff5;box-shadow:0 9px 0 #b8ded9,0 18px 34px #234b5b1b}.listen{display:flex;align-items:center;justify-content:center;gap:9px;width:min(390px,100%);min-height:52px;margin:0 auto 14px;border:0;border-radius:16px;background:#e4f7f4;color:var(--dark);font-weight:900;cursor:pointer}.listen:focus-visible{outline:3px solid #68bdb5}.word{text-align:center;color:var(--dark);font-size:clamp(2.7rem,8vw,5rem);font-weight:1000}.sentence{max-width:700px;margin:10px auto 25px;text-align:center;font-size:clamp(1.05rem,2.6vw,1.35rem);line-height:1.55;font-weight:700}.prompt{text-align:center;margin:0 0 14px;color:#607887;font-weight:800}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.choice{min-height:112px;padding:16px;border:3px solid #d9e9e7;border-radius:21px;background:#fbfffe;color:var(--ink);font-weight:900;font-size:1.05rem;cursor:pointer;transition:.15s}.choice:hover,.choice:focus-visible{transform:translateY(-2px);border-color:var(--teal);outline:none;box-shadow:0 6px 0 #d4eae7}.choice.correct{border-color:var(--good);background:#e4f8ea;color:#145d34}.choice.wrong{border-color:var(--bad);background:#fff0ef;color:#8c302d}.feedback{min-height:31px;margin:18px 0 0;text-align:center;font-size:1.13rem;font-weight:900}.empty,.complete{text-align:center;padding:35px 10px}.complete h2{font-size:clamp(2rem,5vw,3rem);margin:0}.complete a{display:inline-flex;margin-top:18px;padding:13px 22px;border-radius:16px;background:var(--teal);color:#fff;font-weight:900;text-decoration:none}.stars{font-size:2.5rem;letter-spacing:7px;margin-bottom:8px}@media(max-width:700px){.app{width:calc(100% - 18px);padding-top:10px}.top{grid-template-columns:auto 1fr}.logo{justify-self:end;height:39px}.language{grid-column:1/-1;justify-self:center}.hero{padding:20px}.mascot{width:82px}.choices{grid-template-columns:1fr}.choice{min-height:72px}.card{border-radius:24px}.back span{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="app"><header class="top"><a class="back" href="{% url 'assessment' %}" aria-label="Back to activities">← <span>Activities</span></a><img class="logo" src="{% static 'pabasa_app/images/pabasalogo.png' %}" alt="PABASA"><span class="language" id="languageBadge"></span></header><section class="hero"><div><p class="eyebrow" id="setName"></p><h1 id="activityTitle">Word Explorer</h1><p id="instruction"></p></div><img class="mascot" src="{% static 'pabasa_app/images/footer-mascot.png' %}" alt="PABASA reading buddy"></section><div class="progress"><span id="progressText">Ready</span><div class="track" aria-hidden="true"><div class="fill" id="progressFill"></div></div></div><section class="card" id="activityCard" aria-live="polite"><button class="listen" id="listenButton" type="button">🔊 <span id="listenLabel"></span></button><div class="word" id="word"></div><p class="sentence" id="sentence"></p><p class="prompt" id="choicePrompt"></p><div class="choices" id="choices"></div><p class="feedback" id="feedback" role="status"></p></section></main>
{{ word_meaning_activity|json_script:"word-meaning-activity-data" }}
<script>(()=>{'use strict';const node=document.getElementById('word-meaning-activity-data'),data=node?JSON.parse(node.textContent):{},items=Array.isArray(data.items)?data.items.filter(x=>x&&typeof x==='object'):[],fil=String(data.language||'').toLowerCase().startsWith('fil'),copy=fil?{listen:'Pakinggan ang salita',prompt:'Ano ang kahulugan ng salita?',correct:'Tama! Mahusay ang iyong pag-unawa!',wrong:'Subukan muli. Basahin ang pangungusap na gabay.',done:'Mahusay!',doneText:'Natutuhan mo ang lahat ng salita sa set na ito.',back:'Bumalik sa mga Gawain',empty:'Walang salitang nakalagay sa gawaing ito.'}:{listen:'Listen to the word',prompt:'What does this word mean?',correct:'Correct! Great thinking!',wrong:'Try again. Read the clue sentence.',done:'Great work!',doneText:'You learned every word in this set.',back:'Back to Activities',empty:'This activity does not have any words yet.'},el=id=>document.getElementById(id);let index=0,locked=false;el('activityTitle').textContent=data.title||'Word Explorer';el('instruction').textContent=data.instructions||(fil?'Basahin ang salita at piliin ang kahulugan nito.':'Read the word and choose its meaning.');el('languageBadge').textContent=fil?'Filipino':'English';el('setName').textContent=[data.assigned_week_display,data.reading_set].filter(Boolean).join(' • ')||'Vocabulary Development';el('listenLabel').textContent=copy.listen;el('choicePrompt').textContent=copy.prompt;const speak=text=>{if(!('speechSynthesis'in window)||!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=fil?'fil-PH':'en-PH';u.rate=.78;speechSynthesis.speak(u)},finish=()=>{el('progressText').textContent=`${items.length} / ${items.length}`;el('progressFill').style.width='100%';el('activityCard').innerHTML='<div class="complete"><div class="stars" aria-hidden="true">⭐ ⭐ ⭐</div><h2></h2><p></p><a href="{% url 'assessment' %}"></a></div>';const r=el('activityCard');r.querySelector('h2').textContent=copy.done;r.querySelector('p').textContent=copy.doneText;r.querySelector('a').textContent=copy.back};function render(){const item=items[index];locked=false;if(!item){if(items.length)finish();else{el('activityCard').innerHTML='<div class="empty"><h2></h2></div>';el('activityCard').querySelector('h2').textContent=copy.empty;el('progressText').textContent='0 / 0'}return}el('progressText').textContent=`${index+1} / ${items.length}`;el('progressFill').style.width=`${index/items.length*100}%`;el('word').textContent=String(item.word||'');el('sentence').textContent=String(item.sentence||'');el('feedback').textContent='';el('listenButton').onclick=()=>speak(`${item.word||''}. ${item.sentence||''}`);const root=el('choices');root.replaceChildren();(Array.isArray(item.choices)?item.choices:[]).forEach((choice,n)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=String(choice??'');b.onclick=()=>answer(b,n,item);root.appendChild(b)})}function answer(button,n,item){if(locked)return;const correct=Number(item.answer_index),ok=Number.isInteger(correct)&&n===correct;if(!ok){button.classList.add('wrong');el('feedback').textContent=copy.wrong;el('feedback').style.color='var(--bad)';return}locked=true;button.classList.add('correct');el('feedback').textContent=copy.correct;el('feedback').style.color='var(--good)';el('choices').querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(()=>{index++;render()},900)}render()})();</script></body></html>
