{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Explorer | PABASA</title><link rel="icon" href="{% static 'pabasa_app/images/pabasalogo.png' %}">
<style>
:root{--night:#241454;--purple:#5d3196;--violet:#7a48ba;--orange:#ff8a38;--sun:#ffc45b;--cream:#fff8ea;--ink:#352550;--good:#2f8d62;--bad:#c94f5b}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--cream);font-family:"Trebuchet MS","Segoe UI",sans-serif;background:linear-gradient(180deg,#160d3e 0,#342063 26%,#744078 58%,#f1844c 100%);overflow-x:hidden}button,a{font:inherit}.sky{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 0 1.4px,transparent 1.8px),radial-gradient(circle,#ffd77a 0 1px,transparent 1.5px);background-size:71px 71px,113px 113px;background-position:8px 11px,37px 24px;mask-image:linear-gradient(#000 0 36%,transparent 70%);opacity:.85}.sunset{position:fixed;left:50%;bottom:-170px;width:min(720px,90vw);height:360px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#ffe9a4 0 22%,#ffb54f 23% 43%,#ff8b4c66 44% 60%,transparent 61%);filter:blur(1px);pointer-events:none}.app{position:relative;z-index:1;width:min(980px,calc(100% - 28px));margin:auto;padding:18px 0 42px}.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;margin-bottom:16px}.back{display:inline-flex;align-items:center;gap:7px;min-height:48px;padding:10px 16px;border:2px solid #ffffff4a;border-radius:16px;background:#281553c9;color:#fff;font-weight:900;text-decoration:none;box-shadow:0 5px 0 #14082f}.logo{height:47px;justify-self:center;filter:drop-shadow(0 4px 8px #0c061f)}.badge{padding:9px 14px;border:2px solid #ffd98c;border-radius:999px;background:#ff9b3c;color:#33134d;font-weight:900}.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:22px;padding:22px 28px;border:2px solid #ffffff47;border-radius:28px;background:linear-gradient(120deg,#32175ddd,#703b8cdd 62%,#ef7c4bd9);box-shadow:0 9px 0 #190b3c,0 20px 50px #12062977;backdrop-filter:blur(8px)}.eyebrow{margin:0 0 5px;color:#ffd584;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(1.7rem,4vw,2.6rem);line-height:1}.hero p{max-width:650px;margin:9px 0 0;color:#fff7e4;font-weight:700}.mascot{width:clamp(86px,14vw,132px);filter:drop-shadow(0 8px 7px #1b0c38)}.progress{display:flex;align-items:center;gap:14px;margin:21px 4px 13px;font-weight:900}.track{height:14px;flex:1;overflow:hidden;border:2px solid #ffffff55;border-radius:999px;background:#25134f}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff973f,#ffd264);transition:width .35s}.card{padding:clamp(22px,5vw,42px);border:3px solid #ffc26c;border-radius:30px;background:#fff9edfa;color:var(--ink);box-shadow:0 9px 0 #d96b42,0 24px 54px #1b0a3d78}.listen{display:flex;align-items:center;justify-content:center;gap:9px;width:min(400px,100%);min-height:54px;margin:0 auto 13px;border:2px solid #7644ad;border-radius:17px;background:#eee0ff;color:#4b207f;font-weight:900;cursor:pointer}.listen[aria-busy="true"]{opacity:.65}.listen:focus-visible,.choice:focus-visible{outline:4px solid #ffb34e;outline-offset:2px}.word{text-align:center;color:#522680;font-size:clamp(2.8rem,8vw,5.1rem);font-weight:1000}.sentence{max-width:720px;margin:10px auto 23px;text-align:center;font-size:clamp(1.08rem,2.6vw,1.4rem);line-height:1.55;font-weight:700}.prompt{text-align:center;margin:0 0 14px;color:#705f7c;font-weight:900}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.choice{min-height:112px;padding:16px;border:3px solid #d8c5e5;border-radius:21px;background:#fff;color:var(--ink);font-weight:900;font-size:1.05rem;cursor:pointer;transition:.15s}.choice:hover{transform:translateY(-2px);border-color:#7a48ba;box-shadow:0 6px 0 #e4d5ec}.choice.correct{border-color:var(--good);background:#e5f8ed;color:#1b6343}.choice.wrong{border-color:var(--bad);background:#fff0f0;color:#96353f}.feedback{min-height:31px;margin:18px 0 0;text-align:center;font-size:1.13rem;font-weight:900}.saving,.complete,.error{text-align:center;padding:32px 10px}.complete h2,.error h2{margin:8px 0;font-size:clamp(2rem,5vw,3rem)}.stars{font-size:2.4rem;letter-spacing:6px}.score{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:540px;margin:22px auto}.score div{padding:16px;border:2px solid #e4c7ab;border-radius:18px;background:#fff}.score strong{display:block;color:#5c2d89;font-size:1.7rem}.action{display:inline-flex;align-items:center;justify-content:center;min-height:52px;margin:8px;padding:11px 22px;border:0;border-radius:16px;background:#65359b;color:#fff;font-weight:900;text-decoration:none;cursor:pointer;box-shadow:0 5px 0 #371967}.retry{background:#ef7f42;box-shadow:0 5px 0 #a8482b}@media(max-width:700px){.app{width:calc(100% - 18px);padding-top:10px}.top{grid-template-columns:auto 1fr}.logo{justify-self:end;height:39px}.badge{grid-column:1/-1;justify-self:center}.hero{padding:18px}.mascot{width:78px}.choices{grid-template-columns:1fr}.choice{min-height:70px}.card{border-radius:24px}.back span{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style>
/* Sunset-glass controls give every question a consistent, playful sky theme. */
.listen{background:linear-gradient(135deg,#fff1c6,#efddff 58%,#ffd49e);box-shadow:0 5px 0 #c49acb}.choice{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,#fff,#fff7e7)}.choice::before{content:"✦";position:absolute;z-index:-1;right:11px;top:5px;color:#ffc15a88;font-size:1.8rem}.choice:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 7px 0 #e4d5ec,0 11px 20px #67348a24}.word{filter:drop-shadow(0 3px 0 #ffd396)}
</style>
</head>
<body><div class="sky"></div><div class="sunset"></div><main class="app"><header class="top"><a class="back" href="{% url 'assessment' %}" aria-label="Back to activities">← <span>Activities</span></a><img class="logo" src="{% static 'pabasa_app/images/pabasalogo.png' %}" alt="PABASA"><span class="badge" id="languageBadge"></span></header><section class="hero"><div><p class="eyebrow" id="setName"></p><h1 id="activityTitle">Word Explorer</h1><p id="instruction"></p></div><img class="mascot" src="{% static 'pabasa_app/images/footer-mascot.png' %}" alt="PABASA reading buddy"></section><div class="progress"><span id="progressText">Ready</span><div class="track" aria-hidden="true"><div class="fill" id="progressFill"></div></div></div><section class="card" id="activityCard" aria-live="polite"><button class="listen" id="listenButton" type="button">🔊 <span id="listenLabel"></span></button><div class="word" id="word"></div><p class="sentence" id="sentence"></p><p class="prompt" id="choicePrompt"></p><div class="choices" id="choices"></div><p class="feedback" id="feedback" role="status"></p></section></main>
{{ word_meaning_activity|json_script:"word-meaning-activity-data" }}
<script>
(()=>{'use strict';
const node=document.getElementById('word-meaning-activity-data'),data=node?JSON.parse(node.textContent):{},items=Array.isArray(data.items)?data.items.filter(x=>x&&typeof x==='object'):[],fil=String(data.language||'').toLowerCase().startsWith('fil'),copy=fil?{listen:'Pakinggan ang salita',prompt:'Ano ang kahulugan ng salita?',correct:'Tama! Mahusay!',wrong:'Subukan muli. Basahin ang pangungusap na gabay.',done:'Naitala ang iyong gawain!',score:'Tamang sagot sa unang pagsubok',mastered:'Mga salitang natutuhan',back:'Bumalik sa mga Gawain',saving:'Itinatala ang iyong resulta…',saveError:'Hindi naitala ang resulta.',retry:'Subukang Itala Muli',audioError:'Hindi available ang malinaw na audio ngayon.'}:{listen:'Listen to the word',prompt:'What does this word mean?',correct:'Correct! Great thinking!',wrong:'Try again. Read the clue sentence.',done:'Your activity is recorded!',score:'Correct on the first try',mastered:'Words mastered',back:'Back to Activities',saving:'Saving your result…',saveError:'Your result was not saved.',retry:'Try Saving Again',audioError:'Clear audio is unavailable right now.'},el=id=>document.getElementById(id);let index=0,locked=false,startedAt=Date.now(),activeAudio=null,pendingSave=null;const answers=[];
const csrf=()=>document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)?.[1]||'',base64Blob=(value,type)=>{const bytes=atob(value),array=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)array[i]=bytes.charCodeAt(i);return new Blob([array],{type:type||'audio/mpeg'})};
el('activityTitle').textContent=data.title||'Word Explorer';el('instruction').textContent=data.instructions||(fil?'Basahin ang salita at piliin ang kahulugan nito.':'Read the word and choose its meaning.');el('languageBadge').textContent=fil?'Filipino':'English';el('setName').textContent=[data.assigned_week_display,data.reading_set].filter(Boolean).join(' • ')||'Vocabulary Development';el('listenLabel').textContent=copy.listen;el('choicePrompt').textContent=copy.prompt;
async function playNarration(text){const button=el('listenButton');if(activeAudio){activeAudio.pause();activeAudio=null}button.disabled=true;button.setAttribute('aria-busy','true');try{const form=new FormData();form.append('target_text',text);form.append('mode','word');form.append('language',data.language||'');form.append('material_id',data.material_id||data.id);const response=await fetch(data.tts_url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json();if(!response.ok||!result.success)throw new Error(result.error||copy.audioError);const url=URL.createObjectURL(base64Blob(result.audio_content,result.mime_type));activeAudio=new Audio(url);activeAudio.onended=()=>{URL.revokeObjectURL(url);activeAudio=null};await activeAudio.play()}catch(error){el('feedback').textContent=copy.audioError;el('feedback').style.color='var(--bad)'}finally{button.disabled=false;button.removeAttribute('aria-busy')}}
function resultView(result){const details=result.details||{},correct=Number(result.correct_items||details.first_try_correct||0),total=Number(result.items_completed||items.length),mastered=Number(details.mastered_words||total);el('progressText').textContent=`${total} / ${total}`;el('progressFill').style.width='100%';el('activityCard').innerHTML='<div class="complete"><div class="stars" aria-hidden="true">★ ★ ★</div><h2></h2><div class="score"><div><span></span><strong></strong></div><div><span></span><strong></strong></div></div><a class="action" href="{% url 'assessment' %}"></a></div>';const root=el('activityCard'),cards=root.querySelectorAll('.score div');root.querySelector('h2').textContent=copy.done;cards[0].querySelector('span').textContent=copy.score;cards[0].querySelector('strong').textContent=`${correct} / ${total}`;cards[1].querySelector('span').textContent=copy.mastered;cards[1].querySelector('strong').textContent=`${mastered} / ${total}`;root.querySelector('a').textContent=copy.back}
async function saveResult(){el('activityCard').innerHTML='<div class="saving"><div class="stars" aria-hidden="true">★ ★ ★</div><h2></h2></div>';el('activityCard').querySelector('h2').textContent=copy.saving;const body={material_id:data.material_id||data.id,duration_seconds:Math.max(1,Math.round((Date.now()-startedAt)/1000)),answers};pendingSave=body;try{const response=await fetch(data.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(body)}),result=await response.json();if(!response.ok||!result.success)throw new Error(result.error||copy.saveError);resultView(result.result||{})}catch(error){el('activityCard').innerHTML='<div class="error"><h2></h2><p></p><button class="action retry" type="button"></button><a class="action" href="{% url 'assessment' %}"></a></div>';const root=el('activityCard');root.querySelector('h2').textContent=copy.saveError;root.querySelector('p').textContent=error.message||copy.saveError;root.querySelector('button').textContent=copy.retry;root.querySelector('button').onclick=saveResult;root.querySelector('a').textContent=copy.back}}
function render(){const item=items[index];locked=false;if(!item){saveResult();return}el('progressText').textContent=`${index+1} / ${items.length}`;el('progressFill').style.width=`${index/items.length*100}%`;el('word').textContent=String(item.word||'');el('sentence').textContent=String(item.sentence||'');el('feedback').textContent='';el('feedback').style.color='';el('listenButton').onclick=()=>playNarration(`${item.word||''}. ${item.sentence||''}`);const root=el('choices');root.replaceChildren();(Array.isArray(item.choices)?item.choices:[]).forEach((choice,n)=>{const button=document.createElement('button');button.type='button';button.className='choice';button.textContent=String(choice??'');button.onclick=()=>answer(button,n,item);root.appendChild(button)})}
function answer(button,choiceIndex,item){if(locked)return;let entry=answers[index];if(!entry){entry={item_index:index,first_choice_index:choiceIndex,final_choice_index:choiceIndex,attempts:0};answers[index]=entry}entry.attempts+=1;entry.final_choice_index=choiceIndex;const correctIndex=Number(item.answer_index),ok=Number.isInteger(correctIndex)&&choiceIndex===correctIndex;if(!ok){button.classList.add('wrong');el('feedback').textContent=copy.wrong;el('feedback').style.color='var(--bad)';return}locked=true;button.classList.add('correct');el('feedback').textContent=copy.correct;el('feedback').style.color='var(--good)';el('choices').querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(()=>{index+=1;render()},850)}
if(data.completion?.completed)resultView(data.completion);else if(!items.length){el('activityCard').innerHTML='<div class="error"><h2>Activity content is unavailable.</h2><a class="action" href="{% url 'assessment' %}">Back to Activities</a></div>'}else render();
})();
</script></body></html>
