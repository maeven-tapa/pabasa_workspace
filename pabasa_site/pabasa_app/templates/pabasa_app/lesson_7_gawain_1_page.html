</head><body class="lesson-7-responsive"><main class="page"><a href="{% url 'assessment' %}">← Bumalik sa Aking Aralin</a><section id="app" class="card"></section></main>{{ lesson_7_data|json_script:"lesson-seven-data" }}<script>
const d=JSON.parse(document.getElementById('lesson-seven-data').textContent),items=d.items,total=items.length,p=d.progress,base="{% static 'pabasa_app/images/letrang_i/' %}",url="{{ lesson_7_progress_url }}",csrf=()=>document.cookie.match(/csrftoken=([^;]+)/)?.[1]||'';let index=Math.min(total,Number(p.current_index)||0),score=Number(p.correct_items)||0,circled=p.circled||[],phase='read',tries=0,listens=0,busy=false;const app=document.getElementById('app');async function save(done=false){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({activity_key:'lesson-7-gawain-1',total_items:total,current_index:index,completed_items:index,correct_items:score,activity_completed:done,state:{circled}})});if(!r.ok)throw Error('save')};function wheel(){return '<div class="wheel">'+items.map((x,n)=>{const a=n*45-90;return '<button class="item '+(n===index?'active ':'')+(circled.includes(n)?'circled':'')+'" style="left:'+(50+37*Math.cos(a*Math.PI/180))+'%;top:'+(50+37*Math.sin(a*Math.PI/180))+'%" aria-label="'+x.word+'"><img src="'+base+x.image+'" alt="'+x.word+'"></button>'}).join('')+'<div class="center">Ii</div></div>'}function render(){if(index>=total){app.innerHTML='<div class="complete"><h1>Magaling! Natapos mo ang gawain!</h1><div class="score">'+score+' / '+total+'</div><button class="done" id="done">TAPUSIN</button></div>';document.getElementById('done').onclick=async()=>{await save(true);location.href="{% url 'assessment' %}"};return}const x=items[index];app.innerHTML='<div class="head"><div><div class="eyebrow">LESSON 7 · GAWAIN 1</div><h1>Letrang Ii</h1></div><b>'+(index+1)+' / '+total+'</b></div><p>Bilugan ang larawan na nagsisimula sa tunog na /i/.</p><div class="layout"><div>'+wheel()+'</div><section class="controls"><div class="status" id="status">'+(phase==='read'?'Ano ang nasa larawan?':'Nagsisimula ba sa tunog /i/?')+'</div>'+(phase==='read'?'<button data-basahin-button class="read" id="read">'+window.BasahinButton.LABEL+'</button><button class="read" id="aloud" hidden>READ ALOUD</button>':'<div class="choices"><button class="choice" data-v="yes">OO</button><button class="choice no" data-v="no">HINDI</button></div>')+'</section></div>';if(phase==='read'){window.Basahin.bindActivity(document.getElementById('read'),record);document.getElementById('aloud').onclick=()=>{listens++;speechSynthesis?.speak(new SpeechSynthesisUtterance(x.word));if(listens>=3){document.getElementById('aloud').hidden=true;document.getElementById('read').hidden=false;phase='read-again'}}}else document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const yes=b.dataset.v==='yes';if(yes===x.starts_i){circled.push(index);score++;index++;phase='read';tries=0;listens=0;save();render()}else{tries++;status.textContent='Subukan muli.';if(tries>=3){tries=0;phase='read';render()}}})}async function record(){if(busy)return;const b=document.getElementById('read'),s=document.getElementById('status'),x=items[index];busy=true;b.disabled=true;b.textContent='Nagbabasa...';try{let stream=await window.Basahin.openMicrophone({audio:true}),chunks=[],m=null;const basahinAudio = await window.Basahin.capture({button:document.querySelector('[data-basahin-button]'),stream: stream, onRecorder: value => { m = value; }});chunks.push(basahinAudio);stream.getTracks().forEach(t=>t.stop());b.textContent='Pinoproseso...';const f=new FormData();f.append('audio',basahinAudio,basahinAudio.type.includes('ogg')?'reading.ogg':'reading.webm');f.append('target_text',x.word);f.append('language','Filipino');f.append('mode','reading');const r=await(await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:f})).json();if(r.success&&String(r.transcript||'').toLowerCase().includes(x.word.toLowerCase())){phase='classify';render()}else{tries++;s.textContent='Subukan muli. ('+tries+'/3)';if(tries>=3)document.getElementById('aloud').hidden=false;b.disabled=false;b.textContent=window.BasahinButton.LABEL}}catch(e){s.textContent='Hindi nakuha ang iyong boses. Subukan muli.';b.disabled=false;b.textContent=window.BasahinButton.LABEL}finally{busy=false}}__runWhenLessonStarted(() => render());</script></body></html>
