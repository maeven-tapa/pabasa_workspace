{% extends "pabasa_app/base_dashboard.html" %}
{% load static %}
{% block extra_head %}
<style>
.teacher-review{max-width:1200px;margin:0 auto;padding:1.5rem;display:grid;gap:1rem}.teacher-review__controls,.teacher-review__panel{background:#fff;border:1px solid #d9e7ef;border-radius:18px;padding:1rem;box-shadow:0 10px 28px rgba(16,70,110,.08)}.teacher-review__controls{display:flex;gap:.75rem;align-items:end;flex-wrap:wrap}.teacher-review__controls label{display:grid;gap:.3rem;font-weight:800;color:#10466e}.teacher-review select{min-width:240px;border:1px solid #b9cedb;border-radius:10px;padding:.6rem}.teacher-review button{border:0;border-radius:10px;padding:.65rem 1rem;font-weight:800;background:#10466e;color:#fff}.teacher-review button.secondary{background:#eaf4f9;color:#10466e}.teacher-review__rows{display:grid;gap:.7rem}.teacher-review__row{display:grid;grid-template-columns:1fr auto auto;gap:.75rem;align-items:center;border:1px solid #e0ebf0;border-radius:12px;padding:.8rem}.teacher-review__row small{display:block;color:#557080}.teacher-review__status{font-weight:800;color:#10466e}.teacher-review__artifact{background:#f7fbfd;border-radius:10px;padding:.5rem;margin-top:.5rem}.teacher-review__artifact canvas{max-width:100%;width:100%;height:150px;border:1px solid #cfe1e8;border-radius:8px;background:#fff}.teacher-review iframe{width:100%;height:620px;border:0;border-radius:12px;background:#f6fbfd}.teacher-review__message{color:#557080}@media(max-width:700px){.teacher-review__row{grid-template-columns:1fr}.teacher-review iframe{height:520px}}
</style>
{% endblock %}
{% block content %}
<main class="teacher-review" aria-labelledby="teacher-review-title">
<section class="teacher-review__controls"><div><h1 id="teacher-review-title">Prescribed activity review</h1><p class="teacher-review__message">Session 8 results are view-only. Session 9 drawings require a teacher decision.</p></div><label>Student<select id="review-student"><option value="">Choose a student</option></select></label><label>Session<select id="review-session"><option value="8">Session 8 · View results</option><option value="9">Session 9 · Manual checking</option></select></label><button id="review-load" type="button">Load activities</button></section>
<section class="teacher-review__panel"><div id="review-message" class="teacher-review__message">Choose a student to begin.</div><div id="review-rows" class="teacher-review__rows"></div><div id="review-preview"></div></section>
</main>
<script>
(()=>{const students=document.getElementById('review-student'),session=document.getElementById('review-session'),rows=document.getElementById('review-rows'),message=document.getElementById('review-message'),preview=document.getElementById('review-preview');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('{% url "get_teacher_students_api" %}').then(r=>r.json()).then(data=>(data.students||[]).forEach(s=>{const o=document.createElement('option');o.value=s.id||s.student_id;o.textContent=s.name||s.full_name||s.custom_id||`Student ${o.value}`;students.append(o)})).catch(()=>message.textContent='Unable to load the teacher roster.');function draw(canvas,strokes){const ctx=canvas.getContext('2d');for(const stroke of (strokes||[])){ctx.strokeStyle=stroke.color||'#183e63';ctx.lineWidth=stroke.width||5;ctx.lineCap='round';ctx.beginPath();(stroke.points||[]).forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}}async function load(){const id=students.value;if(!id){message.textContent='Choose a student to begin.';return}message.textContent='Loading…';rows.replaceChildren();preview.replaceChildren();const data=await fetch(`{% url "teacher_prescribed_progress" %}?student_id=${encodeURIComponent(id)}&session=${session.value}`).then(r=>r.json());if(!data.success){message.textContent=data.error||'Unable to load activity progress.';return}message.textContent=`${data.student.name} · Session ${data.session}`;(data.activities||[]).forEach(a=>{const row=document.createElement('article');row.className='teacher-review__row';row.innerHTML=`<div><strong>Lesson ${esc(a.lesson_number)} · Gawain ${esc(a.gawain_number)}</strong><small>${esc(a.title||a.activity_key)}</small>${a.artifact?`<div class="teacher-review__artifact"><canvas width="900" height="300"></canvas><div>${esc(a.artifact.text||'No written response')}</div></div>`:''}</div><span class="teacher-review__status">${esc(a.status)}</span><div><button class="secondary" data-preview>View</button>${data.session===9&&a.status==='Pending Teacher Review'?` <button data-action="retry">Retry</button> <button data-action="complete">Complete</button>`:''}</div>`;row.querySelector('[data-preview]').onclick=()=>{preview.innerHTML=`<iframe title="${esc(a.title||'Activity preview')}" src="${a.preview_url}"></iframe>`};if(a.artifact)draw(row.querySelector('canvas'),a.artifact.strokes);row.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;const token=decodeURIComponent(document.cookie.split('csrftoken=')[1]?.split(';')[0]||'');const result=await fetch('{% url "teacher_prescribed_review_action" %}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':token},body:JSON.stringify({student_id:id,activity_key:a.activity_key,action:btn.dataset.action})}).then(r=>r.json());if(!result.success)message.textContent=result.error||'Review action failed.';await load()});rows.append(row)})}document.getElementById('review-load').onclick=load;session.onchange=load;})();
</script>
{% endblock %}
