<script>(()=>{'use strict';const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),items=d.items||[],app=document.getElementById('app'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||''),norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');let saved=d.progress?.state||{},answers=Array.isArray(d.progress?.answers)?d.progress.answers.slice(0,items.length):[],index=Math.min(answers.length,items.length),phase=saved.phase==='written'?'written':'oral',oralMode=saved.oral_mode==='aloud'?'aloud':'read',readingAttempts=+saved.reading_attempts||0,aloudAttempts=+saved.aloud_attempts||0,writtenAttempts=+saved.written_attempts||0,version=+saved.state_version||0,busy=false,started=Boolean(answers.length||saved.phase==='written'||saved.reading_attempts||saved.aloud_attempts),requestId=0,stream=null;
const state=()=>({phase,oral_mode:oralMode,reading_attempts:readingAttempts,aloud_attempts:aloudAttempts,written_attempts:writtenAttempts,state_version:++version});const header=()=>`<p class="eyebrow">Session 6 · Lesson ${esc(d.lesson_number)} · Gawain ${esc(d.gawain_number)}</p><h1>${esc(d.title)}</h1><p class="instruction">${esc(d.instruction)}</p><strong>${Math.min(index+1,items.length)} / ${items.length}</strong><div class="track" aria-label="${index} sa ${items.length} natapos"><i style="width:${items.length?index/items.length*100:0}%"></i></div>`;const stop=()=>{stream?.getTracks().forEach(t=>t.stop());stream=null};const request=async(url,body)=>{const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Hindi na-save ang iyong sagot.');return j};async function save(extra={}){const token=++requestId,result=await request(d.progress_url,{answers,state:state(),current_index:index,...extra});if(token!==requestId)return null;const s=result.progress?.state||{};version=Math.max(version,+s.state_version||0);return result}function wordDisplay(stem){return esc(stem).replace(/__/g,'<span class="blank-box" aria-label="Nawawalang pantig">&nbsp;</span>')}function render(message='',kind=''){if(d.progress?.activity_completed||index>=items.length){finish();return}if(!started){const first=items[index];app.innerHTML=header()+`<div class="intro-preview"><img src="${esc(first.image_url)}" alt="${esc(first.alt_text)}"><div class="partial">${wordDisplay(first.stem)}</div><p class="hint">Bawat larawan ay babasahin muna nang malakas, bago isulat ang nawawalang pantig.</p><div class="flow"><span>1. Basahin</span><span>2. Pakinggan kung kailangan</span><span>3. Isulat ang pantig</span></div><button class="button" id="start" type="button">SIMULAN</button></div>`;document.getElementById('start').onclick=()=>{started=true;render()};return}const item=items[index],picture=`<img class="picture" src="${esc(item.image_url)}" alt="${esc(item.alt_text)}">`;if(phase==='written'){app.innerHTML=header()+picture+`<p class="hint">Magaling! Ngayon, punan ang nawawalang pantig.</p><div class="partial">${wordDisplay(item.stem)}</div><form class="answer-form" id="answerForm"><label class="visually-hidden" for="answer">Nawawalang pantig</label><input class="answer-input" id="answer" maxlength="2" inputmode="text" autocomplete="off" required aria-label="Nawawalang pantig"><button class="button" type="submit">ISUMITE</button></form><p id="status" class="status ${kind}">${esc(message)}</p>`;const input=document.getElementById('answer');input.focus();document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();submit(input.value)};return}const recovery=oralMode==='aloud';app.innerHTML=header()+picture+`<p class="hint">Basahin nang malakas ang buong salita.</p><div class="word">${esc(item.word)}</div><p class="hint">${recovery?'Pakinggan ang salita. Pagkatapos, subukan mong basahin muli.':'May tatlong pagkakataon kang magbasa.'}</p><button class="button ${recovery?'gold':''}" id="oral" type="button">${recovery?'🔊 PAKINGGAN':'🎙 SIMULAN ANG PAGBASA'}</button><p id="status" class="status ${kind}">${esc(message)}</p>`;document.getElementById('oral').onclick=()=>recovery?listen(item):read(item)}async function read(item){if(busy)return;busy=true;const token=++requestId,b=document.getElementById('oral'),status=document.getElementById('status');try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Hindi available ang mikropono sa device na ito.');b.disabled=true;b.textContent='Nagbabasa…';stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[],recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);const audio=await new Promise(resolve=>{recorder.onstop=()=>resolve(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));recorder.start();setTimeout(()=>recorder.state==='recording'&&recorder.stop(),3500)});stop();if(token!==requestId)return;b.textContent='Pinoproseso…';const form=new FormData();form.append('audio',audio,'prescribed-reading.webm');form.append('target_text',item.word);form.append('language','Filipino');form.append('mode','reading');const r=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),j=await r.json();if(token!==requestId)return;if(r.ok&&j.success&&norm(j.transcript).includes(norm(item.word))){phase='written';oralMode='read';readingAttempts=aloudAttempts=writtenAttempts=0;await save();render('Tama ang pagbasa!','good');return}readingAttempts=Math.min(3,readingAttempts+1);if(readingAttempts>=3)oralMode='aloud';await save();render(oralMode==='aloud'?'Subukan nating pakinggan ang salita.':'Subukan muli.','bad')}catch(e){if(token===requestId){status.textContent=e.message||'Hindi nakuha ang iyong boses. Subukan muli.';status.className='status bad';b.disabled=false;b.textContent='🎙 SUBUKANG MULI'}}finally{stop();busy=false}}async function listen(item){if(busy)return;busy=true;const token=++requestId,b=document.getElementById('oral');try{b.disabled=true;b.textContent='Nilo-load…';const form=new FormData();form.append('text',item.word);form.append('target_text',item.word);form.append('language','Filipino');form.append('prescribed_activity_key',d.activity_key);const r=await fetch('/api/reading/read-aloud/',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),j=await r.json();if(token!==requestId)return;if(!r.ok||!j.success)throw Error(j.error||'Hindi available ang audio. Subukan muli.');b.textContent='Pinakikinggan…';const bytes=Uint8Array.from(atob(j.audio_content),c=>c.charCodeAt(0)),audio=new Audio(URL.createObjectURL(new Blob([bytes],{type:j.mime_type||'audio/mpeg'})));await audio.play();await new Promise(resolve=>audio.onended=resolve);if(token!==requestId)return;aloudAttempts=Math.min(3,aloudAttempts+1);if(aloudAttempts>=3){oralMode='read';readingAttempts=0;aloudAttempts=0}await save();render('Handa ka na bang magbasa?', '')}catch(e){if(token===requestId){b.disabled=false;b.textContent='🔊 SUBUKANG MULI';document.getElementById('status').textContent=e.message;document.getElementById('status').className='status bad'}}finally{busy=false}}async function submit(value){if(busy)return;const answer=norm(value);if(!answer)return;busy=true;try{writtenAttempts++;const r=await save({candidate_answer:answer});if(r?.accepted){answers.push(answer);index=answers.length;phase='oral';oralMode='read';readingAttempts=aloudAttempts=writtenAttempts=0;await save();if(index===items.length){busy=false;finish();return}app.innerHTML=header()+`<p class="status good">Magaling! Tama ang pantig.</p><button class="button" id="next" type="button">SUSUNOD</button>`;document.getElementById('next').onclick=()=>render();return}render('Subukan muli.','bad')}catch(e){render(e.message,'bad')}finally{busy=false}}async function finish(){if(busy)return;busy=true;app.innerHTML=header()+'<p class="hint">Itinatala ang iyong natapos na gawain…</p>';try{await request(d.completion_url,{answers});app.innerHTML=`<div class="done"><div class="star">⭐</div><h1>Magaling!</h1><p class="instruction">Natapos mo ang Lesson ${esc(d.lesson_number)}: Gawain ${esc(d.gawain_number)}.</p><a class="button" href="{% url 'assessment' %}">Balik sa Aking Aralin</a></div>`}catch(e){app.innerHTML=header()+`<p class="status bad">${esc(e.message)}</p><button class="button" id="retry" type="button">SUBUKANG MULI</button>`;document.getElementById('retry').onclick=()=>{busy=false;finish()}}finally{busy=false}}addEventListener('pagehide',stop);render()})();</script></body></html>
