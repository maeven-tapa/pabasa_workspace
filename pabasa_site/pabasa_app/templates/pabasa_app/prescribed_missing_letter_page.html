<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missing Letter | PABASA</title>
<style>:root{--ink:#16465d;--blue:#197b99;--muted:#5b7680;--line:#d6e7e8;--good:#2b9b63;--bad:#c85555;--gold:#efbd4d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3faf8;color:var(--ink);font-family:Nunito,"Segoe UI",sans-serif}.page{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0}.back{color:var(--ink);font-weight:900;text-decoration:none}.card{margin-top:20px;border:1px solid var(--line);border-radius:28px;background:#fff;padding:clamp(24px,4vw,54px);box-shadow:0 18px 45px #24545d18}.eyebrow{color:#42768a;font-size:.86rem;font-weight:900;letter-spacing:.14em}.title{font-size:clamp(2.4rem,5vw,4rem);margin:.3rem 0}.instruction{color:var(--muted);font-size:1.15rem;font-weight:800}.work{max-width:920px;margin:30px auto 0}.progress{color:var(--muted);font-weight:900;text-align:right}.item{display:grid;grid-template-columns:60px minmax(180px,300px) minmax(210px,1fr);align-items:center;justify-content:center;gap:clamp(18px,4vw,54px);min-height:300px;padding:20px}.number{font-size:1.6rem;font-weight:900}.picture{height:clamp(190px,34vh,340px);width:100%;object-fit:contain}.answer{display:flex;align-items:center;gap:8px;font-size:clamp(2rem,5vw,4rem);font-weight:900}.missing{width:1.2em;height:1.2em;border:0;border-bottom:3px solid #577781;border-radius:8px 8px 0 0;background:#f4faf9;color:var(--ink);font:inherit;text-align:center;text-transform:lowercase}.missing:focus{outline:3px solid #f2d079}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px auto}.button{border:0;border-radius:13px;background:var(--blue);box-shadow:0 4px 0 #126078;color:#fff;padding:14px 24px;font:inherit;font-weight:900;cursor:pointer}.button.secondary{background:#edf7f6;color:var(--ink);box-shadow:0 4px 0 #c5dbdc}.button:disabled{opacity:.6;cursor:wait}.status{min-height:32px;color:var(--muted);font-size:1.08rem;font-weight:800;text-align:center}.status.good{color:var(--good)}.status.bad{color:var(--bad)}.done{padding:50px;text-align:center;color:var(--good);font-size:1.5rem;font-weight:900}@media(max-width:680px){.item{grid-template-columns:36px minmax(100px,38vw) 1fr;gap:12px;min-height:230px;padding:8px}.picture{height:210px}.answer{font-size:clamp(1.8rem,8vw,3rem)}.number{font-size:1.2rem}}</style></head><body><main class="page"><a class="back" href="{% url 'assessment' %}">← Back to My Lessons</a><section class="card" id="app"></section></main>{{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
<script>(()=>{const d=JSON.parse(document.getElementById('prescribed-activity-data').textContent||'{}'),app=document.getElementById('app'),csrf=()=>((document.cookie.match(/(?:^|; )csrftoken=([^;]+)/)||[])[1]||'');let s={current_item:0,phase:'reading',reading_attempts:0,help_visible:false,completed_items:0,...(d.progress?.state||{})},busy=false,feedback='';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function save(body){const r=await fetch(d.progress_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(body)}),x=await r.json();if(!r.ok||!x.success)throw Error(x.error||'Could not save progress');s=x.progress.state;return x}function speak(word){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function render(){if(s.phase==='complete'){app.innerHTML=`<div class="done">Great work! You completed all ${d.items.length} missing-letter words.</div>`;fetch(d.completion_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:'{}'});return}const item=d.items[s.current_item];if(!item){s.phase='complete';render();return}app.innerHTML=`<div class="eyebrow">SESSION ${d.session_number} · LESSON ${d.lesson_number} · ACTIVITY ${d.gawain_number}</div><h1 class="title">${esc(d.title)}</h1><p class="instruction">${esc(d.instruction)}</p><div class="work"><div class="progress">Item ${s.current_item+1} of ${d.items.length}</div><div class="item"><div class="number">${s.current_item+1}.</div><img class="picture" src="${esc(item.image_url)}" alt="Picture clue for a ${esc(item.word)}"><div><div class="answer"><input class="missing" aria-label="Missing first letter" maxlength="1" autocomplete="off" ${s.phase!=='letter'?'disabled':''}>${esc(item.stem.slice(1))}</div></div></div><p class="status ${feedback==='Correct!'?'good':feedback.includes('incorrect')||feedback.includes('Try again')?'bad':''}" id="status">${esc(feedback||(s.phase==='reading'?`Say the word shown in the picture: ${item.word}.`:'Correct! Now write the missing first letter.'))}</p><div class="actions">${s.phase==='reading'?`<button class="button" id="read">${busy?'Listening…':'Say the word'}</button><button class="button secondary" id="help">🔊 Hear the word</button>`:'<button class="button" id="submit">Check letter</button>'}</div></div>`;document.getElementById('read')?.addEventListener('click',()=>record(item.word));document.getElementById('help')?.addEventListener('click',()=>speak(item.word));document.getElementById('submit')?.addEventListener('click',()=>answer(item));document.querySelector('.missing')?.addEventListener('keydown',e=>{if(e.key==='Enter')answer(item)});document.querySelector('.missing')?.focus()}
async function record(word){if(busy)return;const b=document.getElementById('read'),status=document.getElementById('status');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='A microphone is not available in this browser.';return}busy=true;b.disabled=true;b.textContent='Listening…';let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const rec=new MediaRecorder(stream),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(resolve=>rec.onstop=()=>resolve(new Blob(chunks,{type:rec.mimeType||'audio/webm'})));rec.start();setTimeout(()=>rec.state==='recording'&&rec.stop(),3000);const audio=await done;stream.getTracks().forEach(t=>t.stop());const form=new FormData();form.append('audio',audio,'word-reading.webm');form.append('target_text',word);form.append('language','English');form.append('mode','reading');const response=await fetch('{% url "reading_transcribe_api" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:form}),result=await response.json(),normalize=x=>String(x||'').toLowerCase().replace(/[^a-z]/g,'');const correct=!!(result.success&&normalize(result.transcript).includes(normalize(word)));await save({action:'oral_read',item_index:s.current_item,success:correct});feedback=correct?'Correct! Now write the missing first letter.':`That is not quite right. Try saying the word again. (${s.reading_attempts||0}/3)`;render()}catch(e){status.textContent='I could not hear you. Try again.'}finally{stream?.getTracks().forEach(t=>t.stop());busy=false}}
async function answer(item){if(busy||s.phase!=='letter')return;const input=document.querySelector('.missing'),letter=String(input?.value||'').trim().toLowerCase();if(!letter){document.getElementById('status').textContent='Type the missing letter, then check your answer.';input?.focus();return}busy=true;try{const x=await save({action:'letter_answer',letter});if(x.accepted){feedback='Correct!';render();if(s.phase!=='complete')setTimeout(()=>{feedback='';render()},650)}else{feedback='That letter is incorrect. Try again.';render();const next=document.querySelector('.missing');next?.focus();next?.select()}}catch(e){document.getElementById('status').textContent=e.message}finally{busy=false}}render()})();</script></body></html>
