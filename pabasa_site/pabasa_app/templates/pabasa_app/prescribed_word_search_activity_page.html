{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Word Search | PABASA</title>
  <style>
    @font-face{font-family:Lesson26Fredoka;src:url("{% static 'pabasa_app/images/lesson_26/lesson26-fredoka.ttf' %}") format('truetype');font-display:swap}
    :root{--ink:#183e63;--blue:#197b99;--muted:#55768b;--line:#94d9d6;--gold:#efb947;--good:#24889a;--bad:#b33b43;--teal:#299e9a;--teal-dark:#187b7a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#49b8e0 url("{% static 'pabasa_app/images/lesson_26/lesson26-ui-background.jpg' %}") center/cover fixed no-repeat;color:var(--ink);font-family:Lesson26Fredoka,Nunito,"Segoe UI",sans-serif}
    .page{width:min(1250px,calc(100% - 36px));min-height:100vh;margin:auto;padding:16px 0 36px;display:flex;flex-direction:column}
    .back{align-self:flex-start;display:flex;align-items:center;justify-content:center;gap:12px;width:280px;min-height:64px;padding:10px 22px;border-radius:999px;background:#fff;color:var(--ink);font-size:1.15rem;line-height:1.1;text-align:center;text-decoration:none;box-shadow:0 8px 17px #145ca744;transition:.16s}.back:hover{transform:translateY(-2px);box-shadow:0 10px 22px #145ca755}.back:focus-visible,.button:focus-visible{outline:4px solid #f5d47c;outline-offset:4px}
    .lesson26-stage{position:relative;flex:1;min-height:700px;margin:clamp(38px,10vh,100px) 0 0;padding:clamp(38px,5vw,64px) clamp(22px,5vw,72px) 34px;border:2px solid #ffffffaa;border-radius:42px;background:#ffffff63;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 18px 45px #1e5b7a35;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:filter .2s,opacity .2s}.lesson26-stage.is-waiting{filter:blur(2px);opacity:.58;pointer-events:none}
    .eyebrow{width:max-content;max-width:100%;margin:0 auto 18px;padding:11px 28px;border-radius:999px;background:#277f82;color:#fff;font-size:clamp(.82rem,1.25vw,1rem);font-weight:900;letter-spacing:.06em;box-shadow:0 7px 16px #277f8244}.title{margin:0;font-size:clamp(2.6rem,5vw,4.5rem);line-height:1.08;font-weight:900}.instruction{max-width:850px;margin:18px auto 0;color:var(--muted);font-size:clamp(1rem,1.5vw,1.25rem);line-height:1.45}
    .layout{width:min(100%,1040px);display:grid;grid-template-columns:minmax(260px,.8fr) minmax(390px,1.2fr);gap:clamp(26px,5vw,68px);align-items:center;margin:clamp(22px,3.5vh,42px) auto 0}.word-panel{text-align:center}.label{color:#527585;font-size:clamp(.82rem,1.15vw,1rem);font-weight:900;letter-spacing:.08em;text-transform:uppercase}.word{margin:16px 0;font-size:clamp(5rem,10vw,8.5rem);font-weight:900;line-height:1.05}.status{min-height:2.5em;margin:16px auto;color:var(--muted);font-size:clamp(.95rem,1.4vw,1.15rem);font-weight:700}.status.bad{color:var(--bad)}.status.good{color:#287b4c}.actions{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-width:min(310px,42vw);min-height:76px;border:0;border-radius:999px;background:var(--teal);box-shadow:0 7px 0 var(--teal-dark),0 12px 24px #187b7a40;color:#fff;padding:16px 24px;font:inherit;font-size:clamp(1rem,1.8vw,1.45rem);font-weight:900;cursor:pointer;transition:.16s}.button.secondary{background:#fffffff0;color:var(--teal-dark);border:4px solid var(--line);box-shadow:0 6px 0 #b7d6dc,0 10px 20px #187b7a20}.button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}.button:disabled{opacity:.65;cursor:wait}.lesson26-progress{display:flex;justify-content:center;gap:12px;margin:clamp(22px,3vh,34px) auto 0}.lesson26-step{display:grid;place-items:center;width:42px;height:42px;border:3px solid #e2e8e8;border-radius:50%;background:#ffffffe8;color:#55727e;font-weight:900}.lesson26-step.active{border-color:var(--gold);background:#f4c866;color:#6c511e;box-shadow:0 0 0 4px #ffffffaa}.lesson26-step.done{border-color:#53ae83;background:#53ae83;color:white}
    .grid-wrap{position:relative;width:min(100%,560px);margin:auto;padding:14px;border:3px solid #587278;border-radius:24px;background:#8ba2a5;box-shadow:0 10px 24px #16465d20}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.cell{aspect-ratio:1;border:0;border-radius:11px;background:#d5e2e2;color:#173f50;font-size:clamp(1.55rem,3.2vw,2.8rem);font-weight:900;cursor:pointer;transition:background .12s,transform .12s}.cell:hover:not(:disabled){background:#f4d26d;transform:scale(1.03)}.cell:disabled{background:#89999a;color:#536d72;cursor:not-allowed}.cell.selected{background:var(--gold);color:#fff}.cell.found{background:var(--good);color:#fff}
    .lesson26-complete-message{width:min(100%,980px);min-height:520px;display:grid;align-content:center;margin:auto;color:#287b4c;font-size:clamp(1.5rem,3vw,2.2rem);font-weight:900}
    .lesson26-start-backdrop{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:#e7f7f7c9;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}.lesson26-start-backdrop[hidden]{display:none}.lesson26-start-modal{width:min(500px,calc(100vw - 36px));padding:36px 34px 34px;border:2px solid #ffffffd9;border-radius:30px;background:#fffffff3;box-shadow:0 22px 60px #173f6325;text-align:center}.lesson26-start-label{margin:0 0 18px;color:#277f82;font-size:1rem;font-weight:900;letter-spacing:.08em}.lesson26-start-title{margin:0 0 14px;color:#183e63;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;line-height:1.16}.lesson26-start-description{margin:0 0 26px;color:var(--muted);font-size:1.02rem;line-height:1.4}.lesson26-start-actions{display:grid;gap:14px}.lesson26-start-actions button{width:100%;min-height:64px;padding:14px 20px;border:0;border-radius:999px;font:inherit;font-size:1.15rem;font-weight:900;cursor:pointer;transition:transform .16s,filter .16s,box-shadow .16s}.lesson26-start-actions button:hover{transform:translateY(-2px);filter:brightness(1.04)}.lesson26-start-actions button:active{transform:translateY(2px)}.lesson26-start-actions button:focus-visible{outline:4px solid #f5d47c;outline-offset:4px}.lesson26-start-button{background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--teal-dark),0 8px 18px #187b7a26}.lesson26-later-button{border:3px solid #94d9d6!important;background:#fff;color:var(--teal-dark);box-shadow:0 4px 0 #b7d6dc}
    @media(max-width:800px){.page{width:min(100% - 24px,680px);padding-top:12px}.lesson26-stage{min-height:0;margin-top:28px;padding:34px 18px 26px;border-radius:30px}.layout{grid-template-columns:1fr;gap:18px}.grid-wrap{width:min(100%,480px)}.word{font-size:clamp(4.5rem,18vw,7rem)}.lesson26-complete-message{min-height:60vh}.button{min-width:min(270px,44vw)}}
    @media(max-width:480px){.back{width:245px;min-height:58px;font-size:1rem}.lesson26-start-modal{padding:30px 22px 26px}.lesson26-start-title{margin-bottom:12px}.lesson26-start-description{margin-bottom:22px}.lesson26-stage{padding:28px 12px 20px}.eyebrow{padding:9px 15px}.layout{margin-top:18px}.grid-wrap{padding:9px}.cell{border-radius:8px}.actions{gap:12px}.button{width:100%;min-width:0;min-height:62px}.lesson26-progress{gap:7px}.lesson26-step{width:34px;height:34px;font-size:.9rem}}
  </style>
  <style>
    .back:focus-visible,.button:focus-visible,.lesson26-start-actions button:focus-visible{outline:3px solid #94d9d6;outline-offset:3px}
  </style>
</head>
<body>
  <main class="page"><a class="back" id="lesson26-back" href="{% url 'assessment' %}"><span aria-hidden="true">←</span><span>Back to My Lessons</span></a><section class="lesson26-stage is-waiting" id="lesson26-stage"><div id="app" aria-live="polite"></div></section></main>
  <div class="lesson26-start-backdrop" id="lesson26-start" role="dialog" aria-modal="true" aria-labelledby="lesson26-start-title"><div class="lesson26-start-modal"><p class="lesson26-start-label">SESSION 10 · LESSON 26 · ACTIVITY 1</p><h2 class="lesson26-start-title" id="lesson26-start-title">WORD SEARCH</h2><p class="lesson26-start-description">Find the words on the grid.</p><div class="lesson26-start-actions"><button class="lesson26-start-button" id="lesson26-start-button" type="button">START</button><button class="lesson26-later-button" id="lesson26-later-button" type="button">NOT NOW</button></div></div></div>
  {{ prescribed_activity_data|json_script:"prescribed-activity-data" }}
  <script src="{% static 'pabasa_app/js/prescribed_word_search.js' %}" defer></script>
  <script>(()=>{const modal=document.getElementById('lesson26-start'),stage=document.getElementById('lesson26-stage'),start=document.getElementById('lesson26-start-button');start.addEventListener('click',()=>{modal.hidden=true;stage.classList.remove('is-waiting')});start.focus()})();</script>
</body>
</html>
